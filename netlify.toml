[build]
  command = "bash -lc \"export SKIP_GEOCODE=1 && python -m pip install --upgrade pip && if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi && python scripts/build_all.py\""
  publish = "docs"

[functions]
  directory = "netlify/functions"

[context.production.environment]
  SKIP_GEOCODE = "1"

[build.environment]
  SKIP_GEOCODE = "1"
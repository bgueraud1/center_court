<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player profile - Center Court</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{ --gap:12px; --muted:#666; --border:#e6e6e6; --card:#fff; --glass:#fafafa; --accent:#1366d6; }
    body { font-family: Arial, Helvetica, sans-serif; margin:18px; color:#222; background:#f6f7fb; }
    #loading { font-size:16px; color:#333; }
    #player-root { display:none; max-width:1100px; margin:0 auto; }

    /* header */
    .player-header { display:flex; gap:var(--gap); align-items:flex-start; margin-bottom:14px; }
    .player-meta { flex:1; min-width:0; }
    h1#player-name { margin:0; font-size:26px; }
    .sub { color:var(--muted); margin-top:6px; font-size:14px; }
    .attr-row { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .attr { background:var(--glass); padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; min-width:140px; }

    /* image */
    .player-image { width:150px; flex-shrink:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; }
    .player-image img { width:100%; height:auto; object-fit:cover; display:block; }

    /* tabs */
    .tabs { display:flex; gap:8px; margin:12px 0; }
    .tab-btn { padding:8px 12px; border:1px solid var(--border); background:#fff; cursor:pointer; border-radius:8px; }
    .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

    .panel { display:none; border:1px solid var(--border); padding:12px; border-radius:8px; background:#fff; }
    .panel.active { display:block; }

    /* tournaments */
    .tourney { border-radius:10px; padding:12px; margin-bottom:12px; border:1px solid #eee; background:#fff; box-shadow:0 4px 10px rgba(20,20,40,0.03); }
    .tourney-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .tourney-title { font-weight:700; font-size:15px; }
    .tourney-cat { font-size:13px; color:#fff; padding:4px 10px; border-radius:999px; margin-left:8px; font-weight:700; }

    .match-line { display:flex; gap:12px; align-items:center; padding:8px 6px; border-radius:8px; }
    .match-line.win { color: #0b7a33; background: linear-gradient(90deg, rgba(11,122,51,0.03), transparent); }
    .match-line.loss { color: #b71c1c; background: linear-gradient(90deg, rgba(183,28,28,0.03), transparent); }
    .match-opponent { flex:1; }
    .match-score { min-width:120px; text-align:left; font-family: monospace; font-weight:700; }
    .match-date { min-width:120px; text-align:left; color:var(--muted); }
    .match-round { min-width:80px; text-align:left; color:var(--muted); font-size:13px; }

    /* surfaces */
    .surf-hard { border-left:6px solid #2b63c6; }
    .surf-clay { border-left:6px solid #d2483b; }
    .surf-grass { border-left:6px solid #2ea24e; }
    .surf-other { border-left:6px solid #999; }

    /* selectors */
    .year-selector { margin-bottom:12px; display:flex; gap:8px; align-items:center; }
    .select-year { padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:#fff; }

    .no-data { color:var(--muted); padding:12px; }

    a.player-link { color:inherit; text-decoration:underline; font-weight:700; }

    /* trophy / best fancy */
    .trophy-card { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px; border-radius:12px; background: linear-gradient(180deg,#fff,#fbfcff); border:1px solid #eef3ff; box-shadow:0 6px 18px rgba(10,30,80,0.04); }
    .trophy-left { display:flex; gap:12px; align-items:center; }
    .trophy-badge { font-size:22px; }
    .points-pill { background:linear-gradient(90deg,var(--accent),#103f8a); color:#fff; padding:6px 10px; border-radius:999px; font-weight:800; min-width:64px; text-align:center; }

    .best-item { display:flex; justify-content:space-between; align-items:center; padding:10px; border-radius:10px; border:1px solid #f0f0f0; background:#fff; }
    .round-badge { padding:4px 8px; border-radius:8px; background:#f1f5ff; font-weight:700; color:var(--accent); }

    .subtabs { display:flex; gap:8px; margin-bottom:12px; }
    .subtab-btn { padding:6px 10px; border:1px solid var(--border); background:#fff; cursor:pointer; border-radius:8px; font-size:13px; }
    .subtab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

    .map-wrap { display:flex; gap:12px; flex-wrap:wrap; }
    .map-card { flex:1 1 480px; min-width:280px; border:1px solid var(--border); border-radius:8px; padding:8px; background:#fff; height:420px; }

    /* detailed stats table */
    .stats-table { width:100%; border-collapse:collapse; margin-top:8px; }
    .stats-table th, .stats-table td { border:1px solid var(--border); padding:8px; text-align:left; font-size:13px; vertical-align:middle; }
    .stats-table th { background:#fafafa; font-weight:700; }
    .stats-summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .stat-card { background:#fff; border:1px solid var(--border); padding:10px; border-radius:8px; min-width:140px; box-shadow:0 6px 18px rgba(10,30,80,0.02); }

    .bucket-table { width:100%; border-collapse:collapse; margin-top:8px; }
    .bucket-table th, .bucket-table td { border:1px solid var(--border); padding:8px; text-align:left; font-size:13px; }
    .muted-small { color:var(--muted); font-size:13px; }

    /* scenarios UI */
    .scenarios-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; align-items:start; }
    .scenario-card { border:1px solid var(--border); padding:12px; border-radius:8px; background:#fff; }
    .scenario-card h4 { margin:0 0 8px 0; font-size:16px; }
    .scenario-table { width:100%; border-collapse:collapse; margin-top:8px; }
    .scenario-table th, .scenario-table td { border:1px solid var(--border); padding:8px; text-align:left; font-size:13px; }
    .sample-list { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
    .sample-item { border:1px dashed #eee; padding:8px; border-radius:6px; background:#fafafa; font-size:13px; }

    /* ---------------- Time Series UI ---------------- */
    .ts-controls { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .ts-controls .ts-left { display:flex; gap:8px; align-items:center; }
    .ts-controls .ts-surfaces { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .ts-surface { display:flex; gap:6px; align-items:center; font-size:13px; }
    .ts-surface .swatch { width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,0.08); box-shadow:0 1px 0 rgba(0,0,0,0.03); }
    #ts-chart { min-height:360px; width:100%; }
    .ts-controls .muted-small { color:var(--muted); font-size:13px; }
    .ts-legend-note { font-size:13px; color:var(--muted); margin-left:8px; }


    @media (max-width:760px){
      .player-header { flex-direction:column; }
      .player-image { width:100%; max-width:260px; }
      .map-card { min-width:100%; height:360px; }
      .scenarios-grid { grid-template-columns: 1fr; }
    }



    <style>
/* Advanced statistics styling */
.adv-grid { display:flex; gap:18px; align-items:flex-start; }
.adv-left, .adv-right { background: #fff; border:1px solid #e6e6e6; border-radius:8px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,0.04); flex:1; }
.adv-left { max-width:460px; min-width:320px; }
.adv-h { font-size:15px; font-weight:700; margin-bottom:8px; color:#222; }
.adv-sub { font-size:13px; color:#666; margin-bottom:10px; }
.adv-table { width:100%; border-collapse:collapse; }
.adv-table th, .adv-table td { padding:8px 6px; border-bottom:1px solid #f1f1f1; text-align:left; font-size:13px; }
.adv-table th { font-weight:700; font-size:13px; color:#333; }
.adv-badge { font-size:12px; padding:4px 6px; border-radius:6px; background:#f5f5f5; color:#333; display:inline-block; }
.adv-mini-bar { height:10px; background:#eee; border-radius:6px; overflow:hidden; }
.adv-mini-bar > i { display:block; height:100%; background:linear-gradient(90deg,#3b82f6,#60a5fa); }
.adv-stat-row { display:flex; align-items:center; gap:8px; }
.adv-left-chart, .adv-right-chart { height:180px; width:100%; }
.adv-empty { color:#666; font-size:13px; padding:8px; }

/* Responsive */
@media (max-width:920px) {
  .adv-grid { flex-direction:column; }
  .adv-left { max-width:none; }
}
</style>
  </style>
  <!-- Plotly for maps (CDN) -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <div id="loading">Loading…</div>

  <div id="player-root" aria-live="polite">
    <div class="player-header">
      <div class="player-meta">
        <h1 id="player-name">Player Name</h1>
        <div class="sub" id="player-country">Country</div>
        <div class="attr-row" id="player-attrs"></div>
      </div>
      <div class="player-image" id="player-image"></div>
    </div>

    <div class="tabs" role="tablist" aria-label="Player tabs">
      <button class="tab-btn active" data-target="panel-matches" role="tab" aria-selected="true">Matches by year</button>
      <button class="tab-btn" data-target="panel-trophies" role="tab" aria-selected="false">Tournaments & best results</button>
      <button class="tab-btn" data-target="panel-stats" role="tab" aria-selected="false">Statistics</button>
      <button class="tab-btn" data-target="panel-advanced" role="tab" aria-selected="false">Advanced statistics</button>
    </div>

    <div id="panel-matches" class="panel active" role="tabpanel">
      <div class="year-selector">
        <label class="muted">Select year:</label>
        <select id="year-select" class="select-year"></select>
      </div>
      <div id="matches-container"></div>
    </div>

    <div id="panel-trophies" class="panel" role="tabpanel">
      <h3>Titles won</h3>
      <div id="trophies-list"></div>

      <h3 style="margin-top:14px;">Best performances (year)</h3>
      <div style="margin-bottom:8px;">
        <label class="muted">Year:</label>
        <select id="best-year-select" class="select-year"></select>
      </div>
      <div id="best-list"></div>
    </div>

    <div id="panel-stats" class="panel" role="tabpanel">
      <!-- subtabs for stats -->
      <div class="subtabs" id="stats-subtabs"></div>
      <div id="stats-subpanels">
        <!-- DETAILED panel contains the filters and the container; it's empty until loaded -->
        <div id="panel-detailed" style="display:none; padding:8px;">
          <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;">
            <div>
              <label class="muted">Year:</label>
              <select id="stats-year-filter" class="select-year"><option value="ALL">All</option></select>
            </div>
            <div>
              <label class="muted">Surface:</label>
              <select id="stats-surface-filter" class="select-year"><option value="ALL">All</option></select>
            </div>
            <div style="margin-left:auto;" id="detailed-stats-summary"></div>
          </div>
          <div id="detailed-stats-container"></div>
        </div>

        <div id="panel-advanced" class="panel" role="tabpanel" style="display:none; padding:12px;">
  <div id="advanced-loading" class="sub">Loading…</div>
  <div id="advanced-content" style="display:none;"></div>
</div>

        <div id="panel-scenarios" style="display:none; padding:8px;"></div>
        <div id="panel-timeseries" style="display:none; padding:8px;"></div>
        <div id="panel-maps" style="display:none; padding:8px;">
          <div class="map-wrap">
            <div id="map-opponents" class="map-card"></div>
            <div id="map-hosts" class="map-card"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>

  /* ------------------ Advanced statistics (new) ------------------ */

/**
 * Build candidates for advanced JSON discovery.
 * filenames observed: "21805_D_Gavrilova.json" -> pattern: <id>_<name>.json
 * We'll try several variants to be robust.
 */
/* Replace existing buildAdvancedCandidatesFor(player) with this improved version */
/* Replace existing buildAdvancedCandidatesForVerbose(player) with this improved verbose version */
function buildAdvancedCandidatesForVerbose(player){
  console.log('buildAdvancedCandidatesForVerbose: player =', player);
  const pid = player && (player.player_id || player.id || player.pid) ? String(player.player_id || player.id || player.pid) : '';
  const slugVal = player && (player.slug || player.name_slug) ? String(player.slug || player.name_slug) : '';
  const nameRaw = player && (player.name || player.fullname) ? String(player.name || player.fullname).trim() : '';

  const parts = nameRaw ? nameRaw.split(/\s+/) : [];
  const first = parts.length ? parts[0].replace(/[^A-Za-z0-9]/g,'') : '';
  const last = parts.length > 1 ? parts[parts.length-1].replace(/[^A-Za-z0-9]/g,'') : '';
  const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  const candidates = [];

  if(pid && first && last){
    candidates.push(`general_advanced_stats/${pid}_${first}_${last}.json`);
    candidates.push(`general_advanced_stats/${pid}_${capitalize(first)}_${capitalize(last)}.json`);
    candidates.push(`general_advanced_stats/${pid}_${first.toLowerCase()}_${last.toLowerCase()}.json`);
    candidates.push(`/general_advanced_stats/${pid}_${first}_${last}.json`);
  }

  if(pid && slugVal){
    candidates.push(`general_advanced_stats/${pid}_${slugVal}.json`);
    candidates.push(`general_advanced_stats/${pid}_${slugVal.toLowerCase()}.json`);
    candidates.push(`/general_advanced_stats/${pid}_${slugVal}.json`);
  }

  if(pid && nameRaw){
    const initial = first ? first.charAt(0) : '';
    candidates.push(`general_advanced_stats/${pid}_${nameRaw.replace(/\s+/g,'_')}.json`);
    if(initial) candidates.push(`general_advanced_stats/${pid}_${initial}_${last}.json`);
    candidates.push(`general_advanced_stats/${pid}.json`);
    candidates.push(`/general_advanced_stats/${pid}.json`);
  }

  if(slugVal){
    candidates.push(`general_advanced_stats/${slugVal}.json`);
    candidates.push(`general_advanced_stats/${slugVal.toLowerCase()}.json`);
    candidates.push(`/players_atp/${slugVal}.advanced.json`);
    candidates.push(`/players_atp/data/${slugVal}.advanced.json`);
  }

  if(first && last){
    candidates.push(`general_advanced_stats/${first}_${last}.json`);
    candidates.push(`general_advanced_stats/${capitalize(first)}_${capitalize(last)}.json`);
  }

  if(nameRaw){
    candidates.push(`general_advanced_stats/${nameRaw.replace(/\s+/g,'_')}.json`);
  }

  if(pid){
    candidates.push(`/general_advanced_stats/${pid}_${nameRaw.replace(/[^A-Za-z0-9_]/g,'_')}.json`);
  }

  // dedupe and log
  const seen = new Set();
  const uniq = candidates.filter(c => {
    if(!c) return false;
    if(seen.has(c)) return false;
    seen.add(c);
    return true;
  });

  console.log('buildAdvancedCandidatesForVerbose -> candidate list:', uniq);
  return uniq;
}

/* ---------- renderAdvancedStatsFrom (polished renderer) ---------- */
/* Replaces previous renderer. Injects a two-column layout:
   - left: rally buckets (table + bar chart)
   - right: stroke stats (table + mini bars)
*/
function renderAdvancedStatsFrom(data, sourceUrl, targetDiv){
  try{
    if(!targetDiv) return;
    const container = targetDiv.querySelector('#advanced-content') || targetDiv;

    // HELPERS (fallback implementations if project doesn't provide them)
    function escapeHtml(s){
      if(s === null || s === undefined) return '';
      return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; });
    }
    function smartNumberString(v){
      if(v === null || v === undefined || isNaN(Number(v))) return '—';
      const n = Number(v);
      if(Math.abs(n) >= 1000) return Math.round(n).toLocaleString();
      if(Math.abs(n) >= 10) return Math.round(n*10)/10; // one decimal if needed
      return (Math.round(n*100)/100).toString();
    }
    function smartPercentFromFraction(f){
      if(f === null || f === undefined || isNaN(Number(f))) return '—';
      const n = Number(f);
      // heuristics: if n > 1 likely a percent already
      if(Math.abs(n) > 1) return (Math.round(n*10)/10) + '%';
      return (Math.round(n*1000)/10) + '%'; // one decimal
    }

    /* robust getter: tries many possible keys used across your JSON variants */
    function getBucketVal(obj, prefix, suffixCandidates){
      // prefix e.g. 'pct_short', suffixCandidates e.g. ['cg','fd','fp']
      const res = {};
      suffixCandidates.forEach(suf => {
        const keys = [
          `${prefix}_${suf}`,           // pct_short_cg
          `${prefix}${suf.charAt(0).toUpperCase()+suf.slice(1)}`, // shortCg
          `${prefix}_${suf.toUpperCase()}`, // pct_short_CG
          `${prefix}${suf}`              // shortcg
        ];
        let found = null;
        for(const k of keys){
          // check numeric.mean path
          if(obj && obj.numeric && obj.numeric[k] && obj.numeric[k].mean !== undefined){
            found = obj.numeric[k].mean; break;
          }
          // check obj[k] directly
          if(obj && obj[k] !== undefined){
            found = obj[k]; break;
          }
        }
        res[suf] = found;
      });
      return res;
    }

    // Extract small / rally stats
    const small = data.small_stats || data.rally_stats || data.short_stats || null;
    const big = data.big_stats || data.stroke_stats || data.strokeStats || null;

    // Build HTML header
    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <div style="font-weight:800;font-size:16px">Advanced statistics</div>
                  <div style="font-size:12px;color:#666">Source: ${escapeHtml(sourceUrl || 'inline')}</div>
                </div>`;

    // Grid container
    html += `<div class="adv-grid">`;

    /* ---------- LEFT: Rally buckets ---------- */
    html += `<div class="adv-left"><div class="adv-h">Rally buckets (by point length)</div>
             <div class="adv-sub">Buckets: Short (1–4 shots), Medium (5–8), Long (9+). Values shown as means or shares.</div>`;

    if(small && small.numeric){
      const num = small.numeric;

      // Try to get counts & pct shares
      const shortCount = (num.short_count && num.short_count.mean !== undefined) ? num.short_count.mean : (num.shortCount && num.shortCount.mean !== undefined ? num.shortCount.mean : null);
      const midCount   = (num.medium_count && num.medium_count.mean !== undefined) ? num.medium_count.mean : (num.mediumCount && num.mediumCount.mean !== undefined ? num.mediumCount.mean : null);
      const longCount  = (num.long_count && num.long_count.mean !== undefined) ? num.long_count.mean : (num.longCount && num.longCount.mean !== undefined ? num.longCount.mean : null);

      // share percentages (several naming possibilities)
      const pctShort = (num.pct_short && num.pct_short.mean !== undefined) ? num.pct_short.mean : (num.pctShort && num.pctShort.mean !== undefined ? num.pctShort.mean : null);
      const pctMed   = (num.pct_medium && num.pct_medium.mean !== undefined) ? num.pct_medium.mean : (num.pctMedium && num.pctMedium.mean !== undefined ? num.pctMedium.mean : null);
      const pctLong  = (num.pct_long && num.pct_long.mean !== undefined) ? num.pct_long.mean : (num.pctLong && num.pctLong.mean !== undefined ? num.pctLong.mean : null);

      // winners / unforced / forced: look for many keys
      const shortVals = getBucketVal(small, 'pct_short', ['cg','fd','fp']);
      const medVals   = getBucketVal(small, 'pct_medium', ['cg','fd','fp']);
      const longVals  = getBucketVal(small, 'pct_long', ['cg','fd','fp']);

      // Build table
      html += `<table class="adv-table"><thead><tr><th>Bucket</th><th>Mean count</th><th>Share</th><th>Winners</th><th>Unforced errors</th><th>Forced errors</th></tr></thead><tbody>`;
      html += `<tr><td style="font-weight:700">Short<br/><span style="font-weight:600;color:#666">1–4 shots</span></td>
                <td>${escapeHtml(smartNumberString(shortCount))}</td>
                <td>${escapeHtml(smartPercentFromFraction(pctShort>1?pctShort/100:pctShort))}</td>
                <td>${escapeHtml(smartPercentFromFraction(shortVals.cg>1?shortVals.cg/100:shortVals.cg))}</td>
                <td>${escapeHtml(smartPercentFromFraction(shortVals.fd>1?shortVals.fd/100:shortVals.fd))}</td>
                <td>${escapeHtml(smartPercentFromFraction(shortVals.fp>1?shortVals.fp/100:shortVals.fp))}</td>
              </tr>`;

      html += `<tr><td style="font-weight:700">Medium<br/><span style="font-weight:600;color:#666">5–8 shots</span></td>
                <td>${escapeHtml(smartNumberString(midCount))}</td>
                <td>${escapeHtml(smartPercentFromFraction(pctMed>1?pctMed/100:pctMed))}</td>
                <td>${escapeHtml(smartPercentFromFraction(medVals.cg>1?medVals.cg/100:medVals.cg))}</td>
                <td>${escapeHtml(smartPercentFromFraction(medVals.fd>1?medVals.fd/100:medVals.fd))}</td>
                <td>${escapeHtml(smartPercentFromFraction(medVals.fp>1?medVals.fp/100:medVals.fp))}</td>
              </tr>`;

      html += `<tr><td style="font-weight:700">Long<br/><span style="font-weight:600;color:#666">9+ shots</span></td>
                <td>${escapeHtml(smartNumberString(longCount))}</td>
                <td>${escapeHtml(smartPercentFromFraction(pctLong>1?pctLong/100:pctLong))}</td>
                <td>${escapeHtml(smartPercentFromFraction(longVals.cg>1?longVals.cg/100:longVals.cg))}</td>
                <td>${escapeHtml(smartPercentFromFraction(longVals.fd>1?longVals.fd/100:longVals.fd))}</td>
                <td>${escapeHtml(smartPercentFromFraction(longVals.fp>1?longVals.fp/100:longVals.fp))}</td>
              </tr>`;

      html += `</tbody></table>`;

      // prepare chart data arrays for winners/fd/fp (as numbers normalized to fraction 0..1)
      function norm(v){ if(v === null || v === undefined || isNaN(Number(v))) return null; const n = Number(v); return (Math.abs(n) > 1 ? n/100 : n); }
      const cats = ['Short','Medium','Long'];
      const winners = [ norm(shortVals.cg), norm(medVals.cg), norm(longVals.cg) ];
      const unf = [ norm(shortVals.fd), norm(medVals.fd), norm(longVals.fd) ];
      const forced = [ norm(shortVals.fp), norm(medVals.fp), norm(longVals.fp) ];

      html += `<div style="margin-top:10px"><div class="adv-left-chart" id="adv-buckets-chart"></div></div>`;

      // pass chart data to DOM after injection
      container.innerHTML = html + `</div>`; // close adv-left, continue adv-right to be appended below

      // ---------- RIGHT: Stroke stats ----------
      let rightHtml = `<div class="adv-right"><div class="adv-h">Stroke statistics (aggregates)</div>

(async function registerAdvancedHandler(){
  // we patch the existing loadStatsSubpanel by wrapping original and adding support
  const original = window.loadStatsSubpanel || null;
  if(!original){
    // if loadStatsSubpanel is not global, assume we can directly add case in the file near its definition.
    // Otherwise nothing to do here.
    return;
  }
  // No overwrite here; prefer to extend by calling original and then custom handling if not handled.
  window.loadStatsSubpanel = async function(kind, playerData){
    // if original already handles it (it will set statsLoadState[kind]) call it
    if(kind !== 'advanced'){
      return original(kind, playerData);
    }
    // Clean: emulate same patterns as original loadStatsSubpanel
    if(window.statsLoadState && window.statsLoadState[kind]) return;
    if(!window.statsLoadState) window.statsLoadState = {};
    window.statsLoadState[kind] = true;

    const pid = playerData.player_id;
    const slugVal = playerData.slug || (window.slug || '');

/* ---------------- common helpers ---------------- */
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function dateWithoutYear(isoDate){
  if(!isoDate) return '';
  try{
    const d = new Date(isoDate);
    if(isNaN(d)) {
      const m = isoDate.match(/^\d{4}-(\d{2}-\d{2})/);
      if(m) {
        const parts = m[1].split('-');
        const mock = new Date(`${new Date().getFullYear()}-${parts[0]}-${parts[1]}`);
        try{ return new Intl.DateTimeFormat('en', { day: '2-digit', month: 'long' }).format(mock); }catch(e){ return `${parts[1]}-${parts[0]}`; }
      }
      return isoDate;
    }
    return new Intl.DateTimeFormat('en', { day: '2-digit', month: 'long' }).format(d);
  }catch(e){ return isoDate; }
}
function fetchJsonSafe(url){
  try{
    return fetch(url).then(async r => {
      if(!r.ok) return null;
      const txt = await r.text();
      // Remplacer les tokens NaN non-entre-guillemets par null (heuristique)
      const clean = txt.replace(/\bNaN\b/g, 'null');
      try { return JSON.parse(clean); } catch(e) { return null; }
    }).catch(()=>null);
  } catch(e) {
    console.warn('fetch failed', url, e);
    return Promise.resolve(null);
  }
}

  function tryCandidatesSequential(candidates){
  return new Promise((resolve) => {
    (function attempt(i){
      if(i >= candidates.length){ return resolve(null); }
      const url = candidates[i];
      console.debug('tryCandidatesSequential: trying', url);
      fetchJsonSafe(url).then(d => {
        if(d) return resolve({data:d, url:url});
        attempt(i+1);
      }).catch(()=> attempt(i+1));
    })(0);
  });

  function smartTrimNumber(n){
    if(n === null || n === undefined) return null;
    const num = Number(n);
    if(isNaN(num)) return null;
    if(Math.abs(num - Math.round(num)) < 1e-9) return Math.round(num);
    return parseFloat((Math.round(num * 100) / 100).toFixed(2));
  }
  function smartPercentFromFraction(frac){
    if(frac === null || frac === undefined) return '—';
    const f = Number(frac);
    if(isNaN(f)) return '—';
    const pct = f * 100;
    if(Math.abs(pct - Math.round(pct)) < 1e-9) return `${Math.round(pct)}%`;
    const s = (Math.round(pct * 100) / 100).toFixed(2).replace(/\.?0+$/,'');
    return `${s}%`;
  }
  function smartNumberString(v){
    if(v === null || v === undefined) return '—';
    const n = Number(v);
    if(isNaN(n)) return '—';
    if(Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
    return (Math.round(n * 100) / 100).toFixed(2).replace(/\.?0+$/,'');
  }
  function smartHoursString(h){
    if(h === null || h === undefined) return '—';
    const n = Number(h);
    if(isNaN(n)) return '—';
    if(Math.abs(n - Math.round(n)) < 1e-9) return `${Math.round(n)} h`;
    return `${(Math.round(n * 100) / 100).toFixed(2).replace(/\.?0+$/,'')} h`;
  }
  function daysOrHoursForTotalHours(h){
    if(h === null || h === undefined) return '—';
    const n = Number(h);
    if(isNaN(n)) return '—';
    const days = n / 24;
    if(days >= 1){
      if(Math.abs(days - Math.round(days)) < 1e-9) return `${Math.round(days)} d`;
      return `${(Math.round(days * 100) / 100).toFixed(2).replace(/\.?0+$/,'')} d`;
    } else {
      return smartHoursString(n);
    }
  }

  // ---------- Natural cubic spline interpolation (passes through points) ----------
  // Implementation adapted to JS numeric arrays (natural boundary conditions)
  function naturalCubicSpline(xs, ys){
    // xs: strictly increasing, ys: numeric, length n >= 1
    const n = xs.length;
    if(n === 1){
      return {
        eval: function(xq){ return Array.isArray(xq) ? xq.map(()=>ys[0]) : ys[0]; }
      };
    }
    const h = new Array(n-1);
    for(let i=0;i<n-1;i++) h[i] = xs[i+1]-xs[i];
    // solve tridiagonal for c
    const alpha = new Array(n).fill(0);
    for(let i=1;i<n-1;i++){
      alpha[i] = (3/h[i])*(ys[i+1]-ys[i]) - (3/h[i-1])*(ys[i]-ys[i-1]);
    }
    const l = new Array(n).fill(0), mu = new Array(n).fill(0), z = new Array(n).fill(0);
    l[0] = 1; mu[0]=0; z[0]=0;
    for(let i=1;i<n-1;i++){
      l[i] = 2*(xs[i+1]-xs[i-1]) - h[i-1]*mu[i-1];
      mu[i] = h[i]/l[i];
      z[i] = (alpha[i] - h[i-1]*z[i-1]) / l[i];
    }
    l[n-1] = 1; z[n-1]=0;

      d[j] = (c[j+1]-c[j]) / (3*h[j]);
    }
    const a = ys.slice(0, n-1);
    // eval function
    function evalOne(xq){
      // clamp to [xs[0], xs[n-1]]
      if(xq <= xs[0]) return ys[0];
      if(xq >= xs[n-1]) return ys[n-1];
      // find interval i where xs[i] <= xq <= xs[i+1]
      let i = 0; // binary search
      let lo = 0, hi = n-2;
      while(lo<=hi){
        const mid = Math.floor((lo+hi)/2);
        if(xs[mid] <= xq && xq <= xs[mid+1]) { i = mid; break; }
        if(xq < xs[mid]) hi = mid-1; else lo = mid+1;
      }
      const dx = xq - xs[i];
      return a[i] + b[i]*dx + c[i]*dx*dx + d[i]*dx*dx*dx;
    }
    return {
      eval: function(xq){
        if(Array.isArray(xq)) return xq.map(xx => evalOne(xx));
        return evalOne(xq);
      }
    };

  // Build smoothed sampling (100 points between min and max year), ensuring the spline passes through original points
  function buildSmoothedFromPoints(points){
    const known = points.filter(p => p.value !== null && p.value !== undefined && !Number.isNaN(Number(p.value)));

    if(known.length === 1) return [{x: known[0].year, y: known[0].value}];
    const xs = known.map(p => Number(p.year));

    // ensure xs strictly increasing
    for(let i=1;i<xs.length;i++){ if(xs[i] <= xs[i-1]) xs[i] = xs[i-1] + 1e-6; }
    const spline = naturalCubicSpline(xs, ys);
    const xMin = xs[0], xMax = xs[xs.length-1];
    const samples = 100;
    const out = [];
    for(let k=0;k<samples;k++){
      const xv = xMin + (xMax - xMin) * (k/(samples-1));
      const yv = spline.eval(xv);
      out.push({ x: Number((Math.round(xv*10000)/10000).toFixed(4)), y: Number((Math.round(yv*10000)/10000).toFixed(4)) });
    }

      if(!res || !res.data){
        targetDiv.innerHTML = '<div class="sub">Maps data not found locally — attempting client-side discovery...</div>';
        if(window.MapsClient && typeof window.MapsClient.initMaps === 'function'){
          window.MapsClient.initMaps({ slug: slugVal });
        } else {
          targetDiv.innerHTML = '<div class="no-data">Maps renderer not available.</div>';
        }
        return;
      }
      const mapData = res.data;
      const opp = mapData.map_opponent_stats || mapData.opponent_countries || {};
      const host = mapData.map_host_stats || mapData.host_countries || {};
      if(window.MapsClient && typeof window.MapsClient.renderOpponentMap === 'function' && typeof window.MapsClient.renderHostMap === 'function'){
        if(Object.keys(opp).length === 0 && Object.keys(host).length === 0){
          targetDiv.innerHTML = '<div class="no-data">Maps JSON is present but contains no data.</div>';
          return;
        }
        window.MapsClient.renderOpponentMap(opp);
        window.MapsClient.renderHostMap(host);
        targetDiv.innerHTML = '';
      } else {
        targetDiv.innerHTML = `<div class="sub">Maps JSON loaded from ${escapeHtml(res.url)} — rendering...</div>`;
        if(window.MapsClient && typeof window.MapsClient.initMaps === 'function'){
          window.MapsClient.initMaps({ slug: slugVal });
        }
      }
      return;
    }
  }

  // end main IIFE
})();

/* ------------------ maps-client (Plotly) ------------------ */
/* (kept intact) */
(function(){
  const RETRY_INTERVAL = 180; // ms
  const MAX_RETRIES = 20; // ~3.6s total

  function waitForPlotly(maxRetries = MAX_RETRIES){
    return new Promise((resolve) => {
      let tries = 0;
      (function check(){
        if(window.Plotly && typeof window.Plotly.react === 'function') return resolve(true);
        tries++;
        if(tries >= maxRetries) return resolve(false);
        setTimeout(check, RETRY_INTERVAL);
      })();
    });
  }

  function waitForElement(id, maxRetries = MAX_RETRIES){
    return new Promise((resolve) => {
      let tries = 0;
      (function poll(){
        const el = document.getElementById(id);
        if(el) return resolve(el);
        tries++;
        if(tries >= maxRetries) return resolve(null);
        setTimeout(poll, RETRY_INTERVAL);
      })();
    });
  }

  function ensureMapContainers(){
    let panelMaps = document.getElementById('panel-maps');
    if(!panelMaps){
      console.warn('maps-client: panel-maps not found — cannot reliably create containers');
      return {op:null, host:null};
    }
    let op = document.getElementById('map-opponents');
    let host = document.getElementById('map-hosts');
    if(!op){
      op = document.createElement('div');
      op.id = 'map-opponents';
      op.className = 'map-card';
      op.style.minHeight = '320px';
      panelMaps.querySelector('.map-wrap') ? panelMaps.querySelector('.map-wrap').prepend(op) : panelMaps.appendChild(op);
    }
    if(!host){
      host = document.createElement('div');
      host.id = 'map-hosts';
      host.className = 'map-card';
      host.style.minHeight = '320px';
      panelMaps.querySelector('.map-wrap') ? panelMaps.querySelector('.map-wrap').appendChild(host) : panelMaps.appendChild(host);
    }
    return {op, host};
  }

  function buildHoverText(item, kind){
    let pct = (typeof item.win_rate === 'number' && !isNaN(item.win_rate)) ? (item.win_rate*100) : (typeof item.win_rate === 'string' ? parseFloat(item.win_rate)*100 : null);
    if(pct !== null && isNaN(pct)) pct = null;
    let t = `${escapeHtml(item.iso || '')}<br>Wins: ${item.wins||0}<br>Losses: ${item.losses||0}<br>Matches: ${item.matches||0}<br>Win rate: ${pct !== null ? pct.toFixed(2)+'%' : '—'}`;
    if(kind === 'opponent'){
      if(item.top_opponent && item.top_opponent.name){
        const to = item.top_opponent;
        t += `<br>Top opponent: ${escapeHtml(to.name)} ${to.wins||0}/${to.matches||0}`;
      }
    } else if(kind === 'host'){
      if(item.top_tourney && item.top_tourney.tourney_name){
        const tt = item.top_tourney;
        t += `<br>Top tournament: ${escapeHtml(tt.tourney_name)} ${tt.wins||0}/${tt.matches||0}`;
      }
    }
    return t;
  }

  function toNumericZ(o){
    if(!o) return null;
    if(typeof o.win_rate === 'number' && !isNaN(o.win_rate)) return o.win_rate * 100;
    if(typeof o.win_rate === 'string' && o.win_rate.trim() !== ''){
      const v = parseFloat(o.win_rate);
      if(!isNaN(v)) return v * 100;
    }
    const wins = Number(o.wins || 0);
    const matches = Number(o.matches || ((o.wins||0) + (o.losses||0)));
    if(matches && !isNaN(matches) && matches > 0) return (wins / matches) * 100;
    return null;
  }

  function renderChoroplethSafe(targetId, mapObj, opts){
    opts = opts || {};
    return waitForElement(targetId, MAX_RETRIES).then((div)=> {
      if(!div){
        const created = ensureMapContainers();
        div = document.getElementById(targetId);
        if(!div){
          console.warn('renderChoropleth: target still not found', targetId);
          return;
        }
      }

      const locs = [], zs = [], texts = [];
      Object.keys(mapObj || {}).forEach(code => {
        const item = mapObj[code] || {};
        const zval = toNumericZ(item);
        if(zval === null || isNaN(zval)) return;
        const iso = (code || '').toString().trim().toUpperCase();
        if(!iso) return;
        locs.push(iso);
        zs.push(Math.round(zval*100)/100);
        const copy = Object.assign({ iso: iso }, item);
        const kind = (targetId === 'map-opponents') ? 'opponent' : 'host';
        texts.push(buildHoverText(copy, kind));
      });

      if(locs.length === 0){
        div.innerHTML = '<div style="padding:12px;color:#666">No map data available.</div>';
        return;
      }

      const colorscales = {
        blue: [[0, 'rgb(255,255,255)'], [1, 'rgb(19,102,214)']],
        red:  [[0, 'rgb(255,255,255)'], [1, 'rgb(180,24,24)']]
      };
      const colorscale = opts.colorscale === 'red' ? colorscales.red : colorscales.blue;

      const trace = {
        type: 'choropleth',
        locations: locs,
        z: zs,
        text: texts,
        locationmode: opts.locationmode || 'ISO-3',
        colorscale: colorscale,
        autocolorscale: false,
        colorbar: { title: 'Win %', ticksuffix: '%' },
        hoverinfo: 'text',
        zmin: 0,
        zmax: 100
      };

      const layout = {
        title: opts.title || '',
        geo: { projection: { type: 'natural earth' }, showframe:false },
        margin: { t: 40, b: 0, l: 0, r: 0 }
      };

      return waitForPlotly().then((ok) => {
        if(!ok){
          div.innerHTML = '<div style="padding:12px;color:#b71c1c">Plotly not loaded.</div>';
          return;
        }
        try {
          Plotly.react(div, [trace], layout, {responsive:true, displayModeBar:false});
          setTimeout(()=>{ try{ if(window.Plotly && window.Plotly.Plots && typeof window.Plotly.Plots.resize === 'function') window.Plotly.Plots.resize(div); }catch(e){console.warn('resize error',e);} }, 220);
        } catch(e){
          console.error('Plotly render failed', e);
          div.innerHTML = '<div style="padding:12px;color:#b71c1c">Map rendering error (see console)</div>';
        }
      });
    });
  }

  function renderOpponentMap(mapObj){
    return renderChoroplethSafe('map-opponents', mapObj, { colorscale: 'blue', title: 'Win rate vs opponent nationality' });
  }

  function renderHostMap(mapObj){
    return renderChoroplethSafe('map-hosts', mapObj, { colorscale: 'red', title: 'Win rate in tournaments by host country' });
  }

  function initMaps(options){
    options = options || {};
    const slugParam = options.slug || (location.pathname.replace(/\/$/, '').split('/').pop() || '');
    if(!slugParam){ console.warn('maps-client: could not detect slug from URL'); return; }
    const candidates = [
      `/players/${slugParam}.maps.json`,
      `/players/${slugParam.toUpperCase()}.maps.json`,
      `/players/${slugParam.toLowerCase()}.maps.json`,
      `/players/${slugParam}-maps.json`
    ];
    (function tryNext(i){
      if(i >= candidates.length){
        const d1 = document.getElementById('map-opponents');
        const d2 = document.getElementById('map-hosts');
        if(d1) d1.innerHTML = '<div style="padding:12px;color:#666">Maps not available for this player.</div>';
        if(d2) d2.innerHTML = '<div style="padding:12px;color:#666">Maps not available for this player.</div>';
        return;
      }
      const url = candidates[i];
      fetch(url).then(r => {
        if(!r.ok) throw r.status;
        return r.json();
      }).then(d => {
        const opp = d.map_opponent_stats || d.opponent_countries || {};
        const host = d.map_host_stats || d.host_countries || {};
        try {
          renderOpponentMap(opp).catch(()=>{});
          renderHostMap(host).catch(()=>{});
        } catch(e){
          console.warn('maps client render error', e);
        }
      }).catch(()=> tryNext(i+1));
    })(0);
  }

  window.MapsClient = {
    initMaps: initMaps,
    renderOpponentMap: renderOpponentMap,
    renderHostMap: renderHostMap
  };
})();
</script>

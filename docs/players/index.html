<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Liste joueurs ATP - Center Court</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 18px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 6px 8px; border: 1px solid #ddd; text-align:left; }
    a { color: #006; text-decoration: none; }
  </style>
</head>
<body>
  <h1>WTA Players</h1>
  <div id="loading">Loading players list…</div>
  <div id="players-root" style="display:none;">
    <table id="players-table">
      <thead><tr><th>Player</th><th>Country</th><th>Matches</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
(async function(){
  const loading = document.getElementById('loading');
  const root = document.getElementById('players-root');
  const tbody = document.querySelector('#players-table tbody');

  try{
    const idx = await fetch('/index/players_wta_index.json').then(r=>r.json());
    const players = idx.players || [];
    // sort optionally by name
    players.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
    for(const p of players){
      const slug = p.slug || ((p.player_id||'').toLowerCase() + '-' + (p.name||'').toLowerCase().replace(/\s+/g,'-'));
      const tr = document.createElement('tr');
      const link = document.createElement('a');
      link.href = '/players/' + slug;
      link.textContent = p.name || p.player_id;
      const td1 = document.createElement('td'); td1.appendChild(link);
      const td2 = document.createElement('td'); td2.textContent = p.country || '';
      const td3 = document.createElement('td'); td3.textContent = p.matches_count || '';
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      tbody.appendChild(tr);
    }
    loading.style.display = 'none';
    root.style.display = 'block';
  }catch(e){
    loading.textContent = 'Error while loading players.';
    console.error(e);
  }
})();
</script>
</body>
</html>

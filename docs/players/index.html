<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>WTA Players - Center Court</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg: #0f0b12;
      --muted: #6b6b7a;
      --accent: #7b3fbf;
      --accent-2: #9b59b6;
    }
    *{box-sizing:border-box}
    body{
      margin:18px;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0b0710 0%, #140c1a 100%);
      color: #f7f7fb;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{
      max-width: 980px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 6px 30px rgba(11,7,16,0.6);
      border: 1px solid rgba(255,255,255,0.03);
    }

    header{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:14px;
    }
    h1{
      font-size:20px;
      margin:0;
      color:#fff;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .logo{
      width:44px;
      height:44px;
      background: linear-gradient(135deg,#8e44ad,#5b2c6f);
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:#fff;
      box-shadow: 0 4px 14px rgba(155,89,182,0.16);
    }

    .centercourt-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:8px;
      background: linear-gradient(90deg,#7b3fbf,#9b59b6);
      color:#fff;
      text-decoration:none;
      font-weight:600;
      font-size:13px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .centercourt-btn small{ font-weight:700; }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .input, select{
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px 10px;
      border-radius:8px;
      color:#fff;
      min-width:180px;
      outline:none;
      transition: box-shadow .15s, transform .05s;
    }
    .input:focus, select:focus{
      box-shadow:0 6px 18px rgba(139, 80, 175, 0.18);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* specific select style for better contrast */
    select#country-filter{
      background: #000;
      color: #fff;
      border-color: rgba(255,255,255,0.06);
    }

    .toolbar{
      display:flex;
      gap:8px;
      align-items:center;
    }

    #players-root{
      margin-top:10px;
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:620px;
      font-size:14px;
    }

    thead th{
      text-align:left;
      padding:12px 12px;
      position:sticky;
      top:0;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color:#f1e9ff;
      font-weight:600;
      font-size:13px;
      letter-spacing:0.2px;
      cursor:pointer;
      user-select:none;
      border-bottom:1px solid rgba(255,255,255,0.04);
    }

    thead th .sort-ind {
      margin-left:8px;
      opacity:0.9;
      font-size:12px;
      color: #dcd1f2;
    }

    tbody td{
      padding:10px 12px;
      border-bottom: 0;
      vertical-align:middle;
      white-space:nowrap;
    }

    .player-cell{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .flag{
      width:22px;
      height:16px;
      display:inline-block;
      border-radius:2px;
      object-fit:cover;
      flex-shrink:0;
      border: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.6);
    }

    /* IMPORTANT: make the main text black for readability on light purples */
    .row-text, .row-meta { color: #0b0b0b; font-weight:600; }
    .row-meta { font-weight:500; font-size:13px; color: #111; }

    /* clickable row */
    tr.clickable{ cursor:pointer; }
    tr.clickable:focus { outline: 3px solid rgba(123,63,191,0.18); }

    /* small responsive tweak */
    @media (max-width:680px){
      thead th:nth-child(3), tbody td:nth-child(3){ display:none; } /* hide matches on small */
      .controls{ width:100%; justify-content:space-between; }
    }

    /* Loading / error */
    #loading{
      color: var(--muted);
      padding:18px;
      font-style:italic;
    }

    footer{
      margin-top:12px;
      color: var(--muted);
      font-size:13px;
      text-align:right;
    }
  </style>
</head>
<body>
  <div class="container" aria-live="polite">
    <header>
      <div style="display:flex;align-items:center;gap:12px;">
        <a class="centercourt-btn" href="https://www.center-court.net/" target="_blank" rel="noopener noreferrer" title="Center Court — ouvrir">
          <span style="display:inline-block;width:28px;height:28px;border-radius:6px;background:#fff;color:#7b3fbf;display:flex;align-items:center;justify-content:center;font-weight:800;">CC</span>
          <small>Center Court</small>
        </a>
        <h1>WTA Players</h1>
      </div>

      <div class="controls">
        <div class="toolbar" role="search" aria-label="Recherche et filtre">
          <input id="search-input" class="input" type="search" placeholder="Search player by name…" aria-label="Search by name">
          <select id="country-filter" class="input" aria-label="Filter by country">
            <option value="">All countries</option>
          </select>
        </div>
      </div>
    </header>

    <div id="loading">Loading players list...</div>

    <div id="players-root" style="display:none;">
      <table id="players-table" role="table" aria-describedby="table-desc">
        <caption id="table-desc" style="display:none">WTA players table</caption>
        <thead>
          <tr>
            <th data-key="name" scope="col" title="Sort by name">Players <span class="sort-ind" id="sort-name"></span></th>
            <th data-key="country" scope="col" title="Sort by country">Country <span class="sort-ind" id="sort-country"></span></th>
            <th data-key="matches_count" scope="col" title="Sort by matches">Matches <span class="sort-ind" id="sort-matches"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <footer>Center Court</footer>
  </div>

<script>
(async function(){
  const loading = document.getElementById('loading');
  const root = document.getElementById('players-root');
  const tbody = document.querySelector('#players-table tbody');
  const searchInput = document.getElementById('search-input');
  const countryFilter = document.getElementById('country-filter');
  const headers = document.querySelectorAll('thead th');

  // palette of light-to-mid violets (enough items so consecutive are different)
  const PURPLES = [
    '#f3e8ff', '#ead9ff', '#dfc7ff', '#d2b3ff', '#c79fff',
    '#be8cff', '#b27aff', '#a06cff', '#8f5bf0', '#7b4bdc',
    '#6b3ca9', '#5a2f7f', '#4a1f5a'
  ];

  function shuffle(a){
    const arr = a.slice();
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }
  const rowShades = shuffle(PURPLES);

  // Extended IOC -> ISO2 map (add entries as needed)
  const IOC_TO_ISO2 = {
  'AFG':'af','ALB':'al','ALG':'dz','AND':'ad','ANG':'ao','ANT':'ag',
  'ARG':'ar','ARM':'am','ARU':'aw','AUS':'au','AUT':'at','AZE':'az',
  'BAH':'bs','BAN':'bd','BAR':'bb','BDI':'bi','BEL':'be','BEN':'bj',
  'BER':'bm','BHU':'bt','BIH':'ba','BIZ':'bz','BLR':'by','BOL':'bo',
  'BOT':'bw','BRA':'br','BRN':'bh','BRU':'bn','BUL':'bg','BUR':'bf',
  'CAF':'cf','CAM':'kh','CAN':'ca','CAY':'ky','CGO':'cg','CHA':'td',
  'CHI':'cl','CHN':'cn','CIV':'ci','CMR':'cm','COD':'cd','COK':'ck',
  'COL':'co','COM':'km','CPV':'cv','CRC':'cr','CRO':'hr','CUB':'cu',
  'CYP':'cy','CZE':'cz','DEN':'dk','DJI':'dj','DMA':'dm','DOM':'do',
  'ECU':'ec','EGY':'eg','ERI':'er','ESA':'sv','ESP':'es','EST':'ee',
  'ETH':'et','FIJ':'fj','FIN':'fi','FRA':'fr','FSM':'fm','GAB':'ga',
  'GAM':'gm','GBR':'gb','GBS':'gw','GEO':'ge','GEQ':'gq','GER':'de',
  'GHA':'gh','GRE':'gr','GRN':'gd','GUA':'gt','GUI':'gn','GUM':'gu',
  'GUY':'gy','HAI':'ht','HKG':'hk','HON':'hn','HUN':'hu','INA':'id',
  'IND':'in','IRI':'ir','IRL':'ie','IRQ':'iq','ISL':'is','ISR':'il',
  'ISV':'vi','ITA':'it','IVB':'vg','JAM':'jm','JOR':'jo','JPN':'jp',
  'KAZ':'kz','KEN':'ke','KGZ':'kg','KIR':'ki','KOR':'kr','KOS':'xk',
  'KSA':'sa','KUW':'kw','LAO':'la','LAT':'lv','LBA':'ly','LBR':'lr',
  'LCA':'lc','LES':'ls','LIB':'lb','LIE':'li','LTU':'lt','LUX':'lu',
  'MAD':'mg','MAR':'ma','MAS':'my','MAW':'mw','MDA':'md','MDV':'mv',
  'MEX':'mx','MGL':'mn','MHL':'mh','MKD':'mk','MLI':'ml','MLT':'mt',
  'MNE':'me','MON':'mc','MOZ':'mz','MRI':'mu','MTN':'mr','MYA':'mm',
  'NAM':'na','NCA':'ni','NED':'nl','NEP':'np','NGR':'ng','NIG':'ne',
  'NOR':'no','NRU':'nr','NZL':'nz','OMA':'om','PAK':'pk','PAN':'pa',
  'PAR':'py','PER':'pe','PHI':'ph','PLE':'ps','PLW':'pw','PNG':'pg',
  'POL':'pl','POR':'pt','PRK':'kp','PUR':'pr','QAT':'qa','ROU':'ro',
  'RSA':'za','RUS':'ru','RWA':'rw','SAM':'ws','SEN':'sn','SEY':'sc',
  'SGP':'sg','SKN':'kn','SLE':'sl','SLO':'si','SMR':'sm','SOL':'sb',
  'SOM':'so','SRB':'rs','SRI':'lk','SSD':'ss','STP':'st','SUD':'sd',
  'SUI':'ch','SUR':'sr','SVK':'sk','SWE':'se','SWZ':'sz','SYR':'sy',
  'TAN':'tz','TGA':'to','THA':'th','TJK':'tj','TKM':'tm','TLS':'tl',
  'TOG':'tg','TPE':'tw','TTO':'tt','TUN':'tn','TUR':'tr','TUV':'tv',
  'UAE':'ae','UGA':'ug','UKR':'ua','URU':'uy','USA':'us','UZB':'uz',
  'VAN':'vu','VEN':'ve','VIE':'vn','VIN':'vc','YEM':'ye','ZAM':'zm',
  'ZIM':'zw'
};


  let players = [];
  let filtered = [];
  let currentSort = { key: 'name', dir: 'asc' };

  // Given IOC code, return an svg url (flagcdn expects alpha2 lowercase)
  function flagUrlFromIOC(ioc){
    if(!ioc) return '';
    const up = (ioc||'').toUpperCase();
    const iso2 = (IOC_TO_ISO2[up] || up.slice(0,2).toLowerCase());
    // flagcdn svg endpoint (lowercase)
    return `https://flagcdn.com/${iso2}.svg`;
  }

  function renderRows(){
    tbody.innerHTML = '';
    const arr = filtered.slice();
    arr.sort((a,b)=>{
      const key = currentSort.key;
      const dir = currentSort.dir === 'asc' ? 1 : -1;
      const va = a[key] ?? '';
      const vb = b[key] ?? '';
      if(key === 'matches_count'){
        return dir * ((Number(va)||0) - (Number(vb)||0));
      }
      return dir * String(va).localeCompare(String(vb), undefined, {numeric:true, sensitivity:'base'});
    });

    for(let i=0;i<arr.length;i++){
      const p = arr[i];
      const tr = document.createElement('tr');
      tr.className = 'clickable';
      tr.tabIndex = 0;
      tr.setAttribute('role','button');

      // ensure consecutive rows never have same shade: use i % len mapping
      const shade = rowShades[i % rowShades.length];
      tr.style.backgroundColor = shade;
      tr.style.borderRadius = '6px';
      tr.style.margin = '6px 0';
      tr.style.display = 'table-row';

      // destination URL (respect p.page_href if present)
      const slug = p.slug || ((p.player_id||'').toLowerCase() + '-' + (p.name||'').toLowerCase().replace(/\s+/g,'-'));
      const dest = p.page_href ? ('/' + p.page_href.replace(/^\//,'')) : ('/players/' + slug);

      tr.addEventListener('click', ()=> window.location.href = dest);
      tr.addEventListener('keydown', (ev)=> { if(ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); window.location.href = dest; } });

      // td1: flag + name (plain text, not link)
      const td1 = document.createElement('td');
      const playerWrap = document.createElement('div');
      playerWrap.className = 'player-cell';

      const flagImg = document.createElement('img');
      flagImg.className = 'flag';
      const flagUrl = flagUrlFromIOC(p.country);
      if(flagUrl){
        flagImg.src = flagUrl;
      } else {
        flagImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="16"></svg>';
      }
      flagImg.alt = p.country || '';
      flagImg.onerror = function(){ this.style.display='none'; };

      const nameSpan = document.createElement('span');
      nameSpan.className = 'row-text';
      nameSpan.textContent = p.name || p.player_id;

      playerWrap.appendChild(flagImg);
      playerWrap.appendChild(nameSpan);
      td1.appendChild(playerWrap);

      // td2: country
      const td2 = document.createElement('td');
      td2.className = 'row-meta';
      td2.textContent = p.country || '';

      // td3: matches_count
      const td3 = document.createElement('td');
      td3.className = 'row-meta';
      td3.textContent = p.matches_count ?? '';

      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      tbody.appendChild(tr);
    }
  }

  function applyFilters(){
    const q = (searchInput.value || '').trim().toLowerCase();
    const country = (countryFilter.value || '').trim().toUpperCase();
    filtered = players.filter(p=>{
      const matchesQ = q === '' || (p.name && p.name.toLowerCase().includes(q)) || (p.player_id && p.player_id.includes(q));
      const matchesCountry = country === '' || (p.country && p.country.toUpperCase() === country);
      return matchesQ && matchesCountry;
    });
    renderRows();
  }

  function populateCountryFilter(list){
    const set = new Set();
    for(const p of list) if(p.country) set.add(p.country.toUpperCase());
    const arr = Array.from(set).sort((a,b)=>a.localeCompare(b));
    for(const c of arr){
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countryFilter.appendChild(opt);
    }
  }

  headers.forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(!key) return;
      if(currentSort.key === key){
        currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.key = key;
        currentSort.dir = 'asc';
      }
      updateSortIndicators();
      renderRows();
    });
  });

  function updateSortIndicators(){
    document.getElementById('sort-name').textContent = currentSort.key === 'name' ? (currentSort.dir==='asc'?'▲':'▼') : '';
    document.getElementById('sort-country').textContent = currentSort.key === 'country' ? (currentSort.dir==='asc'?'▲':'▼') : '';
    document.getElementById('sort-matches').textContent = currentSort.key === 'matches_count' ? (currentSort.dir==='asc'?'▲':'▼') : '';
  }

  function debounce(fn, wait=160){
    let t;
    return function(...args){
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(this,args), wait);
    };
  }

  searchInput.addEventListener('input', debounce(()=>applyFilters(), 140));
  countryFilter.addEventListener('change', ()=>applyFilters());

  try{
    const idx = await fetch('/index/players_wta_index.json').then(r=>r.json());
    players = idx.players || [];
    players.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
    populateCountryFilter(players);
    filtered = players.slice();
    loading.style.display = 'none';
    root.style.display = 'block';
    updateSortIndicators();
    renderRows();
  }catch(e){
    loading.textContent = 'Error loading players list.';
    console.error(e);
  }

})();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Calendar — Center Court</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000000;
      --card:#08101a;
      --muted:#9aa6bf;
      --accent-blue:#2b6cb0;
      --accent-purple:#9b59b6;
      --row-blue: linear-gradient(90deg, rgba(43,108,176,0.12), rgba(255,255,255,0.01));
      --row-purple: linear-gradient(90deg, rgba(155,89,182,0.12), rgba(255,255,255,0.01));
    }
    html,body{height:100%;margin:0;padding:0;background:linear-gradient(180deg,#000,#060406);color:#e9f2ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    .wrap{max-width:1100px;margin:28px auto;padding:0 18px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .brand{font-weight:800;letter-spacing:0.2px}
    h1{margin:0;font-size:20px}
    .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700}
    .btn.active{color:#fff;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01))}
    .btn-blue{border-color: rgba(43,108,176,0.25)}
    .btn-purple{border-color: rgba(155,89,182,0.25)}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
    .meta{color:var(--muted);font-size:13px;margin-top:6px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:12px;text-align:left;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:14px;vertical-align:middle}
    thead th{color:var(--muted);font-weight:700;cursor:default}
    tbody tr.atp{background: var(--row-blue)}
    tbody tr.wta{background: var(--row-purple)}
    .surface-badge { padding:.35rem .6rem; border-radius:.35rem; color:#fff; font-weight:700; font-size:.82rem; text-transform:capitalize; display:inline-block; min-width:54px; text-align:center }
    .surface-hard { background:var(--accent-blue); } /* blue */
    .surface-clay { background:#c53030; } /* red */
    .surface-grass { background:#2f855a; } /* green */
    .surface-carpet { background:#6b46c1; } /* purple */
    .source-atp { color:var(--accent-blue); font-weight:700; }
    .source-wta { color:var(--accent-purple); font-weight:700; }
    .small{font-size:13px;color:var(--muted)}
    .city{color:var(--muted);font-size:13px}
    .year-select{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#fff;padding:6px 8px;border-radius:8px}
    .controls-line{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
    @media (max-width:880px){ th,td{padding:10px;font-size:13px} .surface-badge{font-size:0.75rem;padding:.25rem .5rem} }
    a.row-link { color: inherit; text-decoration: none; display:block; border-radius:8px; padding:6px }
    a.row-link:hover { filter:brightness(1.03); text-decoration:none; }
    .card-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    .date-col{min-width:156px; max-width:180px}
    .grow{flex:1}
    .loading{color:var(--muted);padding:18px 0;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">Center Court</div>
        <h1>Tournament Calendar</h1>
        <div class="meta">Data from local JSONs (ATP / WTA)</div>
      </div>

      <div class="controls">
        <label for="yearSelect" class="small" style="margin-right:8px;color:var(--muted)">Year</label>
        <select id="yearSelect" class="year-select"></select>
      </div>
    </header>

    <div class="card" id="cardMain">
      <div class="card-head">
        <div class="controls-line">
          <button id="btnAll" class="btn active">All</button>
          <button id="btnATP" class="btn btn-blue">ATP</button>
          <button id="btnWTA" class="btn btn-purple">WTA</button>
        </div>
        <div class="grow" style="text-align:right">
          <div class="small" id="summaryText">Loading…</div>
        </div>
      </div>

      <div id="listContainer">
        <div class="loading">Loading tournaments…</div>
      </div>
    </div>

    <footer style="margin-top:18px;color:var(--muted);font-size:13px">
      <div>Center Court — stylish calendar • links point to tournament pages</div>
    </footer>
  </div>

<script>
/* ---------- Configuration ----------
   IMPORTANT: we request the JSON files directly at the root of the deploy.
   Examples the script will try: "/atp_tournaments_2026.json" and "atp_tournaments_2026.json".
*/
const MIN_YEAR = 2018;
const MAX_YEAR = (new Date()).getFullYear() + 1; // try next year too

// basenames (no path prefix). We try plural first; singular is a tolerant fallback.
const ATP_BASENAMES = ['atp_tournaments_', 'atp_tournament_'];
const WTA_BASENAMES = ['wta_tournaments_', 'wta_tournament_'];

/* ---------- utilities ---------- */
const el = id => document.getElementById(id);
const fmtDate = (iso) => {
  if(!iso) return '—';
  try {
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'numeric' });
  } catch(e){ return iso; }
};

function surfaceClass(s){
  if(!s) return 'surface-hard';
  s = String(s).toLowerCase();
  if(s.includes('hard')) return 'surface-hard';
  if(s.includes('clay')) return 'surface-clay';
  if(s.includes('grass')) return 'surface-grass';
  if(s.includes('carpet')) return 'surface-carpet';
  return 'surface-hard';
}

/* ---------- ATP date parsing (same as before) ---------- */
function parseAtpFormattedDate(fd){
  if(!fd || typeof fd !== 'string') return null;
  const s = fd.trim();
  const yearMatches = s.match(/\b(20\d{2})\b/g);
  let lastYear = yearMatches ? Number(yearMatches[yearMatches.length - 1]) : null;

  const rangeMonthMatch = s.match(/^\s*(\d{1,2})\s*[-–—]\s*(\d{1,2})\s*([A-Za-z]+)/i);
  if(rangeMonthMatch){
    const day = Number(rangeMonthMatch[1]);
    const month = rangeMonthMatch[3];
    const year = lastYear || new Date().getFullYear();
    return tryBuildISO(day, month, year);
  }

  const numMonthRegex = /(\d{1,2})\s*([A-Za-z]+)/g;
  let m; const pairs = [];
  while((m = numMonthRegex.exec(s)) !== null){
    pairs.push([m[1], m[2]]);
  }
  if(pairs.length > 0){
    const day = Number(pairs[0][0]);
    const month = pairs[0][1];
    const year = lastYear || new Date().getFullYear();
    return tryBuildISO(day, month, year);
  }

  const monthYear = s.match(/([A-Za-z]+)\s*,\s*(20\d{2})/i);
  if(monthYear){
    return tryBuildISO(1, monthYear[1], Number(monthYear[2]));
  }

  const parsed = Date.parse(s);
  if(!isNaN(parsed)) return (new Date(parsed)).toISOString().slice(0,10);

  return null;

  function tryBuildISO(day, monthName, year){
    try {
      const mon = monthName.trim();
      const candidate = new Date(`${day} ${mon} ${year}`);
      if(!isNaN(candidate)) return candidate.toISOString().slice(0,10);
      const cap = mon.charAt(0).toUpperCase() + mon.slice(1).toLowerCase();
      const cand2 = new Date(`${day} ${cap} ${year}`);
      if(!isNaN(cand2)) return cand2.toISOString().slice(0,10);
    } catch(e){}
    return null;
  }
}

/* ---------- normalize payloads ---------- */
function normalizeAtpTournament(t, yearFromFile){
  const name = t.Name || '—';
  const id = t.Id || (t.TournamentOverviewUrl ? t.TournamentOverviewUrl.split('/').pop() : name);
  const formatted = t.FormattedDate || '';
  const start_iso = parseAtpFormattedDate(formatted) || (yearFromFile ? `${yearFromFile}-01-01` : null);
  let end_iso = null;
  if(formatted){
    const matches = formatted.match(/(\d{1,2}\s+[A-Za-z]+(?:\s*,\s*\d{4})?)/gi);
    if(matches && matches.length > 1){
      const last = matches[matches.length - 1];
      const y = (last.match(/\b(20\d{2})\b/) || [null, yearFromFile])[1] || yearFromFile;
      const parsed = Date.parse(last + (/\b20\d{2}\b/.test(last) ? '' : ' ' + y));
      if(!isNaN(parsed)) end_iso = (new Date(parsed)).toISOString().slice(0,10);
    } else {
      const rangeMatch = formatted.match(/(\d{1,2})\s*[-–]\s*(\d{1,2})\s*([A-Za-z]+),?\s*(20\d{2})?/i);
      if(rangeMatch){
        const endDay = Number(rangeMatch[2]);
        const month = rangeMatch[3];
        const y = Number(rangeMatch[4]) || yearFromFile || (new Date()).getFullYear();
        const dd = Date.parse(`${endDay} ${month} ${y}`);
        if(!isNaN(dd)) end_iso = (new Date(dd)).toISOString().slice(0,10);
      }
    }
  }

  return {
    source: 'atp',
    tourney_id: String(id),
    tourney_name: name,
    start_date: start_iso,
    end_date: end_iso,
    level: t.Type || t.EventType || '',
    surface: t.Surface || '',
    location: t.Location || '',
    year: Number(yearFromFile) || (formatted && (formatted.match(/\b(20\d{2})\b/) ? Number(formatted.match(/\b(20\d{2})\b/)[1]) : null)),
    raw: t
  };
}

function normalizeWtaTournament(c){
  const tg = c.tournamentGroup || c.tournament || {};
  const id = tg.id || (c.title ? c.title.replace(/\s+/g,'_') : '');
  const name = c.title || (tg.name ? tg.name : '—');
  const start = c.startDate || (c.tournament && c.tournament.startDate) || null;
  const end = c.endDate || (c.tournament && c.tournament.endDate) || null;
  return {
    source: 'wta',
    tourney_id: String(id),
    tourney_name: name,
    start_date: start || null,
    end_date: end || null,
    level: c.level || (tg.level || '') || '',
    surface: c.surface || (c.tournament && c.tournament.surface) || '',
    location: (c.city ? (c.city + (c.country ? ', ' + c.country : '')) : (c.country || '')),
    year: Number(c.year) || (start ? Number(start.slice(0,4)) : null),
    raw: c
  };
}

/* ---------- robust fetch: try root and relative filenames ---------- */
async function tryFetchJsonCandidates(urls){
  for(const url of urls){
    try {
      console.log('[trying json] ', url);
      const r = await fetch(url, {cache:'no-cache'});
      if(r.ok){
        try { return await r.json(); } catch(e){ console.warn('JSON parse failed for', url, e); continue; }
      } else {
        console.debug(`fetch ${url} -> ${r.status}`);
      }
    } catch(err){
      console.debug('fetch error', url, err);
    }
  }
  return null;
}

function buildCandidatesForBasenames(basenames, year){
  const urls = [];
  for(const bn of basenames){
    // with leading slash (root) and without (relative)
    urls.push(`/${bn}${year}.json`);
    urls.push(`${bn}${year}.json`);
    // also try lowercase/uppercase extension variant (rarely needed but harmless)
    urls.push(`/${bn}${year}.JSON`);
    urls.push(`${bn}${year}.JSON`);
  }
  return urls;
}

/* fetch both ATP and WTA files for a given year and return list of normalized events */
async function fetchForYear(y){
  const out = [];

  const atpCandidates = buildCandidatesForBasenames(ATP_BASENAMES, y);
  const atpJson = await tryFetchJsonCandidates(atpCandidates);
  if(atpJson && Array.isArray(atpJson.TournamentDates)){
    for(const block of atpJson.TournamentDates){
      if(!Array.isArray(block.Tournaments)) continue;
      for(const t of block.Tournaments) out.push(normalizeAtpTournament(t, y));
    }
  } else {
    // could be empty or not found; that's fine, we continue
  }

  const wtaCandidates = buildCandidatesForBasenames(WTA_BASENAMES, y);
  const wtaJson = await tryFetchJsonCandidates(wtaCandidates);
  if(wtaJson){
    const content = wtaJson.content || wtaJson.tournaments || [];
    if(Array.isArray(content)){
      for(const c of content) out.push(normalizeWtaTournament(c));
    }
  }

  return out;
}

/* ---------- main app (unchanged rendering logic) ---------- */
let ALL_EVENTS = []; // normalized events
let YEARS = []; // available years
let visibleFilter = 'all'; // 'all' | 'atp' | 'wta'

async function loadAllData(){
  el('listContainer').innerHTML = '<div class="loading">Scanning available JSON files…</div>';
  ALL_EVENTS = [];
  YEARS = [];
  const yearPromises = [];
  for(let y = MIN_YEAR; y <= MAX_YEAR; y++){
    yearPromises.push((async ()=> {
      const items = await fetchForYear(y);
      if(items && items.length > 0) return { year: y, items };
      return null;
    })());
  }

  const results = await Promise.all(yearPromises);
  for(const r of results){
    if(r && r.items && r.items.length > 0){
      ALL_EVENTS.push(...r.items);
      YEARS.push(r.year);
    }
  }
  YEARS = Array.from(new Set(YEARS)).sort((a,b)=>b-a);

  if(YEARS.length === 0){
    el('listContainer').innerHTML = '<div class="loading">No tournament JSONs found. Place files like atp_tournaments_2026.json and/or wta_tournaments_2026.json at the root of the deploy (i.e. in docs/ for GitHub Pages).</div>';
    el('summaryText').textContent = 'No data';
    return;
  }

  const defaultYear = YEARS[0];
  const sel = el('yearSelect'); sel.innerHTML = '';
  for(const y of YEARS){ const o = document.createElement('option'); o.value = y; o.textContent = y; sel.appendChild(o); }
  sel.value = defaultYear;
  renderForYear(defaultYear);
  sel.onchange = () => renderForYear(Number(sel.value));
}

function renderForYear(y){
  const container = el('listContainer');
  container.innerHTML = '<div class="loading">Rendering…</div>';
  let entries = ALL_EVENTS.filter(e => Number(e.year) === Number(y));
  entries = entries.map(e => {
    const sd = e.start_date ? new Date(e.start_date) : null;
    const sortKey = sd ? sd.getTime() : (Number.MAX_SAFE_INTEGER - (e.source === 'atp' ? 0 : 1));
    return { ...e, _sortKey: sortKey };
  });

  if(visibleFilter === 'atp') entries = entries.filter(e => e.source === 'atp');
  if(visibleFilter === 'wta') entries = entries.filter(e => e.source === 'wta');

  entries.sort((a,b) => {
    if(a._sortKey === b._sortKey) return (a.tourney_name || '').localeCompare(b.tourney_name || '');
    return a._sortKey - b._sortKey;
  });

  if(entries.length === 0){
    container.innerHTML = '<div class="p-3 text-muted">No tournaments found for this year / filter.</div>';
    el('summaryText').textContent = `${y} — 0 tournaments`;
    return;
  }

  const table = document.createElement('table'); table.setAttribute('aria-live','polite');
  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>
    <th class="date-col">Start • Level</th>
    <th>Tournament</th>
    <th class="small">Surface</th>
    <th class="small">Source</th>
  </tr>`;
  const tbody = document.createElement('tbody');

  for(const e of entries){
    const tr = document.createElement('tr'); tr.classList.add(e.source === 'atp' ? 'atp' : 'wta');
    const href = `/tournament.html?source=${encodeURIComponent(e.source)}&t=${encodeURIComponent(e.tourney_id)}&year=${encodeURIComponent(e.year || y)}`;
    const startDisplay = e.start_date ? fmtDate(e.start_date) : (e.raw && e.raw.FormattedDate ? e.raw.FormattedDate : '—');
    const level = e.level || '—';
    const surf = e.surface || 'Hard';
    const loc = e.location || '';
    const leftHtml = `<div><div style="font-weight:700">${escapeHtml(e.tourney_name)}</div><div class="small text-muted">${escapeHtml(startDisplay)} • ${escapeHtml(level)} ${loc ? ' • ' + escapeHtml(loc) : ''}</div></div>`;
    const rightHtml = `<div style="display:flex;gap:10px;align-items:center;justify-content:flex-end">
      <div class="surface-badge ${surfaceClass(surf)}">${escapeHtml(surf)}</div>
      <div class="small">${e.source === 'atp' ? '<span class="source-atp">ATP</span>' : '<span class="source-wta">WTA</span>'}</div>
    </div>`;
    const a = document.createElement('a'); a.href = href; a.className = 'row-link';
    a.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
      <div style="min-width:220px;max-width:280px">${leftHtml}</div>
      <div style="flex:1;padding-left:12px">${escapeHtml(e.tourney_name)}</div>
      <div style="min-width:180px;text-align:right">${rightHtml}</div>
    </div>`;
    const td = document.createElement('td'); td.colSpan = 4; td.style.padding = '6px'; td.appendChild(a);
    tr.appendChild(td); tbody.appendChild(tr);
  }

  table.appendChild(thead); table.appendChild(tbody);
  container.innerHTML = ''; container.appendChild(table);

  const cnt = entries.length;
  el('summaryText').textContent = `${y} — ${cnt} tournament${cnt>1?'s':''} • Showing: ${visibleFilter.toUpperCase()}`;
  container.setAttribute('tabindex','-1'); container.focus();
}

function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, (m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- filter buttons wiring ---------- */
el('btnAll').addEventListener('click', ()=> {
  visibleFilter = 'all';
  el('btnAll').classList.add('active'); el('btnATP').classList.remove('active'); el('btnWTA').classList.remove('active');
  const y = Number(el('yearSelect').value); renderForYear(y);
});
el('btnATP').addEventListener('click', ()=> {
  visibleFilter = 'atp';
  el('btnAll').classList.remove('active'); el('btnATP').classList.add('active'); el('btnWTA').classList.remove('active');
  const y = Number(el('yearSelect').value); renderForYear(y);
});
el('btnWTA').addEventListener('click', ()=> {
  visibleFilter = 'wta';
  el('btnAll').classList.remove('active'); el('btnATP').classList.remove('active'); el('btnWTA').classList.add('active');
  const y = Number(el('yearSelect').value); renderForYear(y);
});

/* ---------- initial load ---------- */
loadAllData();
</script>
</body>
</html>

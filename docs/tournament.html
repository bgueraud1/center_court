<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bracket skeleton — corrigé</title>
<style>
  :root{
    --winner-h:22px;
    --loser-h:22px;
    --midblock-h:40px;
    --match-gap:48px;
    --col-gap:36px;
    --col-width:220px; /* même largeur pour toutes les colonnes */
    --midblock-width:180px;
    --mid-offset: 0px;
    --line-color:#797979;
    --container-padding:12px;
  }

  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
  .topbar{background:#2b6cb0;color:#fff;padding:12px}
  .container{max-width:1400px;margin:12px auto;padding:var(--container-padding);position:relative}
  #bracket{position:relative; min-height:640px; background:transparent; overflow:visible;}

/* match wrapper qui contient les deux rangs (top + bottom) */
.match-wrapper{ position:absolute; width:var(--col-width); box-sizing:border-box; pointer-events:none; }

/* lignes (placées RELATIVEMENT à l'intérieur du wrapper) */
.match-row{ box-sizing:border-box; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; background:#fff; display:block; width:100%; }
.row-top{ height:var(--winner-h); border-top:1px solid var(--line-color); }
.row-bottom{ height:var(--loser-h); border-bottom:1px solid var(--line-color); }

/* mid-block positionné en absolu dans #bracket (entre colonnes) */
.mid-block{ position:absolute; height:var(--midblock-h); width:var(--midblock-width); z-index:50; background:#fff; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.mid-winner{ height:18px; display:block; width:100%; box-sizing:border-box; padding:0 8px; font-weight:700; font-size:12px; overflow:hidden; text-overflow:ellipsis; }
.mid-bar{ height:1px; background:var(--line-color); width:100%; }
.mid-score{ font-size:12px; padding-top:4px; color:#515151; font-style:italic; overflow:hidden; text-overflow:ellipsis; }

/* svg overlay */
.connectors{ position:absolute; left:0; top:0; width:100%; height:100%; z-index:20; pointer-events:none; }

/* placeholders */
.placeholder-name{ height:14px; width:80%; background:transparent; display:inline-block; }
.placeholder-seed{ width:22px; height:16px; background:transparent; display:inline-block; }
.placeholder-score{ height:12px; width:60%; background:transparent; display:block; margin-top:4px; }

/* responsive */
@media (max-width:900px){
  :root{ --col-width:160px; --midblock-width:140px; --match-gap:36px; }
}
</style>
</head>
<body>
  <div class="topbar">
    <div style="max-width:1400px;margin:0 auto;display:flex;gap:12px;align-items:center;">
      <strong>Bracket skeleton — corrigé</strong>
      <div style="margin-left:auto;font-size:13px;color:#fff;opacity:0.9">Colonnes uniformes + lignes continues</div>
    </div>
  </div>

  <div class="container">
    <div id="bracket"></div>
  </div>

<script>
/* Configuration / lecture CSS vars */
const rootStyle = getComputedStyle(document.documentElement);
const winnerH = Math.max(1, parseInt(rootStyle.getPropertyValue('--winner-h')) || 22);
const loserH  = Math.max(1, parseInt(rootStyle.getPropertyValue('--loser-h')) || 22);
const midH     = Math.max(1, parseInt(rootStyle.getPropertyValue('--midblock-h')) || 40);
const matchGap = Math.max(0, parseInt(rootStyle.getPropertyValue('--match-gap')) || 48);
const colGap   = Math.max(0, parseInt(rootStyle.getPropertyValue('--col-gap')) || 36);
const colWidth = Math.max(40, parseInt(rootStyle.getPropertyValue('--col-width')) || 220); // same for all columns
const midWidth = Math.max(10, parseInt(rootStyle.getPropertyValue('--midblock-width')) || 180);
const midOffset = parseInt(rootStyle.getPropertyValue('--mid-offset')) || 0;

/* draw params */
function getParamSize(){
  const p = new URLSearchParams(location.search).get('size');
  if(p){ const n = parseInt(p,10); if(!isNaN(n) && n>0) return n; }
  return null;
}
function nextPowerOfTwo(n){ return Math.pow(2, Math.ceil(Math.log2(n))); }

let singles_draw_size = getParamSize() || 32;
singles_draw_size = nextPowerOfTwo(singles_draw_size);

const totalPlayers = singles_draw_size;
const rounds = Math.log2(totalPlayers);
const firstRoundMatches = totalPlayers / 2;
function matchesInRound(r){ return Math.max(1, firstRoundMatches / Math.pow(2, r)); }

const perMatchBlock = winnerH + midH + loserH + matchGap;
const maxMatchesInRound = firstRoundMatches;
const containerHeight = Math.max(640, maxMatchesInRound * perMatchBlock + 80);

const bracket = document.getElementById('bracket');
bracket.style.height = containerHeight + 'px';
bracket.innerHTML = '';

/* SVG overlay */
const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(svgNS,'svg');
svg.classList.add('connectors');
svg.setAttribute('width','100%');
svg.setAttribute('height','100%');
bracket.appendChild(svg);

/* store positions/wrappers */
const positionsByRound = [];

/* Build wrappers (rows) + mid blocks */
for(let r=0;r<rounds;r++){
  const matchCount = matchesInRound(r);
  // compute vertical column height and top offset (centered)
  const columnHeight = (matchCount - 1) * perMatchBlock + (winnerH + midH + loserH);
  const topOffset = Math.max(8, Math.round((containerHeight - columnHeight) / 2));

  // left coordinate for this column (uniform width)
  const colLeft = Math.round(r * (colWidth + colGap));

  const thisPositions = [];
  for(let m=0;m<matchCount;m++){
    // wrapper top
    const wrapperTop = Math.round(topOffset + m * perMatchBlock);
    const wrapperHeight = winnerH + midH + loserH;

    // create wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'match-wrapper';
    wrapper.style.left = colLeft + 'px';
    wrapper.style.top = wrapperTop + 'px';
    wrapper.style.width = colWidth + 'px';
    wrapper.style.height = wrapperHeight + 'px';

    // top row
    const topDiv = document.createElement('div');
    topDiv.className = 'match-row row-top';
    topDiv.style.height = winnerH + 'px';
    if(r===0){
      const seed = document.createElement('span'); seed.className='placeholder-seed'; seed.style.visibility='hidden';
      const name = document.createElement('span'); name.className='placeholder-name';
      topDiv.appendChild(seed); topDiv.appendChild(name);
    } else { topDiv.innerHTML = '&nbsp;'; }
    wrapper.appendChild(topDiv);

    // spacer for middle (we do not need to create an element, mid-block is separate)
    const spacer = document.createElement('div');
    spacer.style.height = midH + 'px';
    spacer.style.boxSizing = 'border-box';
    wrapper.appendChild(spacer);

    // bottom row
    const bottomDiv = document.createElement('div');
    bottomDiv.className = 'match-row row-bottom';
    bottomDiv.style.height = loserH + 'px';
    if(r===0){
      const seed = document.createElement('span'); seed.className='placeholder-seed'; seed.style.visibility='hidden';
      const name = document.createElement('span'); name.className='placeholder-name';
      bottomDiv.appendChild(seed); bottomDiv.appendChild(name);
    } else { bottomDiv.innerHTML = '&nbsp;'; }
    wrapper.appendChild(bottomDiv);

    bracket.appendChild(wrapper);

    // mid-block positioned between this column and the next (except maybe last round)
    // For visual consistency we put the mid-block between the current column and the next column,
    // using midOffset and centering by margin-left:-midWidth/2
    const midBlockX = Math.round(colLeft + colWidth + midOffset);
    const centerY = Math.round(wrapperTop + wrapperHeight/2);

    const midBlock = document.createElement('div');
    midBlock.className = 'mid-block';
    midBlock.style.left = midBlockX + 'px';
    midBlock.style.top = (centerY - Math.round(midH/2)) + 'px';
    midBlock.style.width = midWidth + 'px';
    midBlock.style.marginLeft = (-Math.round(midWidth/2)) + 'px';

    const mw = document.createElement('div'); mw.className='mid-winner';
    const mb = document.createElement('div'); mb.className='mid-bar';
    const ms = document.createElement('div'); ms.className='mid-score';
    midBlock.appendChild(mw); midBlock.appendChild(mb); midBlock.appendChild(ms);
    bracket.appendChild(midBlock);

    thisPositions.push({
      wrapperElem: wrapper,
      midBlockElem: midBlock,
      left: colLeft,
      width: colWidth,
      center: centerY,
      midX: midBlockX,
      midTop: centerY - Math.round(midH/2),
      midBottom: centerY - Math.round(midH/2) + midH
    });
  }

  positionsByRound.push(thisPositions);
}

/* vertically align parent columns to children (recompute wrapper tops + midBlocks) */
for(let r=1;r<rounds;r++){
  const parents = positionsByRound[r];
  const children = positionsByRound[r-1];
  if(!parents || !children) continue;
  const parentCount = parents.length;
  const childCount = children.length;

  for(let p=0;p<parentCount;p++){
    const start = Math.floor(p * childCount / parentCount);
    const end   = Math.floor(((p+1) * childCount) / parentCount) - 1;
    let sum = 0, cnt = 0;
    for(let k=Math.max(0,start); k<=Math.min(end, childCount-1); k++){
      sum += children[k].center; cnt++;
    }
    const parentCenter = cnt ? Math.round(sum / cnt) : parents[p].center;
    const wrapperHeight = winnerH + midH + loserH;
    const newWrapperTop = Math.round(parentCenter - wrapperHeight/2);

    const par = parents[p];
    if(par.wrapperElem){
      par.wrapperElem.style.top = newWrapperTop + 'px';
      par.center = parentCenter;
      par.midTop = parentCenter - Math.round(midH/2);
      par.midBottom = par.midTop + midH;
      // also move midBlock to vertical center
      if(par.midBlockElem){
        par.midBlockElem.style.top = (parentCenter - Math.round(midH/2)) + 'px';
      }
    }
  }
}

/* ---------- draw connectors (vertical spines + horizontals) ---------- */
function drawPolyline(points, strokeWidth){
  const reduced = points.filter((p,i,arr) => { if(i===0) return true; const prev = arr[i-1]; return !(prev[0]===p[0] && prev[1]===p[1]); });
  if(reduced.length < 2) return;
  const poly = document.createElementNS(svgNS,'polyline');
  poly.setAttribute('points', reduced.map(p => (p[0]+','+p[1])).join(' '));
  poly.setAttribute('fill','none');
  poly.setAttribute('stroke', rootStyle.getPropertyValue('--line-color') || '#797979');
  poly.setAttribute('stroke-width', (strokeWidth||1));
  poly.setAttribute('stroke-linecap','square');
  poly.setAttribute('stroke-linejoin','miter');
  svg.appendChild(poly);
}

for(let r=0;r<positionsByRound.length-1;r++){
  const children = positionsByRound[r];
  const parents = positionsByRound[r+1];
  if(!children || !parents) continue;

  // mapping: which children go to each parent
  const mapping = new Array(parents.length).fill(0).map(()=>[]);
  for(let i=0;i<children.length;i++){
    const parentIndex = Math.floor(i * parents.length / children.length);
    mapping[Math.min(Math.max(parentIndex,0), parents.length-1)].push(i);
  }

  for(let p=0;p<parents.length;p++){
    const childIndices = mapping[p];
    if(!childIndices || childIndices.length===0) continue;
    const parent = parents[p];

    let minY = Infinity, maxY = -Infinity, sumX = 0;
    childIndices.forEach(ci => { const c = children[ci]; minY = Math.min(minY, c.center); maxY = Math.max(maxY, c.center); sumX += c.midX; });

    const avgChildX = Math.round(sumX / childIndices.length || 0);

    const parentMidLeft = parent.midX - Math.round(midWidth/2);
    let preferred = Math.round((avgChildX + parent.midX) / 2);
    let spineX = preferred;
    const minSpineX = parentMidLeft - 6;
    const maxSpineX = parentMidLeft - 36;
    if(spineX > minSpineX) spineX = minSpineX;
    if(spineX < maxSpineX) spineX = maxSpineX;

    const parentBarY = parent.midTop + Math.round((parent.midBottom - parent.midTop)/2);
    const vTop = Math.min(minY, parentBarY);
    const vBottom = Math.max(maxY, parentBarY);

    if(vBottom - vTop > 0){
      drawPolyline([[spineX, vTop], [spineX, vBottom]], 1);
    }

    childIndices.forEach(ci => {
      const c = children[ci];
      drawPolyline([[c.midX, c.center], [spineX, c.center]], 1);
    });
  }
}

console.log('Bracket generated — players=', totalPlayers, 'rounds=', rounds);
</script>
</body>
</html>

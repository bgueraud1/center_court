<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tournament — Center Court</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff}
  .hero{padding:18px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1200px;margin:12px auto;padding:0 12px}
  .flag{display:inline-block;width:18px;margin-right:6px;vertical-align:middle}
  .flag.USA::after{content:"🇺🇸";}
  .flag.GBR::after{content:"🇬🇧";}
  .flag.BLR::after{content:"🇧🇾";}
  .flag.RUS::after{content:"🇷🇺";}
  .flag.BEL::after{content:"🇧🇪";}
  .flag.DEN::after{content:"🇩🇰";}
  .flag.ESP::after{content:"🇪🇸";}
  .flag.AUS::after{content:"🇦🇺";}
  .flag.UZB::after{content:"🇺🇿";}
  .flag.CHN::after{content:"🇨🇳";}
  .flag.CZE::after{content:"🇨🇿";}
  .flag.UKR::after{content:"🇺🇦";}
  .seed-num{float:left;width:22px;color:red;font-size:11px;padding:2px;}
  .seed-text{float:left;width:22px;color:#808080;font-size:11px;padding:2px;}
  .player-link { font-size:11px;text-decoration:none;color:black; }
  .player-first { font-size:11px;color:#565656;font-style:italic; margin-left:4px;}
  .bye { color:#808080;font-size:11px;padding-left:22px; }
  /* hover highlight */
  .highlight { background: rgba(255,235,59,0.15); }
</style>
</head>
<body>

<div class="hero">
  <div class="container-main">
    <h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1>
  </div>
</div>

<div class="container-main" style="padding-top:12px">
  <div id="bracketContainer" style="position:relative;border:0px solid transparent;min-height:200px;">
    <!-- absolute-positioned cells will be inserted here -->
  </div>
</div>

<script>
/* Helper slugify */
function slugify(name){
  if(!name) return '';
  // expected input like "Ekaterina Alexandrov(a?)" or "Raducanu, Emma" — handle common cases
  name = name.trim();
  // if contains comma "SURNAME, First", swap
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const rest = parts.slice(1).join(',').trim();
    name = rest + ' ' + last;
  }
  return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
}

/* highlight_player stub (keeps same signature as your original HTML) */
function highlight_player(mode, className, v){
  // mode 1 = enter, 2 = leave (per your example use)
  const els = document.querySelectorAll('.' + className);
  if(mode === 1){
    els.forEach(el => el.classList.add('highlight'));
  } else {
    els.forEach(el => el.classList.remove('highlight'));
  }
}

/* convert country code string to class for flag spans — we'll just use code if present */
function countryCodeClass(c){
  if(!c) return '';
  // Accept inputs like "USA" or "UNITED STATES"
  const map = {
    'UNITED STATES':'USA','US':'USA','ENGLAND':'GBR','UNITED KINGDOM':'GBR','GB':'GBR',
    'BELARUS':'BLR','RUSSIA':'RUS','RUS':'RUS','BEL':'BEL','DENMARK':'DEN','ESP':'ESP','AUS':'AUS','UZB':'UZB','CHN':'CHN','CZE':'CZE','UKR':'UKR','POLAND':'POL'
  };
  let key = c.toUpperCase().split(',')[0].trim();
  if(map[key]) return map[key];
  if(key.length===3) return key;
  if(key.length===2){
    // two-letter to three-letter approximate (not exhaustive)
    const conv = { 'US':'USA', 'GB':'GBR' };
    return conv[key] || key;
  }
  return key.substring(0,3);
}

/* main renderer: create absolute positioned blocks exactly as sample markup */
async function render(){
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase();
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  if(!id || !year){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:#666">Missing tournament id or year. Use ?source=wta&t=2010&year=2019</div>';
    return;
  }

  const path = `/data/tournaments/${source}_${id}_${year}.json`;
  let json;
  try{
    const resp = await fetch(path);
    if(!resp.ok) throw new Error('JSON not found: ' + path);
    json = await resp.json();
  }catch(err){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:red">Error loading JSON: ' + err.message + '</div>';
    console.error(err); return;
  }

  document.getElementById('tourney-title').textContent = json.meta.tourney_name || (source.toUpperCase() + ' ' + id);

  // Group matches by normalized round (we want rounds that go left->right; leftmost = most matches)
  function norm(r){
    if(!r) return 'Unknown';
    r = r.trim();
    const u = r.toUpperCase();
    if(u==='F' || u.startsWith('FINAL')) return 'F';
    if(u==='SF' || u.startsWith('SEMIF')) return 'SF';
    if(u==='QF' || u.startsWith('QUART')) return 'QF';
    // keep R16/R32 etc
    return u;
  }

  const matches = (json.matches || []).map(m => Object.assign({}, m)); // copy
  const groups = {};
  matches.forEach(m => {
    const r = norm(m.round || '');
    groups[r] = groups[r] || [];
    groups[r].push(m);
  });

  // order rounds left->right: round with most matches at left
  const rounds = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);

  // constants that mimic your example markup
  const cellWidth = 180;
  const cellHeight = 20; // each line height used in sample
  const perMatchBlock = 60; // stride between winners (winner top = i * perMatchBlock)
  // winner at top, loser at top+20 (cellHeight)
  const colGap = 40;

  // compute required container height: maximum over rounds matches * perMatchBlock
  let maxBlocks = 0;
  rounds.forEach(r => { maxBlocks = Math.max(maxBlocks, groups[r].length); });
  const containerHeight = Math.max(200, maxBlocks * perMatchBlock + 20);
  const container = document.getElementById('bracketContainer');
  container.style.position = 'relative';
  container.style.height = containerHeight + 'px';
  container.innerHTML = ''; // clear

  // loop rounds (columns)
  rounds.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd];
    // sort by numeric suffix of match_id if exists
    matchesInRound.sort((a,b)=>{
      const aa = (a.match_id||'').replace(/[^0-9]/g,'');
      const bb = (b.match_id||'').replace(/[^0-9]/g,'');
      const ia = aa? parseInt(aa,10) : 0;
      const ib = bb? parseInt(bb,10) : 0;
      return ia - ib;
    });
    matchesInRound.forEach((m, i) => {
      const left = colIndex * (cellWidth + colGap);
      const winnerTop = i * perMatchBlock;
      const loserTop = winnerTop + cellHeight;

      // prepare ids/classes: use player id if available, else class from index
      const winnerId = m.player_id_winner || ('pwin_' + colIndex + '_' + i);
      const loserId = m.player_id_loser || ('plos_' + colIndex + '_' + i);

      // winner div (border-top)
      const winnerDiv = document.createElement('div');
      // class name like j_7132
      const winnerClass = 'j_' + String(winnerId);
      winnerDiv.className = winnerClass;
      winnerDiv.setAttribute('onmouseover', `highlight_player(1, '${winnerClass}', 1);`);
      winnerDiv.setAttribute('onmouseout', `highlight_player(2, '${winnerClass}');`);
      winnerDiv.style.position = 'absolute';
      winnerDiv.style.top = winnerTop + 'px';
      winnerDiv.style.left = left + 'px';
      winnerDiv.style.height = cellHeight + 'px';
      winnerDiv.style.width = cellWidth + 'px';
      winnerDiv.style.borderTop = '1px solid rgb(121, 121, 121)';
      winnerDiv.style.textAlign = 'left';
      // seed display: numeric in red, text codes grey
      const wseed = (m.winner_seed || '').toString().trim();
      const seedNode = document.createElement('div');
      if(wseed && /^\d+$/.test(wseed)) { seedNode.className='seed-num'; seedNode.textContent = wseed; }
      else { seedNode.className='seed-text'; seedNode.innerHTML = (wseed? wseed : '&nbsp;'); }
      winnerDiv.appendChild(seedNode);

      // flag span
      const wflag = document.createElement('span');
      const wflagCode = countryCodeClass(m.winner_country || m.winner_country || '');
      wflag.className = 'flag ' + (wflagCode || '');
      winnerDiv.appendChild(wflag);

      // name anchor format: SURNAME, First
      const wname = m.winner_player_name || '';
      const wAnchor = document.createElement('a');
      const wSlug = slugify(wname);
      const href = (m.player_id_winner ? `/player/${wSlug}/${m.player_id_winner}/` : '#');
      wAnchor.href = href;
      wAnchor.className = 'player-link';
      // split first/last
      let first = '', last = wname;
      if(wname.indexOf(' ') >= 0){
        const parts = wname.trim().split(/\s+/);
        first = parts.slice(0, -1).join(' ');
        last = parts[parts.length -1];
      }
      wAnchor.innerHTML = `${(last || '—').toUpperCase()}<span class="player-first">, ${first || ''}</span>`;
      winnerDiv.appendChild(wAnchor);

      container.appendChild(winnerDiv);

      // loser div (border-bottom)
      const loserDiv = document.createElement('div');
      const loserClass = 'j_' + String(loserId);
      loserDiv.className = loserClass;
      loserDiv.setAttribute('onmouseover', `highlight_player(1, '${loserClass}', 1);`);
      loserDiv.setAttribute('onmouseout', `highlight_player(2, '${loserClass}');`);
      loserDiv.style.position = 'absolute';
      loserDiv.style.top = loserTop + 'px';
      loserDiv.style.left = left + 'px';
      loserDiv.style.height = cellHeight + 'px';
      loserDiv.style.width = cellWidth + 'px';
      loserDiv.style.borderBottom = '1px solid rgb(121, 121, 121)';
      loserDiv.style.textAlign = 'left';

      // seed for loser
      const lseed = (m.loser_seed || '').toString().trim();
      const seedNode2 = document.createElement('div');
      if(lseed && /^\d+$/.test(lseed)) { seedNode2.className='seed-num'; seedNode2.textContent = lseed; }
      else { seedNode2.className='seed-text'; seedNode2.innerHTML = (lseed? lseed : '&nbsp;'); }
      loserDiv.appendChild(seedNode2);

      const lflag = document.createElement('span');
      const lflagCode = countryCodeClass(m.loser_country || m.loser_country || '');
      lflag.className = 'flag ' + (lflagCode || '');
      loserDiv.appendChild(lflag);

      // if loser name empty (BYE)
      const lname = m.loser_player_name || '';
      if(!lname){
        const byeSpan = document.createElement('span');
        byeSpan.className = 'bye';
        byeSpan.textContent = 'BYE';
        loserDiv.appendChild(byeSpan);
      } else {
        const lAnchor = document.createElement('a');
        const lSlug = slugify(lname);
        const lhref = (m.player_id_loser ? `/player/${lSlug}/${m.player_id_loser}/` : '#');
        lAnchor.href = lhref;
        lAnchor.className = 'player-link';
        let f2='', l2=lname;
        if(lname.indexOf(' ')>=0){ const parts=lname.trim().split(/\s+/); f2 = parts.slice(0,-1).join(' '); l2=parts[parts.length-1]; }
        lAnchor.innerHTML = `${(l2 || '—').toUpperCase()}<span class="player-first">, ${f2 || ''}</span>`;
        loserDiv.appendChild(lAnchor);
      }

      container.appendChild(loserDiv);
    });
  });

  // helper used above (same as in parse script mapping)
  function countryCodeClass(c){
    if(!c) return '';
    const map = {
      'UNITED STATES':'USA','US':'USA','ENGLAND':'GBR','UNITED KINGDOM':'GBR','GB':'GBR',
      'BELARUS':'BLR','RUSSIA':'RUS','RUS':'RUS','BEL':'BEL','DENMARK':'DEN','ESP':'ESP','AUS':'AUS','UZB':'UZB','CHN':'CHN','CZE':'CZE','UKRAINE':'UKR','UKR':'UKR','POLAND':'POL'
    };
    let key = c.toUpperCase().split(',')[0].trim();
    if(map[key]) return map[key];
    if(key.length===3) return key;
    if(key.length===2){
      const conv = { 'US':'USA', 'GB':'GBR' };
      return conv[key] || key;
    }
    return key.substring(0,3);
  }

} // end render

render();
</script>

</body>
</html>

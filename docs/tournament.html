<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tournament — Center Court</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* mise en page */
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff}
  .hero{padding:18px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1200px;margin:12px auto;padding:0 12px}
  .flag{display:inline-block;width:22px;margin-right:8px;vertical-align:middle;font-size:16px;line-height:1}
  .seed-num{float:left;width:28px;color:#0b3d91;font-size:11px;padding:2px 4px;font-weight:600;} /* bleu foncé */
  .seed-text{float:left;width:28px;color:#808080;font-size:11px;padding:2px 4px;}
  .player-link { font-size:11px;text-decoration:none;color:black; display:inline-block; vertical-align:middle; }
  .player-first { font-size:11px;color:#565656;font-style:italic; margin-left:4px;}
  .bye { color:#808080;font-size:11px;padding-left:22px; }
  /* hover highlight */
  .highlight { background: rgba(255,235,59,0.15); }
  /* small responsive tweaks */
  @media (max-width:600px){
    .player-link{font-size:12px}
    .seed-num, .seed-text{font-size:12px}
  }
  /* border style for the match rows */
  .match-row{ padding:0 4px; box-sizing:border-box; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>

<div class="hero">
  <div class="container-main">
    <h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1>
  </div>
</div>

<div class="container-main" style="padding-top:12px">
  <div id="bracketContainer" style="position:relative;border:0px solid transparent;min-height:200px;">
    <!-- les cellules absolues seront insérées ici -->
  </div>
</div>

<!-- Twemoji pour rendu SVG stable d'emoji (CDN) -->
<script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>

<script>
/* ---------------------------
   UTILITAIRES
   --------------------------- */

/* slugify simple */
function slugify(name){
  if(!name) return '';
  name = name.trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const rest = parts.slice(1).join(',').trim();
    name = rest + ' ' + last;
  }
  return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
}

/* highlight_player (même signature que ton original) */
function highlight_player(mode, className, v){
  const els = document.querySelectorAll('.' + className);
  if(mode === 1){
    els.forEach(el => el.classList.add('highlight'));
  } else {
    els.forEach(el => el.classList.remove('highlight'));
  }
}

/* conversion alpha2 -> drapeau emoji (création via Regional Indicator Symbols) */
function alpha2ToFlagEmoji(alpha2){
  if(!alpha2 || alpha2.length !== 2) return '';
  const A = 0x1F1E6;
  const chars = [...alpha2.toUpperCase()].map(ch => A + (ch.charCodeAt(0) - 65));
  return String.fromCodePoint(...chars);
}

/* ---------------------------
   MAPPING IOC/ISO3 -> alpha-2
   (large couverture pour la plupart des pays et territoires)
   - clé: code IOC/ISO3 (MAJ)
   - valeur: ISO2 (MAJ)
   Si nécessaire tu peux compléter/mettre à jour ce mapping.
   --------------------------- */
const iocToAlpha2 = {
  "AFG":"AF","ALB":"AL","DZA":"DZ","AND":"AD","AGO":"AO","AIA":"AI","ATG":"AG","ARG":"AR","ARM":"AM","ARU":"AW",
  "AUS":"AU","AUT":"AT","AZE":"AZ","BHS":"BS","BHR":"BH","BGD":"BD","BRB":"BB","BLR":"BY","BEL":"BE","BLZ":"BZ",
  "BEN":"BJ","BMU":"BM","BTN":"BT","BOL":"BO","BIH":"BA","BWA":"BW","BRA":"BR","VGB":"VG","BRN":"BN","BGR":"BG",
  "BFA":"BF","BDI":"BI","CPV":"CV","KHM":"KH","CMR":"CM","CAN":"CA","CYM":"KY","CAF":"CF","TCD":"TD","CHL":"CL",
  "CHN":"CN","COL":"CO","COM":"KM","COG":"CG","COD":"CD","COK":"CK","CRI":"CR","CIV":"CI","HRV":"HR","CUB":"CU",
  "CYP":"CY","CZE":"CZ","DEN":"DK","DJI":"DJ","DMA":"DM","DOM":"DO","ECU":"EC","EGY":"EG","SLV":"SV","GNQ":"GQ",
  "ERI":"ER","EST":"EE","ETH":"ET","FRO":"FO","FJI":"FJ","FIN":"FI","FRA":"FR","GUF":"GF","PYF":"PF","GAB":"GA",
  "GMB":"GM","GEO":"GE","DEU":"DE","GHA":"GH","GIB":"GI","GRC":"GR","GRD":"GD","GLP":"GP","GTM":"GT","GIN":"GN",
  "GNB":"GW","GUY":"GY","HTI":"HT","HND":"HN","HKG":"HK","HUN":"HU","ISL":"IS","IND":"IN","IDN":"ID","IRN":"IR",
  "IRQ":"IQ","IRL":"IE","ISR":"IL","ITA":"IT","JAM":"JM","JPN":"JP","JOR":"JO","KAZ":"KZ","KEN":"KE","KIR":"KI",
  "PRK":"KP","KOR":"KR","KWT":"KW","KGZ":"KG","LAO":"LA","LVA":"LV","LBN":"LB","LSO":"LS","LBR":"LR","LBY":"LY",
  "LIE":"LI","LTU":"LT","LUX":"LU","MAC":"MO","MDG":"MG","MWI":"MW","MYS":"MY","MDV":"MV","MLI":"ML","MLT":"MT",
  "MHL":"MH","MTQ":"MQ","MRT":"MR","MUS":"MU","MYT":"YT","MEX":"MX","FSM":"FM","MDA":"MD","MCO":"MC","MNG":"MN",
  "MNE":"ME","MAR":"MA","MOZ":"MZ","MMR":"MM","NAM":"NA","NRU":"NR","NPL":"NP","NLD":"NL","NCL":"NC","NZL":"NZ",
  "NIC":"NI","NER":"NE","NGA":"NG","NIU":"NU","NFK":"NF","MKD":"MK","MNP":"MP","NOR":"NO","OMN":"OM","PAK":"PK",
  "PLW":"PW","PAN":"PA","PNG":"PG","PRY":"PY","PER":"PE","PHI":"PH","POL":"PL","PRT":"PT","PUR":"PR","QAT":"QA",
  "REU":"RE","ROU":"RO","RUS":"RU","RWA":"RW","KNA":"KN","LCA":"LC","VCT":"VC","WSM":"WS","SMR":"SM","STP":"ST",
  "SAU":"SA","SEN":"SN","SRB":"RS","SYC":"SC","SLE":"SL","SGP":"SG","SVK":"SK","SVN":"SI","SLB":"SB","SOM":"SO",
  "ZAF":"ZA","SSD":"SS","ESP":"ES","LKA":"LK","SDN":"SD","SUR":"SR","SWE":"SE","CHE":"CH","SYR":"SY","TJK":"TJ",
  "TZA":"TZ","THA":"TH","TTO":"TT","TUN":"TN","TUR":"TR","TKM":"TM","TCA":"TC","TUV":"TV","UGA":"UG","UKR":"UA",
  "ARE":"AE","GBR":"GB","USA":"US","URY":"UY","UZB":"UZ","VUT":"VU","VEN":"VE","VNM":"VN","VIR":"VI","YEM":"YE",
  "ZMB":"ZM","ZWE":"ZW","ALA":"AX","ASM":"AS","BOL":"BO","SXM":"SX","BLM":"BL","MAF":"MF","ESH":"EH","TWN":"TW",
  "CXR":"CX","CCK":"CC","FLK":"FK","GUF":"GF","SPM":"PM","SHN":"SH","TZA":"TZ","UMI":"UM",
  /* ajout de codes et territoires courants */
  "AND":"AD","ANT":"BQ","BIH":"BA","CYP":"CY","GEO":"GE","HKG":"HK","KOS":"XK","PSE":"PS","VAT":"VA","XKX":"XK"
};

/* pour accepter noms complets simples -> alpha2 (quelques cas fréquents)
   (tu peux enrichir ce dictionnaire si ton JSON donne des noms complets) */
const nameToAlpha2 = {
  "UNITED STATES":"US","UNITED KINGDOM":"GB","ENGLAND":"GB","RUSSIA":"RU","CHINA":"CN","UAE":"AE",
  "SOUTH KOREA":"KR","NORTH KOREA":"KP","SOUTH AFRICA":"ZA","IRAN":"IR","VENEZUELA":"VE","BOSNIA AND HERZEGOVINA":"BA"
};

/* normalize input country string et retourne alpha2 si trouvé */
function toAlpha2(input){
  if(!input) return '';
  let s = String(input).trim().toUpperCase();
  // si déjà 2 lettres
  if(s.length === 2 && /^[A-Z]{2}$/.test(s)) return s;
  // si 3 lettres et présent dans iocToAlpha2
  if(s.length === 3 && iocToAlpha2[s]) return iocToAlpha2[s];
  // si correspond à un nom simple
  if(nameToAlpha2[s]) return nameToAlpha2[s];
  // si format "United States" etc -> try first two letters of last token? (fallback)
  const parts = s.split(/\s+/);
  // fallback 1: last two letters of first token (not great) -> avoid
  // fallback 2: try to match by checking keys in iocToAlpha2 (match suffix)
  for(const key in iocToAlpha2){
    if(key === s) return iocToAlpha2[key];
  }
  // nothing trouvé -> return empty
  return '';
}

/* create a flag element (span) robust: 
   - si on obtient alpha2 on convertit en emoji et on laisse Twemoji le remplacer
   - sinon on renvoie un span avec the provided code (texte bref)
*/
function makeFlagSpan(countryInput){
  const alpha2 = toAlpha2(countryInput || '');
  const span = document.createElement('span');
  span.className = 'flag';
  if(alpha2){
    span.textContent = alpha2ToFlagEmoji(alpha2);
    span.setAttribute('data-country-alpha2', alpha2);
  } else {
    // fallback: montre le code fourni (ou vide) dans une petite boîte
    const txt = (countryInput ? String(countryInput).toUpperCase().slice(0,3) : '');
    span.textContent = txt;
    span.style.fontSize = '11px';
    span.style.color = '#666';
    span.style.padding = '0 2px';
  }
  return span;
}

/* ---------------------------
   RENDERING PRINCIPAL
   --------------------------- */
async function render(){
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase();
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  if(!id || !year){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:#666">Missing tournament id or year. Use ?source=wta&t=2010&year=2019</div>';
    return;
  }

  const path = `/data/tournaments/${source}_${id}_${year}.json`;
  let json;
  try{
    const resp = await fetch(path);
    if(!resp.ok) throw new Error('JSON not found: ' + path);
    json = await resp.json();
  }catch(err){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:red">Error loading JSON: ' + err.message + '</div>';
    console.error(err); return;
  }

  document.getElementById('tourney-title').textContent = json.meta?.tourney_name || (source.toUpperCase() + ' ' + id);

  // normalise nom du round
  function norm(r){
    if(!r) return 'Unknown';
    r = r.trim();
    const u = r.toUpperCase();
    if(u==='F' || u.startsWith('FINAL')) return 'F';
    if(u==='SF' || u.startsWith('SEMIF')) return 'SF';
    if(u==='QF' || u.startsWith('QUART')) return 'QF';
    return u;
  }

  const matches = (json.matches || []).map(m => Object.assign({}, m));
  const groups = {};
  matches.forEach(m => {
    const r = norm(m.round || '');
    groups[r] = groups[r] || [];
    groups[r].push(m);
  });

  // trier rounds par nombre de matches (gauche -> droite)
  const rounds = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);

  // constantes layout
  const cellWidth = 200;
  const cellHeight = 20;
  const perMatchBlock = 60; // espace vertical entre vainqueurs correspondants
  const colGap = 40;

  // hauteur du conteneur selon plus grand nombre de matches (colonne la plus fournie)
  let maxBlocks = 0;
  rounds.forEach(r => { maxBlocks = Math.max(maxBlocks, groups[r].length); });
  const containerHeight = Math.max(200, maxBlocks * perMatchBlock + 40);
  const container = document.getElementById('bracketContainer');
  container.style.position = 'relative';
  container.style.height = containerHeight + 'px';
  container.innerHTML = ''; // clear

  // Pour chaque colonne on calcule offsetTop afin de centrer verticalement la colonne
  rounds.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd];
    // tri par match_id numérique si possible
    matchesInRound.sort((a,b)=>{
      const aa = (a.match_id||'').replace(/[^0-9]/g,''), bb = (b.match_id||'').replace(/[^0-9]/g,'');
      const ia = aa ? parseInt(aa,10) : 0, ib = bb ? parseInt(bb,10) : 0;
      return ia - ib;
    });

    // hauteur totale occupée par cette colonne (du premier winner au dernier loser)
    const n = matchesInRound.length;
    const columnHeight = (n - 1) * perMatchBlock + cellHeight + (cellHeight); // petit buffer
    const topOffset = Math.max(10, Math.round((containerHeight - columnHeight) / 2));

    matchesInRound.forEach((m, i) => {
      const left = colIndex * (cellWidth + colGap);
      const winnerTop = topOffset + i * perMatchBlock;
      const loserTop = winnerTop + cellHeight;

      const winnerId = m.player_id_winner || ('pwin_' + colIndex + '_' + i);
      const loserId = m.player_id_loser || ('plos_' + colIndex + '_' + i);

      // winner div
      const winnerDiv = document.createElement('div');
      const winnerClass = 'j_' + String(winnerId);
      winnerDiv.className = winnerClass + ' match-row';
      winnerDiv.setAttribute('onmouseover', `highlight_player(1, '${winnerClass}', 1);`);
      winnerDiv.setAttribute('onmouseout', `highlight_player(2, '${winnerClass}');`);
      winnerDiv.style.position = 'absolute';
      winnerDiv.style.top = winnerTop + 'px';
      winnerDiv.style.left = left + 'px';
      winnerDiv.style.height = cellHeight + 'px';
      winnerDiv.style.width = cellWidth + 'px';
      winnerDiv.style.borderTop = '1px solid rgb(121, 121, 121)';
      winnerDiv.style.textAlign = 'left';
      winnerDiv.style.padding = '0 4px';
      winnerDiv.style.display = 'flex';
      winnerDiv.style.alignItems = 'center';
      winnerDiv.style.gap = '6px';

      const wseed = (m.winner_seed || '').toString().trim();
      const seedNode = document.createElement('div');
      if(wseed && /^\d+$/.test(wseed)) { seedNode.className='seed-num'; seedNode.textContent = wseed; }
      else { seedNode.className='seed-text'; seedNode.innerHTML = (wseed? wseed : '&nbsp;'); }
      winnerDiv.appendChild(seedNode);

      // flag
      const wflagSpan = makeFlagSpan(m.winner_country || m.winner_nationality || m.winner_country_code || '');
      winnerDiv.appendChild(wflagSpan);

      // name anchor (SURNAME, First)
      const wname = m.winner_player_name || '';
      const wAnchor = document.createElement('a');
      const wSlug = slugify(wname);
      const href = (m.player_id_winner ? `/player/${wSlug}/${m.player_id_winner}/` : '#');
      wAnchor.href = href;
      wAnchor.className = 'player-link';
      let first = '', last = wname;
      if(wname.indexOf(' ') >= 0){
        const parts = wname.trim().split(/\s+/);
        first = parts.slice(0, -1).join(' ');
        last = parts[parts.length -1];
      }
      wAnchor.innerHTML = `<strong style="font-size:11px">${(last || '—').toUpperCase()}</strong><span class="player-first">, ${first || ''}</span>`;
      winnerDiv.appendChild(wAnchor);

      container.appendChild(winnerDiv);

      // loser div
      const loserDiv = document.createElement('div');
      const loserClass = 'j_' + String(loserId);
      loserDiv.className = loserClass + ' match-row';
      loserDiv.setAttribute('onmouseover', `highlight_player(1, '${loserClass}', 1);`);
      loserDiv.setAttribute('onmouseout', `highlight_player(2, '${loserClass}');`);
      loserDiv.style.position = 'absolute';
      loserDiv.style.top = loserTop + 'px';
      loserDiv.style.left = left + 'px';
      loserDiv.style.height = cellHeight + 'px';
      loserDiv.style.width = cellWidth + 'px';
      loserDiv.style.borderBottom = '1px solid rgb(121, 121, 121)';
      loserDiv.style.textAlign = 'left';
      loserDiv.style.padding = '0 4px';
      loserDiv.style.display = 'flex';
      loserDiv.style.alignItems = 'center';
      loserDiv.style.gap = '6px';

      const lseed = (m.loser_seed || '').toString().trim();
      const seedNode2 = document.createElement('div');
      if(lseed && /^\d+$/.test(lseed)) { seedNode2.className='seed-num'; seedNode2.textContent = lseed; }
      else { seedNode2.className='seed-text'; seedNode2.innerHTML = (lseed? lseed : '&nbsp;'); }
      loserDiv.appendChild(seedNode2);

      const lflagSpan = makeFlagSpan(m.loser_country || m.loser_nationality || m.loser_country_code || '');
      loserDiv.appendChild(lflagSpan);

      const lname = m.loser_player_name || '';
      if(!lname){
        const byeSpan = document.createElement('span');
        byeSpan.className = 'bye';
        byeSpan.textContent = 'BYE';
        loserDiv.appendChild(byeSpan);
      } else {
        const lAnchor = document.createElement('a');
        const lSlug = slugify(lname);
        const lhref = (m.player_id_loser ? `/player/${lSlug}/${m.player_id_loser}/` : '#');
        lAnchor.href = lhref;
        lAnchor.className = 'player-link';
        let f2='', l2=lname;
        if(lname.indexOf(' ')>=0){ const parts=lname.trim().split(/\s+/); f2 = parts.slice(0,-1).join(' '); l2=parts[parts.length-1]; }
        lAnchor.innerHTML = `<strong style="font-size:11px">${(l2 || '—').toUpperCase()}</strong><span class="player-first">, ${f2 || ''}</span>`;
        loserDiv.appendChild(lAnchor);
      }

      container.appendChild(loserDiv);
    });
  });

  // après insertion, utiliser Twemoji pour remplacer les emoji par des SVG (meilleure compat)
  try{
    if(window.twemoji && typeof twemoji.parse === 'function'){
      // remplace uniquement dans le conteneur pour être rapide
      twemoji.parse(container, { folder: 'svg', ext: '.svg', base: 'https://twemoji.maxcdn.com/v/latest/' });
    }
  }catch(e){
    // si échec: pas fatal — emoji natifs resteront
    console.warn('Twemoji parse failed', e);
  }
} // end render

render();
</script>

</body>
</html>

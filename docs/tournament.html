<style>
  :root{
    --winner-h:22px;
    --loser-h:22px;
    --midblock-h:38px;
    --match-gap:52px;
    --col-gap:34px;
    --col-width:220px;
    --col-width-small:140px;
    --midblock-width:160px;
    --line-color:#797979;
    --seed-blue:#0b3d91;
    --mid-offset: 220px;
  }

  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
  .hero{padding:14px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1400px;margin:12px auto;padding:0 12px}
  #bracketContainer{position:relative;background:transparent;overflow:visible}

  /* flags */
  .flag{display:inline-block;width:22px;height:14px;margin-right:8px;vertical-align:middle;overflow:hidden;border-radius:2px;background:#f5f5f5;line-height:14px;text-align:center}
  .flag img{width:100%;height:100%;object-fit:cover;display:block}

  /* seeds */
  .seed-num{float:left;width:22px;color:var(--seed-blue);font-size:11px;padding:2px 4px;font-weight:700;}
  .seed-text{float:left;width:22px;color:#808080;font-size:11px;padding:2px 4px;}

  .player-link{font-size:11px;text-decoration:none;color:#000;display:inline-block;vertical-align:middle}
  .player-first{font-size:11px;color:#565656;font-style:italic;margin-left:4px}
  .bye{color:#808080;font-size:11px;padding-left:22px}

  /* rows for players (absolute) */
  .match-row{box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;background:#fff;z-index:5;position:absolute;display:flex;align-items:center;gap:6px;}
  .row-top{height:var(--winner-h); border-top:1px solid var(--line-color);}   /* top border above upper player */
  .row-bottom{height:var(--loser-h); border-bottom:1px solid var(--line-color);}/* bottom border below lower player */

  /* mid block placed at mid-axis; contains winner above line and score below */
  .mid-block{position:absolute;height:var(--midblock-h);width:var(--midblock-width);text-align:center;transform:none;z-index:70;background:#fff;pointer-events:auto;margin-left:0;display:flex;flex-direction:column;justify-content:center;align-items:center;box-sizing:border-box}
  .mid-winner{font-size:11px;font-weight:700;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;display:flex;align-items:center;gap:6px}
  .mid-bar{height:1px;background:var(--line-color);width:100%;margin:2px 0;}
  .mid-score{font-size:11px;color:#515151;font-style:italic;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}

  /* svg connectors behind everything */
  .connectors{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none}

  .highlight{background: rgba(255,235,59,0.15) !important}

  @media (max-width:900px){
    :root{ --col-width:160px; --col-width-small:120px; --match-gap:36px; --midblock-width:120px; }
  }
</style>

<body>
  <div class="hero"><div class="container-main"><h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1></div></div>
  <div class="container-main" style="padding-top:12px">
    <div id="bracketContainer" style="min-height:640px">

<!-- ==================================================================
    TON SQUELETTE (inchangé) : tu peux coller ici exactement ton HTML
    original — je l'ai mis tel quel. Les tokens texte comme "PlayerMS016",
    "Player MS016", "ScoreMS017", "VainqueurMS010" seront automatiquement
    repérés et remplacés.
   ================================================================== -->

<div style="padding:25px;background:white;overflow:auto;">
  <div style="position:relative;padding:80px 0 80px 0;">
    <div style="width:300px;height:62px;position:absolute;top:0;right:350px;;"></div>

      <div style="position:absolute;top:80px;left:0px;height:20px;width:180px;border-bottom:1px solid #797979;text-align:left;" class="j_8238" onmouseover="highlight_player(1, 'j_8238', 2);" onmouseout="highlight_player(2, 'j_8238');">
        <div style="float:left;width:22px;font-weight:bold;color:#808080;font-size:11px;padding:2px;">&nbsp;</div>

      </div>

      <!-- ... (le reste de ton squelette original : j'ai omis de répéter chaque bloc dans cet extrait pour lisibilité
           mais dans ton fichier final tu dois inclure la totalité du HTML de ton squelette – le script traitera
           automatiquement tous les placeholders) ... -->

      <!-- Exemple de score placeholder -->
      <div style="position:absolute;top:80px;left:180px;height:21px;width:150px;border-left:1px solid #797979;text-align:left;">
        <a href="/match/example/1/" style="padding-left:2px;color:#515151;font-size:11px;font-style:italic;">ScoreMS017</a>

<script>
/*
  TEMPLATE JS : remplit les placeholders (PlayerMS###, Player MS###, VainqueurMS###, ScoreMS###)
  depuis un JSON tourneyData.
  - Priorité d'utilisation des données : window.tourneyData (si fourni par ton site)
    sinon le script peut charger le JSON automatiquement si les params ?source=&t=&year= sont fournis.
  - Configuration ci-dessous.
*/

/* =========================
   CONFIG (personnalise ici)
   ========================= */
const config = {
  // Si ton site met déjà window.tourneyData, active true; sinon le script tentera de fetch par ?source & ?t & ?year
  preferGlobalTourneyData: true,

  // Quand il y a 2 placeholders "PlayerMS###" pour le même match,
  // on associe l'ordre vertical (top -> champFirst, bottom -> champSecond).
  // changez l'ordre si vous voulez top->loser/bottom->winner etc.
  playerTwoOrder: ['winner_player_name','loser_player_name'],

  // Si on a une seule occurrence "PlayerMS###", on utilise ce champ par défaut :
  singlePlayerDefault: 'winner_player_name',

  // Générateurs d'URL faciles à personnaliser :
  playerUrlFrom: function(matchObj, role) {
    // role === 'winner' or 'loser'
    // priorise player_id_winner/player_id_loser si présent, sinon construit slug depuis le nom
    const id = (role === 'winner') ? matchObj.player_id_winner : matchObj.player_id_loser;
    if(id && String(id).trim() !== '') return `/player/${encodeURIComponent(String(id).trim())}/`;
    const name = (role === 'winner') ? matchObj.winner_player_name : matchObj.loser_player_name;
    if(name) return `/player/${slugify(name)}/`;
    return '#';
  },
  matchUrlFrom: function(matchObj) {
    // construit une url générique ; ajuste si tu as une autre structure
    const mid = (matchObj.match_id || '').toLowerCase();
    const p = (matchObj.winner_player_name || '') + '-' + (matchObj.loser_player_name || '');
    return `/match/${slugify(p)}-${mid}/`;
  },

  // mapping des codes pays : si JSON utilise autre format adapte toAlpha2() plus bas
  preferFlagEmojiIfNoImage: true
};

/* =========================
   UTIL : slug, score formatting, drapeau
   ========================= */
function slugify(s){
  if(!s) return '';
  return String(s).toLowerCase().trim()
    .normalize('NFD').replace(/\p{Diacritic}/gu,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function scoreToHtml(s){
  if(!s) return '';
  return String(s).replace(/(\d+)\((\d+)\)/g,'$1<sup>$2</sup>').replace(/,/g,', ');
}

/* mapping IOC 3-letter -> alpha2 (liste partielle — on complète les plus courants) */
const iocToAlpha2 = {
  "ARG":"AR","AUS":"AU","AUT":"AT","BEL":"BE","BRA":"BR","CAN":"CA","CHN":"CN","COL":"CO",
  "CRO":"HR","CZE":"CZ","DEN":"DK","ESP":"ES","FRA":"FR","GBR":"GB","GER":"DE","HKG":"HK",
  "HUN":"HU","ITA":"IT","JPN":"JP","KAZ":"KZ","NED":"NL","POR":"PT","RUS":"RU","SRB":"RS",
  "SUI":"CH","USA":"US"
};

function toAlpha2(code){
  if(!code) return '';
  let s = String(code).trim().toUpperCase();
  if(/^[A-Z]{2}$/.test(s)) return s;
  if(iocToAlpha2[s]) return iocToAlpha2[s];
  // fallback: keep first two letters
  const letters = s.replace(/[^A-Z]/g,'');
  return letters.length>=2 ? letters.slice(0,2) : '';
}
function alpha2ToFlagEmoji(alpha2){
  if(!alpha2 || alpha2.length!==2) return '';
  const A = 0x1F1E6;
  try{
    return String.fromCodePoint(...[...alpha2.toUpperCase()].map(c => A + (c.charCodeAt(0)-65)));
  }catch(e){ return ''; }
}

/* =========================
   Recherche et remplacement des placeholders
   ========================= */

/*
  On cherche dans tous les éléments courants (a, span, div) des textes contenant :
    - PlayerMS###  ou  Player MS###
    - VainqueurMS###  ou  Vainqueur MS###
    - ScoreMS###  ou  Score MS###
    - ou simplement MS###
  On conserve l'élément local (souvent un <a> ou <span>) et on remplace son innerHTML
  par le contenu calculé.
*/

/* retourne une promesse qui résout le JSON de tournoi : soit window.tourneyData,
   soit chargement via fetch à partir des params ?source=&t=&year=... */
async function getTourneyDataOrNull(){
  if(config.preferGlobalTourneyData && window.tourneyData) {
    console.log('Utilisation de window.tourneyData déjà chargé.');
    return window.tourneyData;
  }
  // fallback : tenter de charger depuis params
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || params.get('s') || 'atp');
  const t = params.get('t') || params.get('id') || '';
  const year = params.get('year') || params.get('y') || '';
  if(!t || !year){
    console.warn('Aucun JSON global et pas de ?t= & ?year= fourni — le template attend window.tourneyData ou des placeholders resteront en l\'état.');
    return null;
  }
  const path = `/data/tournaments/${source}_${t}_${year}.json`;
  try{
    const resp = await fetch(path);
    if(!resp.ok) throw new Error('fetch failed ' + resp.status);
    const j = await resp.json();
    console.log('JSON chargé depuis', path);
    return j;
  }catch(err){
    console.error('Erreur chargement JSON', err);
    return null;
  }
}

/* trouve tous les éléments candidats et repère s'ils contiennent un token */
function findPlaceholdersInDOM(){
  const tokens = []; // {el, type, matchId, rawText, top}
  const nodeList = Array.from(document.querySelectorAll('a,div,span'));
  const tokenRegex = /\b(?:(Player|Vainqueur|Score)\s*)?([ML]S\d{3})\b/i;
  nodeList.forEach(el => {
    const txt = (el.textContent || '').trim();
    if(!txt) return;
    const m = txt.match(tokenRegex);
    if(m){
      const type = (m[1] ? m[1] : 'Player'); // si uniquement MS### -> traité comme Player par défaut
      const matchId = m[2].toUpperCase();
      const rect = el.getBoundingClientRect();
      tokens.push({el, type, matchId, rawText: txt, top: Math.round(rect.top || 0)});
    }
  });
  return tokens;
}

/* groupe par matchId et tri vertical */
function groupTokensByMatch(tokens){
  const map = {};
  tokens.forEach(t => {
    if(!map[t.matchId]) map[t.matchId] = [];
    map[t.matchId].push(t);
  });
  Object.keys(map).forEach(k => map[k].sort((a,b)=>a.top - b.top));
  return map;
}

/* remplit un élément "player-like" (el) avec name/country/seed/link */
function fillPlayerElement(el, name, countryCode3, seed, href){
  // si l'élément contient une balise <a>, on met le href dessus sinon on met le href sur el (si c'est un <a> on modifie)
  if(el.tagName.toLowerCase() === 'a'){
    el.href = href || el.href || '#';
    el.innerHTML = ''; // on reconstruit proprement
    // drapeau
    const alpha2 = toAlpha2(countryCode3);
    if(alpha2 && config.preferFlagEmojiIfNoImage){
      const emoji = alpha2ToFlagEmoji(alpha2);
      if(emoji){
        const span = document.createElement('span');
        span.className = 'flag';
        span.textContent = emoji;
        el.appendChild(span);
      }
    } else {
      const span = document.createElement('span');
      span.className = 'flag ' + (countryCode3 || '');
      el.appendChild(span);
    }
    // seed (s'il existe, on essaiera de trouver un enfant seed dans le parent)
    const nameNode = document.createElement('span');
    nameNode.className = 'player-link';
    nameNode.textContent = name || '\u00A0';
    el.appendChild(nameNode);
    return;
  }
  // si pas d'<a>, on remplace innerHTML simplement
  const alpha2 = toAlpha2(countryCode3);
  let flagHtml = '';
  if(alpha2 && config.preferFlagEmojiIfNoImage){
    flagHtml = `<span class="flag">${alpha2ToFlagEmoji(alpha2)}</span>`;
  } else {
    flagHtml = `<span class="flag ${countryCode3 || ''}"></span>`;
  }
  el.innerHTML = `${flagHtml}<a class="player-link" href="${href||'#'}">${escapeHtml(name || '\u00A0')}</a>`;
  // tentative : remplacer un seed-like child if exists (digit-only or WC/Q)
  const seedCandidate = Array.from(el.children).find(c => /^[\s0-9WCQNG\-]{1,4}$/i.test((c.textContent||'').trim()));
  if(seedCandidate){
    seedCandidate.textContent = seed || seedCandidate.textContent;
  }
}

/* échappe html basique */
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* remplit un élément "score-like" */
function fillScoreElement(el, scoreString, matchObj){
  const html = scoreToHtml(scoreString) || '\u00A0';
  el.innerHTML = `<span class="mid-score">${html}</span>`;
  // si c'est un <a>, met le lien de match
  if(el.tagName.toLowerCase() === 'a'){
    el.href = config.matchUrlFrom(matchObj) || el.href || '#';
  }
}

/* remplit les tokens depuis le JSON */
function populateFromTourneyData(tourney){
  if(!tourney || !Array.isArray(tourney.matches)){
    console.warn('Aucun matches[] dans le JSON fourni — rien à remplir.');
    return;
  }
  // map matches par match_id normalisé (ex: MS016)
  const matchMap = {};
  tourney.matches.forEach(m=>{
    if(!m || !m.match_id) return;
    matchMap[String(m.match_id).trim().toUpperCase()] = m;
  });

  const placeholders = findPlaceholdersInDOM();
  if(placeholders.length === 0){
    console.log('Aucun placeholder MS### trouvé dans le DOM.');
    return;
  }
  const grouped = groupTokensByMatch(placeholders);

  // pour chaque matchId trouvé dans le DOM, remplace si JSON présent
  Object.keys(grouped).forEach(matchId => {
    const tokens = grouped[matchId];
    const matchObj = matchMap[matchId];
    if(!matchObj){
      console.info(`Placeholder ${matchId} trouvé dans DOM mais pas de match correspondant dans le JSON (reste inchangé).`);
      return;
    }

    // fields from matchObj (nom, pays, seed)
    const winnerName = matchObj.winner_player_name || matchObj.winner_name || '';
    const loserName = matchObj.loser_player_name || matchObj.loser_name || '';
    const winnerCountry = (matchObj.winner_country || matchObj.winner_country_code || matchObj.winner_nationality || '').toUpperCase();
    const loserCountry = (matchObj.loser_country || matchObj.loser_country_code || matchObj.loser_nationality || '').toUpperCase();
    const winnerSeed = matchObj.winner_seed || '';
    const loserSeed = matchObj.loser_seed || '';
    // urls
    const winnerHref = config.playerUrlFrom(matchObj, 'winner');
    const loserHref = config.playerUrlFrom(matchObj, 'loser');
    const matchHref = config.matchUrlFrom(matchObj);

    // separate tokens by type
    const scoreTokens = tokens.filter(t => /^score$/i.test(t.type));
    const vainqueurTokens = tokens.filter(t => /^vainqueur$/i.test(t.type));
    const playerTokens = tokens.filter(t => /^player$/i.test(t.type) || (!t.type)); // fallback

    // 1) Scores
    scoreTokens.forEach(t => {
      try{ fillScoreElement(t.el, matchObj.score_string || matchObj.score || '', matchObj); }catch(e){ console.warn(e); }
    });

    // 2) Vainqueur tokens => always winner
    vainqueurTokens.forEach(t => {
      try{
        // place winner name, flag and link
        if(t.el.tagName.toLowerCase() === 'a'){
          t.el.href = matchHref || t.el.href || '#';
          t.el.innerHTML = '';
          const flagSpan = document.createElement('span');
          const alpha = toAlpha2(winnerCountry);
          if(alpha && config.preferFlagEmojiIfNoImage){
            flagSpan.className = 'flag';
            flagSpan.textContent = alpha2ToFlagEmoji(alpha);
          } else {
            flagSpan.className = 'flag ' + (winnerCountry || '');
          }
          t.el.appendChild(flagSpan);
          const nameSpan = document.createElement('span');
          nameSpan.className = 'player-link';
          nameSpan.textContent = winnerName || '\u00A0';
          t.el.appendChild(nameSpan);
        } else {
          // non anchor: set innerHTML
          const alpha = toAlpha2(winnerCountry);
          if(alpha && config.preferFlagEmojiIfNoImage){
            t.el.innerHTML = `<span class="flag">${alpha2ToFlagEmoji(alpha)}</span><span class="player-link">${escapeHtml(winnerName||'')}</span>`;
          } else {
            t.el.innerHTML = `<span class="flag ${winnerCountry||''}"></span><span class="player-link">${escapeHtml(winnerName||'')}</span>`;
          }
        }
      }catch(e){ console.warn('Erreur vainqueur', e); }
    });

    // 3) Player tokens: decide mapping depending on how many placeholders exist and vertical order
    if(playerTokens.length > 0){
      // playerTokens are already sorted by top position in grouped map
      // if 2 or more -> map by config.playerTwoOrder
      if(playerTokens.length >= 2){
        for(let i=0;i<playerTokens.length;i++){
          const t = playerTokens[i];
          const role = (config.playerTwoOrder[i] === 'winner_player_name') ? 'winner' : 'loser';
          const name = (role === 'winner') ? winnerName : loserName;
          const country = (role === 'winner') ? winnerCountry : loserCountry;
          const seed = (role === 'winner') ? winnerSeed : loserSeed;
          const href = (role === 'winner') ? winnerHref : loserHref;
          try{ fillPlayerElement(t.el, name, country, seed, href); }catch(e){ console.warn('Erreur fill player', e); }
        }
      } else {
        // single placeholder -> use singlePlayerDefault field
        const field = config.singlePlayerDefault;
        const role = (field && field.indexOf('winner')>=0) ? 'winner' : 'loser';
        const name = (role === 'winner') ? winnerName : loserName;
        const country = (role === 'winner') ? winnerCountry : loserCountry;
        const seed = (role === 'winner') ? winnerSeed : loserSeed;
        const href = (role === 'winner') ? winnerHref : loserHref;
        try{ fillPlayerElement(playerTokens[0].el, name, country, seed, href); }catch(e){ console.warn('Erreur fill single player', e); }
      }
    }

    // Bonus : si il existe un <span class="flag ..."> dans le même parent pour d'autres tokens,
    // on met à jour sa classe si nécessaire
    // (On a déjà mis des flags lors du remplissage ci-dessus, mais on contrôle aussi les spans existants)
    try{
      const allEls = tokens;
      allEls.forEach(t=>{
        const parent = t.el.parentElement;
        if(!parent) return;
        const existingFlag = parent.querySelector('.flag');
        if(existingFlag){
          // si l'élément text contient "winner" or "vainqueur", prefer winner country, else try to infer from sibling
          if(/^vainqueur$/i.test(t.type)){
            if(winnerCountry) existingFlag.className = 'flag ' + winnerCountry;
          } else if(/^score$/i.test(t.type)){
            // leave score flags alone
          } else {
            // player: determine by which name is present in sibling anchor text if exists
            // fallback: don't modify
          }
        }
      });
    }catch(e){}
  });

  console.log('Remplissage terminé.');
}

/* =========================
   Execution : on DOMContentLoaded
   ========================= */
document.addEventListener('DOMContentLoaded', async function(){
  // titre du tournoi si présent dans le JSON
  const tourney = await getTourneyDataOrNull();
  if(tourney && tourney.meta){
    const titleEl = document.getElementById('tourney-title');
    if(titleEl) titleEl.textContent = (tourney.meta.tourney_title || tourney.meta.tourney_name || titleEl.textContent);
  }
  populateFromTourneyData(tourney || (window.tourneyData || null));
});

/* helper existant dans ton squelette */
function highlight_player(mode, className, unused){
  const els = document.querySelectorAll('.'+className);
  if(mode===1) els.forEach(e=>e.classList.add('highlight'));
  else els.forEach(e=>e.classList.remove('highlight'));
}
</script>

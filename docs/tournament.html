<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tournoi — Viewer</title>
<style>
  :root{
    --band-h:72px;
    --padding:18px;
    --bg:#fff;
    --muted:#6b6b6b;
    --accent-hard:#0b3d91;   /* blue */
    --accent-clay:#b22222;   /* red */
    --accent-grass:#2e8b57;  /* green */
    --accent-carpet:#6f42c1; /* purple */
  }
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111}
  .container{padding:18px; max-width:1200px; margin:0 auto;}
  .banner{height:var(--band-h); display:flex;align-items:center;padding:0 var(--padding); color:#fff; gap:16px;}
  .brand{font-weight:700;font-size:22px;letter-spacing:0.2px}
  .title{font-size:28px;font-weight:800}
  .meta-small{font-size:13px;color:rgba(255,255,255,0.9)}
  .tabs{margin-top:18px;border-bottom:1px solid #e6e6e6;display:flex;gap:8px}
  .tab{padding:10px 14px;cursor:pointer;border-radius:6px 6px 0 0;background:#f6f6f6;color:#222}
  .tab.active{background:#fff;border:1px solid #e6e6e6;border-bottom:1px solid white}
  .panel{padding:14px;border:1px solid #e6e6e6;background:#fff}
  .row{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .label{width:140px;color:var(--muted);font-size:13px}
  .value{font-weight:600}
  .small-muted{font-size:13px;color:var(--muted)}
  .iframe-wrap{height:720px;border:1px solid #ddd;border-radius:6px;overflow:hidden}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .flag{display:inline-block;width:20px;height:14px;vertical-align:middle;margin-right:8px;border-radius:2px;background:#f0f0f0}
  .note{font-size:13px;color:#777;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <div id="banner" class="banner" style="background:var(--accent-hard)">
    <div>
      <div class="brand" id="tour-type">ATP</div>
      <div class="title" id="tourney-name">Brisbane</div>
      <div class="meta-small" id="tourney-sub">Hard • 250 • Jan 4, 2026</div>
    </div>
  </div>

  <div style="margin-top:12px">
    <div class="tabs">
      <div id="tab-info" class="tab active">Info</div>
      <div id="tab-draw" class="tab">Draw</div>
    </div>

    <div id="panel-info" class="panel">
      <div class="info-grid">
        <div>
          <div class="row"><div class="label">Tour</div><div class="value" id="meta-level"></div></div>
          <div class="row"><div class="label">Surface</div><div class="value" id="meta-surface"></div></div>
          <div class="row"><div class="label">Prize money</div><div class="value" id="meta-prize"></div></div>
          <div class="row"><div class="label">Draw (Singles)</div><div class="value" id="meta-draw"></div></div>
        </div>
        <div>
          <div class="row"><div class="label">Ville</div><div class="value" id="meta-city"></div></div>
          <div class="row"><div class="label">Pays</div><div class="value" id="meta-country"></div></div>
          <div class="row"><div class="label">Official title</div><div class="value" id="meta-title"></div></div>
          <div class="row"><div class="label">Source</div><div class="value" id="meta-source"></div></div>
        </div>
      </div>
      <div class="note">Si <strong>city</strong> ou <strong>country</strong> sont manquants pour un tournoi ATP, la page tente de les récupérer depuis <code>ioc_places_atp.json</code>.</div>
    </div>

    <div id="panel-draw" class="panel" style="display:none">
      <div style="margin-bottom:8px">
        <strong>Draw</strong> — le template chargé dépend de la taille du tableau.
      </div>
      <div class="iframe-wrap">
        <iframe id="draw-frame" src="about:blank" style="width:100%;height:100%;border:0"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
/*
  main.html
  - attend un JSON (simulate for dev, or replace by server-side injection)
  - si city/country vide et source=="ATP", va chercher ioc_places_atp.json (dans même dossier)
  - choisit quel template charger en iframe selon singles_draw_size
  - envoie le JSON au template via postMessage quand l'iframe est chargé
*/

/* === Exemple JSON (tu peux remplacer par un fetch depuis ton serveur) === */
const tournamentJson = {
  "meta": {
    "source": "ATP",
    "tourney_id": "339",
    "year": 2026,
    "tourney_name": "Brisbane",
    "tourney_title": "",
    "surface": "Hard",
    "level": "250",
    "prize_money": "800045",
    "prize_money_currency": "$",
    "singles_draw_size": 32,
    "city": "",
    "country": "",
    "start_date": "2026-01-04"
  },
  "matches": [
    {"match_id":"MS001","round":"Final","winner_player_name":"D. Medvedev","loser_player_name":"B. Nakashima","score_string":"6-2,7-6(1)","player_id_winner":"MM58","player_id_loser":"N0AE","winner_country":"RUS","loser_country":"USA","winner_seed":"1","loser_seed":""},
    {"match_id":"MS002","round":"Semifinals","winner_player_name":"D. Medvedev","loser_player_name":"A. Michelsen","score_string":"6-4,6-2","player_id_winner":"MM58","player_id_loser":"M0QI","winner_country":"RUS","loser_country":"USA","winner_seed":"1","loser_seed":""},
    {"match_id":"MS003","round":"Semifinals","winner_player_name":"B. Nakashima","loser_player_name":"A. Kovacevic","score_string":"6-7(4),4-6","player_id_winner":"N0AE","player_id_loser":"K0AZ","winner_country":"USA","loser_country":"USA","winner_seed":"","loser_seed":""}
    /* ... tronqué pour l'exemple ... */
  ]
};

/* ===== helpers ===== */
function surfaceToColor(surface){
  if(!surface) return 'var(--accent-hard)';
  const s = surface.toLowerCase();
  if(s.includes('hard')) return getComputedStyle(document.documentElement).getPropertyValue('--accent-hard');
  if(s.includes('clay')||s.includes('red')) return getComputedStyle(document.documentElement).getPropertyValue('--accent-clay');
  if(s.includes('grass')) return getComputedStyle(document.documentElement).getPropertyValue('--accent-grass');
  return getComputedStyle(document.documentElement).getPropertyValue('--accent-carpet');
}

/* remplissage du panneau info */
async function populateInfo(json){
  const meta = json.meta || {};
  // set banner
  const banner = document.getElementById('banner');
  banner.style.background = surfaceToColor(meta.surface);

  document.getElementById('tour-type').textContent = (meta.source || 'ATP').toUpperCase();
  document.getElementById('tourney-name').textContent = meta.tourney_name || ('Tourney ' + (meta.tourney_id||''));
  document.getElementById('tourney-sub').textContent = `${meta.surface || '-'} • ${meta.level || '-'} • ${meta.start_date || '-'}`;

  document.getElementById('meta-level').textContent = meta.level || '-';
  document.getElementById('meta-surface').textContent = meta.surface || '-';
  document.getElementById('meta-prize').textContent = (meta.prize_money_currency||'') + (meta.prize_money ? Number(meta.prize_money).toLocaleString() : '-');
  document.getElementById('meta-draw').textContent = meta.singles_draw_size || '-';
  document.getElementById('meta-source').textContent = meta.source || '-';
  document.getElementById('meta-title').textContent = meta.tourney_title || '-';

  // handle city/country lookup for ATP if missing
  let city = meta.city || '';
  let country = meta.country || '';
  if(meta.source && meta.source.toUpperCase()==='ATP' && (!city || !country)){
    try{
      const resp = await fetch('ioc_places_atp.json');
      if(resp.ok){
        const ioc = await resp.json();
        const id = String(meta.tourney_id);
        const year = String(meta.year);
        if(ioc[id] && ioc[id][year]){
          const arr = ioc[id][year];
          // structure: [city, country, official name]
          city = city || (arr[0] || '');
          country = country || (arr[1] || '');
          if(!meta.tourney_title && arr[2]) document.getElementById('meta-title').textContent = arr[2];
        }
      } else {
        console.warn('ioc_places_atp.json non trouvé (status ' + resp.status + ')');
      }
    }catch(err){
      console.warn('erreur fetch ioc_places_atp.json', err);
    }
  }

  document.getElementById('meta-city').textContent = city || '-';
  document.getElementById('meta-country').textContent = country || '-';
}

/* onglets */
const tabInfo = document.getElementById('tab-info');
const tabDraw = document.getElementById('tab-draw');
const panelInfo = document.getElementById('panel-info');
const panelDraw = document.getElementById('panel-draw');

tabInfo.addEventListener('click', ()=>{
  tabInfo.classList.add('active'); tabDraw.classList.remove('active');
  panelInfo.style.display='block'; panelDraw.style.display='none';
});
tabDraw.addEventListener('click', ()=>{
  tabDraw.classList.add('active'); tabInfo.classList.remove('active');
  panelInfo.style.display='none'; panelDraw.style.display='block';
  loadDrawTemplateAndSendData();
});

/* charge le bon template et envoie les données via postMessage */
function chooseTemplateForDraw(drawSize){
  if(drawSize <= 32) return 'template_5.html';
  if(drawSize <= 64) return 'template_6.html';
  return 'template_7.html';
}

let iframeReady = false;
function loadDrawTemplateAndSendData(){
  const iframe = document.getElementById('draw-frame');
  const drawSize = (tournamentJson.meta && tournamentJson.meta.singles_draw_size) ? Number(tournamentJson.meta.singles_draw_size) : 32;
  const templateName = chooseTemplateForDraw(drawSize);
  iframeReady = false;

  // set src to template
  iframe.src = templateName;

  // when iframe loaded, postMessage the whole JSON
  const onLoad = ()=>{
    iframeReady = true;
    try {
      iframe.contentWindow.postMessage({type:'tourney-data', payload: tournamentJson}, '*');
    } catch(e){
      console.warn('postMessage failed', e);
    }
    iframe.removeEventListener('load', onLoad);
  };
  iframe.addEventListener('load', onLoad);

  // also send again after 500ms in case iframe took longer to init
  setTimeout(()=>{ if(iframeReady===true) return; try{ iframe.contentWindow.postMessage({type:'tourney-data', payload: tournamentJson}, '*'); }catch(e){} }, 700);
}

/* initialisation */
document.addEventListener('DOMContentLoaded', async ()=>{
  await populateInfo(tournamentJson);
  // load draw template only when user opens the tab - but we can pre-load optionally
  // Preload small (optional):
  // loadDrawTemplateAndSendData();
});

/* optionally, allow server à appeler applyData en patchant tournamentJson et appelant populateInfo() et loadDraw... */
window.setTournamentData = function(json){
  if(!json) return;
  // shallow merge
  Object.assign(tournamentJson, json);
  if(json.meta) Object.assign(tournamentJson.meta, json.meta);
  populateInfo(tournamentJson);
  // if draw tab active, reload template
  if(tabDraw.classList.contains('active')) loadDrawTemplateAndSendData();
};
</script>
</body>
</html>

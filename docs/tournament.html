<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tournament — Center Court</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff}
  .hero{padding:18px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1200px;margin:12px auto;padding:0 12px}
  .flag{display:inline-block;width:22px;height:14px;margin-right:8px;vertical-align:middle;overflow:hidden;border-radius:2px;background:#f5f5f5}
  .flag img{width:100%;height:100%;object-fit:cover;display:block}
  .seed-num{float:left;width:28px;color:#0b3d91;font-size:11px;padding:2px 4px;font-weight:600;}
  .seed-text{float:left;width:28px;color:#808080;font-size:11px;padding:2px 4px;}
  .player-link { font-size:11px;text-decoration:none;color:black; display:inline-block; vertical-align:middle; }
  .player-first { font-size:11px;color:#565656;font-style:italic; margin-left:4px;}
  .bye { color:#808080;font-size:11px;padding-left:22px; }
  .highlight { background: rgba(255,235,59,0.15); }
  .match-row{ padding:0 4px; box-sizing:border-box; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:600px){
    .player-link{font-size:12px}
    .seed-num, .seed-text{font-size:12px}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="container-main">
    <h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1>
  </div>
</div>

<div class="container-main" style="padding-top:12px">
  <div id="bracketContainer" style="position:relative;border:0px solid transparent;min-height:200px;">
    <!-- contenu inséré par JS -->
  </div>
</div>

<script>
/* ---------- UTILITAIRES ---------- */

function slugify(name){
  if(!name) return '';
  // preserve accents -> normalize then remove diacritics for URL-friendliness
  name = name.trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const rest = parts.slice(1).join(',').trim();
    name = rest + ' ' + last;
  }
  // remove diacritics
  name = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
}

function highlight_player(mode, className){
  const els = document.querySelectorAll('.' + className);
  if(mode === 1) els.forEach(el => el.classList.add('highlight'));
  else els.forEach(el => el.classList.remove('highlight'));
}

function alpha2ToFlagEmoji(alpha2){
  if(!alpha2 || alpha2.length !== 2) return '';
  const A = 0x1F1E6;
  const chars = [...alpha2.toUpperCase()].map(ch => A + (ch.charCodeAt(0) - 65));
  try { return String.fromCodePoint(...chars); } catch(e){ return ''; }
}

/* mapping IOC/ISO3 -> alpha-2 */
const iocToAlpha2 = {
  "AFG":"AF","ALB":"AL","DZA":"DZ","AND":"AD","AGO":"AO","AIA":"AI","ATG":"AG","ARG":"AR","ARM":"AM",
  "AUS":"AU","AUT":"AT","AZE":"AZ","BHS":"BS","BHR":"BH","BGD":"BD","BRB":"BB","BLR":"BY","BEL":"BE",
  "BLZ":"BZ","BEN":"BJ","BMU":"BM","BTN":"BT","BOL":"BO","BIH":"BA","BWA":"BW","BRA":"BR","BRN":"BN",
  "BGR":"BG","BFA":"BF","BDI":"BI","CPV":"CV","KHM":"KH","CMR":"CM","CAN":"CA","CYM":"KY","CAF":"CF",
  "TCD":"TD","CHL":"CL","CHN":"CN","COL":"CO","COM":"KM","COG":"CG","COD":"CD","COK":"CK","CRI":"CR",
  "CIV":"CI","HRV":"HR","CUB":"CU","CYP":"CY","CZE":"CZ","DEN":"DK","DJI":"DJ","DMA":"DM","DOM":"DO",
  "ECU":"EC","EGY":"EG","SLV":"SV","GNQ":"GQ","ERI":"ER","EST":"EE","ETH":"ET","FRO":"FO","FJI":"FJ",
  "FIN":"FI","FRA":"FR","GAB":"GA","GMB":"GM","GEO":"GE","DEU":"DE","GHA":"GH","GIB":"GI","GRC":"GR",
  "GRD":"GD","GTM":"GT","GIN":"GN","GNB":"GW","GUY":"GY","HTI":"HT","HND":"HN","HKG":"HK","HUN":"HU",
  "ISL":"IS","IND":"IN","IDN":"ID","IRN":"IR","IRQ":"IQ","IRL":"IE","ISR":"IL","ITA":"IT","JAM":"JM",
  "JPN":"JP","JOR":"JO","KAZ":"KZ","KEN":"KE","KIR":"KI","PRK":"KP","KOR":"KR","KWT":"KW","KGZ":"KG",
  "LAO":"LA","LVA":"LV","LBN":"LB","LSO":"LS","LBR":"LR","LBY":"LY","LIE":"LI","LTU":"LT","LUX":"LU",
  "MAC":"MO","MDG":"MG","MWI":"MW","MYS":"MY","MDV":"MV","MLI":"ML","MLT":"MT","MHL":"MH","MTQ":"MQ",
  "MRT":"MR","MUS":"MU","MYT":"YT","MEX":"MX","FSM":"FM","MDA":"MD","MCO":"MC","MNG":"MN","MNE":"ME",
  "MAR":"MA","MOZ":"MZ","MMR":"MM","NAM":"NA","NRU":"NR","NPL":"NP","NLD":"NL","NCL":"NC","NZL":"NZ",
  "NIC":"NI","NER":"NE","NGA":"NG","NIU":"NU","NOR":"NO","OMN":"OM","PAK":"PK","PLW":"PW","PAN":"PA",
  "PNG":"PG","PRY":"PY","PER":"PE","PHI":"PH","POL":"PL","PRT":"PT","PRI":"PR","QAT":"QA","ROU":"RO",
  "RUS":"RU","RWA":"RW","KNA":"KN","LCA":"LC","VCT":"VC","WSM":"WS","SMR":"SM","STP":"ST","SAU":"SA",
  "SEN":"SN","SRB":"RS","SYC":"SC","SLE":"SL","SGP":"SG","SVK":"SK","SVN":"SI","SLB":"SB","SOM":"SO",
  "ZAF":"ZA","SSD":"SS","ESP":"ES","LKA":"LK","SDN":"SD","SUR":"SR","SWE":"SE","CHE":"CH","SYR":"SY",
  "TJK":"TJ","TZA":"TZ","THA":"TH","TTO":"TT","TUN":"TN","TUR":"TR","TKM":"TM","TCA":"TC","TUV":"TV",
  "UGA":"UG","UKR":"UA","ARE":"AE","GBR":"GB","USA":"US","URY":"UY","UZB":"UZ","VUT":"VU","VEN":"VE",
  "VNM":"VN","VIR":"VI","YEM":"YE","ZMB":"ZM","ZWE":"ZW","COK":"CK","SXM":"SX","BLM":"BL","MAF":"MF",
  "ALA":"AX","XKX":"XK"
};

const nameToAlpha2 = {
  "UNITED STATES":"US","UNITED KINGDOM":"GB","ENGLAND":"GB","RUSSIA":"RU","CHINA":"CN","UAE":"AE",
  "SOUTH KOREA":"KR","NORTH KOREA":"KP","SOUTH AFRICA":"ZA","IRAN":"IR","VENEZUELA":"VE"
};

function toAlpha2(input){
  if(!input) return '';
  let s = String(input).trim().toUpperCase();
  if(/^[A-Z]{2}$/.test(s)) return s;
  if(s.length === 3 && iocToAlpha2[s]) return iocToAlpha2[s];
  if(nameToAlpha2[s]) return nameToAlpha2[s];
  const letters = s.replace(/[^A-Z]/g,'');
  if(letters.length === 2) return letters;
  return '';
}

function makeFlagElem(countryInput){
  const alpha2 = toAlpha2(countryInput || '');
  const span = document.createElement('span');
  span.className = 'flag';
  if(alpha2){
    const code = alpha2.toLowerCase();
    const img = document.createElement('img');
    img.alt = alpha2;
    img.src = `https://flagcdn.com/w40/${code}.png`;
    img.onload = function(){};
    img.onerror = function(){
      try { img.remove(); } catch(e){}
      const emoji = alpha2ToFlagEmoji(alpha2);
      if(emoji){ span.textContent = emoji; }
      else { span.textContent = alpha2; span.style.fontSize='11px'; span.style.color='#666'; }
    };
    span.appendChild(img);
  } else {
    const txt = (countryInput ? String(countryInput).toUpperCase().slice(0,3) : '');
    span.textContent = txt;
    span.style.fontSize='11px'; span.style.color='#666';
  }
  return span;
}

function formatSeed(raw){
  if(raw === null || raw === undefined) return '';
  const s = String(raw).trim();
  if(s === '') return '';
  // some csv use "1.0" etc
  const n = parseFloat(s.replace(',', '.'));
  if(!isNaN(n) && Number.isInteger(n)) return String(n);
  if(!isNaN(n)) return String(n);
  // fallback to textual seed (e.g. "WC")
  return s;
}

function formatFirstInitial(fullFirst){
  if(!fullFirst) return '';
  const tokens = String(fullFirst).trim().split(/\s+/);
  if(tokens.length === 0) return '';
  return tokens[0].charAt(0).toUpperCase() + '.';
}

function splitNameToLastAndInitial(rawName){
  if(!rawName) return { last:'', firstInitial:'' };
  let name = String(rawName).trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const first = (parts[1] || '').trim();
    return { last: last, firstInitial: formatFirstInitial(first) };
  }
  const parts = name.split(/\s+/);
  if(parts.length === 1) return { last: parts[0], firstInitial: '' };
  const last = parts[parts.length - 1];
  const firstTokens = parts.slice(0, parts.length - 1).join(' ');
  return { last: last, firstInitial: formatFirstInitial(firstTokens) };
}

/* ---------- Extractions robustes (support multi-CSV keys) ---------- */

function getFieldVariant(obj, candidates){
  for(const k of candidates){
    if(obj.hasOwnProperty(k) && obj[k] !== null && obj[k] !== undefined){
      const v = obj[k];
      // treat empty string as missing
      if(typeof v === 'string' && v.trim() === '') continue;
      return v;
    }
  }
  return null;
}

function getPlayerName(match, side){
  // side = 'winner' or 'loser'
  const candidateKeys = side === 'winner' ? [
    'winner_player_name','winner','player_winner','player_a','playerA','player_a_name','player_winner_name',
    'playerAName','player_winner_full','player_winner_name'
  ] : [
    'loser_player_name','loser','player_loser','player_b','playerB','player_b_name','player_loser_name',
    'playerBName','player_loser_full','player_loser_name'
  ];
  const v = getFieldVariant(match, candidateKeys);
  if(!v) return '';
  return String(v).trim();
}

function getPlayerId(match, side){
  const candidateKeys = side === 'winner' ? [
    'player_id_winner','player_id_a','PlayerIDA','PlayerIDA2','PlayerID','playerAId','player_id_a'
  ] : [
    'player_id_loser','player_id_b','PlayerIDB','PlayerIDB2','playerBId','player_id_b'
  ];
  const v = getFieldVariant(match, candidateKeys);
  return v ? String(v).trim() : '';
}

function getCountry(match, side){
  const candidateKeys = side === 'winner' ? [
    'winner_country','winner_nationality','winner_country_code','country_winner','country_a','countryA','country_winner_code'
  ] : [
    'loser_country','loser_nationality','loser_country_code','country_loser','country_b','countryB','country_loser_code'
  ];
  const v = getFieldVariant(match, candidateKeys);
  return v ? String(v).trim() : '';
}

function getSeed(match, side){
  const candidateKeys = side === 'winner' ? [
    'winner_seed','seed_winner','seed_a','seedA','winnerSeed','seed_a'
  ] : [
    'loser_seed','seed_loser','seed_b','seedB','loserSeed','seed_b'
  ];
  const v = getFieldVariant(match, candidateKeys);
  return v === null ? '' : String(v).trim();
}

/* ---------- Round normalization & ranking ---------- */

function normalizeRoundLabel(raw){
  if(!raw) return '';
  let r = String(raw).trim();
  if(r === '') return '';
  const u = r.toUpperCase();
  // standard shortcuts
  if(u === 'S') return 'SF';
  if(u === 'Q') return 'QF';
  if(u === 'F' || u.startsWith('FINAL')) return 'F';
  if(u === 'SF' || u.startsWith('SEMIF')) return 'SF';
  if(u === 'QF' || u.startsWith('QUART')) return 'QF';
  // Rounds explicit like R16 or 'R32'
  const mR = u.match(/^R?(\d{1,3})$/);
  if(mR) return 'R' + mR[1];
  // sometimes they use just numbers '1','2','3','4' (WTA style) -> keep as raw number
  const mN = u.match(/^\d+$/);
  if(mN) return u;
  // fallback: return uppercase trimmed
  return u;
}

function getRoundRank(label, source){
  // label assumed normalized (use normalizeRoundLabel first)
  const u = (label||'').toString().toUpperCase();

  // ATP mapping: earliest rounds get lower rank number
  const atpOrder = ['R128','R64','R32','R16','R8','QF','SF','F'];
  const wtaOrder = ['1','2','3','4','QF','SF','F']; // user specified: 1..4 then Q then S then F

  // handle common R8 / R4 etc
  if(source === 'atp' || source === 'atp'.toLowerCase()){
    // try to match numeric Rxx
    if(u.startsWith('R')){
      const n = parseInt(u.slice(1),10);
      if(!isNaN(n)){
        // map by size: R128 -> index 0, R64 ->1, R32->2...
        if(n >= 128) return 1;
        if(n >= 64) return 2;
        if(n >= 32) return 3;
        if(n >= 16) return 4;
        if(n >= 8) return 5;
        return 1;
      }
    }
    if(u === 'QF' || u.includes('QUART')) return 5;
    if(u === 'SF' || u === 'S' || u.includes('SEMIF')) return 6;
    if(u === 'F' || u.startsWith('FINAL')) return 7;
    // fallback: use number of characters / heuristics
    return 0;
  } else {
    // default to WTA-style ranking (also used for 'wta' source)
    // numeric rounds '1','2','3','4'
    if(/^\d+$/.test(u)){
      // parse small ints
      const n = parseInt(u,10);
      // 1 is earliest => rank 1
      return n;
    }
    if(u === 'QF' || u.includes('QUART')) return 5;
    if(u === 'SF' || u === 'S' || u.includes('SEMIF')) return 6;
    if(u === 'F' || u.startsWith('FINAL')) return 7;
    return 0;
  }
}

/* ---------- MAIN RENDER ---------- */

async function render(){
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase(); // default wta per ton usage
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  if(!id || !year){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:#666">Missing tournament id or year. Use ?source=wta&t=2010&year=2019</div>';
    return;
  }

  const path = `/data/tournaments/${source}_${id}_${year}.json`;
  let json;
  try{
    const resp = await fetch(path);
    if(!resp.ok) throw new Error('JSON not found: ' + path);
    json = await resp.json();
  }catch(err){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:red">Error loading JSON: ' + err.message + '</div>';
    console.error(err); return;
  }

  document.getElementById('tourney-title').textContent = json.meta?.tourney_name || (source.toUpperCase() + ' ' + id);

  function norm(r){ return normalizeRoundLabel(r || ''); }

  const matches = (json.matches || []).map(m => Object.assign({}, m));
  const groups = {};
  matches.forEach(m => {
    const r = norm(m.round || m.round_label || m.round_name || m.stage || '');
    const label = r || 'Unknown';
    groups[label] = groups[label] || [];
    groups[label].push(m);
  });

  // Build an ordered list of rounds:
  // prefer sorting by explicit round rank; fallback to descending match count if rank ambiguous.
  const roundKeys = Object.keys(groups);
  // compute rank per round
  const ranks = {};
  roundKeys.forEach(k => {
    ranks[k] = getRoundRank(k, source);
  });
  // sort by rank ascending (earliest rounds left), if rank == 0 -> fallback to groups length desc to favour big cols left
  roundKeys.sort((a,b) => {
    const ra = ranks[a] || 0, rb = ranks[b] || 0;
    if(ra && rb) return ra - rb; // earlier rounds (smaller number) first
    if(ra && !rb) return -1;
    if(!ra && rb) return 1;
    // both zero -> fallback to length (more matches should be earlier)
    return groups[b].length - groups[a].length;
  });

  // layout constants
  const cellWidth = 220;
  const cellHeight = 20;
  const perMatchBlock = 60;
  const colGap = 40;

  // container sizing
  let maxBlocks = 0;
  roundKeys.forEach(r => { maxBlocks = Math.max(maxBlocks, groups[r].length); });
  const containerHeight = Math.max(220, maxBlocks * perMatchBlock + 60);
  const container = document.getElementById('bracketContainer');
  container.style.position = 'relative';
  container.style.height = containerHeight + 'px';
  container.innerHTML = '';

  const positionsByRound = [];

  // iterate rounds in the order we computed; DO NOT re-sort matches inside a round — preserve JSON order
  roundKeys.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd];

    const n = matchesInRound.length;
    const columnHeight = (n - 1) * perMatchBlock + cellHeight + 20;
    const topOffset = Math.max(10, Math.round((containerHeight - columnHeight) / 2));

    const prevPositions = colIndex > 0 ? positionsByRound[colIndex - 1] : null;
    const prevCount = prevPositions ? prevPositions.length : 0;
    const currCount = matchesInRound.length;

    const thisPositions = [];

    matchesInRound.forEach((m, j) => {
      let winnerTop;
      // if first column or no prev info -> grid
      if(colIndex === 0 || !prevPositions || prevCount === 0){
        winnerTop = topOffset + j * perMatchBlock;
      } else {
        // proportional mapping from prev -> current (works even for irregular brackets)
        let startIndex = Math.floor(j * prevCount / currCount);
        let endIndex = Math.floor(((j + 1) * prevCount) / currCount) - 1;
        if(endIndex < startIndex) endIndex = startIndex;
        if(startIndex < 0) startIndex = 0;
        if(endIndex < 0) endIndex = 0;
        if(startIndex >= prevCount) startIndex = prevCount - 1;
        if(endIndex >= prevCount) endIndex = prevCount - 1;

        let sum = 0, cnt = 0;
        for(let k = startIndex; k <= endIndex; k++){
          const prev = prevPositions[k];
          if(prev && typeof prev.winnerTop === 'number'){
            sum += prev.winnerTop;
            cnt++;
          }
        }
        if(cnt === 0){
          winnerTop = topOffset + j * perMatchBlock;
        } else {
          winnerTop = Math.round(sum / cnt);
        }
      }

      const loserTop = winnerTop + cellHeight;
      thisPositions.push({ winnerTop, loserTop, matchRef: m });

      const left = colIndex * (cellWidth + colGap);

      // Winner node
      const winnerDiv = document.createElement('div');
      const winnerId = getPlayerId(m, 'winner') || ('pwin_' + colIndex + '_' + j);
      const winnerClass = 'j_' + String(winnerId);
      winnerDiv.className = winnerClass + ' match-row';
      winnerDiv.setAttribute('onmouseover', `highlight_player(1, '${winnerClass}');`);
      winnerDiv.setAttribute('onmouseout', `highlight_player(2, '${winnerClass}');`);
      Object.assign(winnerDiv.style, {
        position:'absolute', top: winnerTop + 'px', left: left + 'px',
        height: cellHeight + 'px', width: cellWidth + 'px',
        borderTop: '1px solid rgb(121, 121, 121)', textAlign:'left', padding:'0 6px',
        display:'flex', alignItems:'center', gap:'6px'
      });

      const wseedRaw = getSeed(m, 'winner');
      const wseed = formatSeed(wseedRaw);
      const seedNode = document.createElement('div');
      if(wseed && /^\d+$/.test(wseed)) { seedNode.className='seed-num'; seedNode.textContent = wseed; }
      else { seedNode.className='seed-text'; seedNode.innerHTML = (wseed? wseed : '&nbsp;'); }
      winnerDiv.appendChild(seedNode);

      const wflagSpan = makeFlagElem(getCountry(m, 'winner'));
      winnerDiv.appendChild(wflagSpan);

      const wname = getPlayerName(m, 'winner');
      const { last: wlast, firstInitial: wfirstInitial } = splitNameToLastAndInitial(wname);
      const wAnchor = document.createElement('a');
      const wSlug = slugify(wname);
      const href = (getPlayerId(m, 'winner') ? `/player/${wSlug}/${getPlayerId(m, 'winner')}/` : '#');
      wAnchor.href = href;
      wAnchor.className = 'player-link';
      wAnchor.innerHTML = `<strong style="font-size:11px">${(wlast || '—').toUpperCase()}</strong><span class="player-first">${ wfirstInitial ? ', ' + wfirstInitial : '' }</span>`;
      winnerDiv.appendChild(wAnchor);
      container.appendChild(winnerDiv);

      // Loser node
      const loserDiv = document.createElement('div');
      const loserId = getPlayerId(m, 'loser') || ('plos_' + colIndex + '_' + j);
      const loserClass = 'j_' + String(loserId);
      loserDiv.className = loserClass + ' match-row';
      loserDiv.setAttribute('onmouseover', `highlight_player(1, '${loserClass}');`);
      loserDiv.setAttribute('onmouseout', `highlight_player(2, '${loserClass}');`);
      Object.assign(loserDiv.style, {
        position:'absolute', top: loserTop + 'px', left: left + 'px',
        height: cellHeight + 'px', width: cellWidth + 'px',
        borderBottom: '1px solid rgb(121, 121, 121)', textAlign:'left', padding:'0 6px',
        display:'flex', alignItems:'center', gap:'6px'
      });

      const lseedRaw = getSeed(m, 'loser');
      const lseed = formatSeed(lseedRaw);
      const seedNode2 = document.createElement('div');
      if(lseed && /^\d+$/.test(lseed)) { seedNode2.className='seed-num'; seedNode2.textContent = lseed; }
      else { seedNode2.className='seed-text'; seedNode2.innerHTML = (lseed? lseed : '&nbsp;'); }
      loserDiv.appendChild(seedNode2);

      const lflagSpan = makeFlagElem(getCountry(m, 'loser'));
      loserDiv.appendChild(lflagSpan);

      const lname = getPlayerName(m, 'loser');
      // BYE only when there is no valid name after trying many fields
      if(!lname || String(lname).trim() === ''){
        const byeSpan = document.createElement('span');
        byeSpan.className = 'bye';
        byeSpan.textContent = 'BYE';
        loserDiv.appendChild(byeSpan);
      } else {
        const { last: llast, firstInitial: lfirstInitial } = splitNameToLastAndInitial(lname);
        const lAnchor = document.createElement('a');
        const lSlug = slugify(lname);
        const lhref = (getPlayerId(m, 'loser') ? `/player/${lSlug}/${getPlayerId(m, 'loser')}/` : '#');
        lAnchor.href = lhref;
        lAnchor.className = 'player-link';
        lAnchor.innerHTML = `<strong style="font-size:11px">${(llast || '—').toUpperCase()}</strong><span class="player-first">${ lfirstInitial ? ', ' + lfirstInitial : '' }</span>`;
        loserDiv.appendChild(lAnchor);
      }
      container.appendChild(loserDiv);
    });

    positionsByRound.push(thisPositions);
  });

  // FIN
}

render();
</script>

</body>
</html>

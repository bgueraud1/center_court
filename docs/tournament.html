<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tournament — Center Court</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--hard:#2b6cb0;--clay:#c53030;--grass:#2f855a;--carpet:#6b46c1}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;color:#111;background:#f8f9fa}
    .hero{padding:28px;color:#fff}
    .container{max-width:1100px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .tabs{display:flex;gap:8px;margin-top:12px}
    .tab{padding:8px 12px;border-radius:6px;cursor:pointer}
    .tab.active{background:#eee}
    .finals-row{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer}
    .bracket{overflow:auto;padding:12px}
    .surface-pill { display:inline-block;padding:.25rem .5rem;border-radius:.25rem;color:#fff;font-weight:600 }
  </style>
</head>
<body>
  <div id="hero" class="hero" style="background:var(--hard)">
    <div class="container d-flex align-items-center justify-content-between">
      <div>
        <h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1>
        <div id="meta-small" style="opacity:.9;color:#fff"></div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="text-white small mb-0 me-2">Year</label>
        <select id="year" class="form-select form-select-sm"></select>
        <button id="show-draw" class="btn btn-light btn-sm ms-2">Show Draw</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <div id="tab-info" class="tab active">Info</div>
      <div id="tab-draw" class="tab">Draw</div>
    </div>

    <div id="content" class="mt-3">
      <div id="info" class="card">Loading...</div>
      <div id="draw" class="card" style="display:none">Draw will appear here</div>
    </div>
  </div>

<script>
  // utility
  function qs() { return new URLSearchParams(location.search); }
  function countryToFlagEmoji(countryName){
    if(!countryName) return '';
    const map = {'UNITED STATES':'US','UNITED KINGDOM':'GB','ENGLAND':'GB','FRANCE':'FR','SPAIN':'ES','RUSSIA':'RU','CZECH REPUBLIC':'CZ','CHINA':'CN','ITALY':'IT','POLAND':'PL','SWITZERLAND':'CH','UZBEKISTAN':'UZ','MOROCCO':'MA','ARGENTINA':'AR'};
    const k = countryName.toUpperCase().split(',')[0].trim();
    const code = map[k] || (k.length===2? k : null);
    if(!code) return '';
    return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  }
  const surfaceColor = {'Hard':'var(--hard)','Clay':'var(--clay)','Grass':'var(--grass)','Carpet':'var(--carpet)'};

  async function fetchJson(path){
    const r = await fetch(path);
    if(!r.ok) throw new Error('Not found: ' + path);
    return await r.json();
  }

  // Load tournament JSON
  async function loadTournament(source,id,year){
    const path = `/data/tournaments/${source}_${id}_${year}.json`;
    return await fetchJson(path);
  }

  function renderInfo(json){
    const meta = json.meta;
    const info = document.getElementById('info');
    info.innerHTML = `
      <h2>${meta.tourney_name || '—'}</h2>
      <div class="mb-2"><span class="surface-pill" style="background:${surfaceColor[meta.surface] || 'var(--hard)'}">${meta.surface || 'Hard'}</span></div>
      <p><strong>Official name:</strong> ${meta.tourney_title || '—'}</p>
      <p><strong>City:</strong> ${meta.city || '—'}</p>
      <p><strong>Country:</strong> ${meta.country || '—'}</p>
      <p><strong>Category:</strong> ${meta.level || '—'}</p>
      <p><strong>Prize money:</strong> ${meta.prize_money || '—'} ${meta.prize_money_currency || ''}</p>
      <p><strong>Draw size:</strong> ${meta.singles_draw_size || '—'}</p>
      <h5 class="mt-3">Palmarès (Finals)</h5>
      <div id="palmares"></div>
    `;

    // finals detection: rounds starting with F (case-insensitive) or equal 'Final' or 'F'
    const finals = json.matches.filter(m => (m.round||'').toLowerCase().startsWith('f'));
    const pal = document.getElementById('palmares');
    if(finals.length === 0){
      pal.innerHTML = '<div class="text-muted">No final recorded</div>';
      return;
    }
    finals.forEach(f => {
      const year = json.meta.year;
      const winner = f.winner_player_name || '—';
      const loser = f.loser_player_name || '—';
      const score = f.score_string || '';
      const row = document.createElement('div');
      row.className = 'finals-row';
      row.innerHTML = `<div>${year}</div><div>${countryToFlagEmoji(json.meta.country)} <strong>${winner}</strong> — ${countryToFlagEmoji(json.meta.country)} ${loser}</div><div>${score}</div>`;
      row.addEventListener('click', () => { showTab('draw'); window.scrollTo(0,0); });
      pal.appendChild(row);
    });
  }

  function showTab(name){
    document.getElementById('tab-info').classList.toggle('active', name==='info');
    document.getElementById('tab-draw').classList.toggle('active', name==='draw');
    document.getElementById('info').style.display = name==='info' ? 'block' : 'none';
    document.getElementById('draw').style.display = name==='draw' ? 'block' : 'none';
  }

  function renderDraw(json){
    const matches = json.matches || [];
    const drawEl = document.getElementById('draw');
    drawEl.innerHTML = '';
    if(!matches.length){
      drawEl.innerHTML = '<div class="p-3 text-muted">No matches available</div>';
      return;
    }

    // Group by round (maintain typical order if present)
    const knownOrder = ['F','SF','QF','R16','R32','R64','R128','S','Q','4','3','2','1'];
    const groups = {};
    matches.forEach(m => {
      const r = (m.round || '').toUpperCase() || 'UNKNOWN';
      groups[r] = groups[r] || [];
      groups[r].push(m);
    });

    let order = [];
    knownOrder.forEach(k => { if(groups[k]) order.push(k); });
    Object.keys(groups).forEach(k => { if(!order.includes(k)) order.push(k); });

    const container = document.createElement('div');
    container.className = 'bracket d-flex';
    container.style.gap = '12px';

    order.forEach(r => {
      const col = document.createElement('div');
      col.style.minWidth = '220px';
      const title = document.createElement('h5'); title.textContent = r; col.appendChild(title);
      groups[r].forEach(m => {
        const item = document.createElement('div');
        item.style.padding = '8px';
        item.style.borderBottom = '1px solid #eee';
        item.innerHTML = `<div><strong>${m.winner_player_name || '—'}</strong></div><div>${m.loser_player_name || '—'}</div><div style="opacity:.7">${m.score_string || ''}</div>`;
        col.appendChild(item);
      });
      container.appendChild(col);
    });

    drawEl.appendChild(container);
  }

  (async function(){
    const params = qs();
    const source = (params.get('source') || 'atp').toLowerCase();
    const id = params.get('t') || params.get('id') || '';
    const yearParam = params.get('year');

    // load index to populate year select
    try {
      const idx = await fetchJson('/data/tournaments/tournaments_index.json');
      const key = `${source}_${id}`;
      const years = idx[key] ? idx[key].slice().sort((a,b)=>b-a) : [];
      const yearSelect = document.getElementById('year');
      if(years.length === 0 && yearParam){
        // fallback: if index doesn't know but year provided, add it
        years.push(Number(yearParam));
      }
      if(years.length === 0){
        yearSelect.innerHTML = '<option>—</option>';
      } else {
        years.forEach(y => {
          const opt = document.createElement('option'); opt.value = y; opt.textContent = y;
          yearSelect.appendChild(opt);
        });
      }

      // choose initial year: query param > latest
      const initialYear = yearParam || (years[0] || '');
      if(initialYear) yearSelect.value = initialYear;

      async function loadAndRender(y){
        try {
          const json = await loadTournament(source,id,y);
          document.getElementById('tourney-title').textContent = json.meta.tourney_name || `${source.toUpperCase()} ${id}`;
          document.getElementById('meta-small').textContent = `${json.meta.city || ''} ${json.meta.country ? '• ' + json.meta.country : ''}`;
          const col = surfaceColor[json.meta.surface] || 'var(--hard)';
          document.getElementById('hero').style.background = col;
          renderInfo(json);
          renderDraw(json);
        } catch (err) {
          document.getElementById('info').innerText = 'Error loading tournament: ' + err.message;
          document.getElementById('draw').innerHTML = '';
          console.error(err);
        }
      }

      // initial load
      if(initialYear) await loadAndRender(initialYear);

      yearSelect.addEventListener('change', async (e) => {
        const y = e.target.value;
        // update URL
        const u = new URL(location);
        u.searchParams.set('year', y);
        history.replaceState({}, '', u.toString());
        await loadAndRender(y);
      });

      document.getElementById('tab-info').addEventListener('click', () => showTab('info'));
      document.getElementById('tab-draw').addEventListener('click', () => showTab('draw'));
      document.getElementById('show-draw').addEventListener('click', () => showTab('draw'));

    } catch (err) {
      document.getElementById('info').innerText = 'Error: ' + err.message;
      console.error(err);
    }
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

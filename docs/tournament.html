<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bracket — single mid-block winner (fixed)</title>
<style>
  :root{
    --winner-h:22px;
    --loser-h:22px;
    --midblock-h:38px;
    --match-gap:52px;
    --col-gap:34px;
    --col-width:220px;
    --col-width-small:140px;
    --midblock-width:160px;
    --line-color:#797979;
    --seed-blue:#0b3d91;
    --mid-offset: 220px; /* ajuste ici le décalage horizontal du mid-block */
  }

  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
  .hero{padding:14px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1400px;margin:12px auto;padding:0 12px}
  #bracketContainer{position:relative;background:transparent;overflow:visible}

  /* flags */
  .flag{display:inline-block;width:22px;height:14px;margin-right:8px;vertical-align:middle;overflow:hidden;border-radius:2px;background:#f5f5f5;line-height:14px;text-align:center}
  .flag img{width:100%;height:100%;object-fit:cover;display:block}

  /* seeds */
  .seed-num{float:left;width:22px;color:var(--seed-blue);font-size:11px;padding:2px 4px;font-weight:700;}
  .seed-text{float:left;width:22px;color:#808080;font-size:11px;padding:2px 4px;}

  .player-link{font-size:11px;text-decoration:none;color:#000;display:inline-block;vertical-align:middle}
  .player-first{font-size:11px;color:#565656;font-style:italic;margin-left:4px}
  .bye{color:#808080;font-size:11px;padding-left:22px}

  /* rows for players (absolute) */
  .match-row{box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;background:#fff;z-index:5;position:absolute;display:flex;align-items:center;gap:6px;}
  .row-top{height:var(--winner-h); border-top:1px solid var(--line-color);}   /* top border above upper player */
  .row-bottom{height:var(--loser-h); border-bottom:1px solid var(--line-color);}/* bottom border below lower player */

  /* mid block placed at mid-axis; contains winner above line and score below */
  .mid-block{position:absolute;height:var(--midblock-h);width:var(--midblock-width);text-align:center;transform:none;z-index:70;background:#fff;pointer-events:auto;margin-left:0;display:flex;flex-direction:column;justify-content:center;align-items:center;box-sizing:border-box}
  .mid-winner{font-size:11px;font-weight:700;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;display:flex;align-items:center;gap:6px}
  .mid-bar{height:1px;background:var(--line-color);width:100%;margin:2px 0;}
  .mid-score{font-size:11px;color:#515151;font-style:italic;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}

  /* svg connectors behind everything */
  .connectors{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none}

  .highlight{background: rgba(255,235,59,0.15) !important}

  @media (max-width:900px){
    :root{ --col-width:160px; --col-width-small:120px; --match-gap:36px; --midblock-width:120px; }
  }
</style>
</head>
<body>
  <div class="hero"><div class="container-main"><h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1></div></div>
  <div class="container-main" style="padding-top:12px">
    <div id="bracketContainer" style="min-height:640px"></div>
  </div>

<script>
/* ---------- utilitaires ---------- */
const iocToAlpha2 = {"ITA":"IT","ARG":"AR","FRA":"FR","HKG":"HK","CAN":"CA","NED":"NL","RUS":"RU","USA":"US","POR":"PT","CHN":"CN","JPN":"JP","KAZ":"KZ"};
const nameToAlpha2 = {"UNITED STATES":"US","UNITED KINGDOM":"GB","ENGLAND":"GB","RUSSIA":"RU","CHINA":"CN"};
function toAlpha2(input){ if(!input) return ''; let s=String(input).trim().toUpperCase(); if(/^[A-Z]{2}$/.test(s)) return s; if(s.length===3 && iocToAlpha2[s]) return iocToAlpha2[s]; if(nameToAlpha2[s]) return nameToAlpha2[s]; const letters = s.replace(/[^A-Z]/g,''); if(letters.length===2) return letters; return ''; }
function alpha2ToFlagEmoji(alpha2){ if(!alpha2 || alpha2.length!==2) return ''; const A=0x1F1E6; const chars=[...alpha2.toUpperCase()].map(ch=>A+(ch.charCodeAt(0)-65)); try{return String.fromCodePoint(...chars);}catch(e){return'';} }
function makeFlagElem(countryInput){ const alpha2 = toAlpha2(countryInput||''); const span = document.createElement('span'); span.className='flag'; if(alpha2){ const code = alpha2.toLowerCase(); const img = document.createElement('img'); img.alt=alpha2; img.src = `https://flagcdn.com/w40/${code}.png`; img.onload=()=>{}; img.onerror=()=>{ img.remove(); const emoji=alpha2ToFlagEmoji(alpha2); if(emoji) span.textContent=emoji; else { span.textContent=alpha2; span.style.fontSize='11px'; span.style.color='#666'; } }; span.appendChild(img); } else { span.textContent = countryInput ? String(countryInput).toUpperCase().slice(0,3) : ''; span.style.fontSize='11px'; span.style.color='#666'; } return span; }
function slugify(name){ if(!name) return ''; name = name.trim(); if(name.indexOf(',')!==-1){ const parts=name.split(','); const last=parts[0].trim(); const rest=parts.slice(1).join(',').trim(); name = rest + ' ' + last; } return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-'); }
function formatSeed(raw){ if(raw===null||raw===undefined) return ''; const n = typeof raw==='number' ? raw : parseFloat(String(raw).trim().replace(',','.')); if(isNaN(n)){ const s=String(raw).trim(); return s.length? s : ''; } if(Number.isInteger(n)) return String(n); return String(n); }
function formatFirstInitial(fullFirst){ if(!fullFirst) return ''; const tokens=String(fullFirst).trim().split(/\s+/); return tokens.length? tokens[0].charAt(0).toUpperCase()+'.':''; }
function splitNameToLastAndInitial(rawName){ if(!rawName) return {last:'', firstInitial:''}; let name=String(rawName).trim(); if(name.indexOf(',')!==-1){ const parts=name.split(','); const last=parts[0].trim(); const first=(parts[1]||'').trim(); return {last:last, firstInitial:formatFirstInitial(first)} } const parts=name.split(/\s+/); if(parts.length===1) return {last:parts[0], firstInitial:''}; const last=parts[parts.length-1]; const firstTokens=parts.slice(0,parts.length-1).join(' '); return {last:last, firstInitial:formatFirstInitial(firstTokens)} }
function isValidMatchId(mid){ if(!mid) return false; const s=String(mid).trim().toUpperCase(); return /^[ML]S\d{3}$/.test(s); }
function matchIdNumber(mid){ if(!mid) return Number.MAX_SAFE_INTEGER; const m=String(mid).toUpperCase().match(/^[ML]S0*([0-9]+)$/); if(m && m[1]) return parseInt(m[1],10); const d=String(mid).match(/\d+/); return d? parseInt(d[0],10) : Number.MAX_SAFE_INTEGER; }
function scoreToHtml(s){ if(!s) return ''; return String(s).replace(/(\d+)\((\d+)\)/g,'$1<sup>$2</sup>'); }
function highlight_player(mode, className){ const els=document.querySelectorAll('.' + className); if(mode===1) els.forEach(e=>e.classList.add('highlight')); else els.forEach(e=>e.classList.remove('highlight')); }

/* ---------- render principal ---------- */
async function render(){
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase();
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  if(!id || !year){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:#666">Missing tournament id or year. Use ?source=wta&t=528&year=2025</div>';
    return;
  }

  const path = `/data/tournaments/${source}_${id}_${year}.json`;
  let json;
  try{
    const resp = await fetch(path);
    if(!resp.ok) throw new Error('JSON not found: ' + path);
    json = await resp.json();
  }catch(err){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:red">Error loading JSON: ' + err.message + '</div>';
    console.error(err); return;
  }

  document.getElementById('tourney-title').textContent = json.meta?.tourney_name || (source.toUpperCase() + ' ' + id);

  function norm(r){ if(!r) return 'Unknown'; r=r.trim(); const u=r.toUpperCase(); if(u==='F' || u.startsWith('FINAL')) return 'F'; if(u==='SF' || u.startsWith('SEMIF')) return 'SF'; if(u==='QF' || u.startsWith('QUART')) return 'QF'; return u; }

  const rawMatches = (json.matches || []).map(m => Object.assign({}, m));
  const matches = rawMatches.filter(m => isValidMatchId(m.match_id));
  const groups = {}; matches.forEach(m => { const r = norm(m.round || ''); groups[r] = groups[r] || []; groups[r].push(m); });
  const rounds = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);

  const winnerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--winner-h')) || 22;
  const loserH  = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--loser-h')) || 22;
  const midH     = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--midblock-h')) || 38;
  const matchGap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--match-gap')) || 52;
  const colGap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col-gap')) || 34;
  const colWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col-width')) || 220;
  const colWidthSmall = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col-width-small')) || 140;
  const midWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--midblock-width')) || 160;

  let maxBlocks = 0; rounds.forEach(r => { maxBlocks = Math.max(maxBlocks, groups[r].length); });
  const perMatchBlock = (winnerH + midH + loserH) + matchGap;
  const containerHeight = Math.max(640, maxBlocks * perMatchBlock + 80);
  const container = document.getElementById('bracketContainer');
  container.style.height = containerHeight + 'px';
  container.innerHTML = '';

  // SVG overlay
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','connectors'); svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  svg.style.position='absolute'; svg.style.left='0'; svg.style.top='0'; svg.style.zIndex='2';
  container.appendChild(svg);

  const positionsByRound = [];

  rounds.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd].slice();
    matchesInRound.sort((a,b) => matchIdNumber(a.match_id) - matchIdNumber(b.match_id));
    const n = matchesInRound.length;
    const columnHeight = (n - 1) * perMatchBlock + (winnerH + midH + loserH) + 20;
    const topOffset = Math.max(8, Math.round((containerHeight - columnHeight) / 2));
    const prevPositions = colIndex > 0 ? positionsByRound[colIndex - 1] : null;
    const prevCount = prevPositions ? prevPositions.length : 0;
    const currCount = matchesInRound.length;
    const thisPositions = [];

    matchesInRound.forEach((m, j) => {
      let topBlock;
      if(colIndex === 0){
        topBlock = topOffset + j * perMatchBlock;
      } else {
        let startIndex = Math.floor(j * prevCount / currCount);
        let endIndex = Math.floor(((j+1) * prevCount) / currCount) - 1;
        if(endIndex < startIndex) endIndex = startIndex;
        if(startIndex >= prevCount) startIndex = prevCount - 1;
        if(endIndex >= prevCount) endIndex = prevCount - 1;
        let sum=0,cnt=0;
        for(let k=startIndex;k<=endIndex;k++){
          if(prevPositions[k]){ sum += prevPositions[k].center; cnt++; }
        }
        if(cnt===0) topBlock = topOffset + j * perMatchBlock;
        else topBlock = Math.round(sum/cnt) - Math.floor((winnerH + midH + loserH)/2);
      }

      const topRowTop = topBlock;
      const midTop = topRowTop + winnerH;
      const bottomRowTop = midTop + midH;
      const bottomRowBottom = bottomRowTop + loserH;
      const center = Math.round((topRowTop + bottomRowBottom) / 2);

      const colLeft = colIndex === 0 ? 0 : colIndex * (colWidthSmall + colGap) + (colWidth - colWidthSmall);
      const left = colLeft;
      const width = colIndex === 0 ? colWidth : colWidthSmall;

      const wId = m.player_id_winner || ('pwin_'+colIndex+'_'+j);
      const lId = m.player_id_loser || ('plos_'+colIndex+'_'+j);
      const wClass = 'j_' + String(wId);
      const lClass = 'j_' + String(lId);

      /* --- TOP ROW (placeholder/full only for leftmost col) --- */
      const topDiv = document.createElement('div');
      topDiv.className = wClass + ' match-row row-top';
      topDiv.style.top = topRowTop + 'px';
      topDiv.style.left = left + 'px';
      topDiv.style.height = winnerH + 'px';
      topDiv.style.width = width + 'px';
      topDiv.setAttribute('onmouseover', `highlight_player(1,'${wClass}'); highlight_player(1,'${lClass}');`);
      topDiv.setAttribute('onmouseout',  `highlight_player(2,'${wClass}'); highlight_player(2,'${lClass}');`);

      if(colIndex === 0){
        // leftmost column: render full player info
        const wseedRaw = m.winner_seed || m.winnerSeed || '';
        const wseed = formatSeed(wseedRaw);
        const seedNode = document.createElement('div');
        if(wseed && /^\d+$/.test(wseed)){ seedNode.className='seed-num'; seedNode.textContent = wseed; }
        else { seedNode.className='seed-text'; seedNode.innerHTML = (wseed ? wseed : '\u00A0'); }
        topDiv.appendChild(seedNode);
        topDiv.appendChild(makeFlagElem(m.winner_country || m.winner_nationality || m.winner_country_code || ''));
        const wname = m.winner_player_name || m.winner_name || '';
        const { last: wlast, firstInitial: wfirstInitial } = splitNameToLastAndInitial(wname);
        const wA = document.createElement('a'); wA.href = m.player_id_winner ? `/player/${slugify(wname)}/${m.player_id_winner}/` : '#';
        wA.className = 'player-link';
        wA.innerHTML = `<strong style="font-size:11px">${(wlast||'—').toUpperCase()}</strong><span class="player-first">${ wfirstInitial ? ', ' + wfirstInitial : '' }</span>`;
        topDiv.appendChild(wA);
      } else {
        // Not leftmost: DO NOT render name/flag/seed here — leave placeholder to keep border alignment
        topDiv.innerHTML = '&nbsp;'; // empty placeholder (no content -> avoids duplication)
      }
      container.appendChild(topDiv);

      /* --- BOTTOM ROW (loser row) --- */
      const bottomDiv = document.createElement('div');
      bottomDiv.className = lClass + ' match-row row-bottom';
      bottomDiv.style.top = bottomRowTop + 'px';
      bottomDiv.style.left = left + 'px';
      bottomDiv.style.height = loserH + 'px';
      bottomDiv.style.width = width + 'px';
      bottomDiv.setAttribute('onmouseover', `highlight_player(1,'${lClass}');`);
      bottomDiv.setAttribute('onmouseout',  `highlight_player(2,'${lClass}');`);

      // For bottom row we keep the loser only in the leftmost column (first round). For other columns we keep placeholder.
      if(colIndex === 0){
        const lseedRaw = m.loser_seed || m.loserSeed || '';
        const lseed = formatSeed(lseedRaw);
        const seedNode2 = document.createElement('div');
        if(lseed && /^\d+$/.test(lseed)){ seedNode2.className='seed-num'; seedNode2.textContent = lseed; }
        else { seedNode2.className='seed-text'; seedNode2.innerHTML = (lseed? lseed : '\u00A0'); }
        bottomDiv.appendChild(seedNode2);
        bottomDiv.appendChild(makeFlagElem(m.loser_country || m.loser_nationality || m.loser_country_code || ''));
        const lname = m.loser_player_name || m.loser_name || '';
        if(!lname || /^BYE$/i.test(lname)){
          const byeSpan = document.createElement('span'); byeSpan.className='bye'; byeSpan.textContent='BYE'; bottomDiv.appendChild(byeSpan);
        } else {
          const { last: llast, firstInitial: lfirstInitial } = splitNameToLastAndInitial(lname);
          const lA = document.createElement('a'); lA.href = m.player_id_loser ? `/player/${slugify(lname)}/${m.player_id_loser}/` : '#';
          lA.className = 'player-link';
          lA.innerHTML = `<strong style="font-size:11px">${(llast||'—').toUpperCase()}</strong><span class="player-first">${ lfirstInitial ? ', ' + lfirstInitial : '' }</span>`;
          bottomDiv.appendChild(lA);
        }
      } else {
        bottomDiv.innerHTML = '&nbsp;'; // placeholder only
      }
      container.appendChild(bottomDiv);

      /* --- MID-BLOCK : unique winner representation --- */
      const midOffsetCss = getComputedStyle(document.documentElement).getPropertyValue('--mid-offset') || '0px';
      const midOffsetPx = parseInt(midOffsetCss, 10) || 0;
      const prevColRight = (colIndex === 0)
        ? (left + width)
        : ((colIndex - 1) * (colWidthSmall + colGap) + (colWidth - colWidthSmall) + ((colIndex - 1) === 0 ? colWidth : colWidthSmall));
      const midX = Math.round((prevColRight + left) / 2) + midOffsetPx;

      const midBlock = document.createElement('div');
      midBlock.className = 'mid-block';
      midBlock.style.left = midX + 'px';
      midBlock.style.top = (center - Math.round(midH / 2)) + 'px';
      midBlock.style.width = midWidth + 'px';
      midBlock.style.marginLeft = (-Math.round(midWidth/2)) + 'px';

      // winner area (seed + flag + link) inside mid-block — THIS is the authoritative winner display
      const wname_full = m.winner_player_name || m.winner_name || '';
      const winnerHref = m.player_id_winner ? `/player/${slugify(wname_full)}/${m.player_id_winner}/` : '#';
      const winnerContain = document.createElement('a');
      winnerContain.href = winnerHref;
      winnerContain.style.textDecoration = 'none';
      winnerContain.style.color = 'inherit';
      winnerContain.className = 'mid-winner player-link';

      // seed
      const wseedRaw2 = m.winner_seed || m.winnerSeed || '';
      const wseed2 = formatSeed(wseedRaw2);
      if(wseed2 && /^\d+$/.test(wseed2)){
        const sn = document.createElement('div'); sn.className='seed-num'; sn.textContent = wseed2; winnerContain.appendChild(sn);
      } else {
        const sn2 = document.createElement('div'); sn2.className='seed-text'; sn2.innerHTML = (wseed2 ? wseed2 : '\u00A0'); winnerContain.appendChild(sn2);
      }

      // flag
      winnerContain.appendChild(makeFlagElem(m.winner_country || m.winner_nationality || m.winner_country_code || ''));

      // name
      const { last: wlast2, firstInitial: wfirstInitial2 } = splitNameToLastAndInitial(wname_full);
      const nameSpan = document.createElement('strong');
      nameSpan.style.fontSize = '11px';
      nameSpan.textContent = (wlast2 || '—').toUpperCase();
      winnerContain.appendChild(nameSpan);
      if(wfirstInitial2){
        const fi = document.createElement('span'); fi.className='player-first'; fi.textContent = ', ' + wfirstInitial2; winnerContain.appendChild(fi);
      }
      midBlock.appendChild(winnerContain);

      // bar and score
      const midBar = document.createElement('div'); midBar.className='mid-bar'; midBlock.appendChild(midBar);
      const scoreLabel = document.createElement('div'); scoreLabel.className='mid-score';
      scoreLabel.innerHTML = scoreToHtml(m.score_string || m.score || '') || '\u00A0';
      midBlock.appendChild(scoreLabel);

      // hover behaviour
      midBlock.onmouseover = () => { highlight_player(1, wClass); highlight_player(1, lClass); };
      midBlock.onmouseout  = () => { highlight_player(2, wClass); highlight_player(2, lClass); };

      container.appendChild(midBlock);

      thisPositions.push({ topRowTop, midTop, bottomRowTop, bottomRowBottom, center, left, width, midX, midTop, midBottom: midTop + midH, matchRef: m });
    });

    positionsByRound.push(thisPositions);
  });

  /* draw connectors (improved: route via midpoint and target parent's mid center) */
  function drawPolyline(points, strokeWidth){
    // remove duplicate consecutive points
    const reduced = points.filter((p,i,arr) => { if(i===0) return true; const prev = arr[i-1]; return !(prev[0]===p[0] && prev[1]===p[1]); });
    if(reduced.length < 2) return;
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('points', reduced.map(p => (p[0] + ',' + p[1])).join(' '));
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--line-color') || '#797979');
    poly.setAttribute('stroke-width', (strokeWidth || 1));
    poly.setAttribute('stroke-linecap','square');
    poly.setAttribute('stroke-linejoin','miter');
    svg.appendChild(poly);
  }

  for(let colIndex=0; colIndex<positionsByRound.length - 1; colIndex++){
    const children = positionsByRound[colIndex];
    const parents = positionsByRound[colIndex + 1];
    if(!children || !parents) continue;
    for(let i=0;i<children.length;i++){
      const child = children[i];
      const parentIndex = Math.floor(i * parents.length / children.length);
      const parent = parents[parentIndex];
      if(!parent) continue;

      const childX = child.midX;
      const childY = child.center;
      const parentX = parent.midX || Math.round(parent.left + parent.width/2);
      const parentY = parent.center;

      // skip degenerate very-short connectors
      if(Math.abs(childX - parentX) < 2 && Math.abs(childY - parentY) < 2) continue;

      // route via vertical/horizontal L-shape using an intermediate X (midpoint) to avoid broken lines
      const midX = Math.round((childX + parentX) / 2);
      const pts = [ [childX, childY], [midX, childY], [midX, parentY], [parentX, parentY] ];
      drawPolyline(pts, 1);
    }
  }

} // end render
render();
</script>
</body>
</html>

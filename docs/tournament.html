<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bracket — avec score sous la barre</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff}
  .hero{padding:18px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1200px;margin:12px auto;padding:0 12px}

  /* flag wrapper */
  .flag{display:inline-block;width:22px;height:14px;margin-right:8px;vertical-align:middle;overflow:hidden;border-radius:2px;background:#f5f5f5}
  .flag img{width:100%;height:100%;object-fit:cover;display:block}

  /* seed */
  .seed-num{float:left;width:28px;color:#0b3d91;font-size:11px;padding:2px 4px;font-weight:700;}
  .seed-text{float:left;width:28px;color:#808080;font-size:11px;padding:2px 4px;}

  .player-link { font-size:11px;text-decoration:none;color:black; display:inline-block; vertical-align:middle; }
  .player-first { font-size:11px;color:#565656;font-style:italic; margin-left:4px;}
  .bye { color:#808080;font-size:11px;padding-left:22px; }

  /* highlight on hover */
  .highlight { background: rgba(255,235,59,0.15); }

  /* rows */
  .match-row{ box-sizing:border-box; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; padding:0 6px; }
  .player-row { height:100%; align-items:center; }
  .player-row.winner { border-bottom:1px solid #797979; } /* barre sous le nom */
  .player-row.loser  { /* no top border */ }

  .score-row { font-size:11px; color:#515151; font-style:italic; padding-left:36px; display:flex; align-items:center; }

  @media (max-width:600px){
    .player-link{font-size:12px}
    .seed-num, .seed-text{font-size:12px}
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="container-main">
      <h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1>
    </div>
  </div>

  <div class="container-main" style="padding-top:12px">
    <div id="bracketContainer" style="position:relative;border:0px solid transparent;min-height:400px;"></div>
  </div>

<script>
/* utilitaires (slugify, flags, seed formatting, split noms...) */
function slugify(name){
  if(!name) return '';
  name = name.trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const rest = parts.slice(1).join(',').trim();
    name = rest + ' ' + last;
  }
  return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
}
function formatSeed(raw){
  if(raw === null || raw === undefined) return '';
  const n = typeof raw === 'number' ? raw : parseFloat(String(raw).trim().replace(',', '.'));
  if(isNaN(n)) { const s = String(raw).trim(); return s.length ? s : ''; }
  if(Number.isInteger(n)) return String(n);
  return String(n);
}
function formatFirstInitial(fullFirst){
  if(!fullFirst) return '';
  const tokens = String(fullFirst).trim().split(/\s+/);
  if(tokens.length === 0) return '';
  return tokens[0].charAt(0).toUpperCase() + '.';
}
function splitNameToLastAndInitial(rawName){
  if(!rawName) return { last:'', firstInitial:'' };
  let name = String(rawName).trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const first = (parts[1] || '').trim();
    return { last: last, firstInitial: formatFirstInitial(first) };
  }
  const parts = name.split(/\s+/);
  if(parts.length === 1) return { last: parts[0], firstInitial: '' };
  const last = parts[parts.length - 1];
  const firstTokens = parts.slice(0, parts.length - 1).join(' ');
  return { last: last, firstInitial: formatFirstInitial(firstTokens) };
}

/* minimal flag fallback (if you want the flagcdn logic, plug it back) */
function makeFlagElem(countryInput){
  const span = document.createElement('span');
  span.className = 'flag';
  span.textContent = countryInput ? String(countryInput).slice(0,2) : '';
  span.style.fontSize='10px'; span.style.color='#666';
  return span;
}

/* highlight function (used by onmouseover attrs) */
function highlight_player(mode, className){
  const els = document.querySelectorAll('.' + className);
  if(mode === 1) els.forEach(e=>e.classList.add('highlight'));
  else els.forEach(e=>e.classList.remove('highlight'));
}

/* ---------- rendering ---------- */
async function render(){
  // pour tester rapidement tu peux remplacer fetch par une variable JSON locale
  // paramètres de layout (taille des lignes)
  const winnerRowH = 20;
  const scoreRowH  = 18;
  const loserRowH  = 20;
  const matchBlockH = winnerRowH + scoreRowH + loserRowH; // bloc logique
  const verticalGapBetweenBlocks = 18; // espace entre blocs (évite écrasement)
  const perMatchBlock = matchBlockH + verticalGapBetweenBlocks;
  const cellWidth = 220;
  const colGap = 40;

  // --- fetch JSON --- (on reprend ta logique: ?source & ?t & ?year)
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase();
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  if(!id || !year){
    document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:#666">Missing tournament id or year. Use ?source=wta&t=528&year=2025</div>';
    return;
  }
  const path = `/data/tournaments/${source}_${id}_${year}.json`;
  let json;
  try { const resp = await fetch(path); if(!resp.ok) throw new Error('JSON not found'); json = await resp.json(); }
  catch(e){ document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:red">Erreur chargement JSON: '+e.message+'</div>'; console.error(e); return; }

  document.getElementById('tourney-title').textContent = json.meta?.tourney_name || (source.toUpperCase() + ' ' + id);

  // collect matches by normalized round
  function normRound(r){ if(!r) return 'Unknown'; r = String(r).trim().toUpperCase(); if(r==='F' || r.startsWith('FINAL')) return 'F'; if(r==='SF' || r.startsWith('SEMIF')) return 'SF'; if(r==='QF' || r.startsWith('QUART')) return 'QF'; return r; }
  function isValidMatchId(mid){ if(!mid) return false; return /^[ML]S\d{3}$/i.test(String(mid).trim()); }
  function matchNumber(mid){ if(!mid) return Number.MAX_SAFE_INTEGER; const m = String(mid).toUpperCase().match(/^[ML]S0*([0-9]+)/); if(m && m[1]) return parseInt(m[1],10); const d = String(mid).match(/\d+/); return d?parseInt(d[0],10):Number.MAX_SAFE_INTEGER; }

  const rawMatches = (json.matches || []).map(m=>Object.assign({},m));
  const matches = rawMatches.filter(m => isValidMatchId(m.match_id));
  const groups = {};
  matches.forEach(m => { const r = normRound(m.round); (groups[r] = groups[r]||[]).push(m); });

  // sort rounds left->right by size
  const rounds = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);

  // container sizing
  let maxBlocks = 0;
  rounds.forEach(r => maxBlocks = Math.max(maxBlocks, groups[r].length));
  const containerHeight = Math.max(400, maxBlocks * perMatchBlock + 80);
  const container = document.getElementById('bracketContainer');
  container.style.position = 'relative';
  container.style.height = containerHeight + 'px';
  container.innerHTML = '';

  // positionsByRound stocke pour chaque match: { winnerTop, center, matchRef }
  const positionsByRound = [];

  rounds.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd].slice();
    matchesInRound.sort((a,b) => matchNumber(a.match_id) - matchNumber(b.match_id));

    const n = matchesInRound.length;
    const columnHeight = (n - 1) * perMatchBlock + matchBlockH + 20;
    const topOffset = Math.max(10, Math.round((containerHeight - columnHeight) / 2));

    const prev = colIndex > 0 ? positionsByRound[colIndex - 1] : null;
    const prevCount = prev ? prev.length : 0;
    const currCount = matchesInRound.length;

    const thisPositions = [];

    matchesInRound.forEach((m, j) => {
      // compute winnerTop (top of winner row)
      let winnerTop;
      if(colIndex === 0){
        winnerTop = topOffset + j * perMatchBlock;
      } else {
        // map j -> block in previous round and average centers
        let startIndex = Math.floor(j * prevCount / currCount);
        let endIndex = Math.floor(((j+1) * prevCount) / currCount) - 1;
        if(endIndex < startIndex) endIndex = startIndex;
        if(startIndex >= prevCount) startIndex = prevCount - 1;
        if(endIndex >= prevCount) endIndex = prevCount - 1;
        let sum = 0, cnt = 0;
        for(let k = startIndex; k <= endIndex; k++){
          if(prev[k]){ sum += prev[k].center; cnt++; }
        }
        if(cnt === 0) winnerTop = topOffset + j * perMatchBlock;
        else {
          // center of child match = average center from previous; convert center -> winnerTop
          const avgCenter = Math.round(sum / cnt);
          winnerTop = avgCenter - Math.floor(matchBlockH / 2);
        }
      }

      const scoreTop = winnerTop + winnerRowH; // score is directly beneath winner (after the border)
      const loserTop = scoreTop + scoreRowH;
      const center = winnerTop + Math.round(matchBlockH/2);

      thisPositions.push({ winnerTop, scoreTop, loserTop, center, matchRef: m });

      const left = colIndex * (cellWidth + colGap);

      // classes for highlight
      const wId = m.player_id_winner || ('pwin_'+colIndex+'_'+j);
      const lId = m.player_id_loser  || ('plos_'+colIndex+'_'+j);
      const wClass = 'j_' + String(wId);
      const lClass = 'j_' + String(lId);

      // WINNER row (with border-bottom = barre)
      const wDiv = document.createElement('div');
      wDiv.className = wClass + ' match-row player-row winner';
      wDiv.style.position = 'absolute';
      wDiv.style.top = winnerTop + 'px';
      wDiv.style.left = left + 'px';
      wDiv.style.height = winnerRowH + 'px';
      wDiv.style.width = cellWidth + 'px';
      wDiv.setAttribute('onmouseover', `highlight_player(1,'${wClass}'); highlight_player(1,'${lClass}');`);
      wDiv.setAttribute('onmouseout',  `highlight_player(2,'${wClass}'); highlight_player(2,'${lClass}');`);

      // seed
      const wseedRaw = m.winner_seed || m.winnerSeed || '';
      const wseed = formatSeed(wseedRaw);
      const seedNode = document.createElement('div');
      if(wseed && /^\d+$/.test(wseed)){ seedNode.className='seed-num'; seedNode.textContent = wseed; }
      else { seedNode.className='seed-text'; seedNode.innerHTML = (wseed? wseed : '\u00A0'); }
      wDiv.appendChild(seedNode);
      // flag
      wDiv.appendChild(makeFlagElem(m.winner_country || m.winner_nationality || m.winner_country_code || ''));
      // name
      const wname = m.winner_player_name || m.winner_name || '';
      const { last: wlast, firstInitial: wfirstInitial } = splitNameToLastAndInitial(wname);
      const wA = document.createElement('a');
      const wSlug = slugify(wname);
      wA.href = m.player_id_winner ? `/player/${wSlug}/${m.player_id_winner}/` : '#';
      wA.className = 'player-link';
      wA.innerHTML = `<strong style="font-size:11px">${(wlast||'—').toUpperCase()}</strong><span class="player-first">${ wfirstInitial ? ', ' + wfirstInitial : '' }</span>`;
      wDiv.appendChild(wA);
      container.appendChild(wDiv);

      // SCORE row (directly below winner's border)
      const sDiv = document.createElement('div');
      sDiv.className = wClass + ' ' + lClass + ' score-row';
      sDiv.style.position = 'absolute';
      sDiv.style.top = scoreTop + 'px';
      sDiv.style.left = left + 'px';
      sDiv.style.height = scoreRowH + 'px';
      sDiv.style.width = cellWidth + 'px';
      sDiv.setAttribute('onmouseover', `highlight_player(1,'${wClass}'); highlight_player(1,'${lClass}');`);
      sDiv.setAttribute('onmouseout',  `highlight_player(2,'${wClass}'); highlight_player(2,'${lClass}');`);
      const scoreText = (m.score_string || m.score || '').trim();
      sDiv.innerHTML = scoreText ? `<a href="${m.match_url||'#'}" style="color:#515151;font-size:11px;font-style:italic;padding-left:2px;text-decoration:none">${scoreText}</a>` : '&nbsp;';
      container.appendChild(sDiv);

      // LOSER row
      const lDiv = document.createElement('div');
      lDiv.className = lClass + ' match-row player-row loser';
      lDiv.style.position = 'absolute';
      lDiv.style.top = loserTop + 'px';
      lDiv.style.left = left + 'px';
      lDiv.style.height = loserRowH + 'px';
      lDiv.style.width = cellWidth + 'px';
      lDiv.setAttribute('onmouseover', `highlight_player(1,'${lClass}');`);
      lDiv.setAttribute('onmouseout',  `highlight_player(2,'${lClass}');`);

      const lseedRaw = m.loser_seed || m.loserSeed || '';
      const lseed = formatSeed(lseedRaw);
      const seedNode2 = document.createElement('div');
      if(lseed && /^\d+$/.test(lseed)){ seedNode2.className='seed-num'; seedNode2.textContent = lseed; }
      else { seedNode2.className='seed-text'; seedNode2.innerHTML = (lseed? lseed : '\u00A0'); }
      lDiv.appendChild(seedNode2);

      lDiv.appendChild(makeFlagElem(m.loser_country || m.loser_nationality || m.loser_country_code || ''));

      const lname = m.loser_player_name || m.loser_name || '';
      if(!lname || /^BYE$/i.test(lname)){
        const byeSpan = document.createElement('span'); byeSpan.className='bye'; byeSpan.textContent='BYE'; lDiv.appendChild(byeSpan);
      } else {
        const { last: llast, firstInitial: lfirstInitial } = splitNameToLastAndInitial(lname);
        const lA = document.createElement('a');
        const lSlug = slugify(lname);
        lA.href = m.player_id_loser ? `/player/${lSlug}/${m.player_id_loser}/` : '#';
        lA.className = 'player-link';
        lA.innerHTML = `<strong style="font-size:11px">${(llast||'—').toUpperCase()}</strong><span class="player-first">${ lfirstInitial ? ', ' + lfirstInitial : '' }</span>`;
        lDiv.appendChild(lA);
      }
      container.appendChild(lDiv);

    }); // matchesInRound.forEach

    positionsByRound.push(thisPositions);
  }); // rounds.forEach

} // render

render();
</script>
</body>
</html>

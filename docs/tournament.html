<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bracket skeleton</title>
<style>
  :root{
    /* layout sizes (modifiable) */
    --winner-h:22px;            /* height of top player row */
    --loser-h:22px;             /* height of bottom player row */
    --midblock-h:40px;          /* height of middle winner+score block */
    --match-gap:48px;           /* vertical gap between matches */
    --col-gap:36px;             /* horizontal gap between columns */
    --col-width:220px;          /* width of the leftmost column */
    --col-width-small:160px;    /* width of other columns */
    --midblock-width:180px;     /* width of the mid block */
    --mid-offset: 0px;          /* extra offset applied to mid-block X */
    --line-color:#797979;
    --seed-blue:#0b3d91;
    --container-padding:12px;
  }

  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
  .topbar{background:#2b6cb0;color:#fff;padding:12px}
  .container{max-width:1400px;margin:12px auto;padding:var(--container-padding);position:relative}
  #bracket{position:relative; min-height:640px; background:transparent; overflow:visible;}

/* debug / placeholders visuals */
.match-row{box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;background:#fff;position:absolute;display:flex;align-items:center;gap:8px;border-left:1px solid transparent;border-right:1px solid transparent;}
.row-top{height:var(--winner-h); border-top:1px solid var(--line-color);}
.row-bottom{height:var(--loser-h); border-bottom:1px solid var(--line-color);}

.mid-block{position:absolute;height:var(--midblock-h);width:var(--midblock-width);z-index:50;background:#fff;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mid-winner{height:18px; display:block; width:100%; box-sizing:border-box; padding:0 8px; font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mid-bar{height:1px;background:var(--line-color);width:100%;}
.mid-score{font-size:12px;padding-top:4px;color:#515151;font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* svg overlay */
.connectors{position:absolute;left:0;top:0;width:100%;height:100%;z-index:20;pointer-events:none}

/* visual hints (placeholders) */
.placeholder-name{height:14px;width:80%;background:transparent;}
.placeholder-seed{width:22px;height:16px;background:transparent;display:inline-block}
.placeholder-score{height:12px;width:60%;background:transparent;display:block;margin-top:4px}

/* responsiveness tweak */
@media (max-width:900px){
  :root{ --col-width:160px; --col-width-small:120px; --midblock-width:140px; --match-gap:36px; }
}
</style>
</head>
<body>
  <div class="topbar">
    <div style="max-width:1400px;margin:0 auto;display:flex;gap:12px;align-items:center;">
      <strong>Bracket skeleton</strong>
      <div style="margin-left:auto;font-size:13px;color:#fff;opacity:0.9">Modifiable via CSS vars in :root</div>
    </div>
  </div>

  <div class="container">
    <div id="bracket"></div>
  </div>

<script>
/*
  Bracket skeleton generator
  - Determines rounds from singles_draw_size (or URL param ?size=)
  - Renders empty placeholders for player rows (first column only have row-top/row-bottom)
  - Renders mid-block placeholders per match
  - Draws connectors as grouped vertical "spines" + horizontals to mid-blocks (no duplicate horizontals)
  - No player names / scores are injected (placeholders only)
*/

/* ---------- configuration ---------- */
// Try URL param ?size= or fallback to this constant
function getParamSize(){
  const p = new URLSearchParams(location.search).get('size');
  if(p) { const n = parseInt(p,10); if(!isNaN(n) && n>0) return n; }
  return null;
}
let singles_draw_size = getParamSize() || 32; // default 32
// The number of players must be a power of 2; if not, round up to next power of 2.
function nextPowerOfTwo(n){
  return Math.pow(2, Math.ceil(Math.log2(n)));
}
function prevPowerOfTwo(n){
  return Math.pow(2, Math.floor(Math.log2(n)));
}
singles_draw_size = nextPowerOfTwo(singles_draw_size);

/* ---------- read CSS variables ---------- */
const rootStyle = getComputedStyle(document.documentElement);
const winnerH = parseInt(rootStyle.getPropertyValue('--winner-h')) || 22;
const loserH  = parseInt(rootStyle.getPropertyValue('--loser-h')) || 22;
const midH     = parseInt(rootStyle.getPropertyValue('--midblock-h')) || 40;
const matchGap = parseInt(rootStyle.getPropertyValue('--match-gap')) || 48;
const colGap   = parseInt(rootStyle.getPropertyValue('--col-gap')) || 36;
const colWidth = parseInt(rootStyle.getPropertyValue('--col-width')) || 220;
const colWidthSmall = parseInt(rootStyle.getPropertyValue('--col-width-small')) || 160;
const midWidth = parseInt(rootStyle.getPropertyValue('--midblock-width')) || 180;
const midOffset = parseInt(rootStyle.getPropertyValue('--mid-offset')) || 0;

/* ---------- layout math ---------- */
const totalPlayers = singles_draw_size;                 // power of two
const rounds = Math.log2(totalPlayers);                // number of rounds (e.g. 32 -> 5 rounds)
const firstRoundMatches = totalPlayers / 2;            // matches in first round
// matches per round: round 0 (first round) -> firstRoundMatches,
// round r -> firstRoundMatches / (2^r)
function matchesInRound(r){ return Math.max(1, firstRoundMatches / Math.pow(2, r)); }

/* container sizing */
const perMatchBlock = winnerH + midH + loserH + matchGap;
const maxMatchesInRound = firstRoundMatches; // leftmost column largest
const containerHeight = Math.max(640, maxMatchesInRound * perMatchBlock + 80);

const bracket = document.getElementById('bracket');
bracket.style.height = containerHeight + 'px';
bracket.innerHTML = ''; // reset

/* create SVG overlay */
const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(svgNS, 'svg');
svg.classList.add('connectors');
svg.setAttribute('width','100%');
svg.setAttribute('height','100%');
bracket.appendChild(svg);

/* helper to create match placeholders and collect positions */
const positionsByRound = [];

for(let r=0;r<rounds;r++){
  const matchCount = matchesInRound(r);
  const columnHeight = (matchCount - 1) * perMatchBlock + (winnerH + midH + loserH) + 20;
  const topOffset = Math.max(8, Math.round((containerHeight - columnHeight) / 2));
  const thisPositions = [];
  // compute left coordinate for this column
  const colLeft = (r === 0) ? 0 : r * (colWidthSmall + colGap) + (colWidth - colWidthSmall);

  for(let m=0;m<matchCount;m++){
    // vertical positioning: when r==0 evenly spaced, else align to children average (handled later)
    const topBlock = topOffset + m * perMatchBlock;
    const topRowTop = topBlock;
    const midTop = topRowTop + winnerH;
    const bottomRowTop = midTop + midH;
    const bottomRowBottom = bottomRowTop + loserH;
    const center = Math.round((topRowTop + bottomRowBottom) / 2);

    // left/width based on column
    const left = colLeft;
    const width = (r === 0) ? colWidth : colWidthSmall;

    // TOP row placeholder
    const topDiv = document.createElement('div');
    topDiv.className = 'match-row' + (r===0 ? ' row-top' : '');
    topDiv.style.top = topRowTop + 'px';
    topDiv.style.left = left + 'px';
    topDiv.style.height = winnerH + 'px';
    topDiv.style.width = width + 'px';
    if(r===0){
      // first column: show seed/name placeholders (non-interactive)
      const seed = document.createElement('span'); seed.className='placeholder-seed'; seed.style.visibility='hidden';
      const name = document.createElement('span'); name.className='placeholder-name';
      topDiv.appendChild(seed); topDiv.appendChild(name);
    } else {
      topDiv.innerHTML = '&nbsp;';
    }
    bracket.appendChild(topDiv);

    // BOTTOM row placeholder
    const bottomDiv = document.createElement('div');
    bottomDiv.className = 'match-row' + (r===0 ? ' row-bottom' : '');
    bottomDiv.style.top = bottomRowTop + 'px';
    bottomDiv.style.left = left + 'px';
    bottomDiv.style.height = loserH + 'px';
    bottomDiv.style.width = width + 'px';
    if(r===0){
      const seed = document.createElement('span'); seed.className='placeholder-seed'; seed.style.visibility='hidden';
      const name = document.createElement('span'); name.className='placeholder-name';
      bottomDiv.appendChild(seed); bottomDiv.appendChild(name);
    } else {
      bottomDiv.innerHTML = '&nbsp;';
    }
    bracket.appendChild(bottomDiv);

    // MID block placeholder
    const midX_raw = ( (left + width) + ( (r===0) ? left+width : ( (r-1) * (colWidthSmall + colGap) + (colWidth - colWidthSmall) + ((r-1)===0?colWidth:colWidthSmall) ) ) )/2;
    // simpler: place mid-block at left + width + midOffset
    const midBlockX = Math.round(left + width + midOffset);
    const midBlock = document.createElement('div');
    midBlock.className = 'mid-block';
    midBlock.style.left = midBlockX + 'px';
    midBlock.style.top = (center - Math.round(midH/2)) + 'px';
    midBlock.style.width = midWidth + 'px';
    midBlock.style.marginLeft = (-Math.round(midWidth/2)) + 'px';
    // inner placeholders (winner + bar + score)
    const mw = document.createElement('div'); mw.className='mid-winner'; mw.textContent = ''; // empty
    const mb = document.createElement('div'); mb.className='mid-bar';
    const ms = document.createElement('div'); ms.className='mid-score';
    midBlock.appendChild(mw); midBlock.appendChild(mb); midBlock.appendChild(ms);
    bracket.appendChild(midBlock);

    // store computed position (center x,y and midTop/midBottom)
    const computedMidX = midBlockX;
    thisPositions.push({
      topRowTop, midTop, bottomRowTop, bottomRowBottom, center,
      left, width,
      midX: computedMidX,
      midTop: (center - Math.round(midH/2)), midBottom: (center - Math.round(midH/2) + midH),
      midBlockElem: midBlock
    });
  }

  positionsByRound.push(thisPositions);
}

/* After building all positions, we need to properly vertically align non-first columns
   so that parents sit between their children. We'll reposition mid-blocks & top/bottom
   placeholders based on averaging child centers for columns > 0. */
for(let r=1;r<rounds;r++){
  const parents = positionsByRound[r];
  const children = positionsByRound[r-1];
  if(!parents || !children) continue;
  const parentCount = parents.length;
  const childCount = children.length;
  for(let p=0;p<parentCount;p++){
    // determine which children map to this parent
    const start = Math.floor(p * childCount / parentCount);
    const end   = Math.floor(((p+1) * childCount) / parentCount) - 1;
    let sum=0,cnt=0;
    for(let k=Math.max(0,start); k<=Math.min(end, childCount-1); k++){
      sum += children[k].center;
      cnt++;
    }
    const parentCenter = cnt? Math.round(sum/cnt) : parents[p].center;
    // recalc topRowTop etc such that center = parentCenter
    const topRowTop = parentCenter - Math.round((winnerH + midH + loserH)/2);
    const midTop = topRowTop + winnerH;
    const bottomRowTop = midTop + midH;
    const bottomRowBottom = bottomRowTop + loserH;
    // move DOM elements: top, bottom, mid-block
    const par = parents[p];
    // find corresponding DOM elements by matching coordinates (we stored elements for mid-block only)
    const midEl = par.midBlockElem;
    if(midEl){
      midEl.style.top = (parentCenter - Math.round(midH/2)) + 'px';
      // update our stored positions
      par.midTop = parentCenter - Math.round(midH/2);
      par.midBottom = par.midTop + midH;
      par.topRowTop = topRowTop;
      par.bottomRowTop = bottomRowTop;
      par.center = parentCenter;
      // also move placeholder row divs at same index in DOM: easier to search by proximity
      // We'll find the top/bottom divs by scanning .match-row near (left) position
      const left = par.left;
      // find .match-row elements at the left coordinate and similar width & move them
      const allRows = document.querySelectorAll('.match-row');
      for(const row of allRows){
        const rleft = parseInt(row.style.left || '0',10);
        const rwidth = parseInt(row.style.width || '0',10);
        if(rleft===left && rwidth==par.width){
          const rtop = parseInt(row.style.top||'0',10);
          // heuristic: top rows have top border; if current top is close to old topRowTop then move
          // We'll move both the top and bottom that are closest to the previous stored values
          // For simplicity, move any row whose vertical distance to new topRowTop/bottomRowTop is less than perMatchBlock
          if(Math.abs(rtop - par.topRowTop) > Math.abs(rtop - topRowTop)){
            row.style.top = topRowTop + 'px';
          }
          if(Math.abs(rtop - par.bottomRowTop) > Math.abs(rtop - bottomRowTop)){
            row.style.top = bottomRowTop + 'px';
          }
        }
      }
    }
  }
}

/* ---------- draw connectors (grouped spines + horizontals -> connect to mid-bar center) ---------- */
function drawPolyline(points, strokeWidth){
  // remove consecutive duplicate points
  const reduced = points.filter((p,i,arr) => { if(i===0) return true; const prev = arr[i-1]; return !(prev[0]===p[0] && prev[1]===p[1]); });
  if(reduced.length < 2) return;
  const poly = document.createElementNS(svgNS,'polyline');
  poly.setAttribute('points', reduced.map(p => (p[0]+','+p[1])).join(' '));
  poly.setAttribute('fill','none');
  poly.setAttribute('stroke', rootStyle.getPropertyValue('--line-color') || '#797979');
  poly.setAttribute('stroke-width', (strokeWidth||1));
  poly.setAttribute('stroke-linecap','square');
  poly.setAttribute('stroke-linejoin','miter');
  svg.appendChild(poly);
}

for(let r=0;r<positionsByRound.length-1;r++){
  const children = positionsByRound[r];
  const parents = positionsByRound[r+1];
  if(!children || !parents) continue;

  // map parents to their children indices
  const mapping = new Array(parents.length).fill(0).map(()=>[]);
  for(let i=0;i<children.length;i++){
    const parentIndex = Math.floor(i * parents.length / children.length);
    mapping[Math.min(Math.max(parentIndex,0), parents.length-1)].push(i);
  }

  // for each parent create a single spine and horizontals
  for(let p=0;p<parents.length;p++){
    const childIndices = mapping[p];
    if(!childIndices || childIndices.length===0) continue;
    const parent = parents[p];

    // vertical extent from children centers
    let minY = Infinity, maxY = -Infinity, sumX = 0;
    childIndices.forEach(ci => { const c = children[ci]; minY = Math.min(minY, c.center); maxY = Math.max(maxY, c.center); sumX += c.midX; });

    const avgChildX = Math.round(sumX / childIndices.length);

    // position spine just to the left of the parent's mid-block (so that mid-bar remains sole horizontal)
    const parentMidLeft = parent.midX - Math.round(midWidth/2);
    let preferred = Math.round((avgChildX + parent.midX) / 2);
    let spineX = preferred;
    const minSpineX = parentMidLeft - 6;
    const maxSpineX = parentMidLeft - 36;
    if(spineX > minSpineX) spineX = minSpineX;
    if(spineX < maxSpineX) spineX = maxSpineX;

    // make the spine reach at least the vertical range of the children, and extend to parent's mid-bar Y
    const parentBarY = parent.midTop + Math.round((parent.midBottom - parent.midTop)/2);
    const vTop = Math.min(minY, parentBarY);
    const vBottom = Math.max(maxY, parentBarY);

    if(vBottom - vTop > 0){
      drawPolyline([[spineX, vTop], [spineX, vBottom]], 1);
    }

    // horizontals from each child to spine
    childIndices.forEach(ci => {
      const c = children[ci];
      drawPolyline([[c.midX, c.center], [spineX, c.center]], 1);
    });

    // Note: we do NOT draw a horizontal from parent.midX to spineX.
    // The mid-block's internal .mid-bar is the visible horizontal at parent.
  }
}

/* Done. The structure is drawn. */
/* Optional: print some debug info in console */
console.log('Bracket skeleton generated: players=', totalPlayers, 'rounds=', rounds, 'firstRoundMatches=', firstRoundMatches);
</script>
</body>
</html>

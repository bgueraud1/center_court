<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tournament — Center Court</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --accent-hard:#2b6cb0;
      --accent-clay:#c53030;
      --accent-grass:#2f855a;
      --accent-carpet:#6b46c1;
      --muted:#666;
    }
    body{font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#111;margin:0}
    .banner{height:84px;display:flex;align-items:center;padding:18px 24px;color:#fff}
    .brand{font-weight:700;font-size:14px;opacity:.95}
    .title{font-size:24px;font-weight:800;margin-left:12px}
    .subtitle{font-size:13px;margin-left:12px;opacity:.92}
    .tabs{margin:18px 24px 0 24px;display:flex;gap:8px}
    .tab{padding:8px 12px;border-radius:6px;background:#fff;border:1px solid #e6e6e6;cursor:pointer}
    .tab.active{background:#fff;border-bottom:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.03)}
    .panel{margin:12px 24px;padding:16px;background:#fff;border:1px solid #e6e6e6;border-radius:8px}
    .label{color:var(--muted);width:140px}
    .row{display:flex;gap:12px;align-items:center;margin-bottom:8px}
    .surface-badge{padding:.35rem .6rem;border-radius:.35rem;color:#fff;font-weight:600;font-size:.85rem}
    .surface-hard{background:var(--accent-hard)}
    .surface-clay{background:var(--accent-clay)}
    .surface-grass{background:var(--accent-grass)}
    .surface-carpet{background:var(--accent-carpet)}
    .iframe-wrap{height:720px;border-radius:8px;overflow:hidden;border:1px solid #e6e6e6}
    .small-muted{color:var(--muted);font-size:13px}
    .note{font-size:13px;color:#666;margin-top:8px}
    pre.debug{max-height:240px;overflow:auto;background:#111;color:#fff;padding:12px;border-radius:6px;font-size:12px}
  </style>
</head>
<body>
  <div id="banner" class="banner" style="background:var(--accent-hard)">
    <div>
      <div class="brand" id="tour-type">ATP</div>
      <div class="title" id="tourney-name">Tourney</div>
      <div class="subtitle" id="tourney-sub">Surface • Level • Start date</div>
    </div>
  </div>

  <div class="tabs">
    <div id="tab-info" class="tab active">Info</div>
    <div id="tab-draw" class="tab">Draw</div>
  </div>

  <div id="panel-info" class="panel">
    <div style="display:flex;gap:24px;flex-wrap:wrap;">
      <div style="flex:1;min-width:260px">
        <div class="row"><div class="label">Tour</div><div id="meta-level" class="small-muted">—</div></div>
        <div class="row"><div class="label">Surface</div><div id="meta-surface" class="small-muted">—</div></div>
        <div class="row"><div class="label">Prize money</div><div id="meta-prize" class="small-muted">—</div></div>
        <div class="row"><div class="label">Draw (singles)</div><div id="meta-draw" class="small-muted">—</div></div>
      </div>
      <div style="flex:1;min-width:260px">
        <div class="row"><div class="label">Ville</div><div id="meta-city" class="small-muted">—</div></div>
        <div class="row"><div class="label">Pays</div><div id="meta-country" class="small-muted">—</div></div>
        <div class="row"><div class="label">Official title</div><div id="meta-title" class="small-muted">—</div></div>
        <div class="row"><div class="label">Source</div><div id="meta-source" class="small-muted">—</div></div>
      </div>
    </div>
    <div class="note">Le draw se charge dans l'onglet "Draw".</div>
  </div>

  <div id="panel-draw" class="panel" style="display:none">
    <div style="margin-bottom:10px"><strong>Draw</strong></div>
    <div class="iframe-wrap">
      <iframe id="draw-frame" src="about:blank" style="width:100%;height:100%;border:0"></iframe>
    </div>
    <div class="note">Le template (template_5/6/7) reçoit le JSON via <code>postMessage</code>.</div>
  </div>

  <div style="margin:16px 24px;">
    <details>
      <summary class="small-muted">Debug (ouvrir si besoin)</summary>
      <pre id="debug" class="debug" style="display:none"></pre>
    </details>
  </div>

<script>
/* ---------- HELPERS généraux (déjà présents dans ton fichier) ---------- */
function qs(k){ return new URLSearchParams(location.search).get(k); }
function debug(msg){ const el = document.getElementById('debug'); if(!el) return; el.style.display='block'; el.textContent += msg + "\n"; }
function formatDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('fr-FR',{year:'numeric',month:'short',day:'numeric'});}catch(e){return d;} }

/* ---------- build candidate URLs (strict pattern requested) ---------- */
function buildJsonCandidates(source, id, year){
  const s = (source||'').toLowerCase();
  const candidates = [];
  if(s && id && year) candidates.push(`/data/tournaments/${s}_${id}_${year}.json`);
  if(s && id) candidates.push(`/data/tournaments/${s}_${id}.json`);
  if(id && year) candidates.push(`/data/tournaments/${id}_${year}.json`);
  if(id) candidates.push(`/data/tournaments/${id}.json`);
  candidates.push(`/data/tournament.json`);
  const maybe = qs('json'); if(maybe) candidates.unshift(maybe);
  return Array.from(new Set(candidates));
}

/* ---------- NEW: build index candidates (where generate_match_jsons writes the index.json) ---------- */
function buildIndexCandidates(source, id, year){
  const s = (source||'').toLowerCase();
  const candidates = [];
  // primary locations where generator writes index.json:
  // /matches/atp_matches_json/{id}_{year}/index.json
  if(s === 'atp' && id && year) candidates.push(`/matches/atp_matches_json/${id}_${year}/index.json`);
  if(s === 'wta' && id && year) candidates.push(`/matches/wta_matches_json/${id}_${year}/index.json`);
  // fallbacks (in case generator was run with different out or you want looser matching)
  if(s === 'atp' && id) candidates.push(`/matches/atp_matches_json/${id}/index.json`);
  if(s === 'wta' && id) candidates.push(`/matches/wta_matches_json/${id}/index.json`);
  if(id && year) candidates.push(`/matches/atp_matches_json/${id}_${year}/index.json`, `/matches/wta_matches_json/${id}_${year}/index.json`);
  // safe generic fallback
  candidates.push(`/matches/index.json`, `/matches/tournaments_index.json`);
  return Array.from(new Set(candidates));
}

/* ---------- fetch first existing JSON (already present in original file, but keep here) ---------- */
async function fetchFirst(candidates){
  for(const url of candidates){
    try{
      const r = await fetch(url, {cache:'no-cache'});
      if(!r.ok){ debug(`fetch ${url} -> ${r.status}`); continue; }
      const j = await r.json();
      debug(`fetch ${url} -> OK`);
      return { url, json: j };
    }catch(e){
      debug(`fetch ${url} -> error ${e && e.message}`);
    }
  }
  return null;
}

/* ---------- normalize tournament (copié depuis ton fichier) ---------- */
function tryGet(obj, keys){
  for(const k of keys) if(obj && k in obj) return obj[k];
  return undefined;
}
function locateMatches(obj){
  if(!obj) return [];
  const candidateKeys = ['matches','matchs','data','results','items','matches_list','matchList'];
  for(const k of candidateKeys) if(Array.isArray(obj[k])) return obj[k];
  if(Array.isArray(obj)) return obj;
  let largest=null;
  for(const k in obj) if(Array.isArray(obj[k]) && (!largest || obj[k].length > largest.length)) largest = obj[k];
  return largest || [];
}
function mapMatch(m){
  const out = {};
  out.match_id = tryGet(m, ['match_id','id','mid']) || '';
  out.round = tryGet(m, ['round','stage']) || '';
  out.score_string = tryGet(m, ['score','score_string','result']) || '';
  out.winner_player_name = tryGet(m, ['winner','winner_name','winner_player_name','w_name']) || tryGet(m, ['w','player_winner_name']) || '';
  out.loser_player_name = tryGet(m, ['loser','loser_name','loser_player_name','l_name']) || tryGet(m, ['l','player_loser_name']) || '';
  out.player_id_winner = tryGet(m, ['winner_id','player_id_winner','w_id']) || '';
  out.player_id_loser = tryGet(m, ['loser_id','player_id_loser','l_id']) || '';
  out.winner_country = tryGet(m, ['winner_country','w_country']) || '';
  out.loser_country = tryGet(m, ['loser_country','l_country']) || '';
  out.winner_seed = tryGet(m, ['winner_seed','w_seed','seed_w']) || '';
  out.loser_seed = tryGet(m, ['loser_seed','l_seed','seed_l']) || '';
  // keep original raw too
  out._raw = m;
  return out;
}
function normalizeTournament(raw){
  const meta = {};
  const metaKeys = ['meta','tourney','tournament','info'];
  for(const k of metaKeys) if(raw && raw[k] && typeof raw[k] === 'object'){ Object.assign(meta, raw[k]); break; }
  meta.tourney_id = meta.tourney_id || tryGet(raw, ['tourney_id','tourneyId','id']);
  meta.tourney_name = meta.tourney_name || tryGet(raw, ['tourney_name','name','title']);
  meta.year = meta.year || tryGet(raw, ['year','season']);
  meta.surface = meta.surface || tryGet(raw, ['surface','court']);
  meta.level = meta.level || tryGet(raw, ['level','tier']);
  meta.prize_money = meta.prize_money || tryGet(raw, ['prize_money','prize']);
  meta.prize_money_currency = meta.prize_money_currency || tryGet(raw, ['prize_money_currency','currency']);
  meta.singles_draw_size = meta.singles_draw_size || tryGet(raw, ['singles_draw_size','draw','draw_size']);
  meta.city = meta.city || tryGet(raw, ['city','location']);
  meta.country = meta.country || tryGet(raw, ['country']);
  meta.tourney_title = meta.tourney_title || tryGet(raw, ['tourney_title','official_name','officialTitle']);
  meta.source = (meta.source || tryGet(raw, ['source']) || '').toUpperCase();
  meta.start_date = meta.start_date || tryGet(raw, ['start_date','date','startDate']);

  const rawMatches = locateMatches(raw) || [];
  const matches = rawMatches.map(mapMatch);

  let draw = Number(meta.singles_draw_size) || NaN;
  if(!draw || isNaN(draw) || draw <= 0){
    const players = new Set();
    matches.forEach(m=>{
      if(m.player_id_winner) players.add(m.player_id_winner);
      if(m.player_id_loser) players.add(m.player_id_loser);
      if(m.winner_player_name) players.add('N:'+m.winner_player_name);
      if(m.loser_player_name) players.add('N:'+m.loser_player_name);
    });
    const count = players.size || 0;
    if(count === 0) draw = 32;
    else if(count <= 32) draw = 32;
    else if(count <= 64) draw = 64;
    else if(count <= 128) draw = 128;
    else draw = 256;
  }
  meta.singles_draw_size = draw;

  return { meta, matches };
}

/* ---------- UI helpers (inchangés) ---------- */
function populateInfo(meta){
  document.getElementById('tour-type').textContent = meta.source ? meta.source.toUpperCase() : 'TOUR';
  document.getElementById('tourney-name').textContent = meta.tourney_name || (meta.tourney_title || ('Tourney ' + (meta.tourney_id || '')));
  const sub = `${meta.surface || '—'} • ${meta.level || '—'} • ${meta.start_date ? formatDate(meta.start_date) : '—'}`;
  document.getElementById('tourney-sub').textContent = sub;
  document.getElementById('meta-level').textContent = meta.level || '—';
  document.getElementById('meta-surface').textContent = meta.surface || '—';
  document.getElementById('meta-prize').textContent = (meta.prize_money_currency||'') + (meta.prize_money ? Number(meta.prize_money).toLocaleString() : '—');
  document.getElementById('meta-draw').textContent = meta.singles_draw_size || '—';
  document.getElementById('meta-city').textContent = meta.city || '—';
  document.getElementById('meta-country').textContent = meta.country || '—';
  document.getElementById('meta-title').textContent = meta.tourney_title || '—';
  document.getElementById('meta-source').textContent = meta.source || '—';
  const banner = document.getElementById('banner');
  const s = (meta.surface || '').toLowerCase();
  if(s.includes('hard')) banner.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent-hard');
  else if(s.includes('clay')) banner.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent-clay');
  else if(s.includes('grass')) banner.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent-grass');
  else banner.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent-carpet');
}

/* ---------- iframe / draw template (inchangé sauf qu'on enrichit payload avec 'index' ) ---------- */
const iframe = document.getElementById('draw-frame');
const tabInfo = document.getElementById('tab-info');
const tabDraw = document.getElementById('tab-draw');
const panelInfo = document.getElementById('panel-info');
const panelDraw = document.getElementById('panel-draw');

tabInfo.addEventListener('click', ()=>{
  tabInfo.classList.add('active'); tabDraw.classList.remove('active');
  panelInfo.style.display='block'; panelDraw.style.display='none';
});
tabDraw.addEventListener('click', ()=>{
  tabDraw.classList.add('active'); tabInfo.classList.remove('active');
  panelInfo.style.display='none'; panelDraw.style.display='block';
  if(!iframe.src || iframe.src === 'about:blank') loadTemplateAndSend(lastPayload);
});

function chooseTemplate(drawSize){
  if(drawSize <= 32) return 'template_5.html';
  if(drawSize <= 64) return 'template_6.html';
  return 'template_7.html';
}

let lastPayload = null;

/* ----- NEW: merge index entries into normalized matches ----- */
function mergeIndexIntoMatches(matchesArray, indexObj){
  if(!indexObj || !Array.isArray(indexObj.matches)) return;
  const map = new Map();
  for(const e of indexObj.matches){
    if(!e.match_id) continue;
    map.set(String(e.match_id).toUpperCase(), e);
  }
  // also index by other plausible keys (score)
  for(const e of indexObj.matches){
    if(e.score && e.score.length && !map.has(String(e.match_id).toUpperCase())){
      map.set(String(e.match_id).toUpperCase(), e);
    }
  }
  for(const m of matchesArray){
    const key = String(m.match_id || '').toUpperCase();
    if(key && map.has(key)){
      const e = map.get(key);
      m._index = e;
      if(e.link) m.page_link = e.link;
    } else {
      // try to match by score + winner (best effort)
      const found = indexObj.matches.find(e => 
        e.score && m.score_string && e.score.replace(/\s+/g,'') === String(m.score_string).replace(/\s+/g,'') &&
        ((e.winner && m.winner_player_name && e.winner.toLowerCase() === m.winner_player_name.toLowerCase()) ||
         (e.winner && m.winner_player_name && m.winner_player_name.toLowerCase().includes(e.winner.toLowerCase()))
        )
      );
      if(found){
        m._index = found;
        if(found.link) m.page_link = found.link;
      }
    }
  }
}

/* ---------- load template and send (slightly changed to include index data in payload) ---------- */
function loadTemplateAndSend(payload){
  if(!payload) return;
  const drawSize = Number(payload.meta && payload.meta.singles_draw_size) || 32;
  const template = chooseTemplate(drawSize);
  const s = encodeURIComponent((payload.meta && payload.meta.source) || qs('source') || 'atp');
  const tid = encodeURIComponent((payload.meta && payload.meta.tourney_id) || qs('t') || qs('id') || '');
  const yr = encodeURIComponent((payload.meta && payload.meta.year) || qs('year') || qs('y') || '');
  const templateUrl = `${template}?source=${s}&t=${tid}&year=${yr}`;

  iframe.src = templateUrl;

  function tryPost(){
    try{
      if(iframe && iframe.contentWindow){
        iframe.contentWindow.postMessage({type:'tourney-data', payload}, '*');
        debug('postMessage envoyé (attempt)');
      }
    }catch(e){
      debug('postMessage err: '+ (e && e.message));
    }
  }

  const onLoad = ()=>{
    tryPost();
    setTimeout(tryPost, 250);
    setTimeout(tryPost, 700);
    iframe.removeEventListener('load', onLoad);
  };
  iframe.addEventListener('load', onLoad);
}

/* ---------- main entry: now loads tournament JSON + tries to load index.json and merges them ---------- */
async function main(){
  const source = qs('source') || qs('s') || 'atp';
  const id = qs('t') || qs('id') || '';
  const year = qs('year') || qs('y') || new Date().getFullYear();

  if(!id){
    document.getElementById('panel-info').appendChild(Object.assign(document.createElement('div'), {textContent:'Missing tournament id in URL (param t).', className:'text-danger mt-2'}));
    return;
  }

  const candidates = buildJsonCandidates(source,id,year);
  debug('candidates: ' + JSON.stringify(candidates,null,2));

  try{
    const rawResult = await fetchFirst(candidates);
    if(!rawResult) throw new Error('Aucun JSON tournoi trouvé (candidates checked).');
    const raw = rawResult.json;
    const norm = normalizeTournament(raw);
    if(!norm.meta.source) norm.meta.source = (source||'').toUpperCase();
    if(!norm.meta.tourney_id) norm.meta.tourney_id = id;
    if(!norm.meta.year) norm.meta.year = year;
    populateInfo(norm.meta);

    // TRY TO LOAD INDEX.JSON (merge results into norm.matches)
    const indexCandidates = buildIndexCandidates(norm.meta.source || source, id, year);
    debug('index candidates: ' + JSON.stringify(indexCandidates,null,2));
    const idxResult = await fetchFirst(indexCandidates);
    if(idxResult && idxResult.json){
      // attach index raw object
      norm.index = idxResult.json;
      debug('index loaded from ' + idxResult.url);
      // merge index entries into matches
      mergeIndexIntoMatches(norm.matches, norm.index);
    } else {
      debug('no index.json found for this tournament (checked candidates).');
    }

    lastPayload = norm;
    loadTemplateAndSend(norm);

    if(tabDraw.classList.contains('active')) loadTemplateAndSend(norm);
  }catch(e){
    debug('load error: '+ (e && e.message));
    document.getElementById('panel-info').appendChild(Object.assign(document.createElement('div'), {textContent:'Erreur chargement JSON: '+(e && e.message), className:'text-danger mt-2'}));
  }
}

/* listen template ready optionally */
window.addEventListener('message',(ev)=>{
  const d = ev.data || {};
  if(d && d.type === 'template-ready'){ debug('template ready: ' + (d.template||'?')); if(lastPayload) try{ iframe.contentWindow.postMessage({type:'tourney-data', payload:lastPayload}, '*'); }catch(e){} }
}, false);

/* start */
document.addEventListener('DOMContentLoaded', main);
</script>


</body>
</html>

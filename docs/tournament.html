<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bracket — integrated skeleton mapping MS/LS</title>
<style>
  :root{
    --winner-h:22px;
    --loser-h:22px;
    --midblock-h:38px;
    --match-gap:52px;
    --col-gap:34px;
    --col-width:220px;
    --col-width-small:140px;
    --midblock-width:160px;
    --line-color:#797979;
    --seed-blue:#0b3d91;
    --mid-offset: 220px;
  }

  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
  .hero{padding:14px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1400px;margin:12px auto;padding:0 12px}
  #bracketContainer{position:relative;background:transparent;overflow:visible}

  /* flags */
  .flag{display:inline-block;width:22px;height:14px;margin-right:8px;vertical-align:middle;overflow:hidden;border-radius:2px;background:#f5f5f5;line-height:14px;text-align:center}
  .flag img{width:100%;height:100%;object-fit:cover;display:block}

  /* seeds */
  .seed-num{float:left;width:22px;color:var(--seed-blue);font-size:11px;padding:2px 4px;font-weight:700;}
  .seed-text{float:left;width:22px;color:#808080;font-size:11px;padding:2px 4px;}

  .player-link{font-size:11px;text-decoration:none;color:#000;display:inline-block;vertical-align:middle}
  .player-first{font-size:11px;color:#565656;font-style:italic;margin-left:4px}
  .bye{color:#808080;font-size:11px;padding-left:22px}

  /* rows for players (absolute) */
  .match-row{box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;background:#fff;z-index:5;position:absolute;display:flex;align-items:center;gap:6px;}
  .row-top{height:var(--winner-h); border-top:1px solid var(--line-color);}   /* top border above upper player */
  .row-bottom{height:var(--loser-h); border-bottom:1px solid var(--line-color);}/* bottom border below lower player */

  /* mid block placed at mid-axis; contains winner above line and score below */
  .mid-block{position:absolute;height:var(--midblock-h);width:var(--midblock-width);text-align:center;transform:none;z-index:70;background:#fff;pointer-events:auto;margin-left:0;display:flex;flex-direction:column;justify-content:center;align-items:center;box-sizing:border-box}
  .mid-winner{font-size:11px;font-weight:700;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;display:flex;align-items:center;gap:6px}
  .mid-bar{height:1px;background:var(--line-color);width:100%;margin:2px 0;}
  .mid-score{font-size:11px;color:#515151;font-style:italic;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}

  /* svg connectors behind everything */
  .connectors{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;pointer-events:none}

  .highlight{background: rgba(255,235,59,0.15) !important}

  @media (max-width:900px){
    :root{ --col-width:160px; --col-width-small:120px; --match-gap:36px; --midblock-width:120px; }
  }
</style>
</head>
<body>

  <div class="container-main" style="padding-top:12px">

<script>
/* ---------- utilitaires (drapeaux, parsing, formatting) ---------- */

const iocToAlpha2 = {
"AFG":"AF","ALB":"AL","ALG":"DZ","AND":"AD","ANG":"AO","ANT":"AG","ARG":"AR","ARM":"AM","ARU":"AW",
"AUS":"AU","AUT":"AT","AZE":"AZ","BAH":"BS","BRN":"BH","BAN":"BD","BAR":"BB","BLR":"BY","BEL":"BE",
"BIZ":"BZ","BEN":"BJ","BER":"BM","BHU":"BT","BOL":"BO","BIH":"BA","BOT":"BW","BRA":"BR","IVB":"VG",
"BRU":"BN","BUL":"BG","BUR":"BF","BDI":"BI","CPV":"CV","CAM":"KH","CMR":"CM","CAN":"CA","CAY":"KY",
"CAF":"CF","CHA":"TD","CHI":"CL","CHN":"CN","COL":"CO","COM":"KM","CGO":"CG","COD":"CD","COK":"CK",
"CRC":"CR","CIV":"CI","CRO":"HR","CUB":"CU","CYP":"CY","CZE":"CZ","DEN":"DK","DJI":"DJ","DMA":"DM",
"DOM":"DO","ECU":"EC","EGY":"EG","ESA":"SV","ENG":"GB","GEQ":"GQ","ERI":"ER","EST":"EE","SWZ":"SZ",
"ETH":"ET","FIJ":"FJ","FIN":"FI","FRA":"FR","GAB":"GA","GAM":"GM","GEO":"GE","GER":"DE","GHA":"GH",
"GIB":"GI","GRE":"GR","GRN":"GD","GUM":"GU","GUA":"GT","GUI":"GN","GBS":"GW","GUY":"GY","HAI":"HT",
"HON":"HN","HKG":"HK","HUN":"HU","ISL":"IS","IND":"IN","INA":"ID","IRI":"IR","IRQ":"IQ","IRL":"IE",
"ISR":"IL","ITA":"IT","JAM":"JM","JPN":"JP","JOR":"JO","KAZ":"KZ","KEN":"KE","KOS":"XK","KUW":"KW",
"KGZ":"KG","LAO":"LA","LAT":"LV","LBN":"LB","LES":"LS","LBR":"LR","LBA":"LY","LIE":"LI","LTU":"LT",
"LUX":"LU","MAC":"MO","MAD":"MG","MAW":"MW","MAS":"MY","MDV":"MV","MLI":"ML","MLT":"MT","MHL":"MH",
"MTN":"MR","MRI":"MU","MEX":"MX","FSM":"FM","MDA":"MD","MCO":"MC","MNG":"MN","MNE":"ME","MSR":"MS",
"MAR":"MA","MOZ":"MZ","MYA":"MM","NAM":"NA","NRU":"NR","NEP":"NP","NED":"NL","NCL":"NC","NZL":"NZ",
"NCA":"NI","NIG":"NE","NGR":"NG","MKD":"MK","NIR":"GB","NOR":"NO","OMA":"OM","PAK":"PK","PLE":"PS",
"PAN":"PA","PNG":"PG","PAR":"PY","PER":"PE","PHI":"PH","POL":"PL","POR":"PT","PUR":"PR","QAT":"QA",
"ROU":"RO","RUS":"RU","RWA":"RW","SKN":"KN","LCA":"LC","VIN":"VC","SAM":"WS","SMR":"SM","STP":"ST",
"KSA":"SA","SCO":"GB","SEN":"SN","SRB":"RS","SEY":"SC","SLE":"SL","SGP":"SG","SVK":"SK","SLO":"SI",
"SLB":"SB","SOM":"SO","RSA":"ZA","KOR":"KR","SSD":"SS","ESP":"ES","SRI":"LK","SUD":"SD","SUR":"SR",
"SWE":"SE","SUI":"CH","SYR":"SY","TPE":"TW","TJK":"TJ","TAN":"TZ","THA":"TH","TLS":"TL","TOG":"TG",
"TGA":"TO","TTO":"TT","TUN":"TN","TUR":"TR","TKM":"TM","TCA":"TC","UGA":"UG","UKR":"UA","UAE":"AE",
"USA":"US","URU":"UY","UZB":"UZ","VAN":"VU","VEN":"VE","VIE":"VN","ISV":"VI","WAL":"GB","YEM":"YE",
"ZAM":"ZM","ZIM":"ZW"
};
const nameToAlpha2 = {"UNITED STATES":"US","UNITED KINGDOM":"GB","ENGLAND":"GB","RUSSIA":"RU","CHINA":"CN"};
function toAlpha2(input){ if(!input) return ''; let s=String(input||'').trim().toUpperCase(); if(/^[A-Z]{2}$/.test(s)) return s; if(s.length===3 && iocToAlpha2[s]) return iocToAlpha2[s]; if(nameToAlpha2[s]) return nameToAlpha2[s]; const letters = s.replace(/[^A-Z]/g,''); if(letters.length===2) return letters; return ''; }
function alpha2ToFlagEmoji(alpha2){ if(!alpha2 || alpha2.length!==2) return ''; const A=0x1F1E6; const chars=[...alpha2.toUpperCase()].map(ch=>A+(ch.charCodeAt(0)-65)); try{return String.fromCodePoint(...chars);}catch(e){return'';} }
function makeFlagElem(countryInput){ const alpha2 = toAlpha2(countryInput||''); const span = document.createElement('span'); span.className='flag'; if(alpha2){ const code = alpha2.toLowerCase(); const img = document.createElement('img'); img.alt=alpha2; img.src = `https://flagcdn.com/w40/${code}.png`; img.onload=()=>{}; img.onerror=()=>{ img.remove(); const emoji=alpha2ToFlagEmoji(alpha2); if(emoji) span.textContent=emoji; else { span.textContent=alpha2; span.style.fontSize='11px'; span.style.color='#666'; } }; span.appendChild(img); } else { span.textContent = countryInput ? String(countryInput).toUpperCase().slice(0,3) : ''; span.style.fontSize='11px'; span.style.color='#666'; } return span; }
function scoreToHtml(s){ if(!s) return ''; return String(s).replace(/(\d+)\((\d+)\)/g,'$1<sup>$2</sup>').replace(/,/g,', '); }
function slugify(name){ if(!name) return ''; name = name.trim(); if(name.indexOf(',')!==-1){ const parts=name.split(','); const last=parts[0].trim(); const rest=parts.slice(1).join(',').trim(); name = rest + ' ' + last; } return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-'); }
function highlight_player(mode, className){ const els=document.querySelectorAll('.' + className); if(mode===1) els.forEach(e=>e.classList.add('highlight')); else els.forEach(e=>e.classList.remove('highlight')); }

/* ---------- render principal (calcul positions/connecteurs) ----------
   Modification principale : NE CREE PLUS LES DIVS — on calcule les positions
   EXACTES pour chaque match (midX, center) et ensuite on remplit le squelette
   en recherchant les placeholders MS### / LS### dans le DOM.
--------------------------------------------------------------------- */
async function render(){
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase();
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  if(!id || !year){
    document.getElementById('bracketContainer').style.minHeight = '640px';
    // We won't bail: user might have static skeleton with placeholders;
    // but we still try to load JSON if given.
  }

  const path = `/data/tournaments/${source}_${id}_${year}.json`;
  let json = null;
  try{
    const resp = await fetch(path);
    if(resp.ok) json = await resp.json();
    else console.warn('JSON not found at', path, ' — script will still try to map placeholders present in DOM if any.');
  }catch(err){
    console.warn('Erreur fetch JSON (on continue si skeleton présent) :', err);
    json = null;
  }

  if(json && json.meta && json.meta.tourney_name) document.getElementById('tourney-title').textContent = json.meta.tourney_name;

  function norm(r){ if(!r) return 'Unknown'; r=r.trim(); const u=r.toUpperCase(); if(u==='F' || u.startsWith('FINAL')) return 'F'; if(u==='SF' || u.startsWith('SEMIF')) return 'SF'; if(u==='QF' || u.startsWith('QUART')) return 'QF'; return u; }

  const rawMatches = (json?.matches || []).map(m => Object.assign({}, m));
  // filter valid MS/LS matches
  function isValidMatchId(mid){ if(!mid) return false; const s=String(mid).trim().toUpperCase(); return /^[ML]S\d{3}$/.test(s); }
  const matches = rawMatches.filter(m => isValidMatchId(m.match_id));
  const groups = {}; matches.forEach(m => { const r = norm(m.round || ''); groups[r] = groups[r] || []; groups[r].push(m); });
  const rounds = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);

  // layout numbers (same as ton original)
  const winnerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--winner-h')) || 22;
  const loserH  = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--loser-h')) || 22;
  const midH     = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--midblock-h')) || 38;
  const matchGap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--match-gap')) || 52;
  const colGap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col-gap')) || 34;
  const colWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col-width')) || 220;
  const colWidthSmall = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col-width-small')) || 140;
  const midWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--midblock-width')) || 160;

  let maxBlocks = 0; rounds.forEach(r => { maxBlocks = Math.max(maxBlocks, groups[r].length); });
  const perMatchBlock = (winnerH + midH + loserH) + matchGap;
  const containerHeight = Math.max(640, maxBlocks * perMatchBlock + 80);
  const container = document.getElementById('bracketContainer');
  container.style.height = containerHeight + 'px';

  // SVG overlay
  // remove previous if any
  let oldSvg = container.querySelector('svg.connectors');
  if(oldSvg) oldSvg.remove();
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','connectors'); svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  svg.style.position='absolute'; svg.style.left='0'; svg.style.top='0'; svg.style.zIndex='2';
  container.appendChild(svg);

  const positionsByRound = [];
  // map matchId -> computed position { midX, center, midTop, midBottom, left, width,...}
  const matchPositions = {};

  rounds.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd].slice();
    matchesInRound.sort((a,b) => {
      // fallback sort by numeric part of match_id
      const am = String(a.match_id||'').match(/\d+/); const bm = String(b.match_id||'').match(/\d+/);
      const an = am ? parseInt(am[0],10) : 0; const bn = bm ? parseInt(bm[0],10) : 0;
      return an - bn;
    });
    const n = matchesInRound.length;
    const columnHeight = (n - 1) * perMatchBlock + (winnerH + midH + loserH) + 20;
    const topOffset = Math.max(8, Math.round((containerHeight - columnHeight) / 2));
    const prevPositions = colIndex > 0 ? positionsByRound[colIndex - 1] : null;
    const prevCount = prevPositions ? prevPositions.length : 0;
    const currCount = matchesInRound.length;
    const thisPositions = [];

    matchesInRound.forEach((m, j) => {
      let topBlock;
      if(colIndex === 0){
        topBlock = topOffset + j * perMatchBlock;
      } else {
        let startIndex = Math.floor(j * prevCount / currCount);
        let endIndex = Math.floor(((j+1) * prevCount) / currCount) - 1;
        if(endIndex < startIndex) endIndex = startIndex;
        if(startIndex >= prevCount) startIndex = prevCount - 1;
        if(endIndex >= prevCount) endIndex = prevCount - 1;
        let sum=0,cnt=0;
        for(let k=startIndex;k<=endIndex;k++){
          if(prevPositions[k]){ sum += prevPositions[k].center; cnt++; }
        }
        if(cnt===0) topBlock = topOffset + j * perMatchBlock;
        else topBlock = Math.round(sum/cnt) - Math.floor((winnerH + midH + loserH)/2);
      }

      const topRowTop = topBlock;
      const midTop = topRowTop + winnerH;
      const bottomRowTop = midTop + midH;
      const bottomRowBottom = bottomRowTop + loserH;
      const center = Math.round((topRowTop + bottomRowBottom) / 2);

      const colLeft = colIndex === 0 ? 0 : colIndex * (colWidthSmall + colGap) + (colWidth - colWidthSmall);
      const left = colLeft;
      const width = colIndex === 0 ? colWidth : colWidthSmall;

      // compute midX roughly between prev column and this column
      const midOffsetCss = getComputedStyle(document.documentElement).getPropertyValue('--mid-offset') || '0px';
      const midOffsetPx = parseInt(midOffsetCss, 10) || 0;
      const prevColRight = (colIndex === 0)
        ? (left + width)
        : ((colIndex - 1) * (colWidthSmall + colGap) + (colWidth - colWidthSmall) + ((colIndex - 1) === 0 ? colWidth : colWidthSmall));
      const midX = Math.round((prevColRight + left) / 2) + midOffsetPx;

      // store position for this match
      const matchId = String(m.match_id||'').toUpperCase();
      const posObj = { matchId, topRowTop, midTop, bottomRowTop, bottomRowBottom, center, left, width, midX, midBottom: midTop + midH, matchRef: m };
      thisPositions.push(posObj);
      matchPositions[matchId] = posObj;
    });

    positionsByRound.push(thisPositions);
  });

  /* draw connectors (same logic que ton code original) */
  function drawPolyline(points, strokeWidth){
    const reduced = points.filter((p,i,arr) => { if(i===0) return true; const prev = arr[i-1]; return !(prev[0]===p[0] && prev[1]===p[1]); });
    if(reduced.length < 2) return;
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
    poly.setAttribute('points', reduced.map(p => (p[0] + ',' + p[1])).join(' '));
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--line-color') || '#797979');
    poly.setAttribute('stroke-width', (strokeWidth || 1));
    poly.setAttribute('stroke-linecap','square');
    poly.setAttribute('stroke-linejoin','miter');
    svg.appendChild(poly);
  }

  for(let colIndex=0; colIndex<positionsByRound.length - 1; colIndex++){
    const children = positionsByRound[colIndex];
    const parents = positionsByRound[colIndex + 1];
    if(!children || !parents) continue;

    const mapping = new Array(parents.length).fill(0).map(()=>[]);
    for(let i=0;i<children.length;i++){
      const parentIndex = Math.floor(i * parents.length / children.length);
      const idx = Math.min(Math.max(parentIndex,0), parents.length-1);
      mapping[idx].push(i);
    }

    for(let p=0;p<parents.length;p++){
      const childIndices = mapping[p];
      if(!childIndices || childIndices.length===0) continue;
      const parent = parents[p];

      let minY = Infinity, maxY = -Infinity, sumX = 0;
      childIndices.forEach(ci => { const c = children[ci]; minY = Math.min(minY,c.center); maxY = Math.max(maxY,c.center); sumX += c.midX; });
      const avgChildX = Math.round(sumX / childIndices.length);
      const spineX = Math.round((avgChildX + parent.midX) / 2);

      const parentBarY = parent.midTop + Math.round((parent.midBottom - parent.midTop)/2);
      const vTop = Math.min(minY, parentBarY);
      const vBottom = Math.max(maxY, parentBarY);
      if(vBottom - vTop > 0) drawPolyline([[spineX, vTop], [spineX, vBottom]], 1);

      childIndices.forEach(ci =>{
        const c = children[ci];
        drawPolyline([[c.midX, c.center], [spineX, c.center]], 1);
      });
    }
  }

  /* ---------- Maintenant : on remplit le SQUELETTE existant en recherchant
        les placeholders correspondant à chaque match (MS### / LS###) ----------
     Règle :
     - On cherche dans tout #bracketContainer les éléments (a, div, span, etc.)
       dont le texte contient explicitement le code de match (ex 'MS016' ou 'PlayerMS016'
       ou 'ScoreMS016' ou 'VainqueurMS016' ou simplement 'MS016').
     - Pour chaque élément trouvé on décide :
        * si le texte contient 'score' -> on injecte le score du match
        * sinon on compare la position verticale de l'élément avec center calculé :
            - si element.top < center => on met winner (emoji + winner_name)
            - si element.top > center => on met loser  (emoji + loser_name)
            - si element approx center => on met winner (pour mid-block)
  ------------------------------------------------------------------------- */

  // build match map from json (uppercase keys)
  const matchMap = {};
  matches.forEach(m => { if(m && m.match_id) matchMap[String(m.match_id).toUpperCase()] = m; });

  // collect all candidate elements inside the bracket container
  const candidates = Array.from(container.querySelectorAll('a,div,span,td,li,p'));
  // helper regex builder per match
  function matchRegexForId(id){ // id like MS016
    const escaped = id.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');
    // look for the exact code, or Player/Score/Vainqueur + code (optionally with space)
    return new RegExp(`(Player\\s*${escaped}|Vainqueur\\s*${escaped}|Score\\s*${escaped}|${escaped})`, 'i');
  }

  // helper to set element content for player (preserve element tag, but replace children)
  function setPlayerContent(el, countryCodeOrIOC, playerName){
    // clear children
    while(el.firstChild) el.removeChild(el.firstChild);
    // create flag span
    const flagSpan = makeFlagElem(countryCodeOrIOC || '');
    el.appendChild(flagSpan);
    // space + name
    el.appendChild(document.createTextNode(' ' + (playerName || '\u00A0')));
  }
  function setScoreContent(el, scoreStr){
    const html = scoreToHtml(scoreStr) || '\u00A0';
    el.innerHTML = html;
  }

  // For each match from JSON, find matching DOM nodes and assign content
  Object.keys(matchMap).forEach(matchId => {
    const matchObj = matchMap[matchId];
    const regex = matchRegexForId(matchId);

    // find candidate elements whose text contains the id/pattern
    const matchesEls = candidates.filter(c => {
      const txt = (c.textContent||'').trim();
      return txt && regex.test(txt);
    });

    if(matchesEls.length === 0){
      // nothing to replace for this match — skip
      return;
    }

    // compute position center for this match if available
    const pos = matchPositions[matchId];
    // winner/loser info
    const winnerName = matchObj.winner_player_name || matchObj.winner_name || '';
    const loserName = matchObj.loser_player_name || matchObj.loser_name || '';
    const winnerCountry = matchObj.winner_country || matchObj.winner_nationality || matchObj.winner_country_code || '';
    const loserCountry = matchObj.loser_country || matchObj.loser_nationality || matchObj.loser_country_code || '';
    const scoreStr = matchObj.score_string || matchObj.score || '';

    matchesEls.forEach(el=>{
      const text = (el.textContent||'').trim();
      // if the text includes 'score' word (case-insensitive) or starts with 'Score' => set score
      if(/\bscore\b/i.test(text)){
        setScoreContent(el, scoreStr);
        return;
      }
      // if the text includes 'vainqueur' or 'Vainqueur' -> prefer winner
      if(/\bvainqueur\b/i.test(text)){
        setPlayerContent(el, winnerCountry, winnerName);
        return;
      }
      // If element is approximately at mid (i.e. its rect center near match center), put winner
      const rect = el.getBoundingClientRect();
      const elCenterY = rect.top + rect.height/2;
      if(pos && typeof pos.center === 'number'){
        if(Math.abs(elCenterY - pos.center) <= 12){
          // near center -> mid winner
          setPlayerContent(el, winnerCountry, winnerName);
          return;
        } else if(elCenterY < pos.center){
          // above center -> top -> winner
          setPlayerContent(el, winnerCountry, winnerName);
          return;
        } else {
          // below center -> bottom/loser
          setPlayerContent(el, loserCountry, loserName);
          return;
        }
      } else {
        // if no pos info, fallback: if text contains 'Player' or 'Vainqueur' assume winner, else if contains number at end maybe loser
        if(/\bplayer\b/i.test(text) || /\bvainqueur\b/i.test(text)){
          setPlayerContent(el, winnerCountry, winnerName); return;
        } else {
          // fallback set winner
          setPlayerContent(el, winnerCountry, winnerName); return;
        }
      }
    });
  });

  // report placeholders that were found in DOM but do not have a match in JSON
  const idFinder = /\b([ML]S\d{3})\b/i;
  const seenIds = new Set(Object.keys(matchMap));
  candidates.forEach(c=>{
    const txt = (c.textContent||'').trim();
    if(!txt) return;
    const m = txt.match(idFinder);
    if(m){
      const idFound = m[1].toUpperCase();
      if(!seenIds.has(idFound)){
        // leave as-is but log
        console.info('Placeholder trouvé dans DOM pour', idFound, 'mais pas de match correspondant dans le JSON (ou match hors plage). Il est laissé inchangé.');
      }
    }
  });

} // end render

render();
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tournament — Center Court</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff}
  .hero{padding:18px;color:#fff;background:#2b6cb0}
  .container-main{max-width:1200px;margin:12px auto;padding:0 12px}
  .flag{display:inline-block;width:22px;height:14px;margin-right:8px;vertical-align:middle;overflow:hidden;border-radius:2px;background:#f5f5f5}
  .flag img{width:100%;height:100%;object-fit:cover;display:block}
  .seed-num{float:left;width:28px;color:#0b3d91;font-size:11px;padding:2px 4px;font-weight:600;}
  .seed-text{float:left;width:28px;color:#808080;font-size:11px;padding:2px 4px;}
  .player-link { font-size:11px;text-decoration:none;color:black; display:inline-block; vertical-align:middle; }
  .player-first { font-size:11px;color:#565656;font-style:italic; margin-left:4px;}
  .bye { color:#808080;font-size:11px;padding-left:22px; }
  .highlight { background: rgba(255,235,59,0.15); }
  .match-row{ padding:0 4px; box-sizing:border-box; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:600px){
    .player-link{font-size:12px}
    .seed-num, .seed-text{font-size:12px}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="container-main">
    <h1 id="tourney-title" style="margin:0;color:#fff">Tournament</h1>
  </div>
</div>

<div class="container-main" style="padding-top:12px">
  <div id="bracketContainer" style="position:relative;border:0px solid transparent;min-height:200px;">
    <!-- contenu inséré par JS -->
  </div>
</div>

<script>
/* ---------------------------
   UTILITAIRES & MAPPINGS
   --------------------------- */

function slugify(name){
  if(!name) return '';
  name = name.trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const rest = parts.slice(1).join(',').trim();
    name = rest + ' ' + last;
  }
  return name.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
}

function highlight_player(mode, className, v){
  const els = document.querySelectorAll('.' + className);
  if(mode === 1){
    els.forEach(el => el.classList.add('highlight'));
  } else {
    els.forEach(el => el.classList.remove('highlight'));
  }
}

/* flags mapping (abrégé) */
const iocToAlpha2 = { "FRA":"FR","GBR":"GB","USA":"US","RUS":"RU","ESP":"ES","ITA":"IT","NED":"NL","GER":"DE","ARG":"AR","CHN":"CN","JPN":"JP","KAZ":"KZ","KOR":"KR","ZAF":"ZA" };
const nameToAlpha2 = { "UNITED STATES":"US","UNITED KINGDOM":"GB","ENGLAND":"GB","RUSSIA":"RU","CHINA":"CN" };
function toAlpha2(input){
  if(!input) return '';
  let s = String(input).trim().toUpperCase();
  if(/^[A-Z]{2}$/.test(s)) return s;
  if(s.length === 3 && iocToAlpha2[s]) return iocToAlpha2[s];
  if(nameToAlpha2[s]) return nameToAlpha2[s];
  const letters = s.replace(/[^A-Z]/g,'');
  if(letters.length === 2) return letters;
  return '';
}
function alpha2ToFlagEmoji(alpha2){
  if(!alpha2 || alpha2.length !== 2) return '';
  const A = 0x1F1E6;
  const chars = [...alpha2.toUpperCase()].map(ch => A + (ch.charCodeAt(0) - 65));
  try { return String.fromCodePoint(...chars); } catch(e){ return ''; }
}
function makeFlagElem(countryInput){
  const alpha2 = toAlpha2(countryInput || '');
  const span = document.createElement('span');
  span.className = 'flag';
  if(alpha2){
    const code = alpha2.toLowerCase();
    const img = document.createElement('img');
    img.alt = alpha2;
    img.src = `https://flagcdn.com/w40/${code}.png`;
    img.onload = function(){};
    img.onerror = function(){
      img.remove();
      const emoji = alpha2ToFlagEmoji(alpha2);
      if(emoji){
        span.textContent = emoji;
      } else {
        span.textContent = alpha2;
        span.style.fontSize = '11px'; span.style.color = '#666';
      }
    };
    span.appendChild(img);
  } else {
    const txt = (countryInput ? String(countryInput).toUpperCase().slice(0,3) : '');
    span.textContent = txt;
    span.style.fontSize = '11px'; span.style.color = '#666';
  }
  return span;
}

function formatSeed(raw){
  if(raw === null || raw === undefined) return '';
  const s = String(raw).trim();
  const n = typeof raw === 'number' ? raw : parseFloat(s.replace(',', '.'));
  if(isNaN(n)) {
    return s.length ? s : '';
  }
  if(Number.isInteger(n)) return String(n);
  return String(n);
}

function formatFirstInitial(fullFirst){
  if(!fullFirst) return '';
  const tokens = String(fullFirst).trim().split(/\s+/);
  if(tokens.length === 0) return '';
  return tokens[0].charAt(0).toUpperCase() + '.';
}

function splitNameToLastAndInitial(rawName){
  if(!rawName) return { last:'', firstInitial:'' };
  let name = String(rawName).trim();
  if(name.indexOf(',') !== -1){
    const parts = name.split(',');
    const last = parts[0].trim();
    const first = (parts[1] || '').trim();
    return { last: last, firstInitial: formatFirstInitial(first) };
  }
  const parts = name.split(/\s+/);
  if(parts.length === 1) return { last: parts[0], firstInitial: '' };
  const last = parts[parts.length - 1];
  const firstTokens = parts.slice(0, parts.length - 1).join(' ');
  return { last: last, firstInitial: formatFirstInitial(firstTokens) };
}

/* Helper: extract player ids / last names from a match */
function extractPlayersFromMatch(m){
  const ids = new Set();
  const lastNames = new Set();

  const addId = (v) => { if(v !== undefined && v !== null && String(v).trim() !== '') ids.add(String(v)); };
  const addNameLast = (v) => {
    if(!v) return;
    const s = String(v).trim();
    if(!s) return;
    const { last } = splitNameToLastAndInitial(s);
    if(last) lastNames.add(last.toUpperCase());
  };

  addId(m.player_id_winner || m.winner_player_id || m.winner_id || m.player_id_winner);
  addId(m.player_id_loser  || m.loser_player_id  || m.loser_id  || m.player_id_loser);
  addNameLast(m.winner_player_name || m.winner_name || m.winner);
  addNameLast(m.loser_player_name  || m.loser_name  || m.loser);

  return { ids: Array.from(ids), lastNames: Array.from(lastNames) };
}

/* test whether match 'prev' contains participant pid (or lastName fallback) */
function matchContainsPlayer(prevMatch, pid, lastName){
  if(!prevMatch) return false;
  const pids = [prevMatch.player_id_winner, prevMatch.player_id_loser, prevMatch.winner_player_id, prevMatch.loser_player_id, prevMatch.winner, prevMatch.loser];
  for(const x of pids){
    if(!x) continue;
    if(String(x) === String(pid)) return true;
  }
  if(lastName){
    const { last: lw } = splitNameToLastAndInitial(prevMatch.winner_player_name || prevMatch.winner_name || prevMatch.winner || '');
    const { last: ll } = splitNameToLastAndInitial(prevMatch.loser_player_name  || prevMatch.loser_name  || prevMatch.loser  || '');
    if(lw && lw.toUpperCase() === lastName.toUpperCase()) return true;
    if(ll && ll.toUpperCase() === lastName.toUpperCase()) return true;
  }
  return false;
}

/* ---------------------------
   AUGMENTATION : INSÉRER DES MATCHS "BYE" SYNTHÉTIQUES
   ---------------------------
   Nouvelle stratégie :
   - pour chaque match courant (colIndex), on essaye d'assigner les vrais matches du prev round
     aux emplacements logiques 2*j / 2*j+1 en testant les player ids (puis fallback nom de famille)
   - les prev matches non appariés sont dispatchés dans les slots restants
   - on ajoute des synthétiques (BYE) pour les participants qui n'ont aucun prev match
*/
function augmentByes(groups, rounds){
  for(let colIndex = 1; colIndex < rounds.length; colIndex++){
    const prevKey = rounds[colIndex - 1];
    const currKey = rounds[colIndex];
    const prevMatches = groups[prevKey] = groups[prevKey] || [];
    const currMatches = groups[currKey] = groups[currKey] || [];

    const originalPrev = prevMatches.slice(); // snapshot
    const originalPrevCount = originalPrev.length;
    const currCount = currMatches.length || 0;

    // desired slots: 2 * currCount (each child has 2 source slots) but at least keep existing count
    const desiredPrevCount = Math.max(originalPrevCount, currCount * 2);

    // build empty slots
    const slots = new Array(desiredPrevCount).fill(null);
    const placedPrev = new Array(originalPrevCount).fill(false);

    // Precompute children participants (ids and last names)
    const childPlayers = currMatches.map(cm => {
      const winnerId = cm.player_id_winner || cm.winner_player_id || cm.winner || '';
      const loserId  = cm.player_id_loser  || cm.loser_player_id  || cm.loser  || '';
      const winnerLast = splitNameToLastAndInitial(cm.winner_player_name || cm.winner_name || cm.winner || '').last;
      const loserLast  = splitNameToLastAndInitial(cm.loser_player_name  || cm.loser_name  || cm.loser  || '').last;
      return {
        winnerId: winnerId ? String(winnerId) : '',
        loserId: loserId ? String(loserId) : '',
        winnerLast: winnerLast || '',
        loserLast: loserLast || ''
      };
    });

    // 1) Try to associate each originalPrev match to a child slot by matching player ids or last names
    for(let i = 0; i < originalPrevCount; i++){
      const pm = originalPrev[i];
      if(!pm) continue;
      const info = extractPlayersFromMatch(pm);
      // try to find a child where any of pm ids/lastNames appear
      let assigned = false;
      for(let j = 0; j < childPlayers.length && !assigned; j++){
        const child = childPlayers[j];
        // check id intersection
        for(const pid of info.ids){
          if(pid === '') continue;
          if(child.winnerId && String(child.winnerId) === String(pid)) { assigned = true; break; }
          if(child.loserId && String(child.loserId) === String(pid))  { assigned = true; break; }
        }
        // fallback last name match
        if(!assigned){
          for(const ln of info.lastNames){
            if(!ln) continue;
            if(child.winnerLast && child.winnerLast.toUpperCase() === ln.toUpperCase()) { assigned = true; break; }
            if(child.loserLast && child.loserLast.toUpperCase() === ln.toUpperCase())  { assigned = true; break; }
          }
        }
        if(assigned){
          // try put pm into child's slots (2*j or 2*j+1)
          const t0 = 2*j, t1 = 2*j + 1;
          let placed = false;
          if(t0 < desiredPrevCount && slots[t0] === null){ slots[t0] = pm; placed = true; }
          else if(t1 < desiredPrevCount && slots[t1] === null){ slots[t1] = pm; placed = true; }
          else {
            // if both full, find nearest empty around t0..t1
            let found = false;
            for(let d = 1; d < desiredPrevCount && !found; d++){
              const cand = t0 - d;
              if(cand >= 0 && slots[cand] === null){ slots[cand] = pm; found = true; placed = true; break; }
              const cand2 = t1 + d;
              if(cand2 < desiredPrevCount && slots[cand2] === null){ slots[cand2] = pm; found = true; placed = true; break; }
            }
          }
          if(placed){
            placedPrev[i] = true;
          } else {
            // if couldn't place (rare), leave unplaced for next step
            assigned = false;
          }
        }
      } // end for childPlayers
    } // end for originalPrev

    // 2) Place any remaining original prev matches into first empty slots (left->right)
    for(let i = 0; i < originalPrevCount; i++){
      if(placedPrev[i]) continue;
      const pm = originalPrev[i];
      for(let s = 0; s < desiredPrevCount; s++){
        if(slots[s] === null){
          slots[s] = pm;
          placedPrev[i] = true;
          break;
        }
      }
    }

    // 3) For each child, create synths for participants that don't exist in ANY original prev match
    // Build a set of all ids present in originalPrev for quick lookup
    const idsInPrev = new Set();
    const lastNamesInPrev = new Set();
    for(const pm of originalPrev){
      if(!pm) continue;
      const ex = extractPlayersFromMatch(pm);
      ex.ids.forEach(x => idsInPrev.add(String(x)));
      ex.lastNames.forEach(x => lastNamesInPrev.add(String(x).toUpperCase()));
    }

    const insertedSynthIds = new Set();
    for(let j = 0; j < childPlayers.length; j++){
      const child = childPlayers[j];
      const t0 = 2*j, t1 = 2*j + 1;
      const preferredSlots = [];
      if(t0 < desiredPrevCount) preferredSlots.push(t0);
      if(t1 < desiredPrevCount) preferredSlots.push(t1);

      // helper to place synth into first available among preferred, else nearest
      const placeSynth = (synth) => {
        for(const s of preferredSlots){
          if(slots[s] === null){
            slots[s] = synth;
            return true;
          }
        }
        // nearest search outward from t0
        const base = preferredSlots.length ? preferredSlots[0] : 0;
        for(let d = 1; d < desiredPrevCount + 2; d++){
          const c1 = base - d;
          const c2 = base + d;
          if(c1 >= 0 && slots[c1] === null){ slots[c1] = synth; return true; }
          if(c2 < desiredPrevCount && slots[c2] === null){ slots[c2] = synth; return true; }
        }
        return false;
      };

      // winner
      if(child.winnerId){
        const presentById = idsInPrev.has(String(child.winnerId));
        const presentByLast = lastNamesInPrev.has(String(child.winnerLast).toUpperCase());
        if(!presentById && !presentByLast && !insertedSynthIds.has(String(child.winnerId))){
          const synth = {
            match_id: 'synth_' + String(child.winnerId) + '_' + colIndex + '_' + j + '_' + Math.floor(Math.random()*1000000),
            round: prevKey,
            player_id_winner: child.winnerId,
            winner_player_name: '', // optional
            winner_country: '',
            winner_seed: '',
            player_id_loser: '',
            loser_player_name: '',
            loser_country: '',
            loser_seed: ''
          };
          if(placeSynth(synth)) insertedSynthIds.add(String(child.winnerId));
        }
      }

      // loser
      if(child.loserId){
        const presentById = idsInPrev.has(String(child.loserId));
        const presentByLast = lastNamesInPrev.has(String(child.loserLast).toUpperCase());
        if(!presentById && !presentByLast && !insertedSynthIds.has(String(child.loserId))){
          const synth = {
            match_id: 'synth_' + String(child.loserId) + '_' + colIndex + '_' + j + '_' + Math.floor(Math.random()*1000000),
            round: prevKey,
            player_id_winner: child.loserId,
            winner_player_name: '',
            winner_country: '',
            winner_seed: '',
            player_id_loser: '',
            loser_player_name: '',
            loser_country: '',
            loser_seed: ''
          };
          if(placeSynth(synth)) insertedSynthIds.add(String(child.loserId));
        }
      }
    } // end for each child

    // 4) Compact non-null slots into newPrev preserving left->right order
    const newPrev = [];
    for(let s = 0; s < slots.length; s++){
      if(slots[s] !== null) newPrev.push(slots[s]);
    }

    // replace groups[prevKey]
    groups[prevKey] = newPrev;
  } // end for colIndex
}

/* ---------------------------
   RENDERING
   --------------------------- */
async function render(){
  const params = new URLSearchParams(location.search);
  const source = (params.get('source') || 'wta').toLowerCase();
  // pour test local, si pas d'id/year on insère un JSON d'exemple
  const id = params.get('t') || params.get('id') || '';
  const year = params.get('year') || '';

  let json;
  if(!id || !year){
    // JSON minimal de test (inspire-toi et adapte selon ton format réel)
    json = {
      meta: { tourney_name: 'TEST' },
      matches: [
        /* round 1 (prev) example: certains matches réels; certains manquants (BYE)
           nous laissons volontairement quelques prev matches vides pour tester synth.
        */
        { match_id: 'r1_m1', round: 'R1', winner_player_name: 'MULLER, A.', loser_player_name: 'KECMANOVIC, M.', player_id_winner: 'p1', player_id_loser: 'p2' },
        { match_id: 'r1_m2', round: 'R1', winner_player_name: 'GIRON, M.', loser_player_name: 'DJERE, L.', player_id_winner: 'p3', player_id_loser: 'p4' },
        { match_id: 'r1_m3', round: 'R1', winner_player_name: 'MMOH, M.', loser_player_name: 'TABILO, A.', player_id_winner: 'p5', player_id_loser: 'p6' },
        // note: pas de match pour KHACHANOV (BYE in real) => will be synthesized
        // note: pas de match pour BUBLIK (BYE) => synth
        // round 2 (curr)
        { match_id: 'r2_m1', round: 'R2', winner_player_name: 'GIRON, M.', loser_player_name: 'MULLER, A.', player_id_winner: 'p3', player_id_loser: 'p1' },
        { match_id: 'r2_m2', round: 'R2', winner_player_name: 'MMOH, M.', loser_player_name: 'KHACHANOV, K.', player_id_winner: 'p5', player_id_loser: 'p7' },
        { match_id: 'r2_m3', round: 'R2', winner_player_name: 'SHANG, J.', loser_player_name: 'SONEGO, L.', player_id_winner: 'p8', player_id_loser: 'p9' },
        { match_id: 'r2_m4', round: 'R2', winner_player_name: 'BUBLIK, A.', loser_player_name: 'VAN DE ZANDSCHULP, B.', player_id_winner: 'p10', player_id_loser: 'p11' },
        // round 3 (QF)
        { match_id: 'qf_m1', round: 'QF', winner_player_name: 'GIRON, M.', loser_player_name: 'MMOH, M.', player_id_winner: 'p3', player_id_loser: 'p5' }
      ]
    };
  } else {
    // si vrai fetch requis, charger comme avant
    const path = `/data/tournaments/${source}_${id}_${year}.json`;
    try{
      const resp = await fetch(path);
      if(!resp.ok) throw new Error('JSON not found: ' + path);
      json = await resp.json();
    }catch(err){
      document.getElementById('bracketContainer').innerHTML = '<div style="padding:12px;color:red">Error loading JSON: ' + err.message + '</div>';
      console.error(err); return;
    }
  }

  document.getElementById('tourney-title').textContent = json.meta?.tourney_name || 'Tournament';

  function norm(r){
    if(!r) return 'Unknown';
    r = r.trim();
    const u = r.toUpperCase();
    if(u==='F' || u.startsWith('FINAL')) return 'F';
    if(u==='SF' || u.startsWith('SEMIF')) return 'SF';
    if(u==='QF' || u.startsWith('QUART')) return 'QF';
    if(u==='R1' || u==='R2' || u==='R3') return u;
    return u;
  }

  const matches = (json.matches || []).map(m => Object.assign({}, m));
  const groups = {};
  matches.forEach(m => {
    const r = norm(m.round || '');
    groups[r] = groups[r] || [];
    groups[r].push(m);
  });

  // order rounds left->right (most matches at left)
  const rounds = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);

  // AUGMENTATION : insérer les BYE synthétiques
  augmentByes(groups, rounds);

  // layout constants
  const cellWidth = 220;
  const cellHeight = 20;
  const perMatchBlock = 60;
  const colGap = 40;

  let maxBlocks = 0;
  rounds.forEach(r => { maxBlocks = Math.max(maxBlocks, groups[r].length); });
  const containerHeight = Math.max(220, maxBlocks * perMatchBlock + 60);
  const container = document.getElementById('bracketContainer');
  container.style.position = 'relative';
  container.style.height = containerHeight + 'px';
  container.innerHTML = '';

  const positionsByRound = [];

  rounds.forEach((rnd, colIndex) => {
    const matchesInRound = groups[rnd] || [];
    matchesInRound.sort((a,b)=>{
      const aa = (a.match_id||'').replace(/[^0-9]/g,''), bb = (b.match_id||'').replace(/[^0-9]/g,'');
      const ia = aa ? parseInt(aa,10) : 0, ib = bb ? parseInt(bb,10) : 0;
      return ia - ib;
    });

    const n = matchesInRound.length;
    const columnHeight = (n - 1) * perMatchBlock + cellHeight + 20;
    const topOffset = Math.max(10, Math.round((containerHeight - columnHeight) / 2));

    const prevPositions = colIndex > 0 ? positionsByRound[colIndex - 1] : null;
    const prevCount = prevPositions ? prevPositions.length : 0;
    const currCount = matchesInRound.length;

    const thisPositions = [];

    matchesInRound.forEach((m, j) => {
      let winnerTop;
      if(colIndex === 0){
        winnerTop = topOffset + j * perMatchBlock;
      } else {
        // compute mapping in prevPositions similar to augment logic:
        let startIndex = Math.floor(j * prevCount / Math.max(1, currCount));
        let endIndex = Math.floor(((j+1) * prevCount) / Math.max(1, currCount)) - 1;
        if(endIndex < startIndex) endIndex = startIndex;
        if(startIndex >= prevCount) startIndex = prevCount - 1;
        if(endIndex >= prevCount) endIndex = prevCount - 1;
        let sum = 0, cnt = 0;
        for(let k = Math.max(0, startIndex); k <= Math.max(0, endIndex); k++){
          if(prevPositions[k]){
            sum += prevPositions[k].winnerTop;
            cnt++;
          }
        }
        if(cnt === 0){
          winnerTop = topOffset + j * perMatchBlock;
        } else {
          winnerTop = Math.round(sum / cnt);
        }
      }

      const loserTop = winnerTop + cellHeight;
      thisPositions.push({ winnerTop, loserTop, matchRef: m });

      // render winner
      const left = colIndex * (cellWidth + colGap);
      const winnerId = m.player_id_winner || m.winner_player_id || ('pwin_' + colIndex + '_' + j);
      const winnerClass = 'j_' + String(winnerId);
      const winnerDiv = document.createElement('div');
      winnerDiv.className = winnerClass + ' match-row';
      winnerDiv.setAttribute('onmouseover', `highlight_player(1, '${winnerClass}', 1);`);
      winnerDiv.setAttribute('onmouseout', `highlight_player(2, '${winnerClass}');`);
      winnerDiv.style.position = 'absolute';
      winnerDiv.style.top = winnerTop + 'px';
      winnerDiv.style.left = left + 'px';
      winnerDiv.style.height = cellHeight + 'px';
      winnerDiv.style.width = cellWidth + 'px';
      winnerDiv.style.borderTop = '1px solid rgb(121, 121, 121)';
      winnerDiv.style.textAlign = 'left';
      winnerDiv.style.padding = '0 6px';
      winnerDiv.style.display = 'flex';
      winnerDiv.style.alignItems = 'center';
      winnerDiv.style.gap = '6px';

      const wseedRaw = m.winner_seed || m.winnerSeed || '';
      const wseed = formatSeed(wseedRaw);
      const seedNode = document.createElement('div');
      if(wseed && /^\d+$/.test(wseed)) { seedNode.className='seed-num'; seedNode.textContent = wseed; }
      else { seedNode.className='seed-text'; seedNode.innerHTML = (wseed? wseed : '&nbsp;'); }
      winnerDiv.appendChild(seedNode);

      const wflagSpan = makeFlagElem(m.winner_country || m.winner_nationality || m.winner_country_code || '');
      winnerDiv.appendChild(wflagSpan);

      const wname = m.winner_player_name || m.winner_name || '';
      const { last: wlast, firstInitial: wfirstInitial } = splitNameToLastAndInitial(wname);
      const wAnchor = document.createElement('a');
      const wSlug = slugify(wname);
      const href = (m.player_id_winner ? `/player/${wSlug}/${m.player_id_winner}/` : '#');
      wAnchor.href = href;
      wAnchor.className = 'player-link';
      wAnchor.innerHTML = `<strong style="font-size:11px">${(wlast || '—').toUpperCase()}</strong><span class="player-first">${ wfirstInitial ? ', ' + wfirstInitial : '' }</span>`;
      winnerDiv.appendChild(wAnchor);
      container.appendChild(winnerDiv);

      // render loser
      const loserId = m.player_id_loser || m.loser_player_id || ('plos_' + colIndex + '_' + j);
      const loserClass = 'j_' + String(loserId);
      const loserDiv = document.createElement('div');
      loserDiv.className = loserClass + ' match-row';
      loserDiv.setAttribute('onmouseover', `highlight_player(1, '${loserClass}', 1);`);
      loserDiv.setAttribute('onmouseout', `highlight_player(2, '${loserClass}');`);
      loserDiv.style.position = 'absolute';
      loserDiv.style.top = loserTop + 'px';
      loserDiv.style.left = left + 'px';
      loserDiv.style.height = cellHeight + 'px';
      loserDiv.style.width = cellWidth + 'px';
      loserDiv.style.borderBottom = '1px solid rgb(121, 121, 121)';
      loserDiv.style.textAlign = 'left';
      loserDiv.style.padding = '0 6px';
      loserDiv.style.display = 'flex';
      loserDiv.style.alignItems = 'center';
      loserDiv.style.gap = '6px';

      const lseedRaw = m.loser_seed || m.loserSeed || '';
      const lseed = formatSeed(lseedRaw);
      const seedNode2 = document.createElement('div');
      if(lseed && /^\d+$/.test(lseed)) { seedNode2.className='seed-num'; seedNode2.textContent = lseed; }
      else { seedNode2.className='seed-text'; seedNode2.innerHTML = (lseed? lseed : '&nbsp;'); }
      loserDiv.appendChild(seedNode2);

      const lflagSpan = makeFlagElem(m.loser_country || m.loser_nationality || m.loser_country_code || '');
      loserDiv.appendChild(lflagSpan);

      const lname = m.loser_player_name || m.loser_name || '';
      if(!lname){
        const byeSpan = document.createElement('span');
        byeSpan.className = 'bye';
        byeSpan.textContent = 'BYE';
        loserDiv.appendChild(byeSpan);
      } else {
        const { last: llast, firstInitial: lfirstInitial } = splitNameToLastAndInitial(lname);
        const lAnchor = document.createElement('a');
        const lSlug = slugify(lname);
        const lhref = (m.player_id_loser ? `/player/${lSlug}/${m.player_id_loser}/` : '#');
        lAnchor.href = lhref;
        lAnchor.className = 'player-link';
        lAnchor.innerHTML = `<strong style="font-size:11px">${(llast || '—').toUpperCase()}</strong><span class="player-first">${ lfirstInitial ? ', ' + lfirstInitial : '' }</span>`;
        loserDiv.appendChild(lAnchor);
      }
      container.appendChild(loserDiv);
    });

    positionsByRound.push(thisPositions);
  });

  // FIN
} // end render

render();
</script>

</body>
</html>

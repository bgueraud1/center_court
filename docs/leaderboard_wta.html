<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Leaderboard - Center Court</title>
<style>
  :root{
    --bg:#ffffff; --muted:#666; --accent:#2b63c6;
    --row-base-h:210;
    --row-base-s:70%;
  }
  body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:20px; color:#111; background:var(--bg); }
  .container{ max-width:1100px; margin:0 auto; }
  h1{ font-size:20px; margin-bottom:10px; }
  .controls{ display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  select, .search, input[type="number"]{ padding:8px 10px; border:1px solid #ddd; border-radius:6px; }
  label.inline{ display:flex; align-items:center; gap:8px; }
  .table{ border-collapse:collapse; width:100%; box-shadow:0 2px 8px rgba(0,0,0,0.04); border-radius:8px; overflow:hidden; }
  .table thead th{ text-align:left; background:#fafafa; padding:10px 12px; font-weight:600; border-bottom:1px solid #eee; }
  .table tbody td{ padding:10px 12px; border-bottom:1px solid rgba(0,0,0,0.04); vertical-align:middle; }
  .player-text{ display:flex; gap:8px; align-items:center; color:inherit; }
  .flag{ font-size:18px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif; line-height:1; }
  .rank-badge{ min-width:36px; text-align:center; padding:6px 8px; border-radius:6px; background:rgba(0,0,0,0.04); font-weight:700; }
  .muted{ color:var(--muted); font-size:13px; }
  .empty-note{ padding:18px; color:var(--muted); }
  .clickable-row{ cursor:pointer; }
  .clickable-row:focus{ outline:2px solid rgba(43,99,198,0.25); }
  @media (max-width:720px){
    .table thead th:nth-child(4), .table tbody td:nth-child(4){ display:none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Leaderboard</h1>

  <div class="controls">
    <label class="inline">Statistic:
      <select id="stat-select" aria-label="Select statistic"></select>
    </label>

    <label class="inline">Search:
      <input id="search" class="search" placeholder="Search a player..." aria-label="Search players" />
    </label>

    <label class="inline" title="Exclude players with fewer than N matches">
      <input type="checkbox" id="filter-min-matches" checked />
      <span>Exclude players with &lt;</span>
      <input type="number" id="min-matches" min="0" value="50" style="width:80px" aria-label="Minimum matches" />
      <span>matches</span>
    </label>

    <div class="muted" id="total-count" aria-live="polite"></div>
  </div>

  <div id="table-wrap">
    <table class="table" id="leaderboard-table" aria-describedby="total-count">
      <thead>
        <tr>
          <th style="width:80px">Rank</th>
          <th>Player</th>
          <th style="width:60px">Country</th>
          <th style="width:140px">Value</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4" class="empty-note">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
(async function(){
  const LEADERBOARDS_BASE = './leaderboards';
  const indexUrl = `${LEADERBOARDS_BASE}/index.json`;

  async function fetchJson(u){
    const r = await fetch(u);
    if(!r.ok) throw new Error('fetch failed: ' + r.status);
    return r.json();
  }

  function countryCodeToFlagEmoji(code){
    if(!code) return '';
    const c = String(code).trim().toUpperCase();
    if(c.length !== 2) return '';
    const OFFSET = 0x1F1E6 - 'A'.charCodeAt(0);
    return String.fromCodePoint(c.charCodeAt(0) + OFFSET, c.charCodeAt(1) + OFFSET);
  }

  function rowShade(index){
    const hue = 210;
    const sat = 70;
    const baseLight = 96;
    const step = 1.6;
    const pos = index % 10;
    const oddOffset = (index % 2 === 0) ? 1.2 : -1.2;
    const light = Math.max(86, baseLight - (pos * step) + oddOffset);
    return `hsl(${hue} ${sat}% ${light}%)`;
  }

  function formatValue(v, type){
    if(v === null || v === undefined || v === '') return '';
    if(type === 'int'){
      try{ return String(Math.round(Number(v))); }catch(e){ return String(v); }
    }
    if(type === 'pct'){
      try{
        let n = Number(v);
        if(Math.abs(n) <= 1.0) n = n * 100.0;
        return (Math.round(n*100)/100).toFixed(2) + '%';
      }catch(e){ return String(v); }
    }
    if(type === 'float'){
      try{ return (Math.round(Number(v)*1000)/1000).toFixed(3); }catch(e){ return String(v); }
    }
    return String(v);
  }

  let index;
  try{
    index = await fetchJson(indexUrl);
  }catch(e){
    document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" class="empty-note">Unable to load leaderboards index (${indexUrl}).</td></tr>`;
    console.error(e);
    return;
  }
  const stats = index.stats || [];
  const select = document.getElementById('stat-select');
  stats.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.stat_key;
    opt.textContent = s.label || s.stat_key;
    opt.dataset.type = s.type || 'float';
    select.appendChild(opt);
  });

  function getMatchesCount(entry){
    if(!entry) return null;
    const cand = ['matches', 'matches_count', 'matches_played', 'total_matches', 'n_matches'];
    for(const k of cand){
      if(Object.prototype.hasOwnProperty.call(entry, k)){
        const v = entry[k];
        const n = Number(v);
        if(!Number.isNaN(n)) return n;
      }
    }
    if(entry.stats && typeof entry.stats === 'object'){
      for(const k of cand){
        if(Object.prototype.hasOwnProperty.call(entry.stats, k)){
          const n = Number(entry.stats[k]);
          if(!Number.isNaN(n)) return n;
        }
      }
    }
    return null;
  }

  function slugifyForPlayers(id, name){
    const pid = (id || '').toString().toLowerCase();
    let n = (name || '').toString().toLowerCase();
    n = n.normalize('NFD').replace(/\p{Diacritic}/gu, '');
    n = n.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').replace(/-{2,}/g, '-');
    if(pid && n) return `${pid}-${n}`;
    if(n) return n;
    if(pid) return pid;
    return null;
  }

  // build player URL: FIRST prefer entry.profile_url (if present), else try slug fields, else fallback slugify
  function playerUrlFromEntry(entry){
    if(!entry) return null;
    if(entry.profile_url && String(entry.profile_url).trim()){
      return String(entry.profile_url);
    }
    const slugFields = ['slug', 'player_slug', 'profile_slug'];
    for(const f of slugFields){
      if(entry[f]) return `/players_atp/${encodeURIComponent(String(entry[f]))}`;
    }
    const id = entry.player_id || entry.player || entry.id || null;
    const name = entry.player_name || entry.name || null;
    const fallback = slugifyForPlayers(id, name);
    if(fallback) return `/players_atp/${encodeURIComponent(fallback)}`;
    return null;
  }

  let currentData = null;
  async function loadAndRender(statKey){
    const url = `${LEADERBOARDS_BASE}/${statKey}.json`;
    let data;
    try{
      data = await fetchJson(url);
    }catch(e){
      document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" class="empty-note">Unable to load ${url}</td></tr>`;
      console.error(e);
      return;
    }
    currentData = data;
    renderTable(data);
  }

  function renderTable(data){
    const tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = '';
    const t = data;
    const typ = t.type || 'float';
    let entries = Array.isArray(t.entries) ? t.entries.slice() : [];
    const totalBefore = entries.length;

    const useMin = document.getElementById('filter-min-matches').checked;
    const minMatches = Math.max(0, Number(document.getElementById('min-matches').value) || 0);
    if(useMin && minMatches > 0){
      entries = entries.filter(e => {
        const n = getMatchesCount(e);
        return (n === null) || (n >= minMatches);
      });
    }

    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    if(q){
      entries = entries.filter(e => {
        const name = (e.player_name || e.player || '').toString().toLowerCase();
        const pid = (e.player_id || '').toString().toLowerCase();
        return name.includes(q) || pid.includes(q);
      });
    }

    const totalAfter = entries.length;
    document.getElementById('total-count').textContent = `${totalAfter} players` + (useMin ? ` (filtered from ${totalBefore})` : '');

    if(!Array.isArray(entries) || entries.length === 0){
      tbody.innerHTML = `<tr><td colspan="4" class="empty-note">No data for this statistic.</td></tr>`;
      return;
    }

    for(let i=0;i<entries.length;i++){
      const e = entries[i];
      const tr = document.createElement('tr');
      tr.className = 'clickable-row';
      tr.style.background = rowShade(i);
      tr.setAttribute('tabindex','0');
      tr.setAttribute('role','link');

      const tdRank = document.createElement('td'); tdRank.innerHTML = `<div class="rank-badge">${e.rank != null ? e.rank : ''}</div>`;

      const tdPlayer = document.createElement('td');
      const span = document.createElement('span');
      span.className = 'player-text';
      const flag = document.createElement('span'); flag.className='flag'; flag.textContent = countryCodeToFlagEmoji(e.country_code) || '';
      const name = document.createElement('span'); name.textContent = e.player_name || e.player || e.player_id || '';
      span.appendChild(flag); span.appendChild(name);
      tdPlayer.appendChild(span);

      const tdCountry = document.createElement('td'); tdCountry.style.textAlign='center'; tdCountry.textContent = e.country_code || '';
      const tdVal = document.createElement('td'); tdVal.style.fontWeight='700'; tdVal.textContent = formatValue(e.value, typ);

      tr.appendChild(tdRank); tr.appendChild(tdPlayer); tr.appendChild(tdCountry); tr.appendChild(tdVal);

      // IMPORTANT: prefer profile_url from the JSON
      const targetUrl = playerUrlFromEntry(e);

      tr.addEventListener('click', (ev) => {
        if(targetUrl) {
          // navigate directly; this mirrors your working players_atp/<slug> routing
          window.location.href = targetUrl;
        }
      });
      tr.addEventListener('keydown', (ev) => {
        if(ev.key === 'Enter' && targetUrl){
          ev.preventDefault();
          window.location.href = targetUrl;
        }
      });

      tbody.appendChild(tr);
    }
  }

  select.addEventListener('change', async (ev) => {
    const key = select.value;
    await loadAndRender(key);
    const u = new URL(window.location.href);
    u.searchParams.set('stat', key);
    history.replaceState({}, '', u.toString());
  });
  document.getElementById('search').addEventListener('input', function(){ if(currentData) renderTable(currentData); });
  document.getElementById('filter-min-matches').addEventListener('change', function(){ if(currentData) renderTable(currentData); });
  document.getElementById('min-matches').addEventListener('input', function(){ if(currentData) renderTable(currentData); });

  const params = new URLSearchParams(window.location.search);
  const initial = params.get('stat') || (select.options.length ? select.options[0].value : null);
  if(initial){
    select.value = initial;
    await loadAndRender(initial);
  } else {
    document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" class="empty-note">No statistic found.</td></tr>`;
  }

})();
</script>
</body>
</html>

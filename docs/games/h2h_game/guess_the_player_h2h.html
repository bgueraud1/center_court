<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guess The Player — H2H (6 modes + leaderboard)</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700,800&display=swap" rel="stylesheet">

<script src="/js/auth.js" defer></script>
<script src="/js/leaderboard-client.js" defer></script>

<style>
  :root{
    --bg1: #071226;
    --bg2: #081428;
    --muted:#94a3b8;
    --success:#16a34a;
    --danger:#ef4444;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color-scheme: dark;
  }

  html,body{
    height:100%;
    margin:0;
    background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .wrap{
    max-width:1100px;
    margin:28px auto;
    padding:20px;
    border-radius:14px;
    position:relative;
    z-index:2;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow: 0 8px 40px rgba(2,6,23,0.6);
    border: 1px solid rgba(255,255,255,0.03);
  }

  header{
    display:flex;
    align-items:center;
    gap:16px;
  }

  h1{
    margin:0;
    font-weight:800;
    color:#eef2ff;
    font-size:1.25rem;
  }

  .sub{
    color:var(--muted);
    font-size:0.9rem;
    margin-top:4px;
  }

  .controls{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-top:18px;
    align-items:center;
  }

  .card{
    background:transparent;
    padding:12px;
    border-radius:12px;
  }

  .segment{
    display:flex;
    background:transparent;
    border-radius:10px;
    padding:4px;
    gap:6px;
  }

  .seg-btn{
    padding:8px 12px;
    border-radius:8px;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-weight:600;
    background:transparent;
    transition:all .18s ease;
  }

  .seg-btn.active{
    color:white;
    box-shadow:0 6px 18px rgba(2,6,23,0.6);
    transform:translateY(-2px);
  }

  .tour-toggle{
    display:flex;
    gap:6px;
  }

  .tour-btn{
    min-width:72px;
    padding:8px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.04);
    cursor:pointer;
    font-weight:700;
    background:transparent;
    color:var(--muted);
    transition:all .18s ease;
  }

  .tour-btn.active.atp{
    background:linear-gradient(180deg,#0f274a,#132a44);
    color:#cfe8ff;
    border-color: rgba(31,70,120,0.35);
  }

  .tour-btn.active.wta{
    background:linear-gradient(180deg,#2c1b37,#372042);
    color:#efe6ff;
    border-color: rgba(90,50,120,0.28);
  }

  .game-meta{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:18px;
  }

  .chip{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:8px 12px;
    border-radius:999px;
    color:var(--muted);
    font-weight:600;
    border:1px solid rgba(255,255,255,0.02);
  }

  .chip strong {
    color:#fff;
  }

  .input-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:12px;
  }

  input[type="text"], input[type="password"]{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.06);
    background:transparent;
    color:#fff;
    min-width:200px;
  }

  button.primary{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    background:#1f7aec;
    color:white;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(31,122,236,0.12);
  }

  button.ghost{
    background:transparent;
    border:1px solid rgba(255,255,255,0.04);
    color:var(--muted);
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
  }

  .suggestions{
    position:relative;
  }

  .suggestions-list{
    position:absolute;
    left:0;
    top:44px;
    width:100%;
    max-height:220px;
    overflow:auto;
    background:linear-gradient(180deg,#0b1220,#071025);
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.04);
    z-index:80;
    box-shadow:0 10px 40px rgba(2,6,23,0.6);
    padding:0;
    margin:0;
  }

  .suggestions-list li{
    list-style:none;
    padding:8px 10px;
    color:#e6eef8;
    cursor:pointer;
    border-bottom:1px dashed rgba(255,255,255,0.02);
  }

  .suggestions-list li:hover,
  .suggestions-list li.highlight{
    background: rgba(255,255,255,0.02);
    color: #fff;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:14px;
    color:#e6eef8;
  }

  th,td{
    padding:10px;
    text-align:left;
    border-bottom:1px dashed rgba(255,255,255,0.03);
    font-size:0.95rem;
  }

  thead th{
    color:var(--muted);
    font-weight:700;
  }

  .country-text{
    margin-top:14px;
    padding:16px;
    border-radius:12px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(6px);
    color:#fff;
    border:1px solid rgba(255,255,255,0.04);
  }

  .modal {
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.8));
    z-index:400;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }

  .modal.show{
    opacity:1;
    pointer-events:auto;
  }

  .modal-card{
    background:linear-gradient(180deg, rgba(11,17,32,0.98), rgba(8,12,23,0.96));
    padding:26px;
    border-radius:16px;
    max-width:520px;
    width:94%;
    box-shadow:0 30px 80px rgba(2,6,23,0.8);
    border:1px solid rgba(255,255,255,0.03);
    text-align:center;
  }

  .toast{
    position:fixed;
    right:18px;
    bottom:18px;
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    box-shadow:0 6px 24px rgba(0,0,0,0.6);
    display:none;
    z-index:220;
  }

  .lb-card{
    margin-left:auto;
    display:flex;
    gap:8px;
    align-items:center;
    position:relative;
  }

  #lb-status{
    color:var(--muted);
    font-size:0.9rem;
    margin-left:8px;
    min-width: 220px;
    text-align: right;
  }

  .user-chip{
    cursor:pointer;
    color:#fff;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    padding:8px 12px;
    border-radius:999px;
    user-select:none;
  }

  .user-chip .lb-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:12px;
    color:white;
    background: linear-gradient(135deg,#2b8af6,#7b5cf6);
    box-shadow: 0 4px 12px rgba(43,138,246,0.18), inset 0 -2px 6px rgba(0,0,0,0.12);
    flex: 0 0 auto;
  }

  .user-dropdown {
    position:absolute;
    right:0;
    top:54px;
    background: linear-gradient(180deg,#081025,#06101a);
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.04);
    box-shadow:0 12px 40px rgba(2,6,23,0.6);
    min-width:160px;
    overflow:hidden;
    z-index:220;
  }

  .user-dropdown button {
    display:block;
    width:100%;
    text-align:left;
    padding:10px 12px;
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-weight:700;
  }

  .user-dropdown button:hover{
    color:#fff;
    background: rgba(255,255,255,0.02);
  }

  .connect-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg, #1f7aec, #7b5cf6);
  }

  @media (max-width:880px){
    input[type="text"]{min-width:140px}
    .chip{font-size:0.85rem}
    th,td{padding:8px;font-size:0.9rem}
    #lb-status{min-width: 0; text-align: left;}
    header{flex-direction:column; align-items:flex-start;}
    .lb-card{margin-left:0; width:100%; justify-content:space-between;}
  }

  @media (prefers-reduced-motion: reduce){
    *{
      transition:none !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header style="align-items:flex-start">
      <div>
        <h1>Guess the Player</h1>
        <div class="sub">H2H game — Answers are updated daily.</div>
      </div>

      <div class="lb-card card" id="lbCard" aria-hidden="false" style="margin-left:auto;align-items:center;position:relative">
        <div id="lbBoxPlaceholder"></div>
        <div id="lb-status">Not connected</div>
      </div>
    </header>

    <div class="controls" style="margin-top:18px">
      <div class="card tour-toggle" style="padding:10px 12px">
        <button id="btnATP" class="tour-btn active atp" data-tour="ATP">ATP</button>
        <button id="btnWTA" class="tour-btn wta" data-tour="WTA">WTA</button>
      </div>

      <div class="card" style="padding:8px 10px">
        <div id="difficultySegment" class="segment" role="tablist" aria-label="difficulty">
          <button class="seg-btn active" data-level="easy" id="sEasy">Easy</button>
          <button class="seg-btn" data-level="medium" id="sMedium">Medium</button>
          <button class="seg-btn" data-level="hard" id="sHard">Hard</button>
        </div>
      </div>
    </div>

    <div class="game-meta" style="margin-top:18px">
      <div class="chip">Level: <strong id="levelLabel">Easy</strong></div>
      <div class="chip">Tour: <strong id="tourLabel">ATP</strong></div>
      <div class="chip">Remaining: <strong id="remaining">15</strong></div>
      <div class="chip">Score: <strong id="score">0</strong></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="input-row">
        <div style="flex:1;position:relative">
          <div class="suggestions" style="width:100%">
            <input id="guessInput" type="text" placeholder="Type a player name..." autocomplete="off" />
            <ul id="suggestionsList" class="suggestions-list" style="display:none"></ul>
          </div>
        </div>
        <button id="guessBtn" class="primary">Guess</button>
      </div>

      <div style="margin-top:10px;color:var(--muted);font-size:0.95rem">
        <span id="preloadStatus">H2H preload: idle</span>
      </div>

      <table id="guessesTable" aria-live="polite" style="margin-top:14px">
        <thead>
          <tr><th>#</th><th>Guessed name</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="h2hOutput" class="country-text" style="display:block;margin-top:16px">
        <div id="placeholder">H2H results will appear here.</div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <h2 id="modalTitle">Round result</h2>
      <p id="modalText" style="color:var(--muted)"></p>
      <div id="modalDetails" style="margin-top:12px;color:#e8f4ea"></div>
      <div style="margin-top:18px;display:flex;gap:12px;justify-content:center">
        <button id="closeModalBtn" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------------------
  CONFIG / KEYS
---------------------------- */
const SELECTED_PLAYERS_JSON = '/tools/selected_players.json';
const PLAYERS_CATALOG_JSON = '/tools/players_catalog.json';
const GEOCODES_JSON = '/tools/geocodes_combined.json';
const H2H_BY_PLAYER_BASE = '/data/h2h_by_player/';
const LB_QUEUE_KEY = 'lb_score_queue_guess6_v1';
const GAME_ID = 'guess_player_h2h';
const AUTH_HUB_URL = '/games/tennis_arena/index.html';
const LOCAL_PREFIX = 'guess_the_player_h2h_state_v1';

/* ---------------------------
  STATE
---------------------------- */
let selectedPlayers = null;
let playersCatalog = [];
let geocodes = {};

let target = null;
let currentTour = 'ATP';
let currentLevel = 'easy';
let remaining = 15;
let score = 0;
let gameStarted = false;
let gameBlockedDueToExisting = false;
let guesses = [];
let guessedNames = new Set();

let h2hByPlayerCache = {};
let composedH2HCache = {};
let preloadedCount = 0;
let assetsReady = false;
let roundFinished = false;
let finalResult = null;

/* ---------------------------
  DOM refs
---------------------------- */
let guessInput;
let suggestionsList;
let guessBtn;
let preloadStatusEl;
let levelLabelEl;
let tourLabelEl;
let remainingEl;
let scoreEl;
let lbStatusEl;
let lbBoxPlaceholderEl;

/* ---------------------------
  UTIL
---------------------------- */
function showToast(msg, t=2000){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', t);
}

function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}

function norm(s){
  return s ? s.normalize().replace(/[\u0300-\u036f]/g,'').toLowerCase() : '';
}

function getAuthApi(){
  return window.TA_AUTH || null;
}

function getSession(){
  const api = getAuthApi();
  if(api && typeof api.getSession === 'function'){
    return api.getSession();
  }
  return null;
}

function isConnected(){
  return !!getSession();
}

function getDisplayName(session){
  if(!session) return '';
  return String(session.pseudo || session.username || '').trim();
}

function setGuessEnabled(enabled){
  guessInput.disabled = !enabled;
  guessBtn.disabled = !enabled;
  if(!enabled){
    suggestionsList.style.display = 'none';
  }
}

function todayParisStr(){
  try{
    return new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Europe/Paris',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).format(new Date());
  } catch(e){
    return new Date().toISOString().slice(0, 10);
  }
}

function playerKey(session){
  const s = session || getSession();
  if(!s) return 'anon';
  return String(s.id || s.user_id || s.pseudo || s.username || 'anon');
}

function currentModeKey(){
  return `${currentTour}_h2h_${currentLevel}`;
}

function localStateKey(mode = currentModeKey(), session = getSession()){
  return `${LOCAL_PREFIX}:${todayParisStr()}:${playerKey(session)}:${mode}`;
}

function localLastModeKey(session = getSession()){
  return `${LOCAL_PREFIX}:${todayParisStr()}:${playerKey(session)}:last_mode`;
}

function cloneGuessForState(item){
  if(!item) return null;
  return {
    player_id: item.player_id || item.playerId || null,
    full_name: String(item.full_name || '').trim(),
    source: String(item.source || '').toUpperCase() || null
  };
}

function normalizeStoredGuess(item){
  if(!item) return null;
  if(typeof item === 'string'){
    return { player_id: null, full_name: item, source: null };
  }
  return {
    player_id: item.player_id || item.playerId || null,
    full_name: String(item.full_name || item.name || '').trim(),
    source: String(item.source || '').toUpperCase() || null
  };
}

function normalizeStoredTarget(item){
  if(!item) return null;
  return {
    player_id: item.player_id || item.playerId || null,
    full_name: String(item.full_name || item.name || '').trim(),
    source: String(item.source || '').toUpperCase() || null
  };
}

function saveState(){
  try{
    const mode = currentModeKey();
    const payload = {
      date: todayParisStr(),
      mode,
      currentTour,
      currentLevel,
      target: cloneGuessForState(target),
      remaining,
      score,
      gameStarted,
      gameBlockedDueToExisting,
      roundFinished,
      finalResult,
      guesses: Array.isArray(guesses) ? guesses.map(cloneGuessForState).filter(Boolean) : [],
      guessedNames: Array.from(guessedNames || []),
      ts: new Date().toISOString()
    };
    localStorage.setItem(localStateKey(mode), JSON.stringify(payload));
    localStorage.setItem(localLastModeKey(), mode);
  } catch(e){}
}

function loadState(mode = currentModeKey()){
  try{
    const raw = localStorage.getItem(localStateKey(mode));
    if(!raw) return null;
    const j = JSON.parse(raw);
    if(!j || typeof j !== 'object') return null;
    return j;
  } catch(e){
    return null;
  }
}

function loadLastState(){
  try{
    const mode = localStorage.getItem(localLastModeKey());
    if(mode){
      const st = loadState(mode);
      if(st) return st;
    }
  } catch(e){}
  return loadState();
}

function clearState(mode = currentModeKey()){
  try{
    localStorage.removeItem(localStateKey(mode));
  } catch(e){}
}

function syncModeUI(){
  const btnATP = document.getElementById('btnATP');
  const btnWTA = document.getElementById('btnWTA');
  const sEasy = document.getElementById('sEasy');
  const sMedium = document.getElementById('sMedium');
  const sHard = document.getElementById('sHard');

  if(btnATP) btnATP.classList.toggle('active', currentTour === 'ATP');
  if(btnWTA) btnWTA.classList.toggle('active', currentTour === 'WTA');

  if(sEasy) sEasy.classList.toggle('active', currentLevel === 'easy');
  if(sMedium) sMedium.classList.toggle('active', currentLevel === 'medium');
  if(sHard) sHard.classList.toggle('active', currentLevel === 'hard');

  if(levelLabelEl) levelLabelEl.textContent = currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1);
  if(tourLabelEl) tourLabelEl.textContent = currentTour;
}

async function restoreState(st){
  if(!st) return false;
  if(st.date !== todayParisStr()) return false;

  currentTour = String(st.currentTour || currentTour || 'ATP').toUpperCase();
  currentLevel = String(st.currentLevel || currentLevel || 'easy').toLowerCase();
  syncModeUI();

  target = normalizeStoredTarget(st.target) || target;
  remaining = Number.isFinite(Number(st.remaining)) ? Number(st.remaining) : 15;
  score = Number.isFinite(Number(st.score)) ? Number(st.score) : 0;
  gameStarted = !!st.gameStarted;
  gameBlockedDueToExisting = !!st.gameBlockedDueToExisting;
  roundFinished = !!st.roundFinished;
  finalResult = st.finalResult || null;

  const restoredGuesses = Array.isArray(st.guesses) ? st.guesses.map(normalizeStoredGuess).filter(Boolean) : [];
  guesses = restoredGuesses;
  guessedNames = new Set(
    Array.isArray(st.guessedNames) && st.guessedNames.length
      ? st.guessedNames.map(x => String(x || '').trim()).filter(Boolean)
      : guesses.map(g => String(g.full_name || '').trim()).filter(Boolean)
  );

  remainingEl.textContent = remaining;
  scoreEl.textContent = score;
  preloadStatusEl.textContent = roundFinished
    ? 'Restored saved final result.'
    : (gameStarted ? 'Restored saved progress.' : 'Saved state restored.');
  clearGuessesTable();
  ensureOutputSkeleton();

  const targetPid = target && (target.player_id || target.playerId)
    ? String(target.player_id || target.playerId)
    : null;

  const ids = new Set();
  if(targetPid) ids.add(targetPid);
  for(const g of guesses){
    const gid = g && (g.player_id || g.playerId) ? String(g.player_id || g.playerId) : null;
    if(gid) ids.add(gid);
  }

  for(const id of ids){
    await loadPerPlayerH2H(String(id)).catch(() => null);
  }

  for(let i = 0; i < guesses.length; i++){
    const guess = guesses[i];
    appendGuessRowSimple(guess, i + 1);
    const guessPid = guess && (guess.player_id || guess.playerId) ? String(guess.player_id || guess.playerId) : null;
    const h2h = (targetPid && guessPid) ? composeH2H(targetPid, guessPid) : null;
    updateTablesWithGuess(guess, h2h);
  }

  setGuessEnabled(isConnected() && !gameBlockedDueToExisting && !roundFinished && gameStarted);

  if(roundFinished && finalResult){
    renderResultModal(!!finalResult.won, Number(finalResult.points || 0), false);
  } else {
    const targetLabel = target && (target.full_name || target.name) ? target.full_name || target.name : '—';
    if(gameStarted){
      preloadStatusEl.textContent = `Round in progress — target loaded.`;
    }
  }

  return true;
}

function updateTopStatus(){
  const session = getSession();
  if(session && session.pseudo){
    lbStatusEl.textContent = `Connected as ${session.pseudo}`;
    preloadStatusEl.textContent = assetsReady
      ? 'Connected — preparing the round…'
      : 'Connected — loading…';
  } else {
    lbStatusEl.textContent = 'Not connected';
    preloadStatusEl.textContent = 'Connectez-vous via Tennis Arena pour jouer.';
  }
}

function closeExistingDropdown(){
  const existing = document.querySelector('.user-dropdown');
  if(existing) existing.remove();
}

function closeAuthHubHint(){
  closeExistingDropdown();
}

function renderAuthBox(){
  const placeholder = lbBoxPlaceholderEl;
  placeholder.innerHTML = '';
  closeAuthHubHint();

  const session = getSession();

  if(session && session.pseudo){
    const box = document.createElement('div');
    box.className = 'chip user-chip';
    box.id = 'userChip';

    const avatar = document.createElement('div');
    avatar.className = 'lb-avatar';
    avatar.textContent = (session.pseudo.split(/\s+/).map(x => x[0]).slice(0,2).join('').toUpperCase() || '??');

    const name = document.createElement('div');
    name.className = 'lb-name';
    name.textContent = session.pseudo;

    box.appendChild(avatar);
    box.appendChild(name);

    box.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleUserDropdown(box);

let suggestionPool = [];
let suggestionIndex = -1;

function updateSuggestions(){
  if(guessInput.disabled) return;

  const q = (guessInput.value || '').trim().toLowerCase();
  if(q.length < 2){
    suggestionsList.style.display = 'none';
    suggestionPool = [];
    return;
  }

  let pool = playersCatalog.filter(p =>
    p.full_name &&
    p.full_name.toLowerCase().includes(q) &&
    (String(p.source || '').toUpperCase() === currentTour)
  );

  if(pool.length === 0){
    pool = playersCatalog.filter(p =>
      p.full_name &&
      p.full_name.toLowerCase().includes(q)
    );
  }

  pool = pool
    .filter(p => !guessedNames.has((p.full_name || '').trim()))
    .slice(0, 60);

  suggestionPool = pool;
  renderSuggestions(pool);
}

function renderSuggestions(list){
  suggestionsList.innerHTML = '';
  suggestionIndex = -1;

  if(!list || !list.length){
    suggestionsList.style.display = 'none';
    return;
  }

  const max = Math.min(12, list.length);
  for(let i = 0; i < max; i++){
    const pl = list[i];
    const li = document.createElement('li');
    li.textContent = pl.full_name;
    li.dataset.idx = i;

    li.onclick = () => {
      guessInput.value = pl.full_name;
      suggestionsList.style.display = 'none';
      handleGuessSubmission(pl.full_name);
    };

    li.onmouseover = () => {
      Array.from(suggestionsList.children).forEach(n => n.classList.remove('highlight'));
      li.classList.add('highlight');
      suggestionIndex = i;
    };

    suggestionsList.appendChild(li);
  }

  suggestionsList.style.display = 'block';
}

function highlightSuggestion(){
  const items = suggestionsList.children;
  for(let i = 0; i < items.length; i++){
    items[i].classList.toggle('highlight', i === suggestionIndex);
  }
}

function findPlayerByName(name){
  if(!name) return null;
  const q = norm(name.trim());

  let p = playersCatalog.find(x =>
    x.player_id &&
    String(x.player_id).toLowerCase() === name.trim().toLowerCase()
  );
  if(p) return p;

  p = playersCatalog.find(x => x.full_name && norm(x.full_name) === q);
  if(p) return p;

/* ---------------------------
  per-player H2H loader & composer
---------------------------- */
async function loadPerPlayerH2H(playerId){
  if(!playerId) return null;
  if(h2hByPlayerCache[playerId]) return h2hByPlayerCache[playerId];

  const path = `${H2H_BY_PLAYER_BASE}${encodeURIComponent(playerId)}.json`;
  const j = await fetchJson(path);
  if(!j) return null;

  h2hByPlayerCache[playerId] = j;
  return j;
}

function composeH2H(playerAId, playerBId){
  if(!playerAId || !playerBId) return null;

  const aId = String(playerAId);
  const bId = String(playerBId);
  const cacheKey = `${aId}_${bId}`;

  if(composedH2HCache[cacheKey]) return composedH2HCache[cacheKey];

  const A = h2hByPlayerCache[aId] || null;
  const B = h2hByPlayerCache[bId] || null;

  if(!A && !B){
    const empty = {
      meta:{ total_matches:0 },
      playerA:{ id:aId },
      playerB:{ id:bId },
      matches:[],
      aggregates:{ A_wins:0, B_wins:0 }
    };
    composedH2HCache[cacheKey] = empty;
    return empty;
  }

  const collected = [];

  if(A && Array.isArray(A.matches)){
    for(const m of A.matches){
      if(String(m.opponent_id) === bId) collected.push(Object.assign({}, m));
    }
  }

  if(B && Array.isArray(B.matches)){
    for(const m of B.matches){
      if(String(m.opponent_id) === aId) collected.push(Object.assign({}, m));
    }
  }

  if(collected.length === 0){
    const empty = {
      meta:{ total_matches:0 },
      playerA:{ id:aId },
      playerB:{ id:bId },
      matches:[],
      aggregates:{ A_wins:0, B_wins:0 }
    };
    composedH2HCache[cacheKey] = empty;
    return empty;
  }

  const seen = new Set();
  const normalized = [];
  let A_wins = 0;
  let B_wins = 0;

  for(const m of collected){
    const mid = m.match_id || (
      m.event_id
        ? (m.event_id + '|' + (m.match_date || ''))
        : JSON.stringify([m.match_date, m.score, m.opponent_id])
    );

    if(seen.has(mid)) continue;
    seen.add(mid);

    let winnerId = null;
    if(m.player_id_winner) winnerId = String(m.player_id_winner);
    else if(typeof m.is_winner !== 'undefined'){
      winnerId = m.is_winner ? String(aId) : String(bId);
    }

    if(winnerId === aId) A_wins++;
    else if(winnerId === bId) B_wins++;

    normalized.push({
      match_id: m.match_id || mid,
      event_id: m.event_id || '',
      event_year: m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : ''),
      tourney_name: m.tourney_name || '',
      surface: m.surface || 'Other',
      round: m.round || '',
      score_string: m.score || m.score_string || '',
      match_date: m.match_date || '',
      player_id_winner: winnerId || null,
      opponent_id: m.opponent_id || null
    });
  }

  const h2h = {
    meta:{ total_matches:normalized.length },
    playerA:{ id:aId },
    playerB:{ id:bId },
    matches: normalized.sort((x, y) => (
      String(y.event_year || '').localeCompare(String(x.event_year || '')) ||
      (x.match_date || '').localeCompare(y.match_date || '')
    )),
    aggregates:{ A_wins, B_wins }
  };

  composedH2HCache[cacheKey] = h2h;
  return h2h;
}

function computeSurfaceCounts(h2h){
  const map = {};
  if(!h2h || !Array.isArray(h2h.matches)) return map;

  for(const m of h2h.matches){
    const s = m.surface || 'Other';
    map[s] = map[s] || { A:0, B:0, total:0 };
    const winner = String(m.player_id_winner || '');

    if(winner === String(h2h.playerA.id)) map[s].A++;
    else if(winner === String(h2h.playerB.id)) map[s].B++;
    map[s].total++;
  }

  return map;
}

function buildMatchLinesEasy(h2h, guessedPlayerId, guessedPlayerName){
  if(!h2h || !Array.isArray(h2h.matches) || h2h.matches.length === 0) return ['No matches'];

  const lines = [];
  for(const m of h2h.matches.slice(0, 6)){
    const year = m.event_year || '';
    const tournament = m.tourney_name || m.event_id || '';
    const round = m.round || '';
    const score = m.score_string || '';
    const winner = String(m.player_id_winner || '');
    const label = (winner === String(guessedPlayerId))
      ? (escapeHtml(guessedPlayerName) || 'Guessed')
      : 'Target';

    lines.push(`${escapeHtml(year)} — ${escapeHtml(tournament)} — ${escapeHtml(round)} — ${escapeHtml(score)} — Winner: ${label}`);
  }
  return lines;
}

function updateTablesWithGuess(guess, h2h){
  const out = document.getElementById('h2hOutput');
  if(!out.querySelector('table')) ensureOutputSkeleton();

  if(currentLevel === 'hard'){
    const tbody = document.querySelector('#h2hTableHard tbody');
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.textContent = guess.full_name || '';

    const tdH2H = document.createElement('td');
    const A = (h2h && h2h.aggregates && typeof h2h.aggregates.A_wins !== 'undefined') ? h2h.aggregates.A_wins : 0;
    const B = (h2h && h2h.aggregates && typeof h2h.aggregates.B_wins !== 'undefined') ? h2h.aggregates.B_wins : 0;
    tdH2H.innerHTML = `<div style="font-weight:700;text-align:center">${B} - ${A}</div>`;

    tr.appendChild(tdName);
    tr.appendChild(tdH2H);
    tbody.prepend(tr);

  } else if(currentLevel === 'medium'){
    const tbody = document.querySelector('#h2hTableMedium tbody');
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.textContent = guess.full_name || '';
    tr.appendChild(tdName);

    const counts = computeSurfaceCounts(h2h);
    const order = ['Clay','Grass','Hard','Carpet'];

    for(const s of order){
      const c = counts[s] || { A:0, B:0, total:0 };
      const td = document.createElement('td');
      td.innerHTML = `${c.B} - ${c.A} (${c.total})`;
      tr.appendChild(td);
    }

    const other = Object.keys(counts)
      .filter(k => !order.includes(k))
      .reduce((acc, k) => {
        acc.A += counts[k].A;
        acc.B += counts[k].B;
        acc.total += counts[k].total;
        return acc;
      }, { A:0, B:0, total:0 });

    const tdOther = document.createElement('td');
    tdOther.innerHTML = `${other.B} - ${other.A} (${other.total})`;
    tr.appendChild(tdOther);

    tbody.prepend(tr);

  } else {
    const tbody = document.querySelector('#h2hTableEasy tbody');
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.textContent = guess.full_name || '';

    const tdMatches = document.createElement('td');
    const pid = guess.player_id || guess.playerId || '';
    const lines = buildMatchLinesEasy(h2h, pid, guess.full_name || '');
    tdMatches.innerHTML = lines.map(l => `<div style="margin-bottom:6px">${escapeHtml(l)}</div>`).join('');

    tr.appendChild(tdName);
    tr.appendChild(tdMatches);
    tbody.prepend(tr);
  }
}

/* ---------------------------
  Check whether user played today (mode-based)
---------------------------- */
async function checkUserPlayedToday(mode){
  const session = getSession();
  if(!session) return { exists:false, requiresAuth:true };

  const userId = session.id || session.user_id || null;
  const pseudo = session.pseudo || null;
  const dateStr = new Date().toISOString().slice(0,10);

  let qs = `?game_id=${encodeURIComponent(GAME_ID)}&date=${encodeURIComponent(dateStr)}&check_existing=1&mode=${encodeURIComponent(mode)}`;
  if(userId) qs += `&user_id=${encodeURIComponent(userId)}`;
  if(pseudo) qs += `&pseudo=${encodeURIComponent(pseudo)}`;

  try {
    const res = await fetch(`/.netlify/functions/leaderboard${qs}`, { credentials: 'same-origin' });
    if(!res.ok) return { exists:false };
    const j = await res.json();
    if(j && j.ok && j.exists) return { exists:true, rows: j.rows || [] };
    return { exists:false, rows: j.rows || [] };
  } catch(e){
    console.warn('checkUserPlayedToday error', e);
    return { exists:false };
  }
}

/* ---------------------------
  Start game
---------------------------- */
function startRound(){
  if(!isConnected()){
    applyAuthGate();
    return;
  }

  gameBlockedDueToExisting = false;
  roundFinished = false;
  finalResult = null;
  remaining = 15;
  guesses = [];
  guessedNames.clear();

  syncModeUI();
  remainingEl.textContent = remaining;
  scoreEl.textContent = score;
  clearGuessesTable();
  setGuessEnabled(true);
  saveState();

  let picked = null;

  if(selectedPlayers){
    const poolKey1 = currentTour.toLowerCase();
    const arr = selectedPlayers[poolKey1] || selectedPlayers[currentTour] || selectedPlayers[poolKey1.toUpperCase()] || [];
    if(Array.isArray(arr)){
      picked = arr.find(x => x.level === currentLevel) || arr[Math.floor(Math.random() * arr.length)];
      if(picked && picked.player) picked = picked.player;
    }
  }

  if(!picked){
    const pool = playersCatalog.filter(p => (String(p.source || '').toUpperCase() === currentTour));
    picked = pool.length ? pool[Math.floor(Math.random() * pool.length)] : (playersCatalog[0] || null);
  }

  if(!picked){
    showToast('No target available');
    return;
  }

  target = picked;
  gameStarted = true;
  saveState();

  const tid = target && (
    target.player_id ||
    target.playerId ||
    (target.player && target.player.player_id)
  )
    ? String(target.player_id || target.playerId || (target.player && target.player.player_id))
    : null;

  (async () => {
    if(tid){
      preloadStatusEl.textContent = 'Loading H2H for target...';
      await loadPerPlayerH2H(tid).catch(() => null);
    }

    await loadSelectedPlayerFiles(6);
    ensureOutputSkeleton();
    preloadStatusEl.textContent = 'Round started — make up to 15 guesses. Good luck!';
    saveState();
  })();
}

/* ---------------------------
  Preload selected players helper
---------------------------- */
async function loadSelectedPlayerFiles(limit = 6){
  if(!selectedPlayers) return;

  const ids = new Set();
  const keys = Object.keys(selectedPlayers || {});

  for(const k of keys){
    const arr = selectedPlayers[k];
    if(Array.isArray(arr)){
      for(const it of arr){
        const id = extractPossiblePlayerId(it) || extractPossiblePlayerId(it.player);
        if(id) ids.add(id);
        if(ids.size >= limit) break;
      }
    }
    if(ids.size >= limit) break;
  }

  const toLoad = Array.from(ids).slice(0, limit);
  if(toLoad.length === 0) return;

  preloadStatusEl.textContent = `H2H preload: loading ${toLoad.length} selected-player files...`;

  let i = 0;
  for(const id of toLoad){
    await loadPerPlayerH2H(String(id)).catch(() => null);
    i++;
    preloadStatusEl.textContent = `H2H preload: ${i}/${toLoad.length} files loaded`;
  }

  preloadedCount = toLoad.length;
  preloadStatusEl.textContent = `H2H preload: loaded ${preloadedCount} selected-player files`;
}

function extractPossiblePlayerId(item){
  if(!item) return null;
  if(typeof item === 'string' || typeof item === 'number') return String(item);
  if(item.player_id) return String(item.player_id);
  if(item.player && item.player.player_id) return String(item.player.player_id);
  if(item.player && item.player.id) return String(item.player.id);
  if(item.player && item.player.raw && item.player.raw.player_id) return String(item.player.raw.player_id);
  return null;
}


/* ---------------------------
  Leaderboard helpers (submit/queue/flush)
---------------------------- */
function readScoreQueue(){
  try{
    return JSON.parse(localStorage.getItem(LB_QUEUE_KEY) || '[]');
  } catch(e){
    return [];
  }
}

function pushScoreQueue(entry){
  try{
    const q = readScoreQueue();
    q.push(Object.assign({ ts: (new Date()).toISOString() }, entry));
    localStorage.setItem(LB_QUEUE_KEY, JSON.stringify(q));
    console.info('[LB-QUEUE] queued', entry);
  } catch(e){
    console.warn('[LB-QUEUE] push error', e);
  }
}

function popScoreQueue(){
  try{
    const q = readScoreQueue();
    if(!q || q.length === 0) return null;
    q.shift();
    localStorage.setItem(LB_QUEUE_KEY, JSON.stringify(q));
    return true;
  } catch(e){
    console.warn('[LB-QUEUE] pop error', e);
    return null;
  }
}

function waitForLeaderboard(timeout = 5000, interval = 200){
  return new Promise((resolve) => {
    if(window.LEADERBOARD && typeof window.LEADERBOARD.submitScore === 'function') return resolve(true);

    const start = Date.now();
    const t = setInterval(() => {
      if(window.LEADERBOARD && typeof window.LEADERBOARD.submitScore === 'function'){
        clearInterval(t);
        resolve(true);
      } else if(Date.now() - start > timeout){
        clearInterval(t);
        resolve(false);
      }
    }, interval);
  });
}

async function trySubmitEntryToLB(entry){
  const gameId = entry.gameId || GAME_ID;
  const points = Number(entry.points) || 0;
  const options = entry.options || {};
  const pseudo = options.displayName || options.pseudo || null;
  const mode = options.mode || null;
  const meta = options.meta || null;

  if(window.LEADERBOARD && typeof window.LEADERBOARD.submitScore === 'function'){
    try {
      console.info('[LB] calling window.LEADERBOARD.submitScore', { gameId, points, options });
      const res = await window.LEADERBOARD.submitScore(gameId, points, options);
      console.info('[LB] submitScore response', res);

      if(res && (res.ok === true || res.success === true || res.status === 'ok')){
        console.info('[LB] library confirmed success — done.');
        return true;
      }

      if(res && res.ok === false && res.error && String(res.error).toLowerCase().includes('already_submitted')){
        console.warn('[LB] library reports already submitted locally.');
        showToast('Score already submitted (duplicate)');
        return true;
      }

      console.warn('[LB] library returned non-success — will try server fallback', res);
    } catch(err){
      console.error('[LB] submitScore threw', err);
    }
  } else {
    console.warn('[LB] window.LEADERBOARD.submitScore not available; using server fallback');
  }

  const fallbackEndpoint = '/.netlify/functions/submit-score';
  const payload = {
    game_id: gameId,
    points: points,
    pseudo: pseudo,
    mode: mode,
    meta: (typeof meta === 'string' ? meta : (meta ? JSON.stringify(meta) : null)),
    ts: (new Date()).toISOString()
  };

  try {
    console.info('[LB-FALLBACK] POST', fallbackEndpoint, payload);
    const resp = await fetch(fallbackEndpoint, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const text = await resp.text().catch(() => null);
    let parsed = null;
    try {
      parsed = text ? JSON.parse(text) : null;
    } catch(e){
      parsed = text;
    }

    console.info('[LB-FALLBACK] response status', resp.status, parsed || text);

    if(resp.ok){
      console.info('[LB-FALLBACK] success', parsed);
      return true;
    } else {
      if(
        resp.status === 409 ||
        (parsed && parsed.detail && (parsed.detail.code === 23505 || String(parsed.detail.code) === '23505')) ||
        (parsed && parsed.error && String(parsed.error).toLowerCase().includes('duplicate'))
      ){
        console.warn('[LB-FALLBACK] server indicates duplicate entry for today — dropping queued item and syncing UI.');
        showToast('Score already present (duplicate)');
        return true;
      }

      console.warn('[LB-FALLBACK] server returned non-OK', resp.status, parsed || text);
      return false;
    }
  } catch(fetchErr){
    console.error('[LB-FALLBACK] fetch error', fetchErr);
    return false;
  }
}

async function flushScoreQueue(){
  const queue = readScoreQueue();
  if(!queue || queue.length === 0) return;

  const ready = await waitForLeaderboard(5000);
  if(!ready){
    console.info('Leaderboard not ready; will keep queue for later flush');
    return;
  }

  for(let i = 0; i < 50; i++){
    const q = readScoreQueue();
    if(!q || q.length === 0) break;

    const entry = q[0];
    const ok = await trySubmitEntryToLB(entry);
    if(ok){
      popScoreQueue();
      showToast('Score submitted / duplicate handled', 1400);
    } else {
      console.warn('Submit failed for queued entry — stop flush now');
      break;
    }
  }
}

async function submitScoreToLeaderboard(points, meta = {}, extra = {}){
  const session = getSession();
  const displayName = extra.displayName || extra.pseudo || getDisplayName(session) || null;
  const modeString = currentModeKey();
  const options = {
    mode: modeString,
    meta: JSON.stringify(meta || {}),
    displayName
  };

  const ready = await waitForLeaderboard(3000);
  if(ready){
    const ok = await trySubmitEntryToLB({ gameId: GAME_ID, points, options });
    if(ok){
      console.info('Score submitted (fast path).');
      setTimeout(flushScoreQueue, 250);
      return;
    } else {
      console.warn('Fast path submit failed; queueing the score for retry.');
      pushScoreQueue({ gameId: GAME_ID, points, options });
      showToast('Score queued for retry', 2000);
      return;
    }
  } else {
    pushScoreQueue({ gameId: GAME_ID, points, options });
    showToast('Leaderboard unavailable — score queued', 2000);
    setTimeout(flushScoreQueue, 1000);
  }
}

/* watch LB init */
(function watchForLeaderboardInit(){
  if(window.LEADERBOARD && typeof window.LEADERBOARD.submitScore === 'function'){
    setTimeout(flushScoreQueue, 300);
    return;
  }

  const poll = setInterval(() => {
    if(window.LEADERBOARD && typeof window.LEADERBOARD.submitScore === 'function'){
      clearInterval(poll);
      setTimeout(flushScoreQueue, 200);
    }
  }, 250);
})();

/* ---------------------------
  ensureModeCheckedAndStart
---------------------------- */

async function ensureModeCheckedAndStart(){
  if(!assetsReady) return;
  if(!isConnected()){
    applyAuthGate();
    return;
  }

  const mode = currentModeKey();
  syncModeUI();
  preloadStatusEl.textContent = 'Checking if you already played this variant today...';

  gameBlockedDueToExisting = false;
  gameStarted = false;
  setGuessEnabled(false);
  suggestionsList.style.display = 'none';

  try {
    const saved = loadState(mode);
    if(saved && saved.date === todayParisStr()){
      const restored = await restoreState(saved);
      if(restored){
        return;
      }
    }

    const check = await checkUserPlayedToday(mode);
    if(check && check.exists){
      showAlreadyPlayedModal(check, mode);
      return;
    }

    startRound();
  } catch(e){
    console.warn('ensureModeCheckedAndStart initial check error', e);
    const saved = loadState(mode);
    if(saved && saved.date === todayParisStr()){
      const restored = await restoreState(saved);
      if(restored) return;
    }
    startRound();
  }
}

/* ---------------------------
  revealRound (submit result)
---------------------------- */
function renderResultModal(won, points){
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const text = document.getElementById('modalText');
  const details = document.getElementById('modalDetails');

  if(won){
    title.textContent = 'You won!';
    text.textContent = `You earned ${points} points.`;
  } else {
    title.textContent = 'Round over';
    text.textContent = 'No points this time.';
  }

  const tname = escapeHtml(target && (target.full_name || (target.player && target.player.full_name)) || '—');
  details.innerHTML = `<div style="font-weight:700">Target: ${tname}</div>`;

  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');

  setTimeout(() => {
    try{
      document.getElementById('closeModalBtn').focus();
    } catch(e){}
  }, 40);

  document.getElementById('closeModalBtn').onclick = () => {
    try {
      if(document.activeElement) document.activeElement.blur();
    } catch(e){}
    modal.classList.remove('show');
    setTimeout(() => modal.setAttribute('aria-hidden','true'), 120);
  };
}

async function revealRound(won, points, options = {}){
  const submit = options.submit !== false;

  roundFinished = true;
  finalResult = { won: !!won, points: Number(points || 0) };
  gameStarted = false;
  setGuessEnabled(false);
  saveState();

  renderResultModal(won, points);

  if(!submit) return;

  const meta = {
    won: !!won,
    guesses_count: guesses.length,
    target_id: target && (
      target.player_id ||
      target.playerId ||
      (target.player && target.player.player_id)
    )
      ? String(target.player_id || target.playerId || (target.player && target.player.player_id))
      : null,
    level: currentLevel,
    tour: currentTour
  };

  try{
    await submitScoreToLeaderboard(points || 0, meta, {});
    console.info('[LB] submitScoreToLeaderboard called from revealRound');
  } catch(e){
    console.error('[LB] submit failed', e);
  }
}

/* ---------------------------
  main guess handler
---------------------------- */
async function handleGuessSubmission(name){
  if(!isConnected()){
    showToast('Connectez-vous via Tennis Arena');
    return;
  }

  if(!gameStarted){
    showToast('Round not started');
    return;
  }

  if(gameBlockedDueToExisting){
    showToast('You have already completed this variant today');
    return;
  }

  if(remaining <= 0){
    showToast('No tries left');
    return;
  }

  const guess = findPlayerByName(name);
  if(!guess){
    showToast('Name not found in catalog');
    return;
  }

  guesses.push(guess);
  guessedNames.add((guess.full_name || '').trim());
  appendGuessRowSimple(guess);

  remaining--;
  remainingEl.textContent = remaining;

  const guessPid = guess.player_id || guess.playerId || null;
  const targetPid = target && (
    target.player_id ||
    target.playerId ||
    (target.player && target.player.player_id)
  )
    ? String(target.player_id || target.playerId || (target.player && target.player.player_id))
    : null;

  if(guessPid) await loadPerPlayerH2H(String(guessPid)).catch(() => null);
  if(targetPid) await loadPerPlayerH2H(String(targetPid)).catch(() => null);

  const h2h = (targetPid && guessPid) ? composeH2H(targetPid, guessPid) : null;
  updateTablesWithGuess(guess, h2h);
  saveState();

  const sameId = (guessPid && targetPid && String(guessPid) === String(targetPid));
  const sameName = (!guessPid && !targetPid && norm(guess.full_name || '') === norm(target.full_name || ''));

  if(sameId || sameName){
    const points = Math.max(10, 100 - (guesses.length - 1) * 10);
    score += points;
    scoreEl.textContent = score;
    saveState();
    await revealRound(true, points);
    setTimeout(() => ensureModeCheckedAndStart(), 900);
    return;
  }

  if(remaining <= 0 || guesses.length >= 15){
    saveState();
    await revealRound(false, 0);
    setTimeout(() => ensureModeCheckedAndStart(), 900);
  }
}

/* ---------------------------
  Pick / load selected players JSON
---------------------------- */
async function loadSelectedPlayers(){
  const j = await fetchJson(SELECTED_PLAYERS_JSON);
  if(!j) return false;
  selectedPlayers = j;
  selectedPlayers.atp = selectedPlayers.atp || selectedPlayers.ATP || [];
  selectedPlayers.wta = selectedPlayers.wta || selectedPlayers.WTA || [];

}

/* ---------------------------
  events / init
---------------------------- */
function bindSuggestions(){
  guessInput.addEventListener('input', updateSuggestions);
  guessInput.addEventListener('focus', updateSuggestions);

  document.addEventListener('click', (e) => {
    if(!document.querySelector('.suggestions')?.contains(e.target)){
      suggestionsList.style.display = 'none';
    }
  });

  guessInput.addEventListener('keydown', (e) => {
    if(suggestionsList.style.display === 'block'){
      const items = suggestionsList.children;

      if(e.key === 'ArrowDown'){
        e.preventDefault();
        suggestionIndex = Math.min(suggestionIndex + 1, items.length - 1);
        highlightSuggestion();
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        suggestionIndex = Math.max(suggestionIndex - 1, 0);
        highlightSuggestion();
      } else if(e.key === 'Enter'){
        if(suggestionIndex >= 0 && suggestionPool[suggestionIndex]){
          e.preventDefault();
          const sel = suggestionPool[suggestionIndex];
          guessInput.value = sel.full_name;
          suggestionsList.style.display = 'none';
          handleGuessSubmission(sel.full_name);
        }
      }
    }
  });
}

function bindControls(){
  document.getElementById('btnATP').addEventListener('click', async () => {
    if(currentTour !== 'ATP'){
      currentTour = 'ATP';
      guessInput.disabled = true;
      guessBtn.disabled = true;
      suggestionsList.style.display = 'none';
      tourLabelEl.textContent = currentTour;
      document.getElementById('btnATP').classList.add('active','atp');
      document.getElementById('btnWTA').classList.remove('active','wta');
      await ensureModeCheckedAndStart();
    }
  });

  document.getElementById('btnWTA').addEventListener('click', async () => {
    if(currentTour !== 'WTA'){
      currentTour = 'WTA';
      guessInput.disabled = true;
      guessBtn.disabled = true;
      suggestionsList.style.display = 'none';
      tourLabelEl.textContent = currentTour;
      document.getElementById('btnWTA').classList.add('active','wta');
      document.getElementById('btnATP').classList.remove('active','atp');
      await ensureModeCheckedAndStart();
    }
  });

  document.querySelectorAll('.seg-btn').forEach(btn => btn.addEventListener('click', async (e) => {
    const newLvl = e.currentTarget.dataset.level;
    if(newLvl === currentLevel) return;

    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    e.currentTarget.classList.add('active');

    currentLevel = newLvl;
    levelLabelEl.textContent = currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1);

    ensureOutputSkeleton();

    guessInput.disabled = true;
    guessBtn.disabled = true;
    suggestionsList.style.display = 'none';

    await ensureModeCheckedAndStart();
  }));

  guessBtn.addEventListener('click', () => {
    const v = guessInput.value.trim();
    if(!v) return showToast('Type a name');
    handleGuessSubmission(v);
    guessInput.value = '';
    suggestionsList.style.display = 'none';
  });

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    const mm = document.getElementById('modal');
    try{
      if(document.activeElement) document.activeElement.blur();
    } catch(e){}
    mm.classList.remove('show');
    setTimeout(() => mm.setAttribute('aria-hidden','true'), 120);
  });
}

async function restoreLastSavedStateIfAny(){
  const session = getSession();
  if(!session || !session.pseudo) return false;

  const saved = loadLastState();
  if(saved && saved.date === todayParisStr()){
    currentTour = String(saved.currentTour || currentTour || 'ATP').toUpperCase();
    currentLevel = String(saved.currentLevel || currentLevel || 'easy').toLowerCase();
    syncModeUI();
    return await restoreState(saved);
  }

  return false;
}

async function init(){
  guessInput = document.getElementById('guessInput');
  suggestionsList = document.getElementById('suggestionsList');
  guessBtn = document.getElementById('guessBtn');
  preloadStatusEl = document.getElementById('preloadStatus');
  levelLabelEl = document.getElementById('levelLabel');
  tourLabelEl = document.getElementById('tourLabel');
  remainingEl = document.getElementById('remaining');
  scoreEl = document.getElementById('score');
  lbStatusEl = document.getElementById('lb-status');
  lbBoxPlaceholderEl = document.getElementById('lbBoxPlaceholder');

  bindSuggestions();
  bindControls();

  const okCatalog = await loadPlayersCatalog();
  if(!okCatalog){
    alert('players_catalog.json missing or malformed');
    return;
  }

  await loadGeocodes();
  await loadSelectedPlayers();

  assetsReady = true;

  renderAuthBox();
  ensureOutputSkeleton();

  setGuessEnabled(false);
  updateTopStatus();

  const session = getSession();
  if(session && session.pseudo){
    const restored = await restoreLastSavedStateIfAny();
    if(!restored){
      await ensureModeCheckedAndStart();
    }
  } else {
    applyAuthGate();
  }

  const authApi = getAuthApi();
  if(authApi && typeof authApi.onAuthChange === 'function'){
    authApi.onAuthChange(async () => {
      renderAuthBox();
      if(isConnected()){
        const restored = await restoreLastSavedStateIfAny();
        if(!restored){
          await ensureModeCheckedAndStart();
        }
      } else {
        applyAuthGate();
      }
    });
  } else {
    window.addEventListener('storage', async () => {
      renderAuthBox();
      if(isConnected()){
        const restored = await restoreLastSavedStateIfAny();
        if(!restored){
          await ensureModeCheckedAndStart();
        }
      } else {
        applyAuthGate();
      }
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>

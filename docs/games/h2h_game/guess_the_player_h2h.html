<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guess The Player — H2H</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1: #071226; --bg2: #081428;
    --accent-a: rgba(31,122,236,0.06);
    --accent-b: rgba(139,92,246,0.06);
    --accent-strong: #1f7aec;
    --accent-strong-wta: #8b5cf6;
    --muted:#94a3b8; --success:#16a34a; --danger:#ef4444;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color-scheme: dark;
  }

  html,body{height:100%;margin:0;background:
    radial-gradient(1000px 600px at 10% 10%, var(--accent-a), transparent 10%),
    radial-gradient(800px 500px at 90% 90%, var(--accent-b), transparent 10%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}

  .wrap{max-width:1100px;margin:28px auto;padding:20px;border-radius:14px;position:relative;z-index:2;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow: 0 8px 40px rgba(2,6,23,0.6); border: 1px solid rgba(255,255,255,0.03);}

  header{display:flex;align-items:center;gap:16px}
  h1{margin:0;font-weight:800;color: #eef2ff; font-size:1.25rem}
  .sub{color:var(--muted);font-size:0.9rem}

  .controls{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .card{background:transparent;padding:12px;border-radius:12px}
  .segment{display:flex;background:transparent;border-radius:10px;padding:4px;gap:6px}
  .seg-btn{padding:8px 12px;border-radius:8px;border:none;color:var(--muted);cursor:pointer;font-weight:600;background:transparent;transition:all .18s ease}
  .seg-btn.active{color:white; box-shadow:0 6px 18px rgba(2,6,23,0.6); transform:translateY(-2px)}

  .tour-toggle{display:flex;gap:6px}
  .tour-btn{min-width:72px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-weight:700;background:transparent;color:var(--muted)}
  .tour-btn.active.atp{background:linear-gradient(180deg, rgba(31,122,236,0.14), rgba(31,122,236,0.06)); color: #cfe8ff}
  .tour-btn.active.wta{background:linear-gradient(180deg, rgba(139,92,246,0.14), rgba(139,92,246,0.06)); color: #efe6ff}

  .game-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .chip{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;border:1px solid rgba(255,255,255,0.02)}
  .chip strong {color:#fff}

  .input-row{display:flex;gap:8px;align-items:center;margin-top:12px}
  input[type="text"]{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff;min-width:360px}
  button.primary{padding:10px 14px;border-radius:10px;border:none;background:var(--accent-strong);color:white;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(31,122,236,0.12)}
  button.primary.wta{background:var(--accent-strong-wta);box-shadow:0 8px 24px rgba(139,92,246,0.12)}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer}

  .suggestions{position:relative}
  .suggestions-list{position:absolute;left:0;top:44px;width:100%;max-height:220px;overflow:auto;background:linear-gradient(180deg,#0b1220,#071025);border-radius:8px;border:1px solid rgba(255,255,255,0.04);z-index:80;box-shadow:0 10px 40px rgba(2,6,23,0.6)}
  .suggestions-list li{list-style:none;padding:8px 10px;color:#e6eef8;cursor:pointer;border-bottom:1px dashed rgba(255,255,255,0.02)}
  .suggestions-list li:hover, .suggestions-list li.highlight{ background: rgba(255,255,255,0.02); color: #fff; }

  table{width:100%;border-collapse:collapse;margin-top:14px;color:#e6eef8}
  th,td{padding:12px;text-align:left;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:0.95rem}
  thead th{color:var(--muted);font-weight:700}
  tr.good td{background:linear-gradient(90deg, rgba(22,163,74,0.06), transparent)}

  .country-text{margin-top:14px;padding:16px;border-radius:12px;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,0.04)}
  .country-text h3{margin:0 0 6px 0}
  .country-text p{margin:6px 0;font-style:italic;color:#f0f6ff}
  .country-text .para-subtitle{font-weight:700;margin-top:8px;margin-bottom:4px}

  .modal {position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.8));z-index:200;opacity:0;pointer-events:none;transition:opacity .18s ease}
  .modal.show{opacity:1;pointer-events:auto}
  .modal-card{background:linear-gradient(180deg, rgba(11,17,32,0.98), rgba(8,12,23,0.96));padding:26px;border-radius:16px;max-width:680px;width:94%;box-shadow:0 30px 80px rgba(2,6,23,0.8);border:1px solid rgba(255,255,255,0.03);text-align:center}

  .toast{position:fixed;right:18px;bottom:18px;background:rgba(0,0,0,0.7);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.6);display:none;z-index:220}

  @media (max-width:880px){ input[type="text"]{min-width:200px} .chip{font-size:0.85rem} th,td{padding:8px;font-size:0.9rem} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><h1>Guess the Player</h1><div class="sub">Find the hidden player using head-to-head clues.</div></div>
    </header>

    <div class="controls" style="margin-top:18px">
      <div class="card tour-toggle" style="padding:10px 12px">
        <button id="btnATP" class="tour-btn active atp" data-tour="ATP">ATP</button>
        <button id="btnWTA" class="tour-btn wta" data-tour="WTA">WTA</button>
      </div>

      <div class="card" style="padding:8px 10px">
        <div id="difficultySegment" class="segment" role="tablist" aria-label="difficulty">
          <button class="seg-btn active" data-level="easy" id="sEasy">Easy</button>
          <button class="seg-btn" data-level="medium" id="sMedium">Medium</button>
          <button class="seg-btn" data-level="hard" id="sHard">Hard</button>
        </div>
      </div>

      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <div class="chip">Mode auto-starts on change</div>
      </div>
    </div>

    <div class="game-meta" style="margin-top:18px">
      <div class="chip">Level: <strong id="levelLabel">Easy</strong></div>
      <div class="chip">Tour: <strong id="tourLabel">ATP</strong></div>
      <div class="chip">Remaining: <strong id="remaining">15</strong></div>
      <div class="chip">Score: <strong id="score">0</strong></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="input-row">
        <div style="flex:1;position:relative">
          <div class="suggestions" style="width:100%">
            <input id="guessInput" type="text" placeholder="Type a player name..." autocomplete="off" />
            <ul id="suggestionsList" class="suggestions-list" style="display:none"></ul>
          </div>
        </div>
        <button id="guessBtn" class="primary">Guess</button>
      </div>

      <div style="margin-top:10px;color:var(--muted);font-size:0.95rem">
        <span id="preloadStatus">H2H preload: idle</span>
      </div>

      <table id="guessesTable" aria-live="polite" style="margin-top:14px">
        <thead>
          <tr>
            <th>#</th>
            <th>Guessed name</th>
            <th>Age</th>
            <th>Career best</th>
            <th>Birthplace (km)</th>
            <th>Height (cm)</th>
            <th>Right-handed</th>
            <th>Two-handed BH</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="countryText" class="country-text" style="display:none"></div>
    </div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="big-check" id="modalIcon"><svg width="56" height="56" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="rgba(22,163,74,0.35)" stroke-width="2" fill="transparent"/><path d="M6 12.2l3.1 3.1L18 6.4" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="modalTitle">Round result</h2>
      <p id="modalText" style="color:var(--muted)">Details below.</p>
      <div id="modalDetails" style="margin-top:12px;color:#e8f4ea"></div>
      <div style="margin-top:18px;display:flex;gap:12px;justify-content:center">
        <button id="closeModalBtn" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------------------
  Configuration & globals
---------------------------- */
const SELECTED_PLAYERS_JSON = '/selected_players.json';
const PLAYERS_CATALOG_JSON = '/tools/players_catalog.json';
const GEOCODES_JSON = '/tools/geocodes_combined.json';
const H2H_BY_PLAYER_BASE = '/data/h2h_by_player/';

let selectedPlayers = null;
let playersCatalog = []; // normalized players array
let geocodes = {};
let dailyData = null;

let target = null;
let currentTour = 'ATP';
let currentLevel = 'easy'; // easy | medium | hard
let remaining = 15; // default attempts = 15
let score = 0;
let gameStarted = false;
let guesses = [];
let guessedNames = new Set();

let h2hCache = {}; // key: idA_idB -> composed pair JSON
let h2hFoundCount = 0;
let h2hByPlayerCache = {}; // playerId -> per-player JSON

/* ---------------------------
  Utilities
---------------------------- */
function showToast(msg, t=2000){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none', t); }
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }
function norm(s){ return s ? s.normalize().replace(/[\u0300-\u036f]/g,'').toLowerCase() : ''; }
function parseRank(v){ if(v===undefined||v===null||v===''||v==='-') return Infinity; const n=Number(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?Infinity:n; }
function tryParseDate(s){ if(!s) return null; const d=new Date(s); if(!isNaN(d)) return d; const clean=s.replace(/\s+/g,' ').split(' ')[0]; const d2=new Date(clean); return isNaN(d2)?null:d2; }
function calcAge(s){ const d=tryParseDate(s); if(!d) return null; const t=new Date(); let a=t.getFullYear()-d.getFullYear(); const m=t.getMonth()-d.getMonth(); if(m<0||(m===0 && t.getDate()<d.getDate())) a--; return a; }
function haversineKm(lat1,lon1,lat2,lon2){ const toRad=v=>v*Math.PI/180; const R=6371; const dLat=toRad(lat2-lat1); const dLon=toRad(lon2-lon1); const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2; const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); return R*c; }

/* ---------------------------
  Load JSON helpers
---------------------------- */
async function fetchJson(path){
  try{ const r = await fetch(path, {cache:'no-cache'}); if(!r.ok) return null; return await r.json(); } catch(e){ return null; }
}

async function loadSelectedPlayers(){
  selectedPlayers = await fetchJson(SELECTED_PLAYERS_JSON);
  return !!selectedPlayers;
}

async function loadPlayersCatalog(){
  const j = await fetchJson(PLAYERS_CATALOG_JSON);
  if(!j || !Array.isArray(j.players)) return false;
  playersCatalog = j.players.map(p=>{
    const cp = Object.assign({}, p);
    cp.age = (typeof cp.age === 'undefined' || cp.age === null) ? calcAge(cp.birth_date) : cp.age;
    cp.rank = (typeof cp.rank !== 'undefined' && cp.rank !== null) ? parseRank(cp.rank) : Infinity;
    cp.height_cm = (typeof cp.height_cm === 'undefined' || cp.height_cm === null) ? null : Number(cp.height_cm);
    cp.right_handed = (typeof cp.right_handed === 'undefined') ? (cp.plays ? String(cp.plays).toLowerCase().includes('right') : null) : cp.right_handed;
    cp.two_handed = (typeof cp.two_handed === 'undefined') ? (cp.backhand ? String(cp.backhand).toLowerCase().includes('two') : null) : cp.two_handed;
    return cp;
  });
  return true;
}

async function loadGeocodes(){
  const j = await fetchJson(GEOCODES_JSON);
  if(!j) { geocodes = {}; return false; }
  geocodes = j.geocode || j;
  return true;
}

/* ---------------------------
  Autocompletion (uses playersCatalog)
  - displays only the player's name (no country)
  - selecting a suggestion submits the guess immediately
---------------------------- */
const guessInput = document.getElementById('guessInput');
const suggestionsList = document.getElementById('suggestionsList');
let suggestionPool = [], suggestionIndex = -1;

function updateSuggestions(){
  const q = (guessInput.value||'').trim().toLowerCase();
  if(q.length < 2){ suggestionsList.style.display='none'; suggestionPool=[]; return; }
  let pool = playersCatalog.filter(p => p.full_name && p.full_name.toLowerCase().includes(q) && (String(p.source||'').toUpperCase() === currentTour));
  if(pool.length === 0) pool = playersCatalog.filter(p => p.full_name && p.full_name.toLowerCase().includes(q));
  pool = pool.filter(p => !guessedNames.has((p.full_name||'').trim())).slice(0,60);
  suggestionPool = pool;
  renderSuggestions(pool);
}
function renderSuggestions(list){
  suggestionsList.innerHTML=''; suggestionIndex=-1;
  if(!list || !list.length){ suggestionsList.style.display='none'; return; }
  const max = Math.min(12, list.length);
  for(let i=0;i<max;i++){
    const pl=list[i];
    const li=document.createElement('li');
    // only show name (no country)
    li.textContent = pl.full_name;
    li.dataset.idx=i;
    li.onclick = () => { guessInput.value = pl.full_name; suggestionsList.style.display='none'; handleGuessSubmission(pl.full_name); };
    li.onmouseover = () => { Array.from(suggestionsList.children).forEach(n=>n.classList.remove('highlight')); li.classList.add('highlight'); suggestionIndex=i; };
    suggestionsList.appendChild(li);
  }
  suggestionsList.style.display='block';
}
guessInput.addEventListener('input', updateSuggestions);
guessInput.addEventListener('focus', updateSuggestions);
document.addEventListener('click', (e)=>{ if(!document.querySelector('.suggestions')?.contains(e.target)) suggestionsList.style.display='none'; });
guessInput.addEventListener('keydown', (e) => {
  if(suggestionsList.style.display==='block'){
    const items = suggestionsList.children;
    if(e.key === 'ArrowDown'){ e.preventDefault(); suggestionIndex = Math.min(suggestionIndex+1, items.length-1); highlightSuggestion(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); suggestionIndex = Math.max(suggestionIndex-1,0); highlightSuggestion(); }
    else if(e.key === 'Enter'){ if(suggestionIndex >= 0 && suggestionPool[suggestionIndex]){ e.preventDefault(); const sel=suggestionPool[suggestionIndex]; guessInput.value = sel.full_name; suggestionsList.style.display='none'; handleGuessSubmission(sel.full_name); } }
  }
});
function highlightSuggestion(){ const items = suggestionsList.children; for(let i=0;i<items.length;i++) items[i].classList.toggle('highlight', i===suggestionIndex); }

/* find catalog player by name (uses players_catalog) */
function findPlayerByName(name){
  if(!name) return null;
  const q = norm(name.trim());
  let p = playersCatalog.find(x => x.player_id && String(x.player_id).toLowerCase() === name.trim().toLowerCase());
  if(p) return p;
  p = playersCatalog.find(x => x.full_name && norm(x.full_name) === q);
  if(p) return p;
  p = playersCatalog.find(x => x.full_name && norm(x.full_name).startsWith(q));
  if(p) return p;
  p = playersCatalog.find(x => x.full_name && norm(x.full_name).includes(q));
  return p || null;
}

/* ---------------------------
  H2H per-player loading & composition
  - preload selected players' per-player files (limit configurable)
  - when the user guesses a player not yet cached, we fetch that player's per-player file on demand
---------------------------- */

function extractPossiblePlayerId(item){
  if(!item) return null;
  if(typeof item === 'string' || typeof item === 'number') return String(item);
  if(item.player_id) return String(item.player_id);
  if(item.player && item.player.player_id) return String(item.player.player_id);
  if(item.player && item.player.id) return String(item.player.id);
  if(item.player && item.playerId) return String(item.player.playerId);
  if(item.player && item.player.playerId) return String(item.player.playerId);
  return null;
}

async function loadSinglePlayerH2H(playerId){
  if(!playerId) return null;
  if(h2hByPlayerCache[playerId]) return h2hByPlayerCache[playerId];
  const path = `${H2H_BY_PLAYER_BASE}${encodeURIComponent(playerId)}.json`;
  const j = await fetchJson(path);
  if(!j) return null;
  h2hByPlayerCache[playerId] = j;
  return j;
}

async function loadH2HFilesForSelectedPlayers(limit = 6){
  if(!selectedPlayers) return;
  const ids = new Set();
  const keys = Object.keys(selectedPlayers||{});
  for(const k of keys){
    const arr = selectedPlayers[k];
    if(Array.isArray(arr)){
      for(const it of arr){
        const id = extractPossiblePlayerId(it) || extractPossiblePlayerId(it.player);
        if(id) ids.add(id);
        if(ids.size >= limit) break;
      }
    }
    if(ids.size >= limit) break;
  }
  if(ids.size === 0){
    for(const k of keys){
      const id = extractPossiblePlayerId(selectedPlayers[k]);
      if(id) ids.add(id);
      if(ids.size >= limit) break;
    }
  }

  const toLoad = Array.from(ids).slice(0, limit);
  if(toLoad.length === 0) return;
  document.getElementById('preloadStatus').textContent = `H2H preload: loading ${toLoad.length} selected-player files...`;
  let loaded = 0;
  for(const id of toLoad){
    try{
      const j = await loadSinglePlayerH2H(id);
      if(j) h2hFoundCount++;
    }catch(e){}
    loaded++;
    document.getElementById('preloadStatus').textContent = `H2H preload: ${loaded}/${toLoad.length} selected-player files loaded`;
  }
  document.getElementById('preloadStatus').textContent = `H2H preload: loaded ${toLoad.length} selected-player files`;
}

/* compose H2H from per-player cached files */
function composeH2HFromCachedPlayers(targetId, oppId){
  const tId = String(targetId);
  const oId = String(oppId);
  const pA = h2hByPlayerCache[tId];
  const pB = h2hByPlayerCache[oId];

  const collected = [];
  if(pA && Array.isArray(pA.matches)){
    for(const m of pA.matches){
      if(String(m.opponent_id) === oId){
        const copy = Object.assign({}, m);
        copy.__origin = 'a';
        collected.push(copy);
      }
    }
  }
  if(pB && Array.isArray(pB.matches)){
    for(const m of pB.matches){
      if(String(m.opponent_id) === tId){
        const copy = Object.assign({}, m);
        copy.__origin = 'b';
        collected.push(copy);
      }
    }
  }

  if(collected.length === 0) return null;

  const seen = new Set();
  const normalized = [];
  let wins1 = 0, wins2 = 0;
  for(const m of collected){
    const mid = m.match_id || (m.event_id ? (m.event_id + '|' + (m.match_date||'')) : JSON.stringify([m.match_date,m.score,m.opponent_id]));
    if(seen.has(mid)) continue;
    seen.add(mid);

    let winnerId = null;
    if(m.__origin === 'a'){
      winnerId = m.is_winner ? tId : oId;
    } else if(m.__origin === 'b'){
      winnerId = m.is_winner ? oId : tId;
    } else {
      winnerId = m.is_winner ? tId : oId;
    }

    if(String(winnerId) === tId) wins1++;
    else if(String(winnerId) === oId) wins2++;

    const normMatch = {
      match_id: m.match_id || mid,
      event_id: m.event_id || m.tourney_id || '',
      event_year: m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : ''),
      tourney_name: m.tourney_name || '',
      surface: m.surface || '',
      round: m.round || '',
      score_string: m.score_string || m.score || '',
      match_date: m.match_date || '',
      player_id_winner: winnerId,
      opponent_id: m.opponent_id || null,
      opponent_name: m.opponent_name || ''
    };
    normalized.push(normMatch);
  }

  const nameA = (pA && pA.player && (pA.player.full_name || (pA.player.raw && pA.player.raw.full_name))) || '';
  const nameB = (pB && pB.player && (pB.player.full_name || (pB.player.raw && pB.player.raw.full_name))) || '';

  const h2h = {
    meta: { total_matches: normalized.length },
    player1: { id: tId, full_name: nameA },
    player2: { id: oId, full_name: nameB },
    matches: normalized,
    aggregates: {
      player1: { h2h_wins: wins1 },
      player2: { h2h_wins: wins2 }
    }
  };

  return h2h;
}

/* fetchH2HTryBoth:
   - try cache
   - ensure target per-player file cached (if not, attempt to fetch)
   - ensure opponent per-player file cached (fetch on demand)
   - compose and return
*/
async function fetchH2HTryBoth(targetId, oppId){
  const k1 = `${targetId}_${oppId}`, k2 = `${oppId}_${targetId}`;
  if(h2hCache[k1]) return h2hCache[k1];
  if(h2hCache[k2]) return h2hCache[k2];

  // ensure target per-player file cached
  if(!h2hByPlayerCache[String(targetId)]) {
    await loadSinglePlayerH2H(String(targetId));
  }
  // ensure opponent per-player file cached (on demand)
  if(!h2hByPlayerCache[String(oppId)]) {
    await loadSinglePlayerH2H(String(oppId));
  }

  // attempt to compose
  const composed = composeH2HFromCachedPlayers(targetId, oppId);
  if(composed){
    h2hCache[k1] = composed;
    h2hFoundCount++;
    return composed;
  }

  return null;
}

/* preloadAllH2HForTarget: compose pairs between target and preloaded players (for UI responsiveness) */
async function preloadAllH2HForTarget(targetId){
  h2hFoundCount=0;
  document.getElementById('preloadStatus').textContent='H2H preload: composing from selected-player files...';
  // ensure target file cached
  await loadSinglePlayerH2H(String(targetId));
  const loadedPlayerIds = Object.keys(h2hByPlayerCache || {});
  const opps = loadedPlayerIds.filter(id => id && id !== String(targetId));
  if(opps.length === 0){
    document.getElementById('preloadStatus').textContent = `H2H preload: no preloaded player files to compose pairs for ${targetId}`;
    return;
  }
  let done = 0;
  for(const opp of opps){
    try{
      const h = composeH2HFromCachedPlayers(targetId, opp);
      if(h){
        const k = `${targetId}_${opp}`;
        h2hCache[k] = h;
        h2hFoundCount++;
      }
    }catch(e){}
    done++;
    document.getElementById('preloadStatus').textContent = `H2H preload: ${done}/${opps.length} (found ${h2hFoundCount})`;
    await new Promise(r => setTimeout(r, 10));
  }
  document.getElementById('preloadStatus').textContent = `H2H preload done — found ${h2hFoundCount} file(s) for ${targetId}`;
}

/* ---------------------------
  Renderers for the 3 difficulty levels
  - easy: only global score "X - Y"
  - medium: breakdown by surface
  - hard: list of matches (tournament + year + score)
---------------------------- */
function renderEasy(h2h){
  if(!h2h) return `<div class="country-text">No H2H data available. (0 - 0)</div>`;
  const p1 = (h2h.aggregates && h2h.aggregates.player1) || {};
  const p2 = (h2h.aggregates && h2h.aggregates.player2) || {};
  const wins1 = p1.h2h_wins || 0;
  const wins2 = p2.h2h_wins || 0;
  return `<div class="country-text" style="background:transparent;border:1px solid rgba(255,255,255,0.03);font-weight:700;font-size:1.05rem;text-align:center">${wins1} - ${wins2}</div>`;
}

function renderMedium(h2h){
  if(!h2h) return renderEasy(null);
  const matches = Array.isArray(h2h.matches) ? h2h.matches : [];
  const grouped = {};
  matches.forEach(m => { const s = m.surface || 'Unknown'; if(!grouped[s]) grouped[s]=[]; grouped[s].push(m); });
  let html = `<div class="country-text" style="background:transparent;border:1px solid rgba(255,255,255,0.03)"><div style="font-weight:700;margin-bottom:8px">By surface</div>`;
  if(Object.keys(grouped).length===0) html += `<div style="color:var(--muted)">No detailed matches available.</div>`;
  for(const s of ['Clay','Grass','Hard','Carpet','Unknown']){
    const g = grouped[s] || [];
    const wins1 = g.filter(m => String(m.player_id_winner) === String(h2h.player1 && h2h.player1.id)).length;
    const wins2 = g.filter(m => String(m.player_id_winner) === String(h2h.player2 && h2h.player2.id)).length;
    html += `<div style="margin-left:6px;margin-top:6px"><strong>${escapeHtml(s)}</strong>: ${wins1} - ${wins2} (${g.length})</div>`;
  }
  html += `</div>`;
  return html;
}

function renderHard(h2h){
  if(!h2h) return renderEasy(null);
  const matches = Array.isArray(h2h.matches) ? h2h.matches.slice().sort((a,b)=>(a.match_date||'').localeCompare(b.match_date||'')) : [];
  if(matches.length===0) return `<div class="country-text">No match details available.</div>`;
  let html = `<div class="country-text" style="background:transparent;border:1px solid rgba(255,255,255,0.03)"><div style="font-weight:700;margin-bottom:8px">Matches (${matches.length})</div><div style="max-height:340px;overflow:auto"><table style="width:100%;color:#e6eef8"><thead><tr><th>Date</th><th>Tournament</th><th>Surface</th><th>Score</th></tr></thead><tbody>`;
  matches.forEach(m=>{
    const date = m.match_date || '';
    const tourney = (m.tourney_name || m.event_id || '') + (m.event_year ? (' ' + m.event_year) : '');
    const surface = m.surface || '';
    const score = m.score_string || '';
    html += `<tr><td>${escapeHtml(date)}</td><td>${escapeHtml(tourney)}</td><td>${escapeHtml(surface)}</td><td>${escapeHtml(score)}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

/* ---------------------------
  Guess handling & table UI (adapted to 15 attempts and no country column)
---------------------------- */
function clearGuessesTable(){ document.querySelector('#guessesTable tbody').innerHTML = ''; }
function appendGuessRow(guessPlayer, comparison){
  const tbody = document.querySelector('#guessesTable tbody'); const tr=document.createElement('tr'); const idx = guesses.length;
  if(comparison.nameMatch) tr.classList.add('good');
  const tdIndex=document.createElement('td'); tdIndex.textContent=idx;
  const tdName=document.createElement('td'); tdName.textContent=guessPlayer.full_name;
  const tdAge=document.createElement('td'); tdAge.innerHTML=(comparison.ageGuess!=null?comparison.ageGuess:'—') + (comparison.ageDirection?(' '+(comparison.ageDirection==='up'?'↑':'↓')):'');
  const tdRank=document.createElement('td'); tdRank.innerHTML=(comparison.rankGuess!=null && isFinite(comparison.rankGuess)?comparison.rankGuess:'—') + (comparison.rankDirection?(' '+(comparison.rankDirection==='up'?'↑':'↓')):'');
  const tdBirth=document.createElement('td'); tdBirth.innerHTML=(comparison.birthDistanceKm!=null?`<strong style="font-weight:800">${comparison.birthDistanceKm} km</strong>`:'unknown');
  const tdHeight=document.createElement('td'); tdHeight.innerHTML=(comparison.heightGuess!=null?comparison.heightGuess+' cm':'—') + (comparison.heightDirection?(' '+(comparison.heightDirection==='up'?'↑':'↓')):'');
  const tdRight=document.createElement('td'); tdRight.innerHTML=(guessPlayer.right_handed===null?'—':(guessPlayer.right_handed?'Yes':'No')) + (comparison.rightMatch?(' ✔︎'):'' );
  const tdTwo=document.createElement('td'); tdTwo.innerHTML=(guessPlayer.two_handed===null?'N/A':(guessPlayer.two_handed?'Yes':'No')) + (comparison.twoHanded===null?'':(comparison.twoHanded?' ✔︎':' ✖︎'));
  [tdIndex,tdName,tdAge,tdRank,tdBirth,tdHeight,tdRight,tdTwo].forEach(td=>tr.appendChild(td)); tbody.prepend(tr);
}

function comparePlayers(guess, target){
  const res = {};
  // nameMatch: prefer player_id comparison if available
  res.nameMatch = (guess.player_id && target.player_id && String(guess.player_id) === String(target.player_id)) || (guess.full_name && target.full_name && norm(guess.full_name) === norm(target.full_name));
  if(guess.age != null && target.age != null){ res.ageGuess=guess.age; res.ageTarget=target.age; res.ageDirection = (guess.age===target.age)?'equal':(guess.age>target.age?'down':'up'); } else { res.ageGuess=guess.age; res.ageTarget=target.age; res.ageDirection=null; }
  const gRank = guess.rank, tRank = target.rank; if(isFinite(gRank) && isFinite(tRank)){ res.rankGuess=gRank; res.rankTarget=tRank; res.rankDirection = (gRank===tRank)?'equal':(gRank>tRank?'up':'down'); } else { res.rankGuess=isFinite(gRank)?gRank:null; res.rankTarget=isFinite(tRank)?tRank:null; res.rankDirection=null; }
  let dist = null; if(guess.birthplace && target.birthplace){ const g=geocodes[guess.birthplace]||geocodes[String(guess.birthplace).trim()]||null; const t=geocodes[target.birthplace]||geocodes[String(target.birthplace).trim()]||null; if(g && t && g.length>=2 && t.length>=2) dist = Math.round(haversineKm(g[0],g[1],t[0],t[1])); }
  res.birthDistanceKm = dist;
  if(guess.height_cm != null && target.height_cm != null){ res.heightGuess = guess.height_cm; res.heightTarget = target.height_cm; res.heightDirection = (guess.height_cm===target.height_cm)?'equal':(guess.height_cm>target.height_cm?'down':'up'); } else { res.heightGuess = guess.height_cm; res.heightTarget = target.height_cm; res.heightDirection=null; }
  res.rightMatch = (guess.right_handed === target.right_handed);
  res.twoHanded = (guess.two_handed===null || target.two_handed===null) ? null : (guess.two_handed === target.two_handed);
  return res;
}

/* ---------------------------
  Main guess submission
  - stops after 15 attempts (remaining initialized to 15)
  - compares by player_id to detect exact guess
  - on guess, we fetch per-player H2H of the guessed player if needed and compose the H2H
---------------------------- */
async function handleGuessSubmission(name){
  if(!gameStarted){ showToast('Round not started'); return; }
  if(remaining <= 0){ showToast('No tries left'); return; }
  const guess = findPlayerByName(name);
  if(!guess){ showToast('Name not found in catalog'); return; }
  guessedNames.add((guess.full_name||'').trim());
  remaining--; document.getElementById('remaining').textContent = remaining;
  // ensure H2H composed (this will fetch per-player file on demand)
  const cacheKeyA = `${target.player_id}_${guess.player_id}`, cacheKeyB = `${guess.player_id}_${target.player_id}`;
  if(!h2hCache[cacheKeyA] && !h2hCache[cacheKeyB]){
    const found = await fetchH2HTryBoth(target.player_id, guess.player_id);
    if(!found){
      const comparison = comparePlayers(guess, target);
      appendGuessRow(guess, comparison);
      showToast('No H2H record for this pair');
      if(remaining <= 0 || guesses.length+1 >= 15){ revealRound(false); setTimeout(startRound, 1000); }
      return;
    }
  }
  const comparison = comparePlayers(guess, target);
  guesses.push({player:guess, comparison});
  appendGuessRow(guess, comparison);
  if(comparison.nameMatch){
    const points = Math.max(10, 100 - (guesses.length-1)*10);
    score += points; document.getElementById('score').textContent = score;
    revealRound(true, points);
    setTimeout(startRound, 1200);
    return;
  }

  // get composed H2H and render according to currentLevel
  const h2h = h2hCache[cacheKeyA] || h2hCache[cacheKeyB];
  let outHtml = '';
  if(currentLevel === 'easy') outHtml = renderEasy(h2h);
  else if(currentLevel === 'medium') outHtml = renderMedium(h2h);
  else outHtml = renderHard(h2h);
  document.getElementById('preloadStatus').innerHTML = outHtml;

  // stop conditions: remaining <= 0 or attempts >= 15
  if(remaining <= 0 || guesses.length >= 15){ revealRound(false); setTimeout(startRound, 1200); }
}

/* revealRound modal */
function revealRound(won, points){
  const modal = document.getElementById('modal'); const title=document.getElementById('modalTitle'); const text=document.getElementById('modalText'); const details=document.getElementById('modalDetails');
  if(won){ title.textContent='You won!'; text.textContent=`You earned ${points} points.`; } else { title.textContent='Round over'; text.textContent='No points this time.'; }
  const p = target || {}; const targetHtml = `<div style="text-align:left;margin-top:12px"><h3 style="margin:0 0 6px 0;color:#fff">${escapeHtml(p.full_name||'—')}</h3><ul style="color:var(--muted);padding-left:18px"><li>Birth: ${(p.birthplace||'—')} ${p.birth_date? '('+escapeHtml(p.birth_date)+')':''}</li><li>Age: ${(p.age!=null?p.age:'—')}</li><li>Career best: ${(isFinite(p.rank)?p.rank:'—')}</li><li>Height: ${(p.height_cm!=null? p.height_cm + ' cm' : '—')}</li></ul></div>`;
  details.innerHTML = targetHtml; modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
  document.getElementById('closeModalBtn').onclick = ()=>{ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
}

/* ---------------------------
  Round start & selection
---------------------------- */
function pickTargetFromSelected(mode, level){
  if(!selectedPlayers) return null;
  const arr = selectedPlayers[mode] || selectedPlayers[mode.toLowerCase()] || [];
  const found = arr.find(x => x.level === level);
  return found ? found.player : null;
}

async function startRound(){
  remaining = 15; guesses = []; guessedNames.clear(); document.getElementById('remaining').textContent = remaining; document.getElementById('score').textContent = score; clearGuessesTable();
  if(!selectedPlayers){ const ok = await loadSelectedPlayers(); if(!ok){ showToast('selected_players.json missing'); return; } }
  const picked = pickTargetFromSelected(currentTour.toLowerCase(), currentLevel) || pickTargetFromSelected(currentTour, currentLevel) || null;
  if(picked){
    // try to enrich from catalog if possible
    const enriched = playersCatalog.find(p=>p.player_id && picked.player_id && String(p.player_id) === String(picked.player_id)) || playersCatalog.find(p=>p.full_name && picked.full_name && p.full_name.trim().toLowerCase() === picked.full_name.trim().toLowerCase()) || picked;
    target = enriched;
  } else {
    // fallback random from catalog
    const pool = playersCatalog.filter(p => (String(p.source||'').toUpperCase()===currentTour) && p.rank <= 9999);
    target = pool.length ? pool[Math.floor(Math.random()*pool.length)] : (playersCatalog[0] || null);
  }
  if(!target){ showToast('No target available'); return; }
  gameStarted = true;
  document.getElementById('tourLabel').textContent = currentTour;
  document.getElementById('levelLabel').textContent = currentLevel.charAt(0).toUpperCase()+currentLevel.slice(1);
  document.getElementById('preloadStatus').textContent = `Preloading H2H for ${target.player_id}...`;
  // preload selected-player files (some already preloaded at init) and compose known pairs
  await preloadAllH2HForTarget(String(target.player_id));
  document.getElementById('preloadStatus').textContent = `Preload done — found ${h2hFoundCount} H2H file(s) for ${target.player_id}`;
}

/* ---------------------------
  Init: wire UI, load catalog, geocodes, selected + per-player files
---------------------------- */
async function init(){
  document.getElementById('btnATP').addEventListener('click', ()=>{ if(currentTour!=='ATP'){ currentTour='ATP'; document.getElementById('tourLabel').textContent = currentTour; startRound(); }});
  document.getElementById('btnWTA').addEventListener('click', ()=>{ if(currentTour!=='WTA'){ currentTour='WTA'; document.getElementById('tourLabel').textContent = currentTour; startRound(); }});
  document.querySelectorAll('.seg-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); e.currentTarget.classList.add('active'); currentLevel = e.currentTarget.dataset.level; document.getElementById('levelLabel').textContent = currentLevel.charAt(0).toUpperCase()+currentLevel.slice(1); startRound(); }));
  document.getElementById('guessBtn').addEventListener('click', ()=>{ const v=guessInput.value.trim(); if(!v) return showToast('Type a name'); handleGuessSubmission(v); guessInput.value=''; suggestionsList.style.display='none'; });
  document.getElementById('closeModalBtn').addEventListener('click', ()=>{ document.getElementById('modal').classList.remove('show'); });

  const okCatalog = await loadPlayersCatalog();
  if(!okCatalog){ alert('players_catalog.json missing or malformed'); return; }
  await loadGeocodes();
  const okSel = await loadSelectedPlayers();
  if(okSel){
    // preload per-player files for the 6 selected players (limit 6)
    await loadH2HFilesForSelectedPlayers(6);
  }
  startRound();
}

init();

/* helper to load selected players (used above) */
async function loadSelectedPlayers(){
  const j = await fetchJson(SELECTED_PLAYERS_JSON);
  if(!j) return false;
  selectedPlayers = j;
  selectedPlayers.atp = selectedPlayers.atp || selectedPlayers.ATP || selectedPlayers.atp || [];
  selectedPlayers.wta = selectedPlayers.wta || selectedPlayers.WTA || selectedPlayers.wta || [];
  return true;
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guess The Player — H2H (6 modes + leaderboard)</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700,800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1: #071226; --bg2: #081428;
    --muted:#94a3b8; --success:#16a34a; --danger:#ef4444;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color-scheme: dark;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  .wrap{max-width:1100px;margin:28px auto;padding:20px;border-radius:14px;position:relative;z-index:2;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow: 0 8px 40px rgba(2,6,23,0.6); border: 1px solid rgba(255,255,255,0.03);}
  header{display:flex;align-items:center;gap:16px}
  h1{margin:0;font-weight:800;color: #eef2ff; font-size:1.25rem}
  .sub{color:var(--muted);font-size:0.9rem}
  .controls{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;align-items:center}
  .card{background:transparent;padding:12px;border-radius:12px}
  .segment{display:flex;background:transparent;border-radius:10px;padding:4px;gap:6px}
  .seg-btn{padding:8px 12px;border-radius:8px;border:none;color:var(--muted);cursor:pointer;font-weight:600;background:transparent;transition:all .18s ease}
  .seg-btn.active{color:white; box-shadow:0 6px 18px rgba(2,6,23,0.6); transform:translateY(-2px)}
  .tour-toggle{display:flex;gap:6px}
  .tour-btn{min-width:72px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-weight:700;background:transparent;color:var(--muted)}
  .tour-btn.active.atp{background:linear-gradient(180deg, rgba(31,122,236,0.14), rgba(31,122,236,0.06)); color: #cfe8ff}
  .tour-btn.active.wta{background:linear-gradient(180deg, rgba(139,92,246,0.14), rgba(139,92,246,0.06)); color: #efe6ff}
  .game-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .chip{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;border:1px solid rgba(255,255,255,0.02)}
  .chip strong {color:#fff}
  .input-row{display:flex;gap:8px;align-items:center;margin-top:12px}
  input[type="text"], input[type="password"]{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#fff;min-width:200px}
  button.primary{padding:10px 14px;border-radius:10px;border:none;background:#1f7aec;color:white;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(31,122,236,0.12)}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer}
  .suggestions{position:relative}
  .suggestions-list{position:absolute;left:0;top:44px;width:100%;max-height:220px;overflow:auto;background:linear-gradient(180deg,#0b1220,#071025);border-radius:8px;border:1px solid rgba(255,255,255,0.04);z-index:80;box-shadow:0 10px 40px rgba(2,6,23,0.6)}
  .suggestions-list li{list-style:none;padding:8px 10px;color:#e6eef8;cursor:pointer;border-bottom:1px dashed rgba(255,255,255,0.02)}
  .suggestions-list li:hover, .suggestions-list li.highlight{ background: rgba(255,255,255,0.02); color: #fff; }
  table{width:100%;border-collapse:collapse;margin-top:14px;color:#e6eef8}
  th,td{padding:10px;text-align:left;border-bottom:1px dashed rgba(255,255,255,0.03);font-size:0.95rem}
  thead th{color:var(--muted);font-weight:700}
  .country-text{margin-top:14px;padding:16px;border-radius:12px;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,0.04)}
  .modal {position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.8));z-index:400;opacity:0;pointer-events:none;transition:opacity .18s ease}
  .modal.show{opacity:1;pointer-events:auto}
  .modal-card{background:linear-gradient(180deg, rgba(11,17,32,0.98), rgba(8,12,23,0.96));padding:26px;border-radius:16px;max-width:520px;width:94%;box-shadow:0 30px 80px rgba(2,6,23,0.8);border:1px solid rgba(255,255,255,0.03);text-align:center}
  .toast{position:fixed;right:18px;bottom:18px;background:rgba(0,0,0,0.7);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,0.6);display:none;z-index:220}
  .lb-card{margin-left:auto;display:flex;gap:8px;align-items:center}
  #lb-status{color:var(--muted);font-size:0.9rem;margin-left:8px}
  /* prettier user badge: circular avatar + pseudo text */
.user-badge{
  display:flex;
  align-items:center;
  gap:10px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.06);
  color:#fff;
  box-shadow: 0 6px 18px rgba(2,6,23,0.55);
}

/* small avatar circle with initials */
.user-badge .lb-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:13px;
  color:white;
  background: linear-gradient(135deg,#2b8af6,#7b5cf6);
  box-shadow: 0 4px 12px rgba(43,138,246,0.18), inset 0 -2px 6px rgba(0,0,0,0.12);
}

/* nicer pseudo text */
.user-badge .lb-name{
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.2px;
  color: #fff;
  max-width:160px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* small logout button styling inside the badge area */
.user-badge .lb-logout-btn{
  margin-left:6px;
  padding:6px 8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.04);
  background:transparent;
  color:var(--muted);
  font-weight:600;
  cursor:pointer;
}

/* status text */
#lb-status{ color:var(--muted); font-size:0.95rem; margin-left:12px; min-width:92px; text-align:right; }

  @media (max-width:880px){ input[type="text"]{min-width:140px} .chip{font-size:0.85rem} th,td{padding:8px;font-size:0.9rem} }
</style>
</head>
<body>
  <div class="wrap">
    <header style="align-items:flex-start">
      <div><h1>Guess the Player</h1><div class="sub">H2H game — Answers are updated daily.</div></div>

      <!-- LB area -->
      <div class="lb-card card" aria-hidden="false" style="margin-left:auto;align-items:center">
        <div id="lbDisplay" style="display:none" class="user-badge" role="status" aria-live="polite">
  <div class="lb-avatar" id="lbAvatar">??</div>
  <div class="lb-name" id="lbName">Me</div>
  <button id="lbLogout" class="lb-logout-btn" title="Log out">Log out</button>
</div>

        <button id="lbOpenBtn" class="ghost">Log in / Sign up</button>
        <div id="lb-status">Not connected</div>
      </div>
    </header>

    <div class="controls" style="margin-top:18px">
      <div class="card tour-toggle" style="padding:10px 12px">
        <button id="btnATP" class="tour-btn active atp" data-tour="ATP">ATP</button>
        <button id="btnWTA" class="tour-btn wta" data-tour="WTA">WTA</button>
      </div>

      <div class="card" style="padding:8px 10px">
        <div id="difficultySegment" class="segment" role="tablist" aria-label="difficulty">
          <button class="seg-btn active" data-level="easy" id="sEasy">Easy</button>
          <button class="seg-btn" data-level="medium" id="sMedium">Medium</button>
          <button class="seg-btn" data-level="hard" id="sHard">Hard</button>
        </div>
      </div>

      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      </div>
    </div>

    <div class="game-meta" style="margin-top:18px">
      <div class="chip">Level: <strong id="levelLabel">Easy</strong></div>
      <div class="chip">Tour: <strong id="tourLabel">ATP</strong></div>
      <div class="chip">Remaining: <strong id="remaining">15</strong></div>
      <div class="chip">Score: <strong id="score">0</strong></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="input-row">
        <div style="flex:1;position:relative">
          <div class="suggestions" style="width:100%">
            <input id="guessInput" type="text" placeholder="Type a player name..." autocomplete="off" />
            <ul id="suggestionsList" class="suggestions-list" style="display:none"></ul>
          </div>
        </div>
        <button id="guessBtn" class="primary">Guess</button>
      </div>

      <div style="margin-top:10px;color:var(--muted);font-size:0.95rem">
        <span id="preloadStatus">H2H preload: idle</span>
      </div>

      <table id="guessesTable" aria-live="polite" style="margin-top:14px">
        <thead>
          <tr><th>#</th><th>Guessed name</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="h2hOutput" class="country-text" style="display:block;margin-top:16px">
        <div id="placeholder">H2H results will appear here.</div>
      </div>
    </div>
  </div>

  <!-- Login / Sign up modal (password now REQUIRED) -->
  <div id="lbModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card" style="max-width:420px">
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px">
        <button id="tabLogin" class="seg-btn active">Log in</button>
        <button id="tabSignup" class="seg-btn">Sign up</button>
      </div>
      <div style="text-align:left">
        <label style="display:block;margin-bottom:6px">Display name</label>
        <input id="lbModalPseudo" type="text" autocomplete="username" />
        <label style="display:block;margin-top:8px;margin-bottom:6px">Password (required)</label>
        <input id="lbModalPassword" type="password" autocomplete="current-password" />
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
          <button id="lbModalCancel" class="ghost">Cancel</button>
          <button id="lbModalSubmit" class="primary">Continue</button>
        </div>
        <div id="lbModalMsg" style="margin-top:8px;color:var(--muted)"></div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <h2 id="modalTitle">Round result</h2>
      <p id="modalText" style="color:var(--muted)"></p>
      <div id="modalDetails" style="margin-top:12px;color:#e8f4ea"></div>
      <div style="margin-top:18px;display:flex;gap:12px;justify-content:center">
        <button id="closeModalBtn" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------------------
  CONFIG / KEYS
---------------------------- */
const SELECTED_PLAYERS_JSON = '/selected_players.json';
const PLAYERS_CATALOG_JSON = '/tools/players_catalog.json';
const GEOCODES_JSON = '/tools/geocodes_combined.json';
const H2H_BY_PLAYER_BASE = '/data/h2h_by_player/';

const LB_QUEUE_KEY = 'lb_score_queue_guess6_v1';
const LB_USERS_KEY = 'lb_users_v1'; // map pseudo -> password_hash
const LB_LOCAL_USER_KEY = 'lb_local_user_v1'; // { pseudo, password_hash }

/* ---------------------------
  STATE
---------------------------- */
let selectedPlayers = null;
let playersCatalog = [];
let geocodes = {};

let target = null;
let currentTour = 'ATP';
let currentLevel = 'easy';
let remaining = 15;
let score = 0;
let gameStarted = false;
let guesses = [];
let guessedNames = new Set();

let h2hByPlayerCache = {};
let composedH2HCache = {};
let preloadedCount = 0;

/* ---------------------------
  UTIL
---------------------------- */




// --- Ensure a sane default mode is selected (ATP + easy) and UI reflects it
function ensureDefaultModeUI(){
  // set defaults if undefined / empty
  if (!currentTour) currentTour = 'ATP';
  if (!currentLevel) currentLevel = 'easy';

  // update tour buttons
  const btnATP = document.getElementById('btnATP');
  const btnWTA = document.getElementById('btnWTA');
  if (btnATP) btnATP.classList.toggle('active', currentTour === 'ATP');
  if (btnWTA) btnWTA.classList.toggle('active', currentTour === 'WTA');

  // update difficulty segment buttons
  const segBtns = document.querySelectorAll('.seg-btn');
  segBtns.forEach(b => {
    const lvl = b.dataset.level;
    if (lvl) b.classList.toggle('active', lvl === currentLevel);
  });

  // update labels in header
  const tourLabel = document.getElementById('tourLabel');
  const levelLabel = document.getElementById('levelLabel');
  if (tourLabel) tourLabel.textContent = currentTour;
  if (levelLabel) levelLabel.textContent = currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1);
}


function showToast(msg, t=2000){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none', t); }
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }
function norm(s){ return s ? s.normalize().replace(/[\u0300-\u036f]/g,'').toLowerCase() : ''; }
async function hashStringSHA256Hex(s){
  if(!s) return null;
  const enc = new TextEncoder(); const data = enc.encode(s);
  const dig = await crypto.subtle.digest('SHA-256', data);
  const arr = Array.from(new Uint8Array(dig)).map(b => b.toString(16).padStart(2,'0'));
  return arr.join('');
}

/* ---------------------------
  fetch helpers
---------------------------- */
async function fetchJson(path){ try{ const r = await fetch(path, {cache:'no-cache'}); if(!r.ok) return null; return await r.json(); } catch(e){ return null; } }

/* ---------------------------
  players + geocodes
---------------------------- */
async function loadPlayersCatalog(){ const j = await fetchJson(PLAYERS_CATALOG_JSON); if(!j || !Array.isArray(j.players)) return false; playersCatalog = j.players.map(p => Object.assign({}, p)); return true; }
async function loadGeocodes(){ const j = await fetchJson(GEOCODES_JSON); if(!j){ geocodes = {}; return false; } geocodes = j.geocode || j; return true; }

/* ---------------------------
  suggestions (autocomplete)
---------------------------- */
const guessInput = document.getElementById('guessInput');
const suggestionsList = document.getElementById('suggestionsList');
let suggestionPool = [], suggestionIndex = -1;

function updateSuggestions(){
  const q = (guessInput.value||'').trim().toLowerCase();
  if(q.length < 2){ suggestionsList.style.display='none'; suggestionPool=[]; return; }
  let pool = playersCatalog.filter(p => p.full_name && p.full_name.toLowerCase().includes(q) && (String(p.source||'').toUpperCase() === currentTour));
  if(pool.length === 0) pool = playersCatalog.filter(p => p.full_name && p.full_name.toLowerCase().includes(q));
  pool = pool.filter(p => !guessedNames.has((p.full_name||'').trim())).slice(0,60);
  suggestionPool = pool; renderSuggestions(pool);
}
function renderSuggestions(list){
  suggestionsList.innerHTML=''; suggestionIndex=-1;
  if(!list || !list.length){ suggestionsList.style.display='none'; return; }
  const max = Math.min(12, list.length);
  for(let i=0;i<max;i++){
    const pl = list[i];
    const li = document.createElement('li');
    li.textContent = pl.full_name;
    li.dataset.idx = i;
    li.onclick = () => { guessInput.value = pl.full_name; suggestionsList.style.display='none'; handleGuessSubmission(pl.full_name); };
    li.onmouseover = () => { Array.from(suggestionsList.children).forEach(n=>n.classList.remove('highlight')); li.classList.add('highlight'); suggestionIndex=i; };
    suggestionsList.appendChild(li);
  }
  suggestionsList.style.display = 'block';
}
guessInput.addEventListener('input', updateSuggestions);
guessInput.addEventListener('focus', updateSuggestions);
document.addEventListener('click', (e)=>{ if(!document.querySelector('.suggestions')?.contains(e.target)) suggestionsList.style.display='none'; });
guessInput.addEventListener('keydown', (e) => {
  if(suggestionsList.style.display==='block'){
    const items = suggestionsList.children;
    if(e.key === 'ArrowDown'){ e.preventDefault(); suggestionIndex = Math.min(suggestionIndex+1, items.length-1); highlightSuggestion(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); suggestionIndex = Math.max(suggestionIndex-1,0); highlightSuggestion(); }
    else if(e.key === 'Enter'){ if(suggestionIndex >= 0 && suggestionPool[suggestionIndex]){ e.preventDefault(); const sel = suggestionPool[suggestionIndex]; guessInput.value = sel.full_name; suggestionsList.style.display='none'; handleGuessSubmission(sel.full_name); } }
  }
});
function highlightSuggestion(){ const items = suggestionsList.children; for(let i=0;i<items.length;i++) items[i].classList.toggle('highlight', i===suggestionIndex); }

/* ---------------------------
  find player by name
---------------------------- */
function findPlayerByName(name){
  if(!name) return null;
  const q = norm(name.trim());
  let p = playersCatalog.find(x => x.player_id && String(x.player_id).toLowerCase() === name.trim().toLowerCase());
  if(p) return p;
  p = playersCatalog.find(x => x.full_name && norm(x.full_name) === q);
  if(p) return p;
  p = playersCatalog.find(x => x.full_name && norm(x.full_name).startsWith(q));
  if(p) return p;
  p = playersCatalog.find(x => x.full_name && norm(x.full_name).includes(q));
  return p || null;
}

/* ---------------------------
  per-player H2H loader & composer
---------------------------- */
async function loadPerPlayerH2H(playerId){
  if(!playerId) return null;
  if(h2hByPlayerCache[playerId]) return h2hByPlayerCache[playerId];
  const path = `${H2H_BY_PLAYER_BASE}${encodeURIComponent(playerId)}.json`;
  const j = await fetchJson(path);
  if(!j) return null;
  h2hByPlayerCache[playerId] = j; return j;
}
function composeH2H(playerAId, playerBId){
  if(!playerAId || !playerBId) return null;
  const aId = String(playerAId), bId = String(playerBId);
  const cacheKey = `${aId}_${bId}`;
  if(composedH2HCache[cacheKey]) return composedH2HCache[cacheKey];

  const A = h2hByPlayerCache[aId] || null;
  const B = h2hByPlayerCache[bId] || null;
  if(!A && !B){
    const empty = { meta:{total_matches:0}, playerA:{id:aId}, playerB:{id:bId}, matches:[], aggregates:{A_wins:0,B_wins:0} };
    composedH2HCache[cacheKey] = empty; return empty;
  }

  const collected = [];
  if(A && Array.isArray(A.matches)){ for(const m of A.matches) if(String(m.opponent_id) === bId) collected.push(Object.assign({}, m)); }
  if(B && Array.isArray(B.matches)){ for(const m of B.matches) if(String(m.opponent_id) === aId) collected.push(Object.assign({}, m)); }
  if(collected.length === 0){
    const empty = { meta:{total_matches:0}, playerA:{id:aId}, playerB:{id:bId}, matches:[], aggregates:{A_wins:0,B_wins:0} };
    composedH2HCache[cacheKey] = empty; return empty;
  }

  const seen = new Set(); const normalized = []; let A_wins=0,B_wins=0;
  for(const m of collected){
    const mid = m.match_id || (m.event_id ? (m.event_id + '|' + (m.match_date||'')) : JSON.stringify([m.match_date,m.score,m.opponent_id]));
    if(seen.has(mid)) continue; seen.add(mid);
    let winnerId = null;
    if(m.player_id_winner) winnerId = String(m.player_id_winner);
    else if(typeof m.is_winner !== 'undefined'){ winnerId = m.is_winner ? String(aId) : String(bId); }
    if(winnerId === aId) A_wins++; else if(winnerId === bId) B_wins++;
    normalized.push({
      match_id: m.match_id || mid,
      event_id: m.event_id || '',
      event_year: m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : ''),
      tourney_name: m.tourney_name || '',
      surface: m.surface || 'Other',
      round: m.round || '',
      score_string: m.score || m.score_string || '',
      match_date: m.match_date || '',
      player_id_winner: winnerId || null,
      opponent_id: m.opponent_id || null
    });
  }
  const h2h = { meta:{total_matches:normalized.length}, playerA:{id:aId}, playerB:{id:bId}, matches: normalized.sort((x,y)=>(String(y.event_year||'').localeCompare(String(x.event_year||'')) || (x.match_date||'').localeCompare(y.match_date||''))), aggregates:{A_wins,B_wins} };
  composedH2HCache[cacheKey] = h2h; return h2h;
}

/* ---------------------------
  UI rendering helpers for H2H (easy/medium/hard)
---------------------------- */
function ensureOutputSkeleton(){
  const out = document.getElementById('h2hOutput'); out.innerHTML = '';
  if(currentLevel === 'hard'){
    const tbl = document.createElement('table'); tbl.id = 'h2hTableHard';
    tbl.innerHTML = '<thead><tr><th>Guessed Name</th><th style="text-align:center">H2H (guess - target)</th></tr><tbody></tbody>';
    out.appendChild(tbl);
  } else if(currentLevel === 'medium'){
    const tbl = document.createElement('table'); tbl.id = 'h2hTableMedium';
    tbl.innerHTML = '<thead><tr><th>Guessed Name</th><th>Clay</th><th>Grass</th><th>Hard</th><th>Carpet</th><th>Other</th></tr><tbody></tbody>';
    out.appendChild(tbl);
  } else {
    const tbl = document.createElement('table'); tbl.id = 'h2hTableEasy';
    tbl.innerHTML = '<thead><tr><th>Guessed Name</th><th>Recent matches</th></tr><tbody></tbody>';
    out.appendChild(tbl);
  }
}
function computeSurfaceCounts(h2h){
  const map = {}; if(!h2h || !Array.isArray(h2h.matches)) return map;
  for(const m of h2h.matches){ const s = m.surface || 'Other'; map[s] = map[s] || {A:0,B:0,total:0}; const winner = String(m.player_id_winner || ''); if(winner === String(h2h.playerA.id)) map[s].A++; else if(winner === String(h2h.playerB.id)) map[s].B++; map[s].total++; }
  return map;
}
function buildMatchLinesEasy(h2h, guessedPlayerId, guessedPlayerName){
  if(!h2h || !Array.isArray(h2h.matches) || h2h.matches.length === 0) return ['No matches'];
  const lines = [];

/* We'll reuse the previous robust submission code — for brevity I keep it but it behaves the same:
   - try library submitScore (non-blocking)
   - always try server fallback (Netlify function)
   - on failure push to local queue LB_QUEUE_KEY
   - flushQueue tries server even if library missing
*/

/* Implementations of: readScoreQueue, pushScoreQueue, popScoreQueue, trySubmitEntryToLB, flushScoreQueue, submitScoreToLeaderboard
   (I reuse the logic provided earlier — identical behaviour) */

function readScoreQueue(){ try { return JSON.parse(localStorage.getItem(LB_QUEUE_KEY) || '[]'); } catch(e){ return []; } }
function pushScoreQueue(entry){ try { const q = readScoreQueue(); q.push(Object.assign({ts: (new Date()).toISOString()}, entry)); localStorage.setItem(LB_QUEUE_KEY, JSON.stringify(q)); console.info('[LB-QUEUE] queued', entry); } catch(e){ console.warn('[LB-QUEUE] push error', e); } }
function popScoreQueue(){ try { const q = readScoreQueue(); if(!q||q.length===0) return null; q.shift(); localStorage.setItem(LB_QUEUE_KEY, JSON.stringify(q)); return true; } catch(e){ console.warn('[LB-QUEUE] pop error', e); return null; } }

async function trySubmitEntryToLB(entry){
  const gameId = entry.gameId || 'guess_player_h2h_6m';
  const points = Number(entry.points) || 0;
  const options = entry.options || {};
  const pseudo = options.displayName || options.pseudo || null;
  const meta = options.meta || null;

  console.info('[LB-TRY] start', { gameId, points, pseudo });

  if(window.LEADERBOARD && typeof window.LEADERBOARD.submitScore === 'function'){
    try { console.info('[LB-TRY] calling library', { gameId, points, options }); const res = await window.LEADERBOARD.submitScore(gameId, points, options); console.info('[LB-TRY] library response', res); } catch(err){ console.warn('[LB-TRY] library threw', err); }
  } else {
    console.info('[LB-TRY] library not available (will fallback to server)');
  }

  const fallbackEndpoint = `${location.origin}/.netlify/functions/submit-score`;
  const payload = {
    game_id: gameId,
    points: points,
    pseudo: pseudo,
    mode: options.mode || null,
    meta: (typeof meta === 'string' ? meta : (meta ? JSON.stringify(meta) : null)),
    ts: (new Date()).toISOString()
  };

  try {
    console.info('[LB-FALLBACK] POST', fallbackEndpoint, payload);
    const resp = await fetch(fallbackEndpoint, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const text = await resp.text().catch(()=>null);
    let parsed = null;
    try { parsed = text ? JSON.parse(text) : null; } catch(e){ parsed = text; }
    console.info('[LB-FALLBACK] resp', resp.status, parsed);
    if(resp.ok){ console.info('[LB-FALLBACK] server insert OK', parsed); return true; }
    if(resp.status === 409 || (parsed && parsed.detail && parsed.detail.code === '23505')){ console.info('[LB-FALLBACK] duplicate - treat success', parsed); return true; }
    console.warn('[LB-FALLBACK] server non-ok', resp.status, parsed); return false;
  } catch(err){
    console.error('[LB-FALLBACK] fetch error', err); return false;
  }
}

async function flushScoreQueue(){
  const q = readScoreQueue();
  if(!q || q.length === 0) return;
  for(let i=0;i<50;i++){
    const arr = readScoreQueue();
    if(!arr || arr.length === 0) break;
    const entry = arr[0];
    const ok = await trySubmitEntryToLB(entry);
    if(ok){ popScoreQueue(); console.info('[LB-QUEUE] flushed one entry'); }
    else { console.warn('[LB-QUEUE] flush failed for first entry — stop trying now'); break; }
  }
}

async function submitScoreToLeaderboard(points, meta = {}, extra = {}){
  const localUser = getLocalUserFromLibOrStorage();
  const displayName = extra.displayName || extra.pseudo || (localUser && localUser.pseudo) || null;
  const modeString = `${currentTour}_h2h_${currentLevel}`;
  const options = { mode: modeString, meta: JSON.stringify(meta || {}), displayName };
  const ok = await trySubmitEntryToLB({ gameId:'guess_player_h2h_6m', points, options });
  if(ok){ console.info('[LB] Score submitted immediate'); setTimeout(flushScoreQueue, 250); return; }
  pushScoreQueue({ gameId:'guess_player_h2h_6m', points, options });
  console.info('[LB] Score queued for retry'); setTimeout(flushScoreQueue, 1000);
}

async function handleGuessSubmission(name){
  if(!gameStarted){ showToast('Round not started'); return; }
  if(remaining <= 0){ showToast('No tries left'); return; }
  const guess = findPlayerByName(name);
  if(!guess){ showToast('Name not found in catalog'); return; }
  guesses.push(guess); guessedNames.add((guess.full_name||'').trim()); appendGuessRowSimple(guess);
  remaining--; document.getElementById('remaining').textContent = remaining;

  const guessPid = guess.player_id || guess.playerId || null;
  const targetPid = target && (target.player_id || target.playerId || (target.player && target.player.player_id)) ? String(target.player_id || target.playerId || (target.player && target.player.player_id)) : null;
  if(guessPid) await loadPerPlayerH2H(String(guessPid)).catch(()=>null);
  if(targetPid) await loadPerPlayerH2H(String(targetPid)).catch(()=>null);

  const h2h = (targetPid && guessPid) ? composeH2H(targetPid, guessPid) : null;
  updateTablesWithGuess(guess, h2h);

  const sameId = (guessPid && targetPid && String(guessPid) === String(targetPid));
  const sameName = (!guessPid && !targetPid && norm(guess.full_name||'') === norm(target.full_name||''));
  if(sameId || sameName){
    const points = Math.max(10, 100 - (guesses.length-1)*10);
    score += points; document.getElementById('score').textContent = score;
    await revealRound(true, points); setTimeout(startRound, 1000); return;
  }

  if(remaining <= 0 || guesses.length >= 15){ await revealRound(false, 0); setTimeout(startRound, 1000); }
}

function pickTargetFromSelected(mode, level){
  if(!selectedPlayers) return null;
  const arr = selectedPlayers[mode] || selectedPlayers[mode.toLowerCase()] || [];
  const found = (Array.isArray(arr)) ? arr.find(x => x.level === level) : null;

async function loadSelectedPlayerFiles(limit = 6){
  if(!selectedPlayers) return;
  const ids = new Set();
  const keys = Object.keys(selectedPlayers||{});
  for(const k of keys){
    const arr = selectedPlayers[k];
    if(Array.isArray(arr)){
      for(const it of arr){
        const id = extractPossiblePlayerId(it) || extractPossiblePlayerId(it.player);
        if(id) ids.add(id);
        if(ids.size >= limit) break;
      }
    }
    if(ids.size >= limit) break;
  }
  const toLoad = Array.from(ids).slice(0,limit);
  if(toLoad.length === 0) return;
  document.getElementById('preloadStatus').textContent = `H2H preload: loading ${toLoad.length} selected-player files...`;
  let i = 0;
  for(const id of toLoad){
    await loadPerPlayerH2H(String(id)).catch(()=>null);
    i++; document.getElementById('preloadStatus').textContent = `H2H preload: ${i}/${toLoad.length} files loaded`;
  }
  preloadedCount = toLoad.length; document.getElementById('preloadStatus').textContent = `H2H preload: loaded ${preloadedCount} selected-player files`;
}
function extractPossiblePlayerId(item){
  if(!item) return null;
  if(typeof item === 'string' || typeof item === 'number') return String(item);
  if(item.player_id) return String(item.player_id);
  if(item.player && item.player.player_id) return String(item.player.player_id);
  if(item.player && item.player.id) return String(item.player.id);
  if(item.player && item.player.raw && item.player.raw.player_id) return String(item.player.raw.player_id);
  return null;
}

/* ---------------------------
  LB Modal logic (LOGIN / SIGNUP) — server-backed
  Replaces the previous local-only modal handler.
  Requires Netlify functions:
    POST /.netlify/functions/create-user  { pseudo, password_hash }
    POST /.netlify/functions/check-user   { pseudo, password_hash }
----------------------------*/

async function signupServer(pseudo, password){
  if(!pseudo || !password) return { ok:false, error:'missing' };
  const password_hash = await hashStringSHA256Hex(String(password));
  try {
    const resp = await fetch('/.netlify/functions/create-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pseudo, password_hash })
    });
    const text = await resp.text().catch(()=>null);
    let parsed = null;
    try { parsed = text ? JSON.parse(text) : null; } catch(e){ parsed = text; }
    if (resp.ok) {
      // Save local session (we keep password_hash locally so submit-score can send it)
      const local = { pseudo: pseudo.trim(), password_hash };
      try { localStorage.setItem(LB_LOCAL_USER_KEY, JSON.stringify(local)); } catch(e){}
      try{ if(window.LEADERBOARD && typeof window.LEADERBOARD.setLocalUser === 'function') window.LEADERBOARD.setLocalUser(local); } catch(e){}
      updateLBStatusUI();
      return { ok:true, user: local };
    } else {
      return { ok:false, status: resp.status, detail: parsed };
    }
  } catch (err) {
    return { ok:false, error: String(err) };
  }
}

async function loginServer(pseudo, password){
  if(!pseudo || !password) return { ok:false, error:'missing' };
  const password_hash = await hashStringSHA256Hex(String(password));
  try {
    const resp = await fetch('/.netlify/functions/check-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pseudo, password_hash })
    });
    const text = await resp.text().catch(()=>null);
    let parsed = null;
    try { parsed = text ? JSON.parse(text) : null; } catch(e){ parsed = text; }
    if (resp.ok) {
      // server confirms credentials -> persist local session
      const user = (parsed && parsed.user) ? parsed.user : { pseudo };
      const local = { pseudo: user.pseudo || pseudo.trim(), password_hash };
      try { localStorage.setItem(LB_LOCAL_USER_KEY, JSON.stringify(local)); } catch(e){}
      try{ if(window.LEADERBOARD && typeof window.LEADERBOARD.setLocalUser === 'function') window.LEADERBOARD.setLocalUser(local); } catch(e){}
      updateLBStatusUI();
      return { ok:true, user: local };
    } else {
      return { ok:false, status: resp.status, detail: parsed };
    }
  } catch (err) {
    return { ok:false, error: String(err) };
  }
}

document.getElementById('lbModalSubmit').addEventListener('click', async ()=> {
  const pseudoRaw = (document.getElementById('lbModalPseudo').value || '');
  const pseudo = pseudoRaw.trim();
  const password = (document.getElementById('lbModalPassword').value || '');
  const isSignup = document.getElementById('tabSignup').classList.contains('active');
  const msgEl = document.getElementById('lbModalMsg');

  if(!pseudo){ msgEl.textContent = 'Display name is required.'; return; }
  if(!password){ msgEl.textContent = 'Password is required.'; return; }

  const users = readLocalUsers(); // map pseudoKey -> password_hash (legacy could be plain)

  // Helper: find stored entry case-insensitively (keeps original stored key)
  function findStoredEntryCaseInsensitive(map, searchPseudo){
    const normSearch = searchPseudo.trim().toLowerCase();
    for(const k of Object.keys(map || {})){
      if(String(k).trim().toLowerCase() === normSearch) return { key: k, value: map[k] };
    }
    return null;
  }

  if(isSignup){
    // signup: must not already exist (case-insensitive)
    const existing = findStoredEntryCaseInsensitive(users, pseudo);
    if(existing){
      msgEl.textContent = 'This display name already exists locally. Choose another or log in.';
      return;
    }
    // create user locally and persist
    try {
      await setLocalUserAndPersist(pseudo, password); // this writes users[pseudo] = hash
      msgEl.textContent = 'Account created and saved locally.';
      updateLBStatusUI();
      setTimeout(()=> closeLBModal(), 400);
      showToast('Signed up (local)');
      return;
    } catch(e){
      console.error('signup error', e);
      msgEl.textContent = 'Signup failed (local)';
      return;
    }
  } else {
    // LOGIN flow
    const found = users[pseudo] ? { key: pseudo, value: users[pseudo] } : findStoredEntryCaseInsensitive(users, pseudo);
    if(!found){
      msgEl.textContent = 'No local account with that name. Please sign up first.';
      return;
    }

    const storedValue = String(found.value || '').trim();

    // compute SHA-256 hex of given password
    let attemptHash = null;
    try { attemptHash = await hashStringSHA256Hex(password); } catch(e){ console.error('hashing failed', e); }

    // helper to detect hex-32bytes (sha256 hex)
    const isHexSha256 = v => typeof v === 'string' && /^[0-9a-f]{64}$/.test(v);

    // Debugging: (optional) show in console — remove or comment out in production
    console.debug('[LB-LOGIN] pseudo=', pseudo, 'foundKey=', found.key, 'storedValueSample=', storedValue ? (storedValue.length>8 ? storedValue.slice(0,8)+'…' : storedValue) : '(empty)');
    console.debug('[LB-LOGIN] attemptHash=', attemptHash ? attemptHash.slice(0,8)+'…' : null);

    // If storedValue looks like a SHA-256 hex, compare to attemptHash
    let ok = false;
    if(isHexSha256(storedValue) && attemptHash){
      if(attemptHash === storedValue) ok = true;
    } else {
      // fallback compatibility: storedValue might be legacy plain password
      if(password === storedValue) ok = true;
      // also accept if storedValue happens to be uppercase hex (normalize)
      if(!ok && typeof storedValue === 'string' && storedValue.toLowerCase() === (attemptHash || '').toLowerCase()) ok = true;
    }

    if(ok){
      // successful login: persist as local current user (store hashed password for future)
      try {
        // ensure we persist hashed password under the same display pseudo (use the display pseudo the user typed)
        await setLocalUserAndPersist(pseudo, password); // writes users map and LB_LOCAL_USER_KEY
      } catch(e){
        console.warn('warning: persist after login failed', e);
      }
      setLocalUserFromStored(pseudo, await hashStringSHA256Hex(password));
      msgEl.textContent = 'Login successful.';
      setTimeout(()=> closeLBModal(), 300);
      showToast('Logged in');
      return;
    } else {
      msgEl.textContent = 'Incorrect password.';
      return;
    }
  }
});

  bootstrap & init
---------------------------- */
async function init(){
  document.getElementById('btnATP').addEventListener('click', ()=>{ if(currentTour!=='ATP'){ currentTour='ATP'; document.getElementById('tourLabel').textContent = currentTour; startRound(); }});
  document.getElementById('btnWTA').addEventListener('click', ()=>{ if(currentTour!=='WTA'){ currentTour='WTA'; document.getElementById('tourLabel').textContent = currentTour; startRound(); }});
  document.querySelectorAll('.seg-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active')); e.currentTarget.classList.add('active'); currentLevel = e.currentTarget.dataset.level; document.getElementById('levelLabel').textContent = currentLevel.charAt(0).toUpperCase()+currentLevel.slice(1); ensureOutputSkeleton(); startRound(); }));
  document.getElementById('guessBtn').addEventListener('click', ()=>{ const v = guessInput.value.trim(); if(!v) return showToast('Type a name'); handleGuessSubmission(v); guessInput.value=''; suggestionsList.style.display='none'; });
  document.getElementById('closeModalBtn').addEventListener('click', ()=>{ const mm = document.getElementById('modal'); try{ if(document.activeElement) document.activeElement.blur(); }catch(e){} mm.classList.remove('show'); setTimeout(()=> mm.setAttribute('aria-hidden','true'), 120); });

  const okCatalog = await loadPlayersCatalog();
  if(!okCatalog){ alert('players_catalog.json missing or malformed'); return; }
  await loadGeocodes();
  await loadSelectedPlayers();
  await loadSelectedPlayerFiles(6);
  updateLBStatusUI();
  ensureOutputSkeleton();
  startRound();
  ensureDefaultModeUI();

}
init();

async function loadSelectedPlayers(){ const j = await fetchJson(SELECTED_PLAYERS_JSON); if(!j) return false; selectedPlayers = j; selectedPlayers.atp = selectedPlayers.atp || selectedPlayers.ATP || selectedPlayers.atp || []; selectedPlayers.wta = selectedPlayers.wta || selectedPlayers.WTA || selectedPlayers.wta || []; return true; }

/* bootstrap local user display */
(function(){ try{ const raw = localStorage.getItem(LB_LOCAL_USER_KEY); if(raw){ const o=JSON.parse(raw); if(o && o.pseudo) document.getElementById('lbName').textContent = o.pseudo; } }catch(e){} updateLBStatusUI(); })();

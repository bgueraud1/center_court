<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tennis Guess — Blur Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0f172a;
    --card:#0b1220;
    --muted:#94a3b8;
    --accent:#06b6d4;
    --accent-2:#7c3aed;
    --glass: rgba(255,255,255,0.04);
    --card-shadow: 0 6px 20px rgba(2,6,23,0.6);
    --radius:14px;
  }
  html,body{height:100%; margin:0; background: linear-gradient(180deg,#071028 0%, #081427 60%); color:#e6eef6; font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  .wrap{max-width:1100px; margin:36px auto; padding:20px;}
  header{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
  h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-0.6px;}
  .subtitle{color:var(--muted); font-size:13px;}
  .grid{display:grid; grid-template-columns:420px 1fr; gap:20px;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:16px; border-radius:var(--radius); box-shadow:var(--card-shadow); border:1px solid rgba(255,255,255,0.03);}
  .controls{display:flex; gap:12px; align-items:center;}
  select, button, input[type=text]{font-family:inherit; font-size:14px;}
  select{background:var(--glass); color:var(--muted); border:1px solid rgba(255,255,255,0.04); padding:8px 10px; border-radius:10px;}
  .btn{background:transparent; color:#e6eef6; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05); cursor:pointer;}
  .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:white; border:none; box-shadow:0 6px 18px rgba(12,74,110,0.15);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.04);}
  .left-col{display:flex; flex-direction:column; gap:12px;}
  canvas{width:100%; height:auto; border-radius:10px; background:linear-gradient(180deg,#111827,#0b1220); display:block; border:1px solid rgba(255,255,255,0.02);}
  .progress{height:10px; background:rgba(255,255,255,0.03); border-radius:999px; overflow:hidden;}
  .progress > div{height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); width:0%;}
  .meta{display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px;}
  .question-area{min-height:220px;}
  h3{margin:6px 0 8px 0;}
  .option{display:block; margin:8px 0; padding:10px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.02); cursor:pointer; text-align:left;}
  .option:disabled{opacity:0.5; cursor:not-allowed;}
  .small{font-size:13px; color:var(--muted);}
  .feedback{margin-top:10px; font-size:14px;}
  .correct{color:#8ef69c;}
  .wrong{color:#ffb4b4;}
  em.addinfo{display:block; margin-top:8px; color:#d1e8ff; font-style:italic;}
  .footer-debug{margin-top:14px; color:var(--muted); font-size:13px;}
  /* timer circle */
  .timer-wrap{display:flex; align-items:center; gap:12px; margin-left:12px;}
  .ring{width:44px; height:44px; position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);}
  /* final guess box */
  .final-guess{display:flex; gap:8px; margin-top:8px; align-items:center;}
  .fancy{display:flex; gap:8px; align-items:center;}
  @media (max-width:920px){ .grid{grid-template-columns:1fr; } .left-col{order:0} .card{padding:12px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tennis Guess — Blur Game</h1>
      <div class="subtitle">Réponds aux 4 questions pour déflouter l'image. Puis devine le joueur·se.</div>
    </div>
  </header>

  <div class="grid">
    <div class="card left-col">
      <canvas id="playerCanvas" width="600" height="600"></canvas>
      <div class="progress"><div id="progressFill"></div></div>
      <div class="meta">
        <div class="small" id="blurMeta">Blur: --%</div>
        <div class="small" id="debug"></div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="controls">
          <label class="small">Theme
            <select id="tagSelect"><option>Loading...</option></select>
          </label>
          <button id="startBtn" class="btn btn-primary">Start Game</button>
          <div style="width:6px"></div>
          <div class="timer-wrap" title="Timer">
            <!-- timer we animate via JS -->
            <div id="timerRing" class="ring" aria-hidden="true">
              <svg width="44" height="44" viewBox="0 0 44 44">
                <defs><linearGradient id="g1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#facc15"/></linearGradient>
                         <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#facc15"/></linearGradient></defs>
                <circle r="18" cx="22" cy="22" stroke="rgba(255,255,255,0.06)" stroke-width="6" fill="none"></circle>
                <!-- main color (red/blue) -->
                <circle id="mainArc" r="18" cx="22" cy="22" stroke="url(#g1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="113.097" stroke-dashoffset="0"></circle>
                <!-- yellow top arc -->
                <circle id="topArc" r="18" cx="22" cy="22" stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="113.097" stroke-dashoffset="0"></circle>
              </svg>
              <div class="label" id="timerLabel">—</div>
            </div>
          </div>
        </div>

        <div>
          <span class="small">Style: fancy • timers animés</span>
        </div>
      </div>

      <hr style="border:none; height:1px; background:rgba(255,255,255,0.02); margin:12px 0;">

      <div class="question-area" id="questionArea">
        <div class="small">Sélectionne un tag et appuie sur <strong>Start</strong>.</div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="nextBtn" class="btn btn-primary" style="display:none">Next question</button>
        <button id="restartBtn" class="btn btn-ghost" style="display:none">Restart</button>
      </div>

      <div class="footer-debug small" id="dataDebug"></div>
    </div>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
const QUESTIONS_CSV = '/games/blur_game/questions.csv';
const IMAGES_MANIFEST_JSON = '/games/blur_game/images_manifest.json';
const IMAGES_CSV = '/games/blur_game/images.csv'; // used for player mapping fallback

// blur tuning
const START_PCT = 220; // initial blur "intensity"
const MIN_GAME_PCT = 33; // min during question steps
const FINAL_REVEAL_PCT = 0; // reveal to 0% when correct final guess
const DIFFICULTY_SUM = 10;
const TOTAL_DEBLUR = START_PCT - MIN_GAME_PCT;
const PIXEL_MAX = 60; // big pixel blocks when blurred

// tags allowed
const ALLOWED_TAGS = ['All','ATP','WTA'];

/* ========== STATE ========== */
let questions = [];
let images = []; // manifest entries {id,url,player,tags}
let imagesCsvMap = {}; // id -> {player, tags}
let availableTags = [];
let currentTag = 'All';
let gameState = null; // {image, questions, currentIndex, blurPct, score, totalQuestions, timers}

/* ========== UTILS ========== */
function normalizeTagsString(s) {
  if (!s) return [];
  return s.split(',').map(x=>x.trim()).filter(Boolean);
}
function containsTag(tagsArray, wantedTag) {
  if (!wantedTag || wantedTag === 'All') return true;
  const wt = wantedTag.toLowerCase();
  return tagsArray.some(t => t.toLowerCase() === wt || t.toLowerCase().includes(wt));
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array(m+1).fill().map(()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
      else dp[i][j]=1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function openAnswerMatches(correct, given, acceptNameVariants=false){
  if (!correct) return false;
  const a = (correct||'').trim().toLowerCase();
  const b = (given||'').trim().toLowerCase();
  if (!b) return false;
  if (a === b) return true;
  if (a.includes(b) || b.includes(a)) return true;
  if (acceptNameVariants) {
    const last = a.split(' ').slice(-1)[0];
    if (last && last === b) return true;
  }
  const maxLen = Math.max(a.length, b.length);
  const threshold = Math.max(1, Math.floor(maxLen * 0.2));
  return levenshtein(a,b) <= threshold;
}

/* ========== DATA LOADING: manifest + images.csv fallback ========== */
async function loadData(){
  // load questions
  const qtxt = await fetch(QUESTIONS_CSV).then(r=>r.ok? r.text(): Promise.reject('questions.csv not found'));
  const qres = Papa.parse(qtxt, { header: true, skipEmptyLines: true });
  questions = qres.data.map(r => ({
    id: (r.id||'').trim(),
    question_type: (r.question_type||'').trim().toLowerCase(),
    question_corps: (r.question_corps||'').trim(),
    qcm_a: (r.qcm_a||'').trim(),
    qcm_b: (r.qcm_b||'').trim(),
    qcm_c: (r.qcm_c||'').trim(),
    qcm_d: (r.qcm_d||'').trim(),
    qcm_answer: (r.qcm_answer||'').trim(),
    answer: (r.answer||'').trim(),
    true_false: (r.true_false||'').trim(),
    difficulty: Number(r.difficulty) || 1,
    open_player: String((r.open_player||'')).toLowerCase() === 'true',
    true_false_additional: (r.true_false_additional||'').trim(),
    tags: normalizeTagsString(r.tags || r.tag || '')
  }));

  // load manifest
  const imtxt = await fetch(IMAGES_MANIFEST_JSON).then(r=> r.ok? r.json(): Promise.reject('images_manifest.json not found'));
  // load images.csv as fallback for player names
  const csvtxt = await fetch(IMAGES_CSV).then(r => r.ok? r.text(): '');
  imagesCsvMap = {};
  if (csvtxt) {
    const imcsv = Papa.parse(csvtxt, { header:true, skipEmptyLines:true }).data;
    imcsv.forEach(row => {
      const id = (row.id||'').trim();
      imagesCsvMap[id] = {
        player: (row.player||'').trim(),
        tags: normalizeTagsString(row.tags || '')
      };
    });
  }

  images = imtxt.map(it => {
    const id = it.id || it.public_id || '';
    const fallback = imagesCsvMap[id] || {};
    return {
      id: id,
      url: it.url,
      player: it.player || fallback.player || '',
      tags: it.tags || fallback.tags || []
    };
  });

  // collect tags
  const tagSet = new Set();
  images.forEach(img => img.tags.forEach(t => tagSet.add(t)));
  questions.forEach(q => q.tags.forEach(t => tagSet.add(t)));
  availableTags = Array.from(tagSet).sort((a,b)=>a.localeCompare(b));
}

/* ========== UI: tags restricted ========== */
function fillTagSelect(){
  const sel = document.getElementById('tagSelect');
  sel.innerHTML = '';
  // keep allowed tags only if present in availableTags (or All)
  const live = ALLOWED_TAGS.filter(t => t === 'All' || availableTags.some(at => at.toLowerCase() === t.toLowerCase() || at.toLowerCase().includes(t.toLowerCase())));
  live.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', ()=> currentTag = sel.value);
  currentTag = live[0] || 'All';
}

/* ========== GAME FLOW ========== */
function startGame(){
  clearTimers();
  const tag = currentTag;
  let candImgs = images.filter(img => containsTag(img.tags, tag));
  if (candImgs.length === 0) candImgs = images.slice();
  const chosenImage = candImgs[Math.floor(Math.random()*candImgs.length)];
  const chosenQuestions = [];
  for(let d=1; d<=4; d++){
    let pool = questions.filter(q=> q.difficulty===d && containsTag(q.tags, tag));
    if (pool.length===0) pool = questions.filter(q=>q.difficulty===d);
    if (pool.length===0) pool = questions.slice();
    chosenQuestions.push(Object.assign({}, pool[Math.floor(Math.random()*pool.length)]));
  }

  gameState = {
    image: chosenImage,
    questions: chosenQuestions,
    currentIndex: 0,
    blurPct: START_PCT,
    score: 0,
    totalQuestions: chosenQuestions.length,
    timers: {}
  };
  document.getElementById('debug').textContent = `image=${chosenImage.id} player=${chosenImage.player || ''}`;
  document.getElementById('startBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('restartBtn').style.display='none';
  document.getElementById('feedback').textContent='';
  renderImage();
  renderCurrentQuestion();
  updateProgress();
}

/* ========== RENDER IMAGE ========== */
const canvas = document.getElementById('playerCanvas');
const ctx = canvas.getContext('2d');

function drawImageWithEffects(img, blurPct){
  const cw = canvas.width = 600, ch = canvas.height = 600;
  ctx.clearRect(0,0,cw,ch);
  if (!img.width || !img.height) {
    ctx.fillStyle='#222'; ctx.fillRect(0,0,cw,ch); return;
  }
  const iw = img.width, ih = img.height;
  const imgRatio = iw/ih, canvasRatio = cw/ch;
  let dw, dh, dx, dy;
  if (imgRatio > canvasRatio) { dh = ch; dw = dh*imgRatio; dx = -(dw-cw)/2; dy = 0; }
  else { dw = cw; dh = dw/imgRatio; dx = 0; dy = -(dh-ch)/2; }

  const pixelSize = Math.max(1, Math.round(1 + (PIXEL_MAX * (blurPct - MIN_GAME_PCT) / (START_PCT - MIN_GAME_PCT))));
  const blurPx = Math.max(0, (28 * (blurPct / START_PCT))); // strong blur up to ~28px

  const tmp = document.createElement('canvas');
  const tw = Math.max(1, Math.round(dw / pixelSize));
  const th = Math.max(1, Math.round(dh / pixelSize));
  tmp.width = tw; tmp.height = th;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(img, 0,0, img.width, img.height, 0,0, tw, th);
  ctx.imageSmoothingEnabled = false;
  try {
    ctx.save();
    ctx.filter = `blur(${blurPx}px)`;
    ctx.drawImage(tmp, 0,0, tw, th, dx, dy, dw, dh);
    ctx.restore();
  } catch(e){
    ctx.drawImage(tmp, 0,0, tw, th, dx, dy, dw, dh);
  }
}

function renderImage(){
  if (!gameState) return;
  const entry = gameState.image;
  const url = entry.url;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=> { drawImageWithEffects(img, gameState.blurPct); document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`; };
  img.onerror = ()=> {
    ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#999'; ctx.fillText('Image not reachable', 20, 40);
  };
  img.src = url;
}

/* ========== TIMER CIRCLE (double-arc) ========== */
/* We animate two concentric arcs (top yellow, bottom main color).
   The JS updates stroke-dashoffset to simulate disappearance.
*/
const MAIN_ARC = document.getElementById('mainArc');
const TOP_ARC  = document.getElementById('topArc');
const TIMER_LABEL = document.getElementById('timerLabel');
const RING_CIRC = 2 * Math.PI * 18; // r=18 => circumference ~113.097

// helper to set ring colors and animate over duration
let ringAnim = null;
function startRing(durationMs, mainColorGradientId='g1', topDurationFraction=0.6, mainColor='g1') {
  cancelRing();
  // set stroke gradients/classes
  // mainArc uses gradient g1 or g2 depending on mode
  MAIN_ARC.setAttribute('stroke','url(#'+mainColorGradientId+')');
  TOP_ARC.setAttribute('stroke','#facc15'); // yellow stays
  // reset offsets
  MAIN_ARC.style.transition = 'none';
  TOP_ARC.style.transition = 'none';
  MAIN_ARC.setAttribute('stroke-dasharray', String(RING_CIRC));
  TOP_ARC.setAttribute('stroke-dasharray', String(RING_CIRC));
  MAIN_ARC.setAttribute('stroke-dashoffset', '0');
  TOP_ARC.setAttribute('stroke-dashoffset', '0');

  const start = performance.now();
  const topDur = durationMs * (topDurationFraction); // yellow disappears faster
  const mainDur = durationMs;

  function step(now){
    const elapsed = now - start;
    // top arc progress
    const topProgress = Math.min(1, Math.max(0, elapsed / topDur));
    const mainProgress = Math.min(1, Math.max(0, elapsed / mainDur));
    const topOffset = RING_CIRC * topProgress;
    const mainOffset = RING_CIRC * mainProgress;
    TOP_ARC.setAttribute('stroke-dashoffset', String(topOffset));
    MAIN_ARC.setAttribute('stroke-dashoffset', String(mainOffset));
    const remaining = Math.max(0, Math.ceil((durationMs - elapsed)/1000));
    TIMER_LABEL.textContent = remaining>0? `${remaining}s` : '—';
    if (elapsed < durationMs) {
      ringAnim = requestAnimationFrame(step);
    } else {
      TIMER_LABEL.textContent = '—';
      ringAnim = null;
    }
  }
  ringAnim = requestAnimationFrame(step);
}
function cancelRing(){ if (ringAnim) cancelAnimationFrame(ringAnim); ringAnim = null; MAIN_ARC.setAttribute('stroke-dashoffset','0'); TOP_ARC.setAttribute('stroke-dashoffset','0'); TIMER_LABEL.textContent='—'; }

/* ========== Question render + timers (5s reveal, 10s answer) ========== */
function clearTimers(){
  if(!gameState) return;
  const t = gameState.timers;
  if (t.revealTimer) { clearTimeout(t.revealTimer); t.revealTimer=null; }
  if (t.answerTimeout) { clearTimeout(t.answerTimeout); t.answerTimeout=null; }
  if (t.answerInterval) { clearInterval(t.answerInterval); t.answerInterval=null; }
  cancelRing();
  document.getElementById('timerLabel').textContent='—';
}

function renderCurrentQuestion(){
  clearTimers();
  const area = document.getElementById('questionArea');
  area.innerHTML = '';
  if (!gameState) { area.innerHTML = '<div class="small">No game running.</div>'; return; }
  const i = gameState.currentIndex;
  if (i >= gameState.totalQuestions) { renderFinalGuessStage(); return; }

  const q = gameState.questions[i];
  const qdiv = document.createElement('div');
  qdiv.innerHTML = `<div class="small">Question ${i+1}/${gameState.totalQuestions} • difficulty ${q.difficulty}</div>
                    <h3>${escapeHtml(q.question_corps)}</h3>
                    <div class="small" id="preHint">Les réponses arrivent...</div>`;
  area.appendChild(qdiv);

  document.getElementById('nextBtn').style.display='none';
  document.getElementById('restartBtn').style.display='none';
  document.getElementById('feedback').textContent='';

  // start 5s reveal timer ring (red main, yellow top disappears faster)
  // set gradient g1 (red->yellow)
  startRing(5000, 'g1', 0.55, 'g1');
  gameState.timers.revealTimer = setTimeout(()=> {
    // reveal inputs and start 10s answer ring (blue main, yellow top disappears first)
    showAnswerInputs(q);
  }, 5000);
}

function showAnswerInputs(q){
  const area = document.getElementById('questionArea');
  const pre = area.querySelector('#preHint'); if (pre) pre.remove();

  const inputArea = document.createElement('div');
  inputArea.style.marginTop='10px';
  inputArea.id='inputs';

  if (q.question_type === 'qcm'){
    ['a','b','c','d'].forEach(letter=>{
      const text = q['qcm_'+letter];
      if (!text) return;
      const btn = document.createElement('button');
      btn.className='option';
      btn.textContent = `${letter.toUpperCase()}. ${text}`;
      btn.addEventListener('click', ()=> { lockInputs(); evaluateAnswer(letter,q); });
      inputArea.appendChild(btn);
    });
  } else if (q.question_type === 'tf' || (q.true_false && (q.true_false.toLowerCase()==='true' || q.true_false.toLowerCase()==='false'))){
    const t = document.createElement('button'); t.className='option'; t.textContent='True'; t.addEventListener('click', ()=> { lockInputs(); evaluateAnswer('true',q); });
    const f = document.createElement('button'); f.className='option'; f.textContent='False'; f.addEventListener('click', ()=> { lockInputs(); evaluateAnswer('false',q); });
    inputArea.appendChild(t); inputArea.appendChild(f);
  } else {
    const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Tapez votre réponse et Entrée'; inp.style.width='100%';
    inp.addEventListener('keydown', (e)=> { if (e.key === 'Enter') { lockInputs(); evaluateAnswer(inp.value,q); }});
    inputArea.appendChild(inp);
    const submit = document.createElement('button'); submit.className='btn btn-primary'; submit.textContent='Submit';
    submit.style.marginTop='8px'; submit.addEventListener('click', ()=> { lockInputs(); evaluateAnswer(inputArea.querySelector('input').value, q); });
    inputArea.appendChild(submit);
  }
  area.appendChild(inputArea);

  // start answer ring: 10s, main blue (g2), yellow disappears faster
  startRing(10000, 'g2', 0.5, 'g2');
  // answer timeout
  gameState.timers.answerTimeout = setTimeout(()=> { lockInputs(); evaluateAnswer('', q); }, 10000);
}

function lockInputs(){
  const inputs = document.querySelectorAll('#inputs button, #inputs input');
  inputs.forEach(el => el.disabled = true);
  // stop ring animation (we'll keep it static)
  // but we don't cancel it to keep visual state; instead we freeze by canceling animation and leaving dashoffset as-is
  cancelRing();
}

function evaluateAnswer(given, q){
  given = (given||'').toString().trim();
  let ok = false;
  if (q.question_type === 'qcm'){
    const correct = (q.qcm_answer || '').toString().trim().toLowerCase();
    const lettre = (given||'').toString().trim().toLowerCase();
    if (!correct) {
      const givenText = q['qcm_'+lettre];
      if (givenText && q.answer && givenText.trim().toLowerCase() === q.answer.trim().toLowerCase()) ok = true;
      else ok = false;
    } else {
      if (correct === lettre) ok = true;
      if (!ok && ['1','2','3','4'].includes(correct) && ['a','b','c','d'].includes(lettre)) {
        const map = {1:'a',2:'b',3:'c',4:'d'};
        if (map[Number(correct)] === lettre) ok = true;
      }
    }
  } else if (q.question_type === 'tf' || q.true_false) {
    const corr = (q.true_false || q.answer || '').toString().trim().toLowerCase();
    const g = given.toString().trim().toLowerCase();
    if (g === 'true' || g === 't' || g === '1') ok = (corr === 'true' || corr === '1' || corr === 't');
    else if (g === 'false' || g === 'f' || g === '0') ok = (corr === 'false' || corr === '0' || corr === 'f');
    else ok = (g === corr);
  } else {
    ok = openAnswerMatches(q.answer, given, q.open_player);
  }

  const fb = document.getElementById('feedback');
  if (ok){
    fb.innerHTML = `<span class="correct">Correct!</span> — Réponse: <strong>${escapeHtml(q.answer || q.qcm_answer || '')}</strong>`;
    gameState.score += 1;
    const reduction = TOTAL_DEBLUR * (q.difficulty / DIFFICULTY_SUM);
    gameState.blurPct = Math.max(MIN_GAME_PCT, gameState.blurPct - reduction);
    renderImage();
    updateProgress();
  } else {
    fb.innerHTML = `<span class="wrong">Dommage</span> — Réponse: <strong>${escapeHtml(q.answer || q.qcm_answer || '')}</strong>`;
  }

  if (q.true_false_additional && q.true_false_additional.trim()){
    const add = document.createElement('em'); add.className='addinfo'; add.textContent = q.true_false_additional;
    fb.appendChild(add);
  }

  document.getElementById('nextBtn').style.display='inline-block';
  document.getElementById('nextBtn').onclick = ()=> {
    clearTimers();
    gameState.currentIndex++;
    renderCurrentQuestion();
    renderImage();
    updateProgress();
  };
  document.getElementById('restartBtn').style.display='inline-block';
  document.getElementById('restartBtn').onclick = ()=> { clearTimers(); startGame(); };
}

/* ========== FINAL GUESS ========== */
function renderFinalGuessStage(){
  clearTimers();
  const area = document.getElementById('questionArea');
  area.innerHTML = '';
  const title = document.createElement('div');
  title.innerHTML = `<h3>Dernière étape — Devine le joueur</h3><div class="small">Tape le nom complet ou le nom de famille (12s).</div>`;
  area.appendChild(title);

  const box = document.createElement('div'); box.className='final-guess';
  const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Ex: Novak Djokovic ou Djokovic'; inp.style.flex='1';
  const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Guess';
  box.appendChild(inp); box.appendChild(btn);
  area.appendChild(box);

  // timer ring 12s (use g1 orange/blue choice but let's use g2 color)
  startRing(12000, 'g2', 0.5, 'g2');
  gameState.timers.answerTimeout = setTimeout(()=> { evaluateFinalGuess('', false); }, 12000);

  btn.onclick = ()=> { clearTimers(); evaluateFinalGuess(inp.value, true); };
}

function evaluateFinalGuess(given, userTriggered){
  const fb = document.getElementById('feedback');
  const imageEntry = gameState.image;
  // get player name from manifest first, else from images.csv mapping
  const playerName = (imageEntry.player || imagesCsvMap[imageEntry.id] && imagesCsvMap[imageEntry.id].player || '').trim();
  const idFallback = imageEntry.id || '';
  let ok = false;
  if (!playerName) {
    ok = given && idFallback.toLowerCase().includes(given.trim().toLowerCase());
  } else {
    const gn = (given||'').trim().toLowerCase();
    if (!gn) ok = false;
    else {
      const last = playerName.split(' ').slice(-1)[0].toLowerCase();
      if (gn === playerName.toLowerCase() || gn === last) ok = true;
      else ok = openAnswerMatches(playerName, given, true);
    }
  }

  if (ok){
    fb.innerHTML = `<span class="correct">Bravo !</span> — C'était <strong>${escapeHtml(playerName || idFallback)}</strong>.`;
    gameState.blurPct = FINAL_REVEAL_PCT; // show fully revealed
    renderImage();
  } else {
    fb.innerHTML = `<span class="wrong">Dommage</span> — C'était <strong>${escapeHtml(playerName || idFallback)}</strong>.`;
    gameState.blurPct = FINAL_REVEAL_PCT;
    renderImage();
  }

  document.getElementById('restartBtn').style.display='inline-block';
  document.getElementById('restartBtn').onclick = ()=> startGame();
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('timerLabel').textContent = '—';
}

/* ========== PROGRESS + HELPERS ========== */
function updateProgress(){
  const fill = document.getElementById('progressFill');
  if (!gameState) { fill.style.width='0%'; return; }
  const percentDone = (gameState.currentIndex / gameState.totalQuestions) * 100;
  fill.style.width = percentDone + '%';
  document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`;
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ========== INIT ========== */
(async function init(){
  try {
    await loadData();
    fillTagSelect();
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('dataDebug').textContent = `Questions: ${questions.length} • Images: ${images.length}`;
    // initial placeholder canvas
    ctx.fillStyle = '#071026'; ctx.fillRect(0,0,canvas.width,canvas.height);
  } catch (err){
    console.error(err);
    document.getElementById('dataDebug').textContent = 'Erreur chargement: '+ String(err);
  }
})();
</script>

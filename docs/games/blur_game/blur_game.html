<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tennis Guess — Blur Game (révisé)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0f172a;
    --card:#0b1220;
    --muted:#94a3b8;
    --accent:#06b6d4;
    --accent-2:#7c3aed;
    --glass: rgba(255,255,255,0.04);
    --card-shadow: 0 6px 20px rgba(2,6,23,0.6);
    --radius:14px;
    --option-bg: #f7fafc;
    --option-text: #0b1220;
    --correct-bg: #b7f5c1;
    --wrong-bg: #ffb4b4;
    --btn-color: #2563eb;
  }
  html,body{height:100%; margin:0; background: linear-gradient(180deg,#071028 0%, #081427 60%); color:#e6eef6; font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  .wrap{max-width:1100px; margin:36px auto; padding:20px;}
  header{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
  h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-0.6px;}
  .subtitle{color:var(--muted); font-size:13px;}
  .grid{display:grid; grid-template-columns:420px 1fr; gap:20px;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:16px; border-radius:var(--radius); box-shadow:var(--card-shadow); border:1px solid rgba(255,255,255,0.03);}
  .controls{display:flex; gap:12px; align-items:center;}
  select, button, input[type=text]{font-family:inherit; font-size:14px;}
  select{background:var(--glass); color:var(--muted); border:1px solid rgba(255,255,255,0.04); padding:8px 10px; border-radius:10px;}
  .btn{background:transparent; color:#e6eef6; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05); cursor:pointer;}
  .btn-primary{background:var(--btn-color); color:white; border:none; box-shadow:0 6px 18px rgba(10,40,90,0.18);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.04);}
  .left-col{display:flex; flex-direction:column; gap:12px;}
  canvas{width:100%; height:auto; border-radius:10px; background:linear-gradient(180deg,#111827,#0b1220); display:block; border:1px solid rgba(255,255,255,0.02);}
  .progress{height:10px; background:rgba(255,255,255,0.03); border-radius:999px; overflow:hidden;}
  .progress > div{height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); width:0%;}
  .meta{display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px;}
  .question-area{min-height:220px;}
  h3{margin:6px 0 8px 0;}
  .option{
    display:block;
    margin:8px 0;
    padding:12px;
    border-radius:10px;
    background:var(--option-bg);
    color:var(--option-text);
    border:1px solid rgba(12,18,28,0.06);
    cursor:pointer;
    text-align:left;
    font-weight:600;
  }
  .option:hover{transform:translateY(-2px); transition:transform .15s;}
  .option:disabled{opacity:0.7; cursor:not-allowed; transform:none;}
  .option.correct-opt{ background: var(--correct-bg); color: var(--option-text); border-color: rgba(0,0,0,0.06); }
  .option.wrong-opt{ background: var(--wrong-bg); color: var(--option-text); border-color: rgba(0,0,0,0.06); }

  .small{font-size:13px; color:var(--muted);}
  .feedback{margin-top:10px; font-size:14px;}
  .correct{color:#8ef69c;}
  .wrong{color:#ffb4b4;}
  em.addinfo{display:block; margin-top:8px; color:#0b1220; font-style:italic; background:#dbeafe; padding:8px; border-radius:8px;}
  .footer-debug{margin-top:14px; color:var(--muted); font-size:13px;}
  .timer-wrap{display:flex; align-items:center; gap:12px; margin-left:12px;}
  .ring{width:44px; height:44px; position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);}
  .final-guess{display:flex; gap:8px; margin-top:8px; align-items:center;}
  table.summary{width:100%; border-collapse:collapse; margin-top:12px;}
  table.summary th, table.summary td{padding:8px 6px; border-bottom:1px solid rgba(255,255,255,0.03); font-size:13px; color:var(--muted);}  
  table.summary th{color:#e6eef6; text-align:left;}
  .ok-text{color:#1b8f36; font-weight:700;}
  .bad-text{color:#c53030; font-weight:700;}
  @media (max-width:920px){ .grid{grid-template-columns:1fr;} .left-col{order:0} .card{padding:12px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tennis Guess — Blur Game</h1>
      <div class="subtitle">Answer 4 progressively harder questions. Then guess the blurred player!</div>
    </div>
  </header>

  <div class="grid">
    <div class="card left-col">
      <canvas id="playerCanvas" width="600" height="600"></canvas>
      <div class="progress"><div id="progressFill"></div></div>
      <div class="meta">
        <div class="small" id="blurMeta">Blur: --%</div>
        <div class="small" id="debug"></div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="controls">
          <label class="small">Theme
            <select id="tagSelect"><option>Loading...</option></select>
          </label>
          <button id="startBtn" class="btn btn-primary">Start Game</button>
          <div style="width:6px"></div>
          <div class="timer-wrap" title="Timer">
            <div id="timerRing" class="ring" aria-hidden="true">
              <svg width="44" height="44" viewBox="0 0 44 44">
                <defs>
                  <linearGradient id="g1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#facc15"/></linearGradient>
                  <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#facc15"/></linearGradient>
                </defs>
                <circle r="18" cx="22" cy="22" stroke="rgba(255,255,255,0.06)" stroke-width="6" fill="none"></circle>
                <circle id="mainArc" r="18" cx="22" cy="22" stroke="url(#g1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="113.097" stroke-dashoffset="0"></circle>
                <circle id="topArc" r="18" cx="22" cy="22" stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="113.097" stroke-dashoffset="0"></circle>
              </svg>
              <div class="label" id="timerLabel">—</div>
            </div>
          </div>
        </div>
      </div>

      <hr style="border:none; height:1px; background:rgba(255,255,255,0.02); margin:12px 0;">

      <div class="question-area" id="questionArea">
        <div class="small">Select a tag and Press <strong>Start</strong>.</div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="nextBtn" class="btn btn-primary" style="display:none">Next question</button>
        <button id="restartBtn" class="btn btn-ghost" style="display:none">Restart</button>
      </div>

      <div class="footer-debug small" id="dataDebug"></div>
    </div>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
const QUESTIONS_CSV = './questions.csv';
const IMAGES_MANIFEST_JSON = './images_manifest.json';
const IMAGES_CSV = './images.csv';

// START / MIN blur values adjusted per request
const START_PCT = 150; // starting blur % when no correct answers
const MIN_GAME_PCT = 20; // minimum blur %
const PIXEL_MAX = 60;

// Only these 4 themes are shown
const STATIC_TAGS = ['All','ATP','WTA','Player name'];

// reductions by difficulty (direct subtraction when question answered correctly)
const BLUR_REDUCTIONS = { 1:20, 2:33, 3:50, 4:70 };

/* ========== STATE ========== */
let questions = [];
let images = [];
let imagesCsvMap = {};
let availableTags = [];
let currentTag = 'All';
let gameState = null;

const PLAYERS_CSV = './players_list.csv';
const PLAYERS_RANKS_JSON = './players_ranks.json';
let players = [];

/* ========== HELPERS ========== */
function slugify(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-_]/g,''); }
function normalizeTagsString(s) { if(!s) return []; return s.split(',').map(x=>x.trim()).filter(Boolean); }
function containsTag(tagsArray, wantedTag) {
  if (!wantedTag || wantedTag === 'All') return true;
  const wt = wantedTag.toLowerCase();
  return tagsArray.some(t => t.toLowerCase() === wt || t.toLowerCase().includes(wt));
}
function levenshtein(a,b){
  const m=a.length,n=b.length; if(m===0) return n; if(n===0) return m;
  const dp=Array(m+1).fill().map(()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
    else dp[i][j]=1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  }
  return dp[m][n];
}
function openAnswerMatches(correct,given,acceptNameVariants=false){
  if(!correct) return false;
  const a=(correct||'').trim().toLowerCase(), b=(given||'').trim().toLowerCase();
  if(!b) return false;
  if(a===b) return true;
  if(a.includes(b) || b.includes(a)) return true;
  if(acceptNameVariants){
    const last=a.split(' ').slice(-1)[0];
    if(last && last===b) return true;
  }
  const maxLen=Math.max(a.length,b.length), threshold=Math.max(1, Math.floor(maxLen*0.2));
  return levenshtein(a,b) <= threshold;
}

/* Validate player full name contains only letters and spaces (accents allowed) */
function isAlphaOnlyName(name){
  if(!name) return false;
  return /^[A-Za-zÀ-ÖØ-öø-ÿ\s]+$/u.test(name.trim());
}

/* ========== DATA LOAD ========== */
async function loadData(){
  // questions
  const qtxt = await fetch(QUESTIONS_CSV).then(r=>r.ok? r.text(): Promise.reject('questions.csv not found'));
  const qres = Papa.parse(qtxt,{header:true,skipEmptyLines:true});
  questions = qres.data.map(r=>({
    id:(r.id||'').trim(),
    question_type:(r.question_type||'').trim().toLowerCase(),
    question_corps:(r.question_corps||'').trim(),
    qcm_a:(r.qcm_a||'').trim(),
    qcm_b:(r.qcm_b||'').trim(),
    qcm_c:(r.qcm_c||'').trim(),
    qcm_d:(r.qcm_d||'').trim(),
    qcm_answer:(r.qcm_answer||'').trim(),
    answer:(r.answer||'').trim(),
    true_false:(r.true_false||'').trim(),
    difficulty:Number(r.difficulty)||1,
    open_player:String((r.open_player||'')).toLowerCase()==='true',
    true_false_additional:(r.true_false_additional||'').trim(),
    tags: normalizeTagsString(r.tags || r.tag || '')
  }));

  // images manifest + images.csv fallback
  const imtxt = await fetch(IMAGES_MANIFEST_JSON).then(r=> r.ok? r.json(): Promise.reject('images_manifest.json not found'));
  const csvtxt = await fetch(IMAGES_CSV).then(r=> r.ok? r.text(): '');
  imagesCsvMap = {};
  if(csvtxt){
    const imcsv = Papa.parse(csvtxt, {header:true, skipEmptyLines:true}).data;
    imcsv.forEach(row => { const id=(row.id||'').trim(); imagesCsvMap[id]={player:(row.player||'').trim(), tags:normalizeTagsString(row.tags||'')}; });
  }
  images = imtxt.map(it => {
    const id = it.id || it.public_id || '';
    const fallback = imagesCsvMap[id] || {};
    return { id:id, url: it.url, player: it.player || fallback.player || '', tags: it.tags || fallback.tags || [] };
  });

  // players list (optional) — filter to alpha-only names
  try {
    const playersCsvText = await fetch(PLAYERS_CSV).then(r => r.ok ? r.text() : Promise.reject('players_list.csv not found'));
    const playersParsed = Papa.parse(playersCsvText, { header: true, skipEmptyLines: true }).data || [];
    let ranksMap = {};
    try { ranksMap = await fetch(PLAYERS_RANKS_JSON).then(r => r.ok ? r.json() : {}); } catch(e){ ranksMap = {}; }
    players = playersParsed.map(row => {
      const id = (row.id || row.player_id || '').toString().trim();
      return {
        player_id: id || slugify((row.player_name || '').toString()),
        full_name: (row.player_name || '').toString().trim(),
        circuit: (row.circuit || '').toString().trim(),
        rank: (ranksMap && ranksMap[id] !== undefined) ? ranksMap[id] : (row.rank ? Number(row.rank) : null)
      };
    }).filter(p => p.full_name && p.full_name.length>0 && isAlphaOnlyName(p.full_name));
  } catch (err) {
    console.warn('Could not load players CSV/JSON:', String(err));
    players = [];
  }

  // collect tags from images & questions (kept for internal use, but not shown)
  const tagSet = new Set();
  images.forEach(img=> img.tags.forEach(t=>tagSet.add(t)));
  questions.forEach(q=> q.tags.forEach(t=> tagSet.add(t)));
  availableTags = Array.from(tagSet).sort((a,b)=>a.localeCompare(b));
}

/* ========== UI: fill select ONLY with STATIC_TAGS ========== */
function fillTagSelect(){
  const sel=document.getElementById('tagSelect'); sel.innerHTML='';
  // Only include the fixed list requested (All, ATP, WTA, Player name)
  STATIC_TAGS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', ()=> currentTag = sel.value);
  currentTag = sel.value || 'All';
}

/* ========== GENERATED QUESTIONS HELPERS (ANAGRAM / MASKED-alt) ========== */
// pick random player with optional maxRank filter (used to restrict to top 100)
function pickRandomPlayerForTag(tag, maxRank = Infinity){
  let pool = [];
  const lt = (tag||'').toLowerCase();
  if(lt.includes('wta')) pool = players.filter(p => p.circuit && p.circuit.toUpperCase() === 'WTA');
  else if(lt.includes('atp')) pool = players.filter(p => p.circuit && p.circuit.toUpperCase() === 'ATP');
  else pool = players.slice();
  pool = pool.filter(p => p && p.full_name && p.full_name.trim().length>0 && isAlphaOnlyName(p.full_name));
  // apply maxRank constraint if provided
  pool = pool.filter(p => {
    const r = Number(p.rank);
    if(!isFinite(r) || isNaN(r)) return false;
    return r <= maxRank;
  });
  if(pool.length === 0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

// difficulty mapping changed per request
function difficultyFromRank(player){
  const rank = Number(player.rank);
  if(!isFinite(rank) || isNaN(rank)) return 4;
  if(rank <= 10) return 1;
  if(rank <= 20) return 2;
  if(rank <= 50) return 3;
  if(rank <= 100) return 4;
  return 4; // fallback
}

function shuffleWord(word){
  const letters = word.split('');
  for(let i=letters.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  if(letters.join('') === word && letters.length > 1){
    for(let t=0;t<5;t++){
      for(let i=letters.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [letters[i], letters[j]] = [letters[j], letters[i]];
      }
      if(letters.join('') !== word) break;
    }
  }
  return letters.join('');
}

function generateAnagram(fullName){
  const words = fullName.toLowerCase().split(' ').filter(Boolean);
  const an = words.map(w => shuffleWord(w));
  if(words.length >= 2 && Math.random() < 0.25) an.reverse();
  return an.join(' ');
}

// Replace approximately 1/3 of letters (excluding first letter), chosen randomly — not necessarily alternating
function generateMaskedAlternate(fullName){
  return fullName.toLowerCase().split(' ').map(word => {
    const letters = word.split('');
    // collect indices eligible for replacement (letters only, exclude first)
    const eligible = [];
    for(let i=1;i<letters.length;i++){
      if(/[a-zà-ÿ]/i.test(letters[i])) eligible.push(i);
    }
    const toReplaceCount = Math.max(1, Math.round(eligible.length / 3));
    // randomly pick unique indices to replace
    const chosen = new Set();
    while(chosen.size < toReplaceCount && chosen.size < eligible.length){
      const pick = eligible[Math.floor(Math.random()*eligible.length)];
      chosen.add(pick);
    }
    return letters.map((ch, idx) => chosen.has(idx) ? '-' : ch).join('');
  }).join(' ');
}

function makeGeneratedQuestion(tag){
  if(!players || players.length === 0) return null;
  // requirement: only players with rank <= 100
  const player = pickRandomPlayerForTag(tag, 100);
  if(!player) return null;
  const full = player.full_name;
  const difficulty = difficultyFromRank(player);
  if(Math.random() < 0.5){
    const an = generateAnagram(full);
    return {
      id: `gen-anagram-${player.player_id || Math.random().toString(36).slice(2,8)}`,
      question_type: 'open',
      question_corps: `Find the player whose anagram is: ${an}`,
      qcm_a:'', qcm_b:'', qcm_c:'', qcm_d:'', qcm_answer:'',
      answer: full,
      true_false: '',
      difficulty: difficulty,
      open_player: true,
      tags: [player.circuit || 'All']
    };
  } else {
    const masked = generateMaskedAlternate(full);
    return {
      id: `gen-masked-${player.player_id || Math.random().toString(36).slice(2,8)}`,
      question_type: 'open',
      question_corps: `Find the player from whom some letters have been removed: ${masked}`,
      qcm_a:'', qcm_b:'', qcm_c:'', qcm_d:'', qcm_answer:'',
      answer: full,
      true_false: '',
      difficulty: difficulty,
      open_player: true,
      tags: [player.circuit || 'All']
    };
  }
}

/* ========== GAME FLOW ========== */
function startGame(){
  clearTimers();
  const tag = currentTag || 'All';
  let candImgs = images.filter(img => containsTag(img.tags, tag));
  if(candImgs.length===0) candImgs = images.slice();
  if(candImgs.length === 0){
    document.getElementById('dataDebug').textContent = 'No images available in manifest.';
    return;
  }
  const chosenImage = candImgs[Math.floor(Math.random()*candImgs.length)];

  const chosenQuestions = [];
  const isPlayerTheme = (tag || '').toLowerCase().includes('player');

  if(isPlayerTheme && players.length > 0){
    for(let i=0;i<4;i++){
      const gen = makeGeneratedQuestion(tag);
      if(gen) chosenQuestions.push(gen);
      else {
        const rand = questions[Math.floor(Math.random()*questions.length)];
        chosenQuestions.push(Object.assign({}, rand));
      }
    }
  } else {
    for(let d=1; d<=4; d++){
      let pool = questions.filter(q=> q.difficulty===d && containsTag(q.tags, tag));
      if(pool.length===0) pool = questions.filter(q=> q.difficulty===d);
      if(pool.length===0) pool = questions.slice();
      chosenQuestions.push(Object.assign({}, pool[Math.floor(Math.random()*pool.length)]));
    }
    if(Math.random() < 0.25 && players.length > 0){
      const gen = makeGeneratedQuestion(tag);
      if(gen){
        const idx = Math.floor(Math.random()*chosenQuestions.length);
        chosenQuestions[idx] = gen;
      }
    }
  }

  gameState = {
    image: chosenImage,
    questions: chosenQuestions,
    currentIndex:0,
    blurPct: START_PCT,
    score:0,
    totalQuestions: chosenQuestions.length,
    timers:{},
    answers: [],
    preloadedImg: null
  };

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    gameState.preloadedImg = img;
    drawImageWithEffects(img, gameState.blurPct);
    document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`;
  };
  img.onerror = () => {
    gameState.preloadedImg = null;
    const canvas = document.getElementById('playerCanvas'), ctx = canvas.getContext('2d');
    ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#999'; ctx.fillText('Image not reachable',20,40);
  };
  img.src = chosenImage.url;

  document.getElementById('startBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('restartBtn').style.display='none';
  document.getElementById('feedback').textContent='';
  renderCurrentQuestion();
  updateProgress();
}

/* ========== remainder: image render, timers, question flow, evaluation, final guess, summary, helpers, init ========== */
const canvas = document.getElementById('playerCanvas'), ctx = canvas.getContext('2d');
function drawImageWithEffects(img, blurPct){
  const cw = canvas.width = 600, ch = canvas.height = 600;
  ctx.clearRect(0,0,cw,ch);
  if(!img || !img.width || !img.height){ ctx.fillStyle='#222'; ctx.fillRect(0,0,cw,ch); return; }
  const iw=img.width, ih=img.height; const imgRatio=iw/ih, canvasRatio=cw/ch;
  let dw,dh,dx,dy;
  if(imgRatio>canvasRatio){ dh=ch; dw=dh*imgRatio; dx=-(dw-cw)/2; dy=0; } else { dw=cw; dh=dw/imgRatio; dx=0; dy=-(dh-ch)/2; }
  const pixelSize = Math.max(1, Math.round(1 + (PIXEL_MAX * (blurPct - MIN_GAME_PCT) / (START_PCT - MIN_GAME_PCT))));
  const blurPx = Math.max(0, (28 * (blurPct / START_PCT)));
  const tmp = document.createElement('canvas'); const tw=Math.max(1,Math.round(dw/pixelSize)), th=Math.max(1, Math.round(dh/pixelSize));
  tmp.width=tw; tmp.height=th; const tctx=tmp.getContext('2d');
  tctx.drawImage(img, 0,0, img.width, img.height, 0,0, tw, th);
  ctx.imageSmoothingEnabled=false;
  try { ctx.save(); ctx.filter=`blur(${blurPx}px)`; ctx.drawImage(tmp,0,0,tw,th,dx,dy,dw,dh); ctx.restore(); }
  catch(e){ ctx.drawImage(tmp,0,0,tw,th,dx,dy,dw,dh); }
}
function renderImage(){
  if(!gameState) return;
  const entry = gameState.image;
  if(gameState.preloadedImg){
    drawImageWithEffects(gameState.preloadedImg, gameState.blurPct);
    document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`;
    return;
  }
  const url = entry.url;
  const img = new Image(); img.crossOrigin='anonymous';
  img.onload = ()=> { drawImageWithEffects(img, gameState.blurPct); document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`; };
  img.onerror = ()=> { ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#999'; ctx.fillText('Image not reachable',20,40); };
  img.src = url;
}

const MAIN_ARC = document.getElementById('mainArc'), TOP_ARC = document.getElementById('topArc'), TIMER_LABEL = document.getElementById('timerLabel');
const RING_CIRC = 2 * Math.PI * 18;
let ringAnim = null;
function startRing(durationMs, mainColorGradientId='g1', topDurationFraction=0.6) {
  cancelRing();
  MAIN_ARC.setAttribute('stroke','url(#'+mainColorGradientId+')');
  TOP_ARC.setAttribute('stroke','#facc15');
  MAIN_ARC.style.transition='none'; TOP_ARC.style.transition='none';
  MAIN_ARC.setAttribute('stroke-dasharray', String(RING_CIRC));
  TOP_ARC.setAttribute('stroke-dasharray', String(RING_CIRC));
  MAIN_ARC.setAttribute('stroke-dashoffset','0'); TOP_ARC.setAttribute('stroke-dashoffset','0');
  const start = performance.now();
  const topDur = durationMs * topDurationFraction;
  function step(now){
    const elapsed = now - start;
    const topP = Math.min(1, Math.max(0, elapsed / topDur));
    const mainP = Math.min(1, Math.max(0, elapsed / durationMs));
    TOP_ARC.setAttribute('stroke-dashoffset', String(RING_CIRC * topP));
    MAIN_ARC.setAttribute('stroke-dashoffset', String(RING_CIRC * mainP));
    const remaining = Math.max(0, Math.ceil((durationMs - elapsed)/1000));
    TIMER_LABEL.textContent = remaining>0? `${remaining}s` : '—';
    if (elapsed < durationMs) { ringAnim = requestAnimationFrame(step); } else { TIMER_LABEL.textContent='—'; ringAnim=null; }
  }
  ringAnim = requestAnimationFrame(step);
}
function cancelRing(){ if(ringAnim) cancelAnimationFrame(ringAnim); ringAnim=null; MAIN_ARC.setAttribute('stroke-dashoffset','0'); TOP_ARC.setAttribute('stroke-dashoffset','0'); TIMER_LABEL.textContent='—'; }

function clearTimers(){
  if(!gameState) return;
  const t = gameState.timers || {};
  if(t.revealTimer){ clearTimeout(t.revealTimer); t.revealTimer=null; }
  if(t.answerTimeout){ clearTimeout(t.answerTimeout); t.answerTimeout=null; }
  if(t.answerInterval){ clearInterval(t.answerInterval); t.answerInterval=null; }
  cancelRing();
  TIMER_LABEL.textContent='—';
}

function renderCurrentQuestion(){
  clearTimers();
  const area = document.getElementById('questionArea'); area.innerHTML='';
  if(!gameState){ area.innerHTML='<div class="small">No game running.</div>'; return; }
  const i = gameState.currentIndex;
  if(i >= gameState.totalQuestions){ renderFinalGuessStage(); return; }
  const q = gameState.questions[i];
  const qdiv = document.createElement('div');
  qdiv.innerHTML = `<div class="small">Question ${i+1}/${gameState.totalQuestions} • difficulty ${q.difficulty}</div>
                    <h3>${escapeHtml(q.question_corps)}</h3>
                    <div class="small" id="preHint">Answers are coming...</div>`;
  area.appendChild(qdiv);
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('restartBtn').style.display='none';
  document.getElementById('feedback').textContent='';

  renderImage();

  // doubled the delay before showing inputs (was 5s -> now 10s)
  startRing(5000,'g1',0.55);
  gameState.timers.revealTimer = setTimeout(()=> { showAnswerInputs(q); }, 5000);
}

function showAnswerInputs(q){
  const area = document.getElementById('questionArea'); const pre = area.querySelector('#preHint'); if(pre) pre.remove();
  const inputArea = document.createElement('div'); inputArea.style.marginTop='10px'; inputArea.id='inputs';

  if(q.question_type === 'qcm'){
    ['a','b','c','d'].forEach(letter=>{
      const text = q['qcm_'+letter];
      if(!text) return;
      const btn = document.createElement('button'); btn.className='option'; btn.textContent = `${letter.toUpperCase()}. ${text}`;
      btn.dataset.letter = letter;
      btn.addEventListener('click', ()=> { lockInputs(); evaluateAnswer(letter, q); });
      inputArea.appendChild(btn);
    });
  } else if (q.question_type === 'tf' || (q.true_false && (q.true_false.toLowerCase()==='true' || q.true_false.toLowerCase()==='false'))){
    const t = document.createElement('button'); t.className='option'; t.textContent='True'; t.dataset.value='true'; t.addEventListener('click', ()=> { lockInputs(); evaluateAnswer('true', q); });
    const f = document.createElement('button'); f.className='option'; f.textContent='False'; f.dataset.value='false'; f.addEventListener('click', ()=> { lockInputs(); evaluateAnswer('false', q); });
    inputArea.appendChild(t); inputArea.appendChild(f);
  } else {
    const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Write your answer'; inp.style.width='100%'; inp.id='openInput';
    inp.addEventListener('keydown', (e)=> { if(e.key==='Enter'){ lockInputs(); evaluateAnswer(inp.value, q); }});
    setTimeout(()=> inp.focus(), 20);
    inputArea.appendChild(inp);
    const submit = document.createElement('button'); submit.className='btn btn-primary'; submit.textContent='Submit';
    submit.style.marginTop='8px'; submit.addEventListener('click', ()=> { lockInputs(); evaluateAnswer(inputArea.querySelector('input').value, q); });
    inputArea.appendChild(submit);
  }
  area.appendChild(inputArea);

  // doubled answer time (was 10s -> now 20s)
  startRing(20000,'g2',0.5);
  if(!gameState.timers) gameState.timers = {};
  gameState.timers.answerTimeout = setTimeout(()=> { lockInputs(); evaluateAnswer('', q); }, 20000);
}

function lockInputs(){
  const inputs = document.querySelectorAll('#inputs button, #inputs input');
  inputs.forEach(el => el.disabled = true);
  if(gameState && gameState.timers){
    if(gameState.timers.answerTimeout){ clearTimeout(gameState.timers.answerTimeout); gameState.timers.answerTimeout=null; }
    if(gameState.timers.answerInterval){ clearInterval(gameState.timers.answerInterval); gameState.timers.answerInterval=null; }
    if(gameState.timers.revealTimer){ clearTimeout(gameState.timers.revealTimer); gameState.timers.revealTimer=null; }
  }
  cancelRing();
}

function evaluateAnswer(given, q){
  clearTimers();
  given = (given||'').toString().trim();
  let ok = false;
  let userAnswerLabel = given;
  if(q.question_type === 'qcm'){
    const correct = (q.qcm_answer || '').toString().trim().toLowerCase();
    const lettre = (given||'').toString().trim().toLowerCase();
    if(!correct){
      const givenText = q['qcm_'+lettre];
      if(givenText && q.answer && givenText.trim().toLowerCase() === q.answer.trim().toLowerCase()) ok=true;
      else ok=false;
    } else {
      if(correct === lettre) ok=true;
      if(!ok && ['1','2','3','4'].includes(correct) && ['a','b','c','d'].includes(lettre)){
        const map={1:'a',2:'b',3:'c',4:'d'};
        if(map[Number(correct)]===lettre) ok=true;
      }
    }
    if(lettre) { userAnswerLabel = q['qcm_'+lettre] || lettre; }
  } else if (q.question_type === 'tf' || q.true_false) {
    const corr = (q.true_false || q.answer || '').toString().trim().toLowerCase();
    const corrNormalized = (corr === '1' || corr === 'true' || corr === 't') ? 'true' : 'false';
    const g = given.toString().trim().toLowerCase();
    if(g === 'true' || g === 't' || g === '1') ok = (corrNormalized === 'true');
    else if(g === 'false' || g === 'f' || g === '0') ok = (corrNormalized === 'false');
    else ok = (g === corrNormalized);
    userAnswerLabel = given || '(no answer)';
  } else {
    ok = openAnswerMatches(q.answer, given, q.open_player);
    userAnswerLabel = given || '(no answer)';
  }

  gameState.answers.push({
    id: q.id,
    question: q.question_corps,
    difficulty: q.difficulty,
    userAnswer: userAnswerLabel,
    correctAnswer: deriveCorrectAnswerLabel(q),
    correct: ok
  });

  const fb = document.getElementById('feedback');
  if(ok){
    fb.innerHTML = `<span class="correct">Correct!</span> — Answer: <strong>${escapeHtml(deriveCorrectAnswerLabel(q))}</strong>`;
    gameState.score += 1;
    // use fixed reductions per difficulty (requested behaviour)
    const reduction = BLUR_REDUCTIONS[q.difficulty] || 0;
    gameState.blurPct = Math.max(MIN_GAME_PCT, gameState.blurPct - reduction);
    renderImage();
    updateProgress();
  } else {
    fb.innerHTML = `<span class="wrong">Too bad!</span> — Answer: <strong>${escapeHtml(deriveCorrectAnswerLabel(q))}</strong>`;
  }

  if(q.true_false_additional && q.true_false_additional.trim()){
    const add = document.createElement('em'); add.className='addinfo'; add.textContent = q.true_false_additional;
    fb.appendChild(add);
  }

  highlightOptionsAfterAnswer(q, userAnswerLabel);

  document.getElementById('nextBtn').style.display='inline-block';
  document.getElementById('nextBtn').onclick = ()=> {
    clearTimers();
    gameState.currentIndex++;
    renderCurrentQuestion();
    renderImage();
    updateProgress();
  };
  document.getElementById('restartBtn').style.display='inline-block';
  document.getElementById('restartBtn').onclick = ()=> { clearTimers(); startGame(); };
}

function deriveCorrectAnswerLabel(q){
  if(q.question_type==='qcm'){
    const correct = (q.qcm_answer || '').toString().trim().toLowerCase();
    if(['a','b','c','d'].includes(correct)) return q['qcm_'+correct] || correct;
    if(['1','2','3','4'].includes(correct)){
      const map={1:'a',2:'b',3:'c',4:'d'}; return q['qcm_'+map[Number(correct)]] || correct;
    }
    return q.answer || '';
  } else if(q.question_type==='tf' || q.true_false) {
    const cand = (q.true_false || q.answer || '').toString().trim().toLowerCase();
    return (cand === '1' || cand === 'true' || cand === 't') ? 'True' : 'False';
  } else {
    return q.answer || '';
  }
}

function highlightOptionsAfterAnswer(q, userAnswerLabel){
  const container = document.getElementById('inputs');
  if(!container) return;
  if(q.question_type === 'qcm'){
    const buttons = container.querySelectorAll('button.option');
    const correctLetterRaw = (q.qcm_answer||'').toString().trim().toLowerCase();
    let correctLetter = '';
    if(['a','b','c','d'].includes(correctLetterRaw)) correctLetter = correctLetterRaw;
    else if(['1','2','3','4'].includes(correctLetterRaw)){ const map={1:'a',2:'b',3:'c',4:'d'}; correctLetter = map[Number(correctLetterRaw)]; }
    buttons.forEach(btn=>{
      const letter = btn.dataset.letter || '';
      if(letter && letter === correctLetter){
        btn.classList.add('correct-opt');
      } else {
        btn.classList.add('wrong-opt');
      }
      btn.disabled = true;
    });
  } else if (q.question_type === 'tf' || q.true_false){
    const tfButtons = container.querySelectorAll('button.option');
    if(tfButtons.length>0){
      const corr = (q.true_false || q.answer || '').toString().trim().toLowerCase();
      const corrNormalized = (corr === '1' || corr === 'true' || corr === 't') ? 'true' : 'false';
      tfButtons.forEach(btn=> {
        const val = (btn.dataset.value || btn.textContent || '').toString().trim().toLowerCase();
        if(val === corrNormalized) btn.classList.add('correct-opt'); else btn.classList.add('wrong-opt');
        btn.disabled = true;
      });
    }
  } else {
    const inp = container.querySelector('input');
    if(inp) inp.disabled = true;
  }
}

function renderFinalGuessStage(){
  clearTimers();
  const area = document.getElementById('questionArea'); area.innerHTML = '';
  const title = document.createElement('div'); title.innerHTML = `<h3>Last step — Guess the blurred player</h3><div class="small">Type full name or last name (24s).</div>`;
  area.appendChild(title);

  const box = document.createElement('div'); box.className='final-guess';
  const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Ex: Novak Djokovic or Djokovic'; inp.style.flex='1';
  inp.id = 'finalGuessInput';
  const btn = document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Guess';
  box.appendChild(inp); box.appendChild(btn); area.appendChild(box);

  setTimeout(()=> inp.focus(), 20);
  inp.addEventListener('keydown', (e)=> { if(e.key === 'Enter'){ e.preventDefault(); clearTimers(); evaluateFinalGuess(inp.value, true); }});

  // doubled final guess time (was 12s -> now 24s)
  startRing(24000,'g2',0.5);
  if(!gameState.timers) gameState.timers = {};
  gameState.timers.answerTimeout = setTimeout(()=> { evaluateFinalGuess('', false); }, 24000);

  btn.onclick = ()=> { clearTimers(); evaluateFinalGuess(inp.value, true); };
}

function evaluateFinalGuess(given, userTriggered){
  clearTimers();
  const fb=document.getElementById('feedback');
  const imageEntry = gameState.image;
  const playerName = (imageEntry.player || imagesCsvMap[imageEntry.id] && imagesCsvMap[imageEntry.id].player || '').trim();
  const idFallback = imageEntry.id || '';
  let ok=false;
  if(!playerName){
    ok = given && idFallback.toLowerCase().includes(given.trim().toLowerCase());
  } else {
    const gn=(given||'').trim().toLowerCase();
    if(!gn) ok=false;
    else {
      const last = playerName.split(' ').slice(-1)[0].toLowerCase();
      if(gn === playerName.toLowerCase() || gn === last) ok=true;
      else ok = openAnswerMatches(playerName, given, true);
    }
  }

  gameState.finalGuess = { given: given || '(no answer)', player: playerName || idFallback, correct: ok };

  if(ok){
    fb.innerHTML = `<span class="correct">Congrats !</span> — It was <strong>${escapeHtml(playerName || idFallback)}</strong>.`;
    gameState.blurPct = MIN_GAME_PCT;
    renderImage();
  } else {
    fb.innerHTML = `<span class="wrong">No!</span> — It was <strong>${escapeHtml(playerName || idFallback)}</strong>.`;
    gameState.blurPct = MIN_GAME_PCT;
    renderImage();
  }

  setTimeout(()=> { showSummary(); }, 400);
}

function showSummary(){
  const area = document.getElementById('questionArea'); area.innerHTML = '<h3>Résumé / Score</h3>';
  const tbl = document.createElement('table'); tbl.className='summary';
  const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>Question</th><th>Your answer</th><th>Correct</th><th>Diff</th></tr>'; tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  let weightedCorrect = 0;
  let weightedTotal = 0;
  gameState.answers.forEach(a=>{
    weightedTotal += a.difficulty;
    if(a.correct) weightedCorrect += a.difficulty;
    const tr = document.createElement('tr');
    const userCell = `<span class="${a.correct ? 'ok-text' : 'bad-text'}">${escapeHtml(a.userAnswer)}</span>`;
    const corrCell = escapeHtml(a.correctAnswer);
    tr.innerHTML = `<td>${escapeHtml(a.question)}</td>
                    <td>${userCell}</td>
                    <td>${corrCell}</td>
                    <td>${a.difficulty}</td>`;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  area.appendChild(tbl);

  const percent = weightedTotal ? Math.round((weightedCorrect/weightedTotal)*100) : 0;
  const scoreDiv = document.createElement('div'); scoreDiv.style.marginTop='12px';
  scoreDiv.innerHTML = `<div class="small">Weighted score: <strong>${weightedCorrect} / ${weightedTotal}</strong> (${percent}%)</div>
                        <div class="small">Final guess: <strong>${escapeHtml(gameState.finalGuess.player)}</strong> — ${gameState.finalGuess.correct ? 'Correct' : 'Wrong'}</div>`;
  area.appendChild(scoreDiv);

  document.getElementById('restartBtn').style.display='inline-block';
  document.getElementById('restartBtn').onclick = ()=> startGame();
  document.getElementById('nextBtn').style.display='none';
}

function updateProgress(){ const fill=document.getElementById('progressFill'); if(!gameState){ fill.style.width='0%'; return;} const percentDone = (gameState.currentIndex / gameState.totalQuestions) * 100; fill.style.width = percentDone + '%'; document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`; }
function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ========== INIT ========== */
(async function init(){
  try {
    await loadData();
    fillTagSelect();
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('dataDebug').textContent = `Questions: ${questions.length} • Images: ${images.length} • Players list: ${players.length}`;
    ctx.fillStyle = '#071026'; ctx.fillRect(0,0,canvas.width,canvas.height);
  } catch(err){
    console.error(err);
    document.getElementById('dataDebug').textContent = 'Loading failure: ' + String(err);
  }
})();
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tennis Guess — Blur Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  /* Styles identiques/compatibles à ta version, avec petits ajustements optionnels */
  :root{
    --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --accent:#06b6d4; --accent-2:#7c3aed;
    --glass: rgba(255,255,255,0.04); --card-shadow:0 6px 20px rgba(2,6,23,0.6); --radius:14px;
    --option-bg:#f7fafc; --option-text:#0b1220; --correct-bg:#b7f5c1; --wrong-bg:#ffb4b4;
    --btn-color:#2563eb;
  }
  html,body{height:100%; margin:0; background: linear-gradient(180deg,#071028 0%, #081427 60%); color:#e6eef6; font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;}
  .wrap{max-width:1100px; margin:36px auto; padding:20px;}
  header{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
  h1{margin:0; font-size:22px; font-weight:800;}
  .subtitle{color:var(--muted); font-size:13px;}
  .grid{display:grid; grid-template-columns:420px 1fr; gap:20px;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:16px; border-radius:var(--radius); box-shadow:var(--card-shadow); border:1px solid rgba(255,255,255,0.03);}
  .controls{display:flex; gap:12px; align-items:center;}
  select, button, input[type=text]{font-family:inherit; font-size:14px;}
  select{background:var(--glass); color:var(--muted); border-radius:10px; padding:8px;}
  .btn{padding:8px 12px; border-radius:10px; cursor:pointer;}
  .btn-primary{background:var(--btn-color); color:white; border:none;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.04);}
  canvas{width:100%; border-radius:10px; background:linear-gradient(180deg,#111827,#0b1220); display:block;}
  .option{display:block; margin:8px 0; padding:12px; border-radius:10px; background:var(--option-bg); color:var(--option-text); cursor:pointer; font-weight:600; border:1px solid rgba(12,18,28,0.06);}
  .option:disabled{opacity:0.7; cursor:not-allowed;}
  .option.correct-opt{ background: var(--correct-bg); }
  .option.wrong-opt{ background: var(--wrong-bg); }
  .small{font-size:13px; color:var(--muted);}
  .feedback{margin-top:10px; font-size:14px;}
  em.addinfo{display:block; margin-top:8px; color:#0b1220; font-style:italic; background:#dbeafe; padding:8px; border-radius:8px;}
  table.summary{width:100%; border-collapse:collapse; margin-top:12px;}
  table.summary th, table.summary td{padding:8px 6px; border-bottom:1px solid rgba(255,255,255,0.03); font-size:13px; color:var(--muted);}
  table.summary th{color:#e6eef6; text-align:left;}
  .timer-wrap{display:flex; align-items:center; gap:12px;}
  .ring{width:44px; height:44px; position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted);}
  @media (max-width:920px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tennis Guess — Blur Game</h1>
      <div class="subtitle">Answer 4 progressively harder questions. Then guess the blurred player!</div>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <canvas id="playerCanvas" width="600" height="600"></canvas>
      <div style="height:10px;background:rgba(255,255,255,0.03);border-radius:999px;margin-top:10px;overflow:hidden;"><div id="progressFill" style="height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#06b6d4)"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;"><div class="small" id="blurMeta">Blur: --%</div><div class="small" id="debug"></div></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="controls">
          <label class="small">Theme
            <select id="tagSelect"><option>Loading...</option></select>
          </label>
          <button id="startBtn" class="btn btn-primary">Start Game</button>
          <div class="timer-wrap" title="Timer">
            <div id="timerRing" class="ring" aria-hidden="true">
              <svg width="44" height="44" viewBox="0 0 44 44">
                <defs>
                  <linearGradient id="g1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#facc15"/></linearGradient>
                  <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#facc15"/></linearGradient>
                </defs>
                <circle r="18" cx="22" cy="22" stroke="rgba(255,255,255,0.06)" stroke-width="6" fill="none"></circle>
                <circle id="mainArc" r="18" cx="22" cy="22" stroke="url(#g1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="113.097" stroke-dashoffset="0"></circle>
                <circle id="topArc" r="18" cx="22" cy="22" stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="113.097" stroke-dashoffset="0"></circle>
              </svg>
              <div class="label" id="timerLabel">—</div>
            </div>
          </div>
        </div>
      </div>

      <hr style="border:none;height:1px;background:rgba(255,255,255,0.02);margin:12px 0">

      <div id="questionArea" class="question-area"><div class="small">Select a tag and Press <strong>Start</strong>.</div></div>
      <div id="feedback" class="feedback"></div>

      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="nextBtn" class="btn btn-primary" style="display:none">Next question</button>
        <button id="restartBtn" class="btn btn-ghost" style="display:none">Restart</button>
      </div>

      <div id="dataDebug" class="small" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<script>
/* ========== Configuration & state ========== */
const QUESTIONS_CSV = '/games/blur_game/questions.csv';
const IMAGES_MANIFEST_JSON = '/games/blur_game/images_manifest.json';
const IMAGES_CSV = '/games/blur_game/images.csv'; // fallback for player name if manifest missing
const WTA_CSV = '/player_data_wta.csv';
const ATP_CSV = '/player_data_atp.csv';

const START_PCT = 220, MIN_GAME_PCT = 33, FINAL_REVEAL_PCT = 0;
const DIFFICULTY_SUM = 10, TOTAL_DEBLUR = START_PCT - MIN_GAME_PCT, PIXEL_MAX = 60;
const ALLOWED_TAGS = ['All','ATP','WTA'];

let questions = [], images = [], imagesCsvMap = {}, availableTags = [], currentTag='All';
let gameState = null;
let wtaPlayers = [], atpPlayers = [];

/* ========== Simple utils ========= */
function normalizeTagsString(s){ if(!s) return []; return s.split(',').map(x=>x.trim()).filter(Boolean); }
function containsTag(tagsArray, wantedTag){ if(!wantedTag || wantedTag==='All') return true; const wt=wantedTag.toLowerCase(); return tagsArray.some(t=>t.toLowerCase()===wt || t.toLowerCase().includes(wt)); }
function levenshtein(a,b){ const m=a.length,n=b.length; if(m===0) return n; if(n===0) return m; const dp=Array(m+1).fill().map(()=>Array(n+1).fill(0)); for(let i=0;i<=m;i++) dp[i][0]=i; for(let j=0;j<=n;j++) dp[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){ if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1]; else dp[i][j]=1+Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]); } return dp[m][n]; }
function openAnswerMatches(correct,given,acceptNameVariants=false){ if(!correct) return false; const a=(correct||'').trim().toLowerCase(), b=(given||'').trim().toLowerCase(); if(!b) return false; if(a===b) return true; if(a.includes(b) || b.includes(a)) return true; if(acceptNameVariants){ const last=a.split(' ').slice(-1)[0]; if(last && last===b) return true; } const maxLen=Math.max(a.length,b.length); const thr=Math.max(1,Math.floor(maxLen*0.2)); return levenshtein(a,b) <= thr; }

/* ========== Load CSVs: questions, manifest, images.csv, player_data_* ========= */
async function loadData(){
  // questions.csv
  const qtxt = await fetch(QUESTIONS_CSV).then(r=>r.ok? r.text(): Promise.reject('questions.csv not found'));
  const qres = Papa.parse(qtxt,{header:true,skipEmptyLines:true});
  questions = qres.data.map(r=>({
    id:(r.id||'').trim(),
    question_type:(r.question_type||'').trim().toLowerCase(),
    question_corps:(r.question_corps||'').trim(),
    qcm_a:(r.qcm_a||'').trim(),
    qcm_b:(r.qcm_b||'').trim(),
    qcm_c:(r.qcm_c||'').trim(),
    qcm_d:(r.qcm_d||'').trim(),
    qcm_answer:(r.qcm_answer||'').trim(),
    answer:(r.answer||'').trim(),
    true_false:(r.true_false||'').trim(),
    difficulty: Number(r.difficulty) || 1,
    open_player: String((r.open_player||'')).toLowerCase()==='true',
    true_false_additional:(r.true_false_additional||'').trim(),
    tags: normalizeTagsString(r.tags || r.tag || '')
  }));

  // images manifest
  const imtxt = await fetch(IMAGES_MANIFEST_JSON).then(r=> r.ok? r.json(): Promise.reject('images_manifest.json not found'));
  // images.csv fallback
  const csvtxt = await fetch(IMAGES_CSV).then(r=> r.ok? r.text(): '');
  imagesCsvMap = {};
  if(csvtxt){
    const imcsv = Papa.parse(csvtxt,{header:true,skipEmptyLines:true}).data;
    imcsv.forEach(row => { const id=(row.id||'').trim(); imagesCsvMap[id] = { player:(row.player||'').trim(), tags: normalizeTagsString(row.tags || '') }; });
  }
  images = imtxt.map(it => {
    const id = it.id || it.public_id || '';
    const fallback = imagesCsvMap[id] || {};
    return { id:id, url: it.url, player: it.player || fallback.player || '', tags: it.tags || fallback.tags || [] };
  });

  // load player_data_wta + atp
  try {
    const wtaTxt = await fetch(WTA_CSV).then(r => r.ok ? r.text() : '');
    if(wtaTxt){
      const wtaParsed = Papa.parse(wtaTxt, { header:true, skipEmptyLines:true }).data;
      wtaPlayers = wtaParsed.map(r => ({
        full_name: (r.full_name || r.fullname || '').trim(),
        player_id: (r.player_id || '').toString().trim(),
        best_rank: parseFloat(r.best_rank || r.bestrank || r.best_rank || '') || NaN,
        source: 'WTA'
      })).filter(x => x.full_name);
    }
  } catch(e){ console.warn('WTA load failed', e); }

  try {
    const atpTxt = await fetch(ATP_CSV).then(r => r.ok ? r.text() : '');
    if(atpTxt){
      const atpParsed = Papa.parse(atpTxt, { header:true, skipEmptyLines:true }).data;
      atpPlayers = atpParsed.map(r => ({
        full_name: (r.full_name || r.fullname || r.fullname || '').trim(),
        player_id: (r.player_id || r.playerid || '').toString().trim(),
        highest_ranking: parseFloat(r.highest_ranking || r.highest_ranking || r.highest_ranking || r.highest_ranking) || parseFloat(r.highest_ranking) || NaN,
        source: 'ATP'
      })).filter(x => x.full_name);
      // Some ATP CSVs use "highest_ranking" or "highest_ranking" etc. We attempted parse; if NaN leave NaN.
    }
  } catch(e){ console.warn('ATP load failed', e); }

  // collect tags
  const tagSet = new Set();
  images.forEach(img => img.tags.forEach(t => tagSet.add(t)));
  questions.forEach(q => q.tags.forEach(t => tagSet.add(t)));
  availableTags = Array.from(tagSet).sort((a,b)=>a.localeCompare(b));
}

/* ========== UI: tags restricted ========== */
function fillTagSelect(){
  const sel = document.getElementById('tagSelect'); sel.innerHTML = '';
  const live = ALLOWED_TAGS.filter(t => t==='All' || availableTags.some(at => at.toLowerCase()===t.toLowerCase() || at.toLowerCase().includes(t.toLowerCase())));
  live.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; sel.appendChild(opt); });
  sel.addEventListener('change', ()=> currentTag = sel.value);
  currentTag = live[0] || 'All';
}

/* ========== GENERATED QUESTIONS: helpers ========== */
function pickRandomPlayerForTag(tag){
  // tag 'WTA' -> pick from wtaPlayers; 'ATP' -> atpPlayers; 'All' choose randomly across both
  let pool = [];
  if(tag === 'WTA') pool = wtaPlayers.slice();
  else if(tag === 'ATP') pool = atpPlayers.slice();
  else pool = wtaPlayers.concat(atpPlayers);
  if(pool.length === 0) pool = wtaPlayers.concat(atpPlayers);
  if(pool.length === 0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function difficultyFromRank(player){
  // player may have best_rank (WTA) or highest_ranking (ATP)
  const rank = (player.best_rank !== undefined ? player.best_rank : player.highest_ranking);
  const r = Number(rank);
  if(!isFinite(r) || isNaN(r)) return 4;
  if(r <= 10) return 1;
  if(r <= 50) return 2;
  if(r <= 150) return 3;
  return 4;
}
function shuffleStringPreserveSpaces(s){
  // shuffle letters within each word, keep word boundaries
  return s.split(' ').map(word => {
    const letters = word.split('');
    // shuffle with Fisher-Yates until different from original (limit attempts)
    for(let t=0;t<10;t++){
      for(let i=letters.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [letters[i], letters[j]] = [letters[j], letters[i]];
      }
      if(letters.join('') !== word) break;
    }
    return letters.join('');
  }).join(' ');
}
function generateAnagram(fullName){
  // produce an anagram that preserves word boundaries: shuffle letters within first and last separately,
  // then maybe shuffle the order of words occasionally to produce variety, but keep simple.
  const words = fullName.split(' ').filter(Boolean);
  const an = words.map(w => shuffleStringPreserveSpaces(w)); // shuffle inside
  // occasionally swap first/last
  if(words.length >= 2 && Math.random() < 0.3) an.reverse();
  return an.join(' ');
}
function generateMasked(fullName, difficulty){
  // create masked pattern like "D_r_a  _a_s_t_i_a" where more letters hidden when difficulty higher
  // Determine reveal fraction: level1 -> reveal 60%, level2->50%, level3->40%, level4->30%
  const revealByLevel = {1:0.6,2:0.5,3:0.4,4:0.32};
  const revealFrac = revealByLevel[difficulty] || 0.35;
  return fullName.split(' ').map(word => {
    const letters = word.split('');
    // Always reveal first char, then reveal some positions according to revealFrac
    const out = letters.map((ch, idx) => {
      if(idx === 0) return ch; // keep first letter
      // if char is not letter (hyphen etc) keep
      if(!/[A-Za-zÀ-ÿ]/.test(ch)) return ch;
      const probReveal = revealFrac;
      return (Math.random() < probReveal) ? ch : '_';
    });
    return out.join('');
  }).join(' ');
}
function makeGeneratedQuestion(tag){
  const player = pickRandomPlayerForTag(tag);
  if(!player) return null;
  const full = player.full_name;
  const difficulty = difficultyFromRank(player);
  // choose type randomly
  const type = Math.random() < 0.5 ? 'generated_anagram' : 'generated_masked';
  if(type === 'generated_anagram'){
    return {
      id: `gen-anagram-${player.player_id || Math.random().toString(36).slice(2,8)}`,
      question_type: 'anagram',
      question_corps: `Find the player from this anagram: ${generateAnagram(full)}`,
      answer: full,
      difficulty: difficulty,
      tags: [player.source]
    };
  } else {
    return {
      id: `gen-mask-${player.player_id || Math.random().toString(36).slice(2,8)}`,
      question_type: 'masked',
      question_corps: `Guess the player from this pattern: ${generateMasked(full, difficulty)}`,
      answer: full,
      difficulty: difficulty,
      tags: [player.source]
    };
  }
}

/* ========== GAME FLOW (modification: inject generated question with prob 1/4) ========== */
function startGame(){
  clearTimers();
  const tag = currentTag;
  // choose candidate images
  let candImgs = images.filter(img => containsTag(img.tags, tag));
  if(candImgs.length === 0) candImgs = images.slice();
  const chosenImage = candImgs[Math.floor(Math.random()*candImgs.length)];

  // choose 4 questions as before, prefer tag
  const chosenQuestions = [];
  for(let d=1; d<=4; d++){
    let pool = questions.filter(q => q.difficulty === d && containsTag(q.tags, tag));
    if(pool.length === 0) pool = questions.filter(q => q.difficulty === d);
    if(pool.length === 0) pool = questions.slice();
    const pick = pool[Math.floor(Math.random()*pool.length)];
    chosenQuestions.push(Object.assign({}, pick));
  }

  // decide to include a generated question with prob 1/4, and at most 1
  if(Math.random() < 1){
    const gen = makeGeneratedQuestion(tag);
    if(gen){
      // replace a random index among 0..3
      const idx = Math.floor(Math.random()*chosenQuestions.length);
      chosenQuestions[idx] = gen;
    }
  }

  gameState = {
    image: chosenImage,
    questions: chosenQuestions,
    currentIndex: 0,
    blurPct: START_PCT,
    score: 0,
    totalQuestions: chosenQuestions.length,
    timers: {},
    answers: []
  };

  document.getElementById('startBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('restartBtn').style.display='none';
  document.getElementById('feedback').textContent='';
  renderImage();
  renderCurrentQuestion();
  updateProgress();
}

/* ========== RENDER / TIMER / EVAL (reuse existing logic but add handling for generated types) ========== */
const canvas = document.getElementById('playerCanvas');
const ctx = canvas.getContext('2d');

function drawImageWithEffects(img, blurPct){
  const cw = canvas.width = 600, ch = canvas.height = 600;
  ctx.clearRect(0,0,cw,ch);
  if(!img.width || !img.height){ ctx.fillStyle='#222'; ctx.fillRect(0,0,cw,ch); return; }
  const iw=img.width, ih=img.height, imgRatio=iw/ih, canvasRatio=cw/ch;
  let dw,dh,dx,dy;
  if(imgRatio>canvasRatio){ dh=ch; dw=dh*imgRatio; dx=-(dw-cw)/2; dy=0; } else { dw=cw; dh=dw/imgRatio; dx=0; dy=-(dh-ch)/2; }
  const pixelSize = Math.max(1, Math.round(1 + (PIXEL_MAX * (blurPct - MIN_GAME_PCT) / (START_PCT - MIN_GAME_PCT))));
  const blurPx = Math.max(0, 28 * (blurPct / START_PCT));
  const tmp = document.createElement('canvas'); const tw = Math.max(1, Math.round(dw/pixelSize)), th = Math.max(1, Math.round(dh/pixelSize));
  tmp.width = tw; tmp.height = th; const tctx = tmp.getContext('2d');
  tctx.drawImage(img, 0,0, img.width, img.height, 0,0, tw, th);
  ctx.imageSmoothingEnabled = false;
  try { ctx.save(); ctx.filter = `blur(${blurPx}px)`; ctx.drawImage(tmp,0,0,tw,th,dx,dy,dw,dh); ctx.restore(); }
  catch(e){ ctx.drawImage(tmp,0,0,tw,th,dx,dy,dw,dh); }
}
function renderImage(){
  if(!gameState) return;
  const url = gameState.image.url;
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = ()=> { drawImageWithEffects(img, gameState.blurPct); document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`; };
  img.onerror = ()=> { ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#999'; ctx.fillText('Image not reachable',20,40); };
  img.src = url;
}

/* Timer ring utilities (same as before) */
const MAIN_ARC = document.getElementById('mainArc'), TOP_ARC = document.getElementById('topArc'), TIMER_LABEL = document.getElementById('timerLabel');
const RING_CIRC = 2 * Math.PI * 18; let ringAnim = null;
function startRing(durationMs, mainColorGradientId='g1', topDurationFraction=0.6){
  if(ringAnim) cancelAnimationFrame(ringAnim);
  MAIN_ARC.setAttribute('stroke','url(#'+mainColorGradientId+')'); TOP_ARC.setAttribute('stroke','#facc15');
  MAIN_ARC.style.transition='none'; TOP_ARC.style.transition='none';
  MAIN_ARC.setAttribute('stroke-dasharray', String(RING_CIRC)); TOP_ARC.setAttribute('stroke-dasharray', String(RING_CIRC));
  MAIN_ARC.setAttribute('stroke-dashoffset','0'); TOP_ARC.setAttribute('stroke-dashoffset','0');
  const start = performance.now(); const topDur = durationMs * topDurationFraction;
  function step(now){
    const elapsed = now - start;
    const topP = Math.min(1, Math.max(0, elapsed / topDur));
    const mainP = Math.min(1, Math.max(0, elapsed / durationMs));
    TOP_ARC.setAttribute('stroke-dashoffset', String(RING_CIRC * topP));
    MAIN_ARC.setAttribute('stroke-dashoffset', String(RING_CIRC * mainP));
    const remaining = Math.max(0, Math.ceil((durationMs - elapsed)/1000));
    TIMER_LABEL.textContent = remaining>0? `${remaining}s` : '—';
    if(elapsed < durationMs) ringAnim = requestAnimationFrame(step); else { TIMER_LABEL.textContent='—'; ringAnim=null; }
  }
  ringAnim = requestAnimationFrame(step);
}
function cancelRing(){ if(ringAnim) cancelAnimationFrame(ringAnim); ringAnim=null; MAIN_ARC.setAttribute('stroke-dashoffset','0'); TOP_ARC.setAttribute('stroke-dashoffset','0'); TIMER_LABEL.textContent='—'; }

function clearTimers(){
  if(!gameState) return;
  const t=gameState.timers;
  if(t.revealTimer){ clearTimeout(t.revealTimer); t.revealTimer=null; }
  if(t.answerTimeout){ clearTimeout(t.answerTimeout); t.answerTimeout=null; }
  if(t.answerInterval){ clearInterval(t.answerInterval); t.answerInterval=null; }
  cancelRing(); TIMER_LABEL.textContent='—';
}

/* Render question & inputs (handles generated types as open) */
function renderCurrentQuestion(){
  clearTimers();
  const area = document.getElementById('questionArea'); area.innerHTML='';
  if(!gameState){ area.innerHTML='<div class="small">No game running.</div>'; return; }
  const i = gameState.currentIndex; if(i >= gameState.totalQuestions){ renderFinalGuessStage(); return; }
  const q = gameState.questions[i];
  const qdiv = document.createElement('div');
  qdiv.innerHTML = `<div class="small">Question ${i+1}/${gameState.totalQuestions} • difficulty ${q.difficulty}</div><h3>${escapeHtml(q.question_corps)}</h3><div class="small" id="preHint">Answers are coming...</div>`;
  area.appendChild(qdiv);
  document.getElementById('nextBtn').style.display='none'; document.getElementById('restartBtn').style.display='none'; document.getElementById('feedback').textContent='';
  // 5s reveal (red/yellow)
  startRing(5000,'g1',0.55);
  gameState.timers.revealTimer = setTimeout(()=> showAnswerInputs(q), 5000);
}

function showAnswerInputs(q){
  const area = document.getElementById('questionArea'); const pre = area.querySelector('#preHint'); if(pre) pre.remove();
  const inputArea = document.createElement('div'); inputArea.style.marginTop='10px'; inputArea.id='inputs';

  // treat generated types (anagram/masked) as open questions with an input
  if(q.question_type === 'qcm'){
    ['a','b','c','d'].forEach(letter => {
      const text = q['qcm_'+letter]; if(!text) return;
      const btn = document.createElement('button'); btn.className='option'; btn.textContent = `${letter.toUpperCase()}. ${text}`; btn.dataset.letter=letter;
      btn.addEventListener('click', ()=> { lockInputs(); evaluateAnswer(letter, q); });
      inputArea.appendChild(btn);
    });
  } else if(q.question_type === 'tf' || (q.true_false && (q.true_false.toLowerCase()==='true' || q.true_false.toLowerCase()==='false'))){
    const t = document.createElement('button'); t.className='option'; t.textContent='True'; t.dataset.value='true'; t.addEventListener('click', ()=> { lockInputs(); evaluateAnswer('true', q); });
    const f = document.createElement('button'); f.className='option'; f.textContent='False'; f.dataset.value='false'; f.addEventListener('click', ()=> { lockInputs(); evaluateAnswer('false', q); });
    inputArea.appendChild(t); inputArea.appendChild(f);
  } else {
    // open / generated_anagram / generated_masked are treated here
    const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Type your answer (full name or last name)'; inp.style.width='100%'; inp.id='openInput';
    setTimeout(()=> inp.focus(), 20); // autofocus so user can type without clicking
    inp.addEventListener('keydown', (e)=> { if(e.key==='Enter'){ lockInputs(); evaluateAnswer(inp.value, q); }});
    inputArea.appendChild(inp);
    const submit = document.createElement('button'); submit.className='btn btn-primary'; submit.textContent='Submit';
    submit.style.marginTop='8px'; submit.addEventListener('click', ()=> { lockInputs(); evaluateAnswer(inputArea.querySelector('input').value, q); });
    inputArea.appendChild(submit);
  }
  area.appendChild(inputArea);
  // 10s answer ring (blue/yellow)
  startRing(10000,'g2',0.5);
  gameState.timers.answerTimeout = setTimeout(()=> { lockInputs(); evaluateAnswer('', q); }, 10000);
}

function lockInputs(){
  const inputs = document.querySelectorAll('#inputs button, #inputs input');
  inputs.forEach(el => el.disabled = true);
  if(gameState && gameState.timers){
    if(gameState.timers.answerTimeout){ clearTimeout(gameState.timers.answerTimeout); gameState.timers.answerTimeout=null; }
    if(gameState.timers.revealTimer){ clearTimeout(gameState.timers.revealTimer); gameState.timers.revealTimer=null; }
    if(gameState.timers.answerInterval){ clearInterval(gameState.timers.answerInterval); gameState.timers.answerInterval=null; }
  }
  cancelRing();
}

/* Evaluate answer (works for generated types) */
function evaluateAnswer(given, q){
  // ensure no later timeouts change state
  clearTimers();
  given = (given||'').toString().trim();
  let ok = false;
  let userAnswerLabel = given;
  if(q.question_type === 'qcm'){
    const correct = (q.qcm_answer || '').toString().trim().toLowerCase();
    const lettre = (given||'').toString().trim().toLowerCase();
    if(!correct){
      const givenText = q['qcm_'+lettre]; if(givenText && q.answer && givenText.trim().toLowerCase() === q.answer.trim().toLowerCase()) ok=true; else ok=false;
    } else {
      if(correct === lettre) ok=true;
      if(!ok && ['1','2','3','4'].includes(correct) && ['a','b','c','d'].includes(lettre)){ const map={1:'a',2:'b',3:'c',4:'d'}; if(map[Number(correct)]===lettre) ok=true; }
    }
    if(lettre) userAnswerLabel = q['qcm_'+lettre] || lettre;
  } else if (q.question_type === 'tf' || q.true_false) {
    const corr = (q.true_false || q.answer || '').toString().trim().toLowerCase();
    const g = given.toString().trim().toLowerCase();
    if(g === 'true' || g === 't' || g === '1') ok = (corr === 'true' || corr === '1' || corr === 't');
    else if(g === 'false' || g === 'f' || g === '0') ok = (corr === 'false' || corr === '0' || corr === 'f');
    else ok = (g === corr);
    userAnswerLabel = given || '(no answer)';
  } else {
    // open OR generated types (anagram/masked) -> require matching full name OR last name (we accept both)
    ok = openAnswerMatches(q.answer, given, true);
    userAnswerLabel = given || '(no answer)';
  }

  // store answer
  gameState.answers.push({
    id: q.id,
    question: q.question_corps,
    difficulty: q.difficulty,
    userAnswer: userAnswerLabel,
    correctAnswer: deriveCorrectAnswerLabel(q),
    correct: ok
  });

  // feedback & blur
  const fb = document.getElementById('feedback');
  if(ok){
    fb.innerHTML = `<span style="color:#8ef69c">Correct!</span> — Answer: <strong>${escapeHtml(deriveCorrectAnswerLabel(q))}</strong>`;
    gameState.score += 1;
    const reduction = TOTAL_DEBLUR * (q.difficulty / DIFFICULTY_SUM);
    gameState.blurPct = Math.max(MIN_GAME_PCT, gameState.blurPct - reduction);
    renderImage(); updateProgress();
  } else {
    fb.innerHTML = `<span style="color:#ffb4b4">Too bad!</span> — Answer: <strong>${escapeHtml(deriveCorrectAnswerLabel(q))}</strong>`;
  }
  if(q.true_false_additional && q.true_false_additional.trim()){
    const add=document.createElement('em'); add.className='addinfo'; add.textContent = q.true_false_additional; fb.appendChild(add);
  }

  // highlight choices for QCM / TF
  highlightOptionsAfterAnswer(q, userAnswerLabel);

  document.getElementById('nextBtn').style.display='inline-block';
  document.getElementById('nextBtn').onclick = ()=> { clearTimers(); gameState.currentIndex++; renderCurrentQuestion(); renderImage(); updateProgress(); };
  document.getElementById('restartBtn').style.display='inline-block';
  document.getElementById('restartBtn').onclick = ()=> { clearTimers(); startGame(); };
}

function deriveCorrectAnswerLabel(q){
  if(q.question_type==='qcm'){
    const correct = (q.qcm_answer||'').toString().trim().toLowerCase();
    if(['a','b','c','d'].includes(correct)) return q['qcm_'+correct] || correct;
    if(['1','2','3','4'].includes(correct)){ const map={1:'a',2:'b',3:'c',4:'d'}; return q['qcm_'+map[Number(correct)]] || correct; }
    return q.answer || '';
  } else if(q.question_type==='tf' || q.true_false){ return (q.true_false || q.answer || '').toString(); }
  else return q.answer || '';
}

function highlightOptionsAfterAnswer(q, userAnswerLabel){
  const container = document.getElementById('inputs'); if(!container) return;
  const buttons = container.querySelectorAll('button.option');
  if(buttons.length>0){
    const correctLetterRaw = (q.qcm_answer || '').toString().trim().toLowerCase();
    let correctLetter = '';
    if(['a','b','c','d'].includes(correctLetterRaw)) correctLetter = correctLetterRaw;
    else if(['1','2','3','4'].includes(correctLetterRaw)){ const map={1:'a',2:'b',3:'c',4:'d'}; correctLetter = map[Number(correctLetterRaw)]; }
    buttons.forEach(btn=>{
      const letter = btn.dataset.letter || '';
      if(letter && letter === correctLetter) btn.classList.add('correct-opt'); else btn.classList.add('wrong-opt');
      btn.disabled = true;
    });
  } else {
    // TF case: two buttons
    const tfButtons = container.querySelectorAll('button.option');
    if(tfButtons.length>0){
      const corr = (q.true_false || q.answer || '').toString().trim().toLowerCase();
      tfButtons.forEach(btn=> {
        const val = (btn.dataset.value || btn.textContent || '').toString().trim().toLowerCase();
        if(val === corr) btn.classList.add('correct-opt'); else btn.classList.add('wrong-opt');
        btn.disabled = true;
      });
    }
  }
}

/* ========== FINAL GUESS & SUMMARY ========== */
function renderFinalGuessStage(){
  clearTimers();
  const area = document.getElementById('questionArea'); area.innerHTML='';
  const title=document.createElement('div'); title.innerHTML='<h3>Last step — Guess the blurred player</h3><div class="small">Type full name or last name (12s).</div>'; area.appendChild(title);
  const box=document.createElement('div'); box.className='final-guess';
  const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Ex: Novak Djokovic or Djokovic'; inp.style.flex='1';
  const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Guess'; box.appendChild(inp); box.appendChild(btn); area.appendChild(box);
  startRing(12000,'g2',0.5);
  if(!gameState.timers) gameState.timers={};
  gameState.timers.answerTimeout = setTimeout(()=> { evaluateFinalGuess('', false); }, 12000);
  btn.onclick = ()=> { clearTimers(); evaluateFinalGuess(inp.value, true); };
}

function evaluateFinalGuess(given, userTriggered){
  clearTimers();
  const fb = document.getElementById('feedback');
  const img = gameState.image;
  const playerName = (img.player || imagesCsvMap[img.id] && imagesCsvMap[img.id].player || '').trim();
  const idFallback = img.id || '';
  let ok=false;
  if(!playerName) ok = given && idFallback.toLowerCase().includes(given.trim().toLowerCase());
  else {
    const gn=(given||'').trim().toLowerCase();
    if(!gn) ok=false;
    else {
      const last = playerName.split(' ').slice(-1)[0].toLowerCase();
      if(gn === playerName.toLowerCase() || gn === last) ok=true; else ok = openAnswerMatches(playerName, given, true);
    }
  }
  gameState.finalGuess = { given: given || '(no answer)', player: playerName || idFallback, correct: ok };
  if(ok){ fb.innerHTML = `<span style="color:#8ef69c">Congrats !</span> — It was <strong>${escapeHtml(playerName || idFallback)}</strong>.`; gameState.blurPct = FINAL_REVEAL_PCT; renderImage(); }
  else { fb.innerHTML = `<span style="color:#ffb4b4">No!</span> — It was <strong>${escapeHtml(playerName || idFallback)}</strong>.`; gameState.blurPct = FINAL_REVEAL_PCT; renderImage(); }
  setTimeout(()=> showSummary(), 400);
}

function showSummary(){
  const area = document.getElementById('questionArea'); area.innerHTML = '<h3>Résumé / Score</h3>';
  const tbl = document.createElement('table'); tbl.className='summary';
  const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>Question</th><th>Your answer</th><th>Correct</th><th>Diff</th></tr>'; tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  let weightedCorrect = 0, weightedTotal = 0;
  gameState.answers.forEach(a => {
    weightedTotal += a.difficulty;
    if(a.correct) weightedCorrect += a.difficulty;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(a.question)}</td><td>${escapeHtml(a.userAnswer)}</td><td>${escapeHtml(a.correctAnswer)}</td><td>${a.difficulty}</td>`;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody); area.appendChild(tbl);
  const percent = weightedTotal ? Math.round((weightedCorrect/weightedTotal)*100) : 0;
  const scoreDiv = document.createElement('div'); scoreDiv.style.marginTop='12px';
  scoreDiv.innerHTML = `<div class="small">Weighted score: <strong>${weightedCorrect} / ${weightedTotal}</strong> (${percent}%)</div>
                        <div class="small">Final guess: <strong>${escapeHtml(gameState.finalGuess.player)}</strong> — ${gameState.finalGuess.correct ? 'Correct' : 'Wrong'}</div>`;
  area.appendChild(scoreDiv);
  document.getElementById('restartBtn').style.display='inline-block';
  document.getElementById('restartBtn').onclick = ()=> startGame();
  document.getElementById('nextBtn').style.display='none';
}

/* ========== Helpers ========== */
function updateProgress(){ const fill=document.getElementById('progressFill'); if(!gameState){ fill.style.width='0%'; return; } const percentDone = (gameState.currentIndex / gameState.totalQuestions) * 100; fill.style.width = percentDone + '%'; document.getElementById('blurMeta').textContent = `Blur: ${Math.round(gameState.blurPct)}%`; }
function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ========== Init ========== */
(async function init(){
  try {
    await loadData();
    fillTagSelect();
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('dataDebug').textContent = `Questions: ${questions.length} • Images: ${images.length} • WTA: ${wtaPlayers.length} • ATP: ${atpPlayers.length}`;
    ctx.fillStyle = '#071026'; ctx.fillRect(0,0,canvas.width,canvas.height);
  } catch(err){ console.error(err); document.getElementById('dataDebug').textContent = 'Loading failure: ' + String(err); }
})();
</script>

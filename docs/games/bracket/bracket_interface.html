<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BRACKET TOUR</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      color:#071023;
      background-image:
        linear-gradient(180deg, rgba(2,6,23,0.30), rgba(2,6,23,0.14)),
        url('./bracket.png');
      background-size:cover;
      background-position:center center;
      background-attachment:fixed;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:3rem 1rem;
    }

    :root{
      --accent:#f8d030;
      --card-bg:rgba(255,255,255,0.06);
      --card-border:rgba(255,255,255,0.12);
      --card-radius:16px;
      --glass-blur:6px;
      --muted:rgba(255,255,255,0.78);
      --max-width:1000px;
      --gap:1.25rem;
    }

    .page-container{
      width:100%;
      max-width:var(--max-width);
      margin:0 auto;
    }

    .page-title{
      font-family:'Playfair Display', 'Poppins', serif;
      font-size:4.25rem;
      line-height:0.95;
      color:#ffffff;
      text-align:center;
      margin:0 0 1rem 0;
      letter-spacing:0.02em;
      text-shadow:0 10px 30px rgba(2,6,23,0.6);
    }

    @media(max-width:720px){
      .page-title{font-size:2.4rem}
    }

    .subtitle{
      text-align:center;
      color:rgba(255,255,255,0.92);
      font-weight:500;
      margin:0 0 2rem 0;
    }

    .top-links{
      display:flex;
      justify-content:center;
      gap:1rem;
      margin-top:1rem;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:2rem;
    }

    .small-link{
      color:rgba(255,255,255,0.92);
      text-decoration:none;
      border:1px solid rgba(255,255,255,0.06);
      padding:.35rem .6rem;
      border-radius:10px;
      background:transparent;
      font-weight:600;
    }

    .small-link:hover{
      color:#fff;
      border-color:rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.04);
    }

    .games-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:var(--gap);
      align-items:start;
    }

    @media(min-width:720px){
      .games-grid{
        grid-template-columns:repeat(2, 1fr);
      }
    }

    .game-card{
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border:1px solid var(--card-border);
      border-radius:var(--card-radius);
      padding:1.25rem;
      display:flex;
      flex-direction:column;
      gap:.6rem;
      min-height:180px;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      backdrop-filter:blur(var(--glass-blur));
    }

    .game-card:hover, .game-card:focus-within{
      transform:translateY(-8px);
      box-shadow:0 24px 48px rgba(2,6,23,0.35);
      border-color:rgba(255,255,255,0.2);
    }

    .game-title{
      margin:0;
      color:#fff;
      font-size:1.35rem;
      font-weight:700;
    }

    .game-desc{
      margin:0;
      color:var(--muted);
      font-size:1rem;
      line-height:1.5;
    }

    .game-footer{
      margin-top:auto;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:1rem;
      padding-top:.4rem;
    }

    .btn-play{
      background:linear-gradient(180deg,var(--accent), color-mix(in srgb, var(--accent) 80%, black 10%));
      border:none;
      color:#072031;
      padding:.55rem .95rem;
      border-radius:12px;
      font-weight:700;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      box-shadow:0 8px 26px rgba(248,208,48,0.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }

    .btn-play:hover, .btn-play:focus{
      transform:translateY(-3px);
      box-shadow:0 18px 40px rgba(248,208,48,0.22);
      color:#072031;
    }

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    @media (prefers-reduced-motion: reduce){
      *{transition:none!important}
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <h1 class="page-title">BRACKET TOUR</h1>
      <p class="subtitle">Choose an option below</p>

      <div class="top-links" role="navigation" aria-label="top links">
        <a class="small-link" href="/">← Back to Home</a>
      </div>
    </header>

    <main>
      <section aria-labelledby="games-heading">
        <h2 id="games-heading" class="sr-only">Bracket Tour options</h2>

        <div class="games-grid">
          <article class="game-card" tabindex="0">
            <div>
              <h3 class="game-title">Tournament Registration</h3>
              <p class="game-desc">Every Sunday, register for the Following tournament.</p>
            </div>
            <div class="game-footer">
              <a class="btn-play" href="games/bracket/inscriptions.html" aria-label="Go to Tournament Registration">
                Open ▶
              </a>
            </div>
          </article>

          <article class="game-card" tabindex="0">
            <div>
              <h3 class="game-title">Bracket</h3>
              <p class="game-desc">Fill the bracket for the upcoming tournament.</p>
            </div>
            <div class="game-footer">
              <a class="btn-play" href="games/bracket/bracket.html" aria-label="Go to Bracket">
                Open ▶
              </a>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>
</body>
</html>

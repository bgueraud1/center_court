<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fill the Grid — Game</title>
<style>
  :root{
    --bg:#000;
    --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
    --cell-radius:8px;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:#eee;font-family:var(--font);-webkit-font-smoothing:antialiased}
  .app{max-width:1100px;margin:28px auto;padding:20px}
  .topbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
  .title{font-size:20px;font-weight:700}
  .controls{margin-left:auto;display:flex;gap:8px}
  .btn{background:transparent;border:1px solid #444;color:#ddd;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
  .btn.primary{background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-color:#666}
  .game-wrap{display:grid;gap:16px}
  .board-wrap{padding:14px;border-radius:14px}

  /* THEMES */
  .theme-wta{--cell-light:#EBDFFF;--cell-dark:#6a2d8a;--cell-mid:#CDA9F0;--grid-line:#6A2D8A;--good-text:#033d15;--bad:#ff3b3b}
  .theme-atp{--cell-light:#D8F0FF;--cell-dark:#165a99;--cell-mid:#88C9FF;--grid-line:#165a99;--good-text:#003847;--bad:#ff3b3b}

  /* grid */
  .grid{display:grid;gap:0;background:transparent}
  .grid-header-cell{background:var(--cell-mid);color:var(--cell-dark);padding:10px;font-weight:700;border:1px solid var(--grid-line);text-align:center;min-width:140px;box-sizing:border-box;border-radius:6px}
  .grid-cell{min-width:140px;min-height:72px;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;border:1px solid var(--grid-line);cursor:pointer;position:relative;background:var(--cell-light);color:#111;font-weight:700;border-radius:6px}
  .row-header{background:var(--cell-mid);color:var(--cell-dark);font-weight:700;padding:8px;border:1px solid var(--grid-line);display:flex;align-items:center;justify-content:center;min-height:72px;border-radius:6px}
  .grid .disabled{opacity:0.45;cursor:not-allowed}
  .cell-value{font-size:15px;line-height:1.05;color:var(--good-text)}
  .cell-empty{color:rgba(0,0,0,0.45);font-weight:600;font-size:13px}
  .wrong-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .wrong-box{width:100%;height:100%;background:linear-gradient(90deg,rgba(255,0,0,0.06),rgba(255,0,0,0.02));display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s ease;border-radius:6px}
  .wrong-box.show{opacity:1}
  .wrong-icon{color:var(--bad);font-size:28px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6))}
  .cell-locked{pointer-events:none;box-shadow: inset 0 0 0 2px rgba(255,255,255,0.02)}
  .cond-small{font-size:13px;opacity:0.95}

  /* Give Up reveal: red overlay for empty cells */
  .cell-revealed-empty { position: relative; }
  .cell-revealed-empty::after {
    content: '';
    position:absolute; inset:0; border-radius:6px;
    background: linear-gradient(90deg, rgba(255,0,0,0.06), rgba(255,0,0,0.02));
    box-shadow: 0 0 0 3px rgba(255,59,59,0.12) inset;
    pointer-events:none;
  }

  /* input panel */
  .input-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#0b0b0b;border-radius:12px;padding:14px;min-width:420px;box-shadow:0 12px 40px rgba(0,0,0,0.8);z-index:2000;border:1px solid rgba(255,255,255,0.03)}
  .input-row{display:flex;gap:8px;align-items:center}
  .text-input{flex:1;padding:10px 12px;border-radius:8px;background:#0f0f10;color:#fff;border:1px solid #222;font-size:15px}
  .autocomplete-list{margin-top:8px;max-height:220px;overflow:auto;border-radius:8px;background:#0b0b0b;border:1px solid #222}
  .autocomplete-item{padding:8px 10px;cursor:pointer;color:#ddd}
  .autocomplete-item:hover,.autocomplete-item.active{background:rgba(255,255,255,0.02)}
  .candidates-list{margin-top:8px;max-height:220px;overflow:auto;border-radius:8px;background:#071017;border:1px solid #222;padding:6px}
  .candidate-item{padding:6px 8px;border-radius:6px;cursor:pointer;color:#ddd}
  .candidate-item:hover{background:rgba(255,255,255,0.02)}
  .small-muted{color:#9a9a9a;font-size:13px}

  /* locked candidate item */
  .candidate-item.locked{opacity:0.7;cursor:default}

  /* score overlay */
  .score-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,0.55),rgba(0,0,0,0.55));z-index:3000}
  .score-card{background:#0b0b0b;padding:22px;border-radius:12px;color:#fff;border:1px solid rgba(255,255,255,0.03);min-width:320px;text-align:center}

  @media (max-width:900px){.input-panel{min-width:300px}.grid-cell,.row-header,.grid-header-cell{min-width:110px;min-height:60px;font-size:13px}}
</style>
</head>
<body>
<div id="app" class="app theme-wta">
  <div class="topbar">
    <div class="title">Fill the Grid</div>
    <div class="controls">
      <button class="btn primary" id="btnToggle">Switch to ATP</button>
      <button class="btn" id="btnGiveUp">Give Up</button>
      <button class="btn" id="btnReset">Reset</button>
    </div>
  </div>

  <div class="game-wrap">
    <div class="board-wrap" id="boardWrap" aria-live="polite"></div>
    <div class="small-muted" id="infoLine">Click any cell to propose a player or to see candidate players. Correct answers lock the cell in green; wrong attempts show a brief red cross.</div>
  </div>
</div>

<!-- modal -->
<div id="inputModal" style="display:none;">
  <div class="input-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div id="panelTitle" style="color:#ddd;font-weight:700;margin-bottom:8px">Fill cell</div>
    <div class="input-row">
      <input id="playerInput" class="text-input" placeholder="Type player's name..." autocomplete="off" />
      <button class="btn" id="btnSubmit">Submit</button>
      <button class="btn" id="btnCancel">Cancel</button>
    </div>

    <div class="small-muted" id="cellHint" style="margin-top:8px">Candidate players for this cell:</div>

    <div class="autocomplete-list" id="autocompleteList" role="listbox"></div>

    <div class="candidates-list" id="candidatesList"></div>
  </div>
</div>

<!-- score overlay -->
<div id="scoreOverlay" style="display:none;">
  <div class="score-overlay">
    <div class="score-card">
      <div style="font-size:20px;font-weight:700;" id="scoreTitle">Your score</div>
      <div style="margin-top:10px;font-size:28px;font-weight:800;color:var(--good-text)" id="scoreValue">0</div>
      <div style="margin-top:12px;"><button class="btn primary" id="scoreClose">Close</button></div>
    </div>
  </div>
</div>

<script>
/*
  - English UI
  - Do NOT show candidate counts by default
  - Clicking any cell (locked or not) opens modal showing:
      * autocomplete input (submissions allowed on unlocked)
      * list of candidate players for the cell (clickable to submit when unlocked)
  - Give Up: does NOT fill cells; highlights correct (green locked) vs empty (red overlay).
  - Scoring: first use of a player -> 10 points; each duplicate usage (same player used in multiple filled cells) -> 5 points (per extra use).
    Bonus +10 if all fillable cells are filled.
  - Make sure filled name writes into the correct cell using data-r/data-c selection.
  - Keeps previous robust parsing for H2H and country names.
*/

(() => {
  // Adjust paths if needed
  const PATHS = {
    WTA: '/games/fill_the_grid_WTA.json',
    ATP: '/games/fill_the_grid_ATP.json',
    PLAYERS: '/tools/players_catalog.json'
  };

  const COUNTRY_NAMES = {
    'RUS':'Russia','FRA':'France','ESP':'Spain','GBR':'United Kingdom','USA':'United States',
    'ITA':'Italy','GER':'Germany','AUS':'Australia','CAN':'Canada','JPN':'Japan','CHN':'China',
    'NED':'Netherlands','SUI':'Switzerland','ARG':'Argentina','SWE':'Sweden','CRO':'Croatia',
    'NZL':'New Zealand','IND':'India','BRA':'Brazil','MEX':'Mexico'
  };

  // UI refs
  const app = document.getElementById('app');
  const boardWrap = document.getElementById('boardWrap');
  const btnToggle = document.getElementById('btnToggle');
  const btnGiveUp = document.getElementById('btnGiveUp');
  const btnReset = document.getElementById('btnReset');
  const inputModal = document.getElementById('inputModal');
  const playerInput = document.getElementById('playerInput');
  const autocompleteList = document.getElementById('autocompleteList');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancel = document.getElementById('btnCancel');
  const candidatesListEl = document.getElementById('candidatesList');
  const cellHint = document.getElementById('cellHint');
  const scoreOverlay = document.getElementById('scoreOverlay');
  const scoreValue = document.getElementById('scoreValue');
  const scoreClose = document.getElementById('scoreClose');

  // State
  let mode = 'WTA';
  let gridData = null;
  let playersCatalog = null;
  let idToPlayer = {};
  let nameIndex = []; // {label,id}
  let cellState = {}; // 'r-c' -> {locked:boolean, id, name}
  let activeCell = null; // {r,c,cellData,domNode}

  async function fetchJson(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(`${path} ${r.status}`);
    return r.json();
  }

  function buildPlayerIndex() {
    idToPlayer = {};
    nameIndex = [];
    if (!playersCatalog || !Array.isArray(playersCatalog.players)) return;
    for (const p of playersCatalog.players) {
      const pid = String(p.player_id);
      idToPlayer[pid] = p;
      nameIndex.push({ label: p.full_name, id: pid });
    }
  }

  function extractOpponentId(cond) {
    if (!cond) return null;
    if (cond.opponent_id) return String(cond.opponent_id);
    if (cond.opponent) return String(cond.opponent);
    if (cond.opponent_name) return String(cond.opponent_name);
    if (cond.raw && (cond.raw.opponent_id || cond.raw.opponent)) return String(cond.raw.opponent_id || cond.raw.opponent);
    if (cond.label) {
      const m = cond.label.match(/\b([A-Za-z0-9_]{3,})\b/);
      if (m) return m[1];
    }
    if (cond.value && typeof cond.value === 'string') {
      const m2 = cond.value.match(/\b([A-Za-z0-9_]{3,})\b/);
      if (m2) return m2[1];
    }
    return null;
  }

  function preprocessGrid(raw) {
    let g = raw.grid ? raw.grid : raw;
    if (!g) return g;
    ['rows','cols'].forEach(listName => {
      if (!g[listName]) return;
      g[listName].forEach(cond => {
        if (cond.type === 'country') {
          const code = (cond.value || cond.label || '').toString().toUpperCase();
          cond.label = COUNTRY_NAMES[code] || code;
        }
        if (cond.type === 'positive_h2h') {
          const oppId = extractOpponentId(cond);
          if (oppId && idToPlayer[oppId]) {
            cond.opponent_id = oppId;
            cond.label = `Positive H2H vs ${idToPlayer[oppId].full_name}`;
          } else if (oppId) {
            cond.opponent_id = oppId;
            cond.label = `Positive H2H vs ${oppId}`;
          } else {
            cond.label = cond.label || 'Positive H2H';
          }
        }
      });
    });
    return g;
  }

  async function loadGrid(m) {
    mode = m;
    app.classList.toggle('theme-wta', mode === 'WTA');
    app.classList.toggle('theme-atp', mode === 'ATP');
    btnToggle.textContent = mode === 'WTA' ? 'Switch to ATP' : 'Switch to WTA';
    const path = mode === 'WTA' ? PATHS.WTA : PATHS.ATP;
    try {
      const raw = await fetchJson(path);
      gridData = preprocessGrid(raw);
      initCellState();
      renderBoard();
    } catch (e) {
      console.error('Grid load failed', e);
      boardWrap.innerHTML = `<div style="color:#f88">Failed to load grid: ${e.message}</div>`;
    }
  }

  function initCellState() {
    cellState = {};
    if (!gridData || !gridData.cells) return;
    for (let r=0;r<gridData.rows.length;r++){
      for (let c=0;c<gridData.cols.length;c++){
        cellState[`${r}-${c}`] = { locked:false, id:null, name:null };
      }
    }
  }

  function renderBoard() {
    if (!gridData) { boardWrap.innerHTML = ''; return; }
    const rows = gridData.rows;
    const cols = gridData.cols;
    const cells = gridData.cells;
    const gridEl = document.createElement('div');
    gridEl.className = 'grid';
    gridEl.style.display = 'grid';
    gridEl.style.gridTemplateColumns = `minmax(160px,1fr) ${cols.map(()=>`minmax(140px,1fr)`).join(' ')}`;

    // top-left spacer
    const spacer = document.createElement('div');
    spacer.className = 'grid-header-cell';
    spacer.textContent = '';
    gridEl.appendChild(spacer);

    // column headers
    for (let j=0;j<cols.length;j++){
      const ch = document.createElement('div');
      ch.className = 'grid-header-cell';
      ch.innerHTML = `<div class="cond-small">${cols[j].label || cols[j].condition || ''}</div>`;
      gridEl.appendChild(ch);
    }

    // rows + cells
    for (let i=0;i<rows.length;i++){
      const rh = document.createElement('div');
      rh.className = 'row-header';
      rh.innerHTML = `<div class="cond-small">${rows[i].label || rows[i].condition || ''}</div>`;
      gridEl.appendChild(rh);
      for (let j=0;j<cols.length;j++){
        const cellDiv = document.createElement('div');
        cellDiv.className = 'grid-cell';
        cellDiv.dataset.r = String(i);
        cellDiv.dataset.c = String(j);
        const cellData = (cells && cells[i] && cells[i][j]) ? cells[i][j] : null;

        if (!cellData || !Array.isArray(cellData.candidates_sample) || cellData.candidates_sample.length === 0){
          cellDiv.classList.add('disabled');
          cellDiv.innerHTML = `<div class="cell-empty">—</div>`;
        } else {
          // show placeholder text only (no candidate count)
          cellDiv.innerHTML = `<div class="cell-empty">Click to enter</div>`;
          ((r,c,datum,node)=>{ node.addEventListener('click', ()=> onCellClick(r,c,node,datum)); })(i,j,cellData,cellDiv);
        }
        // wrong overlay
        const wrongOverlay = document.createElement('div');
        wrongOverlay.className = 'wrong-overlay';
        wrongOverlay.innerHTML = `<div class="wrong-box"><div class="wrong-icon">✖</div></div>`;
        cellDiv.appendChild(wrongOverlay);

        gridEl.appendChild(cellDiv);
      }
    }

    boardWrap.innerHTML = '';
    boardWrap.appendChild(gridEl);
  }

  // clicking a cell opens modal and shows list of candidates for that cell
  function onCellClick(r,c,node,cellData){
    const key = `${r}-${c}`;
    // open modal always (for viewing candidates). If locked, submission will be disallowed but list shown.
    activeCell = { r, c, cellData, domNode: node, key };
    openModal(activeCell);
  }

  function openModal(cell) {
    playerInput.value = '';
    autocompleteList.innerHTML = '';
    candidatesListEl.innerHTML = '';
    inputModal.style.display = 'block';
    document.querySelector('.input-panel').style.display = 'block';
    playerInput.focus();

    const cnt = cell.cellData && Array.isArray(cell.cellData.candidates_sample) ? cell.cellData.candidates_sample.length : 0;
    cellHint.textContent = `Candidates: ${cnt} — (click a candidate to propose it for this cell)`;

    // fill candidates list (resolve names)
    const candIds = (cell.cellData && Array.isArray(cell.cellData.candidates_sample)) ? cell.cellData.candidates_sample : [];
    for (const pid of candIds){
      const id = String(pid);
      const info = idToPlayer[id];
      const display = info ? `${info.full_name} ${info.represented_country ? '('+info.represented_country+')' : ''}` : id;
      const div = document.createElement('div');
      div.className = 'candidate-item';
      // if cell is already locked with this id, mark locked state
      const locked = cellState[cell.key] && cellState[cell.key].locked;
      if (locked) div.classList.add('locked');
      div.textContent = display;
      div.dataset.id = id;
      // clicking candidate: if cell unlocked, attempt submit; if locked, do nothing except maybe highlight
      div.addEventListener('click', (e) => {
        if (locked) return;
        attemptSubmit(id, info ? info.full_name : id);
      });
      candidatesListEl.appendChild(div);
    }

    // store candidate id set for validation
    inputModal._candidatesSet = new Set(candIds.map(String));
  }

  function closeModal() {
    inputModal.style.display = 'none';
    document.querySelector('.input-panel').style.display = 'none';
    activeCell = null;
    playerInput.value = '';
    autocompleteList.innerHTML = '';
    candidatesListEl.innerHTML = '';
    inputModal._candidatesSet = null;
  }

  // AUTOCOMPLETE (search in players_catalog)
  let acIndex = -1;
  function onInput(e) {
    const q = playerInput.value.trim().toLowerCase();
    autocompleteList.innerHTML = ''; acIndex = -1;
    if (!q) return;
    const starts = [], includes = [];
    for (let i=0;i<nameIndex.length;i++){
      const n = nameIndex[i];
      const s = n.label.toLowerCase();
      if (s.startsWith(q)) starts.push(n);
      else if (s.includes(q)) includes.push(n);
      if (starts.length >= 40) break;
    }
    const results = starts.concat(includes).slice(0,60);
    for (const r of results){
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      const info = idToPlayer[r.id];
      const country = info ? (info.represented_country || '') : '';
      div.textContent = `${r.label}${country ? ' ('+country+')' : ''}`;
      div.dataset.id = r.id;
      div.addEventListener('click', ()=> chooseItem(r.id));
      autocompleteList.appendChild(div);
    }
  }

  function onInputKeyDown(e){
    const items = Array.from(autocompleteList.querySelectorAll('.autocomplete-item'));
    if (e.key === 'ArrowDown'){ e.preventDefault(); if(items.length===0) return; acIndex = Math.min(acIndex+1, items.length-1); updateActive(items); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); if(items.length===0) return; acIndex = Math.max(acIndex-1, 0); updateActive(items); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (items.length>0 && acIndex>=0) chooseItem(items[acIndex].dataset.id); else onSubmit(); }
  }
  function updateActive(items){ items.forEach((it,idx)=> it.classList.toggle('active', idx===acIndex)); if (acIndex>=0 && items[acIndex]) items[acIndex].scrollIntoView({block:'nearest'}); }
  function chooseItem(pid){ const p = idToPlayer[pid]; playerInput.value = p ? p.full_name : pid; setTimeout(()=> attemptSubmit(pid, p ? p.full_name : pid), 80); }

  function onSubmit(){
    const typed = playerInput.value.trim();
    if (!typed) { animateWrong(); return; }
    const exact = nameIndex.find(n => n.label.toLowerCase() === typed.toLowerCase());
    if (exact) return attemptSubmit(exact.id, idToPlayer[exact.id] ? idToPlayer[exact.id].full_name : exact.id);
    const partial = nameIndex.find(n => n.label.toLowerCase().includes(typed.toLowerCase()));
    if (partial) return attemptSubmit(partial.id, idToPlayer[partial.id] ? idToPlayer[partial.id].full_name : partial.id);
    animateWrong();
  }

  function attemptSubmit(playerId, playerName) {
    if (!activeCell) return;
    const isLocked = cellState[activeCell.key] && cellState[activeCell.key].locked;
    if (isLocked) {
      // already locked; do nothing (but highlight maybe)
      return;
    }
    const candSet = inputModal._candidatesSet;
    if (candSet && candSet.has(String(playerId))) {
      // correct -> lock
      lockCell(activeCell.r, activeCell.c, playerId, playerName);
      closeModal();
      checkCompletion();
    } else {
      animateWrong();
    }
  }

  function animateWrong(){
    if (!activeCell) return;
    const node = activeCell.domNode;
    const wb = node.querySelector('.wrong-box');
    if (!wb) return;
    wb.classList.add('show');
    setTimeout(()=> wb.classList.remove('show'), 750);
  }

  // lock cell: use selector by data-r/data-c to be robust
  function lockCell(r, c, pid, pname) {
    const key = `${r}-${c}`;
    cellState[key] = { locked:true, id: pid, name: pname };
    const sel = `.grid-cell[data-r="${r}"][data-c="${c}"]`;
    const node = boardWrap.querySelector(sel);
    if (!node) return;
    node.classList.add('cell-locked');
    node.innerHTML = `<div class="cell-value">${pname}</div>`;
    const ok = document.createElement('div'); ok.style.position='absolute'; ok.style.top='6px'; ok.style.left='6px'; ok.style.fontSize='14px'; ok.style.color='var(--good-text)'; ok.textContent='✔';
    node.appendChild(ok);
  }

  function checkCompletion() {
    let total=0, filled=0;
    for (let r=0;r<gridData.rows.length;r++){
      for (let c=0;c<gridData.cols.length;c++){
        const cell = gridData.cells[r][c];
        if (!cell || !Array.isArray(cell.candidates_sample) || cell.candidates_sample.length===0) continue;
        total++;
        if (cellState[`${r}-${c}`] && cellState[`${r}-${c}`].locked) filled++;
      }
    }
    if (total>0 && filled===total) {
      const score = computeScore();
      showScore(score);
    }
  }

  // Give Up: highlight correct vs empty, do NOT fill; compute score and show
  function onGiveUp(){
    // remove any previous revealed-empty classes
    const allCells = boardWrap.querySelectorAll('.grid-cell');
    allCells.forEach(n => n.classList.remove('cell-revealed-empty'));
    let total=0, filled=0;
    for (let r=0;r<gridData.rows.length;r++){
      for (let c=0;c<gridData.cols.length;c++){
        const cell = gridData.cells[r][c];
        if (!cell || !Array.isArray(cell.candidates_sample) || cell.candidates_sample.length===0) continue;
        total++;
        const key = `${r}-${c}`;
        if (cellState[key] && cellState[key].locked) { filled++; continue; }
        // mark as revealed empty (red overlay)
        const node = boardWrap.querySelector(`.grid-cell[data-r="${r}"][data-c="${c}"]`);
        if (node) node.classList.add('cell-revealed-empty');
      }
    }
    const score = computeScore();
    showScore(score);
  }

  // Score computation with duplicate penalty:
  // - first use of a player_id yields 10 points
  // - each additional use of same player_id yields 5 points
  // - bonus +10 if ALL fillable cells are filled
  function computeScore(){
    const usedCounts = {}; // pid -> count
    let totalFillable = 0;
    for (let r=0;r<gridData.rows.length;r++){
      for (let c=0;c<gridData.cols.length;c++){
        const cell = gridData.cells[r][c];
        if (!cell || !Array.isArray(cell.candidates_sample) || cell.candidates_sample.length===0) continue;
        totalFillable++;
        const key = `${r}-${c}`;
        if (cellState[key] && cellState[key].locked) {
          const pid = String(cellState[key].id);
          usedCounts[pid] = (usedCounts[pid] || 0) + 1;
        }
      }
    }
    // compute points
    let points = 0;
    for (const pid in usedCounts){
      const count = usedCounts[pid];
      if (count <= 0) continue;
      // first occurrence = 10
      points += 10;
      if (count > 1) {
        // each extra counts 5
        points += (count - 1) * 5;
      }
    }
    // bonus if all filled
    let filled = 0;
    for (let r=0;r<gridData.rows.length;r++){
      for (let c=0;c<gridData.cols.length;c++){
        const cell = gridData.cells[r][c];
        if (!cell || !Array.isArray(cell.candidates_sample) || cell.candidates_sample.length===0) continue;
        const key = `${r}-${c}`;
        if (cellState[key] && cellState[key].locked) filled++;
      }
    }
    if (totalFillable > 0 && filled === totalFillable) points += 10;
    return points;
  }

  function showScore(s){
    scoreValue.textContent = s;
    scoreOverlay.style.display = 'block';
  }

  function onReset(){
    initCellState();
    renderBoard();
  }

  // Load players catalog and name index
  function buildNameIndex(){
    nameIndex = [];
    if (!playersCatalog || !Array.isArray(playersCatalog.players)) return;
    for (const p of playersCatalog.players) nameIndex.push({ label: p.full_name, id: String(p.player_id) });
  }

  // Autocomplete wiring
  function onPlayerInput(e){
    const q = playerInput.value.trim().toLowerCase();
    autocompleteList.innerHTML = ''; acIndex = -1;
    if (!q) return;
    const starts = [], includes = [];
    for (let i=0;i<nameIndex.length;i++){
      const n = nameIndex[i];
      const s = n.label.toLowerCase();
      if (s.startsWith(q)) starts.push(n);
      else if (s.includes(q)) includes.push(n);
      if (starts.length >= 40) break;
    }
    const results = starts.concat(includes).slice(0,60);
    for (const r of results){
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      const info = idToPlayer[r.id];
      div.textContent = `${r.label}${info && info.represented_country ? ' ('+info.represented_country+')' : ''}`;
      div.dataset.id = r.id;
      div.addEventListener('click', ()=> chooseItem(r.id));
      autocompleteList.appendChild(div);
    }
  }
  function onPlayerKeyDown(e){
    const items = Array.from(autocompleteList.querySelectorAll('.autocomplete-item'));
    if (e.key === 'ArrowDown'){ e.preventDefault(); if(items.length===0) return; acIndex = Math.min(acIndex+1, items.length-1); updateActive(items); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); if(items.length===0) return; acIndex = Math.max(acIndex-1, 0); updateActive(items); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (items.length>0 && acIndex>=0) chooseItem(items[acIndex].dataset.id); else onSubmit(); }
  }
  function updateActive(items){ items.forEach((it, idx)=> it.classList.toggle('active', idx===acIndex)); if (acIndex>=0 && items[acIndex]) items[acIndex].scrollIntoView({block:'nearest'}); }
  function chooseItem(pid){ const p = idToPlayer[pid]; playerInput.value = p ? p.full_name : pid; setTimeout(()=> attemptSubmit(pid, p ? p.full_name : pid), 80); }

  // Attempt submit from input
  function onSubmit(){
    const typed = playerInput.value.trim();
    if (!typed) { animateWrong(); return; }
    const exact = nameIndex.find(n => n.label.toLowerCase() === typed.toLowerCase());
    if (exact) return attemptSubmit(exact.id, idToPlayer[exact.id] ? idToPlayer[exact.id].full_name : exact.id);
    const partial = nameIndex.find(n => n.label.toLowerCase().includes(typed.toLowerCase()));
    if (partial) return attemptSubmit(partial.id, idToPlayer[partial.id] ? idToPlayer[partial.id].full_name : partial.id);
    animateWrong();
  }

  function attemptSubmit(playerId, playerName){
    if (!activeCell) return;
    const locked = cellState[activeCell.key] && cellState[activeCell.key].locked;
    if (locked) return; // cannot change locked cell
    const candSet = inputModal._candidatesSet;
    if (candSet && candSet.has(String(playerId))) {
      lockCell(activeCell.r, activeCell.c, playerId, playerName);
      closeModal();
    } else {
      animateWrong();
    }
  }

  // initialization
  (async () => {
    try {
      // load players catalog
      try {
        playersCatalog = await fetchJson(PATHS.PLAYERS);
      } catch (e) {
        console.warn('Failed to load players catalog:', e);
        playersCatalog = null;
      }
      buildPlayerIndex();
      buildNameIndex();

      await loadGrid(mode);

      // wire events
      btnToggle.addEventListener('click', ()=> loadGrid(mode === 'WTA' ? 'ATP' : 'WTA'));
      btnGiveUp.addEventListener('click', onGiveUp);
      btnReset.addEventListener('click', onReset);
      btnCancel.addEventListener('click', closeModal);
      btnSubmit.addEventListener('click', onSubmit);
      playerInput.addEventListener('input', onPlayerInput);
      playerInput.addEventListener('keydown', onPlayerKeyDown);
      scoreClose.addEventListener('click', ()=> scoreOverlay.style.display='none');

      // allow clicking already-locked cells to view candidate list: handled naturally by onCellClick -> openModal
    } catch (err) {
      console.error('Init error', err);
    }
  })();

})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Player profile - Center Court</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{ --gap:12px; --muted:#666; --border:#e6e6e6; --card:#fff; --glass:#fafafa; --accent:#1366d6; }
    body { font-family: Arial, Helvetica, sans-serif; margin:18px; color:#222; background:#f6f7fb; }
    #loading { font-size:16px; color:#333; }
    #player-root { display:none; max-width:1200px; margin:0 auto; }

    /* (le reste du CSS est identique à ton fichier précédent, raccourci ici pour la lisibilité) */
    .tabs { display:flex; gap:8px; margin:12px 0; }
    .tab-btn { padding:8px 12px; border:1px solid var(--border); background:#fff; cursor:pointer; border-radius:8px; }
    .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .panel { display:none; border:1px solid var(--border); padding:12px; border-radius:8px; background:#fff; }
    .panel.active { display:block; }

    /* maps layout */
    .maps-container { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
    .map-panel { flex:1 1 520px; min-width:320px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px; box-shadow:0 6px 14px rgba(10,20,40,0.02); }
    .map-title { font-weight:700; margin-bottom:8px; }
    #maps-grid { display:flex; gap:12px; flex-wrap:wrap; }
    .map-div { width:100%; height:420px; min-height:320px; }

    .legacy-list { margin-top:12px; display:flex; gap:12px; flex-wrap:wrap; }
    .list-column { flex:1 1 320px; min-width:260px; max-height:420px; overflow:auto; padding:8px; border:1px solid #eee; border-radius:8px; background:#fff; }
    .country-row { display:flex; justify-content:space-between; gap:8px; padding:6px 4px; border-bottom:1px dashed #f2f2f2; }
    .country-label { font-weight:700; }
    .smallsub { color:var(--muted); font-size:13px; }

    /* responsive */
    @media (max-width:900px){
      .maps-container { flex-direction:column; }
    }
  </style>
  <!-- Plotly CDN -->
  <script src="https://cdn.plot.ly/plotly-2.25.2.min.js"></script>
</head>
<body>
  <div id="loading">Loading…</div>

  <div id="player-root" aria-live="polite">
    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-target="panel-matches">Matches</button>
      <button class="tab-btn" data-target="panel-trophies">Trophies</button>
      <button class="tab-btn" data-target="panel-stats">Statistics</button>
    </div>

    <div id="panel-stats" class="panel active">
      <h3>Statistics</h3>
      <div style="margin-bottom:8px;">
        <button class="subtab" data-sub="maps">Maps</button>
      </div>

      <div id="maps-area">
        <div id="maps-loading" class="smallsub">Maps: not loaded</div>
        <div class="maps-container" id="maps-container" style="display:none;">
          <div class="map-panel">
            <div class="map-title">Win rate in host countries (tournaments hosted in these countries)</div>
            <div id="map-host" class="map-div"></div>
          </div>
          <div class="map-panel">
            <div class="map-title">Win rate vs opponent countries (opponents' country)</div>
            <div id="map-opp" class="map-div"></div>
          </div>
        </div>

        <div class="legacy-list" id="maps-lists" style="display:none;">
          <div class="list-column"><h4>Host countries details</h4><div id="host-list"></div></div>
          <div class="list-column"><h4>Opponent countries details</h4><div id="opp-list"></div></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* Utilities (same as before) */
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fetchJsonSafe(url){ try{ return fetch(url).then(r => { if(!r.ok) return null; return r.json().catch(()=>null); }).catch(()=>null); }catch(e){ return Promise.resolve(null); } }

/* Entry */
(async function(){
  const loading = document.getElementById('loading');
  const root = document.getElementById('player-root');

  // get slug / pid
  const parts = location.pathname.replace(/\/$/,'').split('/');
  const slug = parts[parts.length-1] || parts[parts.length-2] || '';
  if(!slug){ loading.textContent = 'Slug not found in URL.'; return; }

  loading.textContent = 'Loading players index...';
  const index = await fetchJsonSafe('/index/players_index.json');
  if(!index || !Array.isArray(index.players)){ loading.textContent = 'Index unavailable (/index/players_index.json).'; return; }
  const players = index.players;
  const slugLower = slug.toLowerCase();
  const found = players.find(p => (p.slug && p.slug.toLowerCase()===slugLower) || (((p.player_id||'')+'-'+(p.slug||'')).toLowerCase()===slugLower));
  if(!found){ loading.textContent = 'Player not found for slug: ' + slug; return; }
  const pid = found.player_id;
  // load player combined meta as before (light)
  const dataUrl = (found.data_path ? '/' + String(found.data_path).replace(/^\/+/, '') : `/players_atp/data/${slugLower}.json`);
  loading.textContent = 'Loading player data...';
  let combined = await fetchJsonSafe(dataUrl);
  if(!combined){
    const legacyMeta = await fetchJsonSafe(`/players_atp/${pid}.meta.json`);
    const legacyMatches = await fetchJsonSafe(`/players_atp/${pid}.matches.json`);
    if(legacyMeta || legacyMatches){
      combined = {
        player_id: pid,
        name: (legacyMeta && legacyMeta.name) || found.name || pid,
        slug: (legacyMeta && legacyMeta.slug) || (found.slug || (''+pid).toLowerCase()),
        country: (legacyMeta && legacyMeta.country) || found.country || '',
        matches: (legacyMatches && legacyMatches.matches) || []
      };
    } else {
      loading.textContent = 'Player data unavailable.';
      return;
    }
  }

  // finalize header (not fully included here)
  loading.style.display = 'none';
  root.style.display = 'block';

  // load maps lazily now
  await loadAndRenderMaps(pid, combined);

})();

/* MAIN: load and render maps (Plotly choropleths) */
async function loadAndRenderMaps(pid, combined){
  const loadNode = document.getElementById('maps-loading');
  loadNode.textContent = 'Loading maps data...';
  const candidates = [
    `/players_atp/${pid}.maps.json`,
    `/players_atp/${pid.toLowerCase()}.maps.json`,
    `/players_atp/${combined.slug}.maps.json`,
    `/players_atp/data/${combined.slug}.maps.json`
  ];
  let data = null;
  for(const u of candidates){
    data = await fetchJsonSafe(u);
    if(data) break;
  }
  if(!data){
    loadNode.textContent = 'Maps data not found.';
    return;
  }

  // canonical keys
  const host = data.map_host_stats || data.host_countries || {};
  const opp = data.map_opponent_stats || data.opponent_countries || {};

  // Build arrays for Plotly (locations = ISO-3)
  function prepareSeries(obj){
    const locations = [];
    const z = [];
    const hover = [];
    const details = []; // for the list below
    for(const k of Object.keys(obj)){
      const stats = obj[k] || {};
      // accept keys that look like ISO3 (3 letters) or map 2-letter to 3-letter if known
      const code = (typeof k === 'string') ? k.trim().toUpperCase() : '';
      if(!code) continue;
      // prefer 3-letter codes
      let iso3 = code;
      if(code.length === 2){
        // small mapping - if you need more countries, extend this mapping
        const map2to3 = {'IT':'ITA','ES':'ESP','FR':'FRA','DE':'DEU','GB':'GBR','US':'USA','CA':'CAN','AU':'AUS','BR':'BRA','AR':'ARG','CH':'CHE','RS':'SRB'};
        iso3 = map2to3[code] || null;
      } else if(code.length === 3){
        iso3 = code;
      } else {
        iso3 = null;
      }
      if(!iso3) continue; // skip unknown codes for the map

      const matches = Number(stats.matches || 0);
      const wins = Number(stats.wins || 0);
      const win_rate = (stats.win_rate === null || stats.win_rate === undefined) ? null : Number(stats.win_rate);
      const titles = Number(stats.titles || 0);

      // prefer win_rate; if null fallback to matches (so map still shows something)
      const value = (win_rate !== null && !isNaN(win_rate)) ? win_rate : (matches>0 ? (wins/matches) : null);

      locations.push(iso3);
      z.push(value === null ? 0 : Math.round((value)*1000)/1000); // reduce noise
      hover.push(`${iso3}<br>matches: ${matches}<br>wins: ${wins}<br>losses: ${Number(stats.losses||0)}<br>win_rate: ${ (win_rate===null? '—' : (Math.round(win_rate*1000)/10)+'%') }${titles? '<br>titles: '+titles : '' }`);
      details.push({ code: iso3, matches, wins, losses: Number(stats.losses||0), win_rate, titles, sample_matches: stats.sample_matches || [] });
    }
    return { locations, z, hover, details };
  }

  const hostSeries = prepareSeries(host);
  const oppSeries = prepareSeries(opp);

  // If no valid ISO3 entries for both, show legacy lists only
  if((hostSeries.locations.length + oppSeries.locations.length) === 0){
    loadNode.textContent = 'No valid country ISO-3 data available for maps.';
    renderLists(host, opp);
    return;
  }

  // Draw Plotly choropleths
  const mapHostDiv = document.getElementById('map-host');
  const mapOppDiv = document.getElementById('map-opp');

  const traceHost = {
    type: 'choropleth',
    locationmode: 'ISO-3',
    locations: hostSeries.locations,
    z: hostSeries.z,
    text: hostSeries.hover,
    colorscale: 'Blues',
    marker: { line: { color: 'rgba(180,180,180,0.2)', width: 0.5 } },
    colorbar: { title: 'win rate' },
    zmin: 0, zmax: 1
  };
  const traceOpp = {
    type: 'choropleth',
    locationmode: 'ISO-3',
    locations: oppSeries.locations,
    z: oppSeries.z,
    text: oppSeries.hover,
    colorscale: 'Reds',
    marker: { line: { color: 'rgba(180,180,180,0.2)', width: 0.5 } },
    colorbar: { title: 'win rate' },
    zmin: 0, zmax: 1
  };

  const layoutBase = {
    geo: {
      projection: { type: 'natural earth' },
      showocean: true,
      oceancolor: '#ADD8E6',
      showcountries: true,
      countrycolor: 'rgba(200,200,200,0.6)'
    },
    margin: { t: 10, b: 10, l: 10, r: 10 }
  };

  try {
    Plotly.newPlot(mapHostDiv, [traceHost], Object.assign({}, layoutBase, { title: 'Host countries (win rate)' }), {responsive:true});
  } catch(e){
    console.warn('Plotly host error', e);
  }
  try {
    Plotly.newPlot(mapOppDiv, [traceOpp], Object.assign({}, layoutBase, { title: 'Opponent countries (win rate)' }), {responsive:true});
  } catch(e){
    console.warn('Plotly opp error', e);
  }

  // show lists below for details
  document.getElementById('maps-container').style.display = 'flex';
  document.getElementById('maps-lists').style.display = 'flex';
  document.getElementById('maps-loading').style.display = 'none';
  renderLists(host, opp);
}

// render textual lists for debugging / details
function renderLists(hostObj, oppObj){
  const hostList = document.getElementById('host-list'); hostList.innerHTML = '';
  const oppList = document.getElementById('opp-list'); oppList.innerHTML = '';

  function addRows(obj, target){
    const rows = [];
    for(const k of Object.keys(obj||{})){
      const s = obj[k] || {};
      rows.push({code:k, matches: s.matches||0, wins:s.wins||0, losses:s.losses||0, win_rate:s.win_rate, titles: s.titles||0, sample: s.sample_matches||[]});
    }
    rows.sort((a,b) => (b.matches - a.matches));
    for(const r of rows){
      const div = document.createElement('div'); div.className='country-row';
      div.innerHTML = `<div><span class="country-label">${escapeHtml(r.code)}</span><div class="smallsub">${r.matches} matches • ${r.wins}W • ${r.losses}L • ${r.titles} titles</div></div><div class="smallsub">${r.win_rate===null? '—' : (Math.round(r.win_rate*1000)/10)+'%'}</div>`;
      target.appendChild(div);
      if(Array.isArray(r.sample) && r.sample.length){
        const sdiv = document.createElement('div'); sdiv.className='smallsub'; sdiv.style.paddingLeft='8px';
        for(const sm of r.sample){
          const text = `${sm.match_date || sm.event_year || ''} — ${sm.opponent || ''} — ${sm.score || ''}`;
          const p = document.createElement('div'); p.textContent = text; sdiv.appendChild(p);
        }
        target.appendChild(sdiv);
      }
    }
  }
  addRows(hostObj, hostList);
  addRows(oppObj, oppList);
}
</script>
</body>
</html>

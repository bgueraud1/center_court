<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Player page - Center Court</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --muted:#7a8796;
      --accent:#0b66ff;
      --success:#0b7a33;
      --danger:#b71c1c;
      --card-radius:12px;
      --gap:14px;
      --shadow: 0 6px 18px rgba(24,39,75,0.08);
      --badge-bg: linear-gradient(90deg,#eef6ff,#f7fbff);
    }
    html,body{height:100%; background:var(--bg); font-family:Inter, "Segoe UI", Roboto, Arial, sans-serif; margin:0; color:#0f1720}
    .wrap{max-width:1100px;margin:28px auto;padding:18px;}
    #loading{font-size:16px;color:var(--muted);}

    .header {
      display:flex; gap:var(--gap); align-items:flex-start; margin-bottom:18px;
    }
    .left {
      flex:1;
      background:var(--card); border-radius:var(--card-radius); padding:18px; box-shadow:var(--shadow);
    }
    .right {
      width:180px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    }
    .player-image {
      width:180px; height:180px; border-radius:12px; overflow:hidden; background:linear-gradient(180deg,#fff,#f3f6fb); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
    }
    .player-image img{ width:100%; height:100%; object-fit:cover; display:block; }

    h1#player-name { margin:0; font-size:28px; letter-spacing:-0.2px; }
    .meta-row { margin-top:8px; color:var(--muted); font-size:14px; display:flex; gap:10px; align-items:center; }
    .country-flag { font-size:22px; margin-left:6px; }

    .attrs { margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
    .attr { background:var(--badge-bg); padding:10px 12px; border-radius:10px; border:1px solid rgba(15,23,32,0.04); font-size:13px; color:#0f1720; min-width:140px; box-shadow: 0 2px 6px rgba(15,23,32,0.03); }

    /* tabs */
    .tabs { display:flex; gap:8px; margin:18px 0; }
    .tab-btn { padding:9px 14px; border-radius:10px; border:1px solid transparent; cursor:pointer; background:transparent; color:var(--muted); font-weight:600; }
    .tab-btn.active { background:var(--card); color:#0f1720; box-shadow:var(--shadow); border-color:rgba(15,23,32,0.04); }

    .panel { display:none; background:var(--card); border-radius:var(--card-radius); padding:16px; box-shadow:var(--shadow); }
    .panel.active { display:block; }

    .year-selector { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
    select { padding:8px 10px; border-radius:8px; border:1px solid #e6eefc; background:#fff; }

    /* tournament card */
    .tourney { border-radius:10px; padding:12px; margin-bottom:12px; border:1px solid rgba(15,23,32,0.03); display:block; box-shadow: 0 2px 8px rgba(24,39,75,0.03); }
    .tourney-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .tourney-left { display:flex; align-items:center; gap:12px; }
    .tourney-title { font-size:15px; font-weight:700; }
    .tourney-meta { font-size:13px; color:var(--muted); }
    .badge-cat { padding:6px 8px; border-radius:999px; font-weight:700; font-size:12px; background:linear-gradient(90deg,#f1f6ff,#f7fbff); border:1px solid rgba(11,102,255,0.06); color:var(--accent); }

    /* surface ribbon */
    .surf { padding:6px 10px; border-radius:8px; font-size:13px; color:#fff; font-weight:700; }
    .surf-hard { background:#2b63c6; }
    .surf-clay { background:#d2483b; }
    .surf-grass { background:#2ea24e; }
    .surf-other { background:#6b7280; }

    /* match line */
    .match-list{display:flex; flex-direction:column; gap:8px;}
    .match {
      display:flex; gap:12px; align-items:center; padding:10px; border-radius:8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(250,250,252,0.6));
      border:1px solid rgba(15,23,32,0.03);
    }
    .match.win { box-shadow: 0 6px 18px rgba(10,140,80,0.06); }
    .match.loss { box-shadow: 0 6px 18px rgba(183,28,28,0.04); }
    .match .opponent { flex:1; font-weight:700; }
    .match .score { min-width:120px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-weight:700; }
    .match .date { min-width:110px; color:var(--muted); }
    .match .round { min-width:80px; color:var(--muted); font-size:13px; text-align:left; }

    /* trophies and bests */
    .trophy-list { display:flex; flex-direction:column; gap:10px; }
    .trophy { display:flex; justify-content:space-between; align-items:center; padding:12px; border-radius:10px; background:linear-gradient(90deg,#fff6f0,#fffdf9); border:1px solid rgba(210,150,100,0.06); }
    .trophy .left { display:flex; gap:10px; align-items:center; }
    .trophy .title { font-weight:800; }
    .trophy .points { font-weight:900; font-size:15px; color:#b45c19; }

    .best-item { display:flex; justify-content:space-between; gap:12px; padding:10px; border-radius:8px; border:1px solid rgba(15,23,32,0.03); background:#fff; }

    .no-data { color:var(--muted); padding:12px; }

    @media (max-width:880px){
      .header { flex-direction:column; }
      .right { width:100%; display:flex; justify-content:center; }
      .player-image { width:140px; height:140px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading">Loading…</div>

    <div id="player-root" style="display:none;">
      <div class="header">
        <div class="left">
          <h1 id="player-name">Player Name</h1>
          <div class="meta-row">
            <div id="player-country"></div>
            <div id="player-birth" style="margin-left:6px;color:var(--muted);"></div>
          </div>

          <div class="attrs" id="player-attrs"></div>
        </div>
        <div class="right">
          <div class="player-image" id="player-image">No image</div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Player tabs">
        <button class="tab-btn active" data-target="panel-matches" role="tab" aria-selected="true">Matches by year</button>
        <button class="tab-btn" data-target="panel-trophies" role="tab" aria-selected="false">Tournaments & best performances</button>
        <button class="tab-btn" data-target="panel-stats" role="tab" aria-selected="false">Statistics (not loaded)</button>
      </div>

      <div id="panel-matches" class="panel active" role="tabpanel">
        <div class="year-selector">
          <label style="color:var(--muted); font-weight:700;">Select year:</label>
          <select id="year-select"></select>
        </div>

        <div id="matches-container"></div>
      </div>

      <div id="panel-trophies" class="panel" role="tabpanel" style="display:none;">
        <h3 style="margin-top:0;">Titles won</h3>
        <div id="trophies-list" class="trophy-list"></div>

        <h3 style="margin-top:18px;">Best performances (by year)</h3>
        <div style="margin-bottom:8px;">
          <label style="color:var(--muted); font-weight:700;">Year:</label>
          <select id="best-year-select" style="margin-left:8px;"></select>
        </div>
        <div id="best-list"></div>
      </div>

      <div id="panel-stats" class="panel" role="tabpanel" style="display:none;">
        <div class="no-data">Detailed statistics are handled by another module and are not loaded here.</div>
      </div>
    </div>
  </div>

<script>
// Utility
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Map common IOC/3-letter codes to ISO2 country codes for emoji (expand as needed)
const IOC_TO_ISO = {
  'ITA':'IT','ESP':'ES','GER':'DE','USA':'US','GBR':'GB','SRB':'RS','FRA':'FR','ARG':'AR','BRA':'BR','SUI':'CH','AUS':'AU','CAN':'CA','CZE':'CZ','NED':'NL','SWE':'SE','POL':'PL','JPN':'JP'
};

function countryCodeToFlag(code){
  if(!code) return '';
  let iso2 = null;
  const c = String(code).trim();
  if(c.length === 3){
    iso2 = IOC_TO_ISO[c.toUpperCase()] || null;
  } else if(c.length === 2){
    iso2 = c.toUpperCase();
  } else {
    if(c.length > 2) iso2 = c.slice(0,2).toUpperCase();
  }
  if(!iso2) return '';
  const A = 0x1F1E6;
  return [...iso2.toUpperCase()].map(ch => String.fromCodePoint(A + ch.charCodeAt(0) - 65)).join('');
}

function surfaceClass(surface){
  if(!surface) return 'surf-other';
  const s = String(surface).toLowerCase();
  if(s.includes('hard')) return 'surf-hard';
  if(s.includes('clay') || s.includes('red')) return 'surf-clay';
  if(s.includes('grass')) return 'surf-grass';
  return 'surf-other';
}

function surfaceLabel(surface){
  if(!surface) return 'Other';
  const s = String(surface).toLowerCase();
  if(s.includes('hard')) return 'Hard';
  if(s.includes('clay')) return 'Clay';
  if(s.includes('grass')) return 'Grass';
  return String(surface);
}

function dateToDDMonth(isoDate){
  if(!isoDate) return '';
  try{
    const d = new Date(isoDate);
    if(isNaN(d)) {
      const m = isoDate.match(/^\d{4}-(\d{2})-(\d{2})/);
      if(m) {
        // return day month (build month name)
        const day = m[2];
        const monthIdx = parseInt(m[1],10)-1;
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        return `${String(day)} ${months[monthIdx]||''}`;
      }
      return isoDate;
    }
    // use en-GB to get day-month order
    return d.toLocaleString('en-GB',{day:'2-digit', month:'long'});
  }catch(e){ return isoDate; }
}

async function fetchJsonSafe(url){
  try{ const r = await fetch(url); if(!r.ok) return null; return await r.json(); }catch(e){ console.warn('fetch failed',url,e); return null; }
}

// Main
(async function(){
  const loading = document.getElementById('loading');
  const root = document.getElementById('player-root');

  // slug from URL (same logic)
  const parts = location.pathname.replace(/\/$/,'').split('/');
  const slug = parts[parts.length-1] || parts[parts.length-2] || '';
  if(!slug){ loading.textContent = 'Slug not found in URL.'; return; }

  loading.textContent = 'Loading players index…';
  const index = await fetchJsonSafe('/index/players_index.json');
  if(!index || !Array.isArray(index.players)){ loading.textContent = 'Players index not available (/index/players_index.json).'; return; }
  const players = index.players;
  const slugLower = slug.toLowerCase();
  const found = players.find(p => (p.slug && p.slug.toLowerCase() === slugLower) || (((''+(p.player_id||'')).toLowerCase() + '-' + (p.slug||'')).toLowerCase() === slugLower));
  if(!found){ loading.textContent = 'Player not found for slug: ' + slug; return; }

  const pid = found.player_id;
  const dataUrl = (found.data_path ? '/' + String(found.data_path).replace(/^\/+/, '') : `/players_atp/data/${slugLower}.json`);
  loading.textContent = 'Loading player data…';

  let combined = await fetchJsonSafe(dataUrl);
  if(!combined){
    const legacyMeta = await fetchJsonSafe(`/players_atp/${pid}.meta.json`);
    const legacyMatches = await fetchJsonSafe(`/players_atp/${pid}.matches.json`);
    if(legacyMeta || legacyMatches){
      combined = {
        player_id: pid,
        name: (legacyMeta && legacyMeta.name) || found.name || pid,
        slug: legacyMeta && legacyMeta.slug ? legacyMeta.slug : (found.slug || `${pid.toLowerCase()}`),
        country: legacyMeta && legacyMeta.country ? legacyMeta.country : found.country || null,
        summary: legacyMeta && legacyMeta.summary ? legacyMeta.summary : null,
        matches: legacyMatches && legacyMatches.matches ? legacyMatches.matches : [],
        matches_by_year: {},
        trophies: [],
        best_by_year: {},
        total_points_by_year: {}
      };
    } else { loading.textContent = 'No data available for this player.'; return; }
  }

  // normalize
  combined.player_id = combined.player_id || pid;
  combined.name = combined.name || found.name || pid;
  combined.slug = combined.slug || slugLower;
  combined.matches_by_year = combined.matches_by_year || {};
  combined.trophies = combined.trophies || [];
  combined.best_by_year = combined.best_by_year || {};
  combined.total_points_by_year = combined.total_points_by_year || {};

  // Header rendering
  document.getElementById('player-name').textContent = combined.name;
  const flag = countryCodeToFlag(combined.country || found.country || '');
  const countryDiv = document.getElementById('player-country');
  countryDiv.innerHTML = `${flag ? '<span class="country-flag">' + flag + '</span>' : ''} ${combined.country ? escapeHtml(combined.country) : ''}`;

  // birth and place show as small meta
  const birthDiv = document.getElementById('player-birth');
  let birthText = '';
  if(combined.birthdate) birthText += `Born ${combined.birthdate}`;
  if(combined.birthplace) birthText += (birthText ? ' • ' : '') + combined.birthplace;
  birthDiv.textContent = birthText;

  // attrs (no player ID)
  const attrs = document.getElementById('player-attrs');
  attrs.innerHTML = '';
  const addAttr = (label, val) => {
    if(!val && val !== 0) return;
    const d = document.createElement('div'); d.className = 'attr';
    d.innerHTML = `<div style="font-size:12px;color:var(--muted);font-weight:700">${escapeHtml(label)}</div><div style="margin-top:6px;font-weight:700">${escapeHtml(String(val))}</div>`;
    attrs.appendChild(d);
  };
  addAttr('Birth date', combined.birthdate || '');
  addAttr('Birth place', combined.birthplace || '');
  if(combined.height_cm) addAttr('Height (m)', combined.height_cm);
  if(combined.hand) addAttr('Plays', combined.hand);
  if(combined.backhand) addAttr('Backhand', combined.backhand);
  if(combined.best_rank) addAttr('Best rank', combined.best_rank);
  if(combined.first_appearance) addAttr('First appearance', combined.first_appearance);
  if(combined.last_appearance) addAttr('Last appearance', combined.last_appearance);

  // image
  const imageWrap = document.getElementById('player-image');
  imageWrap.innerHTML = '';
  if(combined.image){
    const img = document.createElement('img'); img.src = combined.image; img.alt = combined.name; img.loading='lazy';
    imageWrap.appendChild(img);
  } else imageWrap.innerHTML = '<div style="color:var(--muted);">No image</div>';

  // Matches by year
  const matchesContainer = document.getElementById('matches-container');
  let mby = combined.matches_by_year || {};

  // fallback grouping client-side if needed -> STRICT: use start_date property exclusively
  if(Object.keys(mby).length === 0 && Array.isArray(combined.matches) && combined.matches.length){
    const map = {};
    for(const m of combined.matches){
      const y = (m.event_year || '').toString();
      if(!map[y]) map[y] = {};
      const name = (m.tourney_name || '').trim();
      const sd = (m.start_date || '').trim(); // strict
      const key = (m.event_id ? m.event_id : 'NOID') + '||' + name + '||' + sd;
      if(!map[y][key]) map[y][key] = { event_id: m.event_id || '', tourney_name: name, category: m.category || '', surface: m.surface || '', start_date: sd, matches: [] };
      map[y][key].matches.push(m);
    }
    const conv = {};
    for(const y in map){
      conv[y] = Object.values(map[y]).map(t => {
        t.matches = t.matches.sort((a,b)=> {
          const oa = a.start_date || '';
          const ob = b.start_date || '';
          if(oa < ob) return 1;
          if(oa > ob) return -1;
          return 0;
        });
        return t;
      });
    }
    mby = conv;
  }

  const years = Object.keys(mby).filter(k=>k!=='').sort((a,b)=>parseInt(b||0)-parseInt(a||0));
  if(mby[''] && !years.includes('')) years.push('');
  const yearSelect = document.getElementById('year-select');
  yearSelect.innerHTML = '';
  if(years.length === 0){
    matchesContainer.innerHTML = '<div class="no-data">No matches available.</div>';
  } else {
    for(const y of years){
      const opt = document.createElement('option'); opt.value = y; opt.textContent = y ? y : 'Unknown year'; yearSelect.appendChild(opt);
    }
    const sel = years[0]; yearSelect.value = sel; renderMatchesForYear(sel);
  }

  function renderMatchesForYear(year){
    matchesContainer.innerHTML = '';
    const tournaments = (mby[year] || []);
    if(!tournaments || tournaments.length === 0){
      matchesContainer.innerHTML = '<div class="no-data">No matches for this year.</div>'; return;
    }
    // ensure tournaments sorted by start_date desc then name
    tournaments.sort((a,b) => {
      const aDate = a.start_date || '';
      const bDate = b.start_date || '';
      if(aDate && bDate){
        if(aDate < bDate) return 1;
        if(aDate > bDate) return -1;
      } else if(aDate && !bDate) return -1;
      else if(!aDate && bDate) return 1;
      return (a.tourney_name || '').localeCompare(b.tourney_name || '');
    });

    for(const t of tournaments){
      const div = document.createElement('div'); div.className = 'tourney';
      const head = document.createElement('div'); head.className = 'tourney-head';
      const left = document.createElement('div'); left.className = 'tourney-left';
      const title = document.createElement('div'); title.innerHTML = `<div class="tourney-title">${escapeHtml(t.tourney_name || 'Tournament')}</div><div class="tourney-meta">${escapeHtml(t.category || '')}</div>`;
      left.appendChild(title);

      const right = document.createElement('div');
      const surf = document.createElement('div'); surf.className = 'surf ' + (surfaceClass(t.surface || ''));
      surf.textContent = surfaceLabel(t.surface || '');
      right.appendChild(surf);

      head.appendChild(left); head.appendChild(right);
      div.appendChild(head);

      // matches inside tournament: order F > SF > QF > R16 > R32 > R64 > others; then by start_date desc
      const mm = (t.matches || []).slice();
      mm.sort((a,b) => {
        const order = {'W':0,'F':0,'SF':1,'QF':2,'R16':3,'R32':4,'R64':5,'R128':6,'RR':7};
        const ra = (a.round || '').toUpperCase();
        const rb = (b.round || '').toUpperCase();
        const oa = (order[ra] !== undefined) ? order[ra] : 99;
        const ob = (order[rb] !== undefined) ? order[rb] : 99;
        if(oa !== ob) return oa - ob;
        // then by start_date desc
        const da = a.start_date || '';
        const db = b.start_date || '';
        if(da < db) return 1;
        if(da > db) return -1;
        return 0;
      });

      const list = document.createElement('div'); list.className = 'match-list';
      for(const m of mm){
        const isWin = m.is_win === true;
        const line = document.createElement('div'); line.className = 'match ' + (isWin ? 'win' : (m.is_win === false ? 'loss' : ''));
        // opponent (bold) and score (bold)
        let oppHtml = escapeHtml(m.opponent || '—');
        if(m.opponent_id){
          const href = `/players_atp/${String(m.opponent_id).toLowerCase()}`;
          oppHtml = `<a href="${href}" style="text-decoration:none;color:inherit"><strong>${escapeHtml(m.opponent || m.opponent_id)}</strong></a>`;
        } else {
          oppHtml = `<strong>${escapeHtml(m.opponent || '—')}</strong>`;
        }
        const scoreHtml = `<span class="score">${escapeHtml(m.score || '')}</span>`;
        const dateTxt = dateToDDMonth(m.start_date || '');
        const roundTxt = escapeHtml(m.round || '');
        line.innerHTML = `<div class="opponent">${oppHtml}</div>
                          <div class="score">${scoreHtml}</div>
                          <div class="date">${escapeHtml(dateTxt)}</div>
                          <div class="round">${escapeHtml(roundTxt)}</div>`;
        list.appendChild(line);
      }
      div.appendChild(list);
      matchesContainer.appendChild(div);
    }
  }

  yearSelect.addEventListener('change', (e)=> renderMatchesForYear(e.target.value));

  // TROPHIES and BEST
  const trophiesList = document.getElementById('trophies-list'); trophiesList.innerHTML = '';
  const trophies = (combined.trophies || []).slice();
  if(!trophies.length) trophiesList.innerHTML = '<div class="no-data">No titles recorded.</div>';
  else {
    for(const t of trophies){
      const n = document.createElement('div'); n.className = 'trophy';
      n.innerHTML = `<div class="left"><div style="font-size:20px">🏆</div><div><div class="title">${escapeHtml(t.tourney_name || '')}</div><div class="tourney-meta">${escapeHtml(t.category || '')} • ${escapeHtml(t.event_year || '')}</div></div></div>
                     <div class="points">${escapeHtml(String(t.points || 0))} pts</div>`;
      trophiesList.appendChild(n);
    }
  }

  const bestSelect = document.getElementById('best-year-select'); bestSelect.innerHTML = '';
  const bestYears = Object.keys(combined.best_by_year || {}).filter(k => k!=='').sort((a,b)=>parseInt(b||0)-parseInt(a||0));
  if((combined.best_by_year || {})['']) bestYears.push('');
  const bestList = document.getElementById('best-list');
  if(bestYears.length === 0){
    bestSelect.disabled = true; bestSelect.innerHTML = '<option>—</option>'; bestList.innerHTML = '<div class="no-data">No best performances available.</div>';
  } else {
    for(const y of bestYears){ const o = document.createElement('option'); o.value = y; o.textContent = y ? y : 'Unknown year'; bestSelect.appendChild(o); }
    const def = bestYears[0]; bestSelect.value = def; renderBestForYear(def);
  }

  function renderBestForYear(y){
    bestList.innerHTML = '';
    const arr = (combined.best_by_year && combined.best_by_year[y]) ? combined.best_by_year[y] : [];
    const total = (combined.total_points_by_year && combined.total_points_by_year[y]) ? combined.total_points_by_year[y] : null;
    if(!arr.length){ bestList.innerHTML = '<div class="no-data">No best performances for this year.</div>'; return; }
    if(total !== null){ const tot = document.createElement('div'); tot.className='no-data'; tot.style.marginBottom='8px'; tot.textContent = `Total points for ${y}: ${total}`; bestList.appendChild(tot); }
    for(const it of arr){
      const div = document.createElement('div'); div.className='best-item';
      div.innerHTML = `<div style="display:flex;gap:10px;align-items:center;"><div style="font-size:18px">🏅</div><div><div style="font-weight:800">${escapeHtml(it.tourney_name || it.event_id || '')}</div><div style="color:var(--muted);font-size:13px">${escapeHtml(it.category||'')} • ${escapeHtml(it.surface||'')}</div></div></div>
                       <div style="text-align:right"><div style="font-weight:900">${escapeHtml(String(it.points || 0))} pts</div><div style="color:var(--muted);font-size:13px">Round: ${escapeHtml(it.round || '—')}</div></div>`;
      bestList.appendChild(div);
    }
  }

  bestSelect.addEventListener('change', (e) => renderBestForYear(e.target.value));

  // show page
  loading.style.display = 'none'; root.style.display = 'block';

  // tabs behavior
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const t = btn.getAttribute('data-target');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      const panel = document.getElementById(t);
      if(panel) { panel.classList.add('active'); }
    });
  });

})();
</script>
</body>
</html>

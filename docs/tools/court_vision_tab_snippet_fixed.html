<style>
  .cv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
  .cv-toolbar,.cv-subtoolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
  .cv-card{border:1px solid #e6e6e6;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:12px}
  .cv-card h3{margin:0 0 8px;font-size:16px}
  .cv-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
  .cv-filter{border:1px solid #e9e9e9;border-radius:10px;padding:8px;background:#fafafa}
  .cv-filter label{display:block;font-size:12px;font-weight:700;color:#444;margin-bottom:6px}
  .cv-filter select,.cv-filter input[type="range"],.cv-filter input[type="number"]{width:100%;box-sizing:border-box}
  .cv-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cv-plot{height:560px;width:100%}
  .cv-plot-sm{height:520px;width:100%}
  .cv-sidebar{position:sticky;top:12px}
  .cv-details{margin-top:12px}
  .cv-kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}
  .cv-kv div:nth-child(odd){color:#666}
  .cv-pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef4ff;color:#174ea6;font-size:12px;font-weight:700;margin:2px 4px 0 0}
  .cv-note{font-size:12px;color:#666;line-height:1.35}
  .cv-mini{font-size:12px;color:#666}
  .cv-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cv-muted{color:#666;font-size:13px}
  .cv-multiselect{max-height:110px;overflow:auto;border:1px solid #ddd;border-radius:8px;background:#fff;padding:6px}
  .cv-multiselect label{display:flex;gap:6px;align-items:center;font-size:13px;margin:4px 0}
  .cv-section-title{font-size:13px;font-weight:700;margin:0 0 6px}
  .cv-tabs-lite{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
  .cv-tabs-lite button,.cv-btn{padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}
  .cv-tabs-lite button.active,.cv-btn.active{background:#1366d6;color:#fff;border-color:#1366d6}
  .cv-badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#f3f4f6;font-size:12px;margin-right:6px}
  .cv-empty{padding:16px;color:#666;font-size:13px}
  .cv-legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:#666}
  .cv-legend i{width:10px;height:10px;display:inline-block;border-radius:999px;margin-right:4px;border:1px solid rgba(0,0,0,.1)}
  @media (max-width:1100px){.cv-wrap{grid-template-columns:1fr}.cv-sidebar{position:static}.cv-grid-2{grid-template-columns:1fr}.cv-filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script>
(function(){
  const CV = window.CV = window.CV || {};

  const CATEGORY_ORDER = ['SERVICE','RETURN','GAME'];
  const CATEGORY_LABELS = { SERVICE:'SERVICE', RETURN:'RETURN', GAME:'GAME' };

  const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
  const uniq = arr => Array.from(new Set(arr.filter(v => v !== null && v !== undefined && String(v).trim() !== '')));
  const lower = v => String(v ?? '').trim().toLowerCase();
  const title = v => String(v ?? '').replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  const clean = v => String(v ?? '').trim();
  function normalizeToken(s){
    return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  }
  function getNameParts(player){
    const raw = String(player?.name || player?.fullname || player?.player_name || player?.player || '').trim();
    const parts = raw.split(/\s+/).filter(Boolean);
    return {
      raw,
      first: normalizeToken(parts[0] || ''),
      last: normalizeToken(parts[parts.length - 1] || ''),
      pid: normalizeToken(player?.player_id || player?.id || ''),
      slug: normalizeToken(player?.slug || player?.name_slug || '')
    };
  }

  function buildCourtVisionCandidates(player){
    const { first, last, pid, slug } = getNameParts(player);
    const bases = [];
    if (first && last && pid) bases.push(`${first}_${last}_${pid}_court_vision.json`);
    if (first && last && pid) bases.push(`${pid}_${first}_${last}_court_vision.json`);
    if (first && last) bases.push(`${first}_${last}_court_vision.json`);
    if (slug) bases.push(`${slug}_court_vision.json`);
    if (pid) bases.push(`${pid}_court_vision.json`);
    if (first && last && pid) bases.push(`${first}_${last}_${pid}.json`);
    if (slug) bases.push(`${slug}.json`);
    if (pid) bases.push(`${pid}.json`);
    return uniq(bases.flatMap(b => [ `/tools/${b}`, `/tools/court_vision_post_treated/${b}` ]));
  }

  async function fetchJsonSafe(url){
    try{
      const r = await fetch(url, { cache:'no-store' });
      if(!r.ok) return null;
      const t = await r.text();
      const cleanTxt = t.replace(/\bNaN\b/g, 'null');
      return JSON.parse(cleanTxt);
    }catch(e){
      return null;
    }
  }

  async function tryCandidatesSequential(urls){
    for (const url of urls){
      const d = await fetchJsonSafe(url);
      if (d) return { data:d, url };
    }
    return null;
  }

  function normalizeOutcome(v){
    const s = lower(v);
    if(!s) return 'ALL';
    if (['won','win','point_won','point won','gagné','gagne','winner'].some(x => s.includes(x))) return 'Won';
    if (['lost','loss','point_lost','point lost','perdu','perte','error'].some(x => s.includes(x))) return 'Lost';
    return title(v);
  }

  function classifyExchange(v){
    const s = lower(v);
    const n = parseInt(String(v).match(/\d+/)?.[0] || '', 10);
    const shots = Number.isFinite(n) ? n : null;
    if (shots !== null){
      if (shots <= 5) return '<5';
      if (shots <= 10) return '6-10';
      return '>10';
    }
    if (s.includes('<=5') || s.includes('<5') || s.includes('1-4') || s.includes('1 à 4') || s.includes('moins')) return '<5';
    if (s.includes('6-10') || s.includes('6') || s.includes('10')) return '6-10';
    if (s.includes('>10') || s.includes('9+') || s.includes('11') || s.includes('plus')) return '>10';
    return 'ALL';
  }

  function extractMatches(data){
    if (Array.isArray(data?.matches)) return data.matches;
    if (Array.isArray(data?.m)) return data.m;
    return [];
  }

  function getCourtGeometry(data){
    const ct = data?.ct || {};
    if (Number.isFinite(Number(ct.x0)) && Number.isFinite(Number(ct.x1)) && Number.isFinite(Number(ct.y0)) && Number.isFinite(Number(ct.y1))){
      const xMin = Number(ct.x0), xMax = Number(ct.x1), yMin = Number(ct.y0), yMax = Number(ct.y1);
      const length = Math.abs(yMax - yMin);
      const doublesWidth = Math.abs(xMax - xMin);
      const singlesWidth = doublesWidth * 0.75;
      return {
        length,
        singlesWidth,
        doublesWidth,
        serviceLineFromNet: length * 0.27,
        xMin, xMax, yMin, yMax
      };
    }

    const g = data?.court_dimensions || data?.court || data?.geometry || {};
    const length = num(g.length || g.full_length || g.court_length || 23.77) || 23.77;
    const singlesWidth = num(g.singles_width || g.playing_width || g.width || 8.23) || 8.23;
    const doublesWidth = num(g.doubles_width || g.full_width || 10.97) || 10.97;
    const serviceLineFromNet = num(g.service_line_from_net || g.service_line || 6.40) || 6.40;
    return {
      length,
      singlesWidth,
      doublesWidth,
      serviceLineFromNet,
      xMin: -(doublesWidth / 2),
      xMax: (doublesWidth / 2),
      yMin: -(length / 2),
      yMax: (length / 2)
    };
  }

  function getCourtShapes(geo){
    const xL = -geo.doublesWidth / 2, xR = geo.doublesWidth / 2;
    const yB = -geo.length / 2, yT = geo.length / 2;
    const xLs = -geo.singlesWidth / 2, xRs = geo.singlesWidth / 2;
    const ySvc = geo.serviceLineFromNet;
    return [
      {type:'rect', xref:'x', yref:'y', x0:xL, x1:xR, y0:yB, y1:yT, line:{color:'#fff', width:2}, fillcolor:'#1f5fd1'},
      {type:'line', xref:'x', yref:'y', x0:xL, x1:xR, y0:0, y1:0, line:{color:'#fff', width:3}},
      {type:'line', xref:'x', yref:'y', x0:xL, x1:xR, y0:ySvc, y1:ySvc, line:{color:'#fff', width:2}},
      {type:'line', xref:'x', yref:'y', x0:xL, x1:xR, y0:-ySvc, y1:-ySvc, line:{color:'#fff', width:2}},
      {type:'line', xref:'x', yref:'y', x0:xLs, x1:xLs, y0:yB, y1:yT, line:{color:'#fff', width:2}},
      {type:'line', xref:'x', yref:'y', x0:xRs, x1:xRs, y0:yB, y1:yT, line:{color:'#fff', width:2}},
      {type:'line', xref:'x', yref:'y', x0:xL, x1:xR, y0:yB, y1:yB, line:{color:'#fff', width:2}},
      {type:'line', xref:'x', yref:'y', x0:xL, x1:xR, y0:yT, y1:yT, line:{color:'#fff', width:2}},
      {type:'line', xref:'x', yref:'y', x0:0, x1:0, y0:-1.1, y1:1.1, line:{color:'#fff', width:2, dash:'dot'}}
    ];
  }

  function avgOf(arr, fn){
    const vals = arr.map(fn).map(num).filter(v => v !== null);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }

  function topCounts(items, key, limit=5){
    const m = new Map();
    items.forEach(it => {
      const v = String(it?.[key] ?? '').trim();
      if(!v) return;
      m.set(v, (m.get(v) || 0) + 1);
    });
    return Array.from(m.entries()).sort((a,b)=>b[1]-a[1]).slice(0, limit).map(([label, count]) => ({label, count}));
  }

  function summarizeCell(cellEvents){
    const e = cellEvents || [];
    return {
      count: e.length,
      topServiceTypes: topCounts(e.filter(x=>x.category==='SERVICE'), 'service_type'),
      topPlacements: topCounts(e.filter(x=>x.category==='SERVICE'), 'placement'),
      topZones: topCounts(e.filter(x=>x.category==='SERVICE'), 'zone'),
      topShots: topCounts(e.filter(x=>x.category==='GAME'), 'shot'),
      outcomes: topCounts(e, 'point_outcome'),
      avgSpeed: avgOf(e, x => x.speed_kmh ?? x.speed_mph),
      avgHeight: avgOf(e, x => x.height),
      avgSpin: avgOf(e, x => x.spin),
      categories: topCounts(e, 'category')
    };
  }

  function setDetails(root, evOrCell, isCell=false){
    const box = root.querySelector('#cv-details');
    if(!box) return;
    if(!evOrCell){
      box.innerHTML = '<div class="cv-empty">Click a ball or a density cell to inspect its details.</div>';
      return;
    }
    if(!isCell){
      const ev = evOrCell;
      box.innerHTML = `
        <div class="cv-card">
          <div class="cv-section-title">Selected ball</div>
          <div class="cv-kv">
            <div>Category</div><div><span class="cv-pill">${esc(ev.category)}</span>${esc(ev.subcategory)}</div>
            <div>Match</div><div>${esc(ev.match?.match_id || ev.match?.m || ev.match?.id || '')}</div>
            <div>Outcome</div><div>${esc(ev.point_outcome)}</div>
            <div>X / Y</div><div>${ev.x === null ? '—' : ev.x.toFixed(2)} / ${ev.y === null ? '—' : ev.y.toFixed(2)}</div>
            <div>Speed</div><div>${ev.speed_kmh ?? ev.speed_mph ?? '—'}</div>
            <div>Height</div><div>${ev.height ?? '—'}</div>
            <div>Spin</div><div>${ev.spin ?? '—'}</div>
            <div>Exchange</div><div>${esc(ev.exchange_bucket)}</div>
            <div>Service type</div><div>${esc(ev.service_type || '—')}</div>
            <div>Placement</div><div>${esc(ev.placement || '—')}</div>
            <div>Zone</div><div>${esc(ev.zone || '—')}</div>
            <div>Shot</div><div>${esc(ev.shot || '—')}</div>
          </div>
          <div style="margin-top:10px" class="cv-note">${esc(ev.shot_description || '')}</div>
        </div>`;
      return;
    }

    const c = evOrCell;
    const sum = summarizeCell(c.events || []);
    const pills = arr => arr.length ? arr.map(x => `<span class="cv-pill">${esc(x.label)} (${x.count})</span>`).join(' ') : '<span class="cv-muted">—</span>';
    box.innerHTML = `
      <div class="cv-card">
        <div class="cv-section-title">Density cell</div>
        <div class="cv-kv">
          <div>Probability</div><div><strong>${((c.prob || 0)*100).toFixed(2)}%</strong></div>
          <div>Events</div><div><strong>${c.events.length}</strong></div>
          <div>Avg speed</div><div>${sum.avgSpeed ?? '—'}</div>
          <div>Avg height</div><div>${sum.avgHeight ?? '—'}</div>
          <div>Avg spin</div><div>${sum.avgSpin ?? '—'}</div>
          <div>Top categories</div><div>${pills(sum.categories)}</div>
          <div>Top outcomes</div><div>${pills(sum.outcomes)}</div>
          <div>Top service types</div><div>${pills(sum.topServiceTypes)}</div>
          <div>Top placements</div><div>${pills(sum.topPlacements)}</div>
          <div>Top zones</div><div>${pills(sum.topZones)}</div>
          <div>Top shots</div><div>${pills(sum.topShots)}</div>
        </div>
      </div>`;
  }

  function extractEvents(data){
    const matches = extractMatches(data);
    const matchMap = new Map();
    matches.forEach((m, i) => {
      const id = String(m.match_id || m.m || m.id || i);
      matchMap.set(id, m);
      if(m.m) matchMap.set(String(m.m), m);
    });

    // Compact schema: top-level e array
    if(Array.isArray(data?.e) && data.e.length){
      return data.e.map((ev, idx) => {
        const match = matchMap.get(String(ev.m)) || matchMap.get(String(ev.match_id)) || {};
        const categoryRaw = ev.s ?? ev.origin?.source_category_base ?? ev.origin?.source_category ?? ev.category ?? '';
        const category = String(categoryRaw).toUpperCase().includes('SERVICE') ? 'SERVICE'
          : (String(categoryRaw).toUpperCase().includes('RET') ? 'RETURN' : 'GAME');
        const subcategory = String(ev.c ?? ev.origin?.source_category ?? ev.category ?? 'General').replace(/^\d+\s*/,'').trim() || 'General';
        return {
          id: ev.id || `${idx}`,
          match: {
            match_id: match.m || match.match_id || match.id || '',
            opponent: match.o || match.opponent || '',
            tour: match.t || match.tour || '',
            year: match.y || match.year || '',
            round_id: match.r || match.round_id || '',
            source_file: match.sf || match.source_file || '',
            source_path: match.u || match.source_path || ''
          },
          category,
          subcategory,
          point_outcome: normalizeOutcome(ev.o),
          x: num(ev.x),
          y: num(ev.y),
          speed_mph: num(ev.v),
          speed_kmh: num(ev.v),
          height: num(ev.h),
          spin: num(ev.r),
          exchange_bucket: classifyExchange(ev.rb),
          service_type: clean(ev.st),
          placement: clean(ev.sp),
          zone: clean(ev.z),
          shot: clean(ev.sh),
          kind: ev.k || '',
          shot_description: ev.t?.sd || '',
          tooltip: ev.t || {},
          origin: ev.src || {},
          ball: ev.g || null,
          raw: ev
        };
      }).filter(ev => ev.x !== null && ev.y !== null);
    }

    // Existing verbose schema
    const out = [];
    matches.forEach((m, matchIndex) => {
      const matchInfo = {
        match_id: m.match_id || m.id || m.m || `match_${matchIndex}`,
        opponent: m.opponent || m.opponent_half_player || m.o || '',
        tour: m.tour || m.t || '',
        year: m.year || m.event_year || m.y || null,
        round_id: m.round_id || m.r || '',
        source_file: m.source_file || m.sf || '',
        source_path: m.source_path || m.u || ''
      };
      const candidateArrays = [m.events, m.points, m.shots, m.own_half_raw, m.opponent_half_raw];
      candidateArrays.filter(Array.isArray).forEach(arr => {
        arr.forEach((item, idx) => {
          if(!item || typeof item !== 'object') return;
          const event = item.event || item;
          const origin = event.origin || item.origin || {};
          const tooltip = event.tooltip || item.tooltip || {};
          const details = tooltip.details || event.details || item.details || {};
          const ball = event.ball || item.ball || null;
          const x = num(event.x ?? event.x_coord ?? event.court_x ?? event.impact_x ?? event.ball_x ?? ball?.x);
          const y = num(event.y ?? event.y_coord ?? event.court_y ?? event.impact_y ?? event.ball_y ?? ball?.y);
          if (x === null || y === null) return;
          const rawCategory = String(origin.source_category_base || origin.source_category || event.category || item.category || '').trim();
          const category = rawCategory ? rawCategory.split(' ')[0].toUpperCase().replace(/^RETOUR$/, 'RETURN').replace(/^JEU$/, 'GAME').replace(/^SERVICE$/, 'SERVICE') : 'GAME';
          const subcategory = String(origin.source_category || event.subcategory || item.subcategory || rawCategory || 'General').replace(/^\d+\s*/,'').trim();
          out.push({
            id: `${matchInfo.match_id}_${origin.idx ?? idx}_${out.length}`,
            match: matchInfo,
            category: category || 'GAME',
            subcategory: subcategory || 'General',
            point_outcome: normalizeOutcome(event.point_outcome ?? item.point_outcome ?? item.outcome ?? details.point_outcome),
            x,
            y,
            speed_mph: num(tooltip.speed_mph ?? details.speed_mph ?? details.Speed?.mph),
            speed_kmh: num(tooltip.speed_kmh ?? details.speed_kmh ?? details.Speed?.kmh),
            height: num(details.height ?? details.Height ?? tooltip.height ?? item.height),
            spin: num(details.spin ?? details.rotation ?? details.spin_rpm ?? tooltip.spin ?? item.spin),
            exchange_bucket: classifyExchange(details["Longueur de l'échange"] ?? details.exchange_length ?? tooltip.exchange_length ?? item.exchange_length),
            service_type: clean(details["Type de service"] ?? details.service_type ?? tooltip.service_type),
            placement: clean(details["Placement du service"] ?? details.placement ?? tooltip.placement),
            zone: clean(details["Zone"] ?? details.zone ?? tooltip.zone),
            shot: clean(details["Coup"] ?? details.shot ?? tooltip.shot),
            kind: event.kind || item.kind || '',
            shot_description: tooltip.shot_description || event.shot_description || item.shot_description || '',
            tooltip,
            origin,
            ball,
            raw: item
          });
        });
      });
    });
    return out;
  }

  function renderCourtVision(data, targetDiv, opts = {}){
    const log = (msg) => {
      console.log('[CourtVision]', msg);
      try {
        const dbg = targetDiv.querySelector('#cv-debug');
        if(dbg){
          const line = document.createElement('div');
          line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
          dbg.appendChild(line);
        }
      } catch(e) {}
      if(typeof opts.debug === 'function') opts.debug(msg);
    };

    const geo = getCourtGeometry(data);
    const events = extractEvents(data);
    log(`Extracted events: ${events.length}`);
    const subcategories = uniq(events.map(e => e.subcategory));
    const serviceTypes = uniq(events.filter(e => e.category === 'SERVICE').map(e => e.service_type));
    const placements = uniq(events.filter(e => e.category === 'SERVICE').map(e => e.placement));
    const zones = uniq(events.filter(e => e.category === 'SERVICE').map(e => e.zone));
    const shots = uniq(events.filter(e => e.category === 'GAME').map(e => e.shot));

    targetDiv.innerHTML = `
      <div class="cv-card">
        <div class="cv-row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <h3>Court Vision</h3>
            <div class="cv-muted">Interactive tennis court with ball view and density view.</div>
          </div>
          <div class="cv-legend">
            <span><i style="background:#173bff"></i>Low</span>
            <span><i style="background:#ffd84d"></i>Medium</span>
            <span><i style="background:#d7191c"></i>High</span>
          </div>
        </div>

        <div class="cv-filters">
          <div class="cv-filter"><label>Category</label><select id="cv-category"><option value="ALL">All</option>${CATEGORY_ORDER.map(c=>`<option value="${c}">${CATEGORY_LABELS[c]}</option>`).join('')}</select></div>
          <div class="cv-filter"><label>Subcategory</label><select id="cv-subcategory"><option value="ALL">All</option>${subcategories.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
          <div class="cv-filter"><label>Point outcome</label><select id="cv-outcome"><option value="ALL">All</option><option value="Won">Won</option><option value="Lost">Lost</option></select></div>
          <div class="cv-filter"><label>Exchange length</label><select id="cv-exchange"><option value="ALL">All</option><option value="<5">Less than 5</option><option value="6-10">6 to 10</option><option value=">10">More than 10</option></select></div>

          <div class="cv-filter"><label>Service type</label><div class="cv-multiselect" id="cv-service-types">${serviceTypes.map(v=>`<label><input type="checkbox" value="${esc(v)}">${esc(v)}</label>`).join('')}</div></div>
          <div class="cv-filter"><label>Service placement</label><div class="cv-multiselect" id="cv-placements">${placements.map(v=>`<label><input type="checkbox" value="${esc(v)}">${esc(v)}</label>`).join('')}</div></div>
          <div class="cv-filter"><label>Zone</label><div class="cv-multiselect" id="cv-zones">${zones.map(v=>`<label><input type="checkbox" value="${esc(v)}">${esc(v)}</label>`).join('')}</div></div>
          <div class="cv-filter"><label>Shot</label><div class="cv-multiselect" id="cv-shots">${shots.map(v=>`<label><input type="checkbox" value="${esc(v)}">${esc(v)}</label>`).join('')}</div></div>

          <div class="cv-filter"><label>Speed min / max</label><div class="cv-row"><input id="cv-speed-min" type="number" step="0.1" placeholder="min"><input id="cv-speed-max" type="number" step="0.1" placeholder="max"></div></div>
          <div class="cv-filter"><label>Height min / max</label><div class="cv-row"><input id="cv-height-min" type="number" step="0.1" placeholder="min"><input id="cv-height-max" type="number" step="0.1" placeholder="max"></div></div>
          <div class="cv-filter"><label>Spin min / max</label><div class="cv-row"><input id="cv-spin-min" type="number" step="0.1" placeholder="min"><input id="cv-spin-max" type="number" step="0.1" placeholder="max"></div></div>
          <div class="cv-filter"><label>Ball color</label><select id="cv-color-mode"><option value="category">Category</option><option value="point_outcome">Point outcome</option><option value="speed">Speed</option><option value="height">Height</option><option value="spin">Spin</option></select></div>

          <div class="cv-filter"><label>Density mode</label><div class="cv-row"><label style="font-size:13px"><input id="cv-density-3d" type="checkbox"> 3D</label><select id="cv-density-metric"><option value="speed">Speed</option><option value="height">Height</option><option value="spin">Spin</option></select></div></div>
        </div>
      </div>

      <div class="cv-wrap" style="margin-top:12px">
        <div>
          <div class="cv-grid-2">
            <div class="cv-card"><div class="cv-section-title">All balls</div><div id="cv-balls-plot" class="cv-plot"></div></div>
            <div class="cv-card"><div class="cv-section-title">Density map</div><div id="cv-density-plot" class="cv-plot"></div></div>
          </div>
        </div>
        <div class="cv-sidebar">
          <div class="cv-card">
            <div class="cv-section-title">Selected item</div>
            <div id="cv-details" class="cv-details"><div class="cv-empty">Click a ball or a density cell to inspect its details.</div></div>
            <div id="cv-debug" class="cv-mini" style="margin-top:10px;max-height:140px;overflow:auto;border:1px dashed #ddd;background:#fcfcfc;padding:8px"></div>
          </div>
        </div>
      </div>`;

    const $ = sel => targetDiv.querySelector(sel);
    const listeners = ['#cv-category','#cv-subcategory','#cv-outcome','#cv-exchange','#cv-speed-min','#cv-speed-max','#cv-height-min','#cv-height-max','#cv-spin-min','#cv-spin-max','#cv-color-mode','#cv-density-3d','#cv-density-metric'];
    listeners.forEach(sel => $(sel).addEventListener('change', () => update()));
    ['#cv-service-types','#cv-placements','#cv-zones','#cv-shots'].forEach(sel => $(sel).querySelectorAll('input[type="checkbox"]').forEach(cb => cb.addEventListener('change', update)));

    function buildState(){
      return {
        category: $('#cv-category').value,
        subcategory: $('#cv-subcategory').value,
        outcome: $('#cv-outcome').value,
        exchange: $('#cv-exchange').value,
        serviceTypes: Array.from($('#cv-service-types').querySelectorAll('input:checked')).map(cb => cb.value),
        placements: Array.from($('#cv-placements').querySelectorAll('input:checked')).map(cb => cb.value),
        zones: Array.from($('#cv-zones').querySelectorAll('input:checked')).map(cb => cb.value),
        shots: Array.from($('#cv-shots').querySelectorAll('input:checked')).map(cb => cb.value),
        speedMin: $('#cv-speed-min').value === '' ? null : Number($('#cv-speed-min').value),
        speedMax: $('#cv-speed-max').value === '' ? null : Number($('#cv-speed-max').value),
        heightMin: $('#cv-height-min').value === '' ? null : Number($('#cv-height-min').value),
        heightMax: $('#cv-height-max').value === '' ? null : Number($('#cv-height-max').value),
        spinMin: $('#cv-spin-min').value === '' ? null : Number($('#cv-spin-min').value),
        spinMax: $('#cv-spin-max').value === '' ? null : Number($('#cv-spin-max').value),
        colorMode: $('#cv-color-mode').value,
        densityMode3D: $('#cv-density-3d').checked,
        densityMetric: $('#cv-density-metric').value
      };
    }

    function passesFilters(ev, state){
      if(state.category !== 'ALL' && ev.category !== state.category) return false;
      if(state.subcategory !== 'ALL' && lower(ev.subcategory) !== lower(state.subcategory)) return false;
      if(state.outcome !== 'ALL' && ev.point_outcome !== state.outcome) return false;
      if(state.exchange !== 'ALL' && ev.exchange_bucket !== state.exchange) return false;
      if(state.serviceTypes.length && ev.category === 'SERVICE' && !state.serviceTypes.includes(ev.service_type || '')) return false;
      if(state.placements.length && ev.category === 'SERVICE' && !state.placements.includes(ev.placement || '')) return false;
      if(state.zones.length && ev.category === 'SERVICE' && !state.zones.includes(ev.zone || '')) return false;
      if(state.shots.length && ev.category === 'GAME' && !state.shots.includes(ev.shot || '')) return false;
      const speed = ev.speed_kmh ?? ev.speed_mph;
      if(state.speedMin !== null && speed !== null && speed < state.speedMin) return false;
      if(state.speedMax !== null && speed !== null && speed > state.speedMax) return false;
      if(state.heightMin !== null && ev.height !== null && ev.height < state.heightMin) return false;
      if(state.heightMax !== null && ev.height !== null && ev.height > state.heightMax) return false;
      if(state.spinMin !== null && ev.spin !== null && ev.spin < state.spinMin) return false;
      if(state.spinMax !== null && ev.spin !== null && ev.spin > state.spinMax) return false;
      return true;
    }

    function densityGrid(events, geo){
      const nx = 42, ny = 24;
      const xMin = geo.xMin, xMax = geo.xMax, yMin = geo.yMin, yMax = geo.yMax;
      const dx = (xMax - xMin) / nx;
      const dy = (yMax - yMin) / ny;
      const grid = Array.from({length: ny}, () => Array.from({length: nx}, () => ({count:0, events:[]})));
      const kernel = [[0.075,0.125,0.075],[0.125,0.200,0.125],[0.075,0.125,0.075]];

      for(const ev of events){
        const xi = Math.floor((ev.x - xMin) / (xMax - xMin) * nx);
        const yi = Math.floor((ev.y - yMin) / (yMax - yMin) * ny);
        if(xi < 0 || xi >= nx || yi < 0 || yi >= ny) continue;
        for(let oy=-1; oy<=1; oy++) for(let ox=-1; ox<=1; ox++){
          const xx = xi + ox, yy = yi + oy;
          if(xx < 0 || xx >= nx || yy < 0 || yy >= ny) continue;
          const w = kernel[oy+1][ox+1];
          grid[yy][xx].count += w;
          grid[yy][xx].events.push(ev);
        }
      }
      let max = 0;
      for(const row of grid) for(const c of row) max = Math.max(max, c.count);
      return {grid, nx, ny, dx, dy, max, xMin, xMax, yMin, yMax};
    }

    function renderBallPlot(root, events, geo, state){
      const plotDiv = root.querySelector('#cv-balls-plot');
      const traces = [];
      CATEGORY_ORDER.forEach(cat => {
        const arr = events.filter(e => e.category === cat);
        const metricVals = arr.map(ev => {
          if(state.colorMode === 'point_outcome') return ev.point_outcome === 'Won' ? 1 : ev.point_outcome === 'Lost' ? 0 : 0.5;
          if(state.colorMode === 'speed') return ev.speed_kmh ?? ev.speed_mph;
          if(state.colorMode === 'height') return ev.height;
          if(state.colorMode === 'spin') return ev.spin;
          return null;
        });
        const vals = metricVals.filter(v => v !== null && Number.isFinite(Number(v)));
        const min = vals.length ? Math.min(...vals) : 0;
        const max = vals.length ? Math.max(...vals) : 1;
        traces.push({
          type:'scattergl',
          mode:'markers',
          name:cat,
          x: arr.map(e=>e.x),
          y: arr.map(e=>e.y),
          customdata: arr.map(e=>JSON.stringify(e)),
          hovertemplate: '%{text}<extra></extra>',
          text: arr.map(ev => `${ev.category} · ${ev.subcategory}<br>${ev.match?.match_id || ''}<br>${ev.point_outcome || ''}<br>${ev.x?.toFixed?.(2) ?? ev.x} / ${ev.y?.toFixed?.(2) ?? ev.y}`),
          marker: {
            size: 12,
            opacity: 0.92,
            color: state.colorMode === 'category'
              ? (cat === 'SERVICE' ? '#2563eb' : cat === 'RETURN' ? '#16a34a' : '#f97316')
              : metricVals,
            cmin: min,
            cmax: max,
            colorscale: state.colorMode === 'category'
              ? undefined
              : (state.colorMode === 'point_outcome'
                  ? [[0,'#dc2626'],[0.5,'#64748b'],[1,'#16a34a']]
                  : 'Turbo'),
            showscale: state.colorMode !== 'category'
          }
        });
      });

      const layout = {
        margin:{l:20,r:20,t:20,b:20},
        paper_bgcolor:'#fff',
        plot_bgcolor:'#1f5fd1',
        xaxis:{range:[geo.xMin, geo.xMax], zeroline:false, showgrid:false, visible:false, scaleanchor:'y', scaleratio:1},
        yaxis:{range:[geo.yMin, geo.yMax], zeroline:false, showgrid:false, visible:false},
        shapes:getCourtShapes(geo),
        legend:{orientation:'h', y:-0.08},
        dragmode:'pan'
      };
      Promise.resolve(Plotly.newPlot(plotDiv, traces, layout, {displayModeBar:true, responsive:true}))
        .then(() => {
          if (typeof plotDiv.on === 'function') {
            plotDiv.on('plotly_click', ev => {
              const p = ev.points && ev.points[0];
              if(!p) return;
              const payload = typeof p.customdata === 'string' ? p.customdata : (Array.isArray(p.customdata) ? p.customdata[0] : String(p.customdata || '{}'));
              try { setDetails(root, JSON.parse(payload), false); } catch(e) { console.warn('ball parse failed', e); }
            });
          }
        })
        .catch(err => {
          console.error('Court Vision balls plot failed', err);
          const d = root.querySelector('#cv-balls-plot');
          if(d) d.innerHTML = '<div class="cv-empty">Balls plot error: ' + esc(err && err.message ? err.message : err) + '</div>';
        });
    }

    function renderDensityPlot(root, events, geo, state){
      const plotDiv = root.querySelector('#cv-density-plot');
      const density = densityGrid(events, geo);
      const z = density.grid.map(row => row.map(c => c.count / (density.max || 1)));
      const xVals = Array.from({length:density.nx}, (_,i) => density.xMin + (i + 0.5) * density.dx);
      const yVals = Array.from({length:density.ny}, (_,i) => density.yMin + (i + 0.5) * density.dy);

      if(!state.densityMode3D){
        const trace = { type:'heatmap', x:xVals, y:yVals, z:z, colorscale:[[0,'#173bff'],[0.5,'#ffd84d'],[1,'#d7191c']], zsmooth:'best', hoverongaps:false, hovertemplate:'Probability: %{z:.3f}<extra></extra>' };
        const layout = { margin:{l:20,r:20,t:20,b:20}, paper_bgcolor:'#fff', plot_bgcolor:'#1f5fd1', xaxis:{range:[geo.xMin, geo.xMax], zeroline:false, showgrid:false, visible:false, scaleanchor:'y', scaleratio:1}, yaxis:{range:[geo.yMin, geo.yMax], zeroline:false, showgrid:false, visible:false}, shapes:getCourtShapes(geo), dragmode:'pan' };
        Promise.resolve(Plotly.newPlot(plotDiv, [trace], layout, {displayModeBar:true, responsive:true}))
          .then(() => {
            if (typeof plotDiv.on === 'function') {
              plotDiv.on('plotly_click', ev => {
                const p = ev.points && ev.points[0];
                if(!p) return;
                const xi = p.pointNumber?.[0] ?? Math.floor((p.x - density.xMin) / density.dx);
                const yi = p.pointNumber?.[1] ?? Math.floor((p.y - density.yMin) / density.dy);
                const cell = density.grid[Math.max(0, Math.min(density.ny-1, yi))][Math.max(0, Math.min(density.nx-1, xi))];
                setDetails(root, {prob: cell.count/(density.max||1), events: cell.events, x:p.x, y:p.y}, true);
              });
            }
          })
          .catch(err => {
            console.error('Court Vision density plot failed', err);
            const d = root.querySelector('#cv-density-plot');
            if(d) d.innerHTML = '<div class="cv-empty">Density plot error: ' + esc(err && err.message ? err.message : err) + '</div>';
          });
        return;
      }

      const cells = [];
      for(let yi=0; yi<density.ny; yi++) for(let xi=0; xi<density.nx; xi++){
        const cell = density.grid[yi][xi];
        const x = xVals[xi], y = yVals[yi], prob = cell.count / (density.max || 1);
        const metric = state.densityMetric;
        const avgMetric = avgOf(cell.events, e =>
          metric === 'speed' ? (e.speed_kmh ?? e.speed_mph)
          : metric === 'height' ? e.height
          : metric === 'spin' ? e.spin
          : cell.count
        );
        cells.push({x, y, z: avgMetric ?? 0, prob, events: cell.events});
      }

      const trace = { type:'scatter3d', mode:'markers', x: cells.map(c=>c.x), y: cells.map(c=>c.y), z: cells.map(c=>c.z), marker:{ size:4, color: cells.map(c=>c.prob), colorscale:[[0,'#173bff'],[0.5,'#ffd84d'],[1,'#d7191c']], opacity:0.95, colorbar:{title:'Probability'} }, customdata: cells.map(c=>JSON.stringify(c)), hovertemplate:'Prob: %{marker.color:.3f}<br>x=%{x:.2f} y=%{y:.2f} z=%{z:.2f}<extra></extra>' };
      const layout = { margin:{l:0,r:0,t:0,b:0}, paper_bgcolor:'#fff', scene:{ xaxis:{range:[geo.xMin, geo.xMax], title:'Court X'}, yaxis:{range:[geo.yMin, geo.yMax], title:'Court Y'}, zaxis:{title: state.densityMetric === 'speed' ? 'Speed' : state.densityMetric === 'height' ? 'Height' : state.densityMetric === 'spin' ? 'Spin' : 'Density'} }, showlegend:false };
      Promise.resolve(Plotly.newPlot(plotDiv, [trace], layout, {displayModeBar:true, responsive:true}))
        .then(() => {
          if (typeof plotDiv.on === 'function') {
            plotDiv.on('plotly_click', ev => {
              const p = ev.points && ev.points[0];
              if(!p) return;
              const payload = typeof p.customdata === 'string' ? p.customdata : (Array.isArray(p.customdata) ? p.customdata[0] : String(p.customdata || '{}'));
              try { setDetails(root, JSON.parse(payload), true); } catch(e) { console.warn('cell parse failed', e); }
            });
          }
        })
        .catch(err => {
          console.error('Court Vision 3D plot failed', err);
          const d = root.querySelector('#cv-density-plot');
          if(d) d.innerHTML = '<div class="cv-empty">3D density plot error: ' + esc(err && err.message ? err.message : err) + '</div>';
        });
    }

    function update(){
      const state = buildState();
      const filtered = events.filter(ev => passesFilters(ev, state));
      renderBallPlot(targetDiv, filtered, geo, state);
      renderDensityPlot(targetDiv, filtered, geo, state);
      const count = targetDiv.querySelector('#cv-count');
      if(count) count.textContent = `${filtered.length} balls shown / ${events.length} total`;
      if(filtered.length === 0) setDetails(targetDiv, null, false);
    }

    const countLine = document.createElement('div');
    countLine.id = 'cv-count';
    countLine.className = 'cv-mini';
    countLine.style.margin = '8px 0 0';
    countLine.textContent = `${events.length} balls available`;
    targetDiv.querySelector('.cv-card').appendChild(countLine);

    update();
  }

  async function loadCourtVision(playerData){
    const target = document.getElementById('panel-courtvision');
    if(!target) return;
    target.innerHTML = '<div class="cv-empty">Loading Court Vision…</div>';

    const candidates = buildCourtVisionCandidates(playerData);
    const res = await tryCandidatesSequential(candidates);

    if(!res || !res.data){
      target.innerHTML = '<div class="cv-empty">Court Vision data is not available for this player.</div>';
      return;
    }
    renderCourtVision(res.data, target);
  }

  CV.buildCourtVisionCandidates = buildCourtVisionCandidates;
  CV.loadCourtVision = loadCourtVision;
  CV.renderCourtVision = renderCourtVision;
  window.initCourtVisionTab = function({ container, player, data, sourceUrl }) {
    if(!container || !data) return;
    renderCourtVision(data, container);
  };
})();
</script>

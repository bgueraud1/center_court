<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search players by birth date — Center Court</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f7f9fb; padding:2rem; }
    .card { box-shadow: 0 6px 18px rgba(20,30,60,0.06); border: none; }
    .muted { color:#6c757d; }
    #results-table tbody tr:hover { background:#f1f5f9; }
    .rank-badge { min-width:3.0rem; display:inline-block; text-align:center; }
    .small-muted { color:#6c757d; font-size:.9rem }
    .spinner { width:1.2rem; height:1.2rem; border-width:.18rem }
    .no-results { color:#6c757d; padding:1rem 0 }
    @media (max-width:575px){ .form-row { flex-direction:column } .form-row > * { width:100%; margin-bottom:.5rem } }
    pre.attempts { background:#111; color:#0f0; padding:.5rem; border-radius:.25rem; font-size:.85rem; }

    /* Added styles for circuit row backgrounds */
    .row-wta { background: #f6f0ff; } /* very light violet */
    .row-atp { background: #f0f8ff; } /* very light blue */

    /* ensure hover remains readable */
    #results-table tbody tr:hover.row-wta { background:#efe6ff; }
    #results-table tbody tr:hover.row-atp { background:#e6f3ff; }

    /* link style inside table */
    .player-link { text-decoration: none; color: inherit; }
    .player-link:hover { text-decoration: underline; color: inherit; }
  </style>
</head>
<body>
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card mb-4">
          <div class="card-body">
            <div class="d-flex align-items-center mb-3">
              <h3 class="mb-0">Search players by birth date</h3>
              <small class="ms-3 muted">ATP &amp; WTA</small>
            </div>
            <p class="small-muted">Search by day and month (year optional). Example: <strong>01</strong> + <strong>January</strong> finds all players born on January 1st, any year.</p>

            <form id="search-form" class="row g-2 align-items-end form-row">
              <div class="col-auto">
                <label class="form-label small mb-1">Day (DD)</label>
                <input id="day" class="form-control" inputmode="numeric" placeholder="DD" maxlength="2">
              </div>

              <div class="col-auto">
                <label class="form-label small mb-1">Month</label>
                <select id="month" class="form-select">
                  <option value="">— select —</option>
                  <option value="01">January</option>
                  <option value="02">February</option>
                  <option value="03">March</option>
                  <option value="04">April</option>
                  <option value="05">May</option>
                  <option value="06">June</option>
                  <option value="07">July</option>
                  <option value="08">August</option>
                  <option value="09">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>

              <div class="col-auto">
                <label class="form-label small mb-1">Year (optional)</label>
                <input id="year" class="form-control" inputmode="numeric" placeholder="YYYY" maxlength="4">
              </div>

              <div class="col-auto">
                <button id="search" class="btn btn-primary">Search</button>
                <button id="clear" type="button" class="btn btn-outline-secondary ms-2">Clear</button>
              </div>
            </form>

            <div id="status" class="mt-3 small-muted">Loading players index… <span id="loading" class="visually-hidden"><span class="spinner-border spinner spinner-border-sm spinner" role="status" aria-hidden="true"></span></span></div>

            <div id="results-area" class="mt-3" style="display:none;">
              <div class="table-responsive">
                <table id="results-table" class="table table-sm table-hover align-middle">
                  <thead class="table-light">
                    <tr>
                      <th style="width:1%">#</th>
                      <th>Name</th>
                      <th>Tour</th>
                      <th>Birth date</th>
                      <th style="width:10%">Best rank</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>

            <div id="no-results" class="no-results" style="display:none;">No players found for this date.</div>

            <!-- debug area: which URLs were tried -->
            <div id="debug" class="mt-3" style="display:none;">
              <div class="small-muted">Tried URLs (in order):</div>
              <pre id="attempts" class="attempts"></pre>
            </div>
          </div>
        </div>

        <div class="text-muted small text-center"> </div>
      </div>
    </div>
  </main>

  <script>
    // CONFIG: candidate paths to try (in this order)
    const CANDIDATE_PATHS = [
      './players_by_birth.json',
      'players_by_birth.json',
      '../tools/players_by_birth.json',
      '/docs/tools/players_by_birth.json',
      '/tools/players_by_birth.json'
    ];
    const SENTINEL = 9999999;

    // DOM
    const statusEl = document.getElementById('status');
    const loadingSpan = document.getElementById('loading');
    const resultsArea = document.getElementById('results-area');
    const resultsTbody = document.querySelector('#results-table tbody');
    const noResults = document.getElementById('no-results');
    const debugEl = document.getElementById('debug');
    const attemptsPre = document.getElementById('attempts');

    let players = [];

    function showLoading(on=true){
      if(on) loadingSpan.classList.remove('visually-hidden');
      else loadingSpan.classList.add('visually-hidden');
    }

    function pad2(v){ return v.toString().padStart(2,'0'); }

    async function tryLoadIndex(){
      statusEl.textContent = 'Loading players index…';
      showLoading(true);
      attemptsPre.textContent = '';
      debugEl.style.display = 'none';
      const tried = [];
      for(const p of CANDIDATE_PATHS){
        tried.push(p);
        attemptsPre.textContent = tried.join('\n');
        try{
          const resp = await fetch(p, {cache: "no-store"});
          if(!resp.ok){
            // record status and continue trying
            attemptsPre.textContent = tried.join('\n') + `\n→ HTTP ${resp.status} ${resp.statusText} for ${p}`;
            console.warn('Fetch failed:', p, resp.status);
            continue;
          }
          // success
          players = await resp.json();
          statusEl.textContent = `Index loaded — ${players.length.toLocaleString()} players (from ${p}).`;
          debugEl.style.display = 'none';
          showLoading(false);
          return;
        }catch(err){
          // network/fetch error — keep trying
          attemptsPre.textContent = tried.join('\n') + `\n→ fetch error for ${p}: ${err}`;
          console.warn('Fetch error for', p, err);
          continue;
        }
      }
      // if we reach here, none succeeded
      showLoading(false);
      statusEl.innerHTML = `Unable to load players_by_birth.json from any tried path. See attempted URLs below.`;
      debugEl.style.display = '';
      // Keep the attemptsPre content visible
      console.error('All candidate fetches failed. Tried:', tried);
    }

    function matchPlayer(p, day, month, year){
      if(!p.birth_date) return false;
      if(year) return p.birth_date === `${year}-${month}-${day}`;
      return p.birth_day === day && p.birth_month === month;
    }

    // Build a safe slug from name (mirror du safe_slug Python)
    function makeSlug(name){
      if(!name) return "player";
      return name.toString().trim().toLowerCase()
        .replace(/[^\w\s-]/g,'')   // remove non word chars
        .replace(/\s+/g,'-')       // spaces -> hyphens
        .replace(/^-+|-+$/g,'');   // trim leading/trailing hyphens
    }

    // Build the player URL based on circuit and available player_id.
    // Heuristics:
    //  - WTA -> /players/{player_id-}{slug}.html  (or /players/{slug}.html if no id)
    //  - ATP -> /players_atp/{player_id-}{slug}.html (or /players_atp/{slug}.html if no id)
    // You can adapt to use extensionless URLs if your deploy expects that.
    function buildPlayerUrl(p){
      const slug = makeSlug(p.full_name || "");
      const idPart = (p.player_id && p.player_id.toString().trim()) ? (p.player_id.toString().trim() + "-") : "";
      if((p.circuit || "").toUpperCase() === "WTA"){
        return `/players/${idPart}${slug}.html`;
      }
      // default to ATP-style path
      return `/players_atp/${idPart}${slug}.html`;
    }

    function renderResults(list){
      resultsTbody.innerHTML = '';
      list.forEach((r, idx) => {
        const rankDisplay = (r.best_rank && r.best_rank !== SENTINEL) ? r.best_rank : '—';
        const tr = document.createElement('tr');

        // add circuit-specific class for background color
        const circuit = (r.circuit || "").toUpperCase();
        if(circuit === "WTA") tr.classList.add('row-wta');
        else if(circuit === "ATP") tr.classList.add('row-atp');

        // build player url
        const url = buildPlayerUrl(r);

        // render
        tr.innerHTML = `
          <td class="small text-muted">${idx+1}</td>
          <td><a class="player-link" href="${escapeHtml(url)}">${escapeHtml(r.full_name)}</a></td>
          <td class="small-muted">${escapeHtml(r.circuit)}</td>
          <td class="small-muted">${escapeHtml(r.birth_date || '')}</td>
          <td><span class="badge bg-light text-dark rank-badge">${rankDisplay}</span></td>
        `;
        resultsTbody.appendChild(tr);
      });
    }

    function escapeHtml(s){
      if(!s) return '';
      return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }

    document.getElementById('search').addEventListener('click', (ev)=>{
      ev.preventDefault();
      noResults.style.display='none';
      resultsArea.style.display='none';

      let day = document.getElementById('day').value.trim();
      const month = document.getElementById('month').value.trim();
      const year = document.getElementById('year').value.trim();
      if(!day){ alert('Please enter a day (DD).'); return; }
      if(!month){ alert('Please select a month.'); return; }
      day = pad2(day);

      const matches = players.filter(p => matchPlayer(p, day, month, year ? year : null));
      if(matches.length === 0){
        noResults.style.display='block';
        statusEl.textContent = `No players found for ${day}-${month}${year ? ' / ' + year : ''}.`;
        return;
      }

      matches.sort((a,b) => (a.best_rank || SENTINEL) - (b.best_rank || SENTINEL));
      renderResults(matches);
      resultsArea.style.display = '';
      statusEl.textContent = `Found ${matches.length} players.`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('clear').addEventListener('click', ()=>{
      document.getElementById('day').value = '';
      document.getElementById('month').value = '';
      document.getElementById('year').value = '';
      resultsTbody.innerHTML = '';
      resultsArea.style.display='none';
      noResults.style.display='none';
      statusEl.textContent = 'Ready.';
    });

    // init: try load using several candidate paths
    tryLoadIndex();
  </script>
</body>
</html>

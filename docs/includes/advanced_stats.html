<!-- advanced_stats.html — fragment inserted into #panel-advanced -->
<div id="advanced-fragment" style="padding:8px;">
  <div id="advanced-loading" class="sub">Loading…</div>

  <!-- the renderer will fill #advanced-content -->
  <div id="advanced-content" style="display:none;"></div>

  <!-- optional raw JSON toggle (renderer may hook it) -->
  <div style="margin-top:10px">
    <button id="adv-raw-btn" class="tab-btn" style="padding:6px 8px">Toggle raw JSON</button>
    <div id="adv-raw" style="display:none;margin-top:8px;max-height:300px;overflow:auto;border:1px solid #eee;padding:8px;background:#fff"></div>
  </div>

  <!-- debug log area (optional) -->
  <div id="advanced-log" style="display:none;margin-top:10px;font-family:monospace;font-size:12px;color:#111;background:#fafafa;border:1px solid #eee;padding:8px;max-height:180px;overflow:auto"></div>
</div>

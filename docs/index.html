<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Center Court</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #000000;
      --panel: rgba(255,255,255,0.05);
      --panel-2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.12);
      --text: #f5f7fb;
      --muted: #a2aab9;

      --wta: #a855f7;
      --wta-2: #7c3aed;

      --atp: #3b82f6;
      --atp-2: #1d4ed8;

      --gold: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(168,85,247,0.15), transparent 28%),
        radial-gradient(circle at top right, rgba(59,130,246,0.14), transparent 28%),
        linear-gradient(180deg, #000 0%, #040405 100%);
      overflow-x: hidden;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BANNER */
    .top-banner {
      padding: 1rem 0 1.2rem;
    }

    .banner-wrap {
      position: relative;
      width: min(1400px, calc(100% - 1.2rem));
      height: 170px;
      margin: 0 auto;
    }

    .banner-shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.55));
    }

    .banner-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      transform: translateY(6px);
    }

    .brand-title {
      margin: 0;
      font-size: clamp(2.1rem, 4.8vw, 4.9rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1;
      background: linear-gradient(90deg, #ffffff 0%, #dce0ff 35%, #ffffff 70%, #d6ebff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    .brand-logo {
      margin-top: 0.55rem;
      height: 62px;
      width: auto;
      display: block;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.55));
    }

    /* MAIN GRID */
    .main-area {
      flex: 1;
      width: min(1400px, calc(100% - 1.2rem));
      margin: 0 auto;
      padding: 0.35rem 0 2rem;
      display: grid;
      grid-template-columns: 1fr 300px 1fr;
      gap: 1.4rem;
      align-items: stretch;
    }

    .side-stack {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      height: 100%;
      min-height: 100%;
    }

    .panel {
      flex: 1 1 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      position: relative;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      min-height: 220px;
    }

    .panel:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 26px 80px rgba(0,0,0,0.58);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent 38%);
      pointer-events: none;
    }

    .panel-head {
      padding: 1.25rem 1.25rem 0.6rem;
    }

    .panel-title {
      margin: 0;
      font-size: 1.24rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .panel-subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .panel-body {
      padding: 0 1.25rem 1.25rem;
    }

    .mini-grid {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.85rem;
    }

    .mini-grid.players {
      grid-template-columns: repeat(3, 1fr);
    }

    .mini-grid.rankings {
      grid-template-columns: repeat(2, 1fr);
    }

    .mini-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 0.9rem 0.75rem;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      font-weight: 800;
      letter-spacing: 0.02em;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      text-align: center;
    }

    .mini-card:hover {
      transform: translateY(-2px);
      color: #fff;
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.16);
    }

    .mini-card.wta {
      background: linear-gradient(180deg, rgba(168,85,247,0.14), rgba(168,85,247,0.07));
      border-color: rgba(168,85,247,0.28);
      box-shadow: inset 0 0 0 1px rgba(168,85,247,0.08);
    }

    .mini-card.atp {
      background: linear-gradient(180deg, rgba(59,130,246,0.14), rgba(59,130,246,0.07));
      border-color: rgba(59,130,246,0.28);
      box-shadow: inset 0 0 0 1px rgba(59,130,246,0.08);
    }

    .mini-card.neutral {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border-color: rgba(255,255,255,0.14);
    }

    /* CENTER COLUMN */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      padding-top: 0.25rem;
    }

    .calendar-link {
      width: 210px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 38%),
        linear-gradient(135deg, rgba(168,85,247,0.34), rgba(59,130,246,0.34));
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 0 0 10px rgba(255,255,255,0.02),
        0 18px 50px rgba(0,0,0,0.55),
        0 0 42px rgba(168,85,247,0.14),
        0 0 42px rgba(59,130,246,0.12);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .calendar-link:hover {
      transform: scale(1.03);
      color: #fff;
      box-shadow:
        0 0 0 10px rgba(255,255,255,0.02),
        0 22px 60px rgba(0,0,0,0.65),
        0 0 48px rgba(168,85,247,0.20),
        0 0 48px rgba(59,130,246,0.18);
    }

    .calendar-inner {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(6px);
    }

    .calendar-inner .label {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1;
    }

    .calendar-inner .sub {
      margin-top: 0.35rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.04em;
    }

    .birthday-box {
      width: 100%;
      max-width: 260px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,250,240,0.05));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 46px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .birthday-box .inner {
      padding: 1rem 1rem 0.95rem;
      border-left: 5px solid var(--gold);
    }

    .birthday-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .birthday-title {
      font-weight: 800;
      font-size: 0.95rem;
    }

    .birthday-meta {
      font-size: 0.78rem;
      color: #c7cdd8;
    }

    .birthday-content {
      font-size: 0.88rem;
      color: #e8ecf5;
      line-height: 1.35;
    }

    /* HELPERS */
    .card-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .card-link:hover {
      transform: translateX(4px);
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.16);
      color: var(--text);
    }

    .tag {
      flex: 0 0 auto;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tag-neutral {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .tag-wta {
      background: rgba(168,85,247,0.18);
      color: #f3e8ff;
    }

    .tag-atp {
      background: rgba(59,130,246,0.18);
      color: #dbeafe;
    }

    .tag-gold {
      background: rgba(251,191,36,0.18);
      color: #fff7d1;
    }

    @media (max-width: 1100px) {
      .main-area {
        grid-template-columns: 1fr;
      }

      .center-col {
        order: -1;
        padding-bottom: 0.4rem;
      }

      .banner-wrap {
        height: 155px;
      }

      .brand-logo {
        height: 54px;
      }
    }

    @media (max-width: 700px) {
      .banner-wrap {
        height: 135px;
      }

      .brand-title {
        font-size: clamp(1.6rem, 8vw, 2.5rem);
        letter-spacing: 0.09em;
      }

      .brand-logo {
        height: 46px;
      }

      .calendar-link {
        width: 180px;
      }

      .mini-grid.players,
      .mini-grid.rankings {
        grid-template-columns: 1fr;
      }

      .panel-head,
      .panel-body {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrap">

    <header class="top-banner">
      <div class="banner-wrap">
        <svg class="banner-shape" viewBox="0 0 1400 170" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(80,100,255,0.85)"/>
              <stop offset="50%" stop-color="rgba(255,255,255,0.95)"/>
              <stop offset="100%" stop-color="rgba(220,90,255,0.85)"/>
            </linearGradient>
            <linearGradient id="fillDark" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#030304"/>
              <stop offset="50%" stop-color="#060608"/>
              <stop offset="100%" stop-color="#030304"/>
            </linearGradient>
          </defs>

          <path
            d="M 90 80
               C 180 80, 265 88, 360 98
               C 475 110, 565 126, 650 138
               C 680 142, 720 142, 750 138
               C 835 126, 925 110, 1040 98
               C 1135 88, 1220 80, 1310 80
               L 1310 95
               C 1220 95, 1135 104, 1040 114
               C 925 126, 835 142, 750 154
               C 720 158, 680 158, 650 154
               C 565 142, 475 126, 360 114
               C 265 104, 180 95, 90 95
               Z"
            fill="url(#fillDark)"
            stroke="url(#edgeGlow)"
            stroke-width="2"
          />
        </svg>

        <div class="banner-content">
          <h1 class="brand-title">CENTER COURT</h1>
          <img class="brand-logo" src="logo.png" alt="Center Court logo">
        </div>
      </div>
    </header>

    <main class="main-area">

      <section class="side-stack">
        <div class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Players</h2>
            <p class="panel-subtitle">ATP, H2H and WTA</p>
          </div>
          <div class="panel-body">
            <div class="mini-grid players">
              <a class="mini-card atp" href="players_atp/index.html">ATP</a>
              <a class="mini-card neutral" href="head_to_head.html">H2H</a>
              <a class="mini-card wta" href="players/index.html">WTA</a>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Rankings</h2>
            <p class="panel-subtitle">ATP and WTA rankings</p>
          </div>
          <div class="panel-body">
            <div class="mini-grid rankings">
              <a class="mini-card atp" href="/rankings/atp.html">ATP</a>
              <a class="mini-card wta" href="/rankings/wta.html">WTA</a>
            </div>
          </div>
        </div>
      </section>

      <section class="center-col">
        <a class="calendar-link" href="calendar.html" aria-label="Calendar">
          <div class="calendar-inner">
            <div class="label">Calendar</div>
            <div class="sub">Open schedule</div>
          </div>
        </a>

        <div class="birthday-box">
          <div class="inner">
            <div class="birthday-top">
              <div class="birthday-title">Birthday Box</div>
              <div class="birthday-meta">Today</div>
            </div>
            <div class="birthday-content">Loading…</div>
          </div>
        </div>
      </section>

      <section class="side-stack">
        <div class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Tennis Statistics</h2>
            <p class="panel-subtitle">Open the statistics page</p>
          </div>
          <div class="panel-body">
            <a class="card-link" href="stats.html">
              <div>
                <strong>Statistics</strong>
              </div>
              <span class="tag tag-gold">Open</span>
            </a>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Gaming Zone</h2>
            <p class="panel-subtitle">Tennis Arena</p>
          </div>
          <div class="panel-body">
            <a class="card-link" href="/games/tennis_arena/index.html">
              <div>
                <strong>Enter Gaming Zone</strong>
              </div>
              <span class="tag tag-neutral">Play</span>
            </a>
          </div>
        </div>
      </section>

    </main>
  </div>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Head-to-Head — H2H</title>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<style>
  :root{
    --bg: #f6f9fc;
    --card: #ffffff;
    --muted: #64748b;
    --accent: #0b5fff;
    --accent-2: #3dd2c9;
    --soft: #eef6ff;
    --radius: 12px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color-scheme: light;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#fff 60%);color:#0b1a2b}
  .wrap{max-width:1200px;margin:28px auto;padding:20px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:0 8px 30px rgba(9,30,66,0.06);padding:16px}
  /* header / picker */
  .picker-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .picker{display:flex;align-items:center;background:var(--soft);padding:8px;border-radius:12px;min-width:260px;position:relative}
  .picker input{border:0;background:transparent;padding:8px 10px;font-weight:600;color:var(--accent);width:260px;outline:none}
  .picker input::placeholder{color:#94a3b8;font-weight:400}
  .btn{border-radius:10px;padding:9px 14px;border:0;cursor:pointer;font-weight:700}
  .btn-primary{background:linear-gradient(90deg,var(--accent),#376bf5);color:white;box-shadow:0 6px 18px rgba(11,95,255,0.16)}
  .btn-ghost{background:transparent;border:1px solid #e6f0ff;color:var(--accent);padding:8px 12px;border-radius:10px}
  .swap{background:#fff;border:1px solid #eef6ff;padding:8px;border-radius:10px;cursor:pointer}
  .diag{background:#fff;border:1px solid #f0f4ff;padding:8px;border-radius:10px}
  .status{margin-top:12px;padding:10px;border-radius:10px;background:linear-gradient(90deg,#f8fbff,#ffffff);color:var(--muted);font-size:14px}
  /* autocomplete list */
  .suggestions{position:absolute;top:100%;left:0;right:0;background:var(--card);border-radius:10px;box-shadow:0 12px 40px rgba(9,30,66,0.08);max-height:320px;overflow:auto;margin-top:8px;z-index:60}
  .suggest-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f6f9fc;cursor:pointer}
  .suggest-item:last-child{border-bottom:0}
  .suggest-item img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#f2f6fb}
  .suggest-item .title{font-weight:700}
  .suggest-item .meta{font-size:12px;color:var(--muted)}
  /* result area */
  .result-grid{display:grid;grid-template-columns:1fr 420px 1fr;gap:18px;align-items:start;margin-top:20px}
  @media (max-width:1000px){ .result-grid{grid-template-columns:1fr; } }
  .profile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px}
  .avatar{width:130px;height:130px;border-radius:50%;overflow:hidden;background:#f2f6fb;display:flex;align-items:center;justify-content:center}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name-plate{font-weight:700;font-size:18px;color:#08304a}
  .info-card{background:linear-gradient(180deg,#fff,#fbfdff);padding:14px;border-radius:12px;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5)}
  .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eef6f9}
  .info-row:last-child{border-bottom:0}
  .muted-sm{color:var(--muted);font-size:13px}
  /* center chart area */
  .center-area{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px}
  .chart-wrap{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f6fbff);box-shadow:inset 0 6px 14px rgba(3,27,66,0.03)}
  .chart-svg{transform:rotate(-90deg)}
  .chart-label{font-weight:700;font-size:18px}
  /* shared stats list */
  .shared-list{display:flex;flex-direction:column;gap:8px;padding:6px}
  .stat-item{display:flex;align-items:center;gap:12px}
  .stat-left{width:110px;text-align:left;font-weight:700}
  .stat-center{flex:1;text-align:center;color:var(--muted);font-weight:600}
  .stat-right{width:110px;text-align:right;font-weight:700}
  .bar-outer{height:12px;background:#edf6ff;border-radius:999px;overflow:hidden}
  .bar-inner{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  /* event table */
  .events{margin-top:18px}
  table{width:100%;border-collapse:collapse;border-radius:8px;overflow:hidden}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #f3f7fb;font-size:14px}
  th{background:#fbfdff;color:var(--muted);font-weight:700}
  /* small */
  .small-muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <!-- pickers -->
      <div class="picker-row">
        <div class="picker" style="min-width:320px">
          <input id="p1-input" placeholder="Joueur / Joueuse 1 (nom)" aria-label="Joueur 1">
          <div id="p1-suggestions" class="suggestions" style="display:none"></div>
        </div>

        <button id="swap" class="swap" title="Swap">⇄</button>

        <div class="picker" style="min-width:320px">
          <input id="p2-input" placeholder="Joueur / Joueuse 2 (nom)" aria-label="Joueur 2">
          <div id="p2-suggestions" class="suggestions" style="display:none"></div>
        </div>

        <button id="display" class="btn btn-primary">Display H2H</button>
        <button id="clear" class="btn btn-ghost">Clear</button>

        <div style="margin-left:auto" class="small-muted" id="json-link-wrap"></div>
      </div>

      <div id="status" class="status" style="display:none"></div>

      <!-- result -->
      <div id="results" style="margin-top:18px;display:none">
        <div class="result-grid">
          <!-- left player -->
          <div class="profile">
            <div class="avatar" id="left-avatar"><img src="" alt=""></div>
            <div class="name-plate" id="left-name">—</div>
            <div class="info-card" style="width:100%">
              <div id="left-info"></div>
            </div>
          </div>

          <!-- center -->
          <div class="center-area card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
            <div class="chart-wrap">
              <svg class="chart-svg" width="200" height="200" viewBox="0 0 264 264" role="img" aria-hidden="true">
                <circle cx="132" cy="132" r="127" fill="transparent" stroke="#eef6ff" stroke-width="14"></circle>
                <circle id="progress-bar" cx="132" cy="132" r="127" fill="transparent" stroke-width="14" stroke-linecap="round" stroke="#0b5fff" stroke-dasharray="797.96" stroke-dashoffset="0"></circle>
              </svg>
            </div>
            <div class="chart-label" id="chart-text">—</div>

            <div class="shared-list" style="width:100%;margin-top:10px" id="shared-stats">
              <!-- items injected -->
            </div>
          </div>

          <!-- right player -->
          <div class="profile">
            <div class="avatar" id="right-avatar"><img src="" alt=""></div>
            <div class="name-plate" id="right-name">—</div>
            <div class="info-card" style="width:100%">
              <div id="right-info"></div>
            </div>
          </div>
        </div>

        <div class="events card" id="events-block" style="margin-top:18px">
          <h4 style="margin:0 0 10px 0">Event breakdown</h4>
          <div id="events-table"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* headtohead.html — improved UI & manifest image lookup
   - auto-load players_catalog.json at DOMContentLoaded
   - autocomplete displays only name but stores selectedId
   - Display H2H reloads with ?p1=ID&p2=ID
   - on load (if p1&p2 present) auto-fetches H2H JSON and renders
   - images resolved via manifest '/index/players_atp_images_manifest.json' then fallback
*/

/* CONFIG: you can adjust if needed */
const PLAYERS_CATALOG_PATHS = [
  '/tools/players_catalog.json',
  './tools/players_catalog.json',
  window.location.origin + '/tools/players_catalog.json',
  'https://www.center-court.net/tools/players_catalog.json'
];

const H2H_BASES = [
  '/data/h2h/',
  './data/h2h/',
  window.location.origin + '/data/h2h/',
  'https://www.center-court.net/data/h2h/'
];

const MANIFEST_URL = '/index/players_atp_images_manifest.json'; // manifest pour images

/* elements */
const p1Input = document.getElementById('p1-input');
const p2Input = document.getElementById('p2-input');
const p1Sug = document.getElementById('p1-suggestions');
const p2Sug = document.getElementById('p2-suggestions');
const displayBtn = document.getElementById('display');
const clearBtn = document.getElementById('clear');
const swapBtn = document.getElementById('swap');
const statusEl = document.getElementById('status');
const resultsWrap = document.getElementById('results');
const leftAvatar = document.getElementById('left-avatar');
const rightAvatar = document.getElementById('right-avatar');
const leftNameEl = document.getElementById('left-name');
const rightNameEl = document.getElementById('right-name');
const leftInfo = document.getElementById('left-info');
const rightInfo = document.getElementById('right-info');
const sharedStats = document.getElementById('shared-stats');
const chartBar = document.getElementById('progress-bar');
const chartText = document.getElementById('chart-text');
const eventsTableWrap = document.getElementById('events-table');
const jsonLinkWrap = document.getElementById('json-link-wrap');

let playersCatalog = null;
let playersById = {};
let playersByName = [];
let manifestCache = null;

/* UTIL */
function showStatus(msg, ms=4000, isError=false){
  statusEl.style.display = 'block';
  statusEl.textContent = msg;
  statusEl.style.background = isError ? '#fff0f0' : 'linear-gradient(90deg,#f8fbff,#fff)';
  if (ms) setTimeout(()=> statusEl.style.display='none', ms);
}
function hideStatus(){ statusEl.style.display='none'; }
function qs(name){ const u = new URL(location.href); return u.searchParams.get(name); }
function normId(s){ return s ? String(s).trim().toUpperCase() : ''; }

/* Try sequential fetch */
async function tryFetchList(paths){
  for(const p of paths){
    try {
      const res = await fetch(p, {cache:'no-cache', mode:'cors'});
      if (!res.ok) continue;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return {json: await res.json(), url:p};
      const txt = await res.text();
      try { return {json: JSON.parse(txt), url:p}; } catch(e){ continue; }
    } catch(e){ continue; }
  }
  return null;
}

/* LOAD catalog */
async function loadCatalog(){
  const res = await tryFetchList(PLAYERS_CATALOG_PATHS);
  if (!res){
    showStatus('Impossible de charger players_catalog.json — autocomplétion désactivée (tu peux taper un ID).', 7000, true);
    return;
  }
  playersCatalog = res.json;
  playersById = {};
  playersByName = [];
  if (playersCatalog && Array.isArray(playersCatalog.players)){
    for(const p of playersCatalog.players){
      const id = String(p.player_id || p.playerId || '').toUpperCase();
      const name = p.full_name || p.fullName || p.name || '';
      const rec = Object.assign({}, p, {id, name});
      if (id) playersById[id] = rec;
      if (name) { rec._lc = name.toLowerCase(); playersByName.push(rec); }
    }
    showStatus(`Catalogue chargé (${playersByName.length} joueurs).`, 2500);
  } else {
    showStatus('Catalogue chargé mais format inattendu.', 5000, true);
  }
}

/* autocomplete: show only name lines */
function searchPlayers(query, limit=12){
  if (!query) return [];
  const q = query.toLowerCase().trim();
  const out = [];
  // exact id preference
  const up = query.toUpperCase();
  if (playersById[up]) out.push(playersById[up]);
  for(const p of playersByName){
    if (p._lc.includes(q)) out.push(p);
    if (out.length >= limit) break;
  }
  return out.slice(0, limit);
}

function renderSuggestions(list, container, inputEl){
  if (!list || list.length === 0){ container.style.display='none'; container.innerHTML = ''; return; }
  container.innerHTML = '';
  for(const item of list){
    const div = document.createElement('div');
    div.className = 'suggest-item';
    div.innerHTML = `<img src="/-/media/alias/player-headshot/${item.id}" alt="${item.name}"><div style="flex:1"><div class="title">${item.name}</div><div class="meta">${item.id} • ${item.represented_country||item.country||''}</div></div>`;
    div.addEventListener('click', ()=>{
      // show name in input, but store id separately
      inputEl.value = item.name;
      inputEl.dataset.selectedId = item.id;
      container.style.display = 'none';
    });
    container.appendChild(div);
  }
  container.style.display = 'block';
}

/* input handlers */
p1Input.addEventListener('input', ()=>{
  delete p1Input.dataset.selectedId;
  const q = p1Input.value.trim();
  if (!q || !playersCatalog) { p1Sug.style.display='none'; return; }
  renderSuggestions(searchPlayers(q, 12), p1Sug, p1Input);
});
p2Input.addEventListener('input', ()=>{
  delete p2Input.dataset.selectedId;
  const q = p2Input.value.trim();
  if (!q || !playersCatalog) { p2Sug.style.display='none'; return; }
  renderSuggestions(searchPlayers(q, 12), p2Sug, p2Input);
});
document.addEventListener('click', e => { if (!e.target.closest('.picker')){ p1Sug.style.display='none'; p2Sug.style.display='none'; }});
p1Input.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') displayBtn.click(); });
p2Input.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') displayBtn.click(); });

/* manifest lookup for images (provided snippet adapted) */
async function loadManifestOnce(){
  if (manifestCache !== null) return manifestCache;
  try {
    const r = await fetch(MANIFEST_URL, {cache:'no-cache', mode:'cors'});
    if (!r.ok) { manifestCache = null; return null; }
    const arr = await r.json();
    manifestCache = Array.isArray(arr) ? arr : null;
    return manifestCache;
  } catch(e){
    manifestCache = null;
    return null;
  }
}

async function findImageFromManifest(pid, slug) {
  try {
    const arr = await loadManifestOnce();
    if (!arr) return null;
    if (pid) {
      const byId = arr.find(it => it.player_id && String(it.player_id) === String(pid));
      if (byId && byId.url) return byId;
    }
    if (slug) {
      const slugLc = String(slug).toLowerCase();
      const bySlug = arr.find(it => it.slug && it.slug.toLowerCase() === slugLc);
      if (bySlug && bySlug.url) return bySlug;
    }
    const candidates = [];
    if (pid && slug) candidates.push(`players_atp/${pid}-${slug}`);
    if (slug) candidates.push(`players_atp/${slug}`);
    if (pid) candidates.push(`players_atp/${pid}`);
    for (const c of candidates){
      const found = arr.find(it => it.public_id === c || (it.public_id && it.public_id.toLowerCase() === c.toLowerCase()));
      if (found && found.url) return found;
    }
    return null;
  } catch(e){
    console.warn('manifest lookup failed', e);
    return null;
  }
}

/* try to render image into container element (element contains <img> tag initially) */
async function renderPlayerImage(containerEl, playerRec){
  containerEl.innerHTML = ''; // clear
  // try manifest
  const pid = playerRec && (playerRec.id || playerRec.player_id || playerRec.playerId) || '';
  const slug = playerRec && (playerRec.slug || playerRec.player_slug || '');
  const manifest = await findImageFromManifest(pid, slug);
  if (manifest && manifest.url){
    const img = document.createElement('img'); img.src = manifest.url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading = 'lazy';
    containerEl.appendChild(img); return;
  }
  // fallback: combined.image or image field
  if (playerRec && (playerRec.image || playerRec.photo || playerRec.headshot)){
    const img = document.createElement('img'); img.src = playerRec.image || playerRec.photo || playerRec.headshot; img.alt = playerRec.full_name || playerRec.name || pid; img.loading = 'lazy';
    containerEl.appendChild(img); return;
  }
  // last fallback: alias path on site
  if (pid){
    const img = document.createElement('img'); img.src = `/-/media/alias/player-headshot/${pid}`; img.alt = playerRec.full_name || playerRec.name || pid; img.loading = 'lazy';
    img.onerror = ()=> { containerEl.innerHTML = '<div style="color:var(--muted)">No image</div>'; };
    containerEl.appendChild(img); return;
  }
  containerEl.innerHTML = '<div style="color:var(--muted)">No image</div>';
}

/* resolve input to ID:
   - if dataset.selectedId present -> use it
   - else if typed value matches exact id in catalog -> use
   - else if typed is simple ID pattern -> use uppercase
   - else if typed is name -> try exact or substring match in catalog
*/
function resolveIdFromInput(inputEl){
  const raw = inputEl.value.trim();
  if (!raw) return null;
  if (inputEl.dataset.selectedId) return inputEl.dataset.selectedId;
  const up = raw.toUpperCase();
  if (playersById[up]) return up;
  // simple alnum id => accept
  if (/^[A-Z0-9]+$/.test(up)) return up;
  if (playersByName.length){
    const lc = raw.toLowerCase();
    const exact = playersByName.find(p => p._lc === lc);
    if (exact) return exact.id;
    const part = playersByName.find(p => p._lc && p._lc.includes(lc));
    if (part) return part.id;
  }
  return null;
}

/* fetch H2H JSON robustly: several candidate URLs & both orders */
async function fetchH2HJson(p1, p2){
  const combos = [
    [p1,p2],[p2,p1],[p1.toLowerCase(),p2.toLowerCase()],[p2.toLowerCase(),p1.toLowerCase()]
  ];
  const variants = [];
  for(const base of H2H_BASES){
    for(const [a,b] of combos){
      variants.push(base + `${a}_${b}.json`);
      variants.push(base + `${a}-${b}.json`);
      variants.push(base + `${a}${b}.json`);
    }
  }
  for(const url of variants){
    try {
      const r = await fetch(url, {cache:'no-cache', mode:'cors'});
      if (!r.ok) continue;
      const json = await r.json();
      return { json, url };
    } catch(e){ continue; }
  }
  return null;
}

/* render shared stats */
function renderShared(aggLeft, aggRight, matches){
  sharedStats.innerHTML = '';
  const rows = [
    {label:'H2H (W/L)', left: aggLeft.h2h_wins!==undefined ? `${aggLeft.h2h_wins}/${aggLeft.h2h_losses||0}` : '—', right: aggRight.h2h_wins!==undefined ? `${aggRight.h2h_wins}/${aggRight.h2h_losses||0}` : '—'},
    {label:'Career W/L', left: aggLeft.career_wins!==undefined ? `${aggLeft.career_wins}/${aggLeft.career_losses||0}` : '—', right: aggRight.career_wins!==undefined ? `${aggRight.career_wins}/${aggRight.career_losses||0}` : '—'},
    {label:'Career titles', left: aggLeft.titles||aggLeft.career_titles||'—', right: aggRight.titles||aggRight.career_titles||'—'},
    {label:'Career prize', left: aggLeft.prize_money || '—', right: aggRight.prize_money || '—'}
  ];
  for(const r of rows){
    const div = document.createElement('div'); div.className='stat-item';
    const left = document.createElement('div'); left.className='stat-left'; left.textContent = r.left;
    const center = document.createElement('div'); center.className='stat-center'; center.textContent = r.label;
    const right = document.createElement('div'); right.className='stat-right'; right.textContent = r.right;
    // progress
    const outer = document.createElement('div'); outer.className='bar-outer'; outer.style.marginTop='8px';
    const inner = document.createElement('div'); inner.className='bar-inner';
    const nL = parseInt((r.left||'').toString().replace(/[^\d]/g,'')) || 0;
    const nR = parseInt((r.right||'').toString().replace(/[^\d]/g,'')) || 0;
    const pct = (nL+nR) ? Math.round(100 * nL / (nL+nR)) : 0;
    inner.style.width = pct + '%';
    outer.appendChild(inner);
    const container = document.createElement('div'); container.style.flexBasis='100%'; container.appendChild(outer);
    div.appendChild(left); div.appendChild(center); div.appendChild(right); sharedStats.appendChild(div); sharedStats.appendChild(container);
  }
  // update chart numeric
  let leftWins = (rows[0].left && rows[0].left.includes('/')) ? parseInt(rows[0].left.split('/')[0]) || 0 : 0;
  let rightWins = (rows[0].right && rows[0].right.includes('/')) ? parseInt(rows[0].right.split('/')[0]) || 0 : 0;
  if (leftWins + rightWins === 0 && Array.isArray(matches)){
    for(const m of matches){
      const w = m.player_id_winner || m.player_winner || m.winner_player_name || m.winner || '';
      if (w && String(w).toUpperCase() === String(aggLeft.id).toUpperCase()) leftWins++; else if (w) rightWins++;
    }
  }
  const circumference = 2 * Math.PI * 127;
  const leftFraction = (leftWins + rightWins) ? leftWins / (leftWins + rightWins) : 0.5;
  const offset = circumference * (1 - leftFraction);
  chartBar.style.strokeDasharray = `${circumference}`;
  chartBar.style.strokeDashoffset = `${offset}`;
  chartText.textContent = `${leftWins} — ${rightWins}`;
}

/* render event table */
function renderEvents(matches){
  eventsTableWrap.innerHTML = '';
  if (!Array.isArray(matches) || matches.length === 0) { eventsTableWrap.innerHTML = '<div class="small-muted">Aucun match enregistré</div>'; return; }
  const table = document.createElement('table');
  const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>Year</th><th>Winner</th><th>Event</th><th>Round</th><th>Surface</th><th>Score</th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  const sorted = matches.slice().sort((a,b)=> (b.event_year||'').toString().localeCompare((a.event_year||'').toString()));
  for(const m of sorted){
    const tr = document.createElement('tr');
    const year = m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : '');
    tr.innerHTML = `<td>${year}</td>
      <td>${m.winner_player_name||m.winner||'—'}</td>
      <td>${m.tourney_name||m.tournament||'—'}</td>
      <td>${m.round||'—'}</td>
      <td>${m.surface||'—'}</td>
      <td>${m.score_string||'—'}</td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody); eventsTableWrap.appendChild(table);
}

/* Render the whole payload */
async function renderPayload(payload, jsonUrl, p1id, p2id){
  resultsWrap.style.display = 'block';
  jsonLinkWrap.innerHTML = `<a href="${jsonUrl}" target="_blank" class="small-muted">Voir JSON</a>`;
  // determine players from payload or fallback to ids
  const leftPayload = payload.player1 && payload.player1.id && String(payload.player1.id).toUpperCase() === String(p1id).toUpperCase() ? payload.player1 : (payload.player1 || {});
  const rightPayload = payload.player2 && payload.player2.id && String(payload.player2.id).toUpperCase() === String(p2id).toUpperCase() ? payload.player2 : (payload.player2 || {});
  // enrich from catalog if exists
  const leftFromCatalog = playersById[p1id] || {};
  const rightFromCatalog = playersById[p2id] || {};
  const left = Object.assign({}, leftFromCatalog, leftPayload, {id: p1id, full_name: leftPayload.full_name || leftFromCatalog.full_name || leftPayload.name || ''});
  const right = Object.assign({}, rightFromCatalog, rightPayload, {id: p2id, full_name: rightPayload.full_name || rightFromCatalog.full_name || rightPayload.name || ''});
  leftNameEl.textContent = left.full_name || left.name || p1id;
  rightNameEl.textContent = right.full_name || right.name || p2id;
  // images
  await renderPlayerImage(leftAvatar, left);
  await renderPlayerImage(rightAvatar, right);
  // info boxes
  leftInfo.innerHTML = ''; rightInfo.innerHTML = '';
  const leftRows = [
    ['Rank', left.rank || left.best_rank || left.highest_ranking || '—'],
    ['Age', left.age || (left.birth_date ? (new Date().getFullYear() - (new Date(left.birth_date)).getFullYear()) : '—') || '—'],
    ['Height', left.height || left.height_cm || left.height_inches || '—'],
    ['Plays', left.plays || '—'],
    ['Backhand', left.backhand || '—']
  ];
  for(const r of leftRows){
    const d = document.createElement('div'); d.className='info-row';
    d.innerHTML = `<div class="muted-sm">${r[0]}</div><div style="font-weight:700">${r[1]}</div>`;
    leftInfo.appendChild(d);
  }
  const rightRows = [
    ['Rank', right.rank || right.best_rank || right.highest_ranking || '—'],
    ['Age', right.age || (right.birth_date ? (new Date().getFullYear() - (new Date(right.birth_date)).getFullYear()) : '—') || '—'],
    ['Height', right.height || right.height_cm || right.height_inches || '—'],
    ['Plays', right.plays || '—'],
    ['Backhand', right.backhand || '—']
  ];
  for(const r of rightRows){
    const d = document.createElement('div'); d.className='info-row';
    d.innerHTML = `<div class="muted-sm">${r[0]}</div><div style="font-weight:700">${r[1]}</div>`;
    rightInfo.appendChild(d);
  }
  // aggregates
  const aggLeft = (payload.aggregates && payload.aggregates.player1) ? payload.aggregates.player1 : (payload.player1 || {});
  const aggRight = (payload.aggregates && payload.aggregates.player2) ? payload.aggregates.player2 : (payload.player2 || {});
  aggLeft.id = left.id; aggRight.id = right.id;
  renderShared(aggLeft, aggRight, payload.matches || []);
  renderEvents(payload.matches || []);
}

/* Control: when user clicks Display -> reload page with p1/p2 IDs */
displayBtn.addEventListener('click', ()=>{
  const input1Val = p1Input.dataset.selectedId || p1Input.value.trim();
  const input2Val = p2Input.dataset.selectedId || p2Input.value.trim();
  if (!input1Val || !input2Val){ showStatus('Indique deux joueurs (sélection dans la liste ou tape l\'ID).', 4000, true); return; }
  const id1 = resolveIdFromInput(p1Input);
  const id2 = resolveIdFromInput(p2Input);
  if (!id1 || !id2){ showStatus('Impossible de résoudre un des joueurs en ID. Choisis dans la liste ou tape un ID.', 5000, true); return; }
  // reload
  const url = new URL(location.href);
  url.searchParams.set('p1', id1); url.searchParams.set('p2', id2);
  window.location.href = url.toString();
});

/* Clear */
clearBtn.addEventListener('click', ()=>{
  p1Input.value = ''; p2Input.value = ''; delete p1Input.dataset.selectedId; delete p2Input.dataset.selectedId;
  resultsWrap.style.display = 'none'; showStatus('Sélection effacée', 1400);
});

/* Swap */
swapBtn.addEventListener('click', ()=>{
  const a = p1Input.value, aid = p1Input.dataset.selectedId;
  p1Input.value = p2Input.value; p1Input.dataset.selectedId = p2Input.dataset.selectedId || '';
  p2Input.value = a; p2Input.dataset.selectedId = aid || '';
});

/* Resolve ID from input element */
function resolveIdFromInput(el){
  if (el.dataset.selectedId) return el.dataset.selectedId;
  const v = el.value.trim();
  if (!v) return null;
  const up = v.toUpperCase();
  if (playersById[up]) return up;
  if (/^[A-Z0-9]+$/.test(up)) return up;
  // match name
  const lc = v.toLowerCase();
  const exact = playersByName.find(p => p._lc === lc);
  if (exact) return exact.id;
  const part = playersByName.find(p => p._lc && p._lc.includes(lc));
  if (part) return part.id;
  return null;
}

/* On load: load catalog, then if URL has p1/p2 fetch H2H JSON and render */
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadCatalog();
  // prefill inputs by name if possible
  const url = new URL(location.href);
  const p1 = url.searchParams.get('p1');
  const p2 = url.searchParams.get('p2');
  if (p1 && playersById[p1]) { p1Input.value = playersById[p1].name || p1; p1Input.dataset.selectedId = p1; }
  if (p2 && playersById[p2]) { p2Input.value = playersById[p2].name || p2; p2Input.dataset.selectedId = p2; }
  // if both set, auto-fetch the H2H
  if (p1 && p2){
    showStatus('Chargement du H2H...', 12000);
    const res = await fetchH2HJson(p1, p2);
    if (!res){ showStatus('Aucun JSON H2H trouvé (vérifie les fichiers dans /data/h2h).', 7000, true); return; }
    hideStatus();
    await renderPayload(res.json, res.url, p1, p2);
  } else {
    showStatus('Saisis deux joueurs (nom) puis clique Display H2H. Le catalogue est chargé automatiquement.', 5000);
  }
});

/* robust H2H fetch using bases */
async function fetchH2HJson(p1, p2){
  const combos = [[p1,p2],[p2,p1],[p1.toLowerCase(),p2.toLowerCase()],[p2.toLowerCase(),p1.toLowerCase()]];
  const trials = [];
  for(const base of H2H_BASES){
    for(const [a,b] of combos){
      trials.push(base + `${a}_${b}.json`);
      trials.push(base + `${a}-${b}.json`);
      trials.push(base + `${a}${b}.json`);
    }
  }
  for(const url of trials){
    try {
      const res = await fetch(url, {cache:'no-cache', mode:'cors'});
      if (!res.ok) continue;
      const data = await res.json();
      return {json:data, url};
    } catch(e){ continue; }
  }
  return null;
}

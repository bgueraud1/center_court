<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Head-to-Head — H2H</title>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<style>
  :root{
    --bg:#f6f9fc; --card:#fff; --muted:#64748b;
    --accent-ATP-1: #0b5fff; --accent-ATP-2: #3dd2c9;
    --accent-WTA-1: #7b3fb5; --accent-WTA-2: #c57be6;
    --accent: var(--accent-ATP-1);
    --accent-2: var(--accent-ATP-2);
    --radius: 12px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color: #0b1a2b;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#fff); }
  .wrap{max-width:1150px;margin:28px auto;padding:18px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:0 10px 30px rgba(9,30,66,0.06);padding:16px}
  .picker-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .picker{display:flex;align-items:center;background:#f3f6fb;padding:8px;border-radius:12px;min-width:300px;position:relative}
  .picker input{border:0;background:transparent;padding:8px 10px;font-weight:700;color:var(--accent);width:260px;outline:none}
  .btn{border-radius:10px;padding:9px 14px;border:0;cursor:pointer;font-weight:700}
  .btn-primary{background:linear-gradient(90deg,var(--accent),#376bf5);color:white}
  .btn-ghost{background:transparent;border:1px solid #e6f0ff;color:var(--accent);padding:8px 12px;border-radius:10px}
  .suggestions{position:absolute;top:100%;left:0;right:0;background:var(--card);border-radius:10px;box-shadow:0 12px 40px rgba(9,30,66,0.08);max-height:320px;overflow:auto;margin-top:8px;z-index:60}
  .suggest-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f6f9fc;cursor:pointer}
  .suggest-item img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#f2f6fb}
  .suggest-item .title{font-weight:700}
  .suggest-item .meta{font-size:12px;color:var(--muted)}
  .results-grid{display:grid;grid-template-columns:1fr 420px 1fr;gap:20px;align-items:start;margin-top:20px}
  @media (max-width:1000px){ .results-grid{grid-template-columns:1fr; } }
  .profile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
  .avatar{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#f2f6fb;display:flex;align-items:center;justify-content:center}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name-plate{font-weight:800;font-size:18px;color:#08304a}
  .info-card{background:linear-gradient(180deg,#fff,#fbfdff);padding:12px;border-radius:10px;width:100%}
  .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eef6f9}
  .info-row:last-child{border-bottom:0}
  .muted-sm{color:var(--muted);font-size:13px}
  .center-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#fff,#fbfdff)}
  .chart-wrap{width:240px;height:240px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent}
  svg.progress { width:240px;height:240px; overflow:visible; }
  .chart-text{font-weight:800;font-size:18px}
  .shared-list{width:100%;margin-top:6px}
  .stat-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed #f0f6ff}
  .stat-left{width:110px;text-align:left;font-weight:700}
  .stat-center{flex:1;text-align:center;color:var(--muted);font-weight:700}
  .stat-right{width:110px;text-align:right;font-weight:700}
  .bar-outer{height:12px;background:#eef7ff;border-radius:999px;overflow:hidden}
  .bar-inner{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .events{margin-top:18px}
  table{width:100%;border-collapse:collapse;border-radius:8px;overflow:hidden}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #f3f7fb;font-size:14px}
  th{background:#fbfdff;color:var(--muted);font-weight:700}
  .small-muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="picker-row">
        <div class="picker" style="min-width:320px">
          <input id="p1-input" placeholder="Joueur / Joueuse 1 (nom)" aria-label="Joueur 1">
          <div id="p1-suggestions" class="suggestions" style="display:none"></div>
        </div>

        <button id="swap" class="btn">⇄</button>

        <div class="picker" style="min-width:320px">
          <input id="p2-input" placeholder="Joueur / Joueuse 2 (nom)" aria-label="Joueur 2">
          <div id="p2-suggestions" class="suggestions" style="display:none"></div>
        </div>

        <button id="display" class="btn btn-primary">Display H2H</button>
        <button id="clear" class="btn btn-ghost">Clear</button>

        <div style="margin-left:auto" id="json-link-wrap" class="small-muted"></div>
      </div>

      <div id="status" class="small-muted" style="margin-top:10px;display:none"></div>

      <div id="results" style="margin-top:18px;display:none">
        <div class="results-grid">
          <div class="profile card">
            <div class="avatar" id="left-avatar"><img src="" alt=""></div>
            <div class="name-plate" id="left-name">—</div>
            <div class="info-card" id="left-info"></div>
          </div>

          <div class="center-card card" id="center-card">
            <div class="chart-wrap">
              <svg class="progress" viewBox="0 0 264 264" role="img" aria-hidden="true">
                <circle cx="132" cy="132" r="112" fill="transparent" stroke="#eef6ff" stroke-width="22"></circle>
                <circle id="progress-bar" cx="132" cy="132" r="112" fill="transparent" stroke-width="22" stroke-linecap="round" stroke="var(--accent)"></circle>
              </svg>
            </div>
            <div class="chart-text" id="chart-text">—</div>
            <div class="shared-list" id="shared-stats"></div>
          </div>

          <div class="profile card">
            <div class="avatar" id="right-avatar"><img src="" alt=""></div>
            <div class="name-plate" id="right-name">—</div>
            <div class="info-card" id="right-info"></div>
          </div>
        </div>

        <div class="events card" style="margin-top:18px">
          <h4 style="margin:0 0 10px 0">Event breakdown</h4>
          <div id="events-table"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* headtohead — version per-player JSON
   - charge players_catalog.json pour autocomplétion
   - charge deux JSONs: /data/h2h_by_player/<PLAYER_ID>.json
   - calcule H2H côté client en combinant matches des deux fichiers
   - conserve manifest image logic (WTA-first)
*/

/* CONFIG */
const PLAYERS_CATALOG_PATHS = [
  '/tools/players_catalog.json',
  './tools/players_catalog.json',
  window.location.origin + '/tools/players_catalog.json',
  'https://www.center-court.net/tools/players_catalog.json'
];

const H2H_PLAYER_BASES = [
  '/data/h2h_by_player/',
  './data/h2h_by_player/',
  window.location.origin + '/data/h2h_by_player/',
  'https://www.center-court.net/data/h2h_by_player/'
];

const MANIFEST_ATP = '/index/players_atp_images_manifest.json';
const MANIFEST_WTA = '/index/players_wta_images_manifest.json';
const MANIFEST_COMMON = '/index/players_images_manifest.json';
const MANIFEST_ALTERNATES = ['/players_images_manifest.json','/index/players_images.json'];

/* Optional Cloudinary fallback (set your cloud name globally if you want it) */
window.CLOUDINARY_CLOUD_NAME = window.CLOUDINARY_CLOUD_NAME || '';

/* Elements */
const p1Input = document.getElementById('p1-input');
const p2Input = document.getElementById('p2-input');
const p1Sug = document.getElementById('p1-suggestions');
const p2Sug = document.getElementById('p2-suggestions');
const displayBtn = document.getElementById('display');
const clearBtn = document.getElementById('clear');
const swapBtn = document.getElementById('swap');
const statusEl = document.getElementById('status');
const resultsWrap = document.getElementById('results');
const leftAvatar = document.getElementById('left-avatar');
const rightAvatar = document.getElementById('right-avatar');
const leftNameEl = document.getElementById('left-name');
const rightNameEl = document.getElementById('right-name');
const leftInfo = document.getElementById('left-info');
const rightInfo = document.getElementById('right-info');
const sharedStats = document.getElementById('shared-stats');
const chartBar = document.getElementById('progress-bar');
const chartText = document.getElementById('chart-text');
const eventsTableWrap = document.getElementById('events-table');
const jsonLinkWrap = document.getElementById('json-link-wrap');

let playersCatalog = null;
let playersById = {};
let playersByName = [];
let imageManifest = null;
let imageManifestSourceUrl = null;

/* Utilities */
function showStatus(msg, ms=4000, err=false){
  statusEl.style.display = 'block';
  statusEl.textContent = msg;
  statusEl.style.color = err ? '#a00' : '';
  if(ms) setTimeout(()=> statusEl.style.display='none', ms);
}
function qs(name){ const u = new URL(location.href); return u.searchParams.get(name); }
function normId(s){ return s ? String(s).trim().toUpperCase() : ''; }

/* Fetch helpers */
async function tryFetchList(paths){
  for(const p of paths){
    try {
      const r = await fetch(p, {cache:'no-cache', mode:'cors'});
      if(!r || !r.ok) continue;
      const ct = r.headers.get('content-type') || '';
      if(ct.includes('application/json')) {
        const json = await r.json();
        return { json, url: p };
      }
      const txt = await r.text();
      try { const json = JSON.parse(txt); return { json, url: p }; } catch(e){ continue; }
    } catch(e){ continue; }
  }
  return null;
}

/* Load players catalog */
async function loadCatalog(){
  const res = await tryFetchList(PLAYERS_CATALOG_PATHS);
  if(!res){
    showStatus('Impossible de charger players_catalog.json — autocomplétion désactivée (tu peux entrer un ID).', 7000, true);
    return;
  }
  playersCatalog = res.json;
  playersById = {}; playersByName = [];
  if(playersCatalog && Array.isArray(playersCatalog.players)){
    for(const p of playersCatalog.players){
      const id = (p.player_id || p.playerId || '').toString().toUpperCase();
      const name = p.full_name || p.fullName || p.name || '';
      const rec = Object.assign({}, p, { id, name });
      if(id) playersById[id] = rec;
      if(name){ rec._lc = name.toLowerCase(); playersByName.push(rec); }
    }
    showStatus(`Catalogue chargé (${playersByName.length} joueurs).`, 2400);
  } else {
    showStatus('Catalogue chargé mais format inattendu.', 5000, true);
  }
}

/* Autocomplete (name only) */
function searchPlayers(q, limit=12){
  if(!q) return [];
  const s = q.toLowerCase().trim();
  const out = [];
  const up = q.toUpperCase();
  if(playersById[up]) out.push(playersById[up]);
  for(const p of playersByName){ if(p._lc.includes(s)) out.push(p); if(out.length>=limit) break; }
  return out.slice(0,limit);
}
function renderSuggestions(list, container, inputEl){
  if(!list || list.length===0){ container.style.display='none'; container.innerHTML=''; return; }
  container.innerHTML = '';
  for(const item of list){
    const div = document.createElement('div');
    div.className = 'suggest-item';
    div.innerHTML = `<img src="/-/media/alias/player-headshot/${item.id}" alt="${item.name}"><div style="flex:1"><div class="title">${item.name}</div><div class="meta">${item.id} • ${item.represented_country||item.country||''}</div></div>`;
    div.addEventListener('click', ()=>{
      inputEl.value = item.name; // show only name
      inputEl.dataset.selectedId = item.id; // keep id
      container.style.display = 'none';
    });
    container.appendChild(div);
  }
  container.style.display = 'block';
}

/* Input wiring */
p1Input.addEventListener('input', ()=>{ delete p1Input.dataset.selectedId; const q=p1Input.value.trim(); if(!q||!playersCatalog){p1Sug.style.display='none';return;} renderSuggestions(searchPlayers(q,12), p1Sug, p1Input); });
p2Input.addEventListener('input', ()=>{ delete p2Input.dataset.selectedId; const q=p2Input.value.trim(); if(!q||!playersCatalog){p2Sug.style.display='none';return;} renderSuggestions(searchPlayers(q,12), p2Sug, p2Input); });
document.addEventListener('click', e => { if(!e.target.closest('.picker')){ p1Sug.style.display='none'; p2Sug.style.display='none'; }});
p1Input.addEventListener('keydown', e => { if(e.key === 'Enter') displayBtn.click(); });
p2Input.addEventListener('keydown', e => { if(e.key === 'Enter') displayBtn.click(); });

/* Manifest loader with preference */
async function loadImageManifestOnce(prefer = null){
  if(imageManifest !== null) return imageManifest;
  const tryOrder = [];
  if(prefer === 'WTA'){ tryOrder.push(MANIFEST_WTA, MANIFEST_COMMON, MANIFEST_ATP); }
  else if(prefer === 'ATP'){ tryOrder.push(MANIFEST_ATP, MANIFEST_COMMON, MANIFEST_WTA); }
  else { tryOrder.push(MANIFEST_COMMON, MANIFEST_ATP, MANIFEST_WTA); }
  for(const alt of MANIFEST_ALTERNATES) tryOrder.push(alt);
  for(const path of tryOrder){
    try {
      const r = await fetch(path, {cache:'no-cache', mode:'cors'});
      if(!r || !r.ok) continue;
      const ct = r.headers.get('content-type') || '';
      let json;
      if(ct.includes('application/json')) json = await r.json();
      else {
        const txt = await r.text();
        try { json = JSON.parse(txt); } catch(e){ continue; }
      }
      imageManifest = json; imageManifestSourceUrl = path;
      console.info('[H2H] image manifest loaded', path);
      return imageManifest;
    } catch(e){ continue; }
  }
  imageManifest = null; imageManifestSourceUrl = null;
  console.warn('[H2H] aucun manifest d\'image trouvé');
  return null;
}

/* Find manifest entry */
function findManifestEntry(manifest, pid, slug){
  if(!manifest) return null;
  const slugLc = (slug||'').toString().toLowerCase();
  if(Array.isArray(manifest)){
    for(const it of manifest){
      if(!it) continue;
      if(pid && String(it.player_id || it.id || '') === String(pid)) return it;
      const itSlug = (it.slug || (it.public_id||'').split('/').pop() || '').toString().toLowerCase();
      if(slug && itSlug === slugLc) return it;
      if(slug && it.public_id && it.public_id.toLowerCase().includes(slugLc)) return it;
    }
  } else if(typeof manifest === 'object'){
    if(pid && manifest[pid]) return manifest[pid];
    if(slug && manifest[slug]) return manifest[slug];
    for(const k of Object.keys(manifest)){
      const it = manifest[k];
      if(!it) continue;
      if(pid && (String(it.player_id || it.id || '') === String(pid))) return it;
      const itSlug = (it.slug || (it.public_id||'').split('/').pop() || '').toString().toLowerCase();
      if(slug && itSlug === slugLc) return it;
    }
  }
  return null;
}

/* Render player image (uses manifest, fallback to cloudinary heuristics / alias) */
async function renderPlayerImage(containerEl, playerRec){
  containerEl.innerHTML = '';
  const pid = (playerRec && (playerRec.id || playerRec.player_id || playerRec.playerId)) ? String(playerRec.id || playerRec.player_id || playerRec.playerId) : '';
  const slug = (playerRec && (playerRec.slug || playerRec.player_slug || playerRec.name || playerRec.full_name)) ? String(playerRec.slug || playerRec.player_slug || playerRec.name || playerRec.full_name).toLowerCase() : '';
  let manifest = imageManifest;
  if(!manifest) manifest = await loadImageManifestOnce(null);
  let entry = findManifestEntry(manifest, pid, slug);
  if(entry){
    if(entry.url){
      const img = document.createElement('img'); img.src = entry.url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
      containerEl.appendChild(img); return;
    }
    if(entry.public_id && window.CLOUDINARY_CLOUD_NAME){
      const public_id = entry.public_id.replace(/^\/+/, '');
      const url = `https://res.cloudinary.com/${window.CLOUDINARY_CLOUD_NAME}/image/upload/c_fill,g_auto,h_800,w_800/f_auto,q_auto/v1/${public_id}`;
      const img = document.createElement('img'); img.src = url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
      containerEl.appendChild(img); return;
    }
  }
  if(playerRec && (playerRec.image || playerRec.headshot || playerRec.photo)){
    const img = document.createElement('img'); img.src = playerRec.image || playerRec.headshot || playerRec.photo; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
    containerEl.appendChild(img); return;
  }
  if(window.CLOUDINARY_CLOUD_NAME && (pid || slug)){
    const candidates = [];
    if(pid && slug) candidates.push(`players/${pid}-${slug}`);
    if(slug) candidates.push(`players/${slug}`);
    if(pid) candidates.push(`players/${pid}`);
    for(const public_id of candidates){
      const url = `https://res.cloudinary.com/${window.CLOUDINARY_CLOUD_NAME}/image/upload/c_fill,g_auto,h_800,w_800/f_auto,q_auto/v1/${public_id}`;
      const img = document.createElement('img'); img.src = url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
      img.onerror = ()=> { img.remove(); };
      containerEl.appendChild(img);
      return;
    }
  }
  if(pid){
    const img = document.createElement('img'); img.src = `/-/media/alias/player-headshot/${pid}`; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
    img.onerror = ()=> { containerEl.innerHTML = '<div style="color:var(--muted)">No image</div>'; };
    containerEl.appendChild(img); return;
  }
  containerEl.innerHTML = '<div style="color:var(--muted)">No image</div>';
}

/* Resolve ID from input element */
function resolveIdFromInput(el){
  if(el.dataset.selectedId) return el.dataset.selectedId;
  const raw = el.value.trim();
  if(!raw) return null;
  const up = raw.toUpperCase();
  if(playersById[up]) return up;
  if(/^[A-Z0-9]+$/.test(up)) return up;
  const lc = raw.toLowerCase();
  const exact = playersByName.find(p => p._lc === lc);
  if(exact) return exact.id;
  const part = playersByName.find(p => p._lc && p._lc.includes(lc));
  if(part) return part.id;
  return null;
}

/* Prefer manifest for pair */
function preferManifestForPair(p1, p2){
  const s1 = (playersById[p1] && playersById[p1].source) ? String(playersById[p1].source).toUpperCase() : null;
  const s2 = (playersById[p2] && playersById[p2].source) ? String(playersById[p2].source).toUpperCase() : null;
  if(s1 === 'WTA' || s2 === 'WTA') return 'WTA';
  if(s1 === 'ATP' || s2 === 'ATP') return 'ATP';
  return null;
}

/* Palette switching */
function applyPaletteForPlayers(leftId, rightId, payload){
  let leftSource = (playersById[leftId] && playersById[leftId].source) ? playersById[leftId].source.toUpperCase() : null;
  let rightSource = (playersById[rightId] && playersById[rightId].source) ? playersById[rightId].source.toUpperCase() : null;
  if(!leftSource && payload && payload.player1 && payload.player1.source) leftSource = payload.player1.source.toUpperCase();
  if(!rightSource && payload && payload.player2 && payload.player2.source) rightSource = payload.player2.source.toUpperCase();
  const anyWta = (leftSource === 'WTA' || rightSource === 'WTA');
  if(anyWta){
    document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue('--accent-WTA-1').trim());
    document.documentElement.style.setProperty('--accent-2', getComputedStyle(document.documentElement).getPropertyValue('--accent-WTA-2').trim());
  } else {
    document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue('--accent-ATP-1').trim());
    document.documentElement.style.setProperty('--accent-2', getComputedStyle(document.documentElement).getPropertyValue('--accent-ATP-2').trim());
  }
}

/* Helpers: attempt to fetch a player JSON from candidate base paths */
async function fetchPlayerJson(pid){
  if(!pid) return null;
  const candidates = [];
  const n = String(pid).trim();
  candidates.push(`${n}.json`);
  candidates.push(`${n.toLowerCase()}.json`);
  candidates.push(`${n.toUpperCase()}.json`);
  // try each base + candidate
  for(const base of H2H_PLAYER_BASES){
    for(const cand of candidates){
      const url = base + cand;
      try {
        const r = await fetch(url, {cache:'no-cache', mode:'cors'});
        if(!r || !r.ok) continue;
        const json = await r.json();
        return { json, url };
      } catch(e){
        continue;
      }
    }
  }
  return null;
}

/* Merge matches from two player JSONs to produce H2H list (dedupe) */
function computeH2HFromPlayers(p1json, p2json, p1id, p2id){
  // p1json.matches entries expected to contain: opponent_id, opponent_name, is_winner, match_id, event_id, event_year, score, match_date, match_link
  // build map by unique key (prefer match_link, fallback event+id+date+score)
  const keyFor = m => {
    if(m.match_link) return `link:${m.match_link}`;
    if(m.match_id && m.event_id) return `id:${m.event_id}#${m.match_id}`;
    const d = m.match_date || m.event_year || '';
    const s = (m.score || m.score_string || '').replace(/\s+/g,'').slice(0,80);
    return `fallback:${d}|${s}|${m.opponent_name||''}`;
  };

  const combined = {}; // key -> normalized match
  const p1name = (p1json && (p1json.player && (p1json.player.full_name || p1json.player.name) || p1json.player1 && (p1json.player1.full_name || p1json.player1.name))) || '';
  const p2name = (p2json && (p2json.player && (p2json.player.full_name || p2json.player.name) || p2json.player2 && (p2json.player2.full_name || p2json.player2.name))) || '';

  const pushMatch = (mRaw, sidePlayerId, sidePlayerName) => {
    const k = keyFor(mRaw);
    // normalize fields
    const opponent_id = (mRaw.opponent_id || mRaw.player_id_loser || mRaw.player_id_winner || '').toString().toUpperCase();
    const opponent_name = (mRaw.opponent_name || mRaw.winner_player_name || mRaw.loser_player_name || '').toString();
    // determine winner/loser names and ids
    // if mRaw has is_winner relative to sidePlayerId:
    const isWinner = !!mRaw.is_winner;
    let winner_name, loser_name, winner_id, loser_id;
    if(isWinner){
      winner_name = sidePlayerName || sidePlayerId;
      loser_name = opponent_name || (opponent_id || '');
      winner_id = sidePlayerId;
      loser_id = opponent_id;
    } else {
      winner_name = opponent_name || (opponent_id || '');
      loser_name = sidePlayerName || sidePlayerId;
      winner_id = opponent_id;
      loser_id = sidePlayerId;
    }
    // keep surface, event, date, score
    const normalized = {
      key: k,
      match_link: mRaw.match_link || mRaw.match_link || '',
      match_id: mRaw.match_id || '',
      event_id: mRaw.event_id || '',
      event_year: mRaw.event_year || '',
      tourney_name: mRaw.tourney_name || mRaw.tourney || '',
      round: mRaw.round || '',
      surface: mRaw.surface || '',
      score_string: mRaw.score || mRaw.score_string || '',
      match_date: mRaw.match_date || '',
      winner_player_name: winner_name,
      loser_player_name: loser_name,
      player_id_winner: (winner_id || '').toString().toUpperCase(),
      player_id_loser: (loser_id || '').toString().toUpperCase()
    };
    // store (or merge if exists preferring complete fields)
    if(!combined[k]){
      combined[k] = normalized;
    } else {
      // prefer entries with match_link or a non-empty score_string
      const cur = combined[k];
      if(!cur.match_link && normalized.match_link) combined[k] = normalized;
      else if((!cur.score_string || cur.score_string.length<3) && normalized.score_string) combined[k] = normalized;
    }
  };

  // scan p1 matches
  if(p1json && Array.isArray(p1json.matches)){
    for(const m of p1json.matches){
      const oppId = (m.opponent_id || '').toString().toUpperCase();
      const condId = (p2id && oppId && oppId === p2id.toString().toUpperCase());
      const condName = (p2name && m.opponent_name && m.opponent_name.toLowerCase().includes(p2name.toLowerCase()));
      if(condId || condName){
        pushMatch(m, p1id, p1name);
      }
    }
  }

  // scan p2 matches
  if(p2json && Array.isArray(p2json.matches)){
    for(const m of p2json.matches){
      const oppId = (m.opponent_id || '').toString().toUpperCase();
      const condId = (p1id && oppId && oppId === p1id.toString().toUpperCase());
      const condName = (p1name && m.opponent_name && m.opponent_name.toLowerCase().includes(p1name.toLowerCase()));
      if(condId || condName){
        pushMatch(m, p2id, p2name);
      }
    }
  }

  // convert combined -> array and compute p1/p2 wins
  const arr = Object.values(combined).sort((a,b)=>{
    // sort by event_year or match_date desc
    const ya = a.event_year || (a.match_date ? a.match_date.slice(0,4) : '') || '';
    const yb = b.event_year || (b.match_date ? b.match_date.slice(0,4) : '') || '';
    if(ya !== yb) return yb.localeCompare(ya);
    return (b.match_date||'').localeCompare(a.match_date||'');
  });

  let p1wins = 0, p2wins = 0;
  for(const m of arr){
    const winnerId = (m.player_id_winner || '').toString().toUpperCase();
    const loserId = (m.player_id_loser || '').toString().toUpperCase();
    if(p1id && winnerId === p1id.toString().toUpperCase()) p1wins++;
    else if(p2id && winnerId === p2id.toString().toUpperCase()) p2wins++;
    else {
      // fallback by comparing names
      const wn = (m.winner_player_name || '').toLowerCase();
      if(p1name && wn.includes(p1name.toLowerCase())) p1wins++;
      else if(p2name && wn.includes(p2name.toLowerCase())) p2wins++;
    }
  }

  return { matches: arr, p1wins, p2wins };
}

/* Render events table (kept) */
function renderEvents(matches){
  eventsTableWrap.innerHTML = '';
  if(!Array.isArray(matches) || matches.length === 0){ eventsTableWrap.innerHTML = '<div class="small-muted">Aucun match H2H</div>'; return; }
  const table = document.createElement('table');
  const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>Year</th><th>Winner</th><th>Event</th><th>Round</th><th>Surface</th><th>Score</th></tr>'; table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for(const m of matches){
    const tr = document.createElement('tr');
    const year = m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : '');
    tr.innerHTML = `<td>${year}</td><td>${m.winner_player_name||'—'}</td><td>${m.tourney_name||'—'}</td><td>${m.round||'—'}</td><td>${m.surface||'—'}</td><td>${m.score_string||'—'}</td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody); eventsTableWrap.appendChild(table);
}

/* Render final payload to UI (expects pair-like payload shape) */
async function renderPayload(payload, jsonUrl, p1, p2){
  resultsWrap.style.display = 'block';
  jsonLinkWrap.innerHTML = jsonUrl ? `<a href="${jsonUrl}" target="_blank" class="small-muted">Voir source</a>` : '<span class="small-muted">No H2H JSON (fallback)</span>';

  // payload may be of two kinds:
  // - prebuilt pair payload (player1/player2, matches)
  // - aggregated object we build from player files (we'll expect player1/player2 and matches)
  const p1payload = payload.player1 || payload.player || {};
  const p2payload = payload.player2 || payload.player || {};
  const leftCatalog = playersById[p1] || {};
  const rightCatalog = playersById[p2] || {};
  const left = Object.assign({}, leftCatalog, p1payload, { id: p1, full_name: p1payload.full_name || leftCatalog.full_name || p1payload.name || leftCatalog.name || '' });
  const right = Object.assign({}, rightCatalog, p2payload, { id: p2, full_name: p2payload.full_name || rightCatalog.full_name || p2payload.name || rightCatalog.name || '' });
  leftNameEl.textContent = left.full_name || left.name || p1;
  rightNameEl.textContent = right.full_name || right.name || p2;
  applyPaletteForPlayers(p1, p2, payload);

  // images
  await renderPlayerImage(leftAvatar, left);
  await renderPlayerImage(rightAvatar, right);

  // info boxes
  leftInfo.innerHTML = ''; rightInfo.innerHTML = '';
  const leftRows = [
    ['Rank', left.rank || left.best_rank || left.highest_ranking || '—'],
    ['Age', left.age || (left.birth_date ? (new Date().getFullYear() - (new Date(left.birth_date)).getFullYear()) : '—') || '—'],
    ['Height', left.height || left.height_cm || left.height_inches || '—'],
    ['Plays', left.plays || '—'],
    ['Backhand', left.backhand || '—']
  ];
  for(const r of leftRows){ const d=document.createElement('div'); d.className='info-row'; d.innerHTML=`<div class="muted-sm">${r[0]}</div><div style="font-weight:700">${r[1]}</div>`; leftInfo.appendChild(d); }
  const rightRows = [
    ['Rank', right.rank || right.best_rank || right.highest_ranking || '—'],
    ['Age', right.age || (right.birth_date ? (new Date().getFullYear() - (new Date(right.birth_date)).getFullYear()) : '—') || '—'],
    ['Height', right.height || right.height_cm || right.height_inches || '—'],
    ['Plays', right.plays || '—'],
    ['Backhand', right.backhand || '—']
  ];
  for(const r of rightRows){ const d=document.createElement('div'); d.className='info-row'; d.innerHTML=`<div class="muted-sm">${r[0]}</div><div style="font-weight:700">${r[1]}</div>`; rightInfo.appendChild(d); }

  // compute aggregates used in UI: H2H counts (may be in payload.aggregates if prebuilt)
  const aggLeft = (payload.aggregates && payload.aggregates.player1) ? payload.aggregates.player1 : {};
  const aggRight = (payload.aggregates && payload.aggregates.player2) ? payload.aggregates.player2 : {};

  // If aggregates missing, fallback to compute from payload.matches
  let matches = payload.matches || [];
  if(!Array.isArray(matches)) matches = [];

  // If no precomputed h2h in aggregates, try deducing from matches
  let leftH2H = (aggLeft.h2h_wins !== undefined) ? (aggLeft.h2h_wins || 0) : null;
  let rightH2H = (aggRight.h2h_wins !== undefined) ? (aggRight.h2h_wins || 0) : null;
  if(leftH2H === null || rightH2H === null){
    leftH2H = 0; rightH2H = 0;
    for(const m of matches){
      const winner = (m.player_id_winner || '').toString().toUpperCase();
      if(p1 && winner === p1.toString().toUpperCase()) leftH2H++;
      else if(p2 && winner === p2.toString().toUpperCase()) rightH2H++;
      else {
        const wn = (m.winner_player_name || '').toLowerCase();
        if(left.full_name && wn.includes(left.full_name.toLowerCase())) leftH2H++;
        else if(right.full_name && wn.includes(right.full_name.toLowerCase())) rightH2H++;
      }
    }
  }

  // shared stats (attempt to show career W/L from aggregates or player raw)
  sharedStats.innerHTML = '';
  const careerLeft = (payload.player && payload.player.career_summary) ? payload.player.career_summary : (aggLeft.career_wins !== undefined ? {wins: aggLeft.career_wins, losses: aggLeft.career_losses} : {});
  const careerRight = (payload.player && payload.player.career_summary) ? payload.player.career_summary : (aggRight.career_wins !== undefined ? {wins: aggRight.career_wins, losses: aggRight.career_losses} : {});

  const rows = [
    {label:'H2H (W/L)', left: `${leftH2H}/${rightH2H===0?0: (rightH2H?0:0)}`, right: `${rightH2H}/${leftH2H===0?0:(leftH2H?0:0)}`},
    {label:'Career W/L', left: (careerLeft && careerLeft.wins!==undefined) ? `${careerLeft.wins}/${careerLeft.losses||0}` : '—', right: (careerRight && careerRight.wins!==undefined) ? `${careerRight.wins}/${careerRight.losses||0}` : '—'},
    {label:'Career titles', left: aggLeft.titles || aggLeft.career_titles || '—', right: aggRight.titles || aggRight.career_titles || '—'},
    {label:'Career prize', left: aggLeft.prize_money || '—', right: aggRight.prize_money || '—'}
  ];
  // Note: the H2H display above uses leftH2H/rightH2H; we also set chart below

  for(const r of rows){
    const div = document.createElement('div'); div.className='stat-item';
    const leftDiv = document.createElement('div'); leftDiv.className='stat-left'; leftDiv.textContent = r.left;
    const center = document.createElement('div'); center.className='stat-center'; center.textContent = r.label;
    const rightDiv = document.createElement('div'); rightDiv.className='stat-right'; rightDiv.textContent = r.right;
    sharedStats.appendChild(div); div.appendChild(leftDiv); div.appendChild(center); div.appendChild(rightDiv);
    const barOut = document.createElement('div'); barOut.className='bar-outer'; barOut.style.marginTop='8px';
    const barIn = document.createElement('div'); barIn.className='bar-inner';
    const nL = parseInt((r.left||'').toString().replace(/[^\d]/g,'')) || 0;
    const nR = parseInt((r.right||'').toString().replace(/[^\d]/g,'')) || 0;
    const pct = (nL + nR) ? Math.round(100 * nL / (nL + nR)) : 0;
    barIn.style.width = pct + '%'; barOut.appendChild(barIn); sharedStats.appendChild(barOut);
  }

  // chart numbers
  let leftWins = leftH2H || 0;
  let rightWins = rightH2H || 0;
  // if still zero and matches present, recompute
  if(leftWins + rightWins === 0 && Array.isArray(matches) && matches.length>0){
    for(const m of matches){
      const winner = (m.player_id_winner || '').toString().toUpperCase();
      if(p1 && winner === p1.toString().toUpperCase()) leftWins++;
      else if(p2 && winner === p2.toString().toUpperCase()) rightWins++;
    }
  }

  const radius = 112;
  const circumference = 2 * Math.PI * radius;
  const leftFraction = (leftWins + rightWins) ? leftWins / (leftWins + rightWins) : 0.5;
  const offset = circumference * (1 - leftFraction);
  chartBar.style.strokeDasharray = `${circumference}`;
  chartBar.style.strokeDashoffset = `${offset}`;
  chartBar.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  chartText.textContent = `${leftWins} — ${rightWins}`;

  // events
  renderEvents(matches || []);
  showStatus(`Chargé: ${matches ? matches.length : 0} matches H2H`, 4500);
}

/* If no information available, show fallback 0-0 */
async function renderFallbackNoH2H(p1, p2){
  const leftCatalog = playersById[p1] || { id: p1, full_name: p1 };
  const rightCatalog = playersById[p2] || { id: p2, full_name: p2 };
  const payload = {
    player1: leftCatalog,
    player2: rightCatalog,
    aggregates: {
      player1: { h2h_wins: 0, h2h_losses: 0, career_wins: leftCatalog.career_wins || 0, career_losses: leftCatalog.career_losses || 0, titles: leftCatalog.titles || 0, prize_money: leftCatalog.prize_money || leftCatalog.prize || '—' },
      player2: { h2h_wins: 0, h2h_losses: 0, career_wins: rightCatalog.career_wins || 0, career_losses: rightCatalog.career_losses || 0, titles: rightCatalog.titles || 0, prize_money: rightCatalog.prize_money || rightCatalog.prize || '—' }
    },
    matches: []
  };
  await renderPayload(payload, null, p1, p2);
}

/* Display button -> reload with ?p1=ID&p2=ID */
displayBtn.addEventListener('click', ()=>{
  const v1 = p1Input.dataset.selectedId || p1Input.value.trim();
  const v2 = p2Input.dataset.selectedId || p2Input.value.trim();
  if(!v1 || !v2){ showStatus('Indique deux joueurs (sélection ou ID).', 4000, true); return; }
  const id1 = resolveIdFromInput(p1Input);
  const id2 = resolveIdFromInput(p2Input);
  if(!id1 || !id2){ showStatus('Impossible de résoudre un des joueurs en ID. Choisis dans la liste ou saisis un ID.', 5000, true); return; }
  const url = new URL(location.href); url.searchParams.set('p1', id1); url.searchParams.set('p2', id2); window.location.href = url.toString();
});

/* Clear & swap */
clearBtn.addEventListener('click', ()=>{ p1Input.value=''; p2Input.value=''; delete p1Input.dataset.selectedId; delete p2Input.dataset.selectedId; resultsWrap.style.display='none'; showStatus('Sélection effacée', 1200); });
swapBtn.addEventListener('click', ()=>{ const a=p1Input.value, aid=p1Input.dataset.selectedId; p1Input.value=p2Input.value; p1Input.dataset.selectedId=p2Input.dataset.selectedId||''; p2Input.value=a; p2Input.dataset.selectedId=aid||''; });

/* On load: load catalog, set inputs (if present), load prioritized manifest, fetch per-player JSONs and compute H2H */
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadCatalog();
  const url = new URL(location.href);
  const urlP1 = url.searchParams.get('p1');
  const urlP2 = url.searchParams.get('p2');
  if(urlP1 && playersById[urlP1]){ p1Input.value = playersById[urlP1].name || urlP1; p1Input.dataset.selectedId = urlP1; }
  if(urlP2 && playersById[urlP2]){ p2Input.value = playersById[urlP2].name || urlP2; p2Input.dataset.selectedId = urlP2; }

  if(urlP1 && urlP2){
    const prefer = preferManifestForPair(urlP1, urlP2);
    await loadImageManifestOnce(prefer);

    // try to fetch both player JSONs (concurrently)
    const [p1Res, p2Res] = await Promise.all([ fetchPlayerJson(urlP1), fetchPlayerJson(urlP2) ]);
    // Cases:
    // - both found -> combine and compute H2H
    // - one found -> try to compute matches by scanning the one found's matches for opponent = other id
    // - none found -> fallback 0-0
    if(!p1Res && !p2Res){
      // no per-player JSONs, fallback
      await renderFallbackNoH2H(urlP1, urlP2);
      return;
    }

    // build player payload objects
    const p1json = p1Res ? p1Res.json : null;
    const p2json = p2Res ? p2Res.json : null;
    const p1url = p1Res ? p1Res.url : null;
    const p2url = p2Res ? p2Res.url : null;

    // compute H2H from available data
    const computed = computeH2HFromPlayers(p1json, p2json, urlP1, urlP2);
    const matches = computed.matches || [];
    const p1wins = computed.p1wins || 0;
    const p2wins = computed.p2wins || 0;

    // create a synthetic payload in the same shape that renderPayload expects
    const player1_obj = (p1json && p1json.player) ? p1json.player : (playersById[urlP1] || { id: urlP1, full_name: (p1json && p1json.player && p1json.player.full_name) || urlP1 });
    const player2_obj = (p2json && p2json.player) ? p2json.player : (playersById[urlP2] || { id: urlP2, full_name: (p2json && p2json.player && p2json.player.full_name) || urlP2 });

    const payload = {
      meta: { generated_at: new Date().toISOString(), pair: [urlP1, urlP2], total_matches: matches.length },
      player1: player1_obj,
      player2: player2_obj,
      aggregates: {
        player1: { h2h_wins: p1wins, h2h_losses: p2wins, career_wins: (p1json && p1json.player && p1json.player.career_summary && p1json.player.career_summary.wins) || (player1_obj && player1_obj.career_summary && player1_obj.career_summary.wins) || 0, prize_money: player1_obj.prize_money || '' },
        player2: { h2h_wins: p2wins, h2h_losses: p1wins, career_wins: (p2json && p2json.player && p2json.player.career_summary && p2json.player.career_summary.wins) || (player2_obj && player2_obj.career_summary && player2_obj.career_summary.wins) || 0, prize_money: player2_obj.prize_money || '' },
        total_matches: matches.length
      },
      matches: matches
    };

    // supply a JSON link string that points to the two source files (if present)
    const jsonUrl = (p1url && p2url) ? `${p1url} + ${p2url}` : (p1url || p2url || null);

    await renderPayload(payload, jsonUrl, urlP1, urlP2);
  } else {
    showStatus('Saisis deux joueurs (nom) puis clique Display H2H. Le catalogue est chargé automatiquement.', 5000);
  }
});
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Head to Head — H2H</title>
<style>
  :root{ --accent:#0b5fff; --muted:#6b7280; --card:#f8fafc; font-family:Inter,system-ui,Arial; }
  body{ margin:0; background:linear-gradient(180deg,#f3f6fb,#fff); color:#0f172a }
  .container{ max-width:1100px; margin:28px auto; padding:18px; }
  .h2h-content{ background:#fff; border-radius:12px; padding:18px; box-shadow:0 8px 30px rgba(11,35,76,0.06) }
  .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .player-picker{ position:relative; display:flex; gap:8px; background:#f3f6fb; padding:8px 10px; border-radius:10px; align-items:center }
  .picker-input{ border:none; background:transparent; outline:none; width:240px; font-weight:600; color:#0b5fff }
  .btn{ padding:8px 12px; border-radius:8px; cursor:pointer; border:none; font-weight:600 }
  .btn-primary{ background:var(--accent); color:#fff }
  .btn-ghost{ background:transparent; border:1px solid #e6eefc; color:var(--accent) }
  .msg{ margin-top:12px; padding:10px; border-radius:8px; background:#f6fcff; color:var(--muted) }
  .autocomplete-list{ position:absolute; z-index:1500; background:white; border-radius:8px; box-shadow:0 6px 20px rgba(15,23,42,0.08); width:360px; max-height:320px; overflow:auto }
  .autocomplete-item{ padding:8px 10px; border-bottom:1px solid #f4f7fb; cursor:pointer; display:flex; gap:10px; align-items:center }
  .muted{ color:var(--muted); font-size:13px }
  /* minimal for results */
  .match-stats{ display:flex; gap:18px; align-items:center; justify-content:space-between; padding:18px 8px; margin-top:18px; }
  .player, .opponent{ width:22%; text-align:center; }
  .headshot{ width:110px;height:110px;border-radius:50%;overflow:hidden;margin:0 auto 8px;background:#eee;display:flex;align-items:center;justify-content:center }
  .headshot img{ width:100%;height:100%;object-fit:cover }
  .chart{ position:relative; width:140px;height:140px }
  .chart svg{ transform:rotate(-90deg) }
  .chart .bar{ stroke:var(--accent); stroke-width:14; stroke-linecap:round }
  .chart circle{ stroke:#e6eefc; stroke-width:14 }
  .h2h-data{ display:flex; gap:18px; padding:12px; margin-top:8px }
  .player-data, .opponent-data{ width:24%; background:var(--card); padding:12px; border-radius:10px }
  .shared-data{ flex:1; background:linear-gradient(180deg,#fff,#fbfdff); padding:12px; border-radius:10px }
  ul{ list-style:none; padding:0; margin:0 }
  li{ display:flex; align-items:center; justify-content:space-between; padding:8px 6px; border-bottom:1px dashed rgba(15,23,42,0.04) }
  .progress{ width:100%; height:8px; background:#eaf2ff; border-radius:6px; margin-top:6px; overflow:hidden }
  .progress .value{ height:100%; background:linear-gradient(90deg,var(--accent),#3dd2c9) }
  .event-breakdown{ margin-top:18px; padding:12px; background:#fff; border-radius:10px }
  table{ width:100%; border-collapse:collapse; font-size:14px }
  th{ text-align:left; padding:8px; color:var(--muted); border-bottom:2px solid #f0f4ff }
  td{ padding:8px; vertical-align:middle; border-bottom:1px solid #f7f9fc }
  @media (max-width:900px){
    .match-stats{ flex-direction:column }
    .h2h-data{ flex-direction:column }
    .player-data, .opponent-data{ width:100% }
    .autocomplete-list{ width:92vw; left:4vw; right:4vw }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="h2h-content">
      <div class="row">
        <div class="player-picker" style="position:relative">
          <input id="p1-input" class="picker-input" placeholder="Joueur 1 (nom ou id)" autocomplete="off" />
          <div id="p1-suggestions" class="autocomplete-list" style="display:none"></div>
        </div>

        <button id="swap-btn" class="btn">⇄</button>

        <div class="player-picker" style="position:relative">
          <input id="p2-input" class="picker-input" placeholder="Joueur 2 (nom ou id)" autocomplete="off" />
          <div id="p2-suggestions" class="autocomplete-list" style="display:none"></div>
        </div>

        <button id="display-btn" class="btn btn-primary">Display H2H</button>
        <button id="clear-btn" class="btn btn-ghost">Clear</button>
      </div>

      <div id="status" class="msg" style="display:none"></div>

      <!-- résultats (chargés après reload si p1&p2 fournis) -->
      <div id="results-area" style="display:none">
        <div class="match-stats" id="match-stats">
          <div class="player" id="player-left">
            <div class="headshot" id="left-headshot"><img src="" alt=""></div>
            <div class="muted" id="left-name"></div>
          </div>
          <div class="chart" id="center-chart">
            <svg width="140" height="140" viewBox="0 0 264 264" xmlns="http://www.w3.org/2000/svg" role="img">
              <circle r="127" cx="132" cy="132" fill="transparent"></circle>
              <circle class="bar" r="127" cx="132" cy="132" fill="transparent" stroke-dasharray="797.96" stroke-dashoffset="0"></circle>
            </svg>
            <div style="text-align:center;font-weight:600;margin-top:8px" id="chart-label">Vs wins</div>
          </div>
          <div class="opponent" id="player-right">
            <div class="headshot" id="right-headshot"><img src="" alt=""></div>
            <div class="muted" id="right-name"></div>
          </div>
        </div>

        <div class="h2h-data" id="h2h-data">
          <div class="player-data"><ul id="player-left-list"><li>—</li></ul></div>
          <div class="shared-data"><ul id="shared-list"><li>—</li></ul></div>
          <div class="opponent-data"><ul id="player-right-list"><li>—</li></ul></div>
        </div>

        <div class="event-breakdown" id="event-breakdown">
          <h4>Event Breakdown</h4>
          <div id="event-table-container"><div class="placeholder">—</div></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* Simple, robust head-to-head page
   - Charge players_catalog.json automatiquement à l'arrivée
   - Si URL contient ?p1=ID&p2=ID, page RELOAD affichera le H2H JSON (après le catalogue)
   - Display H2H: force reload en ajoutant ?p1=ID&p2=ID à l'URL
   - Try several candidate paths (relative, root, origin, center-court)
*/

const CATALOG_CANDIDATES = [
  './tools/players_catalog.json',
  '/tools/players_catalog.json',
  window.location.origin + '/tools/players_catalog.json',
  'https://www.center-court.net/tools/players_catalog.json'
];

const H2H_CANDIDATES_BASES = [
  './data/h2h/',
  '/data/h2h/',
  window.location.origin + '/data/h2h/',
  'https://www.center-court.net/data/h2h/'
];

const p1Input = document.getElementById('p1-input');
const p2Input = document.getElementById('p2-input');
const p1Sug = document.getElementById('p1-suggestions');
const p2Sug = document.getElementById('p2-suggestions');
const displayBtn = document.getElementById('display-btn');
const clearBtn = document.getElementById('clear-btn');
const swapBtn = document.getElementById('swap-btn');
const statusEl = document.getElementById('status');

let playersCatalog = null;
let playersIndexById = {};
let playersIndexByName = [];

/* Helpers */
function setStatus(msg, ms=null, isError=false){
  statusEl.style.display = 'block';
  statusEl.textContent = msg;
  statusEl.style.background = isError ? '#fff0f0' : '#f6fcff';
  if (ms) setTimeout(()=> statusEl.style.display='none', ms);
}
function hideStatus(){ statusEl.style.display='none'; }
function qs(name){ const u = new URL(location.href); return u.searchParams.get(name); }
function normId(s){ return s ? String(s).trim().toUpperCase() : ''; }

/* Fetch candidates sequentially */
async function tryFetch(paths){
  for (const p of paths){
    try {
      console.log('[H2H] try', p);
      const r = await fetch(p, {cache:'no-cache', mode:'cors'});
      if (!r.ok){ console.log('[H2H] not ok', p, r.status); continue; }
      const ct = r.headers.get('content-type') || '';
      if (ct.indexOf('application/json') === -1){
        // try parse text anyway
        const txt = await r.text();
        try { const json = JSON.parse(txt); return { json, url: p }; } catch(e){ console.log('[H2H] not json', p); continue; }
      } else {
        const json = await r.json();
        return { json, url: p };
      }
    } catch(err){
      console.log('[H2H] fetch error', p, err && err.message);
      continue;
    }
  }
  return null;
}

/* Load players_catalog.json automatically (first thing) */
async function loadCatalog(){
  setStatus('Chargement du catalogue des joueurs...', 12000);
  const res = await tryFetch(CATALOG_CANDIDATES);
  if (!res){
    setStatus('Impossible de charger players_catalog.json — autocomplétion désactivée. Tu peux entrer des IDs manuellement.', 8000, true);
    playersCatalog = null;
    return;
  }
  playersCatalog = res.json;
  playersIndexById = {};
  playersIndexByName = [];
  if (playersCatalog && Array.isArray(playersCatalog.players)){
    for (const p of playersCatalog.players){
      const id = (p.player_id || p.playerId || '').toString().toUpperCase();
      const name = p.full_name || p.fullName || p.name || '';
      const rec = Object.assign({}, p, { id, name });
      if (id) playersIndexById[id] = rec;
      playersIndexByName.push(rec);
    }
    playersIndexByName.forEach(x => x._lc = (x.name || '').toLowerCase());
    setStatus(`Catalogue chargé (${playersIndexByName.length} joueurs).`, 2500);
  } else {
    setStatus('Catalogue chargé mais format inattendu.', 5000, true);
  }
}

/* Autocomplete */
function findPlayers(q, limit=12){
  q = (q||'').toLowerCase().trim();
  if (!q) return [];
  const out = [];
  if (playersIndexById[q.toUpperCase()]) out.push(playersIndexById[q.toUpperCase()]);
  for (const p of playersIndexByName){
    if (p._lc && p._lc.includes(q)) out.push(p);
    if (out.length >= limit) break;
  }
  return out.slice(0,limit);
}
function renderSuggestions(list, container, inputEl){
  if (!list || list.length===0){ container.style.display='none'; container.innerHTML=''; return; }
  container.innerHTML = '';
  for (const item of list){
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.innerHTML = `<img src="/-/media/alias/player-headshot/${item.id}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;margin-right:8px">
                     <div style="flex:1"><div style="font-weight:600">${item.name}</div><div class="muted">${item.id} • ${item.represented_country||item.country||''}</div></div>`;
    div.addEventListener('click', ()=> {
      inputEl.value = item.id;
      inputEl.dataset.selectedId = item.id;
      container.style.display='none';
    });
    container.appendChild(div);
  }
  container.style.display='block';
}

/* Input listeners */
p1Input.addEventListener('input', ()=> {
  delete p1Input.dataset.selectedId;
  const q = p1Input.value.trim();
  if (!q){ p1Sug.style.display='none'; return; }
  if (!playersCatalog){ p1Sug.style.display='none'; return; }
  const matches = findPlayers(q, 10);
  renderSuggestions(matches, p1Sug, p1Input);
});
p2Input.addEventListener('input', ()=> {
  delete p2Input.dataset.selectedId;
  const q = p2Input.value.trim();
  if (!q){ p2Sug.style.display='none'; return; }
  if (!playersCatalog){ p2Sug.style.display='none'; return; }
  const matches = findPlayers(q, 10);
  renderSuggestions(matches, p2Sug, p2Input);
});
document.addEventListener('click', (ev)=> { if (!ev.target.closest('.player-picker')){ p1Sug.style.display='none'; p2Sug.style.display='none'; } });

/* Resolve to ID: use selectedId, try exact id, else try match by name, else accept alnum ID */
function resolveIdFromInput(val){
  if (!val) return null;
  val = val.trim();
  if (!val) return null;
  if (val.match(/^[A-Za-z0-9]+$/)) {
    // could be id or compact name; prefer exact id in catalog
    const up = val.toUpperCase();
    if (playersIndexById[up]) return up;
    // else accept as id
    return up;
  }
  // else try lookup by name
  if (playersCatalog){
    const lc = val.toLowerCase();
    const exact = playersIndexByName.find(p => p._lc === lc);
    if (exact) return exact.id;
    const partial = playersIndexByName.find(p => p._lc && p._lc.includes(lc));
    if (partial) return partial.id;
  }
  return null;
}

/* Display H2H: MUST RELOAD the page (navigation), not SPA */
displayBtn.addEventListener('click', ()=> {
  let v1 = p1Input.dataset.selectedId || p1Input.value.trim();
  let v2 = p2Input.dataset.selectedId || p2Input.value.trim();
  if (!v1 || !v2){ setStatus('Veuillez indiquer deux joueurs (nom ou ID).', 4000, true); return; }
  // try to resolve to IDs, but we will navigate with what resolveIdFromInput returns (if null -> still use raw as fallback)
  const id1 = resolveIdFromInput(v1) || v1;
  const id2 = resolveIdFromInput(v2) || v2;
  // Build URL and reload page
  const target = window.location.pathname + `?p1=${encodeURIComponent(id1)}&p2=${encodeURIComponent(id2)}`;
  // navigate (full reload)
  window.location.href = target;
});

/* Clear */
clearBtn.addEventListener('click', ()=> {
  p1Input.value=''; p2Input.value=''; delete p1Input.dataset.selectedId; delete p2Input.dataset.selectedId;
  hideResults();
  setStatus('Sélection effacée', 1600);
});

/* Swap */
swapBtn.addEventListener('click', ()=> {
  const a = p1Input.value, aid = p1Input.dataset.selectedId;
  p1Input.value = p2Input.value; p1Input.dataset.selectedId = p2Input.dataset.selectedId || '';
  p2Input.value = a; p2Input.dataset.selectedId = aid || '';
});

/* Hide results area */
function hideResults(){ document.getElementById('results-area').style.display='none'; }

/* Fetch H2H JSON after reload when ?p1 & ?p2 exist */
async function fetchH2H(p1, p2){
  setStatus(`Chargement H2H ${p1} vs ${p2}...`, 12000);
  // build candidate URLs (both orders, mixed case)
  const candidates = [];
  const permutations = [
    [p1, p2],
    [p2, p1],
    [p1.toLowerCase(), p2.toLowerCase()],
    [p2.toLowerCase(), p1.toLowerCase()]
  ];
  const suffixes = ['.json'];
  for (const base of H2H_CANDIDATES_BASES){
    for (const [a,b] of permutations){
      candidates.push(base + `${a}_${b}.json`);
      candidates.push(base + `${a}-${b}.json`);
      candidates.push(base + `${a}${b}.json`);
    }
  }
  // try sequentially
  for (const url of candidates){
    try {
      console.log('[H2H] try H2H URL', url);
      const r = await fetch(url, {cache:'no-cache', mode:'cors'});
      if (!r.ok){
        console.log('[H2H] failed', r.status, url);
        continue;
      }
      const payload = await r.json();
      console.log('[H2H] loaded', url);
      renderH2H(payload, url, p1, p2);
      return;
    } catch(err){
      console.log('[H2H] err', err && err.message, url);
      continue;
    }
  }
  setStatus(`Aucun JSON H2H trouvé pour ${p1} & ${p2}. (essayé plusieurs chemins)`, 8000, true);
}

/* Render H2H payload into page (simple mapping) */
function renderH2H(payload, jsonUrl, leftInputId, rightInputId){
  hideStatus();
  document.getElementById('results-area').style.display='block';
  // left/right player objects (prefer payload.player1/player2)
  const p1obj = payload.player1 || payload.player || payload.left || { id:leftInputId, full_name:leftInputId };
  const p2obj = payload.player2 || payload.opponent || payload.right || { id:rightInputId, full_name:rightInputId };
  // merge with catalog if available
  const leftMerged = Object.assign({}, playersIndexById[p1obj.id] || {}, p1obj);
  const rightMerged = Object.assign({}, playersIndexById[p2obj.id] || {}, p2obj);
  // headshots + names
  const leftHead = document.querySelector('#left-headshot img'); leftHead.alt = leftMerged.full_name || leftMerged.name || leftMerged.id; leftHead.src = leftMerged.headshot || `/-/media/alias/player-headshot/${leftMerged.id}`;
  const rightHead = document.querySelector('#right-headshot img'); rightHead.alt = rightMerged.full_name || rightMerged.name || rightMerged.id; rightHead.src = rightMerged.headshot || `/-/media/alias/player-headshot/${rightMerged.id}`;
  document.getElementById('left-name').textContent = leftMerged.full_name || leftMerged.name || leftMerged.id;
  document.getElementById('right-name').textContent = rightMerged.full_name || rightMerged.name || rightMerged.id;

  // fill left/right info boxes (minimal)
  function fillBox(rec, selector){
    const el = document.querySelector(selector);
    el.innerHTML = '';
    const ul = document.createElement('ul');
    const rows = [
      ['Rank', rec.rank || rec.best_rank || rec.highest_ranking || '—'],
      ['Age', rec.age || '—'],
      ['Height', rec.height || rec.height_cm || '—'],
      ['Plays', rec.plays || '—'],
      ['Backhand', rec.backhand || '—']
    ];
    for (const r of rows){
      const li = document.createElement('li');
      li.innerHTML = `<span class="label">${r[0]}</span><span class="value">${r[1]}</span>`;
      ul.appendChild(li);
    }
    el.appendChild(ul);
  }
  fillBox(leftMerged, '#player-left-list');
  fillBox(rightMerged, '#player-right-list');

  // shared stats from payload.aggregates if present
  const sharedList = document.getElementById('shared-list');
  sharedList.innerHTML = '';
  const leftAgg = (payload.aggregates && payload.aggregates.player1) ? payload.aggregates.player1 : payload.player1 || {};
  const rightAgg = (payload.aggregates && payload.aggregates.player2) ? payload.aggregates.player2 : payload.player2 || {};
  const rows = [
    ['H2H (W/L)', leftAgg.h2h_wins ? (leftAgg.h2h_wins + '/' + (leftAgg.h2h_losses||0)) : '—', rightAgg.h2h_wins ? (rightAgg.h2h_wins + '/' + (rightAgg.h2h_losses||0)) : '—'],
    ['Career W/L', leftAgg.career_wins ? (leftAgg.career_wins + '/' + (leftAgg.career_losses||0)) : '—', rightAgg.career_wins ? (rightAgg.career_wins + '/' + (rightAgg.career_losses||0)) : '—'],
    ['Career prize', leftAgg.prize_money || '—', rightAgg.prize_money || '—']
  ];
  for (const r of rows){
    const li = document.createElement('li');
    const leftVal = r[1] || '—';
    const rightVal = r[2] || '—';
    const nL = Number(String(leftVal).match(/\d+/)?.[0] || 0);
    const nR = Number(String(rightVal).match(/\d+/)?.[0] || 0);
    const pct = (nL + nR) ? Math.round(100 * nL / (nL + nR)) : 0;
    li.innerHTML = `<span class="player">${leftVal}</span><span class="label">${r[0]}</span><span class="opponent">${rightVal}</span><div class="progress"><div class="value" style="width:${pct}%;"></div></div>`;
    sharedList.appendChild(li);
  }

  // chart: compute wins
  let leftWins = (leftAgg && leftAgg.h2h_wins) ? leftAgg.h2h_wins : 0;
  let rightWins = (rightAgg && rightAgg.h2h_wins) ? rightAgg.h2h_wins : 0;
  if (leftWins+rightWins === 0 && Array.isArray(payload.matches)){
    for (const m of payload.matches){
      const w = m.player_id_winner || m.player_winner || m.winner_player_name || m.winner;
      if (w && (String(w).toUpperCase() === String(leftMerged.id).toUpperCase())) leftWins++;
      else rightWins++;
    }
  }
  const svgBar = document.querySelector('.chart .bar');
  if (svgBar){
    const circumference = 2 * Math.PI * 127;
    const leftFraction = (leftWins + rightWins) === 0 ? 0.5 : (leftWins / (leftWins + rightWins));
    const offset = circumference * (1 - leftFraction);
    svgBar.style.strokeDasharray = `${circumference}`;
    svgBar.style.strokeDashoffset = `${offset}`;
    document.getElementById('chart-label').textContent = `${leftWins} — ${rightWins}`;
  }

  // event breakdown table
  const matches = payload.matches || [];
  renderEventTable(matches);

  setStatus(`H2H chargé (${matches.length} matches). JSON: ${jsonUrl}`, 5000);
}

/* Render matches table */
function renderEventTable(matches){
  const cont = document.getElementById('event-table-container');
  if (!matches || matches.length === 0){ cont.innerHTML = '<div class="placeholder">Aucun match H2H</div>'; return; }
  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>Year</th><th>Winner</th><th>Event</th><th>Round</th><th>Surface</th><th>Score</th></tr></thead>';
  const tbody = document.createElement('tbody');
  const sorted = matches.slice().sort((a,b)=> (b.event_year||'').toString().localeCompare((a.event_year||'').toString()));
  for (const m of sorted){
    const year = m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : '');
    const winner = m.winner_player_name || m.winner || '—';
    const event = m.tourney_name || m.tournament_name || m.tournament || '—';
    const round = m.round || '—';
    const surface = m.surface || '—';
    const score = m.score_string || '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${year}</td><td>${winner}</td><td>${event}</td><td>${round}</td><td>${surface}</td><td>${score}</td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  cont.innerHTML = '';
  cont.appendChild(table);
}

/* Initialization: load catalog, then if URL has p1/p2 load H2H */
window.addEventListener('DOMContentLoaded', async ()=>{
  // start by loading catalog (must be automatic)
  await loadCatalog();
  // prefill inputs if p1/p2 in URL
  const urlP1 = qs('p1'); const urlP2 = qs('p2');
  if (urlP1) { p1Input.value = urlP1; p1Input.dataset.selectedId = urlP1.toUpperCase(); }
  if (urlP2) { p2Input.value = urlP2; p2Input.dataset.selectedId = urlP2.toUpperCase(); }
  // If both present, automatically load H2H JSON (this will happen after reload too)
  if (urlP1 && urlP2){
    // try to fetch H2H and render
    await fetchH2H(urlP1, urlP2);
  } else {
    setStatus('Saisis deux joueurs puis clique sur Display H2H. Le catalogue est chargé automatiquement.', 4000);
  }
});
</script>
</body>
</html>

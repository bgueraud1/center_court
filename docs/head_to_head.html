<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Head-to-Head — H2H</title>
<style>
  :root{
    --bg:#f6f9fc; --card:#fff; --muted:#64748b;
    --accent-ATP-1: #0b5fff; --accent-ATP-2: #3dd2c9;
    --accent-WTA-1: #7b3fb5; --accent-WTA-2: #c57be6;
    --accent: var(--accent-ATP-1);
    --accent-2: var(--accent-ATP-2);
    --radius: 12px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color: #0b1a2b;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#fff); }
  .wrap{max-width:1150px;margin:28px auto;padding:18px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:0 10px 30px rgba(9,30,66,0.06);padding:16px}
  .picker-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .picker{display:flex;align-items:center;background:#f3f6fb;padding:8px;border-radius:12px;min-width:300px;position:relative}
  .picker input{border:0;background:transparent;padding:8px 10px;font-weight:700;color:var(--accent);width:260px;outline:none}
  .btn{border-radius:10px;padding:9px 14px;border:0;cursor:pointer;font-weight:700}
  .btn-primary{background:linear-gradient(90deg,var(--accent),#376bf5);color:white}
  .btn-ghost{background:transparent;border:1px solid #e6f0ff;color:var(--accent);padding:8px 12px;border-radius:10px}
  .suggestions{position:absolute;top:100%;left:0;right:0;background:var(--card);border-radius:10px;box-shadow:0 12px 40px rgba(9,30,66,0.08);max-height:320px;overflow:auto;margin-top:8px;z-index:60}
  .suggest-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #f6f9fc;cursor:pointer}
  .suggest-item img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#f2f6fb}
  .suggest-item .title{font-weight:700}
  .suggest-item .meta{font-size:12px;color:var(--muted)}
  .results-grid{display:grid;grid-template-columns:1fr 420px 1fr;gap:20px;align-items:start;margin-top:20px}
  @media (max-width:1000px){ .results-grid{grid-template-columns:1fr; } }
  .profile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
  .avatar{width:150px;height:150px;border-radius:50%;overflow:hidden;background:#f2f6fb;display:flex;align-items:center;justify-content:center}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name-plate{font-weight:800;font-size:18px;color:#08304a}
  .info-card{background:linear-gradient(180deg,#fff,#fbfdff);padding:12px;border-radius:10px;width:100%}
  .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eef6f9}
  .info-row:last-child{border-bottom:0}
  .muted-sm{color:var(--muted);font-size:13px}
  /* center */
  .center-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#fff,#fbfdff)}
  .chart-wrap{width:240px;height:240px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent}
  svg.progress { width:240px;height:240px; overflow:visible; }
  .chart-text{font-weight:800;font-size:18px}
  .shared-list{width:100%;margin-top:6px}
  .stat-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed #f0f6ff}
  .stat-left{width:110px;text-align:left;font-weight:700}
  .stat-center{flex:1;text-align:center;color:var(--muted);font-weight:700}
  .stat-right{width:110px;text-align:right;font-weight:700}
  .bar-outer{height:12px;background:#eef7ff;border-radius:999px;overflow:hidden}
  .bar-inner{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .events{margin-top:18px}
  table{width:100%;border-collapse:collapse;border-radius:8px;overflow:hidden}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #f3f7fb;font-size:14px}
  th{background:#fbfdff;color:var(--muted);font-weight:700}
  .small-muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="picker-row">
        <div class="picker" style="min-width:320px">
          <input id="p1-input" placeholder="Joueur / Joueuse 1 (nom)" aria-label="Joueur 1">
          <div id="p1-suggestions" class="suggestions" style="display:none"></div>
        </div>

        <button id="swap" class="btn">⇄</button>

        <div class="picker" style="min-width:320px">
          <input id="p2-input" placeholder="Joueur / Joueuse 2 (nom)" aria-label="Joueur 2">
          <div id="p2-suggestions" class="suggestions" style="display:none"></div>
        </div>

        <button id="display" class="btn btn-primary">Display H2H</button>
        <button id="clear" class="btn btn-ghost">Clear</button>

        <div style="margin-left:auto" id="json-link-wrap" class="small-muted"></div>
      </div>

      <div id="status" class="small-muted" style="margin-top:10px;display:none"></div>

      <div id="results" style="margin-top:18px;display:none">
        <div class="results-grid">
          <div class="profile card">
            <div class="avatar" id="left-avatar"><img src="" alt=""></div>
            <div class="name-plate" id="left-name">—</div>
            <div class="info-card" id="left-info"></div>
          </div>

          <div class="center-card card" id="center-card">
            <div class="chart-wrap">
              <svg class="progress" viewBox="0 0 264 264" role="img" aria-hidden="true">
                <!-- background track -->
                <circle cx="132" cy="132" r="112" fill="transparent" stroke="#eef6ff" stroke-width="22"></circle>
                <!-- dynamic bar (we will compute circumference) -->
                <circle id="progress-bar" cx="132" cy="132" r="112" fill="transparent" stroke-width="22" stroke-linecap="round" stroke="var(--accent)"></circle>
              </svg>
            </div>
            <div class="chart-text" id="chart-text">—</div>
            <div class="shared-list" id="shared-stats"></div>
          </div>

          <div class="profile card">
            <div class="avatar" id="right-avatar"><img src="" alt=""></div>
            <div class="name-plate" id="right-name">—</div>
            <div class="info-card" id="right-info"></div>
          </div>
        </div>

        <div class="events card" style="margin-top:18px">
          <h4 style="margin:0 0 10px 0">Event breakdown</h4>
          <div id="events-table"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* headtohead improved: robust image manifest lookup, WTA color palette, larger circle */
const PLAYERS_CATALOG_PATHS = [
  '/tools/players_catalog.json',
  './tools/players_catalog.json',
  window.location.origin + '/tools/players_catalog.json',
  'https://www.center-court.net/tools/players_catalog.json'
];

const H2H_BASES = [
  '/data/h2h/',
  './data/h2h/',
  window.location.origin + '/data/h2h/',
  'https://www.center-court.net/data/h2h/'
];

/* manifest candidate paths (try several) */
const IMAGE_MANIFEST_PATHS = [
  '/index/players_atp_images_manifest.json',
  '/index/players_images_manifest.json',
  '/index/players_images_manifest.json',
  '/players_images_manifest.json',
  '/index/players_images.json'
];

/* If you use Cloudinary fallback, set your cloud name here (optional) */
window.CLOUDINARY_CLOUD_NAME = window.CLOUDINARY_CLOUD_NAME || '';

/* elements */
const p1Input = document.getElementById('p1-input');
const p2Input = document.getElementById('p2-input');
const p1Sug = document.getElementById('p1-suggestions');
const p2Sug = document.getElementById('p2-suggestions');
const displayBtn = document.getElementById('display');
const clearBtn = document.getElementById('clear');
const swapBtn = document.getElementById('swap');
const statusEl = document.getElementById('status');
const resultsWrap = document.getElementById('results');
const leftAvatar = document.getElementById('left-avatar');
const rightAvatar = document.getElementById('right-avatar');
const leftNameEl = document.getElementById('left-name');
const rightNameEl = document.getElementById('right-name');
const leftInfo = document.getElementById('left-info');
const rightInfo = document.getElementById('right-info');
const sharedStats = document.getElementById('shared-stats');
const chartBar = document.getElementById('progress-bar');
const chartText = document.getElementById('chart-text');
const eventsTableWrap = document.getElementById('events-table');
const jsonLinkWrap = document.getElementById('json-link-wrap');

let playersCatalog = null;
let playersById = {};
let playersByName = [];
let imageManifest = null;

/* helpers */
function showStatus(msg, ms=4000, err=false){
  statusEl.style.display = 'block';
  statusEl.textContent = msg;
  statusEl.style.color = err ? '#a00' : '';
  if(ms) setTimeout(()=> statusEl.style.display='none', ms);
}
function qs(name){ const u = new URL(location.href); return u.searchParams.get(name); }
function normId(s){ return s ? String(s).trim().toUpperCase() : ''; }

/* try fetch candidate paths */
async function tryFetchList(paths){
  for(const p of paths){
    try{
      const r = await fetch(p, {cache:'no-cache', mode:'cors'});
      if(!r || !r.ok) continue;
      const ct = r.headers.get('content-type') || '';
      if(ct.indexOf('application/json') !== -1) return {json: await r.json(), url: p};
      const txt = await r.text();
      try { return {json: JSON.parse(txt), url: p}; } catch(e){ continue; }
    } catch(e){ continue; }
  }
  return null;
}

/* load players catalog automatically */
async function loadCatalog(){
  const res = await tryFetchList(PLAYERS_CATALOG_PATHS);
  if(!res){ showStatus('Impossible de charger players_catalog.json — autocomplétion désactivée (tu peux entrer un ID).', 7000, true); return; }
  playersCatalog = res.json;
  playersById = {}; playersByName = [];
  if(playersCatalog && Array.isArray(playersCatalog.players)){
    for(const p of playersCatalog.players){
      const id = (p.player_id || p.playerId || '').toString().toUpperCase();
      const name = p.full_name || p.fullName || p.name || '';
      const rec = Object.assign({}, p, {id, name});
      if(id) playersById[id] = rec;
      if(name){ rec._lc = name.toLowerCase(); playersByName.push(rec); }
    }
    showStatus(`Catalogue chargé (${playersByName.length} joueurs).`, 2400);
  } else {
    showStatus('Catalogue chargé mais format inattendu.', 5000, true);
  }
}

/* autocomplete (display only name) */
function searchPlayers(q, limit=12){
  if(!q) return [];
  const s = q.toLowerCase().trim();
  const out = [];
  const up = q.toUpperCase();
  if(playersById[up]) out.push(playersById[up]);
  for(const p of playersByName){
    if(p._lc.includes(s)) out.push(p);
    if(out.length >= limit) break;
  }
  return out.slice(0, limit);
}
function renderSuggestions(list, container, inputEl){
  if(!list || list.length===0){ container.style.display='none'; container.innerHTML=''; return; }
  container.innerHTML = '';
  for(const item of list){
    const div = document.createElement('div');
    div.className = 'suggest-item';
    div.innerHTML = `<img src="/-/media/alias/player-headshot/${item.id}" alt="${item.name}"><div style="flex:1"><div class="title">${item.name}</div><div class="meta">${item.id} • ${item.represented_country||item.country||''}</div></div>`;
    div.addEventListener('click', ()=>{
      inputEl.value = item.name; // only name shown
      inputEl.dataset.selectedId = item.id; // keep id for navigation
      container.style.display = 'none';
    });
    container.appendChild(div);
  }
  container.style.display = 'block';
}

/* inputs */
p1Input.addEventListener('input', ()=>{ delete p1Input.dataset.selectedId; const q=p1Input.value.trim(); if(!q||!playersCatalog){p1Sug.style.display='none';return;} renderSuggestions(searchPlayers(q,12), p1Sug, p1Input); });
p2Input.addEventListener('input', ()=>{ delete p2Input.dataset.selectedId; const q=p2Input.value.trim(); if(!q||!playersCatalog){p2Sug.style.display='none';return;} renderSuggestions(searchPlayers(q,12), p2Sug, p2Input); });
document.addEventListener('click', e => { if(!e.target.closest('.picker')){ p1Sug.style.display='none'; p2Sug.style.display='none'; }});
p1Input.addEventListener('keydown', e => { if(e.key === 'Enter') displayBtn.click(); });
p2Input.addEventListener('keydown', e => { if(e.key === 'Enter') displayBtn.click(); });

/* image manifest loader (robust) */
async function loadImageManifestOnce(){
  if(imageManifest !== null) return imageManifest;
  for(const path of IMAGE_MANIFEST_PATHS){
    try{
      const r = await fetch(path, {cache:'no-cache', mode:'cors'});
      if(!r || !r.ok) continue;
      const json = await r.json();
      imageManifest = Array.isArray(json) ? json : json; // keep structure (array or object)
      console.log('[H2H] image manifest loaded from', path);
      return imageManifest;
    } catch(e){ continue; }
  }
  imageManifest = null;
  return null;
}

/* find entry in manifest: tries by player_id, slug, public_id includes slug, exact public_id matches */
function findManifestEntry(manifest, pid, slug){
  if(!manifest) return null;
  const slugLc = (slug||'').toLowerCase();
  if(Array.isArray(manifest)){
    for(const it of manifest){
      if(!it) continue;
      const entryPid = (it.player_id || it.id || '').toString();
      const entrySlug = (it.slug || (it.public_id||'').split('/').pop() || it.id || '').toString().toLowerCase();
      if(pid && entryPid && String(pid) === String(entryPid)) return it;
      if(slug && entrySlug && (entrySlug === slugLc)) return it;
      if(slug && it.public_id && it.public_id.toLowerCase().indexOf(slugLc) !== -1) return it;
    }
  } else if(typeof manifest === 'object'){
    if(pid && manifest[pid]) return manifest[pid];
    if(slug && manifest[slug]) return manifest[slug];
    // try values
    for(const k of Object.keys(manifest)){
      const it = manifest[k];
      if(!it) continue;
      if(pid && (it.player_id && String(it.player_id) === String(pid))) return it;
    }
  }
  return null;
}

/* render single player image into container (async) */
async function renderPlayerImage(containerEl, playerRec){
  containerEl.innerHTML = ''; // clear
  // prepare identifiers
  const pid = (playerRec && (playerRec.id || playerRec.player_id || playerRec.playerId)) ? String(playerRec.id || playerRec.player_id || playerRec.playerId) : '';
  const slug = (playerRec && (playerRec.slug || playerRec.player_slug || playerRec.name)) ? String(playerRec.slug || playerRec.player_slug || playerRec.name).toLowerCase() : '';
  // try manifest(s)
  const manifest = await loadImageManifestOnce();
  const entry = findManifestEntry(manifest, pid, slug);
  if(entry){
    // prefer explicit url
    if(entry.url){
      const img = document.createElement('img'); img.src = entry.url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
      containerEl.appendChild(img); return;
    }
    // build cloudinary url from public_id when possible
    if(entry.public_id && window.CLOUDINARY_CLOUD_NAME){
      const safe = encodeURIComponent(entry.public_id);
      // format: crop to square and auto quality/format, similar to your example
      const url = `https://res.cloudinary.com/${window.CLOUDINARY_CLOUD_NAME}/image/upload/c_fill,g_auto,h_800,w_800/f_auto,q_auto/v1/${entry.public_id}`;
      const img = document.createElement('img'); img.src = url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
      containerEl.appendChild(img); return;
    }
  }
  // fallback to combined fields (image/headshot)
  if(playerRec && (playerRec.image || playerRec.headshot || playerRec.photo)){
    const img = document.createElement('img'); img.src = playerRec.image || playerRec.headshot || playerRec.photo; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
    containerEl.appendChild(img); return;
  }
  // try cloudinary naming convention (pid-slug, slug, pid) if cloud name provided
  if(window.CLOUDINARY_CLOUD_NAME && (pid || slug)){
    const candidates = [];
    if(pid && slug) candidates.push(`players/${pid}-${slug}`);
    if(slug) candidates.push(`players/${slug}`);
    if(pid) candidates.push(`players/${pid}`);
    for(const public_id of candidates){
      const url = `https://res.cloudinary.com/${window.CLOUDINARY_CLOUD_NAME}/image/upload/c_fill,g_auto,h_800,w_800/f_auto,q_auto/v1/${public_id}`;
      // we insert the img; if it 404, browser will show broken image but it's acceptable as last-resort
      const img = document.createElement('img'); img.src = url; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
      img.onerror = ()=> { /* if broken, remove and continue to next candidate */ img.remove(); };
      containerEl.appendChild(img);
      // wait a tick to let onerror potentially fire; but we can't synchronously detect 404 reliably.
      return;
    }
  }
  // last fallback: local alias
  if(pid){
    const img = document.createElement('img'); img.src = `/-/media/alias/player-headshot/${pid}`; img.alt = playerRec.full_name || playerRec.name || pid; img.loading='lazy';
    img.onerror = ()=> { containerEl.innerHTML = '<div style="color:var(--muted)">No image</div>'; };
    containerEl.appendChild(img); return;
  }
  containerEl.innerHTML = '<div style="color:var(--muted)">No image</div>';
}

/* resolve id from input */
function resolveIdFromInput(el){
  if(el.dataset.selectedId) return el.dataset.selectedId;
  const raw = el.value.trim();
  if(!raw) return null;
  const up = raw.toUpperCase();
  if(playersById[up]) return up;
  if(/^[A-Z0-9]+$/.test(up)) return up;
  // name match
  const lc = raw.toLowerCase();
  const exact = playersByName.find(p => p._lc === lc);
  if(exact) return exact.id;
  const part = playersByName.find(p => p._lc && p._lc.includes(lc));
  if(part) return part.id;
  return null;
}

/* display button -> reload page with ?p1=ID&p2=ID */
displayBtn.addEventListener('click', ()=>{
  const v1 = p1Input.dataset.selectedId || p1Input.value.trim();
  const v2 = p2Input.dataset.selectedId || p2Input.value.trim();
  if(!v1 || !v2){ showStatus('Indique deux joueurs (sélection ou ID).', 4000, true); return; }
  const id1 = resolveIdFromInput(p1Input);
  const id2 = resolveIdFromInput(p2Input);
  if(!id1 || !id2){ showStatus('Impossible de résoudre un des joueurs en ID. Choisis dans la liste ou saisis un ID.', 5000, true); return; }
  const url = new URL(location.href);
  url.searchParams.set('p1', id1); url.searchParams.set('p2', id2);
  window.location.href = url.toString(); // full reload
});

/* clear / swap */
clearBtn.addEventListener('click', ()=>{ p1Input.value=''; p2Input.value=''; delete p1Input.dataset.selectedId; delete p2Input.dataset.selectedId; resultsWrap.style.display='none'; showStatus('Sélection effacée', 1200); });
swapBtn.addEventListener('click', ()=>{ const a=p1Input.value, aid=p1Input.dataset.selectedId; p1Input.value=p2Input.value; p1Input.dataset.selectedId=p2Input.dataset.selectedId||''; p2Input.value=a; p2Input.dataset.selectedId=aid||''; });

/* fetch H2H JSON robustly */
async function fetchH2HJson(p1, p2){
  const combos = [[p1,p2],[p2,p1],[p1.toLowerCase(),p2.toLowerCase()],[p2.toLowerCase(),p1.toLowerCase()]];
  const trials = [];
  for(const base of H2H_BASES){
    for(const [a,b] of combos){
      trials.push(base + `${a}_${b}.json`);
      trials.push(base + `${a}-${b}.json`);
      trials.push(base + `${a}${b}.json`);
    }
  }
  for(const url of trials){
    try{
      const r = await fetch(url, {cache:'no-cache', mode:'cors'});
      if(!r || !r.ok) continue;
      const json = await r.json();
      return {json, url};
    }catch(e){ continue; }
  }
  return null;
}

/* render shared stats + set colors for WTA if necessary */
function applyPaletteForPlayers(leftId, rightId, payload){
  // default ATP palette in :root; change CSS vars if WTA detected
  let leftSource = (playersById[leftId] && playersById[leftId].source) ? playersById[leftId].source.toUpperCase() : null;
  let rightSource = (playersById[rightId] && playersById[rightId].source) ? playersById[rightId].source.toUpperCase() : null;
  // fallback: payload may include player1.source/player2.source
  try {
    if(!leftSource && payload && payload.player1 && payload.player1.source) leftSource = payload.player1.source.toUpperCase();
    if(!rightSource && payload && payload.player2 && payload.player2.source) rightSource = payload.player2.source.toUpperCase();
  } catch(e){}
  const anyWta = (leftSource === 'WTA' || rightSource === 'WTA');
  if(anyWta){
    document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue('--accent-WTA-1').trim());
    document.documentElement.style.setProperty('--accent-2', getComputedStyle(document.documentElement).getPropertyValue('--accent-WTA-2').trim());
  } else {
    document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue('--accent-ATP-1').trim());
    document.documentElement.style.setProperty('--accent-2', getComputedStyle(document.documentElement).getPropertyValue('--accent-ATP-2').trim());
  }
}

/* render payload */
async function renderPayload(payload, jsonUrl, p1, p2){
  resultsWrap.style.display = 'block';
  jsonLinkWrap.innerHTML = `<a href="${jsonUrl}" target="_blank" class="small-muted">Voir JSON</a>`;
  // choose player objects
  const p1payload = payload.player1 || payload.player || {};
  const p2payload = payload.player2 || payload.opponent || {};
  // merge with catalog where possible
  const leftCatalog = playersById[p1] || {};
  const rightCatalog = playersById[p2] || {};
  const left = Object.assign({}, leftCatalog, p1payload, { id: p1 });
  const right = Object.assign({}, rightCatalog, p2payload, { id: p2 });
  leftNameEl.textContent = left.full_name || left.name || p1;
  rightNameEl.textContent = right.full_name || right.name || p2;
  // apply palette
  applyPaletteForPlayers(p1, p2, payload);
  // images
  await renderPlayerImage(leftAvatar, left);
  await renderPlayerImage(rightAvatar, right);
  // info boxes
  leftInfo.innerHTML = ''; rightInfo.innerHTML = '';
  const leftRows = [
    ['Rank', left.rank || left.best_rank || left.highest_ranking || '—'],
    ['Age', left.age || (left.birth_date ? (new Date().getFullYear() - (new Date(left.birth_date)).getFullYear()) : '—') || '—'],
    ['Height', left.height || left.height_cm || left.height_inches || '—'],
    ['Plays', left.plays || '—'],
    ['Backhand', left.backhand || '—']
  ];
  for(const r of leftRows){ const d=document.createElement('div'); d.className='info-row'; d.innerHTML=`<div class="muted-sm">${r[0]}</div><div style="font-weight:700">${r[1]}</div>`; leftInfo.appendChild(d); }
  const rightRows = [
    ['Rank', right.rank || right.best_rank || right.highest_ranking || '—'],
    ['Age', right.age || (right.birth_date ? (new Date().getFullYear() - (new Date(right.birth_date)).getFullYear()) : '—') || '—'],
    ['Height', right.height || right.height_cm || right.height_inches || '—'],
    ['Plays', right.plays || '—'],
    ['Backhand', right.backhand || '—']
  ];
  for(const r of rightRows){ const d=document.createElement('div'); d.className='info-row'; d.innerHTML=`<div class="muted-sm">${r[0]}</div><div style="font-weight:700">${r[1]}</div>`; rightInfo.appendChild(d); }

  // aggregates -> shared stats
  const aggLeft = (payload.aggregates && payload.aggregates.player1) ? payload.aggregates.player1 : (payload.player1 || {});
  const aggRight = (payload.aggregates && payload.aggregates.player2) ? payload.aggregates.player2 : (payload.player2 || {});
  aggLeft.id = left.id; aggRight.id = right.id;
  // build rows
  sharedStats.innerHTML = '';
  const rows = [
    {label:'H2H (W/L)', left: aggLeft.h2h_wins !== undefined ? `${aggLeft.h2h_wins}/${aggLeft.h2h_losses||0}` : '—', right: aggRight.h2h_wins !== undefined ? `${aggRight.h2h_wins}/${aggRight.h2h_losses||0}` : '—'},
    {label:'Career W/L', left: aggLeft.career_wins !== undefined ? `${aggLeft.career_wins}/${aggLeft.career_losses||0}` : '—', right: aggRight.career_wins !== undefined ? `${aggRight.career_wins}/${aggRight.career_losses||0}` : '—'},
    {label:'Career titles', left: aggLeft.titles || aggLeft.career_titles || '—', right: aggRight.titles || aggRight.career_titles || '—'},
    {label:'Career prize', left: aggLeft.prize_money || '—', right: aggRight.prize_money || '—'}
  ];
  for(const r of rows){
    const div = document.createElement('div'); div.className='stat-item';
    const leftDiv = document.createElement('div'); leftDiv.className='stat-left'; leftDiv.textContent = r.left;
    const center = document.createElement('div'); center.className='stat-center'; center.textContent = r.label;
    const rightDiv = document.createElement('div'); rightDiv.className='stat-right'; rightDiv.textContent = r.right;
    sharedStats.appendChild(div); div.appendChild(leftDiv); div.appendChild(center); div.appendChild(rightDiv);
    const barOut = document.createElement('div'); barOut.className='bar-outer'; barOut.style.marginTop='8px';
    const barIn = document.createElement('div'); barIn.className='bar-inner';
    const nL = parseInt((r.left||'').toString().replace(/[^\d]/g,'')) || 0;
    const nR = parseInt((r.right||'').toString().replace(/[^\d]/g,'')) || 0;
    const pct = (nL + nR) ? Math.round(100 * nL / (nL + nR)) : 0;
    barIn.style.width = pct + '%'; barOut.appendChild(barIn); sharedStats.appendChild(barOut);
  }
  // chart: compute wins numeric
  let leftWins = (aggLeft && aggLeft.h2h_wins) ? aggLeft.h2h_wins : 0;
  let rightWins = (aggRight && aggRight.h2h_wins) ? aggRight.h2h_wins : 0;
  if(leftWins + rightWins === 0 && Array.isArray(payload.matches)){
    for(const m of payload.matches){
      const w = (m.player_id_winner || m.player_winner || m.winner_player_name || m.winner || '').toString().toUpperCase();
      if(w === left.id.toString().toUpperCase()) leftWins++; else if(w === right.id.toString().toUpperCase()) rightWins++;
    }
  }
  // update circular bar (r = 112 used above)
  const radius = 112;
  const circumference = 2 * Math.PI * radius;
  const leftFraction = (leftWins + rightWins) ? leftWins / (leftWins + rightWins) : 0.5;
  const offset = circumference * (1 - leftFraction);
  chartBar.style.strokeDasharray = `${circumference}`;
  chartBar.style.strokeDashoffset = `${offset}`;
  // ensure the stroke color follows CSS var
  chartBar.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  // label
  chartText.textContent = `${leftWins} — ${rightWins}`;
  // events table
  renderEvents(payload.matches || []);
  showStatus(`Chargé: ${payload.matches ? payload.matches.length : 0} matches`, 4500);
}

/* render events table */
function renderEvents(matches){
  eventsTableWrap.innerHTML = '';
  if(!Array.isArray(matches) || matches.length === 0){ eventsTableWrap.innerHTML = '<div class="small-muted">Aucun match H2H</div>'; return; }
  const table = document.createElement('table');
  const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>Year</th><th>Winner</th><th>Event</th><th>Round</th><th>Surface</th><th>Score</th></tr>'; table.appendChild(thead);
  const tbody = document.createElement('tbody');
  const sorted = matches.slice().sort((a,b)=> (b.event_year||'').toString().localeCompare((a.event_year||'').toString()));
  for(const m of sorted){
    const tr = document.createElement('tr');
    const year = m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : '');
    tr.innerHTML = `<td>${year}</td><td>${m.winner_player_name||m.winner||'—'}</td><td>${m.tourney_name||m.tournament||'—'}</td><td>${m.round||'—'}</td><td>${m.surface||'—'}</td><td>${m.score_string||m.score||'—'}</td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody); eventsTableWrap.appendChild(table);
}

/* fetch & render H2H (used on page load when ?p1&p2 or when user reloads) */
async function fetchAndRenderFromUrlParams(){
  const urlP1 = qs('p1'); const urlP2 = qs('p2');
  if(!urlP1 || !urlP2) return;
  showStatus('Chargement du H2H...', 12000);
  const res = await fetchH2HJson(urlP1, urlP2);
  if(!res){ showStatus('Aucun JSON H2H trouvé (vérifie /data/h2h).', 7000, true); return; }
  await loadImageManifestOnce(); // prefetch manifest for images
  await renderPayload(res.json, res.url, urlP1, urlP2);
  hideStatus();
}

/* init */
(async function init(){
  await loadCatalog();
  const p1 = qs('p1'); const p2 = qs('p2');
  if(p1 && playersById[p1]){ p1Input.value = playersById[p1].name || p1; p1Input.dataset.selectedId = p1; }
  if(p2 && playersById[p2]){ p2Input.value = playersById[p2].name || p2; p2Input.dataset.selectedId = p2; }
  if(p1 && p2){ await fetchAndRenderFromUrlParams(); }
  else { showStatus('Saisis deux joueurs (nom) puis clique Display H2H. Le catalogue est chargé automatiquement.', 5000); }
})();

</script>

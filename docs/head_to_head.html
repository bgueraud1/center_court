<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Head to Head — H2H</title>
<style>
  :root{
    --accent:#0b5fff;
    --muted:#6b7280;
    --bg:#fff;
    --card:#f8fafc;
    font-family: Inter, system-ui, "Helvetica Neue", Arial, sans-serif;
  }
  body{ margin:0; color:#0f172a; background: linear-gradient(180deg,#f3f6fb 0%, #fff 100%); }
  .container{ max-width:1150px; margin:28px auto; padding:18px; }
  .h2h-content{ background: white; border-radius:12px; box-shadow: 0 8px 30px rgba(11,35,76,0.06); padding:18px; }
  .top-row{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .search-block{ display:flex; gap:12px; align-items:center; }
  .player-picker{ display:flex; gap:8px; align-items:center; background:#f3f6fb; padding:8px 10px; border-radius:10px; }
  .picker-input{ border:none; background:transparent; outline:none; width:220px; font-weight:600; color:#0b5fff; }
  .picker-input::placeholder{ color:#94a3b8; font-weight:400 }
  .btn{ padding:8px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600 }
  .btn-primary{ background:var(--accent); color:white }
  .btn-ghost{ background:transparent; border:1px solid #e6eefc; color:var(--accent) }
  .swap-btn{ background:#fff; border:1px solid #eee; padding:8px; border-radius:8px; cursor:pointer }
  .match-stats{ display:flex; gap:18px; align-items:center; justify-content:space-between; padding:18px 8px; margin-top:18px; }
  .player, .opponent{ width:22%; text-align:center; }
  .headshot{ width:110px; height:110px; border-radius:50%; overflow:hidden; margin:0 auto 8px; background:#eee; display:flex; align-items:center; justify-content:center; }
  .headshot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .win-stats{ width:34%; display:flex; align-items:center; justify-content:center; }
  .stats{ display:flex; align-items:center; gap:12px; }
  .stats .player, .stats .opponent{ font-size:20px; font-weight:700; width:46px; text-align:center; }
  .chart{ position:relative; width:140px; height:140px; }
  .chart svg{ transform: rotate(-90deg); display:block; }
  .chart .bar{ stroke:var(--accent); stroke-width:14; stroke-linecap:round; }
  .chart circle{ stroke:#e6eefc; stroke-width:14; }
  .chart span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; color:#0f172a; font-size:14px; line-height:1.1; }
  .muted{ color:var(--muted); font-size:13px; }
  .h2h-data{ display:flex; gap:18px; padding:12px; margin-top:8px; }
  .player-data, .opponent-data{ width:24%; background:var(--card); padding:12px; border-radius:10px; }
  .shared-data{ flex:1; background:linear-gradient(180deg, #fff, #fbfdff); padding:12px; border-radius:10px; }
  ul{ list-style:none; padding:0; margin:0; }
  li{ display:flex; align-items:center; justify-content:space-between; padding:8px 6px; border-bottom:1px dashed rgba(15,23,42,0.04); }
  li .label{ flex:1; text-align:center; color:var(--muted); }
  li .player, li .opponent{ width:30%; font-weight:600; text-align:center; }
  .progress{ width:100%; height:8px; background:#eaf2ff; border-radius:6px; margin-top:6px; overflow:hidden; }
  .progress .value{ height:100%; background:linear-gradient(90deg,var(--accent),#3dd2c9); }
  .event-breakdown{ margin-top:18px; padding:12px; background:#fff; border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; padding:8px; color:var(--muted); font-weight:600; border-bottom:2px solid #f0f4ff; }
  td{ padding:8px; vertical-align:middle; border-bottom:1px solid #f7f9fc; }
  .player-image{ width:36px; height:36px; border-radius:50%; object-fit:cover; }
  .autocomplete-list{ position:absolute; z-index:1500; background:white; border-radius:8px; box-shadow: 0 6px 20px rgba(15,23,42,0.08); width:360px; max-height:320px; overflow:auto; }
  .autocomplete-item{ padding:8px 10px; border-bottom:1px solid #f4f7fb; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .autocomplete-item:hover, .autocomplete-item.active{ background:#f3f6fb; }
  .msg{ margin-top:12px; padding:10px; border-radius:8px; background:#fff4; color:var(--muted) }
  @media (max-width:900px){
    .match-stats{ flex-direction:column; gap:12px; align-items:center; }
    .h2h-data{ flex-direction:column; }
    .player-data, .opponent-data{ width:100%; }
    .autocomplete-list{ width:92vw; left:4vw; right:4vw; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="h2h-content" id="h2h-root">
      <div class="top-row">
        <div class="search-block" aria-hidden="false">
          <div class="player-picker" style="position:relative">
            <input id="p1-input" class="picker-input" placeholder="Joueur 1 (nom ou id)" autocomplete="off" />
            <div id="p1-suggestions" class="autocomplete-list" style="display:none"></div>
          </div>

          <button class="swap-btn" id="swap-btn" title="Swap">⇄</button>

          <div class="player-picker" style="position:relative">
            <input id="p2-input" class="picker-input" placeholder="Joueur 2 (nom ou id)" autocomplete="off" />
            <div id="p2-suggestions" class="autocomplete-list" style="display:none"></div>
          </div>

          <button class="btn btn-primary" id="load-btn">Afficher H2H</button>
          <button class="btn btn-ghost" id="clear-btn">Effacer</button>
        </div>

        <div style="display:flex; gap:8px; align-items:center;">
          <a href="#" id="open-json-link" class="muted" target="_blank" style="text-decoration:none; font-size:13px;">Voir JSON (si disponible)</a>
        </div>
      </div>

      <div id="status-msg" class="msg" style="display:none"></div>

      <div class="match-stats" id="match-stats" style="display:none">
        <div class="player" id="player-left">
          <div><div class="headshot" id="left-headshot"><img src="" alt=""></div></div>
          <div class="muted" id="left-name"></div>
        </div>

        <div class="win-stats">
          <div class="stats">
            <div class="player" id="left-wins">0</div>
            <div class="chart" aria-hidden="true">
              <svg width="140" height="140" viewBox="0 0 264 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Win chart">
                <circle r="127" cx="132" cy="132" fill="transparent" ></circle>
                <circle class="bar" r="127" cx="132" cy="132" fill="transparent" stroke-dasharray="797.96" stroke-dashoffset="0"></circle>
              </svg>
              <span id="chart-label">Vs<br>wins</span>
            </div>
            <div class="opponent" id="right-wins">0</div>
          </div>
        </div>

        <div class="opponent" id="player-right">
          <div><div class="headshot" id="right-headshot"><img src="" alt=""></div></div>
          <div class="muted" id="right-name"></div>
        </div>
      </div>

      <div class="h2h-data" id="h2h-data" style="display:none">
        <div class="player-data" id="player-data-left"><ul id="player-left-list"><li class="placeholder">—</li></ul></div>
        <div class="shared-data" id="shared-data"><ul id="shared-list"><li class="placeholder">—</li></ul></div>
        <div class="opponent-data" id="player-data-right"><ul id="player-right-list"><li class="placeholder">—</li></ul></div>
      </div>

      <div class="event-breakdown" id="event-breakdown" style="display:none">
        <h4>Event Breakdown</h4>
        <div class="event-breakdown-list" id="event-table-container"><div class="placeholder">—</div></div>
      </div>
    </div>
  </div>

<script>
/* ====== Configuration ====== */
const PLAYERS_CATALOG_URL = '/tools/players_catalog.json'; // fichier JSON fourni
const H2H_JSON_BASE = '/data/h2h/'; // dossiers data/h2h/{P1}_{P2}.json

/* ====== Utilitaires ====== */
function qs(name, url = location.href) {
  name = name.replace(/[\\[\\]]/g, "\\$&");
  const regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)");
  const results = regex.exec(url);
  if (!results) return null;
  if (!results[2]) return '';
  return decodeURIComponent(results[2].replace(/\+/g, " "));
}
function normId(s){ if (!s) return ''; return String(s).trim().toUpperCase(); }
function safeText(s){ return (s==null||s==='')? '—' : String(s); }
function formatMoney(s){
  if (!s) return '—';
  if (/^[£$€]/.test(s)) return s;
  const n = Number(String(s).replace(/[^0-9\.\-]/g,''));
  if (isNaN(n)) return s;
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
}

/* ====== État ====== */
let playersCatalog = null; // contenu /tools/players_catalog.json
let playersIndexById = {};  // id -> player
let playersIndexByName = []; // array for search {id,full_name,represented_country,rank,source}
const p1Input = document.getElementById('p1-input');
const p2Input = document.getElementById('p2-input');
const p1Sug = document.getElementById('p1-suggestions');
const p2Sug = document.getElementById('p2-suggestions');
const loadBtn = document.getElementById('load-btn');
const swapBtn = document.getElementById('swap-btn');
const clearBtn = document.getElementById('clear-btn');
const statusMsg = document.getElementById('status-msg');
const openJsonLink = document.getElementById('open-json-link');

/* ====== Chargement du catalogue ====== */
async function loadPlayersCatalog(){
  try {
    const res = await fetch(PLAYERS_CATALOG_URL, {cache: "no-cache"});
    if (!res.ok) throw new Error('Catalogue introuvable');
    playersCatalog = await res.json();
    if (!playersCatalog.players || !Array.isArray(playersCatalog.players)) {
      throw new Error('Format catalogue invalide');
    }
    playersIndexById = {};
    playersIndexByName = [];
    for (const p of playersCatalog.players){
      const id = (p.player_id || p.playerId || '').toString().toUpperCase();
      const name = p.full_name || p.fullName || p.name || '';
      const country = p.represented_country || p.country || '';
      const rank = p.rank || p.best_rank || null;
      const source = p.source || (p._raw_row && p._raw_row._source) || '';
      const rec = Object.assign({}, p, { id, name, country, rank, source });
      if (id) playersIndexById[id] = rec;
      playersIndexByName.push({ id, name, country, rank, source, _raw: p });
    }
    // small optimisation: lowercase names for search
    playersIndexByName.forEach(x => x._lc = (x.name || '').toLowerCase());
    showStatus(`Catalogue chargé: ${playersIndexByName.length} joueurs.`, 'info', 3000);
  } catch (err){
    console.warn('Erreur catalogue:', err);
    showStatus('Impossible de charger le catalogue des joueurs (docs/tools/players_catalog.json). La recherche automatique est indisponible.', 'error', 8000);
  }
}

/* ====== Autocomplete simple ====== */
function findPlayersByQuery(q, limit=12){
  q = (q || '').toLowerCase().trim();
  if (!q) return [];
  // search by id exact start, then name includes; rank boost
  const byId = [];
  const byName = [];
  for (const p of playersIndexByName){
    if (!p.id && !p.name) continue;
    if (p.id && p.id.toLowerCase().startsWith(q)) byId.push(p);
    else if (p._lc && p._lc.includes(q)) byName.push(p);
    if (byId.length + byName.length >= limit) break;
  }
  const merged = byId.concat(byName).slice(0, limit);
  return merged;
}

function renderSuggestions(list, container, inputEl){
  if (!list || list.length === 0){
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.innerHTML = '';
  for (const item of list){
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.innerHTML = `<div style="display:flex;align-items:center;gap:10px">
        <img src="/-/media/alias/player-headshot/${item.id}" alt="${item.name}" style="width:36px;height:36px;border-radius:50%;object-fit:cover; background:#f2f6fb"/>
        <div>
          <div style="font-weight:600">${item.name}</div>
          <div class="muted" style="font-size:12px">${item.id} • ${item.country || ''} ${item.rank? '• #'+item.rank : ''}</div>
        </div>
      </div>`;
    div.addEventListener('click', ()=>{
      inputEl.value = item.id || item.name;
      container.style.display = 'none';
      inputEl.dataset.selectedId = item.id; // store selected id
    });
    container.appendChild(div);
  }
  container.style.display = 'block';
}

/* ====== Evénements sur inputs ====== */
p1Input.addEventListener('input', (e)=>{
  delete p1Input.dataset.selectedId;
  const q = p1Input.value.trim();
  if (!q) { p1Sug.style.display='none'; return; }
  // if user typed an ID that exists, show it first
  const norm = q.toUpperCase();
  const matches = [];
  if (playersIndexById[norm]) matches.push(playersIndexById[norm]);
  const found = findPlayersByQuery(q, 12);
  // convert to unified shape
  for (const f of found){
    if (!matches.find(m=>m.id===f.id)) matches.push(f);
  }
  renderSuggestions(matches, p1Sug, p1Input);
});
p2Input.addEventListener('input', (e)=>{
  delete p2Input.dataset.selectedId;
  const q = p2Input.value.trim();
  if (!q) { p2Sug.style.display='none'; return; }
  const norm = q.toUpperCase();
  const matches = [];
  if (playersIndexById[norm]) matches.push(playersIndexById[norm]);
  const found = findPlayersByQuery(q, 12);
  for (const f of found){
    if (!matches.find(m=>m.id===f.id)) matches.push(f);
  }
  renderSuggestions(matches, p2Sug, p2Input);
});

/* close suggestions when clicking outside */
document.addEventListener('click', (ev)=>{
  if (!ev.target.closest('.player-picker')) {
    p1Sug.style.display='none';
    p2Sug.style.display='none';
  }
});

/* allow Enter key on inputs to trigger load */
[p1Input, p2Input].forEach(inp=>{
  inp.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') { e.preventDefault(); loadBtn.click(); }
  });
});

/* ====== Actions boutons ====== */
swapBtn.addEventListener('click', ()=>{
  const a = p1Input.value;
  p1Input.value = p2Input.value;
  p2Input.value = a;
  const ida = p1Input.dataset.selectedId;
  p1Input.dataset.selectedId = p2Input.dataset.selectedId;
  p2Input.dataset.selectedId = ida;
});
clearBtn.addEventListener('click', ()=>{
  p1Input.value = '';
  p2Input.value = '';
  delete p1Input.dataset.selectedId;
  delete p2Input.dataset.selectedId;
  hideAllPanels();
  showStatus('Sélection effacée', 'info', 1800);
});
loadBtn.addEventListener('click', async ()=>{
  const val1 = p1Input.dataset.selectedId || p1Input.value.trim();
  const val2 = p2Input.dataset.selectedId || p2Input.value.trim();
  if (!val1 || !val2) { showStatus('Indiquez deux joueurs (nom ou id).', 'error', 4000); return; }
  // if inputs are names (not IDs), try to resolve to ID via catalog
  const id1 = resolveToId(val1);
  const id2 = resolveToId(val2);
  if (!id1 || !id2) {
    showStatus('Impossible de résoudre au moins un joueur en ID via le catalogue. Tapez l\'ID ou choisissez dans la liste.', 'error', 6000);
    return;
  }
  // update URL
  const url = new URL(location.href);
  url.searchParams.set('p1', id1);
  url.searchParams.set('p2', id2);
  history.replaceState({}, '', url.toString());
  // load H2H JSON
  await fetchAndRenderH2H(id1, id2);
});

/* ====== Résolution nom -> id ====== */
function resolveToId(value){
  if (!value) return null;
  const v = value.trim();
  const up = v.toUpperCase();
  if (playersIndexById[up]) return up;
  // check by exact name
  const lc = v.toLowerCase();
  const exact = playersIndexByName.find(p => p._lc === lc);
  if (exact) return exact.id;
  // partial match returns first
  const partial = playersIndexByName.find(p => p._lc && p._lc.includes(lc));
  if (partial) return partial.id;
  return null;
}

/* ====== Affichage messages ====== */
function showStatus(msg, type='info', autoHideMs=null){
  statusMsg.style.display = 'block';
  statusMsg.textContent = msg;
  statusMsg.style.background = (type === 'error') ? '#fff0f0' : '#f6fcff';
  if (autoHideMs) {
    setTimeout(()=>{ statusMsg.style.display='none'; }, autoHideMs);
  }
}
function hideStatus(){ statusMsg.style.display='none'; }

/* ====== Chargement JSON H2H ====== */
async function fetchH2HJson(p1, p2){
  // essais : /data/h2h/P1_P2.json puis /data/h2h/P2_P1.json
  const candidates = [
    `${H2H_JSON_BASE}${p1}_${p2}.json`,
    `${H2H_JSON_BASE}${p2}_${p1}.json`
  ];
  for (const path of candidates){
    try {
      const r = await fetch(path, {cache: "no-cache"});
      if (!r.ok) continue;
      const json = await r.json();
      return { json, path };
    } catch (err){
      // continue to next candidate
    }
  }
  return null;
}

/* ====== Render H2H (central) ====== */
function hideAllPanels(){
  document.getElementById('match-stats').style.display = 'none';
  document.getElementById('h2h-data').style.display = 'none';
  document.getElementById('event-breakdown').style.display = 'none';
  openJsonLink.href = '#';
}
function setHeadshot(elId, player, fallbackName){
  const el = document.getElementById(elId);
  const img = el.querySelector('img');
  img.alt = fallbackName || (player && player.full_name) || 'Player';
  let src = '';
  if (player && player.headshot) src = player.headshot;
  else if (player && player.id) src = `/-/media/alias/player-headshot/${player.id}`;
  else src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="%23e6eefc"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="%237b8798">No photo</text></svg>';
  img.src = src;
}
function setNameFields(leftObj, rightObj){
  document.getElementById('left-name').textContent = leftObj.full_name || leftObj.name || leftObj.id || '—';
  document.getElementById('right-name').textContent = rightObj.full_name || rightObj.name || rightObj.id || '—';
}

function renderPlayerBox(playerRecord, containerSelector){
  const container = document.querySelector(containerSelector);
  container.innerHTML = '';
  const ul = document.createElement('ul');
  const keys = [
    ['Rank','rank','best_rank','highest_ranking'],
    ['Age','age'],
    ['Weight','weight'],
    ['Height','height_cm','height','height_inches'],
    ['Plays','plays'],
    ['Backhand','backhand'],
    ['Turned Pro','turned_pro']
  ];
  for (const k of keys){
    const label = k[0];
    let val = '';
    for (let i=1;i<k.length;i++){
      const key = k[i];
      if (!key) continue;
      if (playerRecord && (playerRecord[key] !== undefined && playerRecord[key] !== '')) { val = playerRecord[key]; break;}
    }
    const li = document.createElement('li');
    li.innerHTML = `<span class="label">${label}</span><span class="value">${safeText(val)}</span>`;
    ul.appendChild(li);
  }
  container.appendChild(ul);
}

function tryParseRatio(txt){
  if (!txt) return null;
  const m = String(txt).match(/^\\s*(\\d+)\\s*\\/\\s*(\\d+)\\s*$/);
  if (m) {
    return Number(m[1]);
  }
  const m2 = String(txt).match(/(\\d+)/);
  if (m2) return Number(m2[1]);
  return null;
}

function updateChart(leftWins, rightWins){
  document.getElementById('left-wins').textContent = leftWins;
  document.getElementById('right-wins').textContent = rightWins;
  const total = leftWins + rightWins;
  const svgBar = document.querySelector('.chart .bar');
  if (!svgBar) return;
  const circumference = 2 * Math.PI * 127;
  let leftFraction = total === 0 ? 0.5 : leftWins/total;
  const offset = circumference * (1 - leftFraction);
  svgBar.style.strokeDasharray = `${circumference}`;
  svgBar.style.strokeDashoffset = `${offset}`;
}

function renderSharedStats(h2hJson, leftId, rightId){
  const shared = document.getElementById('shared-list');
  shared.innerHTML = '';
  const leftAgg = (h2hJson.aggregates && h2hJson.aggregates.player1) ? h2hJson.aggregates.player1 : (h2hJson.player1 || {});
  const rightAgg = (h2hJson.aggregates && h2hJson.aggregates.player2) ? h2hJson.aggregates.player2 : (h2hJson.player2 || {});
  const matches = h2hJson.matches || [];

  function wlString(obj){
    if (!obj) return '—';
    if (obj.h2h_wins !== undefined && obj.h2h_losses !== undefined) return `${obj.h2h_wins}/${obj.h2h_losses}`;
    if (obj.ytd_wins !== undefined && obj.ytd_losses !== undefined) return `${obj.ytd_wins}/${obj.ytd_losses}`;
    return '—';
  }
  function careerWL(obj){
    if (!obj) return '—';
    if (obj.career_wins !== undefined && obj.career_losses !== undefined) return `${obj.career_wins}/${obj.career_losses}`;
    return '—';
  }
  function careerTitles(obj){ return obj && (obj.titles || obj.career_titles) ? String(obj.titles || obj.career_titles) : '—'; }
  function prizeMoney(obj){ return obj && (obj.prize_money || obj.prize_money_usd || obj.prize) ? formatMoney(obj.prize_money || obj.prize_money_usd || obj.prize) : '—'; }

  const rows = [
    { label:'H2H (W/L)', left: wlString(leftAgg), right: wlString(rightAgg) },
    { label:'YTD W/L', left: leftAgg.ytd ? leftAgg.ytd : (leftAgg.ytd_wins? `${leftAgg.ytd_wins}/${leftAgg.ytd_losses}` : '—'), right: rightAgg.ytd ? rightAgg.ytd : (rightAgg.ytd_wins? `${rightAgg.ytd_wins}/${rightAgg.ytd_losses}` : '—') },
    { label:'Career W/L', left: careerWL(leftAgg), right: careerWL(rightAgg) },
    { label:'Career titles', left: careerTitles(leftAgg), right: careerTitles(rightAgg) },
    { label:'Career prize money', left: prizeMoney(leftAgg), right: prizeMoney(rightAgg) }
  ];
  for (const r of rows){
    const li = document.createElement('li');
    const leftVal = r.left || '—';
    const rightVal = r.right || '—';
    let percent = 0;
    const nL = tryParseRatio(leftVal) || Number(String(leftVal).replace(/[^0-9]/g,'')) || 0;
    const nR = tryParseRatio(rightVal) || Number(String(rightVal).replace(/[^0-9]/g,'')) || 0;
    if ((nL + nR) > 0) percent = Math.round(100 * nL / (nL + nR));
    li.innerHTML = `<span class="player">${safeText(leftVal)}</span><span class="label">${r.label}</span><span class="opponent">${safeText(rightVal)}</span><div class="progress"><div class="value" style="width:${percent}%;"></div></div>`;
    shared.appendChild(li);
  }

  // compute wins for chart
  let leftWins = (leftAgg && leftAgg.h2h_wins) ? leftAgg.h2h_wins : 0;
  let rightWins = (rightAgg && rightAgg.h2h_wins) ? rightAgg.h2h_wins : 0;
  if ((leftWins + rightWins) === 0 && Array.isArray(matches)) {
    for (const m of matches){
      const w = (m.winner_player_name || m.winner || m.player_id_winner || '').toString();
      if (w && (String(w).toUpperCase() === String(leftId).toUpperCase() || (playersIndexById && playersIndexById[leftId] && playersIndexById[leftId].full_name && (m.winner_player_name || '').includes(playersIndexById[leftId].full_name)))) leftWins++;
      else rightWins++;
    }
  }
  updateChart(leftWins, rightWins);
}

/* ====== Event Breakdown ====== */
function renderEventTable(matches){
  const container = document.getElementById('event-table-container');
  if (!matches || matches.length === 0){
    container.innerHTML = '<div class="placeholder">Aucun match head-to-head enregistré.</div>';
    return;
  }
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  thead.innerHTML = `<tr><th width="6%">Year</th><th width="26%">Winner</th><th width="18%">Event</th><th width="12%">Round</th><th width="12%">Surface</th><th width="12%">Score</th><th width="14%">Voir</th></tr>`;
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  // sort by year desc
  const sorted = matches.slice().sort((a,b)=>{
    const ya = a.event_year || (a.match_date? (new Date(a.match_date)).getFullYear() : '');
    const yb = b.event_year || (b.match_date? (new Date(b.match_date)).getFullYear() : '');
    return String(yb).localeCompare(String(ya));
  });
  for (const m of sorted){
    const year = m.event_year || (m.match_date ? (new Date(m.match_date)).getFullYear() : '');
    const winnerName = m.winner_player_name || m.winner || '—';
    const loserName  = m.loser_player_name || m.loser || '—';
    const event = m.tourney_name || m.tournament_name || m.tournament || '—';
    const round = m.round || '—';
    const surface = m.surface || '—';
    const score = m.score_string || '—';
    const link = m.match_link || '#';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${safeText(year)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><img class="player-image" src="${m.winner_image||('/-/media/alias/player-headshot/'+(m.player_id_winner||''))}" alt="${winnerName}" /> <div><div style="font-weight:600">${winnerName}</div><div class="muted">${m.winner_country||''}</div></div></div></td>
      <td><a href="#">${event}</a></td>
      <td>${safeText(round)}</td>
      <td>${safeText(surface)}</td>
      <td>${safeText(score)}</td>
      <td><a class="btn btn-ghost" href="${link}">View</a></td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.innerHTML = '';
  container.appendChild(table);
}

/* ====== Main fetch & render flow ====== */
async function fetchAndRenderH2H(p1, p2){
  hideAllPanels();
  showStatus(`Chargement des données H2H pour ${p1} vs ${p2}…`, 'info');
  openJsonLink.href = '#';
  const res = await fetchH2HJson(p1, p2);
  if (!res) {
    showStatus(`Aucun JSON H2H trouvé pour ${p1} & ${p2}. Assure-toi que ${H2H_JSON_BASE}${p1}_${p2}.json ou ${H2H_JSON_BASE}${p2}_${p1}.json existe.`, 'error', 8000);
    return;
  }
  hideStatus();
  openJsonLink.href = res.path;
  openJsonLink.textContent = 'Voir JSON';
  const payload = res.json;
  // determine left/right from payload or playersCatalog
  const leftId = p1;
  const rightId = p2;
  const leftPlayer = playersIndexById[leftId] || (payload.player1 && payload.player1.id==leftId ? payload.player1 : (payload.player1 && payload.player1.id ? payload.player1 : { id:leftId, full_name: payload.player1 && payload.player1.full_name || leftId }));
  const rightPlayer = playersIndexById[rightId] || (payload.player2 && payload.player2.id==rightId ? payload.player2 : (payload.player2 && payload.player2.id ? payload.player2 : { id:rightId, full_name: payload.player2 && payload.player2.full_name || rightId }));

  // show top match-stats
  document.getElementById('match-stats').style.display = 'flex';
  setHeadshot('left-headshot', leftPlayer, leftPlayer.full_name || leftId);
  setHeadshot('right-headshot', rightPlayer, rightPlayer.full_name || rightId);
  setNameFields(leftPlayer, rightPlayer);

  // render player boxes (merge payload player info with catalog)
  const mergedLeft = Object.assign({}, playersIndexById[leftId] || {}, (payload.player1 || {}));
  const mergedRight = Object.assign({}, playersIndexById[rightId] || {}, (payload.player2 || {}));
  renderPlayerBox(mergedLeft, '#player-left-list');
  renderPlayerBox(mergedRight, '#player-right-list');

  // shared stats
  renderSharedStats(payload, leftId, rightId);

  // matches
  document.getElementById('h2h-data').style.display = 'flex';
  const matches = payload.matches || [];
  renderEventTable(matches);
  document.getElementById('event-breakdown').style.display = 'block';
  showStatus(`Chargé: ${matches.length} matches (JSON: ${res.path})`, 'info', 3000);
}

/* ====== Initialisation ====== */
async function initFromUrl(){
  await loadPlayersCatalog();
  const urlP1 = qs('p1');
  const urlP2 = qs('p2');
  if (urlP1) p1Input.value = urlP1;
  if (urlP2) p2Input.value = urlP2;
  // if both available, try to load
  if (urlP1 && urlP2) {
    const id1 = resolveToId(urlP1) || urlP1.toUpperCase();
    const id2 = resolveToId(urlP2) || urlP2.toUpperCase();
    // set selectedId dataset so when swapping etc it's preserved
    p1Input.dataset.selectedId = id1;
    p2Input.dataset.selectedId = id2;
    await fetchAndRenderH2H(id1, id2);
  } else {
    showStatus('Saisis deux joueurs (nom ou id) et clique sur "Afficher H2H".', 'info', 5000);
  }
}

/* ====== Kickoff ====== */
initFromUrl().catch(err=>{
  console.error(err);
  showStatus('Erreur d\'initialisation. Vérifie la console.', 'error');
});

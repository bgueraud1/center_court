<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Search players by birth date — Center Court</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f7f9fb; padding:2rem; }
    .card { box-shadow: 0 6px 18px rgba(20,30,60,0.06); border: none; }
    .muted { color:#6c757d; }
    .rank-badge { min-width:3.0rem; display:inline-block; text-align:center; }

    /* emoji font fallback and spacing */
    .flag-emoji {
      font-size: 1.1rem;
      margin-right: 0.4rem;
      vertical-align: middle;
      /* encourage color emoji fonts where available */
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      line-height: 1;
    }

    /* alignement nom + drapeau */
    td.name-cell { display: flex; align-items: center; gap: .5rem; white-space: nowrap; }

    /* couleurs douces pour les lignes WTA / ATP (appliquées aux <td> pour fiabilité) */
    .table tbody tr.row-wta td {
      background-color: rgba(255,229,236,0.9); /* rose très clair */
    }
    .table tbody tr.row-atp td {
      background-color: rgba(227,241,255,0.95); /* bleu très clair */
    }

    /* hover (appliqué aux cellules) */
    .table-hover tbody tr.row-wta:hover td {
      background-color: rgba(255,204,220,0.98);
    }
    .table-hover tbody tr.row-atp:hover td {
      background-color: rgba(204,224,255,0.98);
    }

    /* contraste texte */
    tr.row-wta td, tr.row-atp td { color: #212529; }

    .small-muted { color:#6c757d; font-size:.9rem }
    .no-results { color:#6c757d; padding:1rem 0 }
    @media (max-width:575px){ .form-row { flex-direction:column } .form-row > * { width:100%; margin-bottom:.5rem } }
  </style>
</head>
<body>
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card mb-4">
          <div class="card-body">
            <div class="d-flex align-items-center mb-3">
              <h3 class="mb-0">Search players by birth date</h3>
              <small class="ms-3 muted">ATP &amp; WTA</small>
            </div>

            <form id="search-form" class="row g-2 align-items-end form-row">
              <div class="col-auto">
                <label class="form-label small mb-1">Day (DD)</label>
                <input id="day" class="form-control" inputmode="numeric" placeholder="DD" maxlength="2">
              </div>

              <div class="col-auto">
                <label class="form-label small mb-1">Month</label>
                <select id="month" class="form-select">
                  <option value="">— select —</option>
                  <option value="01">January</option>
                  <option value="02">February</option>
                  <option value="03">March</option>
                  <option value="04">April</option>
                  <option value="05">May</option>
                  <option value="06">June</option>
                  <option value="07">July</option>
                  <option value="08">August</option>
                  <option value="09">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>

              <div class="col-auto">
                <label class="form-label small mb-1">Year (optional)</label>
                <input id="year" class="form-control" inputmode="numeric" placeholder="YYYY" maxlength="4">
              </div>

              <div class="col-auto">
                <button id="search" class="btn btn-primary">Search</button>
                <button id="clear" type="button" class="btn btn-outline-secondary ms-2">Clear</button>
              </div>
            </form>

            <div id="status" class="mt-3 small-muted">Loading players index… <span id="loading" class="visually-hidden"><span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span></span></div>

            <div id="results-area" class="mt-3" style="display:none;">
              <div class="table-responsive">
                <table id="results-table" class="table table-sm table-hover align-middle">
                  <thead class="table-light">
                    <tr>
                      <th style="width:1%">#</th>
                      <th>Name</th>
                      <th>Tour</th>
                      <th>Birth date</th>
                      <th style="width:10%">Best rank</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>

            <div id="no-results" class="no-results" style="display:none;">No players found for this date.</div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // CONFIG
    const SENTINEL = 9999999;
    const JSON_PATH = './players_by_birth.json'; // adjust if your JSON lives elsewhere

    let players = [];

    const statusEl = document.getElementById('status');
    const loadingSpan = document.getElementById('loading');
    const resultsArea = document.getElementById('results-area');
    const resultsTbody = document.querySelector('#results-table tbody');
    const noResults = document.getElementById('no-results');

    function showLoading(on=true){ if(on) loadingSpan.classList.remove('visually-hidden'); else loadingSpan.classList.add('visually-hidden'); }
    function pad2(v){ return v.toString().padStart(2,'0'); }

    async function loadIndex(){
      statusEl.textContent = 'Loading players index…';
      showLoading(true);
      try{
        const r = await fetch(JSON_PATH, {cache: "no-store"});
        if(!r.ok) throw new Error('HTTP ' + r.status);
        players = await r.json();
        statusEl.textContent = `Index loaded — ${players.length.toLocaleString()} players.`;
      }catch(err){
        statusEl.innerHTML = 'Unable to load <code>players_by_birth.json</code>: ' + String(err);
        console.error('Failed to load index:', err);
      }finally{
        showLoading(false);
      }
    }
// DEBUG: affiche quelques valeurs pour les premières lignes chargées
function debugDump() {
  if (!players || players.length === 0) return;
  console.log('players sample (first 10):');
  players.slice(0,10).forEach((p,i) => {
    console.log(i+1, {
      full_name: p.full_name,
      country: p.country,
      country_alpha2: p.country_alpha2,
      flag_emoji_raw: p.flag_emoji,
      birth_date: p.birth_date
    });
  });
}

    function matchPlayer(p, day, month, year){
      if(!p.birth_date) return false;
      if(year) return p.birth_date === `${year}-${month}-${day}`;
      return p.birth_day === day && p.birth_month === month;
    }

    function escapeHtml(s){ if(!s) return ''; return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }



/* ---------- Helper : test si emoji drapeau s'affiche réellement ---------- */
/* Méthode : on crée un span invisible, on compare largeur du rendu emoji vs largeur des 2 lettres.
   Si les largeurs diffèrent, l'emoji est (probablement) rendu comme glyph coloré. */
const __emojiRenderCache = {};
function emojiDisplaysAsFlag(alpha2){
  if(!alpha2) return false;
  const key = alpha2.trim().toUpperCase();
  if(__emojiRenderCache[key] !== undefined) return __emojiRenderCache[key];

  // create hidden span
  const span = document.createElement('span');
  span.style.position = 'absolute';
  span.style.visibility = 'hidden';
  span.style.whiteSpace = 'nowrap';
  span.style.fontSize = '16px';
  span.style.lineHeight = '1';
  document.body.appendChild(span);

  const emoji = emojiFromAlpha2(key);
  span.textContent = emoji || key; // put emoji (if present)
  const wEmoji = span.getBoundingClientRect().width;

  span.textContent = key; // put plain letters
  const wLetters = span.getBoundingClientRect().width;

  document.body.removeChild(span);

  // if emoji width differs from letters width, assume emoji rendered
  const result = (emoji && Math.abs(wEmoji - wLetters) > 0.5); // tolerance
  __emojiRenderCache[key] = result;
  return result;
}



/* ---------- decode si JSON contient \u sequences (sécurise) ---------- */
function decodeEscapedUnicode(s){
  if(!s || typeof s !== 'string') return '';
  if(/\\u[0-9a-fA-F]{4}/.test(s)){
    try { return JSON.parse('"' + s.replace(/"/g,'\\"') + '"'); } catch(e){ return s; }
  }
  return s;
}
/* ---------- Helper : crée une <img> drapeau (SVG) et fallback DOM handler ---------- */
function createFlagImageElement(alpha2, size = 20, fallbackEmoji = '') {
  if(!alpha2) {
    // si pas d'alpha2, essaie d'afficher l'emoji brut si fourni
    if (fallbackEmoji) {
      const span = document.createElement('span');
      span.className = 'flag-emoji';
      span.textContent = fallbackEmoji;
      return span;
    }
    return document.createTextNode(''); // rien
  }

  const code = alpha2.trim().toLowerCase();
  const src = `https://flagcdn.com/${code}.svg`; // SVG fiable pour toutes les ISO alpha-2
  const img = document.createElement('img');

  img.src = src;
  img.alt = code;
  img.width = size;
  img.height = Math.round(size * 0.75);
  img.style.marginRight = '.4rem';
  img.style.borderRadius = '2px';
  img.style.objectFit = 'cover';
  img.style.verticalAlign = 'middle';
  img.loading = 'lazy';

  // fallback si l'image ne charge pas : remplace par emoji (si disponible) ou par le code majuscule
  img.onerror = function() {
    // retire l'image cassée
    try { this.remove(); } catch(e) { /* ignore */ }

    if (fallbackEmoji) {
      const span = document.createElement('span');
      span.className = 'flag-emoji';
      span.textContent = fallbackEmoji;
      span.title = alpha2.toUpperCase();
      // insère le span à la place de l'image (si parent existe)
      if (this.parentNode) this.parentNode.insertBefore(span, this.nextSibling);
    } else {
      const txt = document.createTextNode(alpha2.toUpperCase());
      if (this.parentNode) this.parentNode.insertBefore(txt, this.nextSibling);
    }
  };

  return img;
}

/* ---------- Helper simple : emoji à partir d'alpha2 (sera utilisé seulement comme fallback) ---------- */
function emojiFromAlpha2(alpha2){
  if(!alpha2 || typeof alpha2 !== 'string') return '';
  const s = alpha2.trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(s)) return '';
  try {
    const cp1 = 127397 + s.charCodeAt(0);
    const cp2 = 127397 + s.charCodeAt(1);
    return String.fromCodePoint(cp1, cp2);
  } catch(e) {
    return '';
  }
}

// normalize + slugify pour produire "pedro-sousa" depuis "Pedro Sousa" ou "Álvaro O'Neil"
  function slugify(name) {
    if (!name) return '';
    // normalize (décompose les caractères accentués), supprime les marques combinées, puis créer le slug
    const normalized = String(name).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    // remplace tout ce qui n'est pas a-z0-9 par un tiret, compresse les tirets, coupe les bords
    return normalized.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  // --- remplacer ENTIEREMENT la fonction renderResults par celle-ci ---
  function renderResults(list){
    resultsTbody.innerHTML = '';
    list.forEach((r, idx) => {
      const rankDisplay = (r.best_rank && r.best_rank !== SENTINEL) ? r.best_rank : '—';
      const tr = document.createElement('tr');

      // class selon circuit
      const circuit = (r.circuit || '').toUpperCase();
      const circuitClass = circuit === 'WTA' ? 'row-wta' : (circuit === 'ATP' ? 'row-atp' : '');
      if (circuitClass) tr.classList.add(circuitClass);

      // prépare fallback emoji (soit depuis country_alpha2, soit depuis flag_emoji dans le JSON)
      let fallbackEmoji = '';
      if (r.flag_emoji) fallbackEmoji = decodeEscapedUnicode(r.flag_emoji);
      if (!fallbackEmoji && r.country_alpha2) fallbackEmoji = emojiFromAlpha2(r.country_alpha2);

      // colonne # 
      const tdIndex = document.createElement('td');
      tdIndex.className = 'small text-muted';
      tdIndex.textContent = String(idx + 1);
      tr.appendChild(tdIndex);

      // colonne name (flag + nom)
      const tdName = document.createElement('td');
      tdName.className = 'name-cell';
      const strong = document.createElement('strong');

      // drapeau (image ou fallback)
      if (r.country_alpha2) {
        const imgOrSpan = createFlagImageElement(r.country_alpha2, 20, fallbackEmoji);
        strong.appendChild(imgOrSpan);
      } else if (fallbackEmoji) {
        const span = document.createElement('span');
        span.className = 'flag-emoji';
        span.textContent = fallbackEmoji;
        strong.appendChild(span);
      }

      // nom — si player_id présent, on crée un lien vers Center-Court
      const nameText = r.full_name || '';
      const pid = (r.player_id || '').toString().trim();
      if (pid) {
        // détermine le préfixe selon le circuit (ATP → players_atp, autre → players)
        const base = (circuit === 'ATP') ? 'https://www.center-court.net/players_atp' : 'https://www.center-court.net/players';
        // id en minuscules (ex: 'S483' -> 's483') + slug du nom
        const idPart = pid.toLowerCase();
        const slug = slugify(nameText) || idPart;
        const href = `${base}/${idPart}-${slug}`;

        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        // conserve l'apparence du texte (hérite de la couleur), mais tu peux personnaliser via CSS si besoin
        a.style.color = 'inherit';
        a.style.textDecoration = 'none';
        a.appendChild(document.createTextNode(nameText));
        strong.appendChild(a);
      } else {
        // pas d'id : affiche juste le texte (sécurisé via text node)
        strong.appendChild(document.createTextNode(nameText));
      }

      tdName.appendChild(strong);
      tr.appendChild(tdName);

      // colonne tour
      const tdTour = document.createElement('td');
      tdTour.className = 'small-muted';
      tdTour.textContent = r.circuit || '';
      tr.appendChild(tdTour);

      // colonne birth date
      const tdBirth = document.createElement('td');
      tdBirth.className = 'small-muted';
      tdBirth.textContent = r.birth_date || '';
      tr.appendChild(tdBirth);

      // colonne rank
      const tdRank = document.createElement('td');
      const spanRank = document.createElement('span');
      spanRank.className = 'badge bg-light text-dark rank-badge';
      spanRank.textContent = rankDisplay;
      tdRank.appendChild(spanRank);
      tr.appendChild(tdRank);

      resultsTbody.appendChild(tr);
    });
  }
    document.getElementById('search').addEventListener('click', (ev)=>{
      ev.preventDefault();
      noResults.style.display='none';
      resultsArea.style.display='none';

      let day = document.getElementById('day').value.trim();
      const month = document.getElementById('month').value.trim();
      const year = document.getElementById('year').value.trim();
      if(!day){ alert('Please enter a day (DD).'); return; }
      if(!month){ alert('Please select a month.'); return; }
      day = pad2(day);

      const matches = players.filter(p => matchPlayer(p, day, month, year ? year : null));
      if(matches.length === 0){
        noResults.style.display='block';
        statusEl.textContent = `No players found for ${day}-${month}${year ? ' / ' + year : ''}.`;
        return;
      }

      matches.sort((a,b) => (a.best_rank || SENTINEL) - (b.best_rank || SENTINEL));
      renderResults(matches);
      resultsArea.style.display = '';
      statusEl.textContent = `Found ${matches.length} players.`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('clear').addEventListener('click', ()=>{
      document.getElementById('day').value = '';
      document.getElementById('month').value = '';
      document.getElementById('year').value = '';
      resultsTbody.innerHTML = '';
      resultsArea.style.display='none';
      noResults.style.display='none';
      statusEl.textContent = 'Ready.';
    });

    // init
    loadIndex();
  </script>
</body>
</html>

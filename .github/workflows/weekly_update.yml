name: Weekly update (scrape + commit)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      atp_date:
        description: 'Optional date to use for ATP scrape (YYYY-MM-DD). If empty, uses current week Monday.'
        required: false
        default: ''

jobs:
  update_players:
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show initial workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level entries:"
          ls -la | sed -n '1,200p'
          echo "Show possible ranking dirs if present:"
          for d in wta_rankings atp_rankings center_court/wta_rankings center_court/atp_rankings; do
            echo "---- $d ----"
            ls -la "$d" || true
          done

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          pip install geopy pandas "selenium>=4.8" "webdriver-manager>=4.0"

      - name: Prepare tmp branch from origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_FOR_CI || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          AUTH="${GITHUB_TOKEN:-}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — aborting"
            exit 1
          fi

          TMP_BRANCH="update/weekly/${GITHUB_RUN_ID}"
          echo "TMP_BRANCH=${TMP_BRANCH}" >> "$GITHUB_ENV"
          echo "TMP_BRANCH=${TMP_BRANCH}"

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git checkout -B "${TMP_BRANCH}" origin/main
          else
            git checkout -B "${TMP_BRANCH}"
          fi

          echo "On branch: $(git branch --show-current)"
          git status --porcelain || true

      # Run main.py with explicit RANKINGS_DIR absolute path (workspace)
      - name: Run main.py (update CSV)
        working-directory: ${{ github.workspace }}
        env:
          SKIP_GEOCODE: "1"
          RANKINGS_DIR: "${{ github.workspace }}/wta_rankings"
        run: |
          echo "Running main.py with RANKINGS_DIR=${RANKINGS_DIR}"
          python main.py

      - name: Debug show ranking files just after main.py
        run: |
          echo "PWD: $(pwd)"
          echo "--- top-level wta_rankings listing (first 200) ---"
          ls -la wta_rankings | sed -n '1,200p' || true
          echo "--- show most recent files (mtime) ---"
          find wta_rankings -maxdepth 1 -type f -printf '%T@ %p\n' | sort -n | tail -n 10 || true
          echo "--- show sample head for newest file if present ---"
          newest=$(find wta_rankings -type f -name 'data_*.csv' -printf '%T@ %p\n' | sort -n | tail -n1 | cut -d' ' -f2-)
          [ -n "$newest" ] && echo "Newest: $newest" && head -n 5 "$newest" || echo "No data_*.csv found in wta_rankings"

      # (Optional) run ATP scraper similarly if you need it; omitted here for brevity or keep your existing ATP section

      # Recompute best rankings etc.
      - name: Recompute best rankings (WTA)
        run: |
          python3 scripts/recompute_best_rankings.py --rankings-dir wta_rankings --csv player_data_wta.csv

      - name: Recompute best rankings (ATP)
        run: |
          python3 scripts/recompute_best_rankings.py --rankings-dir atp_rankings --csv player_data_atp.csv

      - name: Generate combined players list for blur_game
        run: |
          echo "Generating games/blur_game/players_list.csv and players_ranks.json"
          python3 scripts/generate_players_list.py \
            --wta player_data_wta.csv \
            --atp player_data_atp.csv \
            --out-csv games/blur_game/players_list.csv \
            --out-json games/blur_game/players_ranks.json

      - name: Copy generated JSONs into site_static/tools
        run: |
          mkdir -p site_static/tools
          mkdir -p "${BUILD_DIR}/tools"
          cp -v "${BUILD_DIR}/tools/"*.json site_static/tools/ || true
          ls -la site_static/tools || true

      - name: Run build_all (generate maps & docs)
        env:
          SKIP_GEOCODE: "1"
        run: |
          python scripts/build_all.py --out-dir "${BUILD_DIR}"

      - name: Show build_dir contents (debug)
        run: |
          echo "BUILD_DIR = ${BUILD_DIR}"
          ls -la "${BUILD_DIR}" || true
          ls -la "${BUILD_DIR}/tools" || true
          find "${BUILD_DIR}" -maxdepth 2 -type f | sed -n '1,200p' || true

      - name: Generate birthdate index (players_by_birth.json)
        run: |
          python3 scripts/generate_birthdate_index.py

      - name: Compute weekly league movements
        run: |
          python3 scripts/update_leagues.py \
            --users-csv player_data_users.csv \
            --scores-csv data/scores.csv \
            --week-date "$(date -d 'last monday' +%F)" \
            --out-csv data/users_updated.csv \
            --out-json "${BUILD_DIR}/tools/league_users.json" \
            --sql-file tmp/update_leagues.sql

      - name: Debug git status & untracked sample before commit
        run: |
          echo "=== git status (porcelain) ==="
          git status --porcelain || true
          echo "=== untracked sample (others --exclude-standard) ==="
          git ls-files --others --exclude-standard | sed -n '1,200p' || true
          echo "--- listing wta_rankings (first 200) ---"
          ls -la wta_rankings | sed -n '1,200p' || true

      - name: Generate latest ATP ranking JSON
        run: |
          python3 scripts/generate_latest_rankings_json.py \
            --rankings-dir atp_rankings \
            --players-csv player_data_atp.csv \
            --out ${BUILD_DIR}/tools/latest_atp_ranking.json \
            --latest \
            --circuit ATP \
            --base-url "https://www.center-court.net"

      - name: Generate latest WTA ranking JSON
        run: |
          python3 scripts/generate_latest_rankings_json.py \
            --rankings-dir wta_rankings \
            --players-csv player_data_wta.csv \
            --out ${BUILD_DIR}/tools/latest_wta_ranking.json \
            --latest \
            --circuit WTA \
            --base-url "https://www.center-court.net"

      - name: Generate player meta, maps, detailed stats, scenarios, and leaderboards
        run: |
          set -euo pipefail
          mkdir -p docs/players_atp docs/players docs/leaderboards docs/leaderboards_wta

          python3 scripts/generate_player_meta.py \
            --matches-dir docs/matches/atp_matches \
            --out-dir ./docs \
            --player-data-csv ./player_data_atp.csv

          python3 scripts/generate_player_meta_wta.py \
            --matches-dir docs/matches/wta_matches \
            --out-dir ./docs \
            --player-data-csv ./player_data_atp.csv

          python scripts/generate_maps.py --matches-dir docs/matches/atp_matches --out-dir docs/players_atp --host-event-map ./host_event_map.json
          python scripts/generate_maps_wta.py --matches-dir docs/matches/wta_matches --out-dir docs/players --host-event-map ./host_event_map_wta.json
          python scripts/generate_detailed_stats.py --matches-dir docs/matches/atp_matches --out-dir docs/players_atp --rankings-dir atp_rankings
          python scripts/generate_detailed_stats_wta.py --matches-dir docs/matches/wta_matches --out-dir docs/players --rankings-dir wta_rankings
          python scripts/generate_scenarios.py --matches-dir docs/matches/atp_matches --out-dir docs/players_atp
          python scripts/generate_scenarios_wta.py --matches-dir docs/matches/wta_matches --out-dir docs/players
          python scripts/generate_stats_leaderboards.py --players-dir ./docs/players_atp --out-dir ./docs/leaderboards --players-csv ./player_data_atp.csv
          python scripts/generate_stats_leaderboards_wta.py --players-dir ./docs/players --out-dir ./docs/leaderboards_wta --players-csv ./player_data_wta.csv

      # ---------------------------
      # Commit only newly created/untracked ranking CSVs + docs & CSVs
      # ---------------------------
      - name: Commit ranking CSVs & docs (safe, selective)
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          stage_tree() {
            local path="$1"
            if [ -d "$path" ]; then
              find "$path" -type f -print0 | while IFS= read -r -d '' f; do
                git add -f -- "$f"
              done
            else
              echo "[WARN] Missing directory (skip): $path"
            fi
          }

          echo "Detect untracked files in ranking dirs..."
          dirs="wta_rankings atp_rankings center_court/wta_rankings center_court/atp_rankings"
          for d in $dirs; do
            if [ -d "$d" ]; then
              echo "Scanning $d for untracked files..."
              while IFS= read -r -d '' f; do
                if [ -f "$f" ]; then
                  echo " -> adding $f"
                  git add -f -- "$f"
                fi
              done < <(git ls-files --others --exclude-standard -z -- "$d")
            else
              echo "Dir missing: $d"
            fi
          done

          echo "Also stage specific generated artifacts (whitelist)"
          git add -f ${BUILD_DIR}/tools/*.json 2>/dev/null || true
          git add -f site_static/tools/*.json 2>/dev/null || true
          git add -f site_static/rankings/*.html 2>/dev/null || true
          git add -f site_static/js/*.js 2>/dev/null || true
          git add -f site_static/css/*.css 2>/dev/null || true
          git add -f player_data_wta.csv 2>/dev/null || true
          git add -f player_data_atp.csv 2>/dev/null || true

          stage_tree docs/players_atp
          stage_tree docs/players
          stage_tree docs/leaderboards
          stage_tree docs/leaderboards_wta

          git add -f docs/*.json 2>/dev/null || true
          git add -f docs/*.csv 2>/dev/null || true

          echo "Staged files (preview):"
          git diff --name-only --cached | sed -n '1,200p' || true

          if git diff --name-only --cached | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html is staged by the workflow — aborting to avoid overwriting manual changes."
            echo "Staged list:"
            git diff --name-only --cached || true
            exit 1
          fi

          echo "git status (porcelain):"
          git status --porcelain

          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "chore(automated): weekly update player DB + rebuild docs" || { echo "commit failed"; exit 1; }
          else
            echo "No generated changes to commit"
          fi

      - name: Check for changes
        id: git-check
        run: |
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if git rev-parse HEAD | grep -q $(git rev-parse origin/main); then
              echo "no-changes=true" >> $GITHUB_OUTPUT
            else
              echo "no-changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "no-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes (tmp branch -> main)
        if: steps.git-check.outputs.no-changes == 'false'
        env:
          PAT: ${{ secrets.PAT_FOR_CI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          AUTH="${PAT:-${GITHUB_TOKEN:-}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi

          TMP_BRANCH="${TMP_BRANCH:-update/weekly/${GITHUB_RUN_ID}}"
          echo "TMP_BRANCH=${TMP_BRANCH}"

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true

          # Push the tmp branch that already contains the commit(s)
          git push --set-upstream origin "${TMP_BRANCH}" --force-with-lease || git push --set-upstream origin "${TMP_BRANCH}"

          MAX_RETRIES=4
          attempt=0
          merged_success=false

          while [ $attempt -lt $MAX_RETRIES ]; do
            attempt=$((attempt + 1))
            echo "Merge attempt ${attempt}/${MAX_RETRIES}: update local main and merge ${TMP_BRANCH}..."

            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
            else
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                git checkout -B main origin/main
              else
                git checkout -B main
              fi
            fi

            git fetch origin main --quiet || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              git merge --ff-only origin/main || git merge --no-edit origin/main || true
            fi

            if git merge --no-edit --no-ff "${TMP_BRANCH}"; then
              echo "Merge of ${TMP_BRANCH} into main succeeded locally."
            else
              echo "Merge reported issues; attempting ours strategy."
              git merge --strategy-option=ours --no-edit "${TMP_BRANCH}" || true
            fi

            echo "Attempting to push main to origin (attempt ${attempt})..."
            if git push origin HEAD:main; then
              echo "Push of main successful."
              merged_success=true
              break
            fi

            echo "Push failed on attempt ${attempt}. Will retry after refetch."
            git fetch origin "${TMP_BRANCH}" --quiet || true
            sleep 1
          done

          if [ "$merged_success" = "false" ]; then
            echo "Failed to merge & push main after ${MAX_RETRIES} attempts."
            echo "Work has been preserved on branch: ${TMP_BRANCH} (pushed)."
          fi

          echo "Done. Remote refs:"
          git ls-remote --heads origin main "${TMP_BRANCH}" || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ success() }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "No NETLIFY_BUILD_HOOK set — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true
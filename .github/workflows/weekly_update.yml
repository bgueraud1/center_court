name: Weekly update (scrape + commit)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

jobs:
  update_players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Debug workspace contents
        run: |
          echo "PWD: $(pwd)"
          ls -la
          find . -maxdepth 4 -name 'player_data_wta.csv' -print -exec ls -l {} \; || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          # ensure geopy & pandas present (for the geocoder script)
          pip install geopy pandas

      - name: Run main.py (update CSV)
        env:
          SKIP_GEOCODE: "1"
        run: |
          python main.py

      # ---------- NEW: geocode only missing places (updates cache) ----------
      - name: Geocode missing places and update cache
        env:
          # put a contact in the user agent: keeps Nominatim happy
          USER_AGENT: "center-court-bot/1.0 (your-email@example.com)"
        run: |
          # Only run geocoding if NET SKIP is not set; you may keep SKIP_GEOCODE=1 during main.py,
          # but here we perform the cache update explicitly.
          python scripts/geocode_new_players.py \
            --csv player_base_and_maps/player_data_wta.csv \
            --cache player_base_and_maps/maps_html/coords_cache.json \
            --user-agent "$USER_AGENT" \
            --delay 1.2 \
            --max 1000

      # ---------- Generate embeddings (if used) ----------
      - name: Generate quick embeddings (optional)
        run: |
          python scripts/make_quick_embeddings.py

      # ---------- Build all (maps + players pages) using the updated cache ----------
      - name: Run build_all (generate maps & docs)
        env:
          SKIP_GEOCODE: "1"   # build will use the cache written above
        run: |
          python scripts/build_all.py

      - name: Debug list (optional)
        run: |
          echo "---- repo root listing ----"
          ls -la
          echo "---- docs listing (if any) ----"
          ls -la docs || true

      - name: Commit docs, cache and CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add docs and cache (and CSV) — force docs in case .gitignore ignores it
          git add -f docs || true
          git add -f player_base_and_maps/maps_html/coords_cache.json || true
          git add player_base_and_maps/player_data_wta.csv || true
          git status --porcelain
          git commit -m "chore(automated): weekly update player DB + rebuild docs" || echo "No changes to commit"
          # Note: we do NOT push here (push handled in the next conditional step)

      - name: Check for changes
        id: git-check
        run: |
          # if there are any commits not yet pushed, set no-changes=false
          # This checks whether HEAD is different from origin/main (best-effort)
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if git rev-parse HEAD | grep -q $(git rev-parse origin/main); then
              echo "no-changes=true" >> $GITHUB_OUTPUT
            else
              echo "no-changes=false" >> $GITHUB_OUTPUT
            fi
          else
            # origin/main not present (first push), assume there are changes to push
            echo "no-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes (robust, PAT preferred, fallback to GITHUB_TOKEN)
        if: steps.git-check.outputs.no-changes == 'false'
        env:
          PAT: ${{ secrets.PAT_FOR_CI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Choose auth token: use PAT when available (preferred for triggering downstream workflows),
          # otherwise fallback to the GITHUB_TOKEN that Actions provides automatically.
          AUTH="${PAT:-${GITHUB_TOKEN}}"

          if [ -z "$AUTH" ]; then
            echo "ERROR: no PAT_FOR_CI or GITHUB_TOKEN available to perform push" >&2
            exit 1
          fi

          # Set remote url to embed auth token (so push uses the token). Use HTTPS remote.
          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true

          # Fetch remote state and try to rebase local commits on top of origin/main to avoid rejects.
          git fetch origin main --quiet || true
          # If origin/main exists, rebase; ignore errors (we'll still attempt push)
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git rebase origin/main || echo "rebase had conflicts or failed; continuing to push attempt"
          fi

          # Try normal push first
          echo "Attempting git push origin HEAD:main ..."
          if git push origin HEAD:main; then
            echo "Push succeeded."
          else
            echo "Push failed; attempt push with --force-with-lease (safer force) ..."
            git push --force-with-lease origin HEAD:main
          fi

          # Show remote HEAD for debugging
          git ls-remote origin HEAD || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ success() }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "No NETLIFY_BUILD_HOOK set — skipping deploy trigger"
            exit 0
          fi
          echo "Calling Netlify build hook..."
          curl -s -X POST "$NETLIFY_BUILD_HOOK" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          echo "Netlify response:"
          cat /tmp/netlify_hook_resp.txt || true

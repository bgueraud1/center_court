name: Weekly update (scrape + commit)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      atp_date:
        description: 'Optional date to use for ATP scrape (YYYY-MM-DD). If empty, uses current week Monday.'
        required: false
        default: ''

jobs:
  update_players:
    runs-on: ubuntu-latest
    # --- safety: stop job if running > 30 minutes (ajuste si nécessaire) ---
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Debug workspace contents
        run: |
          echo "PWD: $(pwd)"
          ls -la
          find . -maxdepth 4 -name 'player_data_wta.csv' -print -exec ls -l {} \; || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          # ensure geopy & pandas present (for the geocoder script)
          pip install geopy pandas

      - name: Run main.py (update CSV)
        run: python main.py
        working-directory: ${{ github.workspace }}
        env:
          SKIP_GEOCODE: "1"

      - name: Update ATP CSV from atp_rankings (preliminary)
        run: |
          python scripts/update_atp_from_rankings.py --rankings-dir atp_rankings --csv player_data_atp.csv --fuzzy

      - name: Expire old reviewed flags (WTA)
        run: |
          python scripts/expire_reviews.py --csv player_data_wta.csv --months 6 --active-days 365

      - name: Expire old reviewed flags (ATP)
        if: env.CSV_PATH_ATP != ''
        run: |
          python scripts/expire_reviews.py --csv player_data_atp.csv --months 6 --active-days 365

      - name: Geocode missing places and update cache
        env:
          USER_AGENT: "center-court-bot/1.0 (your-email@example.com)"
        run: |
          python scripts/geocode_new_players.py \
            --csv player_data_wta.csv \
            --cache maps_html/coords_cache.json \
            --user-agent "$USER_AGENT" \
            --delay 1.2 \
            --max 1000

      - name: Generate quick embeddings (optional)
        run: |
          python scripts/make_quick_embeddings.py

      - name: Run build_all (generate maps & docs)
        env:
          SKIP_GEOCODE: "1"
        run: |
          python scripts/build_all.py

      - name: Debug list (optional)
        run: |
          echo "---- repo root listing ----"
          ls -la
          echo "---- docs listing (if any) ----"
          ls -la docs || true

      - name: Commit docs, cache and CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f player_data_wta.csv || true
          git add -f maps_html/coords_cache.json || true
          git add -f docs || true
          echo "---- git status ----"
          git status --porcelain
          echo "---- staged diff (if any) ----"
          git --no-pager diff --staged || true
          git commit -m "chore(automated): weekly update player DB + rebuild docs" || echo "No changes to commit"

      - name: Check for changes
        id: git-check
        run: |
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if git rev-parse HEAD | grep -q $(git rev-parse origin/main); then
              echo "no-changes=true" >> $GITHUB_OUTPUT
            else
              echo "no-changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "no-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes (robust, PAT preferred, fallback to GITHUB_TOKEN)
        if: steps.git-check.outputs.no-changes == 'false'
        env:
          PAT: ${{ secrets.PAT_FOR_CI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "ERROR: no PAT_FOR_CI or GITHUB_TOKEN available to perform push" >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git rebase origin/main || echo "rebase had conflicts or failed; continuing to push attempt"
          fi
          if git push origin HEAD:main; then
            echo "Push succeeded."
          else
            git push --force-with-lease origin HEAD:main
          fi
          git ls-remote origin HEAD || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ success() }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "No NETLIFY_BUILD_HOOK set — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true

      # ---------------------------
      # NEW: compute this week's Monday and create one-line dates file
      #       prefer github.event.inputs.atp_date if provided
      # ---------------------------
      - name: Prepare ATP scrape date (only this Monday)
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.atp_date }}" ]; then
            ISO="${{ github.event.inputs.atp_date }}"
          else
            ISO=$(python3 - <<'PY'
from datetime import date, timedelta
d = date.today()
monday = d - timedelta(days=d.weekday())
print(monday.isoformat())
PY
)
          fi
          echo -e "date\n$ISO" > atp_dates_to_fetch.csv
          echo "Wrote atp_dates_to_fetch.csv containing $ISO"

      - name: Scrape ATP rankings (single week)
        run: |
          python scripts/scrape_atp_resilient_logged_restart_run.py --dates-file atp_dates_to_fetch.csv --headless --max-players 5000

      - name: Update ATP CSV from atp_rankings (final)
        run: |
          python scripts/update_atp_from_rankings.py --rankings-dir atp_rankings --csv player_data_atp.csv --fuzzy

name: Weekly update (scrape + commit)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      atp_date:
        description: 'Optional date to use for ATP scrape (YYYY-MM-DD). If empty, uses current week Monday.'
        required: false
        default: ''

jobs:
  update_players:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show initial workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level entries:"
          ls -la | sed -n '1,200p'
          echo "Show possible ranking dirs if present:"
          for d in wta_rankings atp_rankings center_court/wta_rankings center_court/atp_rankings; do
            echo "---- $d ----"
            ls -la "$d" || true
          done

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          pip install geopy pandas "selenium>=4.8" "webdriver-manager>=4.0"

      # Run main.py with explicit RANKINGS_DIR absolute path (workspace)
      - name: Run main.py (update CSV)
        working-directory: ${{ github.workspace }}
        env:
          SKIP_GEOCODE: "1"
          # ensure we pass absolute path for WTA rankings
          RANKINGS_DIR: "${{ github.workspace }}/wta_rankings"
        run: |
          echo "Running main.py with RANKINGS_DIR=${RANKINGS_DIR}"
          python main.py

      - name: Debug show ranking files just after main.py
        run: |
          echo "PWD: $(pwd)"
          echo "--- top-level wta_rankings listing (first 200) ---"
          ls -la wta_rankings | sed -n '1,200p' || true
          echo "--- show most recent files (mtime) ---"
          find wta_rankings -maxdepth 1 -type f -printf '%T@ %p\n' | sort -n | tail -n 10 || true
          echo "--- show sample head for newest file if present ---"
          newest=$(find wta_rankings -type f -name 'data_*.csv' -printf '%T@ %p\n' | sort -n | tail -n1 | cut -d' ' -f2-)
          [ -n "$newest" ] && echo "Newest: $newest" && head -n 5 "$newest" || echo "No data_*.csv found in wta_rankings"

      # (Optional) run ATP scraper similarly if you need it; omitted here for brevity or keep your existing ATP section

      # Recompute best rankings etc.
      - name: Recompute best rankings (WTA)
        run: |
          python3 scripts/recompute_best_rankings.py --rankings-dir wta_rankings --csv player_data_wta.csv

      - name: Recompute best rankings (ATP)
        run: |
          python3 scripts/recompute_best_rankings.py --rankings-dir atp_rankings --csv player_data_atp.csv

      - name: Generate WTA ranking JSONs (per-date + latest)
        run: |
          python3 scripts/generate_rankings_site_json.py \
            --rankings-dir wta_rankings \
            --players-csv player_data_wta.csv \
            --out-dir docs/tools \
            --prefix wta

      - name: Generate ATP ranking JSONs (per-date + latest)
        run: |
          python3 scripts/generate_rankings_site_json.py \
            --rankings-dir atp_rankings \
            --players-csv player_data_atp.csv \
            --out-dir docs/tools \
            --prefix atp

      
      
      
      - name: Run build_all (generate maps & docs)
        env:
          SKIP_GEOCODE: "1"
        run: |
          python scripts/build_all.py

      - name: Generate birthdate index (players_by_birth.json)
        run: |
          python3 scripts/generate_birthdate_index.py

      - name: Debug git status & untracked sample before commit
        run: |
          echo "=== git status (porcelain) ==="
          git status --porcelain || true
          echo "=== untracked sample (others --exclude-standard) ==="
          git ls-files --others --exclude-standard | sed -n '1,200p' || true
          echo "--- listing wta_rankings (first 200) ---"
          ls -la wta_rankings | sed -n '1,200p' || true

      # ---------------------------
      # Commit only newly created/untracked ranking CSVs + docs & CSVs
      # ---------------------------
      - name: Commit ranking CSVs & docs (safe, null-delimited)
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          echo "Detect untracked files in ranking dirs..."
          dirs="wta_rankings atp_rankings center_court/wta_rankings center_court/atp_rankings"
          untracked_count=0

          # Use null-delimited output to be robust with weird filenames (though our filenames are simple)
          for d in $dirs; do
            if [ -d "$d" ]; then
              echo "Scanning $d for untracked files..."
              # git ls-files --others --exclude-standard with -z
              git ls-files --others --exclude-standard -z -- "$d" | while IFS= read -r -d '' f; do
                if [ -f "$f" ]; then
                  echo " -> adding $f"
                  git add -f -- "$f"
                  untracked_count=$((untracked_count+1))
                fi
              done
            else
              echo "Dir missing: $d"
            fi
          done

          echo "Also ensure we stage important CSVs and docs"
          git add -f player_data_wta.csv 2>/dev/null || true
          git add -f player_data_atp.csv 2>/dev/null || true
          git add -f docs || true
          git add -f docs/tools/*.json 2>/dev/null || true

          echo "Staged files list (name-only):"
          git diff --name-only --cached | sed -n '1,200p' || true

          echo "git status (porcelain):"
          git status --porcelain

          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "chore(automated): weekly update player DB + rebuild docs" || { echo "commit failed"; exit 1; }
          else
            echo "No changes to commit"
          fi

      - name: Check for changes
        id: git-check
        run: |
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if git rev-parse HEAD | grep -q $(git rev-parse origin/main); then
              echo "no-changes=true" >> $GITHUB_OUTPUT
            else
              echo "no-changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "no-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes (robust, PAT preferred, fallback to GITHUB_TOKEN)
        if: steps.git-check.outputs.no-changes == 'false'
        env:
          PAT: ${{ secrets.PAT_FOR_CI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "ERROR: no PAT_FOR_CI or GITHUB_TOKEN available to perform push" >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git rebase origin/main || echo "rebase had conflicts or failed; continuing to push attempt"
          fi
          if git push origin HEAD:main; then
            echo "Push succeeded."
          else
            git push --force-with-lease origin HEAD:main
          fi
          git ls-remote origin HEAD || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ success() }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "No NETLIFY_BUILD_HOOK set — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true

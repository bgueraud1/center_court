name: Weekly update (scrape + commit)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      atp_date:
        description: 'Optional date to use for ATP scrape (YYYY-MM-DD). If empty, uses current week Monday.'
        required: false
        default: ''

jobs:
  update_players:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Debug workspace contents
        run: |
          echo "PWD: $(pwd)"
          ls -la
          find . -maxdepth 4 -name 'player_data_wta.csv' -print -exec ls -l {} \; || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          # libs nécessaires pour les scripts (geopy/pandas + selenium + webdriver-manager)
          pip install geopy pandas "selenium>=4.8" "webdriver-manager>=4.0"

      - name: Run main.py (update CSV)
        working-directory: ${{ github.workspace }}
        env:
          SKIP_GEOCODE: "1"
          RANKINGS_DIR: "${{ github.workspace }}/wta_rankings"
        run: |
          python main.py

      - name: Debug find any produced 2026-01-12 ranking files anywhere in workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Finding any 'data_2026_01_12.csv' in workspace (may be nested)..."
          find . -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true
          echo "Also show any data_2026_01_12.csv in absolute paths under home:"
          find /home/runner -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true

      - name: Debug find any produced data_2026_01_12* files
        run: |
          find . -type f -name "data_2026_01_12*.csv" -print -exec ls -l {} \; || true
          find /home/runner -type f -name "data_2026_01_12*.csv" -print -exec ls -l {} \; || true

      - name: Debug list possible rankings directories (top-level and nested)
        run: |
          echo "Top-level atp_rankings (root):" && ls -la atp_rankings || true
          echo "Top-level wta_rankings (root):" && ls -la wta_rankings || true
          echo "Search for any '*_rankings' directories under repo:"
          find . -maxdepth 3 -type d -name '*_rankings' -print -exec ls -la {} \; || true


      - name: Debug wta_rankings dir after main.py
        run: |
          echo "PWD: $(pwd)"
          echo "Listing wta_rankings (detailed):"
          ls -la wta_rankings || true
          echo "Recent files in wta_rankings (mtime sorted):"
          find wta_rankings -maxdepth 1 -type f -printf '%T@ %p\n' | sort -n | tail -n 20 || true
          for f in wta_rankings/data_*.csv; do
            [ -f "$f" ] && echo "---- $f ----" && head -n 5 "$f"
          done || true


      - name: Expire old reviewed flags (WTA)
        run: |
          python scripts/expire_reviews.py --csv player_data_wta.csv --months 6 --active-days 365

      - name: Expire old reviewed flags (ATP)
        if: env.CSV_PATH_ATP != ''
        run: |
          python scripts/expire_reviews.py --csv player_data_atp.csv --months 6 --active-days 365

      - name: Geocode missing places and update cache
        env:
          USER_AGENT: "center-court-bot/1.0 (your-email@example.com)"
        run: |
          python scripts/geocode_new_players.py \
            --csv player_data_wta.csv \
            --cache maps_html/coords_cache.json \
            --user-agent "$USER_AGENT" \
            --delay 1.2 \
            --max 1000

      - name: Generate quick embeddings (optional)
        run: |
          python scripts/make_quick_embeddings.py

      - name: Debug list (optional)
        run: |
          echo "---- repo root listing ----"
          ls -la
          echo "---- docs listing (if any) ----"
          ls -la docs || true

      # ---------------------------
      # prepare and run the ATP scrape & update step (one-week)
      # ---------------------------
      - name: Prepare ATP scrape date (only this Monday)
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.atp_date }}" ]; then
            ISO="${{ github.event.inputs.atp_date }}"
          else
            ISO=$(python3 -c "from datetime import date, timedelta; d=date.today(); monday=d - timedelta(days=d.weekday()); print(monday.isoformat())")
          fi
          printf "date\n%s\n" "$ISO" > atp_dates_to_fetch.csv
          echo "ISO=$ISO" >> $GITHUB_ENV
          echo "Wrote atp_dates_to_fetch.csv containing $ISO"

      - name: Debug dates and rankings dir
        run: |
          echo "atp_dates_to_fetch.csv:"
          cat atp_dates_to_fetch.csv || true
          echo "Listing atp_rankings (first 50):"
          ls -1 atp_rankings | sed -n '1,50p' || true

      - name: Debug before ATP scrape (cwd + dates-file + atp_rankings listing)
        run: |
          echo "PWD: $(pwd)"
          echo "Content of atp_dates_to_fetch.csv:"
          cat atp_dates_to_fetch.csv || true
          echo "ls -la atp_rankings (cwd)"
          ls -la atp_rankings || true


      - name: Scrape ATP rankings (single week — Xvfb non-headless + profile)
        env:
          SINGLE_ATP_DATE: "1"
          SELENIUM_USER_DATA_DIR: ${{ github.workspace }}/selenium_profile
        run: |
          set -euo pipefail

          echo "==> install xvfb"
          sudo apt-get update -y
          sudo apt-get install -y xvfb x11-utils

          # prepare persistent profile dir for Chrome (workspace so it's in runner FS)
          mkdir -p "${SELENIUM_USER_DATA_DIR}"
          # ensure runner user owns it
          sudo chown -R $(id -u):$(id -g) "${SELENIUM_USER_DATA_DIR}" || true

          echo "==> start Xvfb on :99"
          # start a background X server so Chrome runs in a 'real' display
          Xvfb :99 -screen 0 1920x1080x24 &>/tmp/xvfb.log &
          export DISPLAY=:99
          sleep 1

          echo "DISPLAY is $DISPLAY"
          echo "Profile dir: ${SELENIUM_USER_DATA_DIR}"

          # run scraper non-headless (so Chrome appears 'real' to site); rotate UA helps
          python3 scripts/scrape_player_ranking_atp.py \
            --dates-file atp_dates_to_fetch.csv \
            --no-headless \
            --max-players 5000 \
            --rotate-ua \
            --max-retries-captcha 5 \
            --backoff-factor 2.5


      - name: Upload captcha debug artifacts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: atp-captcha-debug
          path: |
            atp_rankings/captcha_*.png
            atp_rankings/captcha_*.html
        if: always()


      - name: Debug find produced ATP target file anywhere
        run: |
          echo "Find any data_2026_01_12*"
          find . -type f -name "data_2026_01_12*.csv" -print -exec ls -l {} \; || true
          find /home/runner -type f -name "data_2026_01_12*.csv" -print -exec ls -l {} \; || true


      - name: Debug find any produced 2026-01-12 ranking files anywhere in workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Finding any 'data_2026_01_12.csv' in workspace (may be nested)..."
          find . -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true
          echo "Also show any data_2026_01_12.csv in absolute paths under home:"
          find /home/runner -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true

      - name: Debug find any produced data_2026_01_12* files
        run: |
          find . -type f -name "data_2026_01_12*.csv" -print -exec ls -l {} \; || true
          find /home/runner -type f -name "data_2026_01_12*.csv" -print -exec ls -l {} \; || true

      - name: Debug list possible rankings directories (top-level and nested)
        run: |
          echo "Top-level atp_rankings (root):" && ls -la atp_rankings || true
          echo "Top-level wta_rankings (root):" && ls -la wta_rankings || true
          echo "Search for any '*_rankings' directories under repo:"
          find . -maxdepth 3 -type d -name '*_rankings' -print -exec ls -la {} \; || true


      - name: Debug atp_rankings dir after ATP scrape
        run: |
          echo "PWD: $(pwd)"
          echo "Listing atp_rankings (detailed):"
          ls -la atp_rankings || true
          echo "Recent files in atp_rankings (mtime sorted):"
          find atp_rankings -maxdepth 1 -type f -printf '%T@ %p\n' | sort -n | tail -n 20 || true
          echo "Show head of any new data_*.csv files (first 80 chars):"
          for f in atp_rankings/data_*.csv; do
            [ -f "$f" ] && echo "---- $f ----" && head -n 5 "$f"
          done || true


      - name: Update ATP CSV from atp_rankings (only this Monday)
        run: |
          if [ -z "${{ env.ISO }}" ]; then
            echo "ERROR: ISO date not set" >&2
            exit 1
          fi
          python3 scripts/update_atp_from_rankings.py --rankings-dir atp_rankings --csv player_data_atp.csv --fuzzy --date "${ISO}"

      # ---------------------------
      # Recompute best ranks for active players (must run before build_all)
      # ---------------------------
      - name: Recompute best rankings (WTA)
        run: |
          python3 scripts/recompute_best_rankings.py --rankings-dir wta_rankings --csv player_data_wta.csv

      - name: Recompute best rankings (ATP)
        run: |
          python3 scripts/recompute_best_rankings.py --rankings-dir atp_rankings --csv player_data_atp.csv

      # ---------------------------
      # Build maps & docs now that CSVs are up-to-date
      # ---------------------------
      - name: Run build_all (generate maps & docs)
        env:
          SKIP_GEOCODE: "1"
        run: |
          python scripts/build_all.py

      # ---------------------------
      # Regenerate the birthdate index JSON used by the date search tool
      # ---------------------------
      - name: Generate birthdate index (players_by_birth.json)
        run: |
          python3 scripts/generate_birthdate_index.py

      - name: Debug list after build (optional)
        run: |
          echo "---- docs listing after build ----"
          ls -la docs || true
          echo "---- tools listing ----"
          ls -la docs/tools || true

      # ---------------------------
      # COMMIT / PUSH updated CSVs/docs and trigger deploy
      # (moved here so commit includes freshly generated files)


      - name: Show untracked & git status (debug)
        run: |
          echo "=== Git status ==="
          git status --porcelain || true
          echo "=== Untracked files sample ==="
          git ls-files --others --exclude-standard | sed -n '1,200p' || true
          echo "=== atp_rankings sample listing ==="
          ls -la atp_rankings || true
          echo "=== wta_rankings sample listing ==="
          ls -la wta_rankings || true



      - name: Debug find any produced 2026-01-12 ranking files anywhere in workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Finding any 'data_2026_01_12.csv' in workspace (may be nested)..."
          find . -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true
          echo "Also show any data_2026_01_12.csv in absolute paths under home:"
          find /home/runner -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true




      # ---------------------------
      - name: Commit docs, cache and CSV (robust: only new/untracked ranking files)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "==== Debug: cwd ===="
          pwd
          echo "==== Debug: ls (repo root) - first 200 entries ===="
          ls -la | sed -n '1,200p' || true

          # direct candidate dirs (relative to cwd)
          CANDIDATE_DIRS="wta_rankings atp_rankings center_court/wta_rankings center_court/atp_rankings"

          echo "==== Which candidate dirs exist? ===="
          for d in $CANDIDATE_DIRS; do
            if [ -d "$d" ]; then
              echo " - exists: $d"
            else
              echo " - missing: $d"
            fi
          done

          echo "==== List untracked files under ranking dirs (git ls-files) ===="
          # find untracked files only (safe): use git ls-files to avoid false positives
          UNTRACKED=""
          for d in wta_rankings atp_rankings center_court/wta_rankings center_court/atp_rankings; do
            if [ -d "$d" ]; then
              # list untracked files within that dir (only files changed/created in this run)
              this=$(git ls-files --others --exclude-standard -- "$d" || true)
              if [ -n "$this" ]; then
                echo "Untracked in $d:"
                echo "$this" | sed -n '1,200p'
                UNTRACKED="$UNTRACKED $this"
              fi
            fi
          done

          # If none found, show a hint and exit gracefully (no commit)
          if [ -z "${UNTRACKED// /}" ]; then
            echo "No untracked ranking files found to add. Showing git status/ignored for debugging:"
            git status --porcelain
            echo "Untracked by git (others --exclude-standard):"
            git ls-files --others --exclude-standard | sed -n '1,200p' || true
            exit 0
          fi

          # Add only those untracked files (handle spaces/newlines safely)
          added=0
          for f in $UNTRACKED; do
            # ensure file still exists
            if [ -f "$f" ]; then
              echo "-> git add -f -- $f"
              git add -f -- "$f" && added=$((added+1)) || echo "WARNING: git add failed for $f"
            else
              echo "-> skip missing file $f"
            fi
          done

          echo "Ranking files added to index: $added"

          # also add CSV player_data + docs as before (no-op if absent)
          git add -f player_data_wta.csv 2>/dev/null || true
          git add -f player_data_atp.csv 2>/dev/null || true
          git add -f maps_html/coords_cache.json 2>/dev/null || true
          git add -f docs || true

          echo "---- git status (porcelain) AFTER adding ranking files ----"
          git status --porcelain

          echo "---- staged file list (name-only) ----"
          git diff --name-only --cached | sed -n '1,200p' || true

          echo "---- staged diff (if any) ----"
          git --no-pager diff --staged || true

          git commit -m "chore(automated): weekly update player DB + rebuild docs" || echo "No changes to commit"


      - name: Debug find any produced 2026-01-12 ranking files anywhere in workspace ***********
        run: |
          echo "PWD: $(pwd)"
          echo "Finding any 'data_2026_01_12.csv' in workspace (may be nested)..."
          find . -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true
          echo "Also show any data_2026_01_12.csv in absolute paths under home:"
          find /home/runner -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true

      - name: Check for changes
        id: git-check
        run: |
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if git rev-parse HEAD | grep -q $(git rev-parse origin/main); then
              echo "no-changes=true" >> $GITHUB_OUTPUT
            else
              echo "no-changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "no-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes (robust, PAT preferred, fallback to GITHUB_TOKEN)
        if: steps.git-check.outputs.no-changes == 'false'
        env:
          PAT: ${{ secrets.PAT_FOR_CI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "ERROR: no PAT_FOR_CI or GITHUB_TOKEN available to perform push" >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git rebase origin/main || echo "rebase had conflicts or failed; continuing to push attempt"
          fi
          if git push origin HEAD:main; then
            echo "Push succeeded."
          else
            git push --force-with-lease origin HEAD:main
          fi
          git ls-remote origin HEAD || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ success() }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "No NETLIFY_BUILD_HOOK set — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true

      - name: Debug find any produced 2026-01-12 ranking files anywhere in workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Finding any 'data_2026_01_12.csv' in workspace (may be nested)..."
          find . -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true
          echo "Also show any data_2026_01_12.csv in absolute paths under home:"
          find /home/runner -type f -name "data_2026_01_12.csv" -print -exec ls -l {} \; || true

name: Update tournament(s)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tournament_ids:
        description: 'Comma-separated list of tournament ids to scrape (ex: "800,1050")'
        required: true
      tour_type:
        description: 'Type of tour: "wta" or "atp"'
        required: true
        default: 'wta'

jobs:
  run_update:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build
      TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
      TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show workspace (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          pip install geopy pandas "selenium>=4.8" "webdriver-manager>=4.0" playwright
          playwright install --with-deps

      - name: Run scraper for requested tournaments (WTA or ATP)
        env:
          TIDS_INPUT: ${{ github.event.inputs.tournament_ids }}
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
          TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
          TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json
        run: |
          set -euo pipefail
          echo "TIDS_INPUT=${TIDS_INPUT}"
          echo "TOUR_TYPE=${TOUR_TYPE}"

          mkdir -p matches/wta_matches matches/atp_matches
          rm -f created_files.txt || true

          trim() { printf '%s' "$1" | awk '{$1=$1;print}'; }
          TIDS_TRIMMED="$(trim "${TIDS_INPUT:-}")"

          if [ "${TOUR_TYPE}" = "atp" ]; then
            ARGS=(scripts/scraping_atp_matches.py)
            if [ -n "${TIDS_TRIMMED}" ]; then
              ARGS+=(--tournament-ids "${TIDS_TRIMMED}")
            fi
            ARGS+=(--tournaments-json "${TOURNAMENT_DICT_PATH_ATP}")
            ARGS+=(--out-folder "matches/atp_matches")
            ARGS+=(--created-files-out created_files.txt)
            ARGS+=(--headless)
            ARGS+=(--max-attempts 10)
            echo "Calling: python3 ${ARGS[*]}"
            python3 "${ARGS[@]}"
            OUT_DIR="matches/atp_matches"
          else
            ARGS=(scripts/scraping_main.py)
            if [ -n "${TIDS_TRIMMED}" ]; then
              ARGS+=(--tournament-ids "${TIDS_TRIMMED}")
            fi
            ARGS+=(--tournament-dict-path "${TOURNAMENT_DICT_PATH_WTA}")
            ARGS+=(--created-files-out created_files.txt)
            echo "Calling: python3 ${ARGS[*]}"
            python3 "${ARGS[@]}"
            OUT_DIR="matches/wta_matches"
          fi

          echo "Scraper finished. created_files.txt (raw):"
          if [ -f created_files.txt ]; then cat created_files.txt || true; else echo "(none)"; fi

          echo "Listing ${OUT_DIR}:"
          ls -la "${OUT_DIR}" || true

          # Auto-discover CSVs if created_files.txt is absent or empty
          if [ ! -s created_files.txt ]; then
            echo "created_files.txt missing/empty -> discovering CSVs under ${OUT_DIR}"
            if [ -d "${OUT_DIR}" ]; then
              find "${OUT_DIR}" -type f -name '*.csv' -print > created_files.txt || true
            fi
            echo "After discovery, created_files.txt:"
            cat created_files.txt || true
          fi

      - name: Generate JSON per match into docs/data/tournaments
        run: |
          set -euo pipefail
          OUTPUT_JSON_DIR=docs/data/tournaments
          mkdir -p "${OUTPUT_JSON_DIR}"

          if [ -f created_files.txt ]; then
            echo "Calling generate_match_jsons.py -> ${OUTPUT_JSON_DIR}"
            python3 scripts/generate_match_jsons.py --input-list created_files.txt --output "${OUTPUT_JSON_DIR}"
            echo "Listing ${OUTPUT_JSON_DIR}:"
            ls -la "${OUTPUT_JSON_DIR}" || true
          else
            echo "No created_files.txt found, skipping json generation"
          fi

      - name: Merge remote lists + Stage generated CSVs and JSONs, commit
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          echo "=== Debug: listing candidates before staging ==="
          ls -la matches || true
          ls -la docs/data/tournaments || true
          cat created_files.txt || true

          # Ensure origin/main is fetched
          git fetch origin main --quiet || true

          TMPDIR="$(mktemp -d)"
          REMOTE_CREATED="${TMPDIR}/created_files_remote.txt"
          REMOTE_INDEX="${TMPDIR}/matches_index_remote.json"

          # extract remote created_files.txt if present, otherwise empty
          if git ls-tree -r origin/main --name-only | grep -q '^created_files.txt'; then
            git show origin/main:created_files.txt > "${REMOTE_CREATED}" || : > "${REMOTE_CREATED}"
          else
            : > "${REMOTE_CREATED}"
          fi

          # extract remote matches_index.json if present, otherwise empty
          if git ls-tree -r origin/main --name-only | grep -q '^docs/data/tournaments/matches_index.json'; then
            git show origin/main:docs/data/tournaments/matches_index.json > "${REMOTE_INDEX}" || : > "${REMOTE_INDEX}"
          else
            : > "${REMOTE_INDEX}"
          fi

          # ensure local placeholders exist
          [ -f created_files.txt ] || : > created_files.txt
          [ -f docs/data/tournaments/matches_index.json ] || mkdir -p docs/data/tournaments && : > docs/data/tournaments/matches_index.json

          # check for merge helper script
          if [ ! -f scripts/merge_indexes.py ]; then
            echo "ERROR: scripts/merge_indexes.py not found. Please add it to the repo."
            exit 2
          fi

          # call merge helper (remote first, local second -> outputs overwrite local)
          python3 scripts/merge_indexes.py \
            --remote-created "${REMOTE_CREATED}" \
            --local-created created_files.txt \
            --remote-index "${REMOTE_INDEX}" \
            --local-index docs/data/tournaments/matches_index.json \
            --out-created created_files.txt \
            --out-index docs/data/tournaments/matches_index.json

          echo "After merge - created_files.txt head:"
          sed -n '1,200p' created_files.txt || true
          echo "After merge - matches_index.json head:"
          sed -n '1,120p' docs/data/tournaments/matches_index.json || true

          # Stage outputs: index + CSVs listed + JSONs
          git add -f docs/data/tournaments || true

          if [ -f created_files.txt ]; then
            while IFS= read -r f || [ -n "$f" ]; do
              f="$(echo "$f" | sed -e 's/\r$//')"
              [ -z "$f" ] && continue
              if [ -f "$f" ]; then
                echo " staging $f"
                git add -f "$f" || true
              else
                echo "[WARN] listed CSV not found: $f"
              fi
            done < created_files.txt
          fi

          git add -f created_files.txt || true

          # Safety: do not stage index.html
          if git diff --cached --name-only | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html would be staged — aborting."
            git diff --cached --name-only || true
            exit 1
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Files staged to commit:"
            git diff --cached --name-only || true
            git commit -m "ci(update_tournament): add scraped ${TOUR_TYPE} tournaments and merged generated jsons" || true
          else
            echo "No generated changes to commit"
          fi

          rm -rf "${TMPDIR}" || true

      - name: Push changes (merge loop, retry, no force)
        env:
          PAT: ${{ secrets.PAT_UPDATE_TOURNAMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true

          MAX_RETRIES=5
          attempt=0

          remerge_and_commit() {
            echo "Re-merging remote lists into local (retry ${attempt})..."
            TMPDIR2="$(mktemp -d)"
            REMOTE_CREATED2="${TMPDIR2}/created_files_remote.txt"
            REMOTE_INDEX2="${TMPDIR2}/matches_index_remote.json"

            if git ls-tree -r origin/main --name-only | grep -q '^created_files.txt'; then
              git show origin/main:created_files.txt > "${REMOTE_CREATED2}" || : > "${REMOTE_CREATED2}"
            else
              : > "${REMOTE_CREATED2}"
            fi

            if git ls-tree -r origin/main --name-only | grep -q '^docs/data/tournaments/matches_index.json'; then
              git show origin/main:docs/data/tournaments/matches_index.json > "${REMOTE_INDEX2}" || : > "${REMOTE_INDEX2}"
            else
              : > "${REMOTE_INDEX2}"
            fi

            # ensure local placeholders
            [ -f created_files.txt ] || : > created_files.txt
            [ -f docs/data/tournaments/matches_index.json ] || mkdir -p docs/data/tournaments && : > docs/data/tournaments/matches_index.json

            # call merge helper (script in repo)
            python3 scripts/merge_indexes.py \
              --remote-created "${REMOTE_CREATED2}" \
              --local-created created_files.txt \
              --remote-index "${REMOTE_INDEX2}" \
              --local-index docs/data/tournaments/matches_index.json \
              --out-created created_files.txt \
              --out-index docs/data/tournaments/matches_index.json

            git add -f created_files.txt || true
            git add -f docs/data/tournaments/matches_index.json || true
            git add -f docs/data/tournaments || true

            # ensure CSVs present in created_files.txt are staged
            while IFS= read -r f || [ -n "$f" ]; do
              f="$(echo "$f" | sed -e 's/\r$//')"
              [ -z "$f" ] && continue
              if [ -f "$f" ]; then
                git add -f "$f" || true
              fi
            done < created_files.txt

            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "ci(update_tournament): merge remote changes and add generated files (retry ${attempt})" || true
            fi

            rm -rf "${TMPDIR2}" || true
          }

          while [ $attempt -lt $MAX_RETRIES ]; do
            echo "Push attempt $((attempt+1))/$MAX_RETRIES..."
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Fetching and re-merging remote changes..."
            git fetch origin main --quiet || true
            remerge_and_commit
            attempt=$((attempt+1))
            sleep 1
          done

          echo "Push attempts exhausted ($MAX_RETRIES). Not forcing push to avoid overwriting remote changes."
          exit 1

      - name: Trigger Netlify deploy via build hook
        env:
          NETLIFY_BUILD_HOOK_DAILY: ${{ secrets.NETLIFY_BUILD_HOOK_DAILY }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_DAILY" ]; then
            echo "No NETLIFY_BUILD_HOOK_DAILY — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK_DAILY" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true
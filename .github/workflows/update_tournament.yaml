name: Update tournament(s)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tournament_ids:
        description: 'Comma-separated list of tournament ids to scrape (ex: "800,1050")'
        required: true
      tour_type:
        description: 'Type of tour: "wta" or "atp"'
        required: true
        default: 'wta'

jobs:
  run_update:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build
      TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
      TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show workspace (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          pip install geopy pandas "selenium>=4.8" "webdriver-manager>=4.0" playwright
          playwright install --with-deps

      - name: Run scraper for requested tournaments (WTA or ATP)
        env:
          TIDS_INPUT: ${{ github.event.inputs.tournament_ids }}
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
          TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
          TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json
        run: |
          set -euo pipefail
          echo "TIDS_INPUT=${TIDS_INPUT}"
          echo "TOUR_TYPE=${TOUR_TYPE}"

          mkdir -p matches/wta_matches matches/atp_matches
          rm -f created_files.txt || true

          trim() { printf '%s' "$1" | awk '{$1=$1;print}'; }
          TIDS_TRIMMED="$(trim "${TIDS_INPUT:-}")"

          if [ "${TOUR_TYPE}" = "atp" ]; then
            ARGS=(scripts/scraping_atp_matches.py)
            if [ -n "${TIDS_TRIMMED}" ]; then
              ARGS+=(--tournament-ids "${TIDS_TRIMMED}")
            fi
            ARGS+=(--tournaments-json "${TOURNAMENT_DICT_PATH_ATP}")
            ARGS+=(--out-folder "matches/atp_matches")
            ARGS+=(--created-files-out created_files.txt)
            ARGS+=(--headless)
            ARGS+=(--max-attempts 10)
            echo "Calling: python3 ${ARGS[*]}"
            python3 "${ARGS[@]}"
            OUT_DIR="matches/atp_matches"
          else
            ARGS=(scripts/scraping_main.py)
            if [ -n "${TIDS_TRIMMED}" ]; then
              ARGS+=(--tournament-ids "${TIDS_TRIMMED}")
            fi
            ARGS+=(--tournament-dict-path "${TOURNAMENT_DICT_PATH_WTA}")
            ARGS+=(--created-files-out created_files.txt)
            echo "Calling: python3 ${ARGS[*]}"
            python3 "${ARGS[@]}"
            OUT_DIR="matches/wta_matches"
          fi

          echo "Scraper finished. created_files.txt (raw):"
          if [ -f created_files.txt ]; then cat created_files.txt || true; else echo "(none)"; fi

          echo "Listing ${OUT_DIR}:"
          ls -la "${OUT_DIR}" || true

          # Auto-discover CSVs if created_files.txt is absent or empty
          if [ ! -s created_files.txt ]; then
            echo "created_files.txt missing/empty -> discovering CSVs under ${OUT_DIR}"
            if [ -d "${OUT_DIR}" ]; then
              find "${OUT_DIR}" -type f -name '*.csv' -print > created_files.txt || true
            fi
            echo "After discovery, created_files.txt:"
            cat created_files.txt || true
          fi

      - name: Generate JSON per match into docs/data/tournaments
        run: |
          set -euo pipefail
          OUTPUT_JSON_DIR=docs/data/tournaments
          mkdir -p "${OUTPUT_JSON_DIR}"

          if [ -f created_files.txt ]; then
            echo "Calling generate_match_jsons.py -> ${OUTPUT_JSON_DIR}"
            # NOTE: adapted argument name to what your script expects (--output)
            python3 scripts/generate_match_jsons.py --input-list created_files.txt --output "${OUTPUT_JSON_DIR}"
            echo "Listing ${OUTPUT_JSON_DIR}:"
            ls -la "${OUTPUT_JSON_DIR}" || true
          else
            echo "No created_files.txt found, skipping json generation"
          fi

    
      - name: Build per-tournament JSONs (group by tournament + add geocode)
        env:
          # created_files.txt est généré par l'étape précédente
          TOURNAMENT_JSON_OUT_BASE: docs/data/tournaments/json_by_tournaments
        run: |
          set -euo pipefail
          echo "Building per-tournament JSONs into ${TOURNAMENT_JSON_OUT_BASE} ..."
          python3 scripts/build_tournament_jsons.py \
            --input-list created_files.txt \
            --geocodes docs/tools/geocodes_combined.json \
            --out-base "${TOURNAMENT_JSON_OUT_BASE}"
          echo "After building tournament jsons, listing ${TOURNAMENT_JSON_OUT_BASE}:"
          ls -la "${TOURNAMENT_JSON_OUT_BASE}" || true

      - name: Stage generated CSVs and JSONs, commit
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
        run: |
          set -euo pipefail

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          echo "=== Debug: listing candidates before staging ==="
          echo "--- matches dir ---"
          ls -la matches || true
          echo "--- docs/data/tournaments ---"
          ls -la docs/data/tournaments || true
          echo "--- created_files.txt content ---"
          cat created_files.txt || true

          # also add the new per-tournament json_by_tournaments dir
          git add -f docs/data/tournaments/json_by_tournaments || true

          # 2) If created_files.txt exists, add each created CSV path exactly (force add)
          if [ -f created_files.txt ]; then
            echo "Adding created files from created_files.txt..."
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "$line" | sed -e 's/\r$//')"
              [ -z "$line" ] && continue
              if [ -f "$line" ]; then
                echo "  git add -f \"$line\""
                git add -f "$line" || true
              else
                echo "  [WARN] listed file not found (will skip): $line"
              fi
            done < created_files.txt
            # also add the list itself for traceability
            git add -f created_files.txt || true
          else
            echo "No created_files.txt — falling back to add matches/${TOUR_TYPE}_matches"
            if [ "${TOUR_TYPE}" = "atp" ]; then
              git add -f matches/atp_matches || true
            else
              git add -f matches/wta_matches || true
            fi
          fi

          # Safety: prevent accidental commit of index.html or other manual files
          if git diff --cached --name-only | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html would be staged — aborting to avoid overwrite."
            git diff --cached --name-only || true
            exit 1
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Files staged to commit:"
            git diff --cached --name-only || true
            git commit -m "ci(update_tournament): add scraped ${TOUR_TYPE} tournaments and generated jsons" || true
          else
            echo "No generated changes to commit"
          fi

      - name: Prepare workspace for rebase (restore tracked build files if deleted)
        run: |
          set -euo pipefail
          # Some build steps remove docs_build/ tracked files -> this shows as unstaged deletions.
          # Restore tracked docs_build files from HEAD so rebase can run cleanly.
          if git ls-files --error-unmatch docs_build >/dev/null 2>&1; then
            echo "Restoring tracked docs_build files to avoid unstaged deletions..."
            git checkout -- docs_build || true
          else
            echo "docs_build not tracked or not present in HEAD — skipping restore"
          fi

      - name: Push changes (fetch/rebase, then push with safe fallbacks)
        env:
          PAT: ${{ secrets.PAT_UPDATE_TOURNAMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true

          # Show working tree status (debug)
          echo "Working tree status before fetch/rebase:"
          git status --porcelain || true

          # Fetch remote main
          git fetch origin main --quiet || true

          # If origin/main exists, attempt to rebase local commits onto it
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "Rebasing onto origin/main..."
            if ! git rebase origin/main; then
              echo "Rebase failed — aborting rebase attempt"
              git rebase --abort || true
              # If rebase fails, attempt a merge instead to preserve local commits
              echo "Attempting git pull --no-rebase to merge remote changes..."
              git pull --no-rebase origin main || true
            fi
          else
            echo "origin/main not found; skipping rebase"
          fi

          # Show what is in local HEAD (debug)
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "Committed files in HEAD:"
            git show --name-only --pretty="" HEAD || true
          fi

          # Try push (normal), then fallback to force-with-lease, then last-resort --force
          echo "Attempting push to origin main..."
          if git push origin HEAD:main; then
            echo "Push successful"
          else
            echo "Normal push failed — trying push --force-with-lease"
            if git push --force-with-lease origin HEAD:main; then
              echo "Push --force-with-lease successful"
            else
              echo "Force-with-lease failed — trying git push --force (last resort)"
              git push --force origin HEAD:main || true
            fi
          fi

          echo "Push finished. Remote HEAD now:"
          git ls-remote --heads origin main || true



      - name: Trigger Netlify deploy via build hook
        env:
          NETLIFY_BUILD_HOOK_DAILY: ${{ secrets.NETLIFY_BUILD_HOOK_DAILY }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_DAILY" ]; then
            echo "No NETLIFY_BUILD_HOOK_DAILY — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK_DAILY" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true

name: Update tournament(s)

concurrency:
  group: update_tournament
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tournament_ids:
        description: 'Comma-separated list of tournament ids to scrape (ex: "800,1050")'
        required: true
      tour_type:
        description: 'Type of tour: "wta" or "atp"'
        required: true
        default: 'wta'

jobs:
  run_update:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build
      TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
      TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Ensure local branch = origin/main
        run: |
          set -euo pipefail
          git fetch origin main --quiet || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git checkout -B main origin/main
            git reset --hard origin/main
          else
            git checkout -B main || true
          fi
          git status --porcelain || true

      - name: Show workspace (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-build.txt ]; then pip install -r requirements-build.txt; fi
          pip install geopy pandas "selenium>=4.8" "webdriver-manager>=4.0" playwright
          playwright install --with-deps

      - name: Run scraper for requested tournaments (WTA or ATP)
        env:
          TIDS_INPUT: ${{ github.event.inputs.tournament_ids }}
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
          TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
          TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json
        run: |
          set -euo pipefail
          echo "TIDS_INPUT=${TIDS_INPUT}"
          echo "TOUR_TYPE=${TOUR_TYPE}"

          mkdir -p docs/matches/wta_matches docs/matches/atp_matches
          rm -f created_files.txt || true

          trim() { printf '%s' "$1" | awk '{$1=$1;print}'; }
          TIDS_TRIMMED="$(trim "${TIDS_INPUT:-}")"

          if [ "${TOUR_TYPE}" = "atp" ]; then
            ARGS=(scripts/scraping_atp_matches.py)
            if [ -n "${TIDS_TRIMMED}" ]; then
              ARGS+=(--tournament-ids "${TIDS_TRIMMED}")
            fi
            ARGS+=(--tournaments-json "${TOURNAMENT_DICT_PATH_ATP}")
            ARGS+=(--out-folder "docs/matches/atp_matches")
            ARGS+=(--created-files-out created_files.txt)
            ARGS+=(--headless)
            ARGS+=(--max-attempts 10)
            echo "Calling: python3 ${ARGS[*]}"
            python3 "${ARGS[@]}"
            OUT_DIR="docs/matches/atp_matches"
          else
            ARGS=(scripts/scraping_main.py)
            if [ -n "${TIDS_TRIMMED}" ]; then
              ARGS+=(--tournament-ids "${TIDS_TRIMMED}")
            fi
            ARGS+=(--tournament-dict-path "${TOURNAMENT_DICT_PATH_WTA}")
            ARGS+=(--created-files-out created_files.txt)
            echo "Calling: python3 ${ARGS[*]}"
            python3 "${ARGS[@]}"
            OUT_DIR="docs/matches/wta_matches"
          fi

          echo "Scraper finished. created_files.txt (raw):"
          if [ -f created_files.txt ]; then cat created_files.txt || true; else echo "(none)"; fi

          echo "Listing ${OUT_DIR}:"
          ls -la "${OUT_DIR}" || true

          if [ ! -s created_files.txt ]; then
            echo "created_files.txt missing/empty -> discovering CSVs under ${OUT_DIR}"
            if [ -d "${OUT_DIR}" ]; then
              find "${OUT_DIR}" -type f -name '*.csv' -print > created_files.txt || true
            fi
            echo "After discovery, created_files.txt:"
            cat created_files.txt || true
          fi

      - name: Generate JSON per match into docs/data/tournaments
        run: |
          set -euo pipefail
          OUTPUT_JSON_DIR=docs/data/tournaments
          mkdir -p "${OUTPUT_JSON_DIR}"

          if [ -f created_files.txt ]; then
            echo "Calling generate_match_jsons.py -> ${OUTPUT_JSON_DIR}"
            python3 scripts/generate_match_jsons.py --input-list created_files.txt --output "${OUTPUT_JSON_DIR}"
            echo "Listing ${OUTPUT_JSON_DIR}:"
            ls -la "${OUTPUT_JSON_DIR}" || true
          else
            echo "No created_files.txt found, skipping json generation"
          fi

      - name: Build per-tournament JSONs (group by tournament + add geocode)
        env:
          TOURNAMENT_JSON_OUT_BASE: docs/data/tournaments/json_by_tournaments
        run: |
          set -euo pipefail
          echo "Building per-tournament JSONs into ${TOURNAMENT_JSON_OUT_BASE} ..."
          python3 scripts/build_tournament_jsons.py \
            --input-list created_files.txt \
            --geocodes docs/tools/geocodes_combined.json \
            --country-map docs/tools/country_to_ioc.json \
            --out-base "${TOURNAMENT_JSON_OUT_BASE}"
          echo "After building tournament jsons, listing ${TOURNAMENT_JSON_OUT_BASE}:"
          ls -la "${TOURNAMENT_JSON_OUT_BASE}" || true

      - name: Update tournament winners JSONs (wta/atp)
        env:
          TOURNAMENT_JSON_OUT_BASE: docs/data/tournaments/json_by_tournaments
          ALT_TOURNAMENT_JSON_BASE: docs/data/tournaments/tournaments_by_json
        run: |
          set -euo pipefail
          echo "Running update_tournament_winners.py on created_files.txt..."
          python3 scripts/update_tournament_winners.py \
            --input-list created_files.txt \
            --json-base "${TOURNAMENT_JSON_OUT_BASE}" \
            --alt-json-base "${ALT_TOURNAMENT_JSON_BASE}" \
            --out-wta docs/wta_tournaments_winners.json \
            --out-atp docs/atp_tournaments_winners.json || true

      - name: Update players tournaments win JSONs (wta/atp)
        run: |
          set -euo pipefail
          echo "Updating docs/tools/wta_players_tournaments_win.json and docs/tools/atp_players_tournaments_win.json..."
          python3 scripts/update_players_tournaments_win.py \
            --json-base docs/data/tournaments/json_by_tournaments \
            --out-wta docs/tools/wta_players_tournaments_win.json \
            --out-atp docs/tools/atp_players_tournaments_win.json

      - name: Stage generated CSVs and JSONs, commit
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
        run: |
          set -euo pipefail

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          echo "=== Debug: listing candidates before staging ==="
          echo "--- matches dir ---"
          ls -la matches || true
          echo "--- docs/data/tournaments ---"
          ls -la docs/data/tournaments || true
          echo "--- created_files.txt content ---"
          cat created_files.txt || true

          if [ -d "docs/data/tournaments/json_by_tournaments" ]; then
            find docs/data/tournaments/json_by_tournaments -type f -name '*.json' -print0 \
              | xargs -0 --no-run-if-empty git add -f || true
          fi

          if [ -f created_files.txt ]; then
            echo "Adding created files from created_files.txt..."
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "$line" | sed -e 's/\r$//')"
              [ -z "$line" ] && continue
              if [ -f "$line" ]; then
                echo "  git add -f \"$line\""
                git add -f "$line" || true
              else
                echo "  [WARN] listed file not found (will skip): $line"
              fi
            done < created_files.txt
            git add -f created_files.txt || true
          else
            echo "No created_files.txt — falling back to add docs/matches/${TOUR_TYPE}_matches"
            if [ "${TOUR_TYPE}" = "atp" ]; then
              git add -f docs/matches/atp_matches || true
            else
              git add -f docs/matches/wta_matches || true
            fi
          fi

          if [ -f "docs/wta_tournaments_winners.json" ]; then
            echo "Adding docs/wta_tournaments_winners.json"
            git add -f docs/wta_tournaments_winners.json || true
          fi
          if [ -f "docs/atp_tournaments_winners.json" ]; then
            echo "Adding docs/atp_tournaments_winners.json"
            git add -f docs/atp_tournaments_winners.json || true
          fi

          if [ -f "docs/tools/wta_players_tournaments_win.json" ]; then
            echo "Adding docs/tools/wta_players_tournaments_win.json"
            git add -f docs/tools/wta_players_tournaments_win.json || true
          fi
          if [ -f "docs/tools/atp_players_tournaments_win.json" ]; then
            echo "Adding docs/tools/atp_players_tournaments_win.json"
            git add -f docs/tools/atp_players_tournaments_win.json || true
          fi

          if git diff --cached --name-only | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html would be staged — aborting to avoid overwrite."
            git diff --cached --name-only || true
            exit 1
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Files staged to commit:"
            git diff --cached --name-only || true
            git commit -m "ci(update_tournament): add scraped ${TOUR_TYPE} tournaments and generated jsons [skip ci]" || true
          else
            echo "No generated changes to commit"
          fi

      - name: Prepare workspace for rebase (restore tracked build files if deleted)
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch docs_build >/dev/null 2>&1; then
            echo "Restoring tracked docs_build files to avoid unstaged deletions..."
            git checkout -- docs_build || true
          else
            echo "docs_build not tracked or not present in HEAD — skipping restore"
          fi

      - name: Push generated files (safe tmp branch -> merge to main)
        env:
          PAT: ${{ secrets.PAT_UPDATE_TOURNAMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          AUTH="${PAT:-${GITHUB_TOKEN:-}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          TMP_BRANCH="ci/update/${GITHUB_RUN_ID}"
          echo "Creating tmp branch from current HEAD/worktree: ${TMP_BRANCH}"

          git checkout -B "${TMP_BRANCH}" || true

          if [ -d "docs/data/tournaments/json_by_tournaments" ]; then
            find docs/data/tournaments/json_by_tournaments -type f -name '*.json' -print0 \
              | xargs -0 --no-run-if-empty git add -f || true
          fi

          if [ -f created_files.txt ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "$line" | sed -e 's/\r$//')"
              [ -z "$line" ] && continue
              if [ -f "$line" ]; then
                git add -f "$line" || true
              else
                echo "[WARN] listed file not found (skip): $line"
              fi
            done < created_files.txt
            git add -f created_files.txt || true
          else
            if [ -d "docs/matches/wta_matches" ]; then
              find docs/matches/wta_matches -type f -name '*.csv' -print0 \
                | xargs -0 --no-run-if-empty git add -f || true
            fi
            if [ -d "docs/matches/atp_matches" ]; then
              find docs/matches/atp_matches -type f -name '*.csv' -print0 \
                | xargs -0 --no-run-if-empty git add -f || true
            fi
          fi

          DELETED_PATHS="$(git diff --cached --name-only --diff-filter=D || true)"
          if [ -n "$DELETED_PATHS" ]; then
            echo "Unstaging deletions to avoid removing remote files:"
            echo "$DELETED_PATHS" | sed -n '1,200p'
            echo "$DELETED_PATHS" | while IFS= read -r p; do
              [ -z "$p" ] && continue
              git restore --staged -- "$p" || true
            done
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Committing staged files on ${TMP_BRANCH}:"
            git diff --cached --name-only || true
            git commit -m "ci(update_tournament): add scraped tournaments (run ${GITHUB_RUN_ID}) [skip ci]" || true
          else
            echo "No changes staged to commit on ${TMP_BRANCH}"
          fi

          echo "Pushing tmp branch ${TMP_BRANCH} to origin..."
          git push --set-upstream origin "${TMP_BRANCH}" --force-with-lease || git push --set-upstream origin "${TMP_BRANCH}" || true

          MAX_RETRIES=4
          attempt=0
          merged_success=false

          while [ $attempt -lt $MAX_RETRIES ]; do
            attempt=$((attempt+1))
            echo "Merge attempt ${attempt}/${MAX_RETRIES}: update local main and merge ${TMP_BRANCH}..."

            git fetch origin main --quiet || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              git checkout -B main origin/main
            else
              git checkout -B main || true
            fi

            if git merge --no-ff --no-edit "${TMP_BRANCH}"; then
              echo "Merge of ${TMP_BRANCH} into main succeeded locally."
            else
              echo "Merge reported conflicts; aborting and using ours strategy."
              git merge --abort || true
              git merge -s ours -m "ci(update_tournament): merge ${TMP_BRANCH} [skip ci]" "${TMP_BRANCH}" || true
            fi

            git commit --amend -m "ci(update_tournament): merge ${TMP_BRANCH} [skip ci]" || true

            DELETED_PATHS="$(git diff --cached --name-only --diff-filter=D || true)"
            if [ -n "$DELETED_PATHS" ]; then
              echo "Unstaging deletions before push:"
              echo "$DELETED_PATHS"
              echo "$DELETED_PATHS" | while IFS= read -r p; do
                [ -z "$p" ] && continue
                git restore --staged -- "$p" || true
              done
              git commit --allow-empty -m "ci(update_tournament): merge ${TMP_BRANCH} (clean deletions) [skip ci]" || true
            fi

            echo "Attempting to push main to origin (attempt ${attempt})..."
            if git push origin HEAD:main; then
              echo "Push of main successful."
              merged_success=true
              break
            fi

            echo "Push failed on attempt ${attempt}. Will retry after refetch."
            sleep 1
            git fetch origin "${TMP_BRANCH}" --quiet || true
          done

          if [ "$merged_success" = "false" ]; then
            echo "Failed to merge & push main after ${MAX_RETRIES} attempts."
            echo "Work has been preserved on branch: ${TMP_BRANCH} (pushed)."
            echo "Please merge ${TMP_BRANCH} into main manually (or via an automated PR)."
          fi

          echo "Done. Remote refs (main and ${TMP_BRANCH}):"
          git ls-remote --heads origin main "${TMP_BRANCH}" || true
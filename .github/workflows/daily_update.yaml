name: Daily birthday update

permissions:
  contents: write

on:
  schedule:
    # Deux crons UTC pour couvrir l'alternance CET/CEST.
    # L'un des deux tombera dans l'intervalle 00:00–01:00 Europe/Paris selon DST.
    - cron: '30 22 * * *'  # 22:30 UTC => ~00:30 Europe/Paris (hiver/été selon DST)
    - cron: '30 23 * * *'  # 23:30 UTC => ~00:30 Europe/Paris (hiver/été selon DST)
  workflow_dispatch: {}

jobs:
  update_birthday:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show workspace (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la | sed -n '1,200p'

      - name: Decide whether to proceed (Europe/Paris hour in [00:00..00:59])
        id: check_time
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          try:
              from zoneinfo import ZoneInfo
              tz = ZoneInfo("Europe/Paris")
              now = datetime.now(tz)
          except Exception:
              # Fallback to UTC (extremely unlikely on ubuntu-latest)
              now = datetime.now(timezone.utc)
          print("Europe/Paris now:", now.isoformat())
          proceed = (now.hour == 0)
          # expose outputs for subsequent steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"proceed={str(proceed).lower()}\n")
              fh.write(f"local_time_iso={now.isoformat()}\n")
          PY

      # Les étapes réelles s'exécutent soit si run manuel, soit si check_time.proceed == true
      - name: Setup Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install minimal deps (if required)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          python -m pip install --upgrade pip
          # ajouter d'autres dépendances si nécessaires

      - name: Generate birthday_today.json
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euxo pipefail
          mkdir -p "${BUILD_DIR}/tools"
          # On tente d'écrire dans BUILD_DIR via --out; si le script écrit ailleurs, on le détectera ensuite.
          python scripts/generate_birthday_box.py \
            --players-by-birth docs/tools/players_by_birth.json \
            --latest-atp docs/tools/latest_atp_ranking.json \
            --latest-wta docs/tools/latest_wta_ranking.json \
            --out "${BUILD_DIR}/tools/birthday_today.json" || true

          echo ">>> After generation: listing possible locations"
          echo "BUILD_DIR/tools:"
          ls -la "${BUILD_DIR}/tools" || true
          echo "docs/tools:"
          ls -la docs/tools || true
          echo "site_static/tools:"
          ls -la site_static/tools || true

      - name: Copy into site_static/tools (for site serving)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euxo pipefail
          mkdir -p site_static/tools

          # Prioritize BUILD_DIR output if présent; else fallback à docs/tools (si le script a écrit directement dedans)
          if [ -f "${BUILD_DIR}/tools/birthday_today.json" ]; then
            cp -v "${BUILD_DIR}/tools/birthday_today.json" site_static/tools/ || true
          elif [ -f "docs/tools/birthday_today.json" ]; then
            cp -v "docs/tools/birthday_today.json" site_static/tools/ || true
          else
            echo "Aucun fichier généré trouvé dans BUILD_DIR ni docs/tools"
          fi

          ls -la site_static/tools || true

      - name: Commit new birthday JSON (whitelist safe commit)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Copier le canonical généré vers docs/tools (source de vérité) et site_static
          if [ -f "${BUILD_DIR}/tools/birthday_today.json" ]; then
            echo "Using ${BUILD_DIR}/tools/birthday_today.json as canonical generated file"
            mkdir -p docs/tools
            cp -v "${BUILD_DIR}/tools/birthday_today.json" docs/tools/birthday_today.json || true
            mkdir -p site_static/tools
            cp -v "${BUILD_DIR}/tools/birthday_today.json" site_static/tools/birthday_today.json || true
          elif [ -f "docs/tools/birthday_today.json" ]; then
            echo "Generator wrote directly into docs/tools; copying into site_static"
            mkdir -p site_static/tools
            cp -v "docs/tools/birthday_today.json" site_static/tools/birthday_today.json || true
          else
            echo "No generated file found in BUILD_DIR nor docs/tools - nothing to commit"
          fi

          # Stage known locations explicitement pour éviter les modifications non-stagées
          git add -f docs/tools/birthday_today.json site_static/tools/birthday_today.json || true

          # Safety: abort if index.html or other manual files would be staged
          if git diff --cached --name-only | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html would be staged — aborting to avoid overwrite."
            git diff --cached --name-only || true
            exit 1
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Files staged to commit:"
            git diff --cached --name-only || true
            git commit -m "ci(daily): update birthday_today.json" || true
          else
            echo "No generated changes to commit"
          fi

      - name: Push changes (use PAT if available, else GITHUB_TOKEN)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          PAT: ${{ secrets.PAT_FOR_CI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true

          # Fetch remote main
          git fetch origin main --quiet || true

          # Show working tree status for debug
          echo "Working tree status before rebase:"
          git status --porcelain || true

          # Rebase local HEAD onto origin/main to reduce conflicts (si origin/main existe)
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git rebase origin/main || (echo "rebase failed: aborting rebase attempt" && git rebase --abort || true)
          fi

          # attempt push (normal then force-with-lease fallback)
          git push origin HEAD:main || git push --force-with-lease origin HEAD:main || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          NETLIFY_BUILD_HOOK_DAILY: ${{ secrets.NETLIFY_BUILD_HOOK_DAILY }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_DAILY" ]; then
            echo "No NETLIFY_BUILD_HOOK_DAILY — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK_DAILY" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true

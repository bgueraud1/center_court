name: Daily birthday update

permissions:
  contents: write

on:
  schedule:
    # Deux crons UTC pour couvrir l'alternance CET/CEST.
    - cron: '30 22 * * *'  # 22:30 UTC => ~00:30 Europe/Paris (hiver/été selon DST)
    - cron: '30 23 * * *'  # 23:30 UTC => ~00:30 Europe/Paris (hiver/été selon DST)
  workflow_dispatch: {}

jobs:
  update_birthday:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show workspace (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la | sed -n '1,200p'




      - name: Check tournaments and dispatch update_tournament (if needed)
        env:
          TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
          TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json
          PAT_UPDATE_TOURNAMENT: ${{ secrets.PAT_UPDATE_TOURNAMENT || '' }}
          UPDATE_TOURNAMENT: ${{ secrets.UPDATE_TOURNAMENT || '' }}
          PAT_FOR_CI: ${{ secrets.PAT_UPDATE_TOURNAMENT || secrets.UPDATE_TOURNAMENT || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # debug: report which env vars are present (no secret values printed)
          echo "ENV presence check:"
          if [ -z "${GITHUB_TOKEN:-}" ]; then echo "  GITHUB_TOKEN: MISSING"; else echo "  GITHUB_TOKEN: PRESENT"; fi
          if [ -z "${PAT_FOR_CI:-}" ]; then echo "  PAT_FOR_CI: MISSING"; else echo "  PAT_FOR_CI: PRESENT"; fi
          if [ -z "${PAT_UPDATE_TOURNAMENT:-}" ]; then echo "  PAT_UPDATE_TOURNAMENT: MISSING"; else echo "  PAT_UPDATE_TOURNAMENT: PRESENT"; fi
          if [ -z "${UPDATE_TOURNAMENT:-}" ]; then echo "  UPDATE_TOURNAMENT: MISSING"; else echo "  UPDATE_TOURNAMENT: PRESENT"; fi
          echo "--- now calling check_and_dispatch_update_tournament.py ---"
          python3 scripts/check_and_dispatch_update_tournament.py


      - name: Decide whether to proceed (Europe/Paris hour in [00:00..00:59])
        id: check_time
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          try:
              from zoneinfo import ZoneInfo
              tz = ZoneInfo("Europe/Paris")
              now = datetime.now(tz)
          except Exception:
              # Fallback to UTC (extremely unlikely on ubuntu-latest)
              now = datetime.now(timezone.utc)
          print("Europe/Paris now:", now.isoformat())
          proceed = (now.hour == 0)
          # expose outputs for subsequent steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"proceed={str(proceed).lower()}\n")
              fh.write(f"local_time_iso={now.isoformat()}\n")
          PY

      # Les étapes réelles s'exécutent soit si run manuel, soit si check_time.proceed == true
      - name: Setup Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install minimal deps (if required)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          python -m pip install --upgrade pip
          # ajouter d'autres dépendances si nécessaires

      - name: Generate birthday_today.json and game assets (daily_guess, players_catalog, geocodes_combined, selected_players, fill_the_grid)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euxo pipefail
          mkdir -p "${BUILD_DIR}/tools"

          # existing birthday generation (ton script actuel)
          python scripts/generate_birthday_box.py \
            --players-by-birth docs/tools/players_by_birth.json \
            --latest-atp docs/tools/latest_atp_ranking.json \
            --latest-wta docs/tools/latest_wta_ranking.json \
            --out "${BUILD_DIR}/tools/birthday_today.json" || true

          # NEW: generate daily guess + players catalog + geocodes combined
          python scripts/generate_daily_guess.py \
            --atp player_data_atp.csv \
            --wta player_data_wta.csv \
            --geocodes-dir maps_html \
            --out-daily "${BUILD_DIR}/tools/daily_guess.json" \
            --out-players "${BUILD_DIR}/tools/players_catalog.json" \
            --out-geocodes "${BUILD_DIR}/tools/geocodes_combined.json" || true

          # NEW ADDITION: run the H2H daily selection script (produit docs/selected_players.json)
          python scripts/generate_daily_guess_h2h.py || true

          # NEW: generate aggregates and grids for "fill the grid" game
          python scripts/generate_pre_json_grid.py || true
          python scripts/generate_grid.py || true

          echo ">>> After generation: listing possible locations"
          echo "BUILD_DIR/tools:"
          ls -la "${BUILD_DIR}/tools" || true
          echo "docs:"
          ls -la docs || true
          echo "docs/tools:"
          ls -la docs/tools || true
          echo "site_static/tools:"
          ls -la site_static/tools || true
          echo "docs/games:"
          ls -la docs/games || true
          echo "site_static/games:"
          ls -la site_static/games || true

      - name: Copy into site_static/tools (for site serving)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euxo pipefail
          mkdir -p site_static/tools
          mkdir -p docs/tools
          mkdir -p docs/games
          mkdir -p site_static/games

          # birthday_today.json (canonical)
          if [ -f "${BUILD_DIR}/tools/birthday_today.json" ]; then
            cp -v "${BUILD_DIR}/tools/birthday_today.json" docs/tools/birthday_today.json || true
            cp -v "${BUILD_DIR}/tools/birthday_today.json" site_static/tools/birthday_today.json || true
          elif [ -f "docs/tools/birthday_today.json" ]; then
            cp -v "docs/tools/birthday_today.json" site_static/tools/birthday_today.json || true
          else
            echo "Aucun birthday_today.json généré trouvé"
          fi

          # daily_guess.json
          if [ -f "${BUILD_DIR}/tools/daily_guess.json" ]; then
            cp -v "${BUILD_DIR}/tools/daily_guess.json" docs/tools/daily_guess.json || true
            cp -v "${BUILD_DIR}/tools/daily_guess.json" site_static/tools/daily_guess.json || true
          elif [ -f "docs/tools/daily_guess.json" ]; then
            cp -v "docs/tools/daily_guess.json" site_static/tools/daily_guess.json || true
          else
            echo "Aucun daily_guess.json généré trouvé"
          fi

          # players_catalog.json
          if [ -f "${BUILD_DIR}/tools/players_catalog.json" ]; then
            cp -v "${BUILD_DIR}/tools/players_catalog.json" docs/tools/players_catalog.json || true
            cp -v "${BUILD_DIR}/tools/players_catalog.json" site_static/tools/players_catalog.json || true
          elif [ -f "docs/tools/players_catalog.json" ]; then
            cp -v "docs/tools/players_catalog.json" site_static/tools/players_catalog.json || true
          else
            echo "Aucun players_catalog.json généré trouvé"
          fi

          # geocodes_combined.json
          if [ -f "${BUILD_DIR}/tools/geocodes_combined.json" ]; then
            cp -v "${BUILD_DIR}/tools/geocodes_combined.json" docs/tools/geocodes_combined.json || true
            cp -v "${BUILD_DIR}/tools/geocodes_combined.json" site_static/tools/geocodes_combined.json || true
          elif [ -f "docs/tools/geocodes_combined.json" ]; then
            cp -v "docs/tools/geocodes_combined.json" site_static/tools/geocodes_combined.json || true
          else
            echo "Aucun geocodes_combined.json généré trouvé"
          fi

          # NEW: selected_players.json from generate_daily_guess_h2h.py
          if [ -f "${BUILD_DIR}/tools/selected_players.json" ]; then
            cp -v "${BUILD_DIR}/tools/selected_players.json" docs/tools/selected_players.json || true
            cp -v "${BUILD_DIR}/tools/selected_players.json" site_static/tools/selected_players.json || true
          elif [ -f "docs/selected_players.json" ]; then
            cp -v "docs/selected_players.json" docs/tools/selected_players.json || true
            cp -v "docs/selected_players.json" site_static/tools/selected_players.json || true
          elif [ -f "docs/tools/selected_players.json" ]; then
            cp -v "docs/tools/selected_players.json" site_static/tools/selected_players.json || true
          else
            echo "Aucun selected_players.json généré trouvé"
          fi

          # NEW: copy fill the grid outputs and aggregates (docs/games -> site_static/games)
          if [ -f "docs/games/aggregate_ATP_reduced.json" ]; then
            cp -v "docs/games/aggregate_ATP_reduced.json" site_static/games/aggregate_ATP_reduced.json || true
          else
            echo "Aucun docs/games/aggregate_ATP_reduced.json trouvé"
          fi
          if [ -f "docs/games/aggregate_WTA_reduced.json" ]; then
            cp -v "docs/games/aggregate_WTA_reduced.json" site_static/games/aggregate_WTA_reduced.json || true
          else
            echo "Aucun docs/games/aggregate_WTA_reduced.json trouvé"
          fi

          # Fill-the-grid outputs (generate_grid.py)
          if [ -f "docs/games/fill_the_grid_ATP.json" ]; then
            cp -v "docs/games/fill_the_grid_ATP.json" site_static/games/fill_the_grid_ATP.json || true
          else
            echo "Aucun docs/games/fill_the_grid_ATP.json trouvé"
          fi
          if [ -f "docs/games/fill_the_grid_WTA.json" ]; then
            cp -v "docs/games/fill_the_grid_WTA.json" site_static/games/fill_the_grid_WTA.json || true
          else
            echo "Aucun docs/games/fill_the_grid_WTA.json trouvé"
          fi

          ls -la docs/tools || true
          ls -la site_static/tools || true
          ls -la docs/games || true
          ls -la site_static/games || true

      - name: Commit new generated JSON (whitelist safe commit)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # Stage canonical generated files from docs/tools and their site_static copies
          git add -f docs/tools/birthday_today.json docs/tools/daily_guess.json docs/tools/players_catalog.json docs/tools/geocodes_combined.json docs/tools/selected_players.json || true
          git add -f site_static/tools/birthday_today.json site_static/tools/daily_guess.json site_static/tools/players_catalog.json site_static/tools/geocodes_combined.json site_static/tools/selected_players.json || true

          # NEW: stage generated games aggregates and fill-the-grid outputs (docs/games and site_static/games)
          git add -f docs/games/aggregate_ATP_reduced.json docs/games/aggregate_WTA_reduced.json docs/games/fill_the_grid_ATP.json docs/games/fill_the_grid_WTA.json || true
          git add -f site_static/games/aggregate_ATP_reduced.json site_static/games/aggregate_WTA_reduced.json site_static/games/fill_the_grid_ATP.json site_static/games/fill_the_grid_WTA.json || true

          # Safety: abort if index.html or other manual files would be staged
          if git diff --cached --name-only | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html would be staged — aborting to avoid overwrite."
            git diff --cached --name-only || true
            exit 1
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Files staged to commit:"
            git diff --cached --name-only || true
            git commit -m "ci(daily): update generated tools (birthday_today, daily_guess, players_catalog, geocodes, selected_players, fill_the_grid outputs & aggregates)" || true
          else
            echo "No generated changes to commit"
          fi

      - name: Clean build artefacts to avoid rebase conflicts
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euxo pipefail
          if [ -d "${BUILD_DIR}/tools" ]; then
            rm -rf "${BUILD_DIR}/tools" || true
            echo "Removed ${BUILD_DIR}/tools to avoid rebase conflicts"
          fi
          git clean -fd -n || true
          echo "Workspace cleaned (dry-run shown above)."

      - name: Push changes (fetch/merge, then push with safe fallbacks)
        env:
          PAT: ${{ secrets.PAT_UPDATE_TOURNAMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
        run: |
          set -euo pipefail
          AUTH="${PAT:-${GITHUB_TOKEN}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true

          # Show working tree status (debug)
          echo "Working tree status before fetch/merge:"
          git status --porcelain || true

          # Fetch remote main
          git fetch origin main --quiet || true

          # If origin/main exists, merge it into local HEAD (safer than rebase for concurrency)
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "Merging origin/main into local branch..."
            # try a non-interactive merge; prefer default merge behaviour so added files are preserved
            if ! git merge --no-edit origin/main; then
              echo "Merge reported conflicts — attempting automatic conflict resolution for text hunks (-X ours)"
              # try to resolve conflicts automatically preferring local changes for conflicting hunks
              git merge --strategy-option=ours --no-edit origin/main || true
              # if still conflicts, abort merge and fall back to a pull merge
              if git merge --abort >/dev/null 2>&1; then
                echo "Automatic merge failed; attempting 'git pull --no-rebase' fallback"
                git pull --no-rebase origin main || true
              fi
            fi
          else
            echo "origin/main not found; skipping merge"
          fi

          # Show what is in local HEAD (debug)
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "Committed files in HEAD (local):"
            git show --name-only --pretty="" HEAD || true
          fi

          # Attempt push (normal). If push fails, refetch+merge and retry a couple times.
          echo "Attempting push to origin main..."
          if git push origin HEAD:main; then
            echo "Push successful"
            exit 0
          fi

          echo "Normal push failed — will retry with fetch+merge attempts (no blind --force)."

          RETRIES=3
          i=0
          while [ $i -lt $RETRIES ]; do
            i=$((i+1))
            echo "Retry #$i: fetch origin/main and merge..."
            git fetch origin main --quiet || true
            # attempt to merge remote changes; prefer fast-forward/merge
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              if git merge --no-edit origin/main; then
                echo "Merge succeeded on retry #$i"
              else
                echo "Merge reported conflicts on retry #$i; attempting to continue by favoring local hunks"
                git merge --strategy-option=ours --no-edit origin/main || true
                # if still conflicted, abort and continue to next attempt
                git merge --abort || true
              fi
            fi

            echo "Attempting push after merge (retry #$i)..."
            if git push origin HEAD:main; then
              echo "Push successful on retry #$i"
              exit 0
            fi
            echo "Push still failed on retry #$i"
            sleep 1
          done

          echo "Push attempts exhausted. As a safe fallback, we will push this run to a dedicated branch so work is preserved and no remote history is overwritten."

          BRANCH_NAME="update/${TOUR_TYPE}/${GITHUB_RUN_ID}"
          echo "Creating and pushing branch ${BRANCH_NAME}..."
          git checkout -b "${BRANCH_NAME}" || true
          git push --set-upstream origin "${BRANCH_NAME}" || true

          echo "Branch pushed: ${BRANCH_NAME}"
          echo "Please merge this branch into main (manually or via an automated PR) to integrate these changes without risking overwriting other runs."
          echo "Remote HEAD now (refs):"
          git ls-remote --heads origin main || true

          # Optionally, you could fail the job here to force manual attention:
          # exit 1

      - name: Trigger Netlify deploy via build hook
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          NETLIFY_BUILD_HOOK_DAILY: ${{ secrets.NETLIFY_BUILD_HOOK_DAILY }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_DAILY" ]; then
            echo "No NETLIFY_BUILD_HOOK_DAILY — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK_DAILY" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true
name: Daily birthday update

permissions:
  contents: write

on:
  schedule:
    # Une seule exécution quotidienne, en heure de Paris.
    # 01:07 évite le pic de charge du début d'heure.
    - cron: '7 1 * * *'
      timezone: "Europe/Paris"
  workflow_dispatch: {}

jobs:
  update_birthday:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/docs_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: true

      - name: Show workspace (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la | sed -n '1,200p'

      - name: Wait for existing update_tournament runs to finish (safety)
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_UPDATE_TOURNAMENT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          WORKFLOW_FILE: update_tournament.yml
          WAIT_TIMEOUT_MIN: 10
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: token ${GITHUB_TOKEN}"
          timeout=$(( WAIT_TIMEOUT_MIN * 60 ))
          interval=5
          elapsed=0
          REPO_NAME="${REPO_FULL#*/}"

          echo "Polling workflow runs for ${WORKFLOW_FILE} in ${OWNER}/${REPO_NAME} (status=in_progress)..."
          while :; do
            api="https://api.github.com/repos/${OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/runs?status=in_progress"
            out=$(curl -s -H "$AUTH_HEADER" "$api")
            total=$(echo "$out" | sed -n 's/.*"total_count":[[:space:]]*\([0-9]\+\).*/\1/p' || echo 0)
            total=${total:-0}

            if [ "$total" -eq 0 ]; then
              echo "No in-progress runs of ${WORKFLOW_FILE} found. OK to proceed."
              break
            fi

            echo "Found ${total} in-progress run(s). Waiting ${interval}s..."
            sleep "$interval"
            elapsed=$(( elapsed + interval ))
            if [ $elapsed -ge $timeout ]; then
              echo "Timeout waiting for other runs to finish (waited ${elapsed}s). Aborting."
              exit 1
            fi
          done

      - name: Check tournaments and dispatch update_tournament (if needed)
        env:
          TOURNAMENT_DICT_PATH_WTA: docs/wta_tournaments_2026.json
          TOURNAMENT_DICT_PATH_ATP: docs/atp_tournaments_2026.json
          PAT_UPDATE_TOURNAMENT: ${{ secrets.PAT_UPDATE_TOURNAMENT || '' }}
          UPDATE_TOURNAMENT: ${{ secrets.UPDATE_TOURNAMENT || '' }}
          PAT_FOR_CI: ${{ secrets.PAT_UPDATE_TOURNAMENT || secrets.UPDATE_TOURNAMENT || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "ENV presence check:"
          if [ -z "${GITHUB_TOKEN:-}" ]; then echo "  GITHUB_TOKEN: MISSING"; else echo "  GITHUB_TOKEN: PRESENT"; fi
          if [ -z "${PAT_FOR_CI:-}" ]; then echo "  PAT_FOR_CI: MISSING"; else echo "  PAT_FOR_CI: PRESENT"; fi
          if [ -z "${PAT_UPDATE_TOURNAMENT:-}" ]; then echo "  PAT_UPDATE_TOURNAMENT: MISSING"; else echo "  PAT_UPDATE_TOURNAMENT: PRESENT"; fi
          if [ -z "${UPDATE_TOURNAMENT:-}" ]; then echo "  UPDATE_TOURNAMENT: MISSING"; else echo "  UPDATE_TOURNAMENT: PRESENT"; fi
          echo "--- now calling check_and_dispatch_update_tournament.py ---"
          python3 scripts/check_and_dispatch_update_tournament.py

      - name: Decide whether to proceed (Europe/Paris window)
        id: check_time
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Paris"))
          print("Europe/Paris now:", now.isoformat())

          # Autorise le run pendant l'heure de 01h, même si le runner démarre un peu en retard.
          proceed = (now.hour == 1 and now.minute < 55)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"proceed={str(proceed).lower()}\n")
              fh.write(f"local_time_iso={now.isoformat()}\n")
          PY

      - name: Setup Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install minimal deps (if required)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          python -m pip install --upgrade pip

      - name: Prepare tmp branch from origin/main
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_UPDATE_TOURNAMENT || secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
        run: |
          set -euo pipefail

          AUTH="${GITHUB_TOKEN:-}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — aborting"
            exit 1
          fi

          TOUR_TYPE="${TOUR_TYPE:-daily}"
          TOUR_TYPE="$(printf '%s' "$TOUR_TYPE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          if [ -z "$TOUR_TYPE" ]; then
            TOUR_TYPE="daily"
          fi

          TMP_BRANCH="update/${TOUR_TYPE}/${GITHUB_RUN_ID}"
          echo "TOUR_TYPE=${TOUR_TYPE}" >> "$GITHUB_ENV"
          echo "TMP_BRANCH=${TMP_BRANCH}" >> "$GITHUB_ENV"
          echo "TMP_BRANCH=${TMP_BRANCH}"

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git checkout -B "${TMP_BRANCH}" origin/main
          else
            git checkout -B "${TMP_BRANCH}"
          fi

          echo "On branch: $(git branch --show-current)"
          git status --porcelain || true

      - name: Generate birthday_today.json and game assets
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail

          mkdir -p "${BUILD_DIR}/tools"
          mkdir -p docs/tools site_static/tools
          mkdir -p docs/games site_static/games

          python scripts/generate_birthday_box.py \
            --players-by-birth docs/tools/players_by_birth.json \
            --latest-atp docs/tools/latest_atp_ranking.json \
            --latest-wta docs/tools/latest_wta_ranking.json \
            --out "${BUILD_DIR}/tools/birthday_today.json"
          test -f "${BUILD_DIR}/tools/birthday_today.json"

          python scripts/generate_daily_guess.py \
            --atp player_data_atp.csv \
            --wta player_data_wta.csv \
            --geocodes-dir maps_html \
            --out-daily "${BUILD_DIR}/tools/daily_guess.json" \
            --out-players "${BUILD_DIR}/tools/players_catalog.json" \
            --out-geocodes "${BUILD_DIR}/tools/geocodes_combined.json"
          test -f "${BUILD_DIR}/tools/daily_guess.json"
          test -f "${BUILD_DIR}/tools/players_catalog.json"
          test -f "${BUILD_DIR}/tools/geocodes_combined.json"

          python scripts/generate_daily_guess_h2h.py \
            --atp player_data_atp.csv \
            --wta player_data_wta.csv \
            --out-dir "${BUILD_DIR}/tools" \
            --out-json "${BUILD_DIR}/tools/selected_players.json"
          test -f "${BUILD_DIR}/tools/selected_players.json"

          python scripts/generate_daily_city_guess.py \
            --json-base docs/data/tournaments/json_by_tournaments \
            --out "${BUILD_DIR}/tools/daily_city_guess.json" \
            --count 5
          test -f "${BUILD_DIR}/tools/daily_city_guess.json"

          python scripts/generate_daily_country_guess.py \
            --json-base docs/data/tournaments/json_by_tournaments \
            --out "${BUILD_DIR}/tools/daily_country_guess.json"
          test -f "${BUILD_DIR}/tools/daily_country_guess.json"

          python scripts/generate_daily_selected_winners.py \
            --wta docs/tools/wta_players_tournaments_win.json \
            --atp docs/tools/atp_players_tournaments_win.json \
            --out "${BUILD_DIR}/tools/daily_selected_winners.json"
          test -f "${BUILD_DIR}/tools/daily_selected_winners.json"

          python scripts/generate_pre_json_grid.py
          python scripts/generate_grid.py

          echo ">>> Generated in BUILD_DIR/tools:"
          ls -la "${BUILD_DIR}/tools" || true
          echo ">>> Generated/updated in docs/games:"
          ls -la docs/games || true

      - name: Copy generated files to repo locations
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail

          mkdir -p docs/tools site_static/tools
          mkdir -p docs/games site_static/games

          copy_tool() {
            local name="$1"
            local src="${BUILD_DIR}/tools/${name}.json"
            test -f "$src"
            cp -v "$src" "docs/tools/${name}.json"
            cp -v "$src" "site_static/tools/${name}.json"
          }

          copy_game_if_exists() {
            local name="$1"
            local src="docs/games/${name}.json"
            if [ -f "$src" ]; then
              cp -v "$src" "site_static/games/${name}.json"
            else
              echo "[WARN] Missing game file: $src"
            fi
          }

          copy_tool birthday_today
          copy_tool daily_guess
          copy_tool players_catalog
          copy_tool geocodes_combined
          copy_tool selected_players
          copy_tool daily_city_guess
          copy_tool daily_country_guess
          copy_tool daily_selected_winners

          copy_game_if_exists aggregate_ATP_reduced
          copy_game_if_exists aggregate_WTA_reduced
          copy_game_if_exists fill_the_grid_ATP
          copy_game_if_exists fill_the_grid_WTA
          copy_game_if_exists grid_history

          echo ">>> docs/tools:"
          ls -la docs/tools || true
          echo ">>> site_static/tools:"
          ls -la site_static/tools || true
          echo ">>> docs/games:"
          ls -la docs/games || true
          echo ">>> site_static/games:"
          ls -la site_static/games || true

      - name: Commit new generated JSON (whitelist safe commit)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          stage_if_exists() {
            local path="$1"
            if [ -f "$path" ]; then
              git add -f "$path"
            else
              echo "[WARN] Missing file (skip): $path"
            fi
          }

          # Tools
          stage_if_exists docs/tools/birthday_today.json
          stage_if_exists docs/tools/daily_guess.json
          stage_if_exists docs/tools/players_catalog.json
          stage_if_exists docs/tools/geocodes_combined.json
          stage_if_exists docs/tools/selected_players.json
          stage_if_exists docs/tools/daily_city_guess.json
          stage_if_exists docs/tools/daily_country_guess.json
          stage_if_exists docs/tools/daily_selected_winners.json

          stage_if_exists site_static/tools/birthday_today.json
          stage_if_exists site_static/tools/daily_guess.json
          stage_if_exists site_static/tools/players_catalog.json
          stage_if_exists site_static/tools/geocodes_combined.json
          stage_if_exists site_static/tools/selected_players.json
          stage_if_exists site_static/tools/daily_city_guess.json
          stage_if_exists site_static/tools/daily_country_guess.json
          stage_if_exists site_static/tools/daily_selected_winners.json

          # Games
          stage_if_exists docs/games/aggregate_ATP_reduced.json
          stage_if_exists docs/games/aggregate_WTA_reduced.json
          stage_if_exists docs/games/fill_the_grid_ATP.json
          stage_if_exists docs/games/fill_the_grid_WTA.json
          stage_if_exists docs/games/grid_history.json

          stage_if_exists site_static/games/aggregate_ATP_reduced.json
          stage_if_exists site_static/games/aggregate_WTA_reduced.json
          stage_if_exists site_static/games/fill_the_grid_ATP.json
          stage_if_exists site_static/games/fill_the_grid_WTA.json
          stage_if_exists site_static/games/grid_history.json

          if git diff --cached --name-only | grep -Eiq '(^|/)index\.html$'; then
            echo "ERROR: index.html would be staged — aborting to avoid overwrite."
            git diff --cached --name-only || true
            exit 1
          fi

          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "Files staged to commit:"
            git diff --cached --name-only || true
            git commit -m "ci(daily): update generated tools and games"
          else
            echo "No generated changes to commit"
          fi

      - name: Clean build artefacts to avoid rebase conflicts
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          if [ -d "${BUILD_DIR}/tools" ]; then
            rm -rf "${BUILD_DIR}/tools"
            echo "Removed ${BUILD_DIR}/tools to avoid rebase conflicts"
          fi
          git clean -fd -n || true
          echo "Workspace cleaned (dry-run shown above)."

      - name: Push changes (tmp branch -> main)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          PAT: ${{ secrets.PAT_UPDATE_TOURNAMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TOUR_TYPE: ${{ github.event.inputs.tour_type }}
        run: |
          set -euo pipefail

          AUTH="${PAT:-${GITHUB_TOKEN:-}}"
          if [ -z "$AUTH" ]; then
            echo "No auth token available — skipping push"
            exit 0
          fi

          TOUR_TYPE="${TOUR_TYPE:-daily}"
          TOUR_TYPE="$(printf '%s' "$TOUR_TYPE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          if [ -z "$TOUR_TYPE" ]; then
            TOUR_TYPE="daily"
          fi

          TMP_BRANCH="${TMP_BRANCH:-update/${TOUR_TYPE}/${GITHUB_RUN_ID}}"
          echo "TMP_BRANCH=${TMP_BRANCH}"

          git remote set-url origin "https://x-access-token:${AUTH}@github.com/${{ github.repository }}" || true
          git fetch origin main --quiet || true

          # Push the tmp branch that already contains the commit(s)
          git push --set-upstream origin "${TMP_BRANCH}" --force-with-lease || git push --set-upstream origin "${TMP_BRANCH}"

          MAX_RETRIES=4
          attempt=0
          merged_success=false

          while [ $attempt -lt $MAX_RETRIES ]; do
            attempt=$((attempt + 1))
            echo "Merge attempt ${attempt}/${MAX_RETRIES}: update local main and merge ${TMP_BRANCH}..."

            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
            else
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                git checkout -B main origin/main
              else
                git checkout -B main
              fi
            fi

            git fetch origin main --quiet || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              git merge --ff-only origin/main || git merge --no-edit origin/main || true
            fi

            if git merge --no-edit --no-ff "${TMP_BRANCH}"; then
              echo "Merge of ${TMP_BRANCH} into main succeeded locally."
            else
              echo "Merge reported issues; attempting ours strategy."
              git merge --strategy-option=ours --no-edit "${TMP_BRANCH}" || true
            fi

            echo "Attempting to push main to origin (attempt ${attempt})..."
            if git push origin HEAD:main; then
              echo "Push of main successful."
              merged_success=true
              break
            fi

            echo "Push failed on attempt ${attempt}. Will retry after refetch."
            git fetch origin "${TMP_BRANCH}" --quiet || true
            sleep 1
          done

          if [ "$merged_success" = "false" ]; then
            echo "Failed to merge & push main after ${MAX_RETRIES} attempts."
            echo "Work has been preserved on branch: ${TMP_BRANCH} (pushed)."
          fi

          echo "Done. Remote refs:"
          git ls-remote --heads origin main "${TMP_BRANCH}" || true

      - name: Trigger Netlify deploy via build hook
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check_time.outputs.proceed == 'true' }}
        env:
          NETLIFY_BUILD_HOOK_DAILY: ${{ secrets.NETLIFY_BUILD_HOOK_DAILY }}
        run: |
          set -e
          if [ -z "$NETLIFY_BUILD_HOOK_DAILY" ]; then
            echo "No NETLIFY_BUILD_HOOK_DAILY — skipping deploy trigger"
            exit 0
          fi
          curl -s -X POST "$NETLIFY_BUILD_HOOK_DAILY" -o /tmp/netlify_hook_resp.txt -w "\nHTTP_STATUS:%{http_code}\n"
          cat /tmp/netlify_hook_resp.txt || true